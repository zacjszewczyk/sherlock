name: 'T1661: Application Versioning'
id: a3347389-a1f1-4292-8cc3-3ca22756244f
description: Investigate whether an adversary has abused the mobile application update channel (MITRE
  ATT&CK T1661, Application Versioning) to weaponize a previously benign Android or iOS application. Adversaries
  build a trusted userbase with a clean app published to the Google Play Store or Apple App Store, then
  push an update that introduces malicious code, or they compromise a developer account to inherit an
  existing userbase. This playbook treats every application update as a distribution-stage trust boundary
  and helps an analyst hunt for the observable consequences across two tactics. For Initial Access it
  correlates MDM-detected update events with post-update network egress (connections to threat-intel or
  newly registered domains, novel JA3/JA3S TLS fingerprints, high-entropy/DGA domains, connection-failure
  bursts, and outbound-volume anomalies), with permission drift (high-risk permission additions, low Jaccard
  similarity to the prior version, category-rare permissions, ML permission classification), and with
  static code divergence (newly added dynamic code-loading and reflection APIs, version-to-version code/resource
  similarity drops, and bytecode-image classification of the updated binary). For Defense Evasion it examines
  code-signing certificate continuity (out-of-lineage signer thumbprints, certificate age/rarity scoring,
  certificate-relationship graphing) and post-update C2-like network behavior (protocol misuse, beaconing,
  DGA, and autoencoder-modeled session anomalies). A positive result indicates a benign-to-malicious update
  consistent with cases such as iRecorder/AhRat (Android) and XcodeGhost (iOS).
type: technique
related:
- tactic_id: TA0027
  tactic_name: Initial Access
- tactic_id: TA0030
  tactic_name: Defense Evasion
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: After an MDM-recorded application update, did the updated mobile app initiate any network
    connection within 24 hours to a destination IP or FQDN that appears on a threat-intelligence feed
    or whose WHOIS domain-registration age is less than 90 days?
  context: Supports Initial Access (TA0027). The canonical T1661 case weaponizes a benign app via an update
    that adds new C2/exfil destinations (iRecorder/AhRat). Treat each update as a distribution-stage trust
    boundary and join MDM update events to Zeek conn.log/dns.log on device and time, then evaluate every
    destination reached in the 24-hour post-update window against threat intel and WHOIS domain age. A
    hit on either condition is the deterministic floor for benign-to-malicious updates; a clean result
    lowers (but does not eliminate) suspicion, so pair it with the statistical and ML checks below.
  answer_sources:
  - MDM Application Update Log
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - External WHOIS Data Feed
  - External Threat Intelligence Feed
  - 'NAI: Network egress points (e.g., Corporate Wi-Fi, VPN Concentrators), DNS resolvers, and the SIEM
    platform where MDM/EDR and Zeek logs are aggregated.'
  range: Last 90 days (correlate each connection to within 24 hours of its app-update event)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'join MDM_update_events with zeek_conn on device_id

      where conn.ts between update.ts and update.ts + 24h

      lookup dest_fqdn/dest_ip in threat_intel_feed -> hit_ti

      lookup whois(dest_domain).created_date -> domain_age_days

      alert if hit_ti == true OR domain_age_days < 90

      annotate alert with app_package, prior_version, new_version, dest'
- question: Did the updated app establish TLS sessions with a JA3/JA3S fingerprint that is new or rare
    (below the 1st enterprise prevalence percentile) for that app, or resolve domains with passive-DNS
    features indicating high entropy and short/low TTL?
  context: Supports Initial Access (TA0027). Malicious update payloads frequently introduce new TLS client
    stacks and freshly minted C2 domains. Maintain per-app baselines of JA3/JA3S hashes from Zeek ssl.log
    and alert on hashes whose enterprise prevalence is below the 1st percentile. Score post-update domains
    with EXPOSURE-style passive-DNS features (low/short TTL, few distinct IPs/countries, FQDN character
    n-gram and numeric-fraction entropy above the 99th percentile of the app's own 30-day baseline). New
    fingerprints plus high-entropy domains together strongly suggest attacker-controlled infrastructure
    delivered by the update.
  answer_sources:
  - MDM Application Update Log
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - External WHOIS Data Feed
  - External Threat Intelligence Feed
  - 'NAI: Network egress points (e.g., Corporate Wi-Fi, VPN Concentrators), DNS resolvers, and the SIEM
    platform where MDM/EDR and Zeek logs are aggregated.'
  range: Last 90 days (baseline per-app JA3/JA3S and DNS features over a trailing 30-day window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = per_app_prevalence(ssl.ja3, ssl.ja3s) over last 30d\nfor post_update ssl session:\n\
      \  if prevalence(ja3|ja3s) < p1 -> flag_new_fingerprint\ndomain_score = f(ttl_low, ttl_short, distinct_ip_count,\
      \ distinct_country,\n                 ngram_entropy, numeric_fraction)\nalert if flag_new_fingerprint\
      \ OR domain_entropy > p99(app_baseline)"
- question: In the hour(s) following an app update, did the app produce a burst of connection failures
    (NXDOMAIN responses, TLS handshake failures, or blocked/refused connections) exceeding the 99th percentile
    of its pre-update baseline?
  context: 'Supports Initial Access (TA0027). A failure-mode signal: count NXDOMAIN responses, TLS handshake
    failures, and blocked/refused connections per app in 1-hour windows after an update and alert when
    any rate exceeds the 99th percentile of the app''s pre-update baseline. Bursts of NXDOMAIN are a classic
    indicator of DGA-based C2 resolution introduced by the update (EXPOSURE) - the malware cycles through
    many algorithmically generated names before reaching a live controller. A spike here, especially alongside
    the network and code signals, indicates the update added automated C2 rendezvous logic.'
  answer_sources:
  - MDM Application Update Log
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - External WHOIS Data Feed
  - External Threat Intelligence Feed
  - 'NAI: Network egress points (e.g., Corporate Wi-Fi, VPN Concentrators), DNS resolvers, and the SIEM
    platform where MDM/EDR and Zeek logs are aggregated.'
  range: Last 90 days (1-hour post-update windows compared to pre-update baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each app, per 1h window after update.ts:\n  nx = count(dns.rcode == NXDOMAIN)\n  tlsf\
      \ = count(ssl handshake_failure)\n  blk = count(conn refused/blocked)\nalert if nx > p99(pre_update\
      \ nx)\n      OR tlsf > p99(pre_update tlsf)\n      OR blk > p99(pre_update blk)"
- question: Does the app's post-update outbound data volume exceed the forecasted prediction interval
    of a time-series model trained on its pre-update behavior, indicating sustained or periodic exfiltration?
  context: Supports Initial Access (TA0027). Train a Prophet or ARIMA model on 15-minute outbound volume
    (sum of orig_bytes) per app and alert when post-update intervals exceed the 95% prediction interval.
    Sustained or periodic post-update volume increases match observed mass file/microphone exfiltration
    in the iRecorder/AhRat case. In managed fleets, per-app VPN/secure-web-gateway egress provides the
    observation point (NIST SP 800-124r2). A breach of the prediction interval that persists or recurs
    is strong evidence the update added data-collection-and-exfiltration capability.
  answer_sources:
  - MDM Application Update Log
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - External WHOIS Data Feed
  - External Threat Intelligence Feed
  - 'NAI: Network egress points (e.g., Corporate Wi-Fi, VPN Concentrators), DNS resolvers, and the SIEM
    platform where MDM/EDR and Zeek logs are aggregated.'
  range: Last 90 days (train on >=30 days pre-update 15-minute volume; score post-update intervals)
  queries:
  - technology: ML/pseudocode
    query: 'series = resample(sum(conn.orig_bytes) by app, 15min)

      model = Prophet/ARIMA.fit(pre_update series)

      yhat, lo, hi = model.predict(post_update intervals, interval=0.95)

      alert if observed > hi (sustained or periodic)

      report magnitude and periodicity of exceedance'
- question: Did the application update add any permission on the curated high-risk list (e.g., BIND_DEVICE_ADMIN,
    BIND_ACCESSIBILITY_SERVICE, REQUEST_INSTALL_PACKAGES, QUERY_ALL_PACKAGES, or RECORD_AUDIO+INTERNET
    combinations) that the prior benign version did not hold?
  context: Supports Initial Access (TA0027). On app updates, compare the new permission set to a curated
    high-risk list and alert at high severity on any addition. These permissions map to the dangerous-permission/API
    static feature space used by Drebin and grant capabilities (device admin, accessibility hijack, silent
    install, package enumeration, audio capture plus network egress) that adversaries need post-weaponization.
    This is the deterministic floor for permission-based detection; any high-risk addition warrants immediate
    review of the update.
  answer_sources:
  - MDM Application Inventory Log (pre/post update)
  - Curated High-Risk Permission List
  - Pre-computed App Store Category Permission Baselines
  - 'NAI: MDM/UEM platform and the SIEM platform where application inventory and compliance logs are stored.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "added = perms(new_version) - perms(prior_version)\nhigh_risk = {BIND_DEVICE_ADMIN, BIND_ACCESSIBILITY_SERVICE,\n\
      \  REQUEST_INSTALL_PACKAGES, QUERY_ALL_PACKAGES}\nalert HIGH if (added intersect high_risk) != {}\n\
      alert HIGH if {RECORD_AUDIO, INTERNET} subset of added"
- question: Does the updated app's permission set show a Jaccard similarity below 0.8 versus the prior
    version, or include a new permission with under 2% prevalence for its declared App Store category?
  context: 'Supports Initial Access (TA0027). Compute Jaccard similarity of pre/post permission sets and
    alert when below 0.8; flag any new permission with prevalence under 2% for its app-store category.
    Large permission drift or category-rare permissions suggest the update changed the app''s purpose.
    Important caveat: a permission-consistent update can still be malicious - the iRecorder/AhRat case
    kept a plausible RECORD_AUDIO grant - so a negative result here must be paired with the code/behavior
    diffs rather than treated as exoneration.'
  answer_sources:
  - MDM Application Inventory Log (pre/post update)
  - Curated High-Risk Permission List
  - Pre-computed App Store Category Permission Baselines
  - 'NAI: MDM/UEM platform and the SIEM platform where application inventory and compliance logs are stored.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "j = |perms_new INTERSECT perms_old| / |perms_new UNION perms_old|\nalert if j < 0.8\nfor p\
      \ in (perms_new - perms_old):\n  if category_prevalence(p, app.category) < 0.02 -> alert rare_permission"
- question: When the updated app's permissions are classified by a trained model (Random Forest or linear
    SVM), is the new version labeled malicious where the prior version was benign, and which permissions/APIs
    drove that decision?
  context: Supports Initial Access (TA0027). Represent permissions as a binary vector and train a Random
    Forest or linear SVM (Drebin) on benign vs malicious permission/API sets; alert when a new version
    is classified malicious after a benign prior version, and surface the top-3 contributing features
    via SHAP/LIME for analyst triage. Because the attacker controls the update and can adversarially shape
    features (Android HIV), keep the deterministic high-risk rule as the floor and time-order/retrain
    the model to counter concept drift (TESSERACT). A benign->malicious flip is a high-value lead even
    when individual permissions look ordinary.
  answer_sources:
  - MDM Application Inventory Log (pre/post update)
  - Curated High-Risk Permission List
  - Pre-computed App Store Category Permission Baselines
  - 'NAI: MDM/UEM platform and the SIEM platform where application inventory and compliance logs are stored.'
  range: Last 90 days (retrain on time-ordered data; monitor drift)
  queries:
  - technology: ML/pseudocode
    query: 'x = binary_vector(permissions + api_calls)

      model = RandomForest/linearSVM.fit(benign_vs_malicious)

      label_new = model.predict(x_new); label_old = model.predict(x_old)

      alert if label_old == benign AND label_new == malicious

      explain via SHAP/LIME -> top3 features'
- question: Does the update newly invoke dynamic code-loading or reflection APIs (DexClassLoader/PathClassLoader,
    System.load/loadLibrary, Runtime.exec) that reference external storage, downloaded files, or world-writable
    paths?
  context: Supports Initial Access (TA0027). Diff the suspicious-API set between versions and alert when
    an update newly calls dynamic code-loading or reflection APIs against external/world-writable paths
    - the staging mechanism used to fetch the injected payload in iRecorder/AhRat. These are core suspicious-API
    signals in Drebin. Newly added dynamic loading against attacker-controllable storage is a strong static
    indicator that the update is designed to pull and execute additional code after passing store review.
  answer_sources:
  - Application Vetting Static Analysis (decompiled APK/DEX)
  - MDM Application Binary/Package Repository
  - Historical Per-App Version Similarity Baselines
  - 'NAI: Application vetting/MTD pipeline (per NIST SP 800-163) and the SIEM platform where per-version
    static-analysis results are stored.'
  range: Last 90 days (per app-update event)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "api_new = suspicious_apis(new_version) - suspicious_apis(prior_version)\nloaders = {DexClassLoader,\
      \ PathClassLoader, System.load,\n  System.loadLibrary, Runtime.exec}\nalert if (api_new intersect\
      \ loaders) reference\n  external_storage|downloaded_file|world_writable_path"
- question: Does pairwise method/resource similarity between consecutive app versions drop below the per-app
    normal-release band, or do API-call transitions (modeled as a Markov chain) include rare/new transitions
    such as sensor->network or reflection->exfil?
  context: Supports Initial Access (TA0027). Compute pairwise method/resource fuzzy-hash similarity between
    version N and N+1 (repackaging research) and alert when similarity drops below the per-app normal-release
    band derived from prior legitimate releases. Additionally model the prior version's package/family
    API-call transitions as a Markov chain (MaMaDroid) and alert on rare/new transitions like sensor->network
    or reflection->exfil. A sharp similarity drop or anomalous behavioral transitions indicate the update
    is not an organic evolution of the codebase but an injection of new, possibly malicious, functionality.
  answer_sources:
  - Application Vetting Static Analysis (decompiled APK/DEX)
  - MDM Application Binary/Package Repository
  - Historical Per-App Version Similarity Baselines
  - 'NAI: Application vetting/MTD pipeline (per NIST SP 800-163) and the SIEM platform where per-version
    static-analysis results are stored.'
  range: Last 90 days (band derived from prior legitimate releases)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'sim = fuzzy_hash_similarity(methods+resources, vN, vN1)

      band = normal_release_band(app, historical releases)

      alert if sim < band.low

      mc = markov_chain(api_call_transitions, prior_version)

      alert if new_version has rare/new transition (e.g. sensor->network)'
- question: When the updated binary's classes.dex is rendered as a grayscale byte-image and scored with
    a 1D-CNN (and static features re-scored with a linear SVM), is the previously benign app's update
    classified malicious, and which features contributed most?
  context: Supports Initial Access (TA0027). Convert classes.dex to a grayscale byte-image and score it
    with a 1D-CNN (DexRay) to catch packed/injected payloads, and re-score static features with a linear-SVM
    detector (Drebin); alert when a previously benign app's update is classified malicious and surface
    the top-3 contributing features for triage. On iOS, where APK-style internals are unavailable, rely
    on the network-side analytics (XcodeGhost). Evaluate time-ordered and monitor drift (TESSERACT). A
    benign->malicious classification flip on the binary itself is among the strongest static indicators
    of a weaponized update.
  answer_sources:
  - Application Vetting Static Analysis (decompiled APK/DEX)
  - MDM Application Binary/Package Repository
  - Historical Per-App Version Similarity Baselines
  - 'NAI: Application vetting/MTD pipeline (per NIST SP 800-163) and the SIEM platform where per-version
    static-analysis results are stored.'
  range: Last 90 days (time-ordered evaluation; monitor drift)
  queries:
  - technology: ML/pseudocode
    query: 'img = grayscale_byteimage(classes.dex)

      cnn_label = DexRay_1dcnn.predict(img)

      svm_label = drebin_svm.predict(static_features)

      alert if prior_version benign AND (cnn_label==malicious OR svm_label==malicious)

      explain -> top3 features; iOS: fall back to network analytics'
- question: Is the application update signed with a code-signing certificate whose digest is absent from
    the allowlist of historical signer digests for that package ID, or that matches malicious-certificate
    threat intelligence?
  context: Supports Defense Evasion (TA0030). On app updates, compare the code-signing certificate digest
    to the allowlist of historical signer digests for that package ID; alert on any mismatch and on matches
    to malicious-certificate threat intel. Android enforces signer continuity - a legitimate update must
    use the same key or a declared rotation lineage (APK Signature Scheme v2) - so an out-of-lineage signer
    means a developer-key compromise or impostor publisher. This is the deterministic floor for the certificate
    trust boundary and a direct indicator of the developer-account-compromise variant of T1661.
  answer_sources:
  - MDM Application Inventory Log (with certificate details)
  - Historical Application Certificate Thumbprint Database
  - External Certificate Transparency Log Data
  - External Threat Intelligence Feed
  - 'NAI: MDM/UEM platform, application manifest repositories, and the SIEM platform where threat intelligence
    and certificate data are correlated.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'allowlist = historical_signer_digests[package_id] (incl. declared lineage)

      alert if new_cert.digest not in allowlist

      alert if new_cert.digest in malicious_cert_threat_intel

      annotate with package_id, prior_signer, new_signer'
- question: Does a new signing certificate score above the risk threshold based on its age (valid_from
    < 90 days), issuer rarity across the fleet, and subject-name divergence from the historical subject?
  context: 'Supports Defense Evasion (TA0030). Compute a risk score for a new certificate: +50 if valid_from
    < 90 days, +30 if issuer prevalence is in the bottom 5th percentile across the fleet, +20 if the subject-name
    Levenshtein distance from the historical subject exceeds 5; alert when the score exceeds 75. Cross-check
    appearance/age against Certificate Transparency to validate first-seen timing. Freshly issued, rare-issuer,
    or subtly renamed signing certificates are hallmarks of impostor publishers and compromised developer
    keys used to evade signer-continuity defenses.'
  answer_sources:
  - MDM Application Inventory Log (with certificate details)
  - Historical Application Certificate Thumbprint Database
  - External Certificate Transparency Log Data
  - External Threat Intelligence Feed
  - 'NAI: MDM/UEM platform, application manifest repositories, and the SIEM platform where threat intelligence
    and certificate data are correlated.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'score = 0

      if cert.valid_from age_days < 90: score += 50

      if issuer_prevalence(cert.issuer) < p5(fleet): score += 30

      if levenshtein(cert.subject, historical_subject) > 5: score += 20

      alert if score > 75; cross-check first_seen vs Certificate Transparency'
- question: In a graph of apps, signing certificates, and developer accounts, does a new certificate link
    a trusted app to a community detected as malicious or high-risk?
  context: Supports Defense Evasion (TA0030). Build a graph of apps, signing certificates, and developer
    accounts and run community detection (Louvain) or a GNN classifier; alert when a new certificate links
    a trusted app to a community flagged as malicious or high-risk. This surfaces shared-key abuse and
    developer-account-compromise clusters that simple per-app checks miss. Keep the deterministic signer-mismatch
    rule as the floor since attackers controlling the update can shape graph features (Android HIV). A
    trusted app suddenly joining a malicious community via a new certificate is a strong evasion indicator.
  answer_sources:
  - MDM Application Inventory Log (with certificate details)
  - Historical Application Certificate Thumbprint Database
  - External Certificate Transparency Log Data
  - External Threat Intelligence Feed
  - 'NAI: MDM/UEM platform, application manifest repositories, and the SIEM platform where threat intelligence
    and certificate data are correlated.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'G = graph(nodes=apps+certs+developers, edges=signs/owns)

      communities = louvain(G)  # or GNN classifier

      alert if new_cert connects trusted_app to community labeled malicious/high-risk

      fallback floor = deterministic signer mismatch rule'
- question: After the update, does the app's traffic exhibit C2-like protocol misuse - non-TLS protocols
    on destination port 443, or ssl.log server_name / dns.log queries matching C2 regex patterns or threat-intel
    indicators?
  context: Supports Defense Evasion (TA0030). Monitor updated-app traffic for non-TLS protocols on destination
    port 443 and match Zeek ssl.log server_name and dns.log query against C2 regex patterns and threat-intel
    indicators. Post-update beaconing to attacker C2 is the observable behavior in both the iRecorder/AhRat
    (Android) and XcodeGhost (iOS) cases, where infected apps beaconed device data despite passing store
    review. Protocol-on-port mismatches and known-bad indicators give a clear deterministic signal that
    the update evaded vetting and is communicating with controller infrastructure.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - MDM/EDR Network Flow Log
  - 'NAI: Network egress points (e.g., Corporate Wi-Fi, VPN Concentrators), CASB, and the SIEM platform
    aggregating network flow data (Zeek, EDR/MDM) for behavioral analysis.'
  range: Last 90 days (post-update windows)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for post_update conn:\n  if conn.dest_port == 443 AND conn.service != ssl/tls -> alert protocol_misuse\n\
      \  if regex_match(ssl.server_name, C2_patterns) -> alert\n  if dns.query in threat_intel OR regex_match(dns.query,\
      \ C2_patterns) -> alert"
- question: Does post-update traffic show beaconing (inter-arrival-time standard deviation below the 5th
    percentile for that app) or DGA behavior (domain entropy above the 98th percentile and NXDOMAIN bursts)?
  context: Supports Defense Evasion (TA0030). Group connections by destination IP/port and compute inter-arrival-time
    standard deviation in 1-hour windows; alert when below the 5th percentile for that app - the iRecorder/AhRat
    payload checked in on a fixed ~15-minute cadence, producing low-jitter periodicity. Compute domain
    entropy excluding the TLD and alert above the 98th percentile of the app baseline, and flag NXDOMAIN
    bursts as the DGA failure-mode signal (EXPOSURE). Low-jitter beaconing and high-entropy/NXDOMAIN patterns
    reveal automated C2 rendezvous introduced by the malicious update.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - MDM/EDR Network Flow Log
  - 'NAI: Network egress points (e.g., Corporate Wi-Fi, VPN Concentrators), CASB, and the SIEM platform
    aggregating network flow data (Zeek, EDR/MDM) for behavioral analysis.'
  range: Last 90 days (1-hour windows; per-app baselines over trailing 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "group conn by dest_ip, dest_port per 1h:\n  iat_std = stddev(inter_arrival_times)\n  alert\
      \ if iat_std < p5(app_baseline)  # beaconing\ndomain_entropy = entropy(query without TLD)\nalert\
      \ if domain_entropy > p98(app_baseline)\nalert on NXDOMAIN burst  # DGA failure-mode"
- question: When post-update Zeek session features are scored by an autoencoder trained on the app's pre-update
    traffic, does the reconstruction error exceed the 99th percentile of training error, and which features
    drive the anomaly?
  context: Supports Defense Evasion (TA0030). Train an autoencoder on the app's pre-update Zeek session
    features (duration, orig_bytes, resp_bytes, protocol, port, inter-arrival time) and alert when post-update
    reconstruction error exceeds the 99th percentile of training error; report the top-3 reconstruction-error
    features for triage. For iOS, where binary internals are opaque, these network-only models are the
    primary detector (XcodeGhost). Time-order training and monitor drift (TESSERACT). A high reconstruction
    error means the post-update behavior no longer resembles the benign baseline - a powerful evasion-resistant
    signal that complements the deterministic and statistical checks.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - MDM/EDR Network Flow Log
  - 'NAI: Network egress points (e.g., Corporate Wi-Fi, VPN Concentrators), CASB, and the SIEM platform
    aggregating network flow data (Zeek, EDR/MDM) for behavioral analysis.'
  range: Last 90 days (train on pre-update sessions; score post-update; monitor drift)
  queries:
  - technology: ML/pseudocode
    query: 'feat = [duration, orig_bytes, resp_bytes, proto, port, inter_arrival]

      ae = autoencoder.fit(pre_update feat)

      err = reconstruction_error(ae, post_update feat)

      alert if err > p99(training_error)

      report top3 error-contributing features; primary detector for iOS'
