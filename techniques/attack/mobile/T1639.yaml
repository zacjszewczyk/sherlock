name: 'T1639: Exfiltration Over Alternative Protocol'
id: 654f3c98-6bed-4e00-aae7-58ff44a07d01
description: 'Investigate whether an adversary has stolen data from a corporate mobile device (Android
  or iOS) by exfiltrating it over a network protocol or destination different from the established command-and-control
  channel. This playbook helps an analyst pursue three overlapping evidence trails drawn from network
  telemetry collected at corporate Wi-Fi, guest networks, VPN concentrators, cloud proxies, and MDM/CASB
  platforms: (1) outbound use of alternative/non-standard protocols (FTP, SMTP, SMB, IRC, or any service
  absent from a device''s 30-day baseline) and abnormally large single-connection uploads, including encrypted/tunneled
  flows evaluated on flow shape and TLS (JA3) fingerprint rather than payload; (2) DNS-based data tunneling,
  evidenced by elevated query rates, high query-name entropy, maximal-length labels, abnormal TXT/NULL
  ratios, rare registered domains, and excess information content per domain; and (3) HTTP/S exfiltration
  via oversized POST uploads, periodic low-variance beaconing to non-corporate or newly registered domains,
  and domain-fronting (TLS SNI not matching inner HTTP Host) when cloud web services are abused as an
  alternate channel. Each trail provides symbolic-logic, statistical, and machine-learning detection approaches
  so an analyst can confirm whether sensitive data left the device over an alternate protocol or destination.'
type: technique
related:
- tactic_id: TA0036
  tactic_name: Exfiltration
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Do any outbound connections from mobile-device IP ranges use file-transfer or messaging protocols
    not normal for a handset (FTP, SMTP, SMB, IRC) or reach a destination IP, port, or domain that matches
    threat intelligence for known command-and-control or exfiltration services?
  context: 'For the Exfiltration tactic, the cleanest deterministic floor is matching mobile egress against
    threat intel and treating any FTP/SMTP/SMB/IRC traffic from a handset as suspicious by default: mobile
    apps do not normally speak these protocols, so their presence in conn.log from a device subnet strongly
    suggests an adversary using an alternate protocol to move data off-device. Inspect Zeek conn.log connections
    originating from mobile IP ranges, alert when the destination IP/port/domain matches known-bad indicators,
    and independently alert on any egress using these legacy protocols. A positive match is high-confidence
    evidence of exfiltration over an alternative protocol; a negative result does not clear the device
    because the channel may be tunneled inside TLS and must be corroborated with the flow-shape and DNS
    trails. Source and references: [Exfiltration Over Alternative Protocol, MITRE T1639](https://attack.mitre.org/techniques/T1639/).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi network segments, guest networks, VPN concentrators, cloud proxies, and Mobile
    Device Management (MDM) platform logs.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM conn.log\nWHERE id.orig_h IN mobile_device_subnets\n  AND ( service IN ('ftp','smtp','smb','irc')\n\
      \        OR id.resp_p IN (21,25,445,194,6667)\n        OR id.resp_h IN threat_intel.c2_exfil\n \
      \       OR dns_resolved_domain IN threat_intel.c2_exfil )\nEMIT alert WITH id.orig_h, id.resp_h,\
      \ id.resp_p, service"
- question: When an outbound TLS connection from a mobile device carries a large upload, does it present
    a JA3/JA3S client fingerprint that is NOT on the fleet allow-list of corporate-managed apps and OS
    TLS stacks?
  context: 'Adversaries often tunnel exfiltration inside HTTPS so the payload is unreadable at the proxy;
    the TLS client fingerprint (JA3) still reveals which software opened the connection. For Exfiltration,
    build an allow-list of JA3/JA3S fingerprints produced by corporate-managed apps and the device OS,
    then alert when an outbound TLS flow carrying a large upload presents an unrecognized JA3 hash. An
    unknown fingerprint paired with a heavy upload indicates a non-managed client (custom tool, repackaged
    app, or malware library) tunneling data over HTTPS. A hit warrants device/user triage; benign-but-new
    app updates can also introduce new fingerprints, so confirm against the managed-app inventory. Source
    and references: [JA3 TLS/SSL Client Fingerprinting, Salesforce](https://github.com/salesforce/ja3).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi network segments, guest networks, VPN concentrators, cloud proxies, and Mobile
    Device Management (MDM) platform logs.'
  range: Last 90 days; baseline JA3 allow-list over 30 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM ssl.log JOIN conn.log ON uid\nWHERE id.orig_h IN mobile_device_subnets\n  AND orig_bytes\
      \ > large_upload_threshold\n  AND ja3 NOT IN fleet_allowlist.ja3\nEMIT alert WITH id.orig_h, server_name,\
      \ ja3, orig_bytes"
- question: Has any mobile device used a protocol (service/port tuple) absent from its own 30-day baseline,
    sent a single connection whose orig_bytes exceeds the fleet 99th percentile for that protocol, or
    shown an upload-heavy orig_bytes/resp_bytes ratio (>> 1) inconsistent with normal browsing?
  context: 'Exfiltration over an alternative protocol manifests statistically as new protocols and outsized,
    upload-heavy transfers. Maintain a 30-day per-device baseline of protocols used and alert when a device
    speaks a protocol it has never used. Compute the 99th percentile of orig_bytes per protocol across
    the fleet (derive the cut from your own data) and alert on any single connection that exceeds it.
    Profile the orig_bytes/resp_bytes ratio, because data theft is upload-dominant (ratio far greater
    than 1) whereas normal mobile browsing is download-dominant. Combined, a new protocol plus a top-percentile
    upload with an inverted byte ratio is a strong exfiltration signal; tune thresholds per dataset to
    control false positives from large legitimate syncs/backups. Source and references: [Characterization
    of Encrypted and VPN Traffic Using Time-Related Features, Draper-Gil et al.](https://www.scitepress.org/Papers/2016/57407/57407.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi network segments, guest networks, VPN concentrators, cloud proxies, and Mobile
    Device Management (MDM) platform logs.'
  range: Last 90 days; per-device baseline window 30 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: "FOR each device_ip:\n  baseline_protocols = set(service+'/'+id.resp_p over 30d)\n  ALERT IF\
      \ current.service_port NOT IN baseline_protocols\np99 = percentile(orig_bytes, 99) BY service ACROSS\
      \ fleet\nALERT IF conn.orig_bytes > p99[conn.service]\nALERT IF conn.orig_bytes / max(conn.resp_bytes,1)\
      \ >> 1"
- question: For each mobile device, do failed/rejected/reset connection attempts (Zeek conn_state S0/REJ/RSTO)
    to candidate egress destinations spike above 3 standard deviations over baseline, especially when
    followed by a successful long upload on an alternate port?
  context: 'Before exfiltrating, an adversary often probes for an open egress path, generating bursts
    of blocked connections as it tries protocols/ports until one succeeds. For Exfiltration, track per-device
    counts of S0 (no reply), REJ (rejected), and RSTO (reset) connection states toward egress destinations
    and alert when the blocked-attempt count exceeds 3 standard deviations above the device baseline.
    The strongest confirmation is a burst of blocked attempts immediately followed by a successful long-duration
    upload on an alternate port — the signature of a successful egress-path discovery and data transfer.
    A positive result indicates active probing; correlate with the subsequent successful flow to confirm
    data left the device. Source and references: [Exfiltration Over Alternative Protocol, MITRE T1639](https://attack.mitre.org/techniques/T1639/).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi network segments, guest networks, VPN concentrators, cloud proxies, and Mobile
    Device Management (MDM) platform logs.'
  range: Last 90 days; baseline window 30 days, correlate burst-then-upload within hours
  queries:
  - technology: Zeek/Stats pseudocode
    query: "FOR each device_ip:\n  fails = count(conn_state IN ('S0','REJ','RSTO')) per window\n  baseline\
      \ = mean,std(fails over 30d)\n  ALERT IF fails > baseline.mean + 3*baseline.std\n  CORRELATE blocked_burst\
      \ FOLLOWED_BY (long_upload on new_port) WITHIN window\n  EMIT alert WITH device_ip, dest, blocked_count,\
      \ followup_upload"
- question: Does an unsupervised anomaly model (Isolation Forest / one-class) trained on benign fleet
    traffic flag any mobile-device connection as an outlier, and what are the top-3 contributing features
    (e.g., orig_bytes percentile, rare destination port, byte ratio)?
  context: 'Single-dimension rules miss exfiltration that hides by keeping each feature near-normal while
    the combination is anomalous. For Exfiltration, build per-connection features (protocol, destination
    port, duration, orig_bytes, resp_bytes, byte ratio, inter-arrival statistics) and apply an Isolation
    Forest or one-class model trained on benign fleet traffic to surface outliers. Crucially, surface
    the top-3 contributing features in the alert text (e.g., ''orig_bytes 99.7th pct + rare port 8443
    + byte ratio 40:1'') so an analyst can triage quickly rather than chase an opaque score. Investigate
    flagged outliers with device and user context; retrain periodically as the fleet''s benign baseline
    drifts. A high-anomaly connection with exfiltration-shaped features corroborates the deterministic
    and statistical trails. Source and references: [Malware Detection for Internet of Things Using One-Class
    Classification](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi network segments, guest networks, VPN concentrators, cloud proxies, and Mobile
    Device Management (MDM) platform logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = extract(conn.log,ssl.log:\n  protocol,resp_p,duration,orig_bytes,resp_bytes,byte_ratio,interarrival_stats)\n\
      model = IsolationForest|OneClassSVM.fit(benign_fleet_traffic)\nWHEN model.is_outlier(conn): EMIT\
      \ alert WITH device_ip, top3_features(conn)\n# retrain periodically"
- question: Do any DNS queries from mobile devices match blocklists of malicious or dynamic-DNS providers
    commonly used for tunneling, or violate RFC 1035 structural limits (labels at the 63-byte maximum,
    names approaching 255 bytes, or encoded-payload subdomains)?
  context: 'DNS is an attractive covert exfiltration channel because it is rarely blocked outbound. For
    Exfiltration, scan Zeek dns.log queries from mobile devices and alert on two deterministic conditions:
    (1) the query matches a blocklist of known-malicious or dynamic-DNS providers frequently abused for
    tunneling, and (2) the query structure violates normal limits per RFC 1035 — labels at the 63-byte
    maximum, total names near the 255-byte ceiling, or long high-density subdomains that look like encoded
    payload. Legitimate resolutions rarely push these structural limits, so a hit is a strong, low-noise
    indicator of data being encoded into DNS names. Pivot from the query to the device and the resolved
    registered domain to scope the tunnel. Source and references: [Domain Names - Implementation and Specification,
    RFC 1035](https://www.rfc-editor.org/rfc/rfc1035.txt).'
  answer_sources:
  - Zeek dns.log
  - 'NAI: Internal DNS resolvers, network egress points, Cloud Access Security Broker (CASB) logs, and
    Mobile Device Management (MDM) platform logs.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM dns.log\nWHERE id.orig_h IN mobile_device_subnets\n  AND ( query_domain IN blocklist.tunneling_dyndns\n\
      \        OR max_label_len(query) >= 63\n        OR len(query) >= 200\n        OR high_density_subdomain(query)\
      \ )\nEMIT alert WITH id.orig_h, query, qtype"
- question: For each registered (effective second-level) domain queried by mobile devices, does the summed
    compressed information content of its query names over a window exceed a derived capacity bound?
  context: 'Surreptitious DNS communication can be bounded by the information content carried per registered
    domain, a method that catches tunnels with low analyst overhead and few false positives. For Exfiltration,
    for each effective second-level domain, sum the compressed information content of the query names
    observed over a window and alert when it exceeds a capacity bound derived from benign traffic. Confirmed
    tunnels carry disproportionate information per domain because every query smuggles encoded data, whereas
    benign lookups to a domain repeat a small set of low-entropy names. A domain over the bound is a strong
    candidate exfiltration channel; confirm by inspecting the query-name structure and the querying device.
    Source and references: [Practical Comprehensive Bounds on Surreptitious Communication over DNS, Born/Gustafson/Paxson](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_paxson.pdf).'
  answer_sources:
  - Zeek dns.log
  - 'NAI: Internal DNS resolvers, network egress points, Cloud Access Security Broker (CASB) logs, and
    Mobile Device Management (MDM) platform logs.'
  range: Last 90 days; evaluate over rolling windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each registered_domain (eTLD+1) over window:\n  info = sum(compressed_size(unique query_names))\n\
      \  bound = capacity_bound(registered_domain from benign baseline)\n  ALERT IF info > bound\n  EMIT\
      \ alert WITH registered_domain, info, bound, top_devices"
- question: For each mobile device, does daily DNS query volume, average query length, or average query-name
    entropy exceed 3 standard deviations above its 30-day baseline, is its TXT/NULL request ratio above
    the fleet 95th percentile, or is its NXDOMAIN rate elevated?
  context: 'DNS tunneling and DGA-style staging perturb several measurable DNS statistics at once. For
    Exfiltration, maintain a 30-day per-device baseline of daily query volume, average query length, and
    average Shannon entropy of query names, and alert when any metric exceeds 3 standard deviations above
    baseline (a Shannon entropy above ~4.5 on query names is itself a strong tunneling indicator). Compute
    each device''s TXT/NULL request ratio and flag devices above the fleet 95th percentile, because tunnels
    favor these record types for higher payload capacity. Separately profile the NXDOMAIN rate, since
    tunneling and DGA staging produce elevated failed resolutions distinct from benign traffic. Multiple
    simultaneous outliers strongly indicate an active DNS tunnel; derive all thresholds from per-device
    baselines. Source and references: [Real-Time Detection of DNS Exfiltration and Tunneling, Nadler et
    al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources:
  - Zeek dns.log
  - 'NAI: Internal DNS resolvers, network egress points, Cloud Access Security Broker (CASB) logs, and
    Mobile Device Management (MDM) platform logs.'
  range: Last 90 days; per-device baseline window 30 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: "FOR each device_ip:\n  baseline = profile(dns.log: daily_volume, avg_len, avg_entropy over\
      \ 30d)\n  ALERT IF daily_volume > baseline.vol_mean + 3*std\n       OR avg_len > baseline.len_mean\
      \ + 3*std\n       OR avg_entropy > baseline.ent_mean + 3*std OR avg_entropy > 4.5\n  txtnull_ratio\
      \ = count(qtype IN ('TXT','NULL'))/count(*)\n  ALERT IF txtnull_ratio > fleet_p95\n  ALERT IF nxdomain_rate\
      \ > baseline.nxdomain_mean + 3*std"
- question: When DNS queries from mobile resolvers are ranked by aggregate information content using a
    streaming heavy-hitter algorithm, which registered domains rise to the top — including slow/low-throughput
    tunnels that stay under per-query volume thresholds?
  context: 'Patient adversaries throttle DNS exfiltration to stay below per-query and per-day volume alarms,
    so volume-based rules miss them. For Exfiltration, run a streaming heavy-hitter algorithm that ranks
    registered domains by the aggregate information content of their query names from mobile resolvers
    over time; this accumulates the small amounts of data each slow query leaks and surfaces low-throughput
    tunnels that never trip a rate threshold. Tune the heavy-hitter cut to resolver scale so the top-ranked
    domains are a manageable triage list. A registered domain that persistently ranks high in information
    content despite modest query rates is a prime exfiltration candidate; corroborate with query-structure
    and entropy checks. Source and references: [Information-Based Heavy Hitters for Real-Time DNS Data
    Exfiltration Detection, Chhabra/Ozery et al.](https://www.ndss-symposium.org/wp-content/uploads/2024-388-paper.pdf).'
  answer_sources:
  - Zeek dns.log
  - 'NAI: Internal DNS resolvers, network egress points, Cloud Access Security Broker (CASB) logs, and
    Mobile Device Management (MDM) platform logs.'
  range: Last 90 days; streaming/continuous evaluation
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'stream = dns.log FROM mobile_resolvers

      heavy_hitters = StreamingTopK(key=registered_domain, weight=info_content(query_name))

      cut = tune_to_resolver_scale()

      EMIT alert WITH ranked_domains WHERE info_content > cut'
- question: Does a DNS-tunneling classifier (Random Forest plus character-level CNN/LSTM over query length,
    subdomain count, entropy, character/hex distribution, n-gram frequency, and RR type) assign a malicious
    probability above 0.85 to any mobile DNS query, and what top-3 features drive the score?
  context: 'Supervised models capture tunneling patterns that combine many weak signals no single statistic
    catches. For Exfiltration, train a Random Forest together with a character-level CNN/LSTM using features
    extracted from Zeek dns.log — query length, subdomain count, entropy, hex/character distribution,
    n-gram frequency, and resource record type — and apply it in real time, flagging queries whose malicious
    probability exceeds 0.85. Surface the top-3 features driving each score (e.g., ''entropy 4.9 + 4 subdomains
    + TXT'') for explainable triage. Keep the deterministic blocklist/structure rules and the statistical
    baselines running in parallel as the floor, and retrain to counter adversary evasion. A high-probability
    classification on a device''s DNS traffic corroborates an active tunnel used to exfiltrate data. Source
    and references: [Malicious DNS Tunneling Detection in Real-Traffic DNS Data, Lambion et al.](https://faculty.washington.edu/mdecock/papers/dlambion2020a.pdf).'
  answer_sources:
  - Zeek dns.log
  - 'NAI: Internal DNS resolvers, network egress points, Cloud Access Security Broker (CASB) logs, and
    Mobile Device Management (MDM) platform logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = extract(dns.log:\n  query_len,subdomain_count,entropy,char_hex_dist,ngram_freq,rr_type)\n\
      p = (RandomForest + charCNN_LSTM).predict_proba(features)\nWHEN p > 0.85: EMIT alert WITH device_ip,\
      \ query, top3_features(p)\n# run with deterministic+statistical floor; retrain periodically"
- question: Do any HTTP/S POST requests from mobile devices to domains matching threat intel for malicious
    or newly registered domains (NRDs) exceed 500KB of orig_bytes, after joining http.log host and ssl.log
    server_name to conn.log on UID?
  context: 'Web services are a common alternate exfiltration channel; large POST uploads to suspect domains
    are a direct signal. For Exfiltration, join Zeek http.log host and ssl.log server_name with conn.log
    on the connection UID to reconstruct full request context, match the destination against threat intel
    for malicious or newly registered domains, and alert when POST requests to matched domains exceed
    500KB orig_bytes. Newly registered domains are disproportionately used for short-lived exfiltration
    infrastructure, so an oversized POST to an NRD from a handset is high-confidence. A positive result
    means bulk data was pushed to suspect infrastructure; pivot to the files.log and device/user to determine
    what was sent. Source and references: [Exfiltration Over Alternative Protocol, MITRE T1639](https://attack.mitre.org/techniques/T1639/).'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Web proxies, internet gateways, VPN concentrators with SSL/TLS inspection capabilities, mobile
    application security gateways, and Cloud Access Security Broker (CASB) platforms.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM http.log h JOIN conn.log c ON h.uid=c.uid JOIN ssl.log s ON c.uid=s.uid\nWHERE c.id.orig_h\
      \ IN mobile_device_subnets AND h.method=='POST'\n  AND (h.host IN threat_intel.malicious OR domain_age(h.host)\
      \ < 30d OR s.server_name IN threat_intel.malicious)\n  AND c.orig_bytes > 500KB\nEMIT alert WITH\
      \ c.id.orig_h, h.host, c.orig_bytes"
- question: For inspected TLS from mobile devices, does the outer SNI/server_name name an allowed CDN
    front while the inner HTTP Host header names a different, rare backend, or do many distinct inner
    hosts share a single CDN front (domain fronting)?
  context: 'Domain fronting hides exfiltration behind trusted cloud/CDN front domains: the TLS SNI shows
    an allowed CDN while the encrypted inner HTTP Host routes to an attacker backend. For Exfiltration,
    on inspected TLS alert when the outer SNI/server_name names an allowed CDN front but the inner HTTP
    Host header names a different, rare backend, or when many distinct inner hosts share one CDN front.
    This SNI/Host mismatch is the canonical signal of exfiltration hidden behind cloud web services and
    is hard to produce benignly. A hit indicates a covert channel abusing a CDN; confirm the inner host''s
    reputation and the upload volume on the connection. Source and references: [Blocking-resistant Communication
    through Domain Fronting, Fifield et al.](https://petsymposium.org/2015/papers/03_Fifield.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Web proxies, internet gateways, VPN concentrators with SSL/TLS inspection capabilities, mobile
    application security gateways, and Cloud Access Security Broker (CASB) platforms.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM ssl.log s JOIN http.log h ON s.uid=h.uid\nWHERE s.id.orig_h IN mobile_device_subnets\n\
      \  AND s.server_name IN allowed_cdn_fronts\n  AND h.host != s.server_name AND rare(h.host)\nALERT\
      \ ALSO IF dcount(h.host) BY s.server_name > many_threshold\nEMIT alert WITH id.orig_h, s.server_name\
      \ AS sni, h.host AS inner_host"
- question: On ports 80/443, do any mobile-device connections exceed the fleet 99th percentile of orig_bytes,
    or does any device-destination pair show low inter-arrival variance (CV near 0, MAD low, >10 beacons/hour)
    indicating exfiltration beaconing?
  context: 'HTTP/S exfiltration shows up as oversized uploads and as steady automated beacons. For Exfiltration,
    on ports 80/443 compute the 99th percentile of orig_bytes across mobile devices (derive per dataset)
    and alert on connections exceeding it. For each device-destination pair compute the inter-arrival
    coefficient of variation (CV), median absolute deviation (MAD), and Bowley skewness, flagging low-variance
    high-frequency cadence — CV near 0 with more than 10 beacons per hour — as beaconing consistent with
    automated exfiltration or staging. Human-driven browsing is bursty and irregular, so a near-constant
    cadence to a single destination is anomalous. A large upload plus regular beaconing to a non-corporate
    destination is a strong exfiltration indicator. Source and references: [RITA - Real Intelligence Threat
    Analytics, Active Countermeasures](https://github.com/activecm/rita).'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Web proxies, internet gateways, VPN concentrators with SSL/TLS inspection capabilities, mobile
    application security gateways, and Cloud Access Security Broker (CASB) platforms.'
  range: Last 90 days; per-pair cadence over rolling windows
  queries:
  - technology: Zeek/Stats pseudocode
    query: "p99 = percentile(orig_bytes,99) ACROSS mobile WHERE id.resp_p IN (80,443)\nALERT IF conn.orig_bytes\
      \ > p99\nFOR each (device_ip,dest):\n  iat = inter_arrival_times(conn)\n  ALERT IF cv(iat) ~ 0 AND\
      \ beacons_per_hour > 10\n  REPORT mad(iat), bowley_skew(iat)"
- question: Does FFT-based periodicity analysis (with multi-stage filtering and whitelist suppression)
    over per-destination time series reveal jittered exfiltration heartbeats that defeat simple variance
    thresholds, and do any destinations show abnormal HTTP 4xx/5xx error-state ratios?
  context: 'Sophisticated adversaries add jitter to beacon timing to defeat simple variance/CV thresholds,
    but the underlying periodicity survives in the frequency domain. For Exfiltration, apply FFT-based
    periodicity extraction with multi-stage filtering and whitelist suppression to per-destination time
    series, surfacing dominant frequencies that betray jittered exfil heartbeats. Separately profile HTTP
    error-state ratios (4xx/5xx) per destination as a distinct probing/failed-exfil signal, since a server
    cycling through errors before accepting uploads suggests an adversary tuning its channel. A destination
    with a strong periodic component plus anomalous error ratios is a high-priority beaconing candidate;
    keep the simpler cadence rules running in parallel. Source and references: [BAYWATCH: Robust Beaconing
    Detection, Hu et al.](https://dsail.kaist.ac.kr/files/WWW17.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Web proxies, internet gateways, VPN concentrators with SSL/TLS inspection capabilities, mobile
    application security gateways, and Cloud Access Security Broker (CASB) platforms.'
  range: Last 90 days; per-destination time series
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each (device_ip,dest) time_series:\n  spectrum = FFT(connection_times)\n  spectrum = multistage_filter(spectrum);\
      \ suppress(whitelist)\n  ALERT IF dominant_frequency_power > threshold  # jittered beacon\n  err_ratio\
      \ = count(status in 4xx,5xx)/count(*)\n  ALERT IF err_ratio > dest_baseline_p95"
- question: Does a mobile-flow classifier detect PII/data exfiltration in HTTP(S) (surfacing the leaked
    key/value or top features), and for undecryptable TLS does a self-supervised encrypted-traffic model
    flag deviations from the benign flow manifold?
  context: 'Some exfiltration is only visible in the structure of the flow or the leaked fields themselves.
    For Exfiltration, train a classifier on mobile network flows (ReCon-style) to detect data/PII leakage
    in HTTP(S), and surface the leaked key/value pair or the top contributing features directly in the
    alert so analysts see exactly what data left the device. For undecryptable TLS where payload inspection
    is impossible, apply a self-supervised encrypted-traffic model that learns the benign flow manifold
    and flags deviations (anomalous size/timing/direction sequences). Together these cover both inspectable
    and opaque channels. A positive PII-leak classification is direct evidence of data theft; an encrypted-flow
    anomaly warrants correlation with the volume, beaconing, and JA3 signals to confirm exfiltration.
    Source and references: [ReCon: Revealing and Controlling PII Leaks in Mobile Network Traffic, Ren
    et al.](https://david.choffnes.com/pubs/recon-mobisys16.pdf); [Anomaly Detection in Encrypted Network
    Traffic Using Self-Supervised Learning](https://www.nature.com/articles/s41598-025-08568-0).'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek conn.log
