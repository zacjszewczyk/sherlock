questions:
- question: Are managed mobile applications invoking data- or cache-clearing APIs (Android clearApplicationUserData
    or iOS FileManager.removeItem) in a non-user-initiated way that correlates with malware threat intel,
    prior device-admin/dynamic-code abuse, or a recent low-reputation network connection?
  context: 'This targets the Defense Evasion goal of erasing local artifacts so notable events go unreported.
    Build a SIEM correlation rule that fires when a Mobile EDR log shows event.type=api_call with api.name
    of clearApplicationUserData or FileManager.removeItem, event.properties does NOT flag the action user-initiated,
    AND any of: (a) app.hash/app.package_name matches a malware/dropper threat-intel feed, (b) the same
    app previously requested device-admin or dynamically loaded code from an app-writable path, or (c)
    the call follows within 60s of a connection to a low-reputation domain. Whitelist OS updaters and
    the enterprise security agent. A positive hit suggests a dropper ''fetch->load->clear/uninstall''
    chain; a negative result simply means clearing was user-driven or baseline-consistent. Investigate
    the initiating app, its network history, and whether telemetry continued afterward. Citations: [Execute
    This!](https://sites.cs.ucsb.edu/~vigna/publications/2014_NDSS_ExecuteThis.pdf) documents the dropper
    fetch->load->clear/uninstall pattern; explainable manifest/API rule predicates follow [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf).'
  answer_sources:
  - MDM.ApplicationActivityLogs
  - MobileEDR.AgentLogs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Managed mobile devices (iOS, Android); Corporate Wi-Fi access points; VPN concentrators; Cloud-based
    MDM/UEM management consoles'
  range: Last 90 days; pivot to a 60-second window before each clearing call and a heartbeat-interval
    window after
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM mobile_edr WHERE event.type='api_call' AND api.name IN ('clearApplicationUserData','FileManager.removeItem')
      AND event.properties.user_initiated != true AND app.package_name NOT IN (os_updater_allowlist, security_agent_allowlist)
      AND ( app.hash IN threatintel.dropper_feed OR app.package_name IN apps_that_requested_device_admin
      OR app.package_name IN apps_with_dynamic_code_from_writable_path OR EXISTS(zeek.conn JOIN zeek.dns
      WHERE device_id=app.device_id AND dest_domain IN low_reputation_feed AND ts BETWEEN api.ts-60s AND
      api.ts) ) -> ALERT severity=high
- question: Per application, is the per-hour rate of non-user-initiated data-clearing events exceeding
    its 30-day rolling baseline or showing an abrupt change-point level shift on a device?
  context: 'Statistical baselining catches stealthy clearing that no single rule would flag. For each
    app.package_name, compute the per-hour count of non-user-initiated data-clearing events per device
    and maintain a 30-day rolling baseline; alert when the current hour exceeds the 99th percentile, or
    apply CUSUM/PELT change-point detection to flag abrupt level shifts in the clear-rate. A breach indicates
    the app suddenly began wiping artifacts at an unusual cadence (a Defense Evasion red flag), whereas
    staying within baseline reflects normal cache hygiene. Pivot to the device and the app''s network
    activity for that window. Citations: change-point toolkit per [A Survey of Methods for Time Series
    Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/); per-device behavioral
    baselining validated by [Andromaly](https://link.springer.com/article/10.1007/s10844-010-0148-x).'
  answer_sources:
  - MDM.ApplicationActivityLogs
  - MobileEDR.AgentLogs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Managed mobile devices (iOS, Android); Corporate Wi-Fi access points; VPN concentrators; Cloud-based
    MDM/UEM management consoles'
  range: Last 90 days with a 30-day rolling baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: GROUP mobile_edr BY app.package_name, device_id, hour WHERE clearing_event AND user_initiated=false
      | count -> clear_rate ; baseline=rolling_30d(clear_rate) ; ALERT IF clear_rate > p99(baseline) OR
      CUSUM/PELT(clear_rate) detects level_shift
- question: Can a supervised classifier distinguish malicious data-clearing events from benign ones using
    MDM/EDR and Zeek-derived behavioral features, and which features drove each high-confidence prediction?
  context: 'Train a Random Forest to predict whether a data-clearing event is malicious using features
    app_category, is_user_initiated, time_of_day_bucket, day_of_week, requested_device_admin, dynamic_code_loaded,
    and sum_bytes_out_5min_prior (Zeek conn.log). Surface the top-3 contributing features (feature importance/SHAP)
    in every alert for analyst triage and defensibility. Auto-isolate the device via MDM API when predicted
    probability > 0.90. A high-probability prediction with exfil-like bytes_out and dynamic_code_loaded
    strongly supports anti-forensic clearing under Defense Evasion; low probability deprioritizes the
    event. Validate on CICMalDroid 2020. Citations: explainable feature-weighted classification follows
    [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf) with model/evaluation
    guidance in [Deep Learning for Android Malware Defenses](https://arxiv.org/pdf/2103.05292); train/validate
    on [CICMalDroid 2020](https://www.unb.ca/cic/datasets/maldroid-2020.html).'
  answer_sources:
  - MDM.ApplicationActivityLogs
  - MobileEDR.AgentLogs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Managed mobile devices (iOS, Android); Corporate Wi-Fi access points; VPN concentrators; Cloud-based
    MDM/UEM management consoles'
  range: 'Training: trailing 6-12 months; scoring: Last 90 days'
  queries:
  - technology: ML/pseudocode
    query: X = features[app_category, is_user_initiated, time_of_day_bucket, day_of_week, requested_device_admin,
      dynamic_code_loaded, sum_bytes_out_5min_prior] ; model = RandomForest.fit(train_CICMalDroid) ; p
      = model.predict_proba(event) ; emit top3 SHAP ; IF p>0.90 -> MDM.isolate_device(device_id) + ALERT
- question: Does a data-clearing API call appear as the last event before a device's Mobile EDR/MDM telemetry
    goes silent while the device remains network-reachable (a 'clear then go dark' pattern)?
  context: 'This is a distinct failure-mode signal of anti-forensics. Raise a correlated alert when a
    data-clearing API call is the last event before the device''s Mobile EDR/MDM telemetry stream goes
    silent (no heartbeat within the agent''s expected interval) while Zeek conn.log shows the device is
    still passing traffic. The combination of artifact destruction plus telemetry blackout but live network
    indicates the adversary cleared evidence and suppressed reporting rather than the device simply going
    offline. Confirm by checking the agent heartbeat gap against expected interval and corroborating live
    conn.log flows. Citations: anti-forensic ''clear then go dark'' chains are represented in the [DARPA
    TC E3](https://github.com/darpa-i2o/Transparent-Computing/blob/master/README-E3.md) provenance benchmark.'
  answer_sources:
  - MDM.ApplicationActivityLogs
  - MobileEDR.AgentLogs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Managed mobile devices (iOS, Android); Corporate Wi-Fi access points; VPN concentrators; Cloud-based
    MDM/UEM management consoles'
  range: Last 90 days; align heartbeat-gap windows to the last observed clearing call
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FOR each device: last_edr_event = max(mobile_edr.ts) ; IF last_edr_event.api.name IN (''clearApplicationUserData'',''FileManager.removeItem'')
      AND now()-last_heartbeat > agent.expected_interval AND EXISTS(zeek.conn WHERE device_id AND ts>last_edr_event)
      -> ALERT ''clear-then-go-dark'''
- question: Is a non-allowlisted mobile process performing file deletions inside protected directories
    (system logs, user media/documents, SMS stores) outside its application sandbox?
  context: 'Adversaries delete files in sensitive, non-application-specific locations to destroy evidence.
    Deploy an EDR/FIM policy that raises a critical alert when a process whose process.name is not on
    the enterprise allowlist performs a delete (event.type=deletion) within protected directories such
    as /var/log, /storage/emulated/0/DCIM, /storage/emulated/0/Documents, /data/log, and /private/var/mobile/Library/SMS/.
    Filter known-good updaters and security agents. A hit means an app is reaching outside its sandbox
    to wipe logs or user data (often only possible on jailbroken/rooted devices), a strong Defense Evasion
    indicator; a clean result means deletions stayed within app-private storage. Investigate the process
    lineage and how it gained the access. Citations: protected-path/log-deletion ground truth (incl. Android
    anti-forensics) is in [DARPA TC E3](https://github.com/darpa-i2o/Transparent-Computing/blob/master/README-E3.md);
    deletion by code loaded from non-standard paths maps to [Execute This!](https://sites.cs.ucsb.edu/~vigna/publications/2014_NDSS_ExecuteThis.pdf).'
  answer_sources:
  - MDM.FileIntegrityLogs
  - MobileEDR.AgentLogs
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Managed mobile devices (iOS, Android); MDM/UEM servers; Network egress points with file transfer
    monitoring'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM edr_fim WHERE event.type='deletion' AND process.name NOT IN allowlist AND path MATCHES
      ('/var/log/*','/storage/emulated/0/DCIM/*','/storage/emulated/0/Documents/*','/data/log/*','/private/var/mobile/Library/SMS/*')
      -> ALERT severity=critical
- question: Per application, do hourly deleted-file volume, deletion rate, or the entropy of deleted file
    extensions deviate sharply from the 30-day baseline, indicating indiscriminate or encrypted wiping?
  context: 'Hourly, group by app.package_name and compute total deleted-file count (Volume), deletions/min
    (Frequency), and the Shannon entropy of deleted file extensions. Alert if count exceeds 3 standard
    deviations of the app''s 30-day hourly baseline OR entropy rises >50% from baseline; use CUSUM/change-point
    on deletions/min for abrupt bursts. Entropy above ~7.0 over extensions suggests indiscriminate or
    encrypted wiping rather than targeted cleanup. A breach signals a deletion burst consistent with evidence
    destruction; in-baseline behavior is routine. Correlate the window with preceding network activity
    to determine whether exfiltration occurred before the wipe. Citations: abrupt-burst change-point detection
    per [A Survey of Methods for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/);
    high entropy (>7.0) indicating indiscriminate/encrypted wiping follows [Lyda & Hamrock](https://ieeexplore.ieee.org/document/4140989);
    per-device baselining follows [Andromaly](https://link.springer.com/article/10.1007/s10844-010-0148-x).'
  answer_sources:
  - MDM.FileIntegrityLogs
  - MobileEDR.AgentLogs
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Managed mobile devices (iOS, Android); MDM/UEM servers; Network egress points with file transfer
    monitoring'
  range: Last 90 days with a 30-day hourly baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: GROUP edr_fim BY app.package_name, hour | metrics{ deleted_count, deletions_per_min, ext_entropy=shannon(deleted_extensions)
      } ; baseline=30d_hourly ; ALERT IF deleted_count > mean+3*std(baseline) OR ext_entropy > 1.5*baseline_entropy
      OR ext_entropy>7.0 OR CUSUM(deletions_per_min) detects burst
- question: Do unsupervised models flag anomalous deletion bursts (by rate, bytes, directory depth, and
    extension diversity), and do those windows align with preceding Zeek exfiltration traffic?
  context: 'Train an unsupervised Isolation Forest (or DBSCAN) on benign deletion behavior using features
    deletion_count_per_minute, total_bytes_deleted, directory_path_depth, and distinct_extensions; flag
    outliers and surface the top-3 contributing features in the alert. Correlate flagged windows with
    Zeek files.log (mime_type) and Zeek conn.log (orig_bytes, resp_bytes) for preceding exfiltration.
    An outlier deletion window immediately after large outbound transfers points to steal-then-wipe behavior
    under Defense Evasion; a normal score indicates ordinary file churn. Use the feature attributions
    to triage and justify response. Citations: train-on-benign outlier detection follows [Isolation Forest
    vs. Autoencoders](https://ieeexplore.ieee.org/document/10143005/).'
  answer_sources:
  - MDM.FileIntegrityLogs
  - MobileEDR.AgentLogs
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Managed mobile devices (iOS, Android); MDM/UEM servers; Network egress points with file transfer
    monitoring'
  range: Training on trailing benign data; scoring Last 90 days
  queries:
  - technology: ML/pseudocode
    query: model = IsolationForest.fit(benign[deletion_count_per_minute, total_bytes_deleted, directory_path_depth,
      distinct_extensions]) ; score=model.decision(window) ; IF outlier -> emit top3 features + JOIN zeek.files(mime_type),
      zeek.conn(orig_bytes,resp_bytes) preceding window -> ALERT
- question: Are there low-probability event-ordering sequences per app, such as a mass-deletion burst
    immediately followed by termination of the security agent?
  context: 'Model the per-app sequence of event types and flag low-probability orderings such as a mass-deletion
    burst immediately followed by termination of the security agent, using HMM/sequence models with Markov-transition
    scoring of abstracted call sequences. Such a delete-then-kill ordering is rarely seen in benign apps
    and strongly implies deliberate anti-forensics: destroy artifacts, then blind the defender. A low-probability
    sequence score warrants immediate escalation; common, high-probability sequences are benign. Pivot
    to confirm the security agent''s state and any subsequent telemetry loss. Citations: HMM/sequence
    modeling per [Detecting Intrusions Using System Calls](https://ieeexplore.ieee.org/document/766910);
    Markov-transition scoring of abstracted call sequences follows [MaMaDroid](https://arxiv.org/pdf/1612.04433).'
  answer_sources:
  - MDM.FileIntegrityLogs
  - MobileEDR.AgentLogs
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Managed mobile devices (iOS, Android); MDM/UEM servers; Network egress points with file transfer
    monitoring'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: seq = abstract_event_types(per_app_timeline) ; P = HMM/Markov.transition_score(seq) ; IF P(seq)
      < low_threshold AND pattern==[mass_deletion_burst -> security_agent_terminate] -> ALERT high
- question: Was an application uninstalled programmatically (PackageInstaller.uninstall()) or while matching
    a dropper threat-intel feed within 60 minutes of install rather than via the OS GUI?
  context: 'The install-then-self-uninstall pattern is a hallmark of short-lived droppers that run, then
    remove themselves to evade detection. Alert when an MDM log shows an app_uninstall event and app.package_name/app.hash
    is on a threat-intel feed categorized as short-lived malware/droppers, OR the uninstall is programmatic
    (PackageInstaller.uninstall()) and not GUI-initiated within 60 minutes of install. A match indicates
    an app that briefly existed to perform malicious actions then erased itself; a GUI-driven uninstall
    after long use is benign. Reconstruct what the app did during its short lifetime, especially any network
    activity. Citations: the install-then-self-uninstall dropper pattern is documented in [Execute This!](https://sites.cs.ucsb.edu/~vigna/publications/2014_NDSS_ExecuteThis.pdf).'
  answer_sources:
  - MDM.AppInventoryLogs
  - MobileEDR.AgentLogs
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Managed mobile devices (iOS, Android); MDM/UEM servers; Enterprise DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM mdm WHERE event='app_uninstall' AND ( app.hash IN threatintel.dropper_feed OR (uninstall.method='PackageInstaller.uninstall()'
      AND uninstall.gui_initiated=false AND uninstall.ts - install.ts < 60min) ) -> ALERT
- question: Which applications have anomalously short lifetimes (below the enterprise 5th percentile),
    and is their short life corroborated by C2-like DNS behavior (high NXDOMAIN or blocked-connection
    ratio)?
  context: 'Join MDM install/uninstall logs on device_id and app.name to compute app_lifetime_seconds;
    alert if below the enterprise 5th percentile over 90 days. As a distinct failure-mode signal, enrich
    with Zeek dns.log during the app''s lifetime - an NXDOMAIN ratio > 0.5 or a high blocked-connection
    ratio corroborates likely C2. A short-lived app that also generated heavy NXDOMAIN (DGA-style) traffic
    is a strong dropper/C2 indicator under Defense Evasion; a short lifetime alone may be benign churn.
    Use change-point methods on per-app install/uninstall rates to detect abrupt shifts. Citations: derive
    dataset-specific thresholds from [CICMalDroid 2020](https://www.unb.ca/cic/datasets/maldroid-2020.html);
    detect abrupt shifts in per-app install/uninstall rates with change-point methods per [A Survey of
    Methods for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - MDM.AppInventoryLogs
  - MobileEDR.AgentLogs
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Managed mobile devices (iOS, Android); MDM/UEM servers; Enterprise DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: JOIN mdm.install, mdm.uninstall ON device_id, app.name -> app_lifetime_seconds ; ALERT IF app_lifetime_seconds
      < p5(enterprise_90d) AND (zeek.dns nxdomain_ratio(app_window) > 0.5 OR blocked_conn_ratio > threshold)
      ; ALSO change_point(per_app_uninstall_rate)
- question: Does a behavioral risk model score an uninstall as high-risk using lifetime, install source,
    DNS/exfil features, and programmatic-uninstall flags, with explainable top features?
  context: 'Train logistic regression (or RF) to risk-score each uninstall using app_lifetime_seconds,
    install_source (AppStore/Sideloaded/EnterpriseStore), unique_dns_domains_contacted (Zeek dns.log),
    nxdomain_ratio, total_bytes_transferred (Zeek conn.log), and is_programmatic_uninstall (EDR); a score
    > 0.85 opens a Tier-2 ticket WITH the top-3 contributing features listed. Sideloaded short-lived apps
    with high NXDOMAIN and programmatic uninstall will score high, indicating dropper self-removal; AppStore
    apps with long life score low. For repackaged droppers whose hashes churn, complement with a bytecode-image
    CNN. Use scores to prioritize Tier-2 investigation. Citations: drift-resilient behavioral modeling
    follows [MaMaDroid](https://arxiv.org/pdf/1612.04433); for repackaged short-lived droppers whose hashes
    churn, complement with the bytecode-image CNN of [DexRay](https://arxiv.org/pdf/2109.03326).'
  answer_sources:
  - MDM.AppInventoryLogs
  - MobileEDR.AgentLogs
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Managed mobile devices (iOS, Android); MDM/UEM servers; Enterprise DNS resolvers'
  range: Training trailing 6-12 months; scoring Last 90 days
  queries:
  - technology: ML/pseudocode
    query: X=[app_lifetime_seconds, install_source, unique_dns_domains_contacted, nxdomain_ratio, total_bytes_transferred,
      is_programmatic_uninstall] ; model=LogReg/RF.fit(train) ; s=model.predict_proba(uninstall) ; IF
      s>0.85 -> open_tier2_ticket(top3_features)
- question: Has a process terminated, reconfigured, or revoked Device Administrator permissions from the
    enterprise mobile security agent without the change being initiated by MDM policy, or has rooted/non-compliant
    status unexpectedly disappeared?
  context: 'Disabling the security agent directly blinds the defender. Raise a critical SIEM alert when
    an MDM log shows event.type of device_admin_revoked (or termination/config-change) for a process.name
    matching the enterprise security agent and initiator.process.name is not the MDM agent or a known
    system process. Also alert on unexpected disappearance of rooted/non-compliant device status, which
    can indicate spoofing of compliance state. A hit means an adversary is dismantling defenses or hiding
    compromise (Defense Evasion); benign changes will trace back to the MDM agent. Verify the initiator,
    the agent''s subsequent health, and device compliance state. Citations: explainable rule predicates
    over security-relevant API/permission events follow [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf).'
  answer_sources:
  - MobileEDR.AgentLogs
  - MDM.PolicyComplianceLogs
  - Zeek conn.log
  - 'NAI: Managed mobile devices; MDM/UEM management consoles; Centralized mobile log aggregation platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM mdm WHERE event.type IN ('device_admin_revoked','process_terminate','config_change') AND
      target.process.name = enterprise_security_agent AND initiator.process.name NOT IN (mdm_agent, system_allowlist)
      -> ALERT critical ; ALSO ALERT IF device.rooted_status transitions present->absent unexpectedly
- question: Is a device missing security-agent heartbeats beyond its 95th-percentile inter-checkin interval
    while still passing network traffic per Zeek conn.log?
  context: 'Have the security agent report status every 5 minutes; compute each device''s 95th-percentile
    inter-checkin delta over 30 days and alert when a check-in is missed beyond that threshold while the
    device is still online per recent Zeek conn.log traffic - an explicit failure-state signal. Apply
    CUSUM/Bayesian online change-point to the heartbeat-gap series to catch sudden telemetry-volume drops.
    A missed heartbeat on a still-online device suggests the agent was suspended, killed, or blocked rather
    than the device going offline, a Defense Evasion indicator. Correlate the gap onset with any tamper
    events or data-clearing activity. Citations: CUSUM/Bayesian online change-point on the heartbeat-gap
    series per [A Survey of Methods for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - MobileEDR.AgentLogs
  - MDM.PolicyComplianceLogs
  - Zeek conn.log
  - 'NAI: Managed mobile devices; MDM/UEM management consoles; Centralized mobile log aggregation platform'
  range: Last 90 days with a 30-day baseline of inter-checkin deltas
  queries:
  - technology: SIEM/Stats pseudocode
    query: expected=5min ; gap_p95 = p95(inter_checkin_delta_30d per device) ; ALERT IF now()-last_checkin
      > gap_p95 AND EXISTS(zeek.conn recent traffic for device) ; ALSO CUSUM/BOCPD(heartbeat_gap_series)
      detects sudden drop
- question: Do the security agent's own runtime telemetry signals (CPU, memory, network bytes, restart
    count) show anomalies consistent with crash, suspension, or tampering?
  context: 'Train an Isolation Forest on the agent''s time-series telemetry (cpu_usage, memory_usage,
    network_bytes_sent, restart_count); flag anomalous points (score -1) indicating process crash/suspension
    and emit the top-3 contributing features in the alert. A spike in restart_count or a collapse in network_bytes_sent
    can reveal that an adversary is repeatedly killing or starving the agent to suppress reporting. Anomalous
    points warrant investigation of what acted on the agent and whether other evasion signals (clearing,
    deletion, admin revocation) co-occur; normal telemetry indicates a healthy agent. Citations: behavioral
    ML over on-device runtime telemetry is validated by [Andromaly](https://link.springer.com/article/10.1007/s10844-010-0148-x);
    the train-on-benign unsupervised baseline follows [Isolation Forest vs. Autoencoders](https://ieeexplore.ieee.org/document/10143005/).'
  answer_sources:
  - MobileEDR.AgentLogs
  - MDM.PolicyComplianceLogs
  - Zeek conn.log
  - 'NAI: Managed mobile devices; MDM/UEM management consoles; Centralized mobile log aggregation platform'
  range: Training on trailing benign telemetry; scoring Last 90 days
  queries:
  - technology: ML/pseudocode
    query: model = IsolationForest.fit(agent_telemetry[cpu_usage, memory_usage, network_bytes_sent, restart_count])
      ; score = model.predict(point) ; IF score==-1 -> emit top3 features -> ALERT 'security-agent runtime
      anomaly'
