name: 'T1630: Indicator Removal on Host'
id: 4a9bf5ee-ef62-40e9-a653-89985770d731
description: 'Investigate whether an adversary is deleting, altering, or hiding artifacts on a managed
  mobile device (iOS or Android) to evade detection and undermine mobile security tooling. This playbook
  helps an analyst hunt for: applications invoking data- or cache-clearing APIs (e.g., Android clearApplicationUserData
  or iOS FileManager.removeItem) outside user-initiated or baselined behavior; processes deleting high
  volumes of files or deleting outside their sandbox into sensitive user-data or system-log directories;
  applications that are installed and then rapidly (often programmatically) uninstalled in a dropper ''fetch->load->clear''
  pattern; and attempts to terminate, reconfigure, or revoke Device Administrator permissions from a mobile
  security agent, including unexpected loss of EDR/MDM heartbeats or disappearance of rooted/non-compliant
  device status. It correlates host-side artifact manipulation with subsequent telemetry loss and continued
  network reachability (Zeek conn/dns/files logs) to expose anti-forensic ''clear then go dark'' chains,
  combining symbolic-logic correlation rules, statistical baselining/change-point detection, and machine-learning
  classification.'
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
