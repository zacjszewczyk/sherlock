name: 'T1664: Exploitation for Initial Access'
id: 2eabb0d7-33e1-41e3-ac56-251a6a76bf5d
description: 'Investigate whether an adversary exploited a software vulnerability to gain initial access
  to a mobile device (Android/iOS), including via zero-click exploits such as FORCEDENTRY, StageFright,
  and BlueBorne. This playbook helps an analyst hunt for network-visible evidence of mobile exploitation
  across corporate/guest Wi-Fi, VPN, and gateway telemetry: traffic that matches known malicious indicators
  (IP/domain/TLS fingerprints) or deviates from a device baseline; downloads of mobile malware, sideloaded
  APK/IPA packages, or files with MIME/type mismatches; and the canonical zero-click pattern of an inbound
  push/message-service connection immediately followed by automated outbound C2. It combines deterministic
  indicator matching, statistical baselining of volume/cadence/failure-state signals, and unsupervised/sequence
  machine-learning models to surface exploitation and post-exploit beaconing for triage.'
type: technique
related:
- tactic_id: TA0027
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Does any mobile device's network traffic match a known-malicious indicator (IP, domain, or
    TLS fingerprint) associated with spyware, implants, or exploit kits?
  context: Initial Access via exploitation often results in immediate command-and-control or implant callback
    over the network. Ingest threat intelligence for malicious IPs, domains, and file hashes and match
    it against Zeek conn.log (id.resp_h), dns.log (query), and ssl.log for the mobile device IP ranges,
    alerting at high severity on any match. Add deterministic TLS-stack fingerprinting by computing JA3/JA3S
    and the randomization-resilient JA4/JA4S, and deny-list known spyware/implant/exploit-kit fingerprints
    (e.g., abuse.ch JA3 lists). Because modern browser/app TLS extension randomization degrades JA3, treat
    JA4 as the primary fingerprint on current clients. A positive match is a strong, high-confidence indicator
    of a compromised device beaconing out after exploitation; a negative result reduces but does not eliminate
    suspicion since novel infrastructure may not yet be in feeds.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi network segments, Guest Wi-Fi network, VPN concentrators, Internet gateway proxy/firewall
    logs, and MDM/UEM servers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  intel = load_feed(malicious_ips, malicious_domains, malicious_ja3_ja4)\n  for rec in\
      \ conn.log where id.orig_h in MOBILE_RANGES:\n    if rec.id.resp_h in intel.ips: alert(HIGH, rec)\n\
      \  for rec in dns.log where id.orig_h in MOBILE_RANGES:\n    if rec.query in intel.domains: alert(HIGH,\
      \ rec)\n  for rec in ssl.log where id.orig_h in MOBILE_RANGES:\n    if rec.ja3 in intel.ja3 or rec.ja4\
      \ in intel.ja4 or rec.ja3s in intel.ja3s: alert(HIGH, rec)"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=zeek (sourcetype=conn OR sourcetype=dns OR sourcetype=ssl) src_ip IN MOBILE_RANGES\n\
      \  | lookup threat_intel resp_ip AS id.resp_h OUTPUT verdict\n  | eval ja_hit=if(ja3 IN (deny_ja3)\
      \ OR ja4 IN (deny_ja4),1,0)\n  | where verdict=\"malicious\" OR ja_hit=1\n  | eval severity=\"high\""
- question: Has a mobile device's network volume, cadence, or failure-state behavior deviated significantly
    from its established 30-day baseline?
  context: 'Exploitation and post-exploit activity perturb a device''s normal network profile. For each
    device maintain a 30-day baseline of total bytes (volume), inbound/outbound byte ratio, destination-port
    entropy, connection count per minute (frequency), and unique JA3/JA3S counts; alert when any metric
    exceeds the 98th percentile (or 3 sigma) of that device''s baseline. Separately profile failure-state
    signals as distinct indicators: TLS handshake failure rate, NXDOMAIN bursts, and blocked/RST connection
    rates, which spike during exploit staging and scanning. Apply FFT/coefficient-of-variation periodicity
    scoring to flag jittered post-exploit beaconing to rare external destinations. A spike in failure-state
    signals or a periodic, low-variance beacon to a rare destination is highly indicative of exploitation
    activity.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi network segments, Guest Wi-Fi network, VPN concentrators, Internet gateway proxy/firewall
    logs, and MDM/UEM servers.'
  range: Last 90 days (baseline 30 days, evaluate rolling)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=zeek sourcetype=conn src_ip IN MOBILE_RANGES\n  | stats sum(bytes) AS vol, count\
      \ AS conns, dc(ja3) AS uniq_ja3, entropy(resp_port) AS port_ent BY device, _time span=1m\n  | eventstats\
      \ avg(vol) AS mu_vol stdev(vol) AS sd_vol BY device\n  | where vol > mu_vol + 3*sd_vol OR port_ent\
      \ > p98(port_ent)"
  - technology: Zeek/pseudocode
    query: ">-\n  per device, 30d baseline: tls_fail_rate, nxdomain_rate, rst_rate\n  if current_window.rate\
      \ > p98(baseline.rate): alert(\"failure-state spike\")\n  beacon = fft_periodicity(conn_intervals_to_dest);\
      \ cv = stdev/mean\n  if beacon.score high and cv low and dest rare_external: alert(\"jittered beacon\"\
      )"
- question: Does an unsupervised model flag anomalous connection flows from a mobile device that are inconsistent
    with its learned normal behavior?
  context: Some exploitation and C2 traffic evades both indicator matching and simple thresholds but still
    produces flow features unlike a device's normal traffic. Train a per-device unsupervised model on
    connection features (duration, orig_bytes, resp_bytes, proto, service, port-entropy, inter-arrival
    statistics). Use an autoencoder ensemble over incremental per-stream statistics (Kitsune) and alert
    when reconstruction error exceeds the 99th percentile of training error; run an Isolation Forest in
    parallel as a low-latency baseline for novel flow/port/volume anomalies. For high-jitter beacons,
    add an LSTM sequence model. The alert text must surface the top-3 contributing features (e.g., resp_bytes
    z-score, port entropy, JA4) so an analyst can quickly judge whether the anomaly reflects exploitation
    rather than benign novelty.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi network segments, Guest Wi-Fi network, VPN concentrators, Internet gateway proxy/firewall
    logs, and MDM/UEM servers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = features(conn.log[device]): [duration, orig_bytes, resp_bytes, proto, service, port_entropy,\
      \ iat_stats]\n  ae = KitsuneAutoencoderEnsemble().fit(train_X)\n  err = ae.reconstruction_error(live_X)\n\
      \  iso = IsolationForest().fit(train_X); s = iso.score(live_X)\n  if err > p99(train_err) or s <\
      \ threshold:\n    alert(device, top3_features(err), score=err)"
- question: Did a mobile device download a file matching a known malware hash or YARA signature, a sideloaded
    APK/IPA from a non-approved source, or a file whose MIME type mismatches its inferred type?
  context: Exploitation for initial access frequently involves delivery of a malicious payload over the
    network. Monitor Zeek files.log and match md5/sha1/sha256 against mobile malware feeds; scan extracted
    files with curated YARA/IOC rules covering malicious APK/IPA, weaponized media (JBIG2/StageFright
    class), and shellcode. Monitor Zeek http.log for .apk/.ipa downloads and alert when the originating
    host is not in the approved app-store allowlist (sideloading). Alert on a mismatch between the HTTP-declared
    MIME type and the Zeek-inferred file type, which often signals an exploit disguised as a benign content
    type. A positive hit on any of these deterministic checks is strong evidence of attempted exploitation/payload
    delivery.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - 'NAI: Internet gateway, Web Proxy, Guest Wi-Fi network, Corporate Wi-Fi network segments, and Content
    Delivery Network (CDN) logs.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  for f in files.log where rx_host in MOBILE_RANGES:\n    if f.md5/sha1/sha256 in malware_feed:\
      \ alert(HIGH, f)\n    if yara_scan(f.extracted) matches APK_IPA|MEDIA_EXPLOIT|SHELLCODE: alert(HIGH,\
      \ f)\n    if f.mime_type != f.inferred_type: alert(\"MIME mismatch\", f)\n  for h in http.log where\
      \ uri ~ /\\.(apk|ipa)$/ and host not in APPSTORE_ALLOWLIST:\n    alert(\"sideload\", h)"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=zeek sourcetype=files dst IN MOBILE_RANGES\n  | lookup malware_hashes sha256 OUTPUT\
      \ verdict\n  | eval mismatch=if(mime_type!=inferred_type,1,0)\n  | where verdict=\"malicious\" OR\
      \ mismatch=1\n  | append [search sourcetype=http uri=\"*.apk\" OR uri=\"*.ipa\" NOT host IN(appstore_allowlist)]"
- question: Has a mobile device's download content profile or HTTP request behavior deviated from baseline
    in a way consistent with exploit delivery or probing?
  context: Beyond known signatures, exploit-delivery traffic often shows statistical anomalies. Maintain
    a 30-day baseline of MIME-type mismatches per device and alert when the daily mismatch rate exceeds
    3 sigma above the device or fleet baseline. Profile per-port/length byte-frequency distributions of
    downloaded payloads and flag content whose Mahalanobis distance exceeds threshold (PAYL), and model
    request-parameter character distribution/structure to catch anomalous exploit-delivery requests (Kruegel
    & Vigna). Explicitly baseline HTTP 4xx/404 and blocked-download rates per device as a distinct exploit-probing/failure
    signal. A burst of anomalous payload byte distributions or 404/probing activity points to an exploit
    attempt even when no signature fires.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - 'NAI: Internet gateway, Web Proxy, Guest Wi-Fi network, Corporate Wi-Fi network segments, and Content
    Delivery Network (CDN) logs.'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=zeek sourcetype=http src_ip IN MOBILE_RANGES\n  | stats count(eval(status>=400))\
      \ AS errs, count AS req, count(eval(mime_mismatch)) AS mm BY device, date\n  | eventstats avg(mm)\
      \ AS mu stdev(mm) AS sd BY device\n  | where mm > mu + 3*sd OR errs/req > p98(err_ratio)"
  - technology: ML/pseudocode
    query: ">-\n  payl = PAYL().fit(byte_freq_by_port_len(train_downloads))\n  if mahalanobis(payload.byte_freq,\
      \ payl) > thr: alert(\"anomalous payload\")\n  kv = CharDistModel().fit(request_params)\n  if kv.anomaly(request.params):\
      \ alert(\"anomalous exploit-delivery request\")"
- question: Does a machine-learning classifier flag a download URL or APK as likely malicious for a mobile
    device?
  context: To catch novel exploit-delivery infrastructure and packages, score download URLs with a character+word
    CNN trained on first-party proxy logs (URLNet) and alert when maliciousness probability exceeds 0.9.
    Where APK contents are recoverable, classify with a linear SVM over permissions/API/intent/embedded-URL
    feature sets (Drebin) and surface the top contributing features in the alert so an analyst can validate
    the verdict. Keep deterministic hash/YARA matches as the floor; the ML models run in parallel to extend
    coverage to unseen URLs and samples. A high-probability URL or APK classification, especially with
    interpretable features like dangerous permission sets or embedded C2 URLs, warrants escalation.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - 'NAI: Internet gateway, Web Proxy, Guest Wi-Fi network, Corporate Wi-Fi network segments, and Content
    Delivery Network (CDN) logs.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  url_model = URLNet_CNN().load()\n  for u in http.log[device].urls:\n    p = url_model.prob_malicious(u)\n\
      \    if p > 0.9: alert(\"suspicious URL\", u, p)\n  if apk_recoverable(f):\n    feats = extract(permissions,\
      \ api_calls, intents, embedded_urls)\n    if drebin_svm.predict(feats)==MAL: alert(\"malicious APK\"\
      , top_features(feats))"
- question: Is there a zero-click exploit pattern where an inbound push/message-service connection is
    immediately followed by outbound traffic to a malicious or newly-observed destination?
  context: Zero-click exploits (e.g., FORCEDENTRY/Pegasus) deliver via an inbound message/push and trigger
    automated C2 with no user interaction. Maintain allowlists for push-notification service IPs (APNs/FCM)
    and blocklists for malicious domains/IPs; alert when an inbound push/message-service connection is
    followed within 60 seconds by outbound traffic to a blocklisted or newly-observed destination from
    the same device. Flag the egress domain if it matches newly-registered/short-TTL/lexically-anomalous
    predicates (EXPOSURE). This encodes the canonical zero-click pattern; a tight inbound-push-to-suspicious-egress
    sequence is a high-confidence indicator of a successful zero-click exploit and should be escalated
    quickly.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi network, Guest Wi-Fi network, Internet Gateway, and VPN termination points.'
  range: 'Last 90 days (event-centered: +/- 60s correlation window)'
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  push_ips = APNS_FCM_ALLOWLIST\n  for inbound in conn.log where id.resp_h==device and\
      \ id.orig_h in push_ips:\n    egress = first(conn.log where id.orig_h==device and ts in [inbound.ts,\
      \ inbound.ts+60s])\n    dest = resolve(egress.id.resp_h)\n    if dest in blocklist or newly_observed(dest,30d)\
      \ or exposure_predicate(dest):\n      alert(HIGH, \"zero-click push->egress\", device, inbound,\
      \ egress)"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  | search index=zeek sourcetype=conn (resp_ip=device orig_ip IN push_ips) OR (orig_ip=device)\n\
      \  | transaction device maxspan=60s startswith=(orig_ip IN push_ips)\n  | where egress_dest IN blocklist\
      \ OR egress_dest_first_seen>now-30d\n  | eval severity=\"high\""
- question: Does the timing between an inbound push/message event and the next outbound connection, plus
    the novelty of the destination, indicate automated zero-click activity?
  context: Automated exploit chains react faster than human-driven activity. Build a per-device distribution
    of time deltas between inbound push/message-service events and the next outbound connection; alert
    when a new delta is below the 5th percentile AND the destination is newly observed in the last 30
    days. Score the destination's DNS answer diversity, TTL, and lexical features for malicious likelihood
    (EXPOSURE), and apply periodicity/regularity scoring to any subsequent recurring egress (BAYWATCH).
    Track failed/RST follow-on connections as a distinct signal. An abnormally fast push-to-egress transition
    to a brand-new, lexically suspicious domain strongly suggests machine-driven exploitation rather than
    user behavior.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi network, Guest Wi-Fi network, Internet Gateway, and VPN termination points.'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per device: deltas = time(next_outbound) - time(inbound_push)\n  if delta < p5(device.delta_dist)\
      \ and dest newly_observed_30d:\n    score = exposure(dns_answer_diversity, ttl, lexical)\n    if\
      \ score high: alert(\"fast push->new-dest egress\", device, delta, dest)\n  track rst_followon_rate\
      \ as distinct signal"
  - technology: Zeek/pseudocode
    query: ">-\n  recurring = baywatch_periodicity(subsequent_egress_intervals)\n  if recurring.regular:\
      \ alert(\"post-exploit beacon after push\", dest)"
- question: Does a sequence model flag a low-probability network state transition (e.g., inbound push
    to beacon to a new domain) on a mobile device?
  context: Zero-click compromise manifests as an unusual sequence of network states rather than any single
    event. Train a per-device Continuous-Time HMM on sequences of network states (Idle, Inbound_Push,
    Outbound_Web, Outbound_API, Beacon) and alert on low-probability transitions such as Inbound_Push
    -> Beacon to a new domain. Complement with an LSTM/transformer sequence model to capture high-jitter
    post-exploit cadence. The alert text must name the top-3 state-transition/timing features driving
    the score so analysts can interpret it. A rare, high-scoring transition from an inbound push directly
    into beaconing to previously unseen infrastructure is a strong behavioral signature of a zero-click
    exploit chain.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi network, Guest Wi-Fi network, Internet Gateway, and VPN termination points.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  states = label_sequence(conn.log[device]): {Idle, Inbound_Push, Outbound_Web, Outbound_API,\
      \ Beacon}\n  cthmm = ContinuousTimeHMM().fit(train_states)\n  p = cthmm.transition_prob(live_seq)\n\
      \  if p < threshold and live_seq contains Inbound_Push->Beacon(new_domain):\n    alert(device, top3_transition_features,\
      \ score=p)\n  lstm = SeqModel().fit(train_states); flag high-jitter cadence"
