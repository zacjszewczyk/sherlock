name: 'T1629.003: Disable or Modify Tools'
id: c95ad834-98bb-428d-8fcd-c8d75de2fb4d
description: 'Investigate whether an adversary is attempting to evade mobile security controls by disabling
  or modifying defensive tooling on managed Android (and broader mobile) endpoints. This playbook helps
  an analyst hunt for the management-plane and on-device artifacts of tool tampering: revocation of device-administrator
  privileges from a required security/MTD agent or the granting of admin rights to an unapproved app;
  MTD agents reporting explicit ''disabled'', ''tampered'', ''stopped'', or ''unresponsive'' states; the
  silent disappearance of expected health/heartbeat telemetry while the device remains network-active;
  and SELinux dropping from ''enforcing'' to ''permissive'' or ''disabled'' in violation of policy. It
  correlates MDM/UEM audit, app-inventory, compliance, and security-posture logs with MTD agent-status,
  alert, and heartbeat logs, Play Integrity / attestation verdicts, and network flow records (Zeek conn.log)
  to separate malicious tampering from benign causes such as OS updates, reboots, and network outages.
  The guidance layers deterministic rules, per-device and per-cohort statistical baselining, time-series
  forecasting, and supervised/unsupervised machine learning so detection of the Defense Evasion causal
  chain — control modified, then monitoring weakens, then activity continues under reduced visibility
  — never depends on a single method, and surfaces explainable feature drivers for fast SOC triage and
  automated quarantine.'
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
