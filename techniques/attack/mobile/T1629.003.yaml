questions:
- question: Did an MDM/UEM audit log record the revocation of device-administrator privileges from a required
    security/MTD application, or the granting of device-administrator privileges to an application that
    is not on the approved admin allow-list, on any managed mobile device?
  context: 'Stripping the device-administrator role from a mandated mobile-threat-defense or device-admin
    agent is a direct disable-tool action: without that role the agent can no longer enforce policy, scan,
    or report, blinding the defender. Conversely, granting admin rights to an unapproved (often sideloaded)
    app is how an adversary obtains the elevated control needed to alter defensive tooling and protected
    state. In the Defense Evasion tactic this is frequently the first link in the causal chain that ends
    with degraded telemetry. Build a deterministic SIEM rule over MDM.UEMAuditLogs that fires high-severity
    on (event_code = device_admin_revoked AND target_app in required_security_tools) OR (event_code =
    device_admin_granted AND target_app not in approved_admin_apps), enforcing the compliance predicate
    from NIST SP 800-124r2 that required MTD/device-admin agents stay active, and auto-quarantine on violation.
    Corroborate with an attestation predicate: alert when the same device''s Play Integrity verdict drops
    below MEETS_DEVICE_INTEGRITY. A positive result is high-confidence tampering warranting immediate
    device isolation; a negative result does not clear the device because admin changes can be made off-management.'
  answer_sources:
  - MDM.UEMAuditLogs
  - MDM.AppInventoryLogs
  - 'NAI: Centralized log aggregator (SIEM), MDM/UEM administrative servers, fleet of managed mobile endpoints.'
  range: Last 90 days, with real-time alerting on any single matching event.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'alert high when source=MDM.UEMAuditLogs and ((event_code="device_admin_revoked" and target_app
      in required_security_tools) or (event_code="device_admin_granted" and target_app not in approved_admin_apps));

      join PlayIntegrity on device_id where verdict < MEETS_DEVICE_INTEGRITY -> raise severity;

      action quarantine_device(device_id); output device_id, user, target_app, event_code, timestamp.'
- question: For each device, does today's count of device_admin_granted events to unapproved apps, or
    device_admin_revoked events targeting security tools, exceed the device's own 30-day historical baseline
    at a statistically derived cutoff?
  context: A single admin change can be benign, but a device that suddenly produces an unusual volume
    of admin grants to unapproved apps or revocations against security tools is exhibiting behavior consistent
    with automated tampering or an attacker iterating to evade controls. For each device maintain a 30-day
    rolling baseline of these two counts separately and alert when a device's daily count exceeds its
    own 99th percentile (a Volume/Frequency signal). Derive the percentile cutoff per fleet using representative
    sampling and report confidence intervals rather than a single static number, and track the benign-grant
    rate as a distinct failure-mode signal so legitimate onboarding spikes are not conflated with attacks,
    following 'Don't Pick the Cherry'. In Defense Evasion terms this catches the elevation step before
    defensive telemetry degrades. A positive result flags an anomalous device for Tier 2 review; a negative
    result simply means the volume is within normal range.
  answer_sources:
  - MDM.UEMAuditLogs
  - MDM.AppInventoryLogs
  - 'NAI: Centralized log aggregator (SIEM), MDM/UEM administrative servers, fleet of managed mobile endpoints.'
  range: Last 90 days for scoring; 30-day rolling baseline per device.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each device_id:\n  grant_cnt = count(event_code=\"device_admin_granted\" and target_app\
      \ not in approved_admin_apps) per day;\n  revoke_cnt = count(event_code=\"device_admin_revoked\"\
      \ and target_app in required_security_tools) per day;\n  baseline_p99 = percentile(prior_30d_counts,\
      \ 99) with CI;\n  alert when grant_cnt > baseline_p99 or revoke_cnt > baseline_p99;\n  report benign_grant_rate\
      \ separately."
- question: When an admin-privilege change occurs, does a supervised classifier (e.g., Gradient Boosting)
    using app name, requested permissions, install source, time of day, and device integrity/root state
    predict the event is malicious with high confidence?
  context: Many admin changes share surface features; the malicious ones cluster on signals like a sideloaded
    install source combined with a request for DEVICE_ADMIN and BIND_ACCESSIBILITY on a rooted device.
    Train a supervised classifier on those features and require the alert to surface the top-3 contributing
    features (e.g., sideloaded source + accessibility request + root) using the explainable linear feature-weighting
    approach of Drebin, so analysts see why an event scored as it did. Events classified malicious with
    confidence > 0.9 trigger automated device quarantine via the MDM API. Re-baseline and monitor decay
    with the time-aware AUT methodology of TESSERACT, and use conformal credibility from Transcend to
    route low-confidence predictions to analyst review instead of silently mis-scoring them. This directly
    supports Defense Evasion detection by distinguishing an adversary's tool-disabling admin grant from
    routine administration. A high-confidence positive auto-quarantines; low credibility means human adjudication.
  answer_sources:
  - MDM.UEMAuditLogs
  - MDM.AppInventoryLogs
  - 'NAI: Centralized log aggregator (SIEM), MDM/UEM administrative servers, fleet of managed mobile endpoints.'
  range: Last 90 days; retrain and re-evaluate on a time-aware schedule.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [app_name, requested_perms(DEVICE_ADMIN,BIND_ACCESSIBILITY), install_source, time_of_day,
      integrity_state, root_state];

      score = gbm.predict_proba(features);

      explain top3 = drebin_linear_weights(features);

      if score>0.9: quarantine_device(device_id);

      if transcend_credibility(score) low: route_to_analyst();

      output device_id, score, top3_features.'
- question: Did the MTD platform report an agent status of 'disabled', 'tampered', or 'stopped' on any
    managed device, especially while that device remained network-active?
  context: 'An MTD agent explicitly self-reporting a disabled, tampered, or stopped state is among the
    clearest tamper signals available: it is the protection telling you it has been interfered with. In
    Defense Evasion this is the monitoring-weakens link in the causal chain. Build a deterministic SIEM
    rule that fires high-severity whenever an MTD log contains agent_status of disabled, tampered, or
    stopped, including device ID and user for immediate investigation. Per the continuous-monitoring guidance
    in NIST SP 800-124r2, treat an agent that transitions to a non-reporting state while the device is
    still network-active as a tamper signal rather than a benign quiesce. A positive result should drive
    immediate triage and likely isolation; a negative result does not rule out a fully removed or crashed
    agent that never emitted a status.'
  answer_sources:
  - MTD.AgentStatusLogs
  - MTD.AlertLogs
  - 'NAI: MTD management console, Centralized log aggregator (SIEM), managed mobile endpoints.'
  range: Last 90 days, with real-time alerting on any matching status.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'alert high when source in (MTD.AgentStatusLogs, MTD.AlertLogs) and agent_status in ("disabled","tampered","stopped");

      enrich device network_active state; if network_active and not reporting -> tamper=true;

      output device_id, user, agent_status, timestamp.'
- question: Does the daily count of tampered/disabled/stopped agent events for any device-model + OS-version
    cohort exceed that cohort's 14-day moving average by more than three standard deviations?
  context: Individual agent stops happen, but a sudden cluster of tamper/disable/stop events concentrated
    in one device model or OS version often indicates an exploitable vulnerability or an active campaign
    targeting that population. Compute a 14-day moving average of these events per device-model/OS-version
    cohort and alert when a cohort's daily count exceeds the moving average by more than three standard
    deviations (a Frequency signal). Profile the rate of benign stops (OS update, user reboot) separately
    as a failure-mode baseline so it is not conflated with malicious tampering, and derive cohort thresholds
    with representative sampling and confidence intervals per 'Don't Pick the Cherry'. For Defense Evasion
    this surfaces coordinated tool-disabling across a fleet segment that per-device rules would miss.
    A positive result points to a vulnerability/campaign for fleet-level response; a negative result means
    the cohort is within expected variation.
  answer_sources:
  - MTD.AgentStatusLogs
  - MTD.AlertLogs
  - 'NAI: MTD management console, Centralized log aggregator (SIEM), managed mobile endpoints.'
  range: Last 90 days; 14-day moving-average window per cohort.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each cohort=(device_model, os_version):\n  daily = count(agent_status in (\"tampered\"\
      ,\"disabled\",\"stopped\")) per day;\n  ma = moving_avg(daily, 14d); sd = moving_std(daily, 14d);\n\
      \  alert when daily > ma + 3*sd;\n  track benign_stop_rate(os_update, reboot) separately."
- question: Can a supervised classifier separate benign agent stops (planned updates, reboots) from malicious
    tampering using features like the status event, time since last successful check-in, concurrent root/integrity-fail
    alerts, and app installs within 5 minutes of the event?
  context: Not every agent stop is hostile; the malicious ones tend to coincide with root/integrity failures,
    abnormally long gaps since the last check-in, or a fresh app install moments before the stop. Develop
    a supervised classifier on those features and surface the top-3 contributing features in the alert
    for explainability. Use online, autonomously thresholded anomaly scoring over the streaming status
    telemetry as in AOC-IDS so the model adapts as the fleet drifts, and keep evaluation time-aware per
    TESSERACT. A malicious-tampering classification triggers automated device isolation. In Defense Evasion
    terms this lets the SOC act on genuine tampering while suppressing the routine maintenance noise that
    would otherwise cause alert fatigue. A positive result isolates the device; a benign classification
    documents the likely maintenance cause.
  answer_sources:
  - MTD.AgentStatusLogs
  - MTD.AlertLogs
  - 'NAI: MTD management console, Centralized log aggregator (SIEM), managed mobile endpoints.'
  range: Last 90 days; online thresholds updated continuously.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [agent_status_event, time_since_last_checkin, concurrent_root_integrity_alerts,
      app_installs_within_5min];

      score = clf.predict(features); threshold = aoc_ids_online_threshold(stream);

      explain top3 features;

      if score==malicious: isolate_device(device_id);

      output device_id, score, top3_features.'
- question: Has any device failed to emit an MTD agent heartbeat within a static SLA threshold (e.g.,
    60 minutes), indicating the health/status telemetry has gone silent?
  context: A tampered or removed agent often simply stops checking in. A stateful deterministic rule that
    tracks the last-seen heartbeat per device and alerts when no new heartbeat for a device_id is observed
    within a fixed threshold (e.g., 60 minutes) provides a reliable floor that catches outright silence
    even when more sophisticated forecasting is layered on top. This deterministic floor is consistent
    with the agent-presence compliance requirement in NIST SP 800-124r2. In the Defense Evasion chain
    this is the 'protection telemetry disappears' signal in its simplest form. A positive result (silence
    past SLA) warrants investigation and corroboration with network data; a negative result means the
    device is still reporting, though that alone does not prove the agent is healthy.
  answer_sources:
  - MTD.AgentHeartbeatLogs
  - Zeek conn.log
  - 'NAI: MTD management console, Network sensors at internet gateways, Centralized log aggregator (SIEM).'
  range: Last 90 days, with stateful real-time tracking of last-seen heartbeat.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'stateful: track last_heartbeat[device_id] from MTD.AgentHeartbeatLogs;

      for each device_id: if now - last_heartbeat[device_id] > 60min: alert("missing_heartbeat");

      output device_id, last_heartbeat, gap_minutes.'
- question: Does a device's heartbeat gap exceed its own 30-day mean+4σ interval, AND does Zeek conn.log
    show no recent connections from that device to the MTD service, distinguishing a tampered agent from
    a benign network outage?
  context: 'A static SLA is coarse; devices have different natural cadences. For each device compute the
    mean and standard deviation of the interval between consecutive heartbeats over 30 days and alert
    when the gap exceeds mean+4σ (a Frequency/State signal). Critically, corroborate by querying Zeek
    conn.log to confirm whether the device IP made any recent connections to the MTD service/C2 IPs: if
    the device is actively communicating elsewhere but not heartbeating, the agent is likely tampered
    rather than the device being offline (failure-mode separation). Sequence-model the heartbeat/health
    event stream so missing or out-of-order check-ins are flagged against learned normal sequences, as
    in DeepLog. For Defense Evasion this separates a stealthy disabled agent from an innocuous outage.
    A positive result with active network traffic but no heartbeats is strong tamper evidence; a negative
    (or outage-correlated) result downgrades the finding.'
  answer_sources:
  - MTD.AgentHeartbeatLogs
  - Zeek conn.log
  - 'NAI: MTD management console, Network sensors at internet gateways, Centralized log aggregator (SIEM).'
  range: Last 90 days; 30-day per-device interval baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each device_id:\n  mu, sigma = mean_std(heartbeat_intervals, 30d);\n  if current_gap >\
      \ mu + 4*sigma:\n    net = lookup Zeek conn.log for device_ip -> MTD_service_ips in last gap window;\n\
      \    if net.connections > 0: alert(\"tamper_suspected: active but silent\");\n    else: note(\"\
      possible network outage\");\n  deeplog_seq_check(heartbeat_event_stream);"
- question: Does an actual agent check-in fall outside the prediction interval of a per-device time-series
    forecast (e.g., Prophet or LSTM) trained on historical heartbeat cadence?
  context: Some devices have complex, non-stationary check-in patterns that simple mean+σ baselines mis-model.
    Implement per-device time-series forecasting trained on historical heartbeat data to predict the next
    expected check-in, and alert when an actual check-in falls outside the model's prediction interval.
    DeepLog's LSTM next-event prediction with online feedback updates provides the reference design; pair
    it with an autonomously tuned online threshold per AOC-IDS so the prediction interval stays calibrated
    as device check-in cadence drifts. Surface the deviation magnitude and last-good-checkin time in the
    alert. For Defense Evasion this detects subtle suppression of telemetry that stays just under static
    thresholds. A positive result (check-in outside the interval) indicates anomalous telemetry timing
    worth investigating; a negative result means the cadence matches the learned model.
  answer_sources:
  - MTD.AgentHeartbeatLogs
  - Zeek conn.log
  - 'NAI: MTD management console, Network sensors at internet gateways, Centralized log aggregator (SIEM).'
  range: Last 90 days for training; rolling online updates.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = forecast_per_device(history=heartbeat_times);  // Prophet or LSTM (DeepLog)

      predicted = model.next_checkin(); interval = aoc_ids_online_interval();

      if actual_checkin not in interval: alert;

      output device_id, deviation_magnitude, last_good_checkin.'
- question: Does any MDM/UEM compliance report or MTD security-posture log show an Android device with
    SELinux state 'permissive' or 'disabled', violating the policy requirement for 'enforcing'?
  context: 'A compliant Android device must run SELinux in enforcing mode; a state of permissive or disabled
    means mandatory access controls are no longer blocking actions, which typically requires root and
    is authoritative evidence of tampering. Configure a critical-severity SIEM alert when any MDM.ComplianceStatusLogs
    or MTD.SecurityPostureLogs for an Android device reports selinux_status of permissive or disabled,
    and automatically place the device in a restricted network group. Per the AOSP SELinux and SE Android
    references, permissive/disabled state, unexpected policy reloads, or avc:denied floods are authoritative
    tamper evidence. Add a parallel deterministic rule on attestation failure: alert when the device verdict
    falls below MEETS_DEVICE_INTEGRITY from the Play Integrity API. In Defense Evasion this catches the
    disabling of a foundational OS protection that enables further tool tampering. A positive result should
    restrict and investigate the device immediately.'
  answer_sources:
  - MDM.ComplianceStatusLogs
  - MTD.SecurityPostureLogs
  - 'NAI: MDM/UEM and MTD administrative consoles, Centralized log aggregator (SIEM), fleet of managed
    Android devices.'
  range: Last 90 days, with real-time alerting on any non-enforcing report.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'alert critical when source in (MDM.ComplianceStatusLogs, MTD.SecurityPostureLogs) and platform=Android
      and selinux_status in ("permissive","disabled");

      parallel: alert when PlayIntegrity verdict < MEETS_DEVICE_INTEGRITY;

      action move_device_to_restricted_group(device_id); output device_id, user, selinux_status, timestamp.'
- question: Does the daily Shannon entropy of a device's concatenated key security settings (selinux_status|root_status|developer_mode_enabled)
    exceed its 30-day 98th-percentile baseline, indicating abnormal security-setting churn?
  context: Adversaries disabling tools often flip several protected settings in a short window, producing
    a burst of configuration change that raises the entropy of the device's security-settings state. For
    each Android device compute the daily Shannon entropy of a concatenated string of key security settings
    (e.g., selinux_status|root_status|developer_mode_enabled), establish a 30-day per-device baseline,
    and alert if daily entropy exceeds the 98th percentile (a Volume-of-simultaneous-config-changes signal).
    Also track the count of AVC-denial and policy-reload events per device as distinct frequency/failure
    signals, and derive percentile cutoffs with confidence intervals per 'Don't Pick the Cherry'. For
    Defense Evasion this catches coordinated weakening of multiple controls that single-setting rules
    might individually tolerate. A positive result flags abnormal churn for review; a negative result
    means settings are stable.
  answer_sources:
  - MDM.ComplianceStatusLogs
  - MTD.SecurityPostureLogs
  - 'NAI: MDM/UEM and MTD administrative consoles, Centralized log aggregator (SIEM), fleet of managed
    Android devices.'
  range: Last 90 days; 30-day per-device entropy baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each device_id (Android):\n  s = concat(selinux_status, root_status, developer_mode_enabled);\n\
      \  H = shannon_entropy(daily_setting_states(s));\n  baseline_p98 = percentile(prior_30d_H, 98) with\
      \ CI;\n  alert when H > baseline_p98;\n  track avc_denial_count, policy_reload_count separately."
- question: Across the fleet, does an unsupervised anomaly detector (e.g., Isolation Forest) over selinux_status,
    root_status, integrity verdict, days_since_last_patch, and sideloaded_app_count flag a device in the
    top 2% of anomaly scores as a security-posture outlier?
  context: 'Tampered devices frequently look anomalous across several posture dimensions at once even
    when no single setting trips a rule. Deploy an unsupervised anomaly detector over a fleet-wide feature
    set: one-hot selinux_status, root_status, integrity verdict, numeric days_since_last_patch, and sideloaded_app_count;
    flag the top 2% anomaly scores for Tier 2 review and surface the top-3 contributing features per alert.
    Select model/feature families using the Deep Learning for Android Malware Defenses survey, prefer
    drift-robust behavioral abstractions as in MaMaDroid, and gate predictions with conformal credibility
    from Transcend to avoid silent decay. For Defense Evasion this surfaces devices whose overall security
    posture has drifted into a tampered configuration. A positive result (top-2% outlier) routes to analyst
    review; a negative result means the device''s posture resembles the healthy fleet.'
  answer_sources:
  - MDM.ComplianceStatusLogs
  - MTD.SecurityPostureLogs
  - 'NAI: MDM/UEM and MTD administrative consoles, Centralized log aggregator (SIEM), fleet of managed
    Android devices.'
  range: Last 90 days; periodic re-fit with drift monitoring.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [onehot(selinux_status), root_status, integrity_verdict, days_since_last_patch,
      sideloaded_app_count];

      scores = isolation_forest.fit_predict(fleet_features);

      flag top 2% anomaly scores; explain top3 features;

      gate with transcend_credibility; route flagged -> Tier2.'
