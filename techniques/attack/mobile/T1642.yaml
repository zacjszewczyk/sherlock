name: 'T1642: Endpoint Denial of Service'
id: 36628813-1c1a-402e-8283-32ceca60c65f
description: 'Investigate potential Endpoint Denial of Service (T1642) against managed mobile devices,
  where an adversary degrades or blocks the availability of a device to its user. On Android prior to
  version 7, malicious apps can abuse Device Administrator access to call lockNow()/resetPassword() and
  lock the user out; on jailbroken iOS, malware such as KeyRaider has locked devices for ransom. This
  playbook helps an analyst hunt for the network, DNS, MDM/EMM, and application-vetting evidence of this
  activity: connections to mobile-malware C2 or rooting/jailbreak infrastructure that match threat intelligence,
  DGA-like query bursts followed by an anomalous drop-to-zero of device traffic (the network signature
  of a locked device), rare user-agent strings and outlier network behavior indicative of rooting/jailbreaking,
  and MDM audit events showing unapproved Device Administrator grants, lock/resetPassword policy invocations,
  or unsigned iOS configuration profiles. It combines deterministic symbolic-logic rules, statistical
  baselining, and machine-learning models to surface both sophisticated and commodity device-locking threats.'
type: technique
related:
- tactic_id: TA0034
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did a managed mobile device connect to an IP address or domain that matches a threat-intelligence
    entry for mobile-malware command-and-control infrastructure with Endpoint DoS / device-locking capability
    (e.g., KeyRaider)?
  context: 'Under the Impact tactic, the canonical T1642 case on jailbroken iOS is KeyRaider, which can
    lock a device for ransom; correlating Zeek intel.log with conn.log on the shared uid lets the analyst
    confirm that a mobile device actually contacted known mobile-malware C2 rather than merely resolving
    it. A positive result means a managed device beaconed to attacker infrastructure tied to device-locking
    malware and should be triaged immediately with MDM/EMM and gateway telemetry; a negative result rules
    out the known-bad-infrastructure path for this device. Seed the Intel Framework with jailbreak/Cydia-repo
    and KeyRaider indicators tagged mobile_malware, KeyRaider, or T1642, and ensure the source IP falls
    within the mobile device IP range so corporate-server hits are not confused with device hits. References:
    [KeyRaider](https://unit42.paloaltonetworks.com/keyraider-ios-malware-steals-over-225000-apple-accounts-to-create-free-app-utopia/),
    [NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf).'
  answer_sources:
  - Zeek intel.log
  - Zeek conn.log
  - MDM.UEMAuditLogs
  - 'NAI: Corporate and Guest Wi-Fi network gateways, VPN concentrators, DNS resolvers, Mobile Device
    Management (MDM) platform.'
  range: Last 90 days, with event-centered correlation around each intel hit.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'join intel = zeek_intel_log with conn = zeek_conn_log on uid;

      alert (high) when intel.seen.where in [''Conn::IN_ORIG'',''DNS::IN_QUERY'']

      and conn.id.orig_h in mobile_device_ip_ranges

      and intel.meta.source contains_any [''mobile_malware'',''KeyRaider'',''T1642''];

      enrich with MDM device owner and compliance status;

      output device_ip, owner, dest, intel_source, uid, timestamp.'
- question: Is a managed mobile device connecting to a destination ASN it has never used before, and is
    the connection frequency or failed-connection rate to that ASN abnormal for the device's peer group?
  context: 'For the Impact tactic, device-locking malware often beacons to infrastructure outside a device''s
    normal destination footprint. Building a 30-day rolling baseline of unique destination ASNs (from
    conn.log id.resp_h) per device lets the analyst flag first-contact with a new ASN, then escalate using
    ASN reputation and frequency. A positive result is a device reaching a malicious or unreputable new
    ASN at a volume above its peer-group 99th percentile, or generating many failed/blocked (State) connections
    that look like probing; a negative result is routine network drift. Group peers by OS type and version
    so an iOS device is compared against iOS devices. References: [NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf).'
  answer_sources:
  - Zeek intel.log
  - Zeek conn.log
  - MDM.UEMAuditLogs
  - 'NAI: Corporate and Guest Wi-Fi network gateways, VPN concentrators, DNS resolvers, Mobile Device
    Management (MDM) platform.'
  range: Last 90 days, with a 30-day per-device ASN baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = unique_dest_asn_per_device(conn_log.id.resp_h, window=30d);\nfor each device connection:\n\
      \  if dest_asn not in baseline[device]: candidate=true;\nenrich asn_reputation; raise severity if\
      \ reputation=malicious;\npeer = devices_same_os_and_version(device);\nalert when hourly_conn_count(device,asn)\
      \ > p99(peer)\n  or blocked_conn_count(device,asn) anomalous;\noutput device, new_asn, reputation,\
      \ conn_count, blocked_count."
- question: Does a supervised classifier score a mobile-originated network connection as high-risk based
    on its byte ratios, duration, protocol, and destination reputation, sustained across several consecutive
    connections?
  context: 'Within the Impact tactic, subtle C2 used to deliver or trigger device-locking payloads may
    not match any single rule. A Gradient Boosting classifier scoring each mobile connection in conn.log
    on features such as duration, proto, service, orig_bytes, resp_bytes, conn_state, plus destination
    IP/ASN reputation, geolocation, and per-device historical destination frequency can surface these.
    A sustained score above 0.9 across more than three consecutive connections is a strong signal that
    warrants a SOAR pullback of MDM device owner, compliance, and recent activity. The alert must surface
    the top-3 contributing features (e.g., rare ASN, abnormal byte ratio, new destination) so the analyst
    can judge whether the risk is explainable or a false positive. References: [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf).'
  answer_sources:
  - Zeek intel.log
  - Zeek conn.log
  - MDM.UEMAuditLogs
  - 'NAI: Corporate and Guest Wi-Fi network gateways, VPN concentrators, DNS resolvers, Mobile Device
    Management (MDM) platform.'
  range: Last 90 days for scoring; retrain periodically on labeled mobile traffic.
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [duration,proto,service,orig_bytes,resp_bytes,conn_state,\n            dest_ip_rep,dest_asn_rep,geo,hist_dest_freq];\n\
      score = gradient_boosting.predict_proba(features);\nalert when score > 0.9 for > 3 consecutive connections;\n\
      trigger SOAR: query MDM for owner, compliance, recent activity;\nexplain = top3_features(features);\n\
      output device, score, explain, dest, conn_window."
- question: Did a managed mobile device query a newly registered domain (registered less than three days
    ago) and then go completely silent on the network for at least 15 minutes?
  context: 'A sudden, complete cessation of traffic is the network signature of a device that has been
    locked or disabled through Device Administrator abuse, the T1642 Impact outcome. Pairing a DNS query
    for a domain whose WHOIS/passive-DNS registration date is under three days old with a subsequent 15-minute
    absence of any conn.log activity from the same source IP gives a deterministic early-warning rule.
    A positive result is a likely device-locking event preceded by contact with attacker-controlled new
    infrastructure; a negative result (traffic continues) suggests the device is operating normally. Enrich
    registration dates via passive DNS so the rule is not blind to fast-flux or freshly stood-up C2. References:
    [HelDroid](https://link.springer.com/chapter/10.1007/978-3-319-26362-5_18).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Internal DNS resolvers, network traffic monitoring points at internet gateways.'
  range: Last 90 days, with 15-minute post-query silence windows.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'q = zeek_dns where id.orig_h in mobile_ranges;

      nrd = q where whois_or_pdns_age(query) < 3d;

      silence = no zeek_conn from nrd.id.orig_h for 15m after nrd.ts;

      alert when nrd and silence;

      output device_ip, query, reg_age, last_seen_ts, gap.'
- question: Is a managed mobile device emitting a burst of high-entropy DGA-like DNS queries, followed
    by an offline gap longer than its own historical norm?
  context: For the Impact tactic, malware that locks a device may first reach C2 via algorithmically generated
    domains and then drop offline once the lock is applied. Computing Shannon entropy for each dns.log
    query and counting, in a 5-minute rolling window per device, the queries with entropy above 3.5 flags
    probable DGA activity when more than five occur. The analyst then checks conn.log for the last connection
    timestamp and alerts when the offline gap exceeds the device's 95th-percentile historical offline
    duration. A high NXDOMAIN response rate is treated as a distinct failure-mode signal. A positive result
    couples DGA-style beaconing with an anomalous silence consistent with a locked device.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Internal DNS resolvers, network traffic monitoring points at internet gateways.'
  range: Last 90 days, with 5-minute DGA windows and per-device offline-gap baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for q in zeek_dns[device]: entropy = shannon(q.query);

      window5m_count = count(q where entropy > 3.5);

      if window5m_count > 5: dga_flag=true;

      gap = now - last_conn_ts(device, zeek_conn);

      alert when dga_flag and gap > p95(device_offline_history);

      track nxdomain_rate(device) as separate signal;

      output device, dga_count, gap, nxdomain_rate.'
- question: Does a time-series anomaly model flag a managed mobile device's network telemetry as anomalous,
    especially a sudden drop to zero activity shortly after a DGA flag?
  context: 'Under Impact, an LSTM autoencoder trained on 1-minute aggregations of conn.log metrics (connection
    count, total bytes, unique destination IPs, protocol distribution) can detect the abrupt collapse
    of activity that accompanies a device being locked. Alert when reconstruction error exceeds a dynamic
    threshold (e.g., 3 standard deviations above mean error). Priority is elevated when the anomaly is
    a sudden drop to zero preceded within 30 minutes by a DGA flag, and the alert lists the top-3 deviating
    metrics so the analyst can confirm the pattern. A positive result is a behavioral break consistent
    with device lockout; a negative result indicates normal traffic dynamics. References: [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Internal DNS resolvers, network traffic monitoring points at internet gateways.'
  range: Last 90 days for training; 1-minute aggregation windows for scoring.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'agg = aggregate(zeek_conn, 1m, [conn_count,total_bytes,uniq_dst,proto_dist]) per device;

      err = lstm_autoencoder.reconstruction_error(agg);

      alert when err > mean_err + 3*stddev_err;

      elevate when drop_to_zero and dga_flag within 30m prior;

      explain = top3_deviating_metrics(agg);

      output device, err, window, explain.'
- question: Did a managed mobile device connect to a domain or IP associated with rooting or jailbreaking
    tools (or Cydia repos), and does MDM confirm the device is jailbroken or rooted?
  context: 'Rooting/jailbreaking removes the OS protections that normally prevent device-admin abuse,
    making it a precursor to the T1642 Impact outcome. Ingesting a threat-intel feed of rooting/jailbreak
    tool domains/IPs (and Cydia repos) into the Zeek Intel Framework and alerting on intel.log matches
    where seen.where is Conn::IN_ORIG or DNS::IN_QUERY and the source IP is in the mobile DHCP range gives
    a critical, deterministic signal; an automated MDM API query then checks jailbreak/root compliance.
    On rooted Android, also alert on kernel avc: denied audit records for unauthorized keyguard/device-admin
    operations. A positive result is a device touching jailbreak infrastructure and/or failing root-compliance,
    raising the likelihood of imminent device-locking. References: [KeyRaider](https://unit42.paloaltonetworks.com/keyraider-ios-malware-steals-over-225000-apple-accounts-to-create-free-app-utopia/),
    [NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf),
    [SE Android](https://www.ndss-symposium.org/wp-content/uploads/2017/09/02_4.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek intel.log
  - MDM.ComplianceStatusLogs
  - 'NAI: Corporate Wi-Fi access points, VPN concentrators, web proxies, Mobile Device Management (MDM)
    platform.'
  range: Last 90 days, with immediate MDM compliance lookup on each hit.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "load intel_feed(rooting_jailbreak_domains_ips, cydia_repos) into zeek_intel;\nalert (critical)\
      \ when zeek_intel.seen.where in ['Conn::IN_ORIG','DNS::IN_QUERY']\n  and id.orig_h in mobile_dhcp_range;\n\
      trigger MDM_API check jailbreak/root compliance;\nalso alert on android auditd 'avc: denied' for\
      \ keyguard/device-admin ops;\noutput device, indicator, mdm_compliance, avc_records."
- question: Is a managed mobile device presenting an HTTP User-Agent string that is statistically rare
    (under 1% prevalence) for its OS group, or exhibiting novel syscall/Binder n-grams associated with
    seizing the keyguard?
  context: 'Within the Impact tactic, rooted or compromised devices frequently report unusual User-Agent
    strings, and the act of seizing the keyguard or resetting the passcode produces rare short syscall/Binder
    sequences. Daily, aggregate unique user_agent strings from http.log grouped by OS type, compute per-string
    frequency within each OS group, and alert on any device reporting a string below 1% prevalence. Complement
    this with per-UID syscall-sequence baselining that flags novel n-grams against the device''s established
    profile. A positive result identifies an anomalous client likely modified or running malware; a negative
    result keeps the device within fleet norms. References: [A Sense of Self for Unix Processes](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek intel.log
  - MDM.ComplianceStatusLogs
  - 'NAI: Corporate Wi-Fi access points, VPN concentrators, web proxies, Mobile Device Management (MDM)
    platform.'
  range: Last 90 days, with daily fleet-wide user-agent aggregation.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "daily: ua_counts = count(user_agent) by os_group from zeek_http;\nfreq = ua_count / total(os_group);\n\
      alert when device.user_agent_freq < 0.01;\nper_uid: flag novel syscall/Binder n-grams vs device_profile\n\
      \  (e.g., keyguard-seize / resetPassword sequence);\noutput device, user_agent, freq, os_group,\
      \ novel_ngrams."
- question: Does unsupervised clustering of per-device network-behavior profiles flag a managed mobile
    device as an outlier, and does it correlate with MDM jailbroken/rooted status or rare device-admin/keyguard
    API transitions?
  context: 'For the Impact tactic, DBSCAN over 24-hour per-device network-behavior profiles (unique destination
    ports, UDP/TCP ratio, average connection duration, total transfer volume, distinct DNS servers, destination
    IP entropy) surfaces devices behaving unlike the fleet. Cross-referencing outliers against MDM jailbroken/rooted
    status confirms compromise context. Additionally, modeling abstracted API-call transitions as Markov
    chains flags rare transitions into device-admin/keyguard packages and surfaces the top-3 anomalous
    transitions/features. A positive result is an outlier device whose behavior and API transitions align
    with rooting and device-locking preparation. References: [MaMaDroid](https://arxiv.org/pdf/1612.04433).'
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek intel.log
  - MDM.ComplianceStatusLogs
  - 'NAI: Corporate Wi-Fi access points, VPN concentrators, web proxies, Mobile Device Management (MDM)
    platform.'
  range: Last 90 days, with 24-hour per-device behavior profiles.
  queries:
  - technology: SIEM/ML pseudocode
    query: "profiles = per_device_24h([uniq_dst_ports,udp_tcp_ratio,avg_conn_dur,\n            total_bytes,distinct_dns,dst_ip_entropy]);\n\
      clusters = dbscan(profiles);\noutliers = points labeled noise;\ncross_ref outliers with MDM jailbroken/rooted;\n\
      markov = api_transition_model(device);\nflag rare transitions into device-admin/keyguard packages;\n\
      output device, outlier_features, mdm_status, top3_transitions."
- question: Did the MDM/EMM log a Device Administrator grant (Android) or configuration-profile install
    (iOS) for an app or certificate not on the enterprise allowlist, especially one that declares a DeviceAdminReceiver
    and calls lockNow()/resetPassword()?
  context: 'This is the most direct T1642 Impact evidence: on pre-Android-7 devices, an app granted Device
    Administrator and invoking lockNow()/resetPassword() (with wipeData/password-quality policies) can
    lock the user out, while on iOS an unsigned/unexpected configuration profile can impose restrictions.
    Forwarding all MDM/EMM audit logs to the SIEM and alerting on any ''Device Administrator Granted''
    (Android) or ''Profile Installed'' (iOS) event where the app package or profile signing certificate
    is not on the enterprise allowlist provides a high-priority floor rule; app-vetting evidence of DeviceAdminReceiver
    + lockNow()/resetPassword() escalates it to critical. The alert must carry the device identifier,
    owner, and a deep link to the MDM console. References: [Android DevicePolicyManager reference](https://developer.android.com/reference/android/app/admin/DevicePolicyManager),
    [NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf).'
  answer_sources:
  - MDM.UEMAuditLogs
  - SIEM.AlertLogs
  - Application Vetting
  - 'NAI: Mobile Device Management (MDM) platform, Enterprise Mobility Management (EMM) server logs, SIEM.'
  range: Last 90 days.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "forward MDM/EMM audit logs to SIEM;\nalert (high) when event in ['Device Administrator Granted','Profile\
      \ Installed']\n  and (app_package not in allowlist or profile_cert not in allowlist);\nescalate\
      \ (critical) when app_vetting shows DeviceAdminReceiver\n  and calls lockNow()/resetPassword() with\
      \ wipeData/password-quality;\noutput device_id, owner, app_or_cert, mdm_console_link."
- question: Is a managed mobile device exceeding its personal and peer-group baseline rates for new app
    installs, profile modifications, or device-admin grants, or showing a spike in failed unlock attempts
    followed by lockout?
  context: 'Under the Impact tactic, a surge in install/profile/device-admin activity, or a burst of failed
    unlock attempts ending in user lockout, can mark the onset of device-locking abuse. From MDM logs,
    establish a 90-day baseline of new-install rate, profile-modification rate, and device-admin grants
    per device and peer group, then alert when a device''s daily rate (Frequency) exceeds both its personal
    and peer-group 99th percentile. Track the distinct State signal of a spike in FAILED unlock attempts
    followed by lockout. Additionally, score apps by relative system-API-package call frequency (calls
    into android.app.admin/DevicePolicyManager and keyguard/crypto packages), which strongly discriminates
    locking ransomware. References: [Scalas et al.](https://arxiv.org/abs/1805.09563).'
  answer_sources:
  - MDM.UEMAuditLogs
  - SIEM.AlertLogs
  - Application Vetting
  - 'NAI: Mobile Device Management (MDM) platform, Enterprise Mobility Management (EMM) server logs, SIEM.'
  range: Last 90 days, with a 90-day MDM baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = per_device_and_peer(install_rate,profile_mod_rate,admin_grants, window=90d);

      alert when daily_rate(device) > p99(device) and > p99(peer);

      state_signal: alert on spike(failed_unlocks) followed by lockout;

      api_score = relative_call_freq(android.app.admin, keyguard, crypto);

      flag high api_score apps;

      output device, rate, peer_p99, failed_unlocks, api_score.'
- question: Does a supervised classifier score a newly installed app (from MDM/app-vetting) as high-risk
    based on its permissions, requested device-admin policies, presence of lock/resetPassword code, source,
    prevalence, age, and signer reputation?
  context: 'For the Impact tactic, the surest pre-emptive signal is an app whose static features scream
    device-locking ransomware. A Random Forest scoring every newly installed app on permission categories,
    requested device-admin policies, presence of lock/resetPassword and threatening-string resources,
    application source, fleet prevalence, app age, and signer reputation can catch these before they fire.
    High-risk classifications trigger device quarantine via the MDM API and a high-priority ticket, and
    the alert MUST surface the top-3 contributing features (e.g., device-admin permission, resetPassword
    call, threatening string) so the analyst can validate the verdict. A positive result is a high-confidence
    locking-malware install. References: [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf),
    [Scalas et al.](https://arxiv.org/abs/1805.09563), [DNA-Droid](https://link.springer.com/chapter/10.1007/978-3-319-64701-2_14).'
  answer_sources:
  - MDM.UEMAuditLogs
  - SIEM.AlertLogs
  - Application Vetting
  - 'NAI: Mobile Device Management (MDM) platform, Enterprise Mobility Management (EMM) server logs, SIEM.'
  range: Last 90 days for scoring; retrain on labeled benign/malicious app corpora.
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [permission_categories,device_admin_policies,has_lock_or_resetPassword,\n     \
      \       threatening_strings,app_source,fleet_prevalence,app_age,signer_rep];\nscore = random_forest.predict_proba(features);\n\
      alert when score high;\ntrigger MDM quarantine + high-priority ticket;\nexplain = top3_features(features);\n\
      output device, app, score, explain."
- question: Does an LSTM sequence model over MDM/Android audit log keys flag an improbable chain such
    as device-admin grant followed by lockNow()/resetPassword(), repeated failed unlocks, and user lockout?
  context: 'This addresses the Impact outcome at the event-sequence level: the chain device-admin-grant
    -> lockNow/resetPassword -> repeated failed unlocks -> user lockout is precisely the T1642 attack
    narrative, and it is an improbable sequence for benign operations. Training an LSTM over normalized
    Android/MDM audit log keys to model normal event sequences lets the model flag low-probability next-keys
    and surface the deviating log key for analyst triage. A positive result is a detected locking sequence
    on a device; a negative result indicates normal administrative event flow. This complements the static
    and rate-based detections by catching the temporal pattern even when individual events look benign.
    References: [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
  answer_sources:
  - MDM.UEMAuditLogs
  - SIEM.AlertLogs
  - Application Vetting
  - 'NAI: Mobile Device Management (MDM) platform, Enterprise Mobility Management (EMM) server logs, SIEM.'
  range: Last 90 days for sequence training and scoring.
  queries:
  - technology: SIEM/ML pseudocode
    query: "seq = normalized_audit_log_keys(android/mdm) per device;\nmodel = lstm_next_key(seq);\nalert\
      \ when observed_next_key probability < threshold;\nflag chain: device_admin_grant -> lockNow/resetPassword\n\
      \  -> repeated failed_unlocks -> user_lockout;\noutput device, sequence, deviating_key, probability."
