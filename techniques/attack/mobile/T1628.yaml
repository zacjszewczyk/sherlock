name: 'T1628: Hide Artifacts'
id: 1878bcd5-9923-4822-93e1-00803184c695
description: 'Investigate whether an adversary is hiding artifacts on managed Android mobile devices to
  evade detection on the enterprise fleet. Mobile operating systems expose developer APIs that let an
  application suppress its launcher icon (omitting a MAIN/LAUNCHER intent-filter or disabling the launcher
  component via setComponentEnabledSetting) while it remains installed and continues to execute. Malware
  abuses these legitimate features to disappear from the user''s app drawer, then persists in the background,
  communicates over the network, and accesses sensitive sensors. This playbook helps an analyst hunt for
  two core artifact-hiding signatures using MDM/UEM application inventory, Mobile Threat Protection (MTP)
  telemetry, and threat intelligence: (1) non-whitelisted iconless applications that remain installed
  and running, enriched with manifest/permission, signer certificate, and information-flow analysis; and
  (2) running processes reported by the MTP agent that map to no package in the MDM/UEM inventory, indicating
  execution from an unmanaged source. It layers deterministic symbolic-logic rules (whitelist set-difference,
  signer-mismatch, ordered hide-chain sequences), per-tenant statistical baselining (fleet prevalence,
  permission entropy, volume/frequency/state physics, failure-mode rates, Jaccard similarity), and explainable
  machine-learning detectors (Random Forest/XGBoost, autoencoders, Isolation Forest, LSTM sequence models,
  Markov-chain abstracted-API behavioral profiles) so detection never depends on a single method and every
  alert surfaces the features driving it for fast SOC triage.'
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
