tags: none
questions:
- question: Are there application packages in the MDM/UEM inventory that have no launcher icon (no MAIN/LAUNCHER
    intent-filter, or a launcher component disabled via setComponentEnabledSetting) yet remain installed
    and executing, and are NOT on the corporate whitelist of apps approved to run without a user-facing
    icon?
  context: 'Hiding the launcher icon is the defining behavior of this Defense Evasion technique: the app
    vanishes from the user''s app drawer while continuing to run in the background. Query MDM/UEM inventories
    for packages with has_launcher_icon=false that are still installed and running, and alert when the
    package is absent from the corporate whitelist; enrich every hit with threat-intel hash/name matches.
    Layer the interpretable [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf)
    manifest/component/intent rules - iconless combined with high-risk permissions/intents such as SEND_SMS,
    RECEIVE_BOOT_COMPLETED, or BIND_DEVICE_ADMIN strongly indicates abuse. Add a deterministic signer/certificate-mismatch
    rule per [Li et al.](https://arxiv.org/abs/1811.08520) (repackaged carrier: signer differs from the
    legitimate original of a matching package name) and a [TaintDroid](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf)-style
    information-flow rule that fires when an iconless app propagates tainted location/IMEI/contacts/mic/camera
    data to a network sink. Keep whitelist membership and signer equality as a non-removable deterministic
    floor. A positive result is high-confidence evidence of intentional artifact hiding and warrants quarantine;
    a negative result does not clear the device because a benign-looking but uncatalogued utility may
    still be malicious.'
  answer_sources:
  - MDM/UEM application inventory logs (package list, manifest flags, signer certificate)
  - Corporate application whitelist database
  - Mobile Threat Protection (MTP) static-analysis and information-flow telemetry
  - Threat intelligence indicators
  - 'NAI: MDM/UEM management console and underlying database; The population of managed corporate-owned
    and BYOD mobile devices.'
  range: Last 90 days, with alerting on each new iconless non-whitelisted package.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'alert when app.has_launcher_icon==false and app.installed and app.running and app.package
      not in corporate_whitelist;

      enrich with ti_match(app.hash, app.name);

      drebin_rule: flag iconless and any(perm in [SEND_SMS,RECEIVE_BOOT_COMPLETED,BIND_DEVICE_ADMIN]);

      signer_rule: alert when app.signer != legit_signer(app.package);

      flow_rule: alert when tainted(location|IMEI|contacts|mic|camera) reaches network_sink;

      output package, signer, perms, ti_hits, device_id.'
- question: Across the managed fleet, which iconless packages are statistically rare (low prevalence),
    and which devices show abnormally high iconless-app counts, elevated permission-set entropy, or unusual
    background volume/frequency and failure-state rates relative to the per-tenant baseline?
  context: 'Stealthy hidden apps tend to be uncommon across the fleet and over-permissioned relative to
    benign software, so baselining exposes them even without prior intel. Compute fleet prevalence of
    each iconless package and flag those below the 5th percentile; flag per-device iconless counts above
    the 98th percentile and permission-set entropy exceeding the whitelist mean by more than 2 standard
    deviations (per the static-feature ensembles surveyed by [Chowdhury et al.](https://arxiv.org/abs/2307.02412)).
    Project the permission/feature matrix onto the benign principal subspace and alert on large residual
    deviation using the [Yerima et al.](https://arxiv.org/abs/1607.08087) eigenspace/PCA method. Capture
    the physics of each app''s activity: Volume (background network bytes/day, requested-permission count),
    Frequency (background launches/min, network connections/min), and State (success/fail of background
    launches, blocked connections, SELinux/AVC permission denials), profiling elevated failure rates -
    permission-denial bursts, failed-launch retries - as distinct stealthy-retry signals. Derive all thresholds
    per-tenant from the deployed baseline rather than fixed constants. For Defense Evasion this catches
    hidden apps that evade fixed rules; a cluster of rarity, high entropy, and retry failures on one package
    is a strong lead, while typical prevalence and entropy support a benign read.'
  answer_sources:
  - MDM/UEM application inventory logs (package list, manifest flags, signer certificate)
  - Corporate application whitelist database
  - Mobile Threat Protection (MTP) static-analysis and information-flow telemetry
  - Threat intelligence indicators
  - 'NAI: MDM/UEM management console and underlying database; The population of managed corporate-owned
    and BYOD mobile devices.'
  range: Last 90 days, with per-tenant baselines recomputed continuously.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per package: prevalence=count(devices_with_pkg)/fleet; flag prevalence < p5;

      per device: flag iconless_count > p98; flag perm_entropy > whitelist_mean + 2*std;

      pca_residual = residual(perm_feature_matrix on benign_principal_subspace); alert when large;

      physics per app: Volume(net_bytes_day,perm_count), Frequency(bg_launch_min,conn_min), State(fail_launch,blocked_conn,avc_denials);

      flag failure_rate >> baseline; output package, device_id, prevalence, entropy, residual, failure_signals.'
- question: When an explainable classifier and anomaly models score each iconless app on prevalence, store
    source, permissions, component visibility, signer reputation, and post-hide behavior, which apps exceed
    the malicious-probability quarantine threshold, and what features drove that score?
  context: Machine learning generalizes beyond fixed rules to catch novel hidden-app variants while keeping
    alerts explainable for triage. Train an explainable Random Forest/Gradient Boosting/XGBoost classifier
    (per [Chowdhury et al.](https://arxiv.org/abs/2307.02412)) on prevalence, source store, permission
    count/entropy, high-risk-permission flags, component visibility, and signer reputation; quarantine
    when malicious probability exceeds 0.85 and emit the top-3 contributing features (e.g., iconless +
    SEND_SMS + low prevalence) in the alert via model feature importances, mirroring [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf)'s
    explainable linear weights. In parallel run a deep [autoencoder](https://arxiv.org/abs/1901.07315)
    over the static feature vector and alert on high reconstruction error (reporting the largest-error
    features), and an [Isolation Forest](https://doi.org/10.1145/2133360.2133363) over the combined (prevalence,
    permission entropy, iconless, background-network rate) vector. Model post-hide behavior with the obfuscation-resilient
    Markov-chain abstracted-API features of [MaMaDroid](https://arxiv.org/abs/1612.04433), and flag families
    of iconless apps sharing signer/API/distribution edges with the [AiDroid](https://arxiv.org/abs/1811.01027)
    heterogeneous-information-network DNN. For Defense Evasion, agreement among the supervised verdict,
    reconstruction error, and outlier score raises confidence that an app is deliberately hidden malware;
    explainable features let analysts validate against legitimate iconless utilities.
  answer_sources:
  - MDM/UEM application inventory logs (package list, manifest flags, signer certificate)
  - Corporate application whitelist database
  - Mobile Threat Protection (MTP) static-analysis and information-flow telemetry
  - Threat intelligence indicators
  - 'NAI: MDM/UEM management console and underlying database; The population of managed corporate-owned
    and BYOD mobile devices.'
  range: Last 90 days for scoring, with periodic retraining against concept drift.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [prevalence, source_store, perm_count, perm_entropy, high_risk_perm_flags, component_visibility,
      signer_reputation];

      p = RandomForest_or_XGBoost.predict_proba(features);

      if p > 0.85: quarantine; emit top3_features(importances);

      ae_err = autoencoder(static_features); alert when ae_err high; report top_error_features;

      iso = IsolationForest([prevalence,perm_entropy,iconless,bg_net_rate]); alert when outlier;

      behavior = MaMaDroid_markov(api_transitions); family = AiDroid_HIN(signer/api/dist edges);

      output package, p, ae_err, iso_score, top_features.'
- question: Are there processes reported by the Mobile Threat Protection (MTP) agent that map to NO application
    package in the MDM/UEM inventory for that same device, and do any match the ordered hide-chain sequence
    of install -> launcher disablement -> sustained background activity?
  context: A running process with no corresponding installed package is direct evidence that code is executing
    from an unmanaged source - exactly what an adversary achieves after hiding artifacts. Map every MTP-reported
    process to MDM inventory by package or path and alert on processes with no inventory mapping; enrich
    with threat-intel hashes or names. This deterministic set-difference floor is non-removable. Add an
    ordered log-key rule expressing the causal hide chain (app install -> launcher component disabled/icon
    suppressed -> sustained background process activity) so the sequence itself fires, as formalized for
    log-key sequences by [DeepLog](https://doi.org/10.1145/3133956.3134015); define benign allow-listed
    package/family API transitions from the abstracted-API behavioral profiles of [MaMaDroid](https://arxiv.org/abs/1612.04433)
    and alert on transitions a benign iconless utility should never make. For Defense Evasion a positive
    result is strong evidence of hidden execution and merits immediate device isolation; absence of unmapped
    processes does not fully clear a device because inventory gaps or timing can mask a transient process.
  answer_sources:
  - MTP process execution logs (process name, path, package, parent)
  - MDM/UEM application inventory logs
  - Device network/connection logs (per-process byte counts, blocked connections)
  - Threat intelligence indicators
  - 'NAI: Mobile Threat Protection (MTP) platform console; MDM/UEM management console; Endpoint file systems
    and process tables on managed mobile devices.'
  range: Last 90 days, with real-time correlation of MTP process events against MDM inventory.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'for each mtp_process: mapped = match(process.package or process.path, mdm_inventory[device]);

      alert when not mapped;  # non-removable set-difference floor

      enrich with ti_match(process.hash, process.name);

      deeplog_seq: alert when ordered(app_install -> launcher_disabled -> sustained_bg_activity);

      mamadroid_rule: alert when api_transition not in benign_allowlist(package/family);

      output device_id, process, path, ti_hits, sequence_id.'
- question: For each device, how dissimilar is its set of unmapped processes from the golden-image baseline
    (Jaccard < 0.5), and what are the Volume, Frequency, and failure-State physics of each unmapped process
    compared with the per-tenant baseline?
  context: 'Unmapped processes that diverge sharply from a known-good image, especially ones with heavy
    background egress or repeated failures, point to hidden malicious execution. Compute Jaccard similarity
    of each device''s unmapped-process set against a golden-image baseline and alert when similarity falls
    below 0.5. Quantify the physics per unmapped process: Volume (egress bytes/day), Frequency (connections/min,
    respawns/min), and State (failed launches, blocked connections, permission/AVC denials), profiling
    elevated failure/blocked rates as distinct stealthy-retry signals - a hidden process repeatedly retrying
    after denials is a hallmark of evasive persistence. Rank rare per-device count/behavior vectors with
    an [Isolation Forest](https://doi.org/10.1145/2133360.2133363), deriving thresholds per-tenant from
    the deployed baseline. For Defense Evasion this surfaces devices whose runtime process set has drifted
    toward unmanaged, retry-heavy execution; low Jaccard plus high egress and denial bursts is a strong
    lead, while a set close to the golden image supports a benign read.'
  answer_sources:
  - MTP process execution logs (process name, path, package, parent)
  - MDM/UEM application inventory logs
  - Device network/connection logs (per-process byte counts, blocked connections)
  - Threat intelligence indicators
  - 'NAI: Mobile Threat Protection (MTP) platform console; MDM/UEM management console; Endpoint file systems
    and process tables on managed mobile devices.'
  range: Last 90 days, with per-tenant baselines and golden-image comparison.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per device: J = jaccard(unmapped_process_set, golden_image_baseline);

      alert when J < 0.5;

      physics per process: Volume(egress_bytes_day), Frequency(conn_min,respawn_min), State(fail_launch,blocked_conn,avc_denials);

      flag elevated failure/blocked rates as stealthy-retry;

      iso = IsolationForest([count,egress,conn_min,respawn_min,denials]); alert when outlier;

      output device_id, jaccard, physics, iso_score.'
- question: Does an LSTM sequence model over each device's unmapped-process event stream flag events outside
    its top-g predictions or high reconstruction error, and does a Markov-chain API-behavior classifier
    match the process to known malware behavior?
  context: Sequence learning detects anomalous patterns of hidden-process activity that point rules and
    static baselines miss. Train an LSTM sequence model over per-device time series of unmapped-process
    events ([DeepLog](https://doi.org/10.1145/3133956.3134015)) and alert when an observed event falls
    outside the top-g predicted next events, or when an LSTM-autoencoder reconstruction error exceeds
    a dynamic threshold, surfacing the specific offending event/feature in the alert for explainability.
    Complement with the [MaMaDroid](https://arxiv.org/abs/1612.04433) Markov-chain abstracted-API behavioral
    classifier to score whether a process's package/family call-transition profile matches known malware
    behavior, and adopt the deep-learning robustness practices catalogued by [Liu et al.](https://arxiv.org/abs/2103.05292)
    - periodic retraining and API abstraction to resist concept drift and obfuscation. For Defense Evasion
    this catches evolving hidden-execution behavior; a sequence anomaly that coincides with a malware-like
    API transition profile strongly indicates a concealed malicious process, while in-distribution sequences
    support a benign interpretation.
  answer_sources:
  - MTP process execution logs (process name, path, package, parent)
  - MDM/UEM application inventory logs
  - Device network/connection logs (per-process byte counts, blocked connections)
  - Threat intelligence indicators
  - 'NAI: Mobile Threat Protection (MTP) platform console; MDM/UEM management console; Endpoint file systems
    and process tables on managed mobile devices.'
  range: Last 90 days, with continuous sequence scoring and periodic retraining.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seq = per_device_timeseries(unmapped_process_events);

      lstm = DeepLog(train_history); pred = lstm.next(seq);

      alert when observed_event not in top_g(pred);

      ae_err = lstm_autoencoder(seq); alert when ae_err > dynamic_threshold; report offending_event;

      behavior = MaMaDroid_markov(api_transitions); alert when matches known_malware_profile;

      retrain periodically (Liu et al. drift/obfuscation robustness);

      output device_id, anomalous_event, ae_err, behavior_score.'
