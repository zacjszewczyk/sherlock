name: 'T1624: Event Triggered Execution'
id: 202dc3b9-a1bf-4f05-ba16-d95e5008692d
description: Investigate whether an adversary is maintaining persistence on managed Android mobile devices
  by abusing event-triggered execution mechanisms. On mobile operating systems, applications can subscribe
  to system events — such as device boot completion (BOOT_COMPLETED), receipt of an SMS message (SMS_RECEIVED),
  or connectivity changes (CONNECTIVITY_CHANGE) — via broadcast receivers, WorkManager jobs, JobScheduler
  tasks, or intent filters declared in AndroidManifest.xml. Adversaries abuse these subscriptions to automatically
  and repeatedly execute malicious code whenever the chosen event fires, surviving reboots and user inactivity.
  This playbook helps an analyst (1) inspect installed/sideloaded application manifests for high-risk
  receiver + permission combinations and known-bad indicators, and (2) correlate system trigger events
  with the bursts of anomalous network activity (volume, frequency, DNS entropy, beaconing, and failure
  telemetry) that follow them, in order to surface event-triggered persistence and any resulting command-and-control
  or data-exfiltration behavior.
type: technique
related:
- tactic_id: TA0028
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Do any installed or sideloaded applications register a high-risk system broadcast receiver
    (such as BOOT_COMPLETED, SMS_RECEIVED, or CONNECTIVITY_CHANGE) while their package name, signing certificate,
    or embedded C2 host/IP matches a known-bad malware corpus or mobile threat intelligence?
  context: 'This is the deterministic exact-match floor for the Persistence tactic: an app that both subscribes
    to an auto-start/trigger event AND is independently identifiable as malicious (by package name, signing
    cert, or hard-coded C2 indicator from AV-labeled corpora such as AndroZoo or mobile threat intelligence)
    is high-confidence event-triggered persistence. Parse AndroidManifest.xml for every app in the managed
    fleet and cross-reference its identity and embedded network indicators against threat-intel feeds.
    A positive match should always alert regardless of any statistical or ML scoring, because the adversary
    has reused known-bad code to guarantee automatic re-execution whenever the chosen system event fires.'
  answer_sources:
  - MDM application inventory logs
  - Android application manifests
  - Application vetting system reports
  - Threat intelligence indicators
  - 'NAI: Managed mobile device fleet, Mobile Device Management (MDM) server, Application vetting/sandbox
    environment'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FROM app_inventory, android_manifests
      WHERE manifest.receivers ANY IN [BOOT_COMPLETED, SMS_RECEIVED, CONNECTIVITY_CHANGE]
        AND ( package_name IN threatintel.known_bad_packages
              OR signing_cert_sha256 IN threatintel.known_bad_certs
              OR manifest.embedded_hosts ANY IN threatintel.c2_iocs )
      ALERT 'Known-bad app with high-risk auto-start receiver' SEVERITY high
- question: Does any application declare a dangerous combination of permissions and broadcast receivers
    — for example an SMS_RECEIVED receiver together with SEND_SMS, RECEIVE_BOOT_COMPLETED auto-start together
    with phone/SMS/accessibility abuse permissions, or an exported/unprotected receiver for a system broadcast
    — regardless of the app's reputation?
  context: Independent of any reputation or threat-intel match, certain manifest field combinations are
    inherently abusable for persistence and should fire deterministic Kirin-style boolean rules. An app
    that auto-starts on boot and also holds SMS/phone/accessibility permissions can persistently intercept
    messages or drive the UI; an exported, permission-unprotected receiver for a system broadcast exposes
    a broadcast-injection surface that lets other components trigger the malicious code. Codify each install-time
    rule (per Kirin and ComDroid research) over manifest fields and treat each fired rule as a discrete,
    named indicator in the alert text so analysts see exactly which dangerous combination was present.
    These rules catch novel/unlabeled malware that statistical and ML layers might miss.
  answer_sources:
  - MDM application inventory logs
  - Android application manifests
  - Application vetting system reports
  - Threat intelligence indicators
  - 'NAI: Managed mobile device fleet, Mobile Device Management (MDM) server, Application vetting/sandbox
    environment'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FROM android_manifests
      RULE_1 = (RECEIVE 'SMS_RECEIVED') AND (PERM 'SEND_SMS')
      RULE_2 = (RECEIVE 'BOOT_COMPLETED') AND (PERM IN [READ_SMS, CALL_PHONE, BIND_ACCESSIBILITY_SERVICE])
      RULE_3 = (receiver.exported == true) AND (receiver.permission == null)
               AND (receiver.intent_filter IN system_broadcasts)
      IF RULE_1 OR RULE_2 OR RULE_3:
        ALERT 'Dangerous permission/receiver combo' DETAIL fired_rules
- question: Within each app-store category, which applications request permission-receiver pairs that
    are statistically rare — exceeding the 98th percentile of pair-rarity for their category when measured
    against the managed fleet and a large reference corpus?
  context: Even without a deterministic rule hit, an unusual pairing of a permission and a trigger receiver
    for an app's category is a strong persistence signal. Build prevalence baselines of permission-receiver
    pairs per app-store category using both the managed fleet and a large reference corpus (e.g., AndroZoo),
    then score each app by how rare its declared pairs are for its category and flag those above the 98th
    percentile. The count of high-risk receivers declared and the count of dangerous permissions requested
    are first-class features (per Drebin). Derive the percentile cutoff per-fleet rather than hardcoding
    so the baseline tracks your actual environment. A flashlight or wallpaper app declaring BOOT_COMPLETED
    + RECEIVE_SMS is the kind of category-anomalous outlier this surfaces.
  answer_sources:
  - MDM application inventory logs
  - Android application manifests
  - Application vetting system reports
  - Threat intelligence indicators
  - 'NAI: Managed mobile device fleet, Mobile Device Management (MDM) server, Application vetting/sandbox
    environment'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      BASELINE per category:
        prevalence[pair] = freq of (permission, receiver) over fleet + reference_corpus
      FOR each app:
        rarity_score = sum( -log(prevalence[pair]) for pair in app.pairs )
        features = {n_highrisk_receivers, n_dangerous_perms}
        cutoff = percentile(category_rarity_scores, 98)
      IF rarity_score > cutoff: ALERT 'Category-rare permission/receiver pair'
- question: When an explainable supervised classifier scores an application's manifest, which apps exceed
    a malice probability of 0.90, and what are the top-3 manifest features (e.g., BOOT_COMPLETED receiver,
    SEND_SMS, suspicious API) driving that score?
  context: To generalize beyond fixed rules and prevalence baselines, train a Gradient Boosting or linear-SVM
    classifier on one-hot permission, declared-component, and filtered-intent features extracted from
    manifests, and alert when malice probability exceeds 0.90. Following the explainable Drebin design,
    always surface the top-3 contributing features in the alert so an analyst can validate the verdict
    and tie it to the persistence mechanism (which trigger event and which abused permission). Retrain
    on time-correct holdouts and monitor concept drift (per TESSERACT) to prevent performance decay as
    malware evolves. A high-probability score with BOOT_COMPLETED and SMS permissions among the top features
    is a strong event-triggered persistence candidate warranting manifest review and app removal.
  answer_sources:
  - MDM application inventory logs
  - Android application manifests
  - Application vetting system reports
  - Threat intelligence indicators
  - 'NAI: Managed mobile device fleet, Mobile Device Management (MDM) server, Application vetting/sandbox
    environment'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      model = GradientBoosting.train(features=onehot(permissions, components, intent_filters),
                                     labels=known_good_bad, holdout=time_correct)
      FOR each app:
        p = model.predict_proba(app.manifest_features)
        IF p > 0.90:
          ALERT 'Manifest classified malicious' prob=p top3=model.explain(app)[:3]
      MONITOR concept_drift; RETRAIN periodically
- question: In the 5-minute window immediately after an MDM/MobileEDR system trigger event (boot completed,
    SMS received, connectivity change), did the device contact a destination IP, domain, TLS certificate,
    or JA3/JA3S that matches command-and-control threat intelligence — or read sensitive data (IMEI, SMS,
    contacts, location) and then immediately egress it?
  context: This deterministic correlation is the network-side detection floor for event-triggered persistence.
    Join MDM/MobileEDR trigger events with Zeek conn/dns/ssl/http logs within a 5-minute window and alert
    on any destination IP/domain, TLS certificate, or JA3/JA3S fingerprint matching C2 intelligence. Layer
    host-side source-to-sink (taint) rules so the playbook also fires when post-trigger code reads sensitive
    identifiers or user data and then performs network egress (per TaintDroid). Because the malicious
    code runs precisely because the event fired, this tight temporal join strongly attributes the C2/exfil
    traffic to the persistence mechanism rather than to incidental background activity. Keep these exact
    matches as the floor beneath the statistical and ML layers.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - MDM event logs
  - Threat intelligence indicators
  - 'NAI: Corporate Wi-Fi network gateways, VPN concentrators, Internal and external DNS resolvers'
  range: Last 90 days; pivot to a 5-minute window immediately following each system trigger event
  queries:
  - technology: Zeek/pseudocode
    query: |-
      FOR each trigger_event(device, t0) IN mdm_events:
        win = conn,dns,ssl,http WHERE host==device AND ts BETWEEN t0 AND t0+5min
        IF win.dest_ip IN ti.c2_ips OR win.query IN ti.c2_domains
           OR win.ssl_cert IN ti.c2_certs OR win.ja3/ja3s IN ti.c2_ja3:
          ALERT 'Post-trigger C2 contact'
        IF host.read(IMEI|SMS|CONTACTS|LOCATION) THEN host.network_egress within win:
          ALERT 'Post-trigger source-to-sink exfil'
- question: After a system trigger event, does the device's post-event connection count, bytes sent/received,
    unique-domain count, or DNS subdomain Shannon entropy deviate from its own 30-day baseline by a Modified
    Z-Score above 3.5 — or show low-jitter periodic beaconing initiated by the trigger?
  context: Adversary code that fires on an event often produces a measurable burst of traffic that a static
    IOC list will miss. Build 30-day per-device baselines for post-event connection count, bytes sent/received,
    and unique-domain count (volume + frequency), plus DNS subdomain Shannon entropy, then alert when
    the robust Modified Z-Score exceeds 3.5 or DNS entropy departs from the device norm (high entropy
    suggests DGA or tunneling). Add FFT periodicity analysis to flag low-jitter beaconing that begins
    right after the trigger (per BAYWATCH). Derive all thresholds per-fleet and on time-correct windows
    (per TESSERACT). A burst that recurs after each boot or SMS event is a hallmark of event-triggered
    persistence calling home.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - MDM event logs
  - Threat intelligence indicators
  - 'NAI: Corporate Wi-Fi network gateways, VPN concentrators, Internal and external DNS resolvers'
  range: Last 90 days; pivot to a 5-minute window immediately following each system trigger event
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      BASELINE 30d per device: conn_count, bytes_out, bytes_in, unique_domains, dns_entropy
      FOR each trigger_event(device, t0):
        m = metrics(device, t0..t0+5min)
        mz = 0.6745*(m - median)/MAD
        IF any(mz > 3.5) OR dns_entropy deviates from norm:
          ALERT 'Anomalous post-trigger network burst'
        IF FFT(connection_intervals).peak indicates low-jitter beacon:
          ALERT 'Trigger-initiated beaconing'
- question: In the 5-minute window after a system trigger, do per-device failure signals — NXDOMAIN responses,
    failed/blocked TCP connections, and TLS handshake failures — exceed the device's 99th percentile,
    suggesting probing of dead-drop resolvers, DGA C2, or rotating infrastructure?
  context: 'Failure telemetry is its own distinct signal (a state metric) and is frequently overlooked.
    Malicious code triggered by an event often probes infrastructure that is partly unavailable: DGA domains
    that are unregistered (NXDOMAIN), C2 hosts that are down (failed/blocked TCP), or endpoints that reject
    TLS handshakes. Count these failures per device in the 5-minute post-trigger window and alert when
    they exceed the per-device 99th percentile. Baseline DNS failure entropy alongside successful-query
    entropy so rotating/dead-drop infrastructure stands out. A spike of NXDOMAINs or handshake failures
    right after each boot or connectivity change points to event-triggered code attempting to reach resilient
    C2 infrastructure.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - MDM event logs
  - Threat intelligence indicators
  - 'NAI: Corporate Wi-Fi network gateways, VPN concentrators, Internal and external DNS resolvers'
  range: Last 90 days; pivot to a 5-minute window immediately following each system trigger event
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      BASELINE per device: p99 of {nxdomain, tcp_failed_blocked, tls_handshake_fail}
      FOR each trigger_event(device, t0):
        f = failure_counts(device, t0..t0+5min)
        IF f.nxdomain > p99 OR f.tcp_failed > p99 OR f.tls_fail > p99:
          ALERT 'Excess post-trigger connection failures'
        COMPARE dns_failure_entropy vs dns_success_entropy
- question: When an LSTM autoencoder (and a parallel Isolation Forest) models the 5-minute post-event
    behavior vector — connection count, data volume, protocol distribution, unique domains, failure counts,
    and abstracted API-call/log-key sequence — which post-trigger windows produce reconstruction error
    or outlier scores above the dynamic threshold, and which top-3 features drove the deviation?
  context: To capture complex, multi-feature post-trigger behavior that simple thresholds miss, train
    an LSTM autoencoder on 5-minute post-event vectors and alert when reconstruction error exceeds a dynamic
    threshold, always reporting the top-3 contributing features for analyst triage. Run an unsupervised
    Isolation Forest in parallel for feature-contribution-explainable outlier scoring, and model the abstracted
    post-trigger API-call / log-key sequence for deviation (per MaMaDroid and DeepLog). Together these
    detect novel event-triggered persistence whose network and behavioral footprint differs from the device's
    learned normal sequence even when no single metric crosses a hard threshold. Periodically retrain
    to counter concept drift (per TESSERACT). A high reconstruction error tied to post-boot egress and
    unusual API sequences is a strong lead for hands-on investigation.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - MDM event logs
  - Threat intelligence indicators
  - 'NAI: Corporate Wi-Fi network gateways, VPN concentrators, Internal and external DNS resolvers'
  range: Last 90 days; pivot to a 5-minute window immediately following each system trigger event
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      X = post_event_vector(conn_count, data_volume, proto_dist, unique_domains, failures,
                            abstracted_api_sequence)  # 5-min windows
      ae = LSTM_autoencoder.train(X_normal)
      iforest = IsolationForest.train(X)
      FOR each post_event_window w:
        err = ae.reconstruction_error(w)
        IF err > dynamic_threshold OR iforest.score(w) outlier:
          ALERT 'Anomalous post-trigger behavior' top3=explain(w)[:3]
      RETRAIN periodically to counter concept drift
