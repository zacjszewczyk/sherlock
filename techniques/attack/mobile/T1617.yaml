name: 'T1617: Hooking'
id: 9ae89385-042f-4339-a1a5-4ff12b577eee
description: Investigate whether an adversary is using hooking and root frameworks (Magisk, Xposed/LSPosed,
  Cydia Substrate, Frida) on corporate-managed Android devices to evade defenses by hiding artifacts,
  rewriting system API return values, and suppressing security-relevant signals. This playbook helps an
  analyst hunt for deterministic framework artifacts (package names, file paths, processes, frida-server
  on port 27042, XposedBridge/Substrate stack frames, TracerPid != 0, ArtMethod entrypoint rewriting),
  out-of-band hardware-rooted attestation contradictions (Play Integrity verdicts below MEETS_DEVICE_INTEGRITY,
  Key Attestation verifiedBootState != Verified or unlocked bootloader), statistical drift in API/syscall
  volume, frequency, and state after a device posture change, low-probability API transitions, rare obfuscation/dynamic-loading
  combinations, and explainable machine-learning verdicts over static, behavioral, kernel/eBPF, and device+network
  telemetry. It combines deterministic watchlists, server-side attestation enforcement, statistical baselining,
  and ML so that detection never depends on a single check that a hooked device could itself blind, and
  surfaces explainable feature drivers for fast SOC triage.
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Do any corporate-managed Android devices show deterministic artifacts of a known root or hooking
    framework -- Magisk, Xposed/LSPosed, Cydia Substrate, or Frida -- in MDM application inventory (package
    names, file paths, running processes) or in network logs reaching known root-framework or hooking-module
    repository domains?
  context: 'Hooking on Android almost always rides on a 3rd-party root framework, and those frameworks
    leave deterministic fingerprints: known package names, file paths, and process names, plus network
    calls to the repositories that host the frameworks and their modules. In the Defense Evasion tactic
    the adversary uses these frameworks to hide artifacts and rewrite API outputs, so catching the framework
    itself is the most reliable floor beneath the behavioral detectors. Maintain a version-controlled
    watchlist of framework package/file/process indicators defined per [Hooking, MITRE ATT&CK T1617](https://attack.mitre.org/techniques/T1617/),
    query MDM inventories for exact matches, and search Zeek http/dns logs for known module-repository
    domains; alert on any match. Allowlist sanctioned developer/test devices to tune noise but never remove
    the deterministic match. A positive result is high-confidence and should trigger device isolation
    and posture review; a negative result does not clear a device because a hidden framework may evade
    inventory.'
  answer_sources:
  - MDM application inventory logs
  - MobileEDR:telemetry (on-device anti-tamper/integrity probes)
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Threat intelligence indicators
  - 'NAI: Endpoints: Corporate-managed Android devices. Network: DNS resolvers, web proxies, and VPN concentrators
    capturing mobile traffic. Servers: MDM/UEM and Mobile EDR log aggregation platforms.'
  range: Last 90 days, with real-time alerting on any match.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'watchlist = framework_pkgs_paths_procs([''magisk'',''xposed'',''lsposed'',''substrate'',''frida'',''frida-server'']);

      alert when mdm_inventory.package in watchlist or mdm_inventory.path in watchlist or proc.name in
      watchlist;

      or zeek.dns.query in module_repo_domains or zeek.http.host in module_repo_domains;

      suppress only for allowlisted_dev_devices; output device_id, indicator, source, timestamp.'
- question: On managed Android devices, do on-device anti-debugging/anti-instrumentation probes detect
    Frida or other instrumentation artifacts -- frida-agent/gum-js-loop threads in /proc/<pid>/maps, the
    default Frida port 27042 with a D-Bus handshake, XposedBridge/Substrate frames in Java stack traces,
    or TracerPid != 0 in /proc/self/status?
  context: Dynamic instrumentation frameworks such as Frida and method-hooking frameworks such as Xposed/Substrate
    leave runtime traces even when their packages try to stay hidden. Following the [OWASP MASTG anti-debugging](https://mas.owasp.org/MASTG/tests/android/MASVS-RESILIENCE/MASTG-TEST-0046/)
    tests, managed devices should scan /proc/<pid>/maps and thread lists for frida-agent and gum-js-loop,
    probe the default Frida control port 27042 for a D-Bus handshake, inspect loaded libraries and Java
    stack traces for XposedBridge/Substrate frames, and read TracerPid in /proc/self/status; any positive
    artifact is a strong indicator of on-device instrumentation used to defeat defenses. For Defense Evasion
    this catches the live tooling an adversary uses to hook and blind APIs. A positive probe warrants
    immediate triage; because a sophisticated actor may patch these checks, run them alongside attestation
    and kernel-level telemetry.
  answer_sources:
  - MDM application inventory logs
  - MobileEDR:telemetry (on-device anti-tamper/integrity probes)
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Threat intelligence indicators
  - 'NAI: Endpoints: Corporate-managed Android devices. Network: DNS resolvers, web proxies, and VPN concentrators
    capturing mobile traffic. Servers: MDM/UEM and Mobile EDR log aggregation platforms.'
  range: Last 90 days, with periodic on-device probe execution and real-time alerting.
  queries:
  - technology: MobileEDR/Probe pseudocode
    query: "for each managed_app pid:\n  if scan(/proc/pid/maps, threads) contains ['frida-agent','gum-js-loop']:\
      \ flag;\n  if tcp_probe(127.0.0.1:27042) returns dbus_handshake: flag;\n  if java_stack_or_libs\
      \ contains ['XposedBridge','Substrate']: flag;\n  if read(/proc/self/status).TracerPid != 0: flag;\n\
      alert on any flag; output device_id, pid, artifact."
- question: On managed devices, do a managed app's resolved method entrypoints diverge from the expected
    DEX-mapped values, indicating ArtMethod entrypoint rewriting or native-to-Java transition redirection
    consistent with code hooking?
  context: 'The core runtime primitive of Xposed/Magisk-style hooking is rewriting ArtMethod entrypoints
    so that calls are redirected through attacker code -- exactly the mechanism analyzed by [TIRO](https://www.usenix.org/system/files/conference/usenixsecurity18/sec18-wong.pdf).
    Comparing each managed app''s resolved method entrypoints against the expected values mapped from
    the app''s DEX reveals this redirection: when entrypoints point outside the legitimate code regions
    or to native trampolines that were not present in the original mapping, the method has been hooked.
    In the Defense Evasion tactic this directly detects the instrumentation an adversary uses to alter
    API return values and data structures. A divergence is high-confidence evidence of method hooking;
    because the check itself runs on a potentially compromised device, corroborate with out-of-band attestation
    and kernel telemetry.'
  answer_sources:
  - MDM application inventory logs
  - MobileEDR:telemetry (on-device anti-tamper/integrity probes)
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Threat intelligence indicators
  - 'NAI: Endpoints: Corporate-managed Android devices. Network: DNS resolvers, web proxies, and VPN concentrators
    capturing mobile traffic. Servers: MDM/UEM and Mobile EDR log aggregation platforms.'
  range: Last 90 days, with periodic in-app integrity checks.
  queries:
  - technology: MobileEDR/Probe pseudocode
    query: "for each managed_app method m:\n  expected = dex_mapped_entrypoint(m);\n  actual = resolved_art_method_entrypoint(m);\n\
      \  if actual != expected or actual outside legit_code_region: flag_hook(m);\nalert on any flag;\
      \ output device_id, app, method, expected, actual."
- question: When the MDM/UEM server-side verifies each device's Play Integrity token, does any device
    return a verdict below MEETS_DEVICE_INTEGRITY (e.g., only MEETS_BASIC_INTEGRITY), or an app-integrity
    verdict of UNRECOGNIZED_VERSION indicating a tampered or repackaged managed app?
  context: A hooked device cannot be trusted to self-report, so hardware-rooted attestation provides the
    out-of-band integrity floor. Server-side verify every [Play Integrity](https://developer.android.com/google/play/integrity/overview)
    token rather than trusting the device, and alert on any verdict below MEETS_DEVICE_INTEGRITY -- rooted,
    bootloader-unlocked, emulated, or hooking-framework-laden devices fall beneath this floor -- and on
    app-integrity UNRECOGNIZED_VERSION that indicates a tampered or repackaged managed app. In Defense
    Evasion this is decisive because the adversary's on-device manipulations cannot forge a Google-signed
    integrity verdict produced server-side. A sub-floor verdict is strong evidence the device is in an
    untrusted state suitable for hooking; consistently passing verdicts raise but do not guarantee trust.
  answer_sources:
  - MDM device integrity scan logs
  - Play Integrity API verdict logs
  - Hardware Key Attestation certificate chain
  - 'NAI: Endpoints: Corporate-managed Android devices. Servers: MDM/UEM attestation verification service
    and log aggregation platform.'
  range: Last 90 days, with real-time verification on every token.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'for each play_integrity_token: verify server_side(token, google_keys);

      alert when deviceIntegrity not contains ''MEETS_DEVICE_INTEGRITY'';

      alert when appIntegrity == ''UNRECOGNIZED_VERSION'';

      output device_id, verdict, app, timestamp.'
- question: Does validation of a device's hardware Key Attestation certificate chain to a Google attestation
    root reveal verifiedBootState != Verified, an unlocked bootloader, or a securityLevel downgraded from
    TEE/StrongBox?
  context: '[Hardware Key Attestation](https://developer.android.com/privacy-and-security/security-key-attestation)
    produces a tamper-evident certificate chain rooted in a Google attestation root that resists on-device
    root/hook spoofing. Validate the chain and inspect the attestation extension: alert when verifiedBootState
    != Verified, the bootloader is reported unlocked, or the securityLevel is downgraded from TEE/StrongBox
    to software. These are exactly the device states a rooting/hooking workflow requires, and because
    the signing happens in secure hardware the adversary cannot forge them from userland. For Defense
    Evasion this gives an out-of-band confirmation that the device''s trust anchor is broken. A failed
    boot-state or unlocked bootloader is high-confidence; a valid chain with Verified state is a strong
    (but not absolute) trust signal.'
  answer_sources:
  - MDM device integrity scan logs
  - Play Integrity API verdict logs
  - Hardware Key Attestation certificate chain
  - 'NAI: Endpoints: Corporate-managed Android devices. Servers: MDM/UEM attestation verification service
    and log aggregation platform.'
  range: Last 90 days, with real-time validation on enrollment and key use.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "chain = parse_key_attestation_cert_chain(device);\nvalid = verify_chain_to(google_attestation_root);\n\
      alert when not valid or verifiedBootState != 'Verified' or bootloader == 'unlocked'\n  or securityLevel\
      \ downgraded_from(['TEE','StrongBox']);\noutput device_id, verifiedBootState, bootloader, securityLevel."
- question: For each device, does the daily count of failed integrity/attestation checks exceed the rolling
    30-day fleet baseline at the 95th percentile (escalating at the 99th)?
  context: 'Attestation FAILURE is itself a first-class signal per [Play Integrity](https://developer.android.com/google/play/integrity/overview):
    repeated failures from a device that should reliably pass suggest tampering, an unstable hooking framework,
    or evasion attempts. Compute per-device daily counts of failed integrity/attestation checks and compare
    against a rolling 30-day fleet baseline, alerting at the 95th percentile and escalating at the 99th,
    deriving thresholds per fleet rather than using fixed values. In the Defense Evasion tactic this catches
    devices whose attestation posture is degrading even before a single deterministic verdict is conclusive.
    A device sitting in the top percentile of failures warrants investigation; a low, stable failure count
    is consistent with normal transient errors.'
  answer_sources:
  - MDM device integrity scan logs
  - Play Integrity API verdict logs
  - Hardware Key Attestation certificate chain
  - 'NAI: Endpoints: Corporate-managed Android devices. Servers: MDM/UEM attestation verification service
    and log aggregation platform.'
  range: Last 90 days, with daily counts over a rolling 30-day fleet baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per device per day: fails = count(attestation_result == ''FAIL'');

      baseline = rolling_30d_fleet_distribution(fails);

      alert when fails >= p95(baseline); escalate when fails >= p99(baseline);

      output device_id, fails, p95, p99.'
- question: After a device posture change, does an app's API/syscall volume and frequency (calls/min)
    or its sensitive-data sink rate deviate abruptly from the device's own baseline, indicating hooked
    APIs returning altered values or suppressing calls?
  context: When APIs are hooked, the volume, frequency, and state of sensitive calls shift because the
    hook intercepts, wraps, or suppresses them. Using tamper-resistant native+Dalvik traces (as reconstructed
    by [DroidScope](https://www.usenix.org/system/files/conference/usenixsecurity12/sec12-final107.pdf)),
    baseline per-app API/syscall volume and frequency in calls/min, and track sensitive-data sink rates
    via information-flow accounting in the style of [TaintDroid](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf);
    then flag abrupt deviations after a device posture change using change-point or percentile thresholds
    derived from each fleet. In Defense Evasion this detects the downstream behavioral footprint of hooking
    even when the framework hides its own artifacts -- for example a permission-check API that suddenly
    stops firing or a sink that suddenly leaks. A sharp post-posture deviation is suspicious and should
    be correlated with attestation and artifact checks; stable behavior supports a benign read.
  answer_sources:
  - MobileEDR:telemetry (OS API execution, syscalls)
  - Out-of-band dynamic-analysis traces (sandbox)
  - MDM application inventory logs
  - 'NAI: Endpoints: Corporate-managed Android devices. Servers: Mobile EDR / app-vetting sandbox and
    log aggregation platform.'
  range: Last 90 days, with change-point detection anchored on device posture-change events.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per app: series = api_syscall_calls_per_min, sink_rate (taint_flows/min);

      baseline = pre_posture_change_window(app);

      alert when changepoint(series) after posture_change and value beyond fleet_percentile_threshold;

      output device_id, app, metric, baseline, observed.'
- question: When an app's abstracted API-call sequences are modeled as a Markov chain, do any observed
    API transitions fall below a fleet-derived probability floor (e.g., bottom 1%), indicating API redirection
    or wrapping by a hook?
  context: Hooks reroute control flow, so an app that has had its APIs redirected or wrapped will exhibit
    transitions between abstracted API calls that are improbable for legitimate apps. Following [MaMaDroid](https://arxiv.org/abs/1612.04433),
    model abstracted API-call sequences as Markov chains and flag transitions whose probability falls
    below a fleet-derived floor such as the bottom 1%. In the Defense Evasion tactic these low-probability
    transitions are the signature of a hook splicing itself between a caller and the real API, or substituting
    a wrapper. A concentration of rare transitions in an app warrants triage and correlation with artifact
    and attestation signals; behavior that stays within the expected transition distribution supports
    a benign conclusion.
  answer_sources:
  - MobileEDR:telemetry (OS API execution, syscalls)
  - Out-of-band dynamic-analysis traces (sandbox)
  - MDM application inventory logs
  - 'NAI: Endpoints: Corporate-managed Android devices. Servers: Mobile EDR / app-vetting sandbox and
    log aggregation platform.'
  range: Last 90 days, with per-app sequence modeling over a fleet-derived baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per app: seq = abstracted_api_calls(); M = markov_transition_matrix(seq);

      fleet_floor = p01(transition_prob across fleet);

      alert when any observed_transition_prob < fleet_floor;

      output device_id, app, rare_transitions, probs.'
- question: Do any apps exhibit rare combinations of obfuscation and dynamic-loading behaviors -- Java
    reflection plus dynamic class loading plus native packing -- that fall in the rarest prevalence percentile
    for the fleet, characteristic of hooking-module loaders?
  context: Hooking-module loaders frequently combine Java reflection, dynamic class loading, and native
    packing to stage and conceal their code, and such combinations are rare among legitimate apps. Using
    in-the-wild prevalence base rates (per [Dong et al.](https://arxiv.org/abs/1801.01633)), score apps
    for these co-occurring behaviors and alert on combinations in the rarest percentile for the fleet.
    In Defense Evasion this rarity scoring surfaces the loader machinery that delivers hooks even when
    the resulting runtime manipulation is hidden. An app with a rare obfuscation/dynamic-loading profile
    merits inspection and correlation with framework artifacts; common, well-understood patterns are lower
    priority.
  answer_sources:
  - MobileEDR:telemetry (OS API execution, syscalls)
  - Out-of-band dynamic-analysis traces (sandbox)
  - MDM application inventory logs
  - 'NAI: Endpoints: Corporate-managed Android devices. Servers: Mobile EDR / app-vetting sandbox and
    log aggregation platform.'
  range: Last 90 days, scored against in-the-wild prevalence base rates.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per app: feats = {reflection, dynamic_class_loading, native_packing};

      prevalence = base_rate_lookup(combination(feats));

      alert when prevalence in rarest_percentile(fleet);

      output device_id, app, feats, prevalence_rank.'
- question: Does a linear SVM trained on static features (permissions, components, suspicious/restricted
    APIs, intents, network addresses) classify a managed app as malicious/hooking-related, and what are
    the top-3 contributing features?
  context: Explainable static-feature classification surfaces hooking-related apps that evade single deterministic
    checks. Following [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf),
    train a linear SVM on permission, component, suspicious/restricted API, intent, and network-address
    features and surface the top-3 contributing features per alert -- the linear weights make this explanation
    native -- while keeping the deterministic watchlist and attestation rules running in parallel. In
    the Defense Evasion tactic this generalizes beyond known framework signatures to catch novel loaders
    and modules by their feature profile. A positive classification with interpretable drivers warrants
    triage against the deterministic and attestation layers; agreement across layers raises confidence,
    while the explanation lets analysts rule out legitimate apps.
  answer_sources:
  - MobileEDR:telemetry (eBPF kernel hooks, syscalls, Binder events)
  - Out-of-band dynamic-analysis traces (sandbox)
  - MDM device integrity scan logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoints: Corporate-managed Android devices. Network: DNS resolvers and proxies capturing mobile
    traffic. Servers: Mobile EDR / app-vetting sandbox and ML scoring platform.'
  range: Last 90 days for scoring, with periodic retraining on labeled corpora.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = static_features([permissions,components,suspicious_apis,intents,network_addrs]);

      pred = LinearSVM.predict(features);

      alert when pred == ''malicious''; report top3 = argmax(linear_weights * features);

      output device_id, app, score, top3_features.'
- question: Do RF/KNN classifiers trained on Markov-chain API-transition features flag an app whose abstracted
    API behavior matches hooked/redirected patterns, and which transitions contributed most?
  context: Behavioral classification on API-transition features is robust to API churn and obfuscation,
    making it well suited to catching hooking that alters control flow. Following [MaMaDroid](https://arxiv.org/abs/1612.04433),
    train RF/KNN classifiers on Markov-chain API-transition features to flag apps whose abstracted API
    behavior matches hooked or redirected patterns, and report the top contributing transitions in each
    alert. In Defense Evasion this complements the static SVM by modeling runtime behavior rather than
    declared structure, so a repackaged or dynamically loaded hook still shows its redirected transitions.
    A positive verdict with explainable transitions warrants correlation with the statistical Markov floor
    and artifact checks; consistent benign-matching behavior supports clearing the app.
  answer_sources:
  - MobileEDR:telemetry (eBPF kernel hooks, syscalls, Binder events)
  - Out-of-band dynamic-analysis traces (sandbox)
  - MDM device integrity scan logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoints: Corporate-managed Android devices. Network: DNS resolvers and proxies capturing mobile
    traffic. Servers: Mobile EDR / app-vetting sandbox and ML scoring platform.'
  range: Last 90 days for scoring, with periodic retraining.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = markov_transition_features(abstracted_api_calls);

      pred = RandomForest_or_KNN.predict(features);

      alert when pred == ''hooked''; report top_contributing_transitions;

      output device_id, app, score, top_transitions.'
- question: Does a real-time classifier over eBPF-captured kernel/syscall/Binder/file/network telemetry
    -- instrumented below userland hooking frameworks -- score a device in the top 1% anomaly scores,
    and what are the top-3 contributing features?
  context: Userland hooking frameworks can blind userland checks, but they cannot easily hide from kernel-level
    eBPF instrumentation captured beneath them. Following [BPFroid](https://arxiv.org/abs/2105.14344),
    feed eBPF-captured kernel, syscall, Binder, file, and network features into a real-time classifier,
    first deobfuscating runtime-hidden behavior in the style of [TIRO](https://www.usenix.org/system/files/conference/usenixsecurity18/sec18-wong.pdf),
    then flag the top 1% anomaly scores and emit the top-3 contributing features. In the Defense Evasion
    tactic this is the detector hardest for a hook to defeat because it observes the device from below
    the layer the adversary controls. A high kernel-level anomaly score with interpretable features is
    high-value evidence; correlate with attestation, artifacts, and statistical drift to confirm.
  answer_sources:
  - MobileEDR:telemetry (eBPF kernel hooks, syscalls, Binder events)
  - Out-of-band dynamic-analysis traces (sandbox)
  - MDM device integrity scan logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoints: Corporate-managed Android devices. Network: DNS resolvers and proxies capturing mobile
    traffic. Servers: Mobile EDR / app-vetting sandbox and ML scoring platform.'
  range: Last 90 days, with real-time scoring over a rolling baseline.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = ebpf_features([syscalls,binder,file,network]); deobfuscate via TIRO;

      score = realtime_classifier.score(features);

      alert when score in top1pct; report top3 contributing features;

      output device_id, score, top3_features.'
- question: Does an Isolation Forest over combined MDM features (developer mode, non-market app count,
    integrity failures) and Zeek network features (DNS query entropy, byte ratio, unique destination ports,
    NXDOMAIN/4xx error rates) place a device in the top 1% anomaly scores, and which features drove the
    score?
  context: 'A device that is rooted and hooking-laden often presents a combined device-and-network profile
    that stands apart from the fleet: developer mode enabled, sideloaded non-market apps, integrity failures,
    plus network behavior such as high DNS query entropy, skewed byte ratios, many unique destination
    ports, and elevated NXDOMAIN/4xx error rates from contacting framework/module repositories. Train
    an Isolation Forest on these MDM and Zeek features and flag devices in the top 1% anomaly scores,
    surfacing the top-3 contributing features for triage. In Defense Evasion this fuses endpoint posture
    with network behavior to catch devices whose individual signals are subtle but whose joint profile
    is anomalous. A top-percentile device with explainable drivers warrants investigation; a device clustered
    with normal peers is lower priority.'
  answer_sources:
  - MobileEDR:telemetry (eBPF kernel hooks, syscalls, Binder events)
  - Out-of-band dynamic-analysis traces (sandbox)
  - MDM device integrity scan logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoints: Corporate-managed Android devices. Network: DNS resolvers and proxies capturing mobile
    traffic. Servers: Mobile EDR / app-vetting sandbox and ML scoring platform.'
  range: Last 90 days, with daily feature aggregation and model scoring.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'mdm_feats = [developer_mode, non_market_app_count, integrity_failures];

      net_feats = [dns_query_entropy, byte_ratio, unique_dst_ports, nxdomain_rate, http_4xx_rate];

      score = IsolationForest.score(mdm_feats + net_feats);

      alert when score in top1pct; report top3_features;

      output device_id, score, top3_features.'
