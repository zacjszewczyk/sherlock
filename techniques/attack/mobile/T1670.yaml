name: 'T1670: Virtualization Solution'
id: f84ba0b8-3798-42b7-80f7-c55afbc072e3
description: 'Investigate whether an adversary is abusing Android virtualization or application-cloning
  solutions (e.g., the Android Virtualization Framework, Parallel Space, DroidPlugin, VirtualApp, Dual
  Space) to escape the application sandbox, run guest apps that never appear in the system PackageManager,
  and conceal malicious activity such as mimicking a legitimate banking app inside a virtual environment
  to capture credentials. This playbook helps an analyst hunt across three lines of evidence: (1) on-device
  and MDM inventory/app-vetting signals where a package name matches a watchlist of virtualization frameworks,
  where manifest artifacts betray host-mediated guest execution (dynamic package loading, generic stub
  Activities/Services, QUERY_ALL_PACKAGES + SYSTEM_ALERT_WINDOW + BIND_ACCESSIBILITY_SERVICE, redirected
  /data/data paths), or where task-hijacking/UI-impersonation configuration appears; (2) network-physics
  anomalies where traffic attributed to a trusted foreground app deviates from baseline because a hidden
  virtualized guest is mediating its traffic; and (3) threat-intelligence, DGA, and DNS-tunneling indicators
  in mobile DNS and TLS telemetry. It combines deterministic symbolic-logic rules, statistical baselining,
  and explainable machine-learning models so the analyst can confirm virtualization abuse, quarantine
  affected devices, and scope the campaign across the managed fleet.'
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Does any installed application's package name, as recorded in MDM application inventory, match
    a curated watchlist of known Android virtualization or app-cloning frameworks (e.g., Parallel Space
    com.lbe.parallel, Dual Space, DroidPlugin, VirtualApp io.virtualapp) while NOT appearing on the corporate
    allowlist?
  context: For the Defense Evasion tactic, virtualization frameworks are the enabling tooling an adversary
    installs to run cloned/guest apps outside the system PackageManager and evade on-device defenses.
    The analyst compares every package_name in MDM inventory against a hard, curated watchlist of virtualization
    framework package names enumerated in research such as 'App in the Middle'. A non-allowlisted package
    that matches the watchlist is a deterministic, high-severity hit warranting investigation and likely
    quarantine. Keep this as a hard deterministic rule and only tune (never delete) entries as new frameworks
    emerge. A positive result strongly indicates intentional virtualization tooling; a negative result
    does not rule out a custom or obfuscated framework, which the other methods here must catch.
  answer_sources: &id001
  - MDM Application Inventory Log
  - Android Logcat
  - Application Vetting Report
  - Threat Intelligence Feed
  - 'NAI: Managed Android mobile device fleet, Mobile Device Management (MDM) servers, SIEM, Threat Intelligence
    Platform (TIP)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'mdm_app_inventory

      | where package_name in (virtualization_watchlist)

      | where package_name not in (corporate_allowlist)

      | set severity = "high"

      | emit alert("Virtualization framework installed", device_id, package_name)'
- question: During application-vetting and manifest analysis, does an app exhibit the deterministic artifacts
    that virtualization frameworks reuse, namely a host process that dynamically loads and executes packages
    it never declared, large numbers of generic stub Activity/Service entries, requests for QUERY_ALL_PACKAGES
    together with SYSTEM_ALERT_WINDOW and BIND_ACCESSIBILITY_SERVICE, and redirected /data/data paths
    that nest guest data under the host sandbox?
  context: 'Even when a virtualization framework is repackaged or renamed to evade the package-name watchlist,
    the mechanics of host-mediated guest execution leave deterministic fingerprints described in research
    such as ''Boxify''. The analyst inspects app-vetting/manifest reports for: dynamic class/package loading
    of code never declared by the app, an abnormally high count of generic stub Activities and Services
    (used to proxy arbitrary guest components), the combination of QUERY_ALL_PACKAGES + SYSTEM_ALERT_WINDOW
    + BIND_ACCESSIBILITY_SERVICE (enumerate apps, draw overlays, and read/inject UI), and /data/data path
    redirection nesting guest data under the host. Any combination of these is a strong, explainable signal
    of a virtualization host. This catches obfuscated frameworks the watchlist misses; absence does not
    prove safety because vetting coverage may be incomplete.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Application Vetting/pseudocode
    query: 'app_vetting_report

      | compute dynamic_load = loads_undeclared_packages

      | compute stub_count = count(generic_stub_activities) + count(generic_stub_services)

      | compute perms = has(QUERY_ALL_PACKAGES) and has(SYSTEM_ALERT_WINDOW) and has(BIND_ACCESSIBILITY_SERVICE)

      | compute path_redirect = nests_guest_data_under(/data/data)

      | where dynamic_load and (stub_count > 50 or perms or path_redirect)

      | emit alert("Virtualization mechanics in manifest", package_name)'
- question: Does an app's manifest show task-hijacking-capable configuration, such as anomalous taskAffinity
    values or singleTask/singleInstance launch modes combined with FLAG_ACTIVITY_NEW_TASK, or do runtime
    events show a foreground Activity that is not owned by the foreground package reported by MDM?
  context: Virtualization abuse frequently pairs with task hijacking and UI impersonation to present a
    fake banking screen over a legitimate task, as documented in 'Towards Discovering and Understanding
    Task Hijacking in Android'. For Defense Evasion, this lets a virtualized guest overlay or replace
    a trusted app's UI without the user noticing. The analyst flags manifests with anomalous taskAffinity
    (matching another app's package to graft onto its back stack), singleTask/singleInstance modes combined
    with FLAG_ACTIVITY_NEW_TASK, and especially runtime mismatches where the foreground Activity owner
    differs from the foreground package MDM reports. A runtime owner/package mismatch is a high-confidence
    indicator that a hidden guest is impersonating a trusted app.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Application Vetting/pseudocode
    query: "app_manifest\n| where taskAffinity != own_package and taskAffinity != \"\"\n   or (launchMode\
      \ in (\"singleTask\",\"singleInstance\") and uses_flag(FLAG_ACTIVITY_NEW_TASK))\n| emit alert(\"\
      Task-hijacking-capable manifest\", package_name)"
  - technology: SIEM/Rule pseudocode
    query: 'join logcat_activity (foreground_activity_owner) with mdm_usage (foreground_package) on device_id,
      time

      | where foreground_activity_owner != foreground_package

      | set severity = "high"

      | emit alert("Foreground Activity not owned by foreground package", device_id)'
- question: Among unapproved applications, which are statistically rare across the managed fleet, that
    is installed on fewer than 1% of devices or fewer than five devices over a rolling 30-day window,
    consistent with the small but high-impact install base typical of virtualization frameworks and clones?
  context: 'Virtualization frameworks and cloning apps are uncommon in a managed fleet, so rarity is a
    useful weak signal that complements the deterministic rules. For Defense Evasion, an adversary''s
    bespoke tooling will appear on a handful of devices rather than fleet-wide. The analyst computes app
    prevalence over 30 days and surfaces unapproved apps installed on fewer than 1% of devices or fewer
    than five devices (derive the exact device-count threshold from fleet size). This is a triage/enrichment
    signal, not an automatic block: pair it with the watchlist and manifest checks to prioritize which
    rare apps to vet. A positive result means an app is rare enough to warrant manual review; a negative
    result simply means the app is common and lower priority.'
  answer_sources: *id001
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'mdm_app_inventory earliest=-30d

      | where package_name not in (corporate_allowlist)

      | stats dc(device_id) as install_count by package_name

      | eval fleet_pct = install_count / total_devices

      | where install_count < 5 or fleet_pct < 0.01

      | emit alert("Rare unapproved app", package_name, install_count)'
- question: When an explainable static classifier (linear SVM or Random Forest) scores an app on manifest
    features such as SYSTEM_ALERT_WINDOW/GET_TASKS/QUERY_ALL_PACKAGES permission counts and types, dynamic-load
    components, package-name entropy, and metadata keywords like virtual/clone/dual, does the predicted
    probability that the app is a virtualization tool exceed 0.85?
  context: To generalize beyond a static watchlist, an explainable static classifier trained per the 'Drebin'
    approach scores apps from manifest-derived features. For Defense Evasion this catches renamed or novel
    virtualization tools by their structural signature rather than their identity. The analyst reviews
    alerts where probability exceeds 0.85, and the alert must surface the top-3 contributing features
    (SHAP/LIME pattern) so the rationale is transparent (e.g., 'flagged due to QUERY_ALL_PACKAGES + high
    package-name entropy + clone keyword'). Use an interpretable linear SVM/Random Forest so triage analysts
    can validate the decision. A high-probability hit with sensible contributing features is strong corroboration;
    surface the features so analysts can reject obvious false positives.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = extract_manifest_features(app)  # perm counts/types, dynamic_load comps, pkg_name_entropy,\
      \ meta_keywords\np = virtualization_classifier.predict_proba(features)\nif p > 0.85:\n    emit alert(\"\
      Suspected virtualization tool\", package_name, p, top_k_features(features, 3))"
- question: Do two complementary machine-learning models agree that an app is malicious virtualization
    tooling, namely a Markov-chain behavioral classifier over package/family API-call transitions (capturing
    dynamic-load, reflection, accessibility, and inter-app-proxy patterns) and a CNN over raw Dalvik opcode
    sequences (learning custom-class-loader/hooking-stub signatures)?
  context: To resist obfuscation, layer two independent models above the deterministic watchlist. The
    MaMaDroid-style Markov-chain model captures behavioral API-call transition patterns characteristic
    of virtualization (reflection, dynamic loading, accessibility, inter-app proxying), while the CNN
    over Dalvik opcodes (per 'Deep Android Malware Detection') learns low-level custom-class-loader and
    hooking-stub signatures. For Defense Evasion, requiring ensemble agreement reduces false positives
    while remaining robust to single-feature evasion. The analyst acts when both models agree, and each
    model emits its top contributing features for explainability. Agreement across behavioral and bytecode
    views is high-confidence; disagreement should be triaged manually rather than auto-actioned.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "beh = markov_api_classifier.predict(api_call_transitions(app))\nbyte = cnn_opcode_classifier.predict(dalvik_opcode_seq(app))\n\
      if beh.malicious and byte.malicious:\n    emit alert(\"Ensemble: virtualization tooling\", package_name,\
      \ beh.top_features, byte.top_features)"
- question: When a managed mobile device connects to a known command-and-control (C2) indicator in Zeek
    conn.log, do MDM usage logs simultaneously report a trusted, benign application in the foreground,
    indicating that a hidden virtualized guest is mediating malicious traffic under cover of a trusted
    app?
  context: Because a virtualized guest app is invisible to the system PackageManager, malicious traffic
    it generates is attributed to the trusted host app in the foreground (the host-mediates-guest-traffic
    model from 'App in the Middle'). For Defense Evasion, the tell is a C2 connection occurring while
    MDM reports only a trusted foreground app. The analyst matches Zeek conn.log destinations against
    C2 threat intel and joins on device/time with MDM usage to confirm a trusted app was foregrounded.
    A correlated hit is a high-severity signal of background virtualization abuse and should trigger device
    quarantine and forensic capture; the absence of a foreground-app correlation does not clear the device,
    since the guest may run while the screen is off.
  answer_sources: &id002
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - MDM Application Usage Log
  - 'NAI: Corporate Wi-Fi and VPN gateways, Enterprise DNS resolvers, MDM servers, SIEM'
  range: Last 90 days; pivot +/- 15 minutes around each C2 connection to align MDM foreground state.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'conn = zeek_conn where dest in (c2_threat_intel)

      join conn with mdm_usage on device_id, time_window(15m)

      | where mdm_usage.foreground_app in (trusted_apps)

      | set severity = "high"

      | emit alert("Suspected background virtualization C2", device_id, dest, foreground_app)'
- question: For each device-app pair, do two or more network-physics metrics, bytes transferred (volume),
    connection and DNS counts per 15-minute interval (frequency), connection success/failure ratios (state),
    and lexical DNS-name statistics (length, entropy, label count), simultaneously exceed three standard
    deviations above their 30-day rolling baseline?
  context: 'A virtualized guest changes the network ''physics'' of a trusted app: more bytes, more connections,
    different success/failure ratios, and odd DNS lexical profiles. For Defense Evasion, baselining each
    device-app pair lets the analyst detect deviation from what a given trusted app normally does. Requiring
    two or more metrics beyond 3 sigma reduces false positives from benign spikes. Derive per-fleet sigma
    thresholds empirically. Treat DNS lexical statistics (length, entropy, label count) as additional
    metrics per Ahmed et al. A multi-metric breach concentrated on one device-app pair, especially a trusted
    app, is a strong indicator of a hidden guest; single-metric blips are usually benign.'
  answer_sources: *id002
  range: Last 90 days; baseline window 30 days, evaluate per 15-minute interval.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each (device_id, app) per 15m:\n  metrics = {bytes, conn_count, dns_count, fail_ratio,\
      \ dns_entropy, dns_len}\n  z[m] = (metrics[m] - baseline_mean[m]) / baseline_std[m]   # 30d rolling\n\
      \  breaches = count(m where z[m] > 3)\n  if breaches >= 2:\n     emit alert(\"Network physics anomaly\"\
      , device_id, app, breached_metrics)"
- question: Is there a burst of failed or blocked outbound connections, TLS handshake failures, or NXDOMAIN
    responses originating from a device whose foreground app is a trusted application, indicating C2 churn
    driven by a hidden virtualized guest?
  context: 'Failure-mode signals are distinct, high-value indicators of C2 churn: a hidden guest cycling
    through dead or rotating infrastructure produces bursts of connection failures, TLS handshake failures,
    and NXDOMAIN responses even while the device shows a trusted foreground app. For Defense Evasion,
    this catches the guest''s beaconing even when payload volume is low. The analyst baselines per-device
    failure rates and alerts on bursts, using KL-divergence against an English letter-frequency baseline
    to suppress false positives on short DNS tokens (per Red Canary''s entropy work). A failure-rate spike
    tied to a trusted foreground app warrants investigation of the destination infrastructure and the
    device''s installed apps.'
  answer_sources: *id002
  range: Last 90 days; evaluate failure bursts per 15-minute interval.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each device_id per 15m:\n  fails = count(conn.state in failed_states) + count(ssl.handshake_fail)\
      \ + count(dns.rcode==NXDOMAIN)\n  if fails > baseline_fail_mean + 3*baseline_fail_std and foreground_app\
      \ in (trusted_apps):\n     # KL-divergence vs English baseline to drop short benign tokens\n   \
      \  emit alert(\"C2 churn / failure spike\", device_id, foreground_app, fails)"
- question: Does an LSTM autoencoder trained on 5-minute aggregates of network telemetry (bytes, unique
    destinations, average connection duration, failure ratio) produce a high reconstruction error for
    a device, and does that anomaly correlate with MDM usage showing a trusted app in the foreground?
  context: Sequence anomalies that simple thresholds miss are captured by an LSTM autoencoder trained
    on normal 5-minute network telemetry per device. For Defense Evasion, a hidden virtualized guest produces
    temporal patterns (bursty beaconing, shifting destinations) that inflate reconstruction error. The
    analyst alerts on high reconstruction error, correlates with MDM app usage, and escalates when a trusted
    app is foregrounded (because anomalous traffic attributed to a trusted app is the hallmark of virtualization).
    The alert surfaces the top-3 features driving reconstruction error (SHAP/LIME) for explainable triage.
    High reconstruction error plus a trusted foreground app is a strong escalation trigger; the model's
    feature attributions guide where the analyst looks first.
  answer_sources: *id002
  range: Last 90 days; model input 5-minute aggregates.
  queries:
  - technology: ML/pseudocode
    query: "agg = aggregate_5m(device_id, [bytes, unique_dests, avg_duration, fail_ratio])\nerr = lstm_autoencoder.reconstruction_error(agg)\n\
      if err > threshold:\n    join with mdm_usage on device_id, time\n    severity = \"high\" if foreground_app\
      \ in (trusted_apps) else \"medium\"\n    emit alert(\"Anomalous network sequence\", device_id, err,\
      \ top_k_features(agg,3))"
- question: Does any outbound traffic from a managed mobile device in Zeek conn.log, dns.log, or ssl.log
    match a threat-intelligence indicator (domain, IP, or JA3/JA3S TLS fingerprint) tied to malware known
    to use virtualization?
  context: The most direct detection is a deterministic match of mobile egress against curated threat
    intel for virtualization-abusing malware. For Defense Evasion, even if the guest app is invisible
    on-device, its network indicators are visible at the egress. The analyst matches conn.log/dns.log/ssl.log
    against domains, IPs, and JA3/JA3S fingerprints from the TIP and alerts immediately on any match.
    Keep this as a hard deterministic rule. A match is high-confidence and should drive immediate quarantine
    and forensic review; the absence of a match does not clear the device because indicators rotate, which
    is why the statistical/ML methods below are also needed.
  answer_sources: &id003
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Threat Intelligence Feed
  - 'NAI: Corporate network egress points, Web proxies, DNS resolvers, Threat Intelligence Platform (TIP),
    SIEM'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'zeek_conn or zeek_dns or zeek_ssl

      | where dest_ip in (ti_ips) or query in (ti_domains) or ja3 in (ti_ja3) or ja3s in (ti_ja3s)

      | set severity = "critical"

      | emit alert("Virtualization malware IoC match", device_id, matched_indicator)'
- question: Do any DNS query names from a managed mobile device have a Shannon entropy and length exceeding
    fixed thresholds (e.g., entropy > 4.0 bits/char and name length > 30), after using KL-divergence against
    an English letter-frequency baseline to cut false positives on short tokens?
  context: Algorithmically generated (DGA) C2 domains used by virtualization malware tend to be long and
    high-entropy. For Defense Evasion, this deterministic lexical screen flags likely-DGA names before
    reputation data is even available. The analyst applies fixed thresholds (entropy > 4.0 bits/char,
    length > 30) and uses KL-divergence against an English letter-frequency baseline to avoid flagging
    short or naturally random-looking benign tokens (per Red Canary's entropy work). A flagged name should
    be enriched with reputation and correlated to the requesting device/app. This is a fast first-pass
    filter; tune thresholds to your environment to balance sensitivity and noise.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'zeek_dns

      | eval ent = shannon_entropy(query), len = strlen(query)

      | eval kl = kl_divergence(query, english_freq)

      | where ent > 4.0 and len > 30 and kl > kl_min

      | emit alert("High-entropy DGA-like domain", device_id, query, ent, len)'
- question: Among fleet-wide domain requests over 30 days, do any domains in the bottom 1st percentile
    of request frequency, when enriched with reputation data, carry malicious or suspicious ratings, and
    are there elevated per-device NXDOMAIN/SERVFAIL response-failure rates indicative of DGA churn?
  context: Rare domains are disproportionately likely to be malicious C2 for a hidden guest. For Defense
    Evasion, the analyst computes fleet-wide domain request frequency over 30 days, takes the bottom 1st
    percentile (rarely visited domains), and enriches them with reputation; malicious/suspicious ratings
    on rare domains are strong signals. In parallel, profile per-device NXDOMAIN/SERVFAIL failure rates
    as a distinct DGA-churn signal, and score names with stateless lexical features (length, label count,
    numeric ratio, entropy) per Ahmed et al. and NIOM-DGA. A rare + bad-reputation domain on a single
    device is a high-priority lead; high failure rates corroborate DGA behavior.
  answer_sources: *id003
  range: Last 90 days; rarity computed over a 30-day window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'zeek_dns earliest=-30d

      | stats count by query

      | eval pct = percent_rank(count)

      | where pct < 0.01

      | lookup reputation(query)

      | where reputation in ("malicious","suspicious")

      | emit alert("Rare domain w/ bad reputation", device_id, query, reputation)

      # also: per-device rate(NXDOMAIN|SERVFAIL) > baseline -> DGA churn'
- question: When a DGA-detection model scores mobile DNS queries using features like entropy, n-gram frequencies,
    Levenshtein distance to legitimate strings, and name length, does the DGA probability exceed 0.90,
    especially for newly observed domains?
  context: A supervised DGA model (per NIOM-DGA) generalizes beyond fixed entropy thresholds by combining
    entropy, n-gram frequency, edit distance to known-good strings, and length. For Defense Evasion, this
    catches the dictionary-DGA and subtle algorithmic domains a hidden guest may use for C2. The analyst
    alerts when DGA probability exceeds 0.90, prioritizing newly observed domains (no prior fleet history),
    and the alert reports the top-3 contributing lexical features for explainability. A high-probability,
    newly observed domain from a device running a trusted foreground app is a strong escalation; the feature
    attributions help the analyst confirm or dismiss quickly.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "feat = lexical_features(query)  # entropy, ngram_freq, levenshtein_to_known_good, length\n\
      p = dga_model.predict_proba(feat)\nif p > 0.90 and is_newly_observed(query):\n    emit alert(\"\
      DGA-like domain\", device_id, query, p, top_k_features(feat,3))"
- question: Does an unsupervised Isolation Forest over stateless lexical FQDN features (length, label
    count, maximum label length, numeric and uppercase character counts, Shannon entropy) flag DNS queries
    from host-app traffic as anomalous, consistent with DNS exfiltration or tunneling by a hidden virtualized
    guest?
  context: DNS tunneling is a covert channel a virtualized guest can use to exfiltrate captured credentials
    under cover of the host app. For Defense Evasion, an unsupervised Isolation Forest over stateless
    lexical FQDN features (per 'Real-Time Detection of DNS Exfiltration and Tunneling') flags anomalous
    query structures in real time without needing labeled data. The analyst reviews flagged queries, which
    the model annotates with per-feature anomaly contributions (e.g., abnormal label length or numeric
    ratio) to speed triage. Repeated anomalous queries to the same parent domain from one device strongly
    suggest tunneling and warrant blocking the domain and quarantining the device; isolated anomalies
    may be benign and need correlation.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "feat = fqdn_features(query)  # length, label_count, max_label_len, numeric_count, upper_count,\
      \ entropy\nscore = isolation_forest.anomaly_score(feat)\nif score > anomaly_threshold:\n    emit\
      \ alert(\"Suspected DNS tunneling/exfil\", device_id, query, per_feature_contributions(feat))"
