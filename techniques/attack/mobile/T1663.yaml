    installed application and its granted permissions, the remote peer (domain, IP, certificate/JA3-JA4
    fingerprint, port), the session volume and cadence, and the surrounding UEM/MDM and network timeline
    to scope intent and impact. A negative result helps rule out this particular vector but should be
    corroborated with the other questions in this playbook, since a single method can miss stealthy, encrypted,
    or low-and-slow remote-access C2 -- especially over cellular or public Wi-Fi outside enterprise visibility.
  answer_sources:
  - UEM/MDM application inventory logs
  - UEM/MDM permission/grant inventory
  - Android accessibility-service enablement events (Permissions Request, DC0116)
  - >-
    NAI: The Unified Endpoint Management (UEM/MDM) platform API and on-device app/permission telemetry
