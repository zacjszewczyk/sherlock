      telemetry (DC0116 Permissions Request) for Android and iOS managed devices.

      | approach: Score installed apps with explainable static (permissions/intents/URLs) and drift-robust
      behavioral models, surfacing the top contributing features per verdict; combine Drebin-style linear
      SVM explanations ([Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf)),
      package/family Markov-chain behavioral models ([MaMaDroid](https://arxiv.org/abs/1612.04433)), and
      scalable HIN+DNN app classification ([AiDroid](https://arxiv.org/abs/1811.01027)) to flag unsanctioned
      remote-access trojans for triage.

