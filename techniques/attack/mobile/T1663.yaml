    profile confirms no sanctioned application is installed that would account for this traffic. The 'Baseline
    remote access session volume' approach (Statistical Method) works as follows: Maintain a 30-day baseline
    of data volume (bytes) and session duration per user and remote access service. Alert when volume
    or duration exceeds the 95th percentile and escalate above the 99th percentile. Derive the discriminative
    flow features and per-fleet thresholds from labeled mobile flow data ([CorrNetDroid](https://arxiv.org/abs/2503.01396),
