questions:
- question: >-
    [Command And Control] Match remote access IoCs to unsanctioned apps: Can you determine whether a network
    connection originating from a corporate mobile device's IP address matches an Indicator of Compromise
    (IoC) from a threat intelligence feed for unapproved remote access software (e.g., domain, IP, SSL/TLS
    certificate subject), and the source device's UEM/MDM profile confirms no sanctioned application is
    installed that would account for this traffic. -- specifically, using the 'Match remote access IoCs
    to unsanctioned apps' (Symbolic Logic) approach?
  context: >-
    Why this matters: Under the Command And Control tactic (TA0037), an adversary attempts to communicate
    with and control a compromised mobile device, often by installing or abusing legitimate remote access
    software (VNC, TeamViewer, AirDroid, AirMirror) as a redundant, interactive, or reverse-connection
    C2 channel, sometimes over networks outside enterprise control such as cellular or public Wi-Fi. This
    evidence focuses on the condition that a network connection originating from a corporate mobile device's
    IP address matches an Indicator of Compromise (IoC) from a threat intelligence feed for unapproved
    remote access software (e.g., domain, IP, SSL/TLS certificate subject), and the source device's UEM/MDM
    profile confirms no sanctioned application is installed that would account for this traffic. The 'Match
    remote access IoCs to unsanctioned apps' approach (Symbolic Logic) works as follows: Check Zeek dns.log,
    conn.log, and ssl.log for unapproved remote access IoCs using community network/proxy signatures ([SigmaHQ](https://github.com/SigmaHQ/sigma))
    and fingerprint the remote-access client TLS stack via JA3/JA4 allow-deny lists emitted in ssl.log
    ([JA3](https://github.com/salesforce/ja3), [JA4+](https://github.com/FoxIO-LLC/ja4)). On a match from
    a mobile IP, query UEM/MDM for installed apps and alert at high severity if the matching app is not
    on the sanctioned remote-access list ([MITRE T1663](https://attack.mitre.org/techniques/T1663/)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable adversary
    use of legitimate remote access software for an interactive command and control channel on a corporate
    mobile device; pivot to the responsible device, user/account, installed application and its granted
    permissions, the remote peer (domain, IP, certificate/JA3-JA4 fingerprint, port), the session volume
    and cadence, and the surrounding UEM/MDM and network timeline to scope intent and impact. A negative
    result helps rule out this particular vector but should be corroborated with the other questions in
    this playbook, since a single method can miss stealthy, encrypted, or low-and-slow remote-access C2
    -- especially over cellular or public Wi-Fi outside enterprise visibility.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - UEM/MDM application inventory logs
  - Windows Event ID 5156
  - >-
    NAI: Network egress points (Internet gateway, VPN concentrators), corporate DNS resolvers, forward
    web proxies (potentially Windows-based), and the Unified Endpoint Management (UEM/MDM) platform API.
  range: Last 90 days (correlate event-centered windows of +/- 10 minutes around the activity)
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      # Match remote access IoCs to unsanctioned apps (Symbolic Logic)

      source IN [Zeek dns.log, Zeek conn.log, Zeek ssl.log, UEM/MDM application inventory logs, Windows
      Event ID 5156]

      | filter scope IN NAI: Network egress points (Internet gateway, VPN concentrators), corporate DNS
      resolvers, forward web proxies (potentially Windows-based), and the Unified Endpoint Management
      (UEM/MDM) platform API.

      | approach: Check Zeek dns.log, conn.log, and ssl.log for unapproved remote access IoCs using community
      network/proxy signatures ([SigmaHQ](https://github.com/SigmaHQ/sigma)) and fingerprint the remote-access
      client TLS stack via JA3/JA4 allow-deny lists emitted in ssl.log ([JA3](https://github.com/salesforce/ja3),
      [JA4+](https://github.com/FoxIO-LLC/ja4)). On a match from a mobile IP, query UEM/MDM for installed
      apps and alert at high severity if the matching app is not on the sanctioned remote-access list
      ([MITRE T1663](https://attack.mitre.org/techniques/T1663/)).

      | emit alert with contributing fields and entity context (device_id, user, app_name, granted_permissions,
      dest_domain, dest_ip, dest_port, ja3_ja4, bytes, duration, conn_state, ioc_match_flag, sanctioned_app_flag)
- question: >-
    [Command And Control] Baseline remote access session volume: Can you determine whether a network connection
    originating from a corporate mobile device's IP address matches an Indicator of Compromise (IoC) from
    a threat intelligence feed for unapproved remote access software (e.g., domain, IP, SSL/TLS certificate
    subject), and the source device's UEM/MDM profile confirms no sanctioned application is installed
    that would account for this traffic. -- specifically, using the 'Baseline remote access session volume'
    (Statistical Method) approach?
  context: >-
    Why this matters: Under the Command And Control tactic (TA0037), an adversary attempts to communicate
    with and control a compromised mobile device, often by installing or abusing legitimate remote access
    software (VNC, TeamViewer, AirDroid, AirMirror) as a redundant, interactive, or reverse-connection
