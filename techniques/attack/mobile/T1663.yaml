name: 'T1663: Remote Access Software'
id: b88b7011-468f-47e6-905d-742230b175e3
description: >-
  This playbook helps an analyst investigate whether an adversary is leveraging legitimate remote access
  software (such as VNC, TeamViewer, AirDroid, or AirMirror) to establish an interactive command and control
  channel on corporate mobile devices (MITRE ATT&CK T1663, Remote Access Software). Such tools may be
  installed post-compromise for redundant or interactive access, embedded in malware to make a reverse
  connection to adversary infrastructure, and used to gain persistence. The hunt pursues this behavior
  across complementary telemetry: network egress (Zeek conn/dns/ssl/dpd/notice/known_services logs, firewall
  accept/deny logs, Windows Event ID 5156 from forward proxies) and managed-device context (UEM/MDM application
  and permission inventories, Android accessibility-service and device-administrator grant events). It
  correlates threat-intelligence IoC and JA3/JA4 TLS-fingerprint matching of unsanctioned remote-access
  clients, detection of remote-access protocols on non-standard ports, default-deny inbound-connection
  violations from external IPs, and unsanctioned accessibility/device-admin privilege grants. Detection
  methods combine deterministic symbolic-logic rules (Sigma-style signatures, IoC and policy-violation
  matching), statistical baselining and rarity/periodicity scoring (95th/98th/99th-percentile session
  volume and interactivity thresholds, port-entropy and prevalence analysis, failure/NXDOMAIN-rate profiling,
  coefficient-of-variation/Fourier keep-alive cadence detection), and machine learning (Gradient Boosting/Random
  Forest flow classification with SHAP attributions, per-device LSTM autoencoders, self-supervised OOD
  detection for encrypted TLS 1.3 C2, DBSCAN/HDBSCAN inbound-profile clustering, and explainable app classifiers
  such as Drebin, MaMaDroid, and AiDroid), so the analyst can corroborate suspected remote-access C2 against
  device, user, application, permission, peer, and session context.
type: technique
related:
- tactic_id: TA0037
  tactic_name: Command And Control
