name: 'T1628.003: Conceal Multimedia Files'
id: 34c30587-be14-41ab-89f1-2a6b4b1b3c18
description: 'Investigate whether an adversary, stalkerware, or spyware app on a corporate-managed Android
  device is concealing captured multimedia (photos, videos, screenshots, audio) and staging it for exfiltration.
  On Android, dropping a ''.nomedia'' file (or any leading-dot hidden file/directory) into a folder hides
  its contents from the Gallery and asks other apps not to scan it, effectively making captured media
  invisible to the user. This playbook helps an analyst hunt for two linked behaviors: (1) the on-device
  creation of ''.nomedia''/hidden files by apps that are not on a media/system allowlist, that hold camera/microphone/media
  permissions inconsistent with their stated function, that were recently sideloaded, or that write to
  high-entropy/obfuscated directory paths; and (2) the subsequent network egress of multimedia MIME types
  (image/jpeg, video/mp4, image/png) in large volumes to novel, low-reputation, or known-bad destinations.
  It combines deterministic allowlist/permission rules, statistical baselining (name entropy, per-device
  hidden-file rates, transfer volume, destination novelty, egress failure modes), and explainable machine
  learning (Random Forest/GBM on file-creation features, DeepLog LSTM on audit-log sequences, app-flow
  fingerprinting, and time-series exfiltration anomaly models) so detection never depends on a single
  method and every alert surfaces its contributing features for fast SOC triage.'
type: technique
