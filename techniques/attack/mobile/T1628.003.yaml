questions:
- question: Did any process that is NOT on the established media/system allowlist create a '.nomedia'
    file or any other leading-dot hidden file or directory on a managed Android device?
  context: 'Defense Evasion: On Android, the presence of a ''.nomedia'' file in a folder hides that folder''s
    multimedia from the Gallery and signals other apps not to scan it, so an adversary or stalkerware
    app uses it to make captured pictures/videos/screenshots invisible to the user. Build a deterministic
    rule from Mobile EDR file-system auditing that fires when a ''.nomedia'' (or any ''.''-prefixed hidden
    file/directory) is created by a process whose package is not on a media/system allowlist derived from
    MDM application inventories, and back that allowlist with sideload and version policy. A first-party
    camera or gallery app legitimately writing ''.nomedia'' is expected and allowlisted; a non-allowlisted,
    sideloaded, or unknown package doing so is a strong concealment indicator. A positive result should
    trigger app review and device triage; a negative result does not clear the device because a tolerated
    app could still abuse the behavior.'
  answer_sources:
  - Mobile EDR file system auditing logs
  - MDM application inventory logs
  - MDM/MTD permission inventory
  - Mobile OS audit logs (logcat/MediaStore events)
  - 'NAI: File systems of corporate-managed Android devices, specifically user-writable directories such
    as /storage/emulated/0/DCIM/, /storage/emulated/0/Pictures/, /storage/emulated/0/Download/, and application-specific
    data folders.'
  range: Last 90 days, with real-time alerting on hidden-file creation events.
  queries:
  - technology: Mobile EDR/Rule pseudocode
    query: 'alert when file_create.name == ''.nomedia'' or file_create.name startswith ''.'' (hidden file/dir)

      and creating_pkg not in mdm_media_system_allowlist;

      enrich with sideload_origin and version policy;

      output device_id, creating_pkg, file_path, timestamp.'
- question: Did a non-system app that holds CAMERA, READ_MEDIA_IMAGES/READ_EXTERNAL_STORAGE, or RECORD_AUDIO
    permissions inconsistent with its declared function create a hidden media folder?
  context: 'Defense Evasion: Stalkerware and spyware typically combine sensitive media-capture permissions
    with concealment. Cross-reference MDM/MTD permission inventory against the file-creation event and
    alert when an app that is NOT a system app holds high-privilege media permissions (CAMERA, READ_MEDIA_IMAGES/READ_EXTERNAL_STORAGE,
    RECORD_AUDIO) that are inconsistent with its stated purpose and then creates a hidden/''.nomedia''
    media folder. Treat rarely-needed high-privilege permissions as a hard risk predicate: a flashlight
    or note-taking app that requests camera+microphone and hides a folder is far more suspicious than
    a sanctioned camera app doing the same. A positive result warrants app reputation review and permission-grant
    audit; pair it with the allowlist rule to reduce noise.'
  answer_sources:
  - Mobile EDR file system auditing logs
  - MDM application inventory logs
  - MDM/MTD permission inventory
  - Mobile OS audit logs (logcat/MediaStore events)
  - 'NAI: File systems of corporate-managed Android devices, specifically user-writable directories such
    as /storage/emulated/0/DCIM/, /storage/emulated/0/Pictures/, /storage/emulated/0/Download/, and application-specific
    data folders.'
  range: Last 90 days.
  queries:
  - technology: MDM/MTD Rule pseudocode
    query: 'for file_create of hidden_media_folder by pkg:

      perms = mdm_permissions(pkg);

      if pkg not system and intersect(perms,{CAMERA,READ_MEDIA_IMAGES,READ_EXTERNAL_STORAGE,RECORD_AUDIO})

      and perms inconsistent_with declared_function: alert;

      output device_id, pkg, perms, file_path.'
- question: Does the directory or file name involved in a hidden-media event have abnormally high character
    entropy, suggesting an obfuscated or randomly generated name?
  context: 'Defense Evasion: Malicious apps often hide media in directories with random/obfuscated names
    to frustrate manual discovery. Compute Shannon (and n-gram) entropy of the directory/file name from
    the file-system audit event and alert when it exceeds the fleet 98th percentile or a hard floor of
    ~3.5, the lexical-entropy signal used for obfuscated/random names. Human-meaningful folder names (DCIM,
    Pictures, WhatsApp Images) score low entropy; a path like ''/storage/emulated/0/.x9Qa7/zk'' scores
    high. High entropy alone is not conclusive but is a strong corroborating predicate when combined with
    non-allowlisted creators or sensitive permissions, and feeds the ML classifier below.'
  answer_sources:
  - Mobile EDR file system auditing logs
  - MDM application inventory logs
  - MDM/MTD permission inventory
  - Mobile OS audit logs (logcat/MediaStore events)
  - 'NAI: File systems of corporate-managed Android devices, specifically user-writable directories such
    as /storage/emulated/0/DCIM/, /storage/emulated/0/Pictures/, /storage/emulated/0/Download/, and application-specific
    data folders.'
  range: Last 90 days.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for each hidden_file_event: H = shannon_entropy(dir_or_file_name);

      ngramH = ngram_entropy(name);

      alert when H > max(3.5, p98(fleet_name_entropy)) ;

      output device_id, pkg, name, H, ngramH.'
- question: For each device, has the rate of hidden-file creations or media files written to non-standard
    paths deviated sharply from that device's own historical baseline?
  context: 'Defense Evasion: A device that suddenly begins creating many hidden files or writing media
    to non-standard locations may be hosting newly active concealment behavior. Baseline the per-device
    count of hidden-file creations and media writes to non-standard paths (count per minute) and alert
    on deviation beyond 3 sigma or the 99th percentile of the device''s history. Profile permission-denied
    and failed storage writes as a distinct signal, because spyware probing storage often generates failed
    writes before succeeding. A sustained spike above baseline indicates a behavioral change worth investigating;
    activity within the normal band supports a benign interpretation.'
  answer_sources:
  - Mobile EDR file system auditing logs
  - MDM application inventory logs
  - MDM/MTD permission inventory
  - Mobile OS audit logs (logcat/MediaStore events)
  - 'NAI: File systems of corporate-managed Android devices, specifically user-writable directories such
    as /storage/emulated/0/DCIM/, /storage/emulated/0/Pictures/, /storage/emulated/0/Download/, and application-specific
    data folders.'
  range: Last 90 days, with a 30-day rolling per-device baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per device per min: hc=count(hidden_file_create); nm=count(media_write to non_standard_path);

      baseline = rolling_30d_mean_std(device);

      alert when hc or nm > mean+3*std or > p99(device_history);

      also track perm_denied_writes, failed_storage_writes as distinct signal;

      output device_id, hc, nm, fail_counts.'
- question: Does an explainable supervised model (Random Forest / Gradient Boosting) classify a '.nomedia'
    creation event as malicious with high probability, and which features drove that verdict?
  context: 'Defense Evasion: A single weak signal rarely confirms concealment, but their combination is
    highly discriminating. Train an explainable Random Forest/GBM on features per ''.nomedia'' event:
    directory name entropy, app age (time since install), permission count and rarity, sideloaded flag,
    store origin, and a standard-media-path flag. Alert when the malicious probability exceeds 0.90 AND
    surface the top-3 contributing features in the alert text (e.g., ''sideloaded=1, perm_rarity=high,
    dir_entropy=4.2'') so analysts can validate quickly. This learns the stalkerware fingerprint of sideload-origin
    + sensitive permissions + concealment + suspicious co-installation that no single rule captures. A
    high-probability, explainable verdict warrants escalation; the explanation lets an analyst rule out
    benign edge cases.'
  answer_sources:
  - Mobile EDR file system auditing logs
  - MDM application inventory logs
  - MDM/MTD permission inventory
  - Mobile OS audit logs (logcat/MediaStore events)
  - 'NAI: File systems of corporate-managed Android devices, specifically user-writable directories such
    as /storage/emulated/0/DCIM/, /storage/emulated/0/Pictures/, /storage/emulated/0/Download/, and application-specific
    data folders.'
  range: Last 90 days for scoring, with periodic retraining on labeled events.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features=[dir_entropy, app_age, perm_count, perm_rarity, sideloaded_flag, store_origin, std_media_path_flag];

      p = RandomForest_or_GBM.predict_proba(features);

      alert when p > 0.90;

      output device_id, pkg, p, top3_features(SHAP).'
- question: Does an LSTM log-key model (DeepLog) flag an improbable device audit-log sequence in which
    a non-media app writes '.nomedia' and then mutates the MediaStore?
  context: 'Defense Evasion: Concealment leaves a characteristic ordering in device audit logs (logcat/MediaStore
    events): a non-media app writes ''.nomedia'' and immediately mutates the MediaStore to hide or re-index
    media. Train a DeepLog-style LSTM log-key model on normal sequences of device audit-log keys and flag
    sequences whose next-key probability is improbably low, surfacing the deviating log key for explainability.
    This catches concealment workflows even when each individual event looks benign, because it is the
    unusual sequence that betrays the behavior. An anomalous sequence centered on a non-media app touching
    ''.nomedia'' then the MediaStore is a strong lead; normal sequences support a benign read.'
  answer_sources:
  - Mobile EDR file system auditing logs
  - MDM application inventory logs
  - MDM/MTD permission inventory
  - Mobile OS audit logs (logcat/MediaStore events)
  - 'NAI: File systems of corporate-managed Android devices, specifically user-writable directories such
    as /storage/emulated/0/DCIM/, /storage/emulated/0/Pictures/, /storage/emulated/0/Download/, and application-specific
    data folders.'
  range: Last 90 days, with sequence modeling over normal device audit-log history.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seq = ordered_log_keys(device_audit_log);

      model = DeepLog_LSTM(train_on=normal_sequences);

      alert when observed_key not in model.topk_predicted(prev_keys)

      and pattern ~ [non_media_app writes .nomedia -> MediaStore mutate];

      output device_id, deviating_log_key, sequence_window.'
- question: Did a mobile device transfer multimedia MIME types to a destination domain or IP that threat
    intelligence flags as known-bad or that behaves as a rare hub destination?
  context: 'Defense Evasion: After concealment, captured media is exfiltrated over the network. Correlate
    Zeek dns.log/http.log against threat intelligence and pivot to files.log by MIME/content sniffing,
    then alert when multimedia MIME types (image/jpeg, video/mp4, image/png) are transferred to known-bad
    or rare hub destinations. The link is strongest when the upload follows a recent ''.nomedia'' creation
    on the same device, tying concealment to exfiltration. A match against threat intel is high-confidence
    evidence of exfiltration to attacker infrastructure; the absence of a match does not clear the device
    because adversaries rotate to fresh, unscored infrastructure (see the novelty and reputation checks).'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Threat intelligence indicators
  - 'NAI: Network egress points monitoring traffic from mobile device subnets, including corporate Wi-Fi
    gateways, VPN concentrators, and Cloud Access Security Brokers (CASB).'
  range: Last 90 days, with real-time alerting on threat-intel matches; correlate with .nomedia events
    on the same device.
  queries:
  - technology: Zeek/pseudocode
    query: 'join dns.log/http.log with threat_intel(domains, ips);

      pivot to files.log where mime_type in {image/jpeg, image/png, video/mp4};

      alert when dst in known_bad or dst is rare_hub;

      output device_id, dst, mime_type, bytes, prior_nomedia_event.'
- question: Did a device upload more than ~10MB of multimedia to a destination domain it has never contacted
    before, exceeding the 95th percentile of typical outbound session size?
  context: 'Defense Evasion: Bulk exfiltration of concealed media shows up as large multimedia uploads
    to novel destinations. Build 30-day baselines of destination domains and outbound session sizes (CICFlowMeter
    Volume features) and alert on >10MB multimedia transfers to domains unseen for that device whose session
    size exceeds the 95th percentile, deriving per-fleet thresholds from labeled flow data. A first-time
    destination receiving a large media payload is a classic exfiltration profile; routine uploads to
    established, sanctioned services (corporate cloud, known backup) fall within baseline and are excluded.
    A breach of both the novelty and volume conditions warrants investigation.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Threat intelligence indicators
  - 'NAI: Network egress points monitoring traffic from mobile device subnets, including corporate Wi-Fi
    gateways, VPN concentrators, and Cloud Access Security Brokers (CASB).'
  range: Last 90 days, with a 30-day rolling baseline of destinations and session sizes.
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'baseline = 30d_per_device(dest_domains, session_size_dist);

      per outbound session with multimedia mime: bytes=orig_bytes;

      alert when dst not in baseline.dest_domains and bytes > 10MB

      and bytes > p95(baseline.session_size);

      output device_id, dst, bytes, mime_type.'
- question: How does the reputation and novelty of an upload destination score on passive-DNS features
    such as domain age, TTL, IP/country count, and name entropy?
  context: 'Defense Evasion: Exfiltration endpoints are often newly registered, short-lived, or algorithmically
    named. Score each upload destination with passive-DNS time/TTL/lexical features (domain age, low TTL,
    IP and country count, name n-gram entropy) and alert on low-reputation or short-lived domains. A young
    domain with a very low TTL, many IPs across many countries, and a high-entropy name is characteristic
    of throwaway exfil infrastructure; an established, well-aged domain with stable hosting is low risk.
    This scoring corroborates volume/novelty alerts and catches exfiltration to infrastructure that has
    not yet appeared on any blocklist.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Threat intelligence indicators
  - 'NAI: Network egress points monitoring traffic from mobile device subnets, including corporate Wi-Fi
    gateways, VPN concentrators, and Cloud Access Security Brokers (CASB).'
  range: Last 90 days.
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'for each upload dst: feats=[domain_age, min_ttl, ip_count, country_count, name_ngram_entropy];

      rep = passive_dns_reputation(feats);

      alert when domain_age < threshold or min_ttl low or rep == low;

      output device_id, dst, feats, rep.'
- question: Is a device showing a spike in egress failure states (NXDOMAIN, TLS/SSL handshake failures,
    or blocked/denied outbound connections) that often precedes a successful exfiltration upload?
  context: 'Defense Evasion: Exfiltration to throwaway infrastructure frequently produces a burst of failure
    states before a successful upload, because the malicious endpoints are unreliable, mis-resolving,
    or blocked. Track per-device rates of NXDOMAIN responses, TLS/SSL handshake failures, and blocked/denied
    outbound connections as distinct signals rather than discarding them as noise, and alert when these
    failure rates spike. A surge of failed resolutions and handshakes from a device, especially preceding
    a large multimedia upload, suggests attempts to reach attacker infrastructure; this State signal complements
    the Volume and Frequency profiling and improves detection robustness.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Threat intelligence indicators
  - 'NAI: Network egress points monitoring traffic from mobile device subnets, including corporate Wi-Fi
    gateways, VPN concentrators, and Cloud Access Security Brokers (CASB).'
  range: Last 90 days, with per-device failure-rate baselining.
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'per device: nx=count(dns.rcode==NXDOMAIN); tlsf=count(ssl handshake_fail);

      blk=count(conn blocked/denied);

      baseline=rolling_per_device(nx,tlsf,blk);

      alert when any rate > mean+3*std (esp. preceding large multimedia upload);

      output device_id, nx, tlsf, blk, window.'
- question: Does a multimedia upload originate from an encrypted flow whose fingerprint matches no known
    benign app, suggesting an unknown or stalkerware app is exfiltrating media?
  context: 'Defense Evasion: Even over TLS, an app''s traffic has a recognizable fingerprint in destination
    clusters, certificates, and temporal correlation. Apply unsupervised app fingerprinting (FlowPrint)
    to encrypted flow metadata and flag multimedia uploads from flows that match no known benign app fingerprint.
    Sanctioned apps (corporate mail, approved cloud storage) cluster into recognizable fingerprints; a
    media upload from a flow that matches none of them indicates an unidentified or covert app, consistent
    with spyware/stalkerware exfiltration. A no-match multimedia flow is a strong lead for app attribution
    and device triage; matching a benign fingerprint lowers concern.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Threat intelligence indicators
  - 'NAI: Network egress points monitoring traffic from mobile device subnets, including corporate Wi-Fi
    gateways, VPN concentrators, and Cloud Access Security Brokers (CASB).'
  range: Last 90 days, with periodic refresh of benign app fingerprints.
  queries:
  - technology: Zeek/ML pseudocode
    query: 'fp = FlowPrint(flow_metadata=[dest_clusters, certs, temporal_corr]);

      match = nearest(benign_app_fingerprints, fp);

      alert when flow carries multimedia and match == none;

      output device_id, flow_id, fp, dst.'
- question: Does a time-series anomaly model on a device's hourly multimedia byte volume, or a flow classifier
    on its conn.log features, flag an exfiltration anomaly, and which flow features drove it?
  context: 'Defense Evasion: Sustained or bursty media exfiltration shows up as a departure from a device''s
    normal hourly multimedia traffic and as anomalous flow structure. Train a time-series anomaly model
    on hourly per-device multimedia byte volumes and a compact flow classifier on correlation-selected
    byte/packet/inter-arrival-time/ratio features; enrich anomalies with clustering on conn.log features
    to identify novel traffic clusters, and surface the top-3 contributing flow features in each alert.
    Running these alongside the deterministic and statistical layers means detection never relies on one
    method. A device whose hourly media volume spikes far above its learned baseline and whose flows form
    a novel cluster warrants investigation; the explained features let an analyst confirm whether it is
    exfiltration or benign large media sync.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Threat intelligence indicators
  - 'NAI: Network egress points monitoring traffic from mobile device subnets, including corporate Wi-Fi
    gateways, VPN concentrators, and Cloud Access Security Brokers (CASB).'
  range: Last 90 days, with hourly per-device aggregation and >=30 days of training history.
  queries:
  - technology: Zeek/ML pseudocode
    query: 'series = hourly_multimedia_bytes(device);

      ts_model = TimeSeriesAnomaly(train>=30d); forecast,ci = ts_model.predict(series);

      flow_feats = corr_selected([bytes,packets,iat,ratios]); cls = FlowClassifier.predict(flow_feats);

      clusters = cluster(conn_log_features);

      alert when observed outside ci or cls==exfil or novel_cluster;

      output device_id, spike_window, top3_flow_features.'
