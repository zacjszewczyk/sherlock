name: 'T1420: File and Directory Discovery'
id: 472305fb-0bfb-4142-9297-3ed724baa810
description: 'Investigate potential adversary File and Directory Discovery on corporate-managed Android
  and iOS mobile devices. This playbook helps an analyst determine whether an application or process is
  enumerating files and directories at machine speed to locate sensitive data, rather than performing
  legitimate user-driven browsing. It chains three investigative phases: (1) detecting anomalous file-access
  behavior (high volumes of unique path reads in external/shared storage, sensitive file-extension targeting,
  traversal entropy, and sandbox-denied read failures); (2) detecting suspicious high-risk storage permission
  grants (MANAGE/READ_EXTERNAL_STORAGE to sideloaded, non-allow-listed, or category-incongruous apps);
  and (3) correlating those discovery precursors with subsequent outbound exfiltration (new destinations,
  volume spikes, DNS/connection failures, and forecast deviations). Together these questions help the
  analyst confirm whether a device has been used to discover and stage sensitive corporate data for collection
  and exfiltration, with particular attention to devices belonging to executives and privileged users.'
type: technique
related:
- tactic_id: TA0032
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any non-allow-listed apps (by package/UID) reading more than 10 distinct files with sensitive
    extensions (.kdbx, .pem, .bak, .sql, .db, .mdf, .gnucash) within a 5-minute window, or touching more
    than 100 unique paths in external/shared storage in 5 minutes?
  context: 'This question targets the read-then-collect predicate of File and Directory Discovery on Android:
    an app systematically reading many files - especially credential stores, keys, backups, and financial
    databases - is funneling sensitive data for collection rather than responding to user actions. A SIEM/MTD
    symbolic rule codifies the information-flow read predicate (TaintDroid) and the file-funneling union
    threshold of a single process touching many files across directories (CryptoDrop), gated on storage-permission
    capability features (Drebin). A positive result for an app not on the corporate allow-list is high-signal
    for discovery; enrich with device owner and MDM compliance status. A negative result, or a hit from
    an allow-listed file manager/backup app, lowers priority. This directly serves the Discovery (TA0032)
    tactic by catching automated environment orientation on the device.'
  answer_sources:
  - MTD/EDR file access logs
  - Android logcat
  - Zeek files.log
  - 'NAI: MDM/MTD/UEM management consoles aggregating endpoint telemetry from corporate-owned or managed
    Android devices. Specific focus on devices assigned to executives or users with privileged access.
    Centralized SIEM platform for log correlation and analysis.'
  range: Last 90 days (evaluate over 5-minute sliding windows)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM file_access_logs (android:logcat, MTD/EDR)\nWHERE package NOT IN approved_applications\n\
      BIN time INTO 5m WINDOWS BY package, uid, device_id\nLET sensitive = COUNT(DISTINCT path WHERE path\
      \ ENDSWITH IN\n  ['.kdbx','.pem','.bak','.sql','.db','.mdf','.gnucash'] AND op='READ')\nLET ext_paths\
      \ = COUNT(DISTINCT path WHERE path MATCHES\n  '/sdcard|/storage/emulated/0|/Android/media|/Documents')\n\
      WHERE sensitive > 10 OR ext_paths > 100\nENRICH device_owner, compliance_status FROM MDM\nEMIT alert(severity=high,\
      \ tag='mobile_discovery')"
- question: Does any managed application's file-access behavior exceed its own 30-day rolling baseline
    for unique paths read per hour, unique parent directories touched per hour, bytes read per hour, or
    directory-name entropy in a 5-minute window?
  context: This question detects per-app behavioral drift that signals enumeration even when absolute
    volumes look modest for some apps. Compute per-application 99th-percentile thresholds over a 30-day
    window for read breadth and volume (ShieldFS-style per-process profiling), alert with a transparent
    mean +/- 3-sigma model naming the deviating metric for triage, and add Shannon entropy of accessed
    parent-directory names - high entropy indicates wide traversal/enumeration (CryptoDrop). A positive
    result means the app deviated from its established norm; the named metric tells the analyst whether
    breadth, volume, or traversal drove it. A negative result means behavior is within historical norms.
    Supports Discovery (TA0032) by surfacing automated, non-user-driven file discovery.
  answer_sources:
  - MTD/EDR file access logs
  - Android logcat
  - Zeek files.log
  - 'NAI: MDM/MTD/UEM management consoles aggregating endpoint telemetry from corporate-owned or managed
    Android devices. Specific focus on devices assigned to executives or users with privileged access.
    Centralized SIEM platform for log correlation and analysis.'
  range: Last 90 days (30-day rolling baseline; 5-minute entropy windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM file_access_logs (android:logcat) PER app\nBASELINE over 30d: p99(unique_paths_read/hr),\
      \ p99(unique_parent_dirs/hr),\n  p99(bytes_read/hr), mean+3sigma per metric\nFOR current_hour COMPUTE\
      \ same metrics PER app\nALERT(medium, name_metric) WHERE metric > app.threshold\nALSO BIN 5m: H\
      \ = shannon_entropy(parent_dir_names)\nALERT WHERE H > app.p95(historical_entropy)"
- question: Is any app generating a spike in denied or blocked file-access failures (SELinux avc denials,
    EACCES/EPERM on open/readdir/stat) beyond its baseline (mean + 3-sigma or >20 EACCES events in 5 minutes)?
  context: 'Read-failure state is itself a discovery signal: an app probing paths outside its sandbox
    during enumeration generates a burst of permission-denied errors before it finds accessible data.
    Baseline each app''s denied-read rate from logcat/kernel audit and alert on deviations (standard-deviation
    failure baselining), using the syscall-level denial telemetry (open/readdir/stat) that reconstructs
    the OS view (DroidScope). A positive result - an unusual spike of EACCES/EPERM/avc denials - indicates
    an app systematically testing paths beyond its DAC/SELinux sandbox, characteristic of brute-force
    directory discovery. A negative result means failures are within normal bounds. Serves Discovery (TA0032)
    by catching enumeration attempts that are blocked but still reveal adversary intent.'
  answer_sources:
  - MTD/EDR file access logs
  - Android logcat
  - Zeek files.log
  - 'NAI: MDM/MTD/UEM management consoles aggregating endpoint telemetry from corporate-owned or managed
    Android devices. Specific focus on devices assigned to executives or users with privileged access.
    Centralized SIEM platform for log correlation and analysis.'
  range: Last 90 days (5-minute windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM android:logcat, kernel_audit\nWHERE event IN ['avc: denied','EACCES','EPERM']\n  AND\
      \ syscall IN ['open','openat','readdir','stat','lstat']\nBIN 5m BY package, uid, device_id\nBASELINE\
      \ 30d per app: mean,sigma of denied_read_rate\nALERT WHERE denied_reads > mean+3*sigma OR count(EACCES)\
      \ > 20"
- question: When scoring per-process 5-minute file-activity windows with an Isolation Forest, which windows
    are flagged as anomalous, and what are the top-3 contributing features?
  context: 'This unsupervised ML question catches multivariate anomalies that single thresholds miss.
    Train an Isolation Forest on benign per-app behavior using features: file-read count, file-write count,
    directory-listing count, listing-to-read ratio, average path depth, unique-directory count, denied-read
    (EACCES) count, off-hours flag, and Shannon entropy of file extensions. Flag windows whose anomaly
    score exceeds the tuned threshold for tier-2 review. Per Drebin-style explainability, alerts MUST
    surface the top-3 contributing features (e.g., unique_directories, denied_reads, extension_entropy)
    so analysts understand why a window was flagged; retrain periodically to handle concept drift. A positive
    result is a high-anomaly window with an interpretable feature attribution pointing to enumeration;
    a negative result is normal app behavior. Supports Discovery (TA0032) by detecting subtle automated
    discovery patterns.'
  answer_sources:
  - MTD/EDR file access logs
  - Android logcat
  - Zeek files.log
  - 'NAI: MDM/MTD/UEM management consoles aggregating endpoint telemetry from corporate-owned or managed
    Android devices. Specific focus on devices assigned to executives or users with privileged access.
    Centralized SIEM platform for log correlation and analysis.'
  range: Last 90 days (per-process 5-minute windows; periodic retraining)
  queries:
  - technology: ML/pseudocode
    query: "FEATURES per (process,5m): read_count, write_count, listing_count,\n  listing_to_read_ratio,\
      \ avg_path_depth, unique_dirs, eacces_count,\n  off_hours_flag, extension_entropy\nMODEL = IsolationForest(trained\
      \ on benign per-app windows)\nscore = MODEL.decision_function(window)\nIF score < tuned_threshold:\n\
      \  EMIT alert(tier2, top3_features=path_length_attribution(window))"
- question: Has any application been granted android.permission.MANAGE_EXTERNAL_STORAGE or READ_EXTERNAL_STORAGE
    while it is NOT on the corporate allow-list, was sideloaded, or has a category incongruous with broad
    file-system access (e.g., a 'Calculator')?
  context: Broad storage permissions are the capability that gates file-discovery primitives, so a grant
    to a suspicious app is a strong precursor. Forward every permission state change to GRANTED for these
    high-risk permissions from MDM/UEM to the SIEM and fire a correlation rule when the package is not
    approved, OR source is Sideloaded, OR the declared category is incongruous with storage access. These
    permission predicates are the high-signal capability features (Drebin) that enable the file-discovery
    primitives (DroidScope). A positive result is a risky grant requiring immediate SOC review with device-owner/compliance
    enrichment; a negative result is a routine grant to an approved, expected app. Serves Discovery (TA0032)
    by interdicting discovery before files are enumerated.
  answer_sources:
  - MDM application inventory logs
  - MTD security policy violation events
  - Google Play Store API application metadata
  - MDM application source logs
  - 'NAI: Corporate MDM/UEM platform, MTD management console, and the internal repository defining the
    corporate application allow-list. Centralized SIEM for correlation and alerting. Threat intelligence
    platform for enriching application package names with reputation data.'
  range: Last 90 days (real-time on grant events)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM mdm_permission_events\nWHERE permission IN ['MANAGE_EXTERNAL_STORAGE','READ_EXTERNAL_STORAGE']\n\
      \  AND new_state = 'GRANTED'\nWHERE package NOT IN approved_applications\n   OR source = 'Sideloaded'\n\
      \   OR category_incongruous(declared_category)\nENRICH device_owner, compliance, ti_reputation(package)\n\
      EMIT alert(severity=high, queue=SOC)"
- question: Does any single app's storage-permission grant rate per 1000 devices exceed 3 standard deviations
    above its category's 30-day moving average, or show an abrupt change-point in its daily grant-rate
    series?
  context: A trojanized update or targeted campaign manifests as a sudden surge in storage-permission
    grants for an app relative to its peers. Aggregate MDM permission-grant logs daily by app category
    and per-1000-devices rate; alert when an app exceeds 3-sigma above its category's 30-day moving average
    (standard-deviation anomaly baselining). In parallel, run online change-point detection (CUSUM/Bayesian/PELT)
    on each app's daily grant-rate series to catch abrupt regime shifts. A positive result - a spike or
    change-point - indicates a fleet-wide shift in an app's permission behavior, consistent with a pushed
    malicious update; a negative result is steady, expected grant rates. Supports Discovery (TA0032) by
    detecting campaign-scale enablement of file discovery.
  answer_sources:
  - MDM application inventory logs
  - MTD security policy violation events
  - Google Play Store API application metadata
  - MDM application source logs
  - 'NAI: Corporate MDM/UEM platform, MTD management console, and the internal repository defining the
    corporate application allow-list. Centralized SIEM for correlation and alerting. Threat intelligence
    platform for enriching application package names with reputation data.'
  range: Last 90 days (daily aggregation; 30-day moving average)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM mdm_permission_events DAILY

      AGG grant_rate_per_1000 BY app, category

      BASELINE 30d MA + sigma PER category

      ALERT(medium) WHERE app.grant_rate > category_MA + 3*sigma

      ALSO changepoint = PELT/CUSUM(app.daily_grant_rate_series)

      ALERT WHERE changepoint DETECTED'
- question: At permission-grant time, what Application Risk Score (0-1) does the classifier assign, and
    which apps score above 0.8 (triggering automated MDM quarantine)?
  context: 'This ML question quantifies risk at the decision point. Train and periodically retrain a logistic-regression
    or gradient-boosted classifier producing a 0-1 Application Risk Score from features: app source (Managed
    Play / Public Play / Sideloaded), developer reputation, total requested permissions, ratio of dangerous-to-normal
    permissions, and a binary MANAGE_EXTERNAL_STORAGE flag. A grant to an app scoring >0.8 triggers automated
    MDM quarantine. Per Drebin''s explainable design, the alert MUST list the top-3 contributing features
    (e.g., source=Sideloaded, manage_external_storage, permission_count); guard against temporal/spatial
    bias in feature selection. A positive result is a high-risk app earning quarantine with an interpretable
    rationale; a negative result is a low-risk, expected grant. Serves Discovery (TA0032) by automatically
    blocking apps most likely to perform file discovery.'
  answer_sources:
  - MDM application inventory logs
  - MTD security policy violation events
  - Google Play Store API application metadata
  - MDM application source logs
  - 'NAI: Corporate MDM/UEM platform, MTD management console, and the internal repository defining the
    corporate application allow-list. Centralized SIEM for correlation and alerting. Threat intelligence
    platform for enriching application package names with reputation data.'
  range: Last 90 days (scored at grant time; periodic retraining)
  queries:
  - technology: ML/pseudocode
    query: "FEATURES at grant: source_onehot(ManagedPlay,PublicPlay,Sideloaded),\n  developer_reputation,\
      \ total_permissions, dangerous_to_normal_ratio,\n  manage_external_storage_flag\nscore = MODEL.predict_proba(features)\
      \  # logistic / GBM, 0-1\nIF score > 0.8:\n  MDM.quarantine(device, package)\n  EMIT alert(top3_features)"
- question: After a mobile_discovery alert on a device, does that device within 60 minutes connect to
    a destination IP or resolved domain that matches a high-confidence C2/exfiltration threat-intel feed?
  context: 'This question completes the read-then-transmit information-flow chain: discovery on the device
    followed by transmission to known-bad infrastructure is decisive evidence of exfiltration. Build a
    stateful SIEM rule that, on an alert tag=mobile_discovery for a device_ip, watches the next 60 minutes
    for connections whose destination IP or resolved DNS query matches a high-confidence C2/exfil TI feed,
    raising a critical alert with both events attached (realizing TaintDroid''s read-then-transmit signal
    and PiOS''s file/photo-to-network data-flow analogue on iOS). A positive result is a discovery precursor
    chained to a known-bad destination - escalate to incident response. A negative result means no known-bad
    contact followed the precursor. Serves Discovery (TA0032) by confirming the operational payoff of
    file discovery.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - VPN access logs
  - MTD/EDR network flow logs
  - 'NAI: Network traffic sensors (e.g., Zeek) monitoring traffic from the corporate Wi-Fi SSID, VPN concentrator
    egress points, and CASB proxies. DNS resolver logs. All logs should be aggregated in a central SIEM
    for correlation.'
  range: 'Last 90 days (event-centered: 60 minutes after each mobile_discovery alert)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ON alert(tag='mobile_discovery') FOR device_ip\nWATCH next 60m IN Zeek conn.log, dns.log\n\
      WHERE src_ip = device_ip\n  AND (dst_ip IN ti_c2_exfil_feed\n       OR resolved(dns_query) IN ti_c2_exfil_feed)\n\
      EMIT alert(severity=critical, attach=[discovery_event, egress_event])"
- question: After a mobile_discovery alert, does the device contact any new destination FQDN not seen
    in the prior 30 days, or does its outbound volume in the next hour exceed the user's 98th percentile
    (or >50MB)?
  context: Even without a TI match, novel destinations and volume spikes after discovery indicate staging
    and exfiltration. On a tag=mobile_discovery alert for device_ip, (1) build a 30-day baseline of destination
    FQDNs from Zeek dns.log for that user and alert on any new destination in the next hour; (2) sum orig_bytes
    from Zeek conn.log over that hour and alert if outbound volume exceeds the user's 98th percentile
    from a 30-day rolling window. Combine destination-novelty with lexical/entropy scoring of queried
    domains (DNS-exfil percentile + entropy recipe) and name the deviating metric (standard-deviation
    baselining). A positive result is a new destination or volume surge consistent with exfiltration;
    a negative result is normal egress to familiar endpoints. Supports Discovery (TA0032) by detecting
    data movement following discovery.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - VPN access logs
  - MTD/EDR network flow logs
  - 'NAI: Network traffic sensors (e.g., Zeek) monitoring traffic from the corporate Wi-Fi SSID, VPN concentrator
    egress points, and CASB proxies. DNS resolver logs. All logs should be aggregated in a central SIEM
    for correlation.'
  range: 'Last 90 days (event-centered: 60 minutes after alert; 30-day baseline)'
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'ON alert(tag=''mobile_discovery'') FOR device_ip

      BASELINE 30d: set(dst_fqdn) per user FROM Zeek dns.log

      NEXT 1h: ALERT on any dst_fqdn NOT IN baseline_set

      ALSO sum_out = SUM(orig_bytes) Zeek conn.log over 1h

      ALERT WHERE sum_out > user.p98(30d) OR sum_out > 50MB

      SCORE domain entropy/lexical; name deviating metric'
- question: After a mobile_discovery alert, are there spikes in DNS NXDOMAIN responses, blocked/denied
    egress, or TCP connection failures (conn_state S0/REJ) from the device that exceed baseline?
  context: Failure state distinguishes DGA/beaconing and exfil-to-dead-infrastructure from benign browsing.
    After a mobile_discovery alert, baseline and alert on spikes in NXDOMAIN responses (Zeek dns.log rcode),
    blocked/denied egress, and TCP connection failures (Zeek conn.log conn_state S0/REJ) from device_ip
    - high failed-resolution/failed-connection ratios indicate automated callback attempts rather than
    human browsing (DNS-exfil failure baselining + standard-deviation anomaly detection, with entropy
    of failed queries). A positive result is an abnormal burst of failed lookups/connections suggesting
    beaconing or contact with decommissioned C2; a negative result is normal resolution/connection success.
    Serves Discovery (TA0032) by exposing covert channels attempted after discovery.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - VPN access logs
  - MTD/EDR network flow logs
  - 'NAI: Network traffic sensors (e.g., Zeek) monitoring traffic from the corporate Wi-Fi SSID, VPN concentrator
    egress points, and CASB proxies. DNS resolver logs. All logs should be aggregated in a central SIEM
    for correlation.'
  range: Last 90 days (event-centered after alert; with baseline)
  queries:
  - technology: Zeek/pseudocode
    query: 'ON alert(tag=''mobile_discovery'') FOR device_ip

      FROM Zeek dns.log: count NXDOMAIN (rcode=3) BY device_ip

      FROM Zeek conn.log: count conn_state IN [''S0'',''REJ'']

      FROM firewall: count blocked/denied egress

      BASELINE 30d mean+3sigma per metric

      ALERT WHERE any metric > baseline; entropy(failed_queries)'
- question: After a mobile_discovery alert, does the device's actual hourly outbound volume exceed the
    per-user time-series forecast upper confidence interval, and does an Isolation Forest flag the post-alert
    egress window as anomalous?
  context: 'This ML question fuses forecasting and multivariate anomaly detection on egress. Maintain
    per-user Prophet (or similar) forecasts of hourly outbound volume (sum orig_bytes from Zeek conn.log);
    on a mobile_discovery precursor, raise high severity if actual volume exceeds the forecast upper confidence
    interval (yhat_upper). In parallel, score the post-alert window with an Isolation Forest over features:
    total orig_bytes, unique destinations, new-destination count, mean DNS-query entropy, and NXDOMAIN
    ratio. Alerts MUST list the top-3 contributing features for SOC triage. A positive result is volume
    above the forecasted envelope and/or a high-anomaly egress window with interpretable drivers, consistent
    with exfiltration; a negative result is egress within forecast and normal anomaly scores. Supports
    Discovery (TA0032) by catching exfiltration that deviates from the user''s learned pattern.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - VPN access logs
  - MTD/EDR network flow logs
  - 'NAI: Network traffic sensors (e.g., Zeek) monitoring traffic from the corporate Wi-Fi SSID, VPN concentrator
    egress points, and CASB proxies. DNS resolver logs. All logs should be aggregated in a central SIEM
    for correlation.'
  range: Last 90 days (event-centered after alert; per-user forecasting)
  queries:
  - technology: ML/pseudocode
    query: "FORECAST per user: Prophet(hourly SUM orig_bytes, Zeek conn.log)\nON alert(tag='mobile_discovery'):\n\
      \  IF actual_hour_volume > yhat_upper: EMIT alert(high)\nFEATURES(window): total_orig_bytes, unique_dst,\
      \ new_dst_count,\n  mean_dns_entropy, nxdomain_ratio\nIF IsolationForest.score(window) < threshold:\n\
      \  EMIT alert(top3_features)"
