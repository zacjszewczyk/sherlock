questions:
- question: Are any mobile devices establishing outbound connections to destinations (IPs, domains, or
    TLS JA3/JA3S fingerprints) that match known command-and-control infrastructure in threat intelligence?
  context: A scheduled task used for persistence frequently maintains a C2 channel that wakes on a fixed
    cadence. By correlating destination IPs from conn.log with resolved domains from dns.log and the TLS
    server_name from ssl.log, then comparing IPs, domains, and JA3/JA3S fingerprints against C2 threat-intel
    feeds (surfacing matches in intel.log), the analyst can confirm a known-bad endpoint. A mobile scheduled-task
    C2 channel often presents a JA3 distinct from the device's normal browser/app TLS stacks, so a novel
    JA3 to a low-reputation destination is a strong corroborating signal. A positive match is high-fidelity
    evidence of persistence; a negative result does not clear the device because intel feeds lag novel
    infrastructure.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek intel.log
  - 'NAI: Corporate Wi-Fi access points, VPN gateways, Network egress points, Cloud Access Security Brokers
    (CASB), Mobile Device Management (MDM) platforms.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  conn = load(conn.log) where id.orig_h in MOBILE_RANGES\n  join dns.log on conn.id.resp_h\
      \ -> query; join ssl.log on conn.uid -> server_name, ja3, ja3s\n  for each (resp_ip, query, server_name,\
      \ ja3, ja3s):\n    if resp_ip in TI_C2 or query in TI_C2 or server_name in TI_C2 or ja3 in TI_JA3\
      \ or ja3s in TI_JA3:\n      alert(intel.log match, device=conn.id.orig_h)"
- question: Which mobile devices exhibit highly uniform, low-jitter outbound connections to a single destination,
    as measured by inter-arrival jitter and Gini coefficients of connection duration and bytes?
  context: 'Automated, non-interactive scheduled C2 beaconing produces statistically uniform traffic:
    low variance in inter-arrival timing and tightly clustered connection durations and byte counts. For
    each mobile source IP, group connections by destination over a 24-hour window and compute the coefficient
    of variation/MAD of inter-arrival times (jitter) plus the Gini coefficient of duration and total bytes
    (RITA-style). Devices in the bottom 5th percentile of jitter (or < 5 seconds) with both Gini coefficients
    below 0.2 are likely beaconing. Derive percentile cutoffs from a 30-day baseline where possible. Low
    uniformity is normal human/app traffic; extreme uniformity to one destination is the persistence beacon
    signature.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek intel.log
  - 'NAI: Corporate Wi-Fi access points, VPN gateways, Network egress points, Cloud Access Security Brokers
    (CASB), Mobile Device Management (MDM) platforms.'
  range: Last 90 days (24-hour grouping windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for each src in MOBILE_RANGES, each dst over 24h window:\n    jitter = mad(inter_arrival_times);\
      \ gini_dur = gini(durations); gini_bytes = gini(total_bytes)\n    if jitter < percentile(5, baseline)\
      \ or jitter < 5s:\n      if gini_dur < 0.2 and gini_bytes < 0.2: flag(src, dst, beacon_candidate)"
- question: For beacon-candidate device/destination pairs, does spectral analysis confirm a statistically
    significant periodic cadence (e.g., a dominant peak at a 1-hour interval)?
  context: Uniformity flags candidates; spectral analysis confirms the schedule. Build a time series of
    connection start times for each flagged pair and apply FFT/autocorrelation (BAYWATCH/RITA) to extract
    the dominant period (e.g., a peak at 1/3600 Hz indicates a 1-hour interval matching a scheduled job).
    Suppress benign periodic services with a popularity/allowlist filter and known campus-edge cadence
    baselines. A strong periodic signal to a low-reputation destination is a high-fidelity alert pinpointing
    the scheduled-task interval; the absence of a dominant period suggests human-driven or irregular traffic.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek intel.log
  - 'NAI: Corporate Wi-Fi access points, VPN gateways, Network egress points, Cloud Access Security Brokers
    (CASB), Mobile Device Management (MDM) platforms.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for each flagged (src, dst):\n    ts = series(connection_start_times)\n    spectrum\
      \ = FFT(ts); period = dominant_period(autocorrelation(ts))\n    if significant_peak(spectrum) and\
      \ dst not in BENIGN_PERIODIC_ALLOWLIST:\n      alert(src, dst, period, low_reputation=dst in LOW_REP)"
- question: Do machine-learning sequence models classify any mobile traffic timing patterns as beaconing
    despite jitter or OS-tolerance randomization that defeats fixed-interval rules?
  context: Sophisticated scheduled callbacks add jitter or exploit OS scheduling tolerance to evade fixed-interval
    and CV thresholds. Train a sequence model (LSTM/transformer or Continuous-Time HMM) on benign mobile
    traffic timing features (inter-arrival time, burst length, byte ratios, destination stability) and
    use it to flag jittered, randomized callbacks. Per explainable-AI requirements, every alert must surface
    the top-3 contributing features (e.g., dominant period, jitter percentile, destination rarity) in
    the alert text, not just a score, so analysts can triage. A model hit on a low-reputation destination
    corroborates a scheduled persistence channel that evaded statistical rules.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek intel.log
  - 'NAI: Corporate Wi-Fi access points, VPN gateways, Network egress points, Cloud Access Security Brokers
    (CASB), Mobile Device Management (MDM) platforms.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  model = LSTM_or_CTHMM(trained_on=benign_mobile_timing)\n  feats = [inter_arrival, burst_len,\
      \ byte_ratio, dst_stability]\n  score, top_feats = model.predict(feats, explain=top3)\n  if score\
      \ > threshold: alert(device, dst, score, top_feats)"
- question: Has a per-app/per-destination allowlist of legitimate periodic background sync been built
    so that periodicity is scored only against unexpected destinations?
  context: 'Managed mobile fleets generate large volumes of benign periodic traffic (OS updates, push
    notifications, mail/calendar sync) that mimics beaconing. Build a per-app/per-destination allowlist
    of legitimate periodic background sync using characterized period and volume distributions, and subtract
    these known cadences before alerting. This materially lowers false positives so periodicity scoring
    focuses only on unexpected destinations. This is a suppression/tuning question: the output is a curated
    allowlist that improves the fidelity of every other beaconing analytic rather than a standalone alert.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek intel.log
  - 'NAI: Corporate Wi-Fi access points, VPN gateways, Network egress points, Cloud Access Security Brokers
    (CASB), Mobile Device Management (MDM) platforms.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for each (app, dst) periodic pair:\n    if matches_known_benign(period_dist, volume_dist):\
      \ add(app, dst) to BENIGN_PERIODIC_ALLOWLIST\n  // beaconing alerts: score periodicity only where\
      \ (app, dst) not in BENIGN_PERIODIC_ALLOWLIST"
- question: Has any mobile device abruptly transitioned from irregular human-driven traffic to a stable
    low-jitter cadence, marking the onset of a malicious schedule?
  context: The moment a device is compromised and a malicious schedule begins is detectable as a change
    point in its traffic regularity. Apply change-point detection (CUSUM/PELT/Bayesian online) to each
    device's per-destination connection-rate and inter-arrival time series, and alert when a device shifts
    from irregular traffic to a stable low-jitter cadence. This onset detection is more robust than a
    static threshold for newly compromised devices because it adapts to each device's own history. A detected
    transition aligned with a low-reputation destination is strong evidence a scheduled persistence task
    was just installed.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek intel.log
  - 'NAI: Corporate Wi-Fi access points, VPN gateways, Network egress points, Cloud Access Security Brokers
    (CASB), Mobile Device Management (MDM) platforms.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for each device, each dst:\n    series = inter_arrival_and_rate_timeseries\n    cp =\
      \ changepoint_detect(series, method=PELT_or_CUSUM)\n    if cp and post_cp_jitter << pre_cp_jitter:\n\
      \      alert(device, dst, onset_time=cp, new_cadence=post_cp_period)"
- question: Are any mobile devices connecting to non-standard ports outside the approved business application
    allowlist, or generating DNS anomalies indicative of tunneling?
  context: A scheduled task may exfiltrate or signal over covert channels using non-standard ports or
    DNS tunneling. Maintain an allowlist of approved business application ports (>1024) and flag any connection
    from a mobile device IP to a port not on the list. Concurrently monitor weird.log for notices such
    as dns_unmatched_reply or data_after_close from mobile ranges, and flag DNS queries whose lexical
    profile (length, distinct-character count, label count, Shannon entropy) exceeds stateless DNS-exfiltration
    thresholds. A match suggests a covert channel; clean results across ports and DNS lexical profiles
    reduce suspicion of tunneling-based persistence.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek weird.log
  - 'NAI: Corporate Wi-Fi access points, VPN gateways, Network egress points, Internal DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  for c in conn.log where id.orig_h in MOBILE_RANGES:\n    if c.id.resp_p not in APPROVED_PORTS:\
      \ alert(non_standard_port, c)\n  for w in weird.log where src in MOBILE_RANGES:\n    if w.name in\
      \ {dns_unmatched_reply, data_after_close}: alert(w)\n  for d in dns.log where src in MOBILE_RANGES:\n\
      \    if length(d.query)>T or entropy(d.query)>T or label_count(d.query)>T: alert(dns_tunnel_candidate,\
      \ d)"
- question: Which mobile devices statistically exceed their peer-group baseline (by OS, department, owner)
    for non-standard-port traffic ratio or DNS query size/entropy?
  context: Devices sharing an OS and business role should behave similarly; a scheduled-task covert channel
    makes one device an outlier. Define peer groups using MDM data (OS, department, owner) and, for each
    device, compute the ratio of non-standard-port traffic, connection frequency, and the average size/entropy
    of DNS TXT/NULL queries. Flag devices exceeding the 98th percentile or 2 standard deviations from
    the peer-group baseline. Explicitly track NXDOMAIN/SERVFAIL response rates as a distinct DGA-polling
    failure-mode signal. Peer-relative outliers are more defensible than absolute thresholds because they
    account for role-specific normal behavior.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek weird.log
  - 'NAI: Corporate Wi-Fi access points, VPN gateways, Network egress points, Internal DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  peers = group_devices_by(MDM.os, MDM.dept, MDM.owner)\n  for device in peers:\n    ns_ratio\
      \ = nonstd_port_bytes/total_bytes; dns_sz = mean(txt_null_query_size); dns_ent = mean(entropy)\n\
      \    nxd_rate = nxdomain_count/dns_count\n    if any_metric > p98(peer) or > mean(peer)+2*std(peer):\
      \ flag(device, metric)"
- question: Do unsupervised clustering models identify mobile devices as covert-channel outliers based
    on multi-dimensional protocol, port, DNS, and TLS features?
  context: Covert channels manifest across multiple correlated features that single thresholds miss. Build
    a per-device feature vector (protocol distribution, port entropy, average connection duration, total
    bytes, DNS query-length entropy, A/AAAA-vs-TXT/NULL ratio, JA3 distribution) and apply Isolation Forest
    (or DBSCAN) trained on benign-only data to flag outliers. Report the top-3 SHAP-ranked features driving
    each outlier in the alert so analysts can triage covert-channel candidates quickly. An outlier whose
    explanation centers on DNS entropy or non-standard ports points to tunneling-based persistence; a
    device clustering with its peers is unremarkable.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek weird.log
  - 'NAI: Corporate Wi-Fi access points, VPN gateways, Network egress points, Internal DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = per_device_vector(proto_dist, port_entropy, avg_duration, total_bytes,\n       \
      \                 dns_qlen_entropy, txt_null_ratio, ja3_dist)\n  model = IsolationForest(train=benign_only)\n\
      \  for device in X:\n    score, shap = model.decision(device, explain=top3)\n    if score < anomaly_threshold:\
      \ alert(device, score, shap)"
- question: Are any sideloaded or non-managed apps registering background work via Android WorkManager/JobScheduler/AlarmManager
    or iOS NSBackgroundActivityScheduler with repeating or deferred semantics?
  context: The control-plane signature of T1603 persistence is an untrusted app enqueueing scheduled background
    work. Maintain an allowlist of apps permitted to enqueue background work and, using mobile EDR/OS-API
    telemetry, alert when a sideloaded or non-managed app calls WorkManager.enqueue/PeriodicWorkRequest,
    JobScheduler.schedule, or AlarmManager.setRepeating on Android, or creates an NSBackgroundActivityScheduler
    with repeats=true on iOS. Periodic Android work has a 15-minute minimum interval, so any registered
    cadence is bounded and directly comparable to later observed callbacks. Registration by a non-allowlisted
    app is the earliest on-device indicator that persistence is being established.
  answer_sources:
  - OS API Execution
  - Scheduled Job Creation
  - 'NAI: MDM/MobileEDR runtime telemetry, App vetting pipelines, Managed app configuration.'
  range: Last 90 days
  queries:
  - technology: MobileEDR/pseudocode
    query: ">-\n  for evt in osapi_telemetry where api in {WorkManager.enqueue, PeriodicWorkRequest,\n\
      \      JobScheduler.schedule, AlarmManager.setRepeating, NSBackgroundActivityScheduler(repeats=true)}:\n\
      \    if evt.app not in SCHEDULING_ALLOWLIST or evt.app.source == sideloaded:\n      alert(app=evt.app,\
      \ api=evt.api, interval=evt.interval)"
- question: When a scheduled job wakes, is it immediately followed by file writes, sensor access, or outbound
    network sessions that are inconsistent with the app's declared role and absent of recent user interaction?
  context: Persistence is confirmed when scheduled background work produces effects the app should not
    perform. When a scheduled job triggers, correlate the wake event with file writes (cache/staged payload),
    sensor access, or outbound network sessions occurring within a short window (e.g., <= 10 seconds)
    and outside any recent foreground user interaction. Raise confidence when the post-trigger behavior
    is inconsistent with the app's declared role (e.g., a flashlight app accessing the microphone or beaconing).
    The deterministic wake-to-effect window makes this correlation reliable; effects fully explained by
    the app's stated function lower suspicion.
  answer_sources:
  - OS API Execution
  - Scheduled Job Creation
  - 'NAI: MDM/MobileEDR runtime telemetry, App vetting pipelines, Managed app configuration.'
  range: Last 90 days
  queries:
  - technology: MobileEDR/pseudocode
    query: ">-\n  for wake in scheduled_job_wakes:\n    effects = telemetry(app=wake.app, t in [wake.t,\
      \ wake.t+10s])\n    if (effects.file_write or effects.sensor_access or effects.net_session)\n  \
      \     and not recent_foreground(wake.app, window=60s)\n       and inconsistent_with_declared_role(wake.app,\
      \ effects):\n      alert(wake.app, effects, confidence=high)"
- question: Do static app-vetting features (permissions, scheduling/component declarations, API calls,
    hardcoded URLs/IPs) produce a high DREBIN-style risk score for apps that register scheduled work?
  context: Before or during deployment, apps that register scheduled background work can be risk-scored
    from static features. Apply a DREBIN-style linear model over manifest/dexcode features (requested
    permissions, scheduling/component declarations, API calls, hardcoded URLs/IPs) at vetting time or
    on-device. The linear model surfaces the top contributing features (e.g., periodic-work registration
    + SEND_SMS + hardcoded C2 URL) directly in the alert, satisfying explainability and giving analysts
    an interpretable rationale. A high score driven by scheduling plus sensitive permissions plus hardcoded
    network indicators flags an app likely abusing T1603 for persistence.
  answer_sources:
  - OS API Execution
  - Scheduled Job Creation
  - 'NAI: MDM/MobileEDR runtime telemetry, App vetting pipelines, Managed app configuration.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  feats = static_extract(manifest_permissions, scheduling_declarations, api_calls, hardcoded_urls_ips)\n\
      \  model = DREBIN_linear(trained)\n  score, top_feats = model.score(feats, explain=top3)\n  if score\
      \ > risk_threshold: alert(app, score, top_feats)"
- question: Do any downloaded files on mobile devices match known-malicious hashes, or do their HTTP host/URI/User-Agent
    or x509 certificate issuers match threat-intel indicators?
  context: A scheduled task executing malicious code often first downloads the payload. In files.log,
    compute MD5/SHA1 for every downloaded file and compare against malware hash databases; in http.log,
    check host, uri, and user_agent against threat-intel feeds; in x509.log, check the certificate issuer
    against a list of non-standard CAs. Alert on any match surfaced in intel.log. A hash or indicator
    match is direct evidence of a malicious download tied to scheduled execution; the absence of matches
    does not clear novel payloads, motivating the statistical and ML analytics that follow.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek conn.log
  - Zeek intel.log
  - Zeek x509.log
  - 'NAI: Network egress points, Corporate Wi-Fi access points, Web Proxies.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  for f in files.log where src in MOBILE_RANGES:\n    if md5(f) in MALWARE_HASHES or sha1(f)\
      \ in MALWARE_HASHES: alert(f)\n  for h in http.log where src in MOBILE_RANGES:\n    if h.host in\
      \ TI or h.uri in TI or h.user_agent in TI: alert(h)\n  for x in x509.log:\n    if x.issuer in NONSTANDARD_CAS:\
      \ alert(x)"
- question: Are mobile devices downloading mobile-executable MIME types (e.g., application/vnd.android.package-archive)
    on a statistically significant periodic schedule from low-reputation sources?
  context: Recurring scheduled execution shows up as periodic payload downloads. Filter files.log for
    mobile-specific MIME types (e.g., application/vnd.android.package-archive, application/octet-stream)
    and, for each source device, apply autocorrelation/FFT to the download-event time series; a significant
    spike at a non-zero lag indicates periodicity (e.g., a 24-hour cadence). Suppress benign app-update
    cadences using characterized baselines, and separately flag User-Agent strings from http.log with
    low enterprise prevalence (<1%). Periodic executable downloads from newly registered or non-Tranco-Top-1M
    domains are a strong scheduled-execution indicator.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek conn.log
  - Zeek intel.log
  - Zeek x509.log
  - 'NAI: Network egress points, Corporate Wi-Fi access points, Web Proxies.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  dl = files.log where mime in MOBILE_EXEC_MIME\n  for device in dl.src:\n    ts = series(download_times);\
      \ period = autocorr_FFT(ts)\n    if significant(period) and source_domain not in BENIGN_UPDATE_ALLOWLIST:\n\
      \      alert(device, period, domain)\n  for ua in http.log.user_agent: if prevalence(ua) < 1%: flag(ua)"
- question: Does a gradient-boosting classifier score any scheduled mobile download as high-risk based
    on domain reputation, filename entropy, User-Agent prevalence, MIME, intel hits, and certificate validity?
  context: Multiple weak signals combine into a high-confidence scheduled-download verdict. Train a gradient-boosting
    classifier (e.g., XGBoost) using domain age/reputation (http.log), filename entropy (files.log), User-Agent
    prevalence, MIME type, seen.indicator (intel.log), and certificate validity period (x509.log), optionally
    adding temporal sequence features. Surface the top-3 contributing features in each alert for explainability.
    A high score correlated with periodic behavior is a high-confidence alert that a scheduled task is
    fetching malicious payloads for execution; low scores with benign features de-prioritize the event.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek conn.log
  - Zeek intel.log
  - Zeek x509.log
  - 'NAI: Network egress points, Corporate Wi-Fi access points, Web Proxies.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = [domain_age, domain_reputation, filename_entropy, ua_prevalence, mime_type,\n  \
      \     intel_seen_indicator, cert_validity_period, temporal_features]\n  model = XGBoost(trained)\n\
      \  score, top_feats = model.predict(X, explain=top3)\n  if score > threshold and periodic_download(device):\
      \ alert(device, score, top_feats)"
- question: Has a per-app/per-domain baseline of legitimate periodic executable/update downloads (store
    CDNs, MDM app delivery) been established and allowlisted to suppress false positives?
  context: Managed fleets routinely fetch updates from store CDNs and MDM app-delivery infrastructure
    on a schedule that resembles malicious periodicity. Establish per-app/per-domain baselines of legitimate
    periodic executable/update downloads using characterized period and volume distributions and allowlist
    them, so periodicity is scored only against unknown or low-reputation download sources. This tuning
    step keeps false positives low on managed mobile fleets and sharpens the periodic-download and ML
    analytics. The deliverable is a curated allowlist applied as a pre-filter, not a standalone detection.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek conn.log
  - Zeek intel.log
  - Zeek x509.log
  - 'NAI: Network egress points, Corporate Wi-Fi access points, Web Proxies.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for (app, domain) with periodic downloads:\n    if matches_known_update_cadence(period_dist,\
      \ volume_dist) and domain in {STORE_CDN, MDM_DELIVERY}:\n      add(app, domain) to BENIGN_UPDATE_ALLOWLIST\n\
      \  // score periodicity only where source not in BENIGN_UPDATE_ALLOWLIST"
- question: Are mobile devices querying domains that appear on C2/DGA threat-intel feeds or Newly Registered
    Domain lists, or resolving names via non-corporate DNS servers?
  context: Scheduled callbacks frequently rely on algorithmically generated or newly registered domains.
    Continuously check all domains in dns.log from mobile subnets against threat-intel feeds (C2, DGA)
    and Newly Registered Domain (NRD) lists, and create a rule to detect when a mobile device's DNS query
    is resolved by a non-corporate DNS server. Alert on any match. A query to a known DGA/C2 or NRD domain,
    or use of an unauthorized resolver, is a high-fidelity indicator of a scheduled callback channel;
    clean results push the analyst toward the lexical and ML analytics for novel domains.
  answer_sources:
  - Zeek dns.log
  - Zeek intel.log
  - Zeek conn.log
  - 'NAI: Internal DNS resolvers, Network egress points, DNS firewalls.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  for d in dns.log where src in MOBILE_RANGES:\n    if d.query in TI_C2_DGA or d.query\
      \ in NRD_LIST: alert(d)\n    if d.resolver not in CORPORATE_DNS: alert(non_corporate_resolver, d)"
- question: Do non-allowlisted queried domains exhibit high lexical anomaly (entropy, length, n-gram score)
    combined with low inter-query-time standard deviation indicating periodic polling?
  context: DGA-based scheduled callbacks combine algorithmic domain names with regular polling. For each
    non-allowlisted queried domain, compute lexical features (Shannon entropy, length, label count, n-gram
    score vs. a Tranco Top-1M baseline). For domains in the 99th percentile of a composite anomaly score,
    group by source device and domain and compute the standard deviation of inter-query arrival times;
    a low standard deviation (<10s) indicates periodic polling. Apply change-point detection to flag the
    onset of a new polling cadence, and track NXDOMAIN rates as a distinct DGA failure-mode signal. High
    lexical anomaly plus regular polling is the scheduled-callback DNS signature.
  answer_sources:
  - Zeek dns.log
  - Zeek intel.log
  - Zeek conn.log
  - 'NAI: Internal DNS resolvers, Network egress points, DNS firewalls.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for q in dns.log.query where q not in ALLOWLIST:\n    score = composite(entropy(q),\
      \ length(q), label_count(q), ngram_vs_tranco(q))\n    if score > p99:\n      for (device, q): std_iqt\
