- question: Which apps exhibit highly regular scheduled-job execution cadence (low jitter, strong periodicity)
    whose triggered network/file effects deviate from peer apps of the same role?
  context: Malicious scheduled execution is both regular and behaviorally anomalous relative to peers.
    Build a time series of scheduled-job execution timestamps per app and compute inter-execution jitter
    and FFT/autocorrelation periodicity. Flag apps whose execution cadence is highly regular and whose
    triggered effects (network/file) deviate from peer apps of the same role, while suppressing benign
    periodic maintenance with characterized baselines. An app combining a tight, deterministic execution
    schedule with effects unlike its functional peers is a strong scheduled-execution candidate; regular-but-benign
    maintenance cadences are filtered out.
