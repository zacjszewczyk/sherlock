name: 'T1603: Scheduled Task-Job'
id: 7bf78093-5173-4197-975f-f0c86cd7d02c
description: 'Investigate adversary abuse of mobile task-scheduling functionality (MITRE ATT&CK T1603,
  Scheduled Task/Job) on Android and iOS, where APIs such as Android WorkManager, JobScheduler, and AlarmManager,
  or iOS NSBackgroundActivityScheduler, are used to schedule deferred, periodic, or constraint-based background
  work for initial or recurring execution of malicious code. This playbook spans two tactical questions:
  whether an adversary is using scheduled tasks for persistence, and whether an adversary is using a scheduled
  task to execute malicious code on mobile devices. It guides the analyst through both on-device control-plane
  evidence (scheduling-API registration by untrusted/sideloaded apps, wake-to-effect correlation, and
  static app risk scoring via MDM/MobileEDR runtime telemetry and app-vetting pipelines) and off-device
  network evidence (low-jitter periodic C2 beaconing, peer-group port and DNS outliers, DNS tunneling
  and DGA polling, and periodic downloads of mobile executables from low-reputation sources). Techniques
  include symbolic-logic matching against threat intelligence and allowlists, statistical methods (jitter/Gini
  uniformity, FFT/autocorrelation periodicity, change-point detection, peer-group baselining), and machine-learning
  classifiers (LSTM/transformer/CT-HMM sequence models, Isolation Forest, gradient boosting, and DREBIN-style
  static scoring) with explainable top-feature reporting.'
type: technique
related:
