name: 'T1636.003: Contact List'
id: 62000ba6-30ee-48df-8edc-8e5e036bdebc
description: This playbook helps an analyst investigate MITRE ATT&CK T1636.003 (Contact List) on managed
  Android and iOS devices, where an adversary abuses standard operating-system APIs (the Android Contacts
  Content Provider / ContactsContract or the iOS Contacts framework) to harvest contact list data, optionally
  without user consent on jailbroken or rooted devices. It supports the Collection mission question by
  chaining capability acquisition (an app holding READ_CONTACTS / NSContactsUsageDescription, especially
  from a rare app-store category or a sideloaded source) to behavioral signals (anomalous bursts of contact-access
  API calls, contact SOURCE-to-network SINK data flows, and near-term egress to suspicious, new, or threat-intel-listed
  destinations) and device-integrity signals (MDM compromise/integrity-check failures correlated with
  sideloaded contact-requesting apps). The questions combine deterministic checks (threat-intel/identifier
  joins, static taint analysis, sideload + compromised-status correlation, contact-access-to-C2 correlation),
  statistical baselining (category-rare permission prevalence, modified Z-score / MAD on API-call bursts
  and DNS/connection failures, weighted permission risk scoring), and machine-learning detectors (Random
  Forest app-metadata classification, LSTM-autoencoder multimodal anomaly detection, DBSCAN/Isolation
  Forest device-configuration outliers) across MDM/MTD application-inventory, permission, compliance,
  and OS-API telemetry plus Zeek conn.log/dns.log network logs.
type: technique
related:
- tactic_id: TA0035
  tactic_name: Collection
