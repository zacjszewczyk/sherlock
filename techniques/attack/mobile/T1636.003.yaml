questions:
- question: '[Collection] Match contact apps to malicious identifiers: Have you joined the MDM application
    inventory against threat-intelligence feeds of known-malicious app identifiers (package names and
    SHA256 hashes) and alerted on any installed app that both holds READ_CONTACTS/Contacts permission
    and matches a malicious-identifier feed?'
  context: 'Tactic relevance (Collection): Has an adversary successfully collected contact list data from
    corporate mobile devices? (PIR) This question operationalizes a Symbolic Logic detection for MITRE
    ATT&CK T1636.003 (Contact List) on Android/iOS. This operationalizes a deterministic Symbolic Logic
    detection. Continuously join the MDM/MTD application inventory with threat-intel feeds of malicious
    mobile-app identifiers (package names, SHA256) and raise an alert whenever an installed app simultaneously
    has contact-list read permission and matches the feed. Anchor the suspicious-API/permission watchlist
    on the [DREBIN](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf) feature taxonomy
    and the dangerous-API findings from [A Study of Android Application Security](https://www.enck.org/pubs/enck-sec11.pdf)
    so the watchlist reflects empirically risky contact-access behavior. A positive result indicates a
    known-bad contact-harvesting app is installed on a managed device and likely already collecting contact
    data; a negative result lowers but does not eliminate suspicion, so corroborate with the behavioral,
    flow, and device-integrity questions in this playbook.'
  answer_sources: &id001
  - MDM Application Inventory Log
  - MTD Permission Audit Log
  - Application Vetting Service Results
  - 'NAI: Corporate-managed mobile devices (iOS and Android), MDM/MTD log aggregation platform, Application
    Vetting Service Portal'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=mdm source="MDM Application Inventory Log"

      | where permission IN ("android.permission.READ_CONTACTS","NSContactsUsageDescription")

      | lookup ThreatIntel.MaliciousApps package_name sha256 OUTPUT ti_match

      | where isnotnull(ti_match)

      | eval severity="critical"

      | table device_id, package_name, sha256, install_source, ti_match'
- question: '[Collection] Prove contact source flows to a network sink: Have you run static taint analysis
    in the app-vetting pipeline to prove that a contact-list SOURCE (ContactsContract / iOS Address Book)
    reaches a network or SMS SINK, and deterministically flagged every app where that reachability holds?'
  context: 'Tactic relevance (Collection): Has an adversary successfully collected contact list data from
    corporate mobile devices? (PIR) This question operationalizes a Symbolic Logic detection for MITRE
    ATT&CK T1636.003 (Contact List) on Android/iOS. This operationalizes a Symbolic Logic detection inside
    the application-vetting pipeline. Use static taint analysis to prove a contact data SOURCE deterministically
    reaches a network/SMS SINK; flag any app where reachability holds. Use [FlowDroid](https://www.bodden.de/pubs/far+14flowdroid.pdf)
    for Android (ContactsContract -> network, validated on the open DroidBench benchmark) and [PiOS](https://sites.cs.ucsb.edu/~chris/research/doc/ndss11_pios.pdf)
    for iOS (Address Book/Contacts -> network on Objective-C binaries), with the categorized contact-access
    source list (CONTACT_INFORMATION) and sink list supplied by [SUSI](https://www.bodden.de/pubs/rab14classifying.pdf).
    A positive result proves the app is technically capable of exfiltrating contact data and warrants
    blocking/removal; a negative result means no contact-to-sink flow was provable, which reduces (but
    does not eliminate, given obfuscation/reflection limits of static analysis) suspicion. Tie this to
    Collection: proving a contact SOURCE reaches a sink is direct evidence of intent to gather and move
    contact data off the device.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for app in vetting_queue:\n    sources = SUSI.CONTACT_INFORMATION_sources(app)   # ContactsContract\
      \ / AddressBook\n    sinks   = SUSI.network_and_sms_sinks(app)\n    if app.platform == 'android':\n\
      \        reach = FlowDroid.taint_reaches(app, sources, sinks)\n    else:\n        reach = PiOS.taint_reaches(app,\
      \ sources, sinks)\n    if reach:\n        flag(app, severity='high', evidence=reach.path)"
- question: '[Collection] Flag rare contact permissions by category: Have you computed, per app-store
    category, the percentage of installed apps that hold contact-read permission and generated a review
    list for apps holding the permission in categories where its prevalence is statistically rare (below
    ~2%)?'
  context: 'Tactic relevance (Collection): Has an adversary successfully collected contact list data from
    corporate mobile devices? (PIR) This question operationalizes a Statistical Method detection for MITRE
    ATT&CK T1636.003 (Contact List) on Android/iOS. This operationalizes a Statistical Method detection.
    Daily, group installed apps by store category and calculate the percentage of apps in each category
    that hold READ_CONTACTS/Contacts permission; generate a review list for apps holding the permission
    in categories where prevalence is below ~2%. Derive category-specific baselines empirically from your
    own fleet (most categories sit far below 2%, consistent with cross-category permission-prevalence
    findings in [A Study of Android Application Security](https://www.enck.org/pubs/enck-sec11.pdf)) and
    recompute thresholds per fleet rather than hard-coding. A positive result surfaces an app requesting
    contact access that is anomalous for its functional category (e.g., a wallpaper or flashlight app),
    a classic over-permissioning red flag for contact collection; a negative result means the app''s permission
    is typical for its category. This directly supports Collection by spotlighting apps whose contact
    access cannot be explained by their stated function.'
  answer_sources: *id001
  range: Last 90 days (use >=30 days of history to establish per-device/fleet baselines)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=mdm source="MTD Permission Audit Log"

      | eval has_contacts=if(permission IN ("android.permission.READ_CONTACTS","NSContactsUsageDescription"),1,0)

      | stats sum(has_contacts) as with_perm, count as total by store_category

      | eval prevalence=with_perm/total

      | where prevalence < 0.02

      | join store_category [ search index=mdm has_contacts=1 | table device_id, package_name, store_category
      ]

      | table store_category, prevalence, package_name, device_id'
- question: '[Collection] Classify risky contact apps: Have you used a Random Forest classifier on MDM/MTD
    app metadata to score apps with contact access and opened a case for high-confidence (>0.90) malicious
    predictions, surfacing the top-3 contributing features in each alert?'
  context: 'Tactic relevance (Collection): Has an adversary successfully collected contact list data from
    corporate mobile devices? (PIR) This question operationalizes a Machine Learning detection for MITRE
    ATT&CK T1636.003 (Contact List) on Android/iOS. This operationalizes an explainable Machine Learning
    detection. Train a Random Forest on MDM/MTD app metadata (requested permissions, developer reputation,
    app-store rating, install count, category, app age) and run it against apps with contact access; open
    a case for predictions with confidence above 0.90. Following the explainable static-feature approach
    of [DREBIN](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf) (linear model with
    per-decision feature attribution), the alert MUST surface the top-3 contributing features (e.g., ''category=Wallpaper'',
    ''developer_reputation=low'', ''requested READ_CONTACTS+INTERNET'') rather than only a score, so an
    analyst can triage quickly. A positive (high-confidence) result identifies an app whose metadata profile
    resembles known contact-harvesting malware; a negative result lowers suspicion but should be corroborated
    with taint-analysis and behavioral questions. This supports Collection by prioritizing the riskiest
    contact-capable apps for investigation.'
  answer_sources: *id001
  range: Last 90 days (use >=30 days of history to establish per-device/fleet baselines)
  queries:
  - technology: ML/pseudocode
    query: "features = [requested_perms, developer_reputation, store_rating,\n            install_count,\
      \ category, app_age]\nfor app in apps_with_contact_access:\n    p = RandomForest.predict_proba(features(app))[malicious]\n\
      \    if p > 0.90:\n        open_case(app, severity='high',\n            top3=feature_attribution(features(app))[:3])"
- question: '[Collection] Correlate contact access with C2 connections: Have you correlated MTD contact-access
    API events (e.g., Contacts.lookup) with a Zeek conn.log connection from the same device to a known
    mobile-malware C2 destination within 5 minutes, and alerted directly on contact-tagged data reaching
    a network sink where on-device taint instrumentation exists?'
  context: 'Tactic relevance (Collection): Has an adversary successfully collected contact list data from
    corporate mobile devices? (PIR) This question operationalizes a Symbolic Logic detection for MITRE
    ATT&CK T1636.003 (Contact List) on Android/iOS. This operationalizes a Symbolic Logic correlation
    detection. Trigger when an MTD contact-access event (for example, Contacts.lookup) is followed within
    5 minutes by a Zeek conn.log connection from the same device to a destination on a mobile-malware
    C2 threat feed. Where on-device taint instrumentation is available, alert directly when contact-tagged
    data reaches a network sink, per the runtime source-to-sink tracking demonstrated in [TaintDroid](http://appanalysis.org/tdroid10.pdf).
    A positive result is strong evidence of active contact exfiltration to attacker infrastructure; a
    negative result reduces suspicion but, because not all C2 is on a feed and not all egress is captured,
    should be corroborated with the statistical and ML anomaly questions. This is core to Collection-then-exfil:
    it links the act of gathering contacts to moving them off-device toward adversary control.'
  answer_sources: &id002
  - MTD OS API Call Log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Corporate-managed mobile devices, Mobile VPN concentrators, Network egress points for mobile
    device traffic, DNS resolvers serving mobile clients'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "index=mtd source=\"MTD OS API Call Log\" api IN (\"Contacts.lookup\",\"ContactsContract.*\"\
      )\n| eval contact_time=_time\n| join device_id [ search index=zeek sourcetype=conn\n    | lookup\
      \ ThreatIntel.MobileC2 dest_ip dest_host OUTPUT c2\n    | where isnotnull(c2) ]\n| where (conn_time\
      \ - contact_time) >= 0 AND (conn_time - contact_time) <= 300\n| eval severity=\"critical\"\n| table\
      \ device_id, api, contact_time, dest_ip, conn_time, c2"
- question: '[Collection] Baseline contact API access and DNS risk: Have you baselined each device/app
    pair''s hourly contact-API call counts over 30 days and alerted when current hourly counts exceed
    a robust modified Z-score threshold (|score|>3.5), enriched with Zeek dns.log to flag same-hour high-entropy
    (>3.5) or first-seen (90-day) domains?'
  context: 'Tactic relevance (Collection): Has an adversary successfully collected contact list data from
    corporate mobile devices? (PIR) This question operationalizes a Statistical Method detection for MITRE
    ATT&CK T1636.003 (Contact List) on Android/iOS. This operationalizes a Statistical Method detection.
    For each device-and-app pair, maintain a 30-day baseline of hourly contact-API call counts and alert
    when current hourly counts exceed the 99th percentile using the robust median/MAD [modified Z-score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)
    (|score|>3.5) so periodic batch syncs do not inflate the threshold. Enrich with Zeek dns.log to flag
    queries in the same hour with Shannon entropy >3.5 or domains first-seen in the last 90 days, scored
    with [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf) passive-DNS features.
    Note: [Soundcomber](https://homes.luddy.indiana.edu/kapadia/papers/soundcomber-ndss11.pdf) shows low-and-slow,
    context-triggered exfil evades pure volume signatures, so retain frequency (reads/min) and volume
    (bytes_out/bytes_in ratio) features alongside raw counts. A positive result indicates an abnormal
    contact-access burst coinciding with suspicious DNS, consistent with harvesting-then-exfil; a negative
    result lowers suspicion. This supports Collection by detecting unusually intense contact gathering
    and its network correlates.'
  answer_sources: *id002
  range: Last 90 days (use >=30 days of history to establish per-device/fleet baselines)
  queries:
  - technology: Zeek/Stats pseudocode
    query: "index=mtd source=\"MTD OS API Call Log\" api=\"Contacts.*\"\n| bin _time span=1h\n| stats\
      \ count as hourly by device_id, package_name, _time\n| eventstats median(hourly) as med, median(abs(hourly-med))\
      \ as mad by device_id, package_name\n| eval mz=0.6745*(hourly-med)/mad\n| where mz > 3.5\n| join\
      \ device_id _time [ search index=zeek sourcetype=dns\n    | eval ent=shannon(query) | eval firstseen=if(seen_days<90?\
      \ wait :0)\n    | where ent > 3.5 OR first_seen_90d=1 ]\n| table device_id, package_name, _time,\
      \ hourly, mz, query, ent"
- question: '[Collection] Profile failed egress after contact access: Have you counted, per device, DNS
    NXDOMAIN responses and blocked/rejected connections (conn_state S0/REJ) in the hour following a contact-API
    access burst and alerted on a spike above the device''s 30-day MAD-based threshold?'
  context: 'Tactic relevance (Collection): Has an adversary successfully collected contact list data from
    corporate mobile devices? (PIR) This question operationalizes a Statistical Method detection for MITRE
    ATT&CK T1636.003 (Contact List) on Android/iOS. This operationalizes a Statistical Method detection
    that treats failure outcomes as a distinct signal. Per device, count DNS NXDOMAIN responses (Zeek
    dns.log) and blocked/rejected connections (Zeek conn.log conn_state S0/REJ) in the hour following
    a contact-API access burst, and alert on a spike above the device''s 30-day MAD-based threshold. Resolution
    failures and connection rejections characterize C2 resolution failures and beacon retries even before
    any successful exfil, so this catches early-stage or failing exfiltration that volume-based egress
    detection misses. A positive result indicates a device attempting (and failing) to reach external
    infrastructure right after gathering contacts, a strong pre-exfil indicator; a negative result reduces
    but does not eliminate suspicion. This supports Collection-then-exfil by exposing failed callback
    attempts following contact harvesting.'
  answer_sources: *id002
  range: Last 90 days (use >=30 days of history to establish per-device/fleet baselines)
  queries:
  - technology: Zeek/Stats pseudocode
    query: "index=mtd source=\"MTD OS API Call Log\" api=\"Contacts.*\" | bin _time span=1h\n| stats count\
      \ as reads by device_id, _time | where reads>0\n| join device_id _time [ search index=zeek (sourcetype=dns\
      \ OR sourcetype=conn)\n    | eval fail=case(rcode=\"NXDOMAIN\",1, conn_state IN (\"S0\",\"REJ\"\
      ),1, true(),0)\n    | bin _time span=1h | stats sum(fail) as fails by device_id, _time ]\n| eventstats\
      \ median(fails) as med, median(abs(fails-med)) as mad by device_id\n| eval mz=0.6745*(fails-med)/mad\
      \ | where mz > 3.5\n| table device_id, _time, reads, fails, mz"
- question: '[Collection] Detect multimodal event anomalies: Have you trained an LSTM autoencoder on per-device
    multimodal event sequences (api_call_count, network_connection_count, bytes_out, bytes_in, nxdomain_count)
    and alerted when reconstruction error exceeds a dynamic threshold for sequences containing contact-access
    events, listing the top-3 driving features?'
  context: 'Tactic relevance (Collection): Has an adversary successfully collected contact list data from
    corporate mobile devices? (PIR) This question operationalizes a Machine Learning detection for MITRE
    ATT&CK T1636.003 (Contact List) on Android/iOS. This operationalizes a Machine Learning detection.
    Train an LSTM autoencoder on sequences of per-device event vectors (api_call_count, network_connection_count,
    bytes_out, bytes_in, nxdomain_count) and alert when reconstruction error exceeds a dynamic threshold
    for sequences that contain contact-access events. Complement it with obfuscation-resistant API call-sequence
    modeling per [MaMaDroid](https://arxiv.org/pdf/1612.04433) (package/family Markov transitions) to
    catch contact-read-then-network behavior even under obfuscation. Each alert MUST list the top-3 features
    driving reconstruction error (e.g., bytes_out, nxdomain_count, api_call_count) and should use [TaintDroid](http://appanalysis.org/tdroid10.pdf)
    labels for ground truth. A positive result indicates a multimodal behavioral anomaly around contact
    access consistent with harvesting and exfil; a negative result lowers suspicion. This supports Collection
    by detecting the joint pattern of contact reads plus anomalous network behavior that single-signal
    detectors miss.'
  answer_sources: *id002
  range: Last 90 days (use >=30 days of history to establish per-device/fleet baselines)
  queries:
  - technology: ML/pseudocode
    query: "X = per_device_event_sequences(api_call_count, network_connection_count,\n        bytes_out,\
      \ bytes_in, nxdomain_count)   # >=30d history\nfor seq in X where seq.contains(contact_access_event):\n\
      \    err = LSTM_autoencoder.reconstruction_error(seq)\n    if err > dynamic_threshold(device):\n\
      \        raise_alert(top3=feature_contributions(seq)[:3])\n# complement: MaMaDroid Markov transition\
      \ check read->network"
- question: '[Collection] Correlate compromised status with sideloaded contact apps: Have you generated
    a critical alert when a device shows a compromised/integrity-check-failed status in MDM logs AND has
    an app installed from an unofficial (sideloaded) source whose manifest includes contact-read permission,
    within a 1-hour correlation window?'
  context: 'Tactic relevance (Collection): Has an adversary successfully collected contact list data from
    corporate mobile devices? (PIR) This question operationalizes a Symbolic Logic detection for MITRE
    ATT&CK T1636.003 (Contact List) on Android/iOS. This operationalizes a Symbolic Logic correlation
    detection. Generate a critical alert when, within a 1-hour window, a device reports ''compromised''
    or ''integrity_check failed'' in MDM logs, has an app with an unofficial install source, and that
    app''s manifest includes READ_CONTACTS. Sideloaded contact-requesting apps are a documented high-risk
    class per [DREBIN](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf) and [A Study
    of Android Application Security](https://www.enck.org/pubs/enck-sec11.pdf). A positive result indicates
    a rooted/jailbroken or otherwise compromised device running a sideloaded contact-capable app, which
    (per the technique) can access the contact list without user approval; a negative result reduces but
    does not eliminate suspicion. This supports Collection by tying device-integrity compromise to the
    presence of an app positioned to silently harvest contacts.'
  answer_sources: &id003
  - MDM Device Compliance Log
  - MDM Application Inventory Log
  - 'NAI: Corporate-managed mobile devices (iOS and Android), MDM administration console, Device compliance
    reporting dashboards'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=mdm source=\"MDM Device Compliance Log\" status IN (\"compromised\",\"integrity_check_failed\"\
      )\n| eval compromise_time=_time\n| join device_id [ search index=mdm source=\"MDM Application Inventory\
      \ Log\"\n    install_source IN (\"sideload\",\"unknown\",\"unofficial\")\n    | where \"android.permission.READ_CONTACTS\"\
      \ in manifest_permissions ]\n| where abs(install_time - compromise_time) <= 3600\n| eval severity=\"\
      critical\"\n| table device_id, status, compromise_time, package_name, install_source"
- question: '[Collection] Rank devices by sideloaded permission risk: Have you weekly scored devices holding
    sideloaded apps by a weighted sensitive-permission risk score (e.g., Contacts=10, Microphone=10, SMS=8,
    Location=7) and created tickets for the top 5% or any device whose score exceeds a robust modified-Z-score
    outlier cutoff?'
  context: 'Tactic relevance (Collection): Has an adversary successfully collected contact list data from
    corporate mobile devices? (PIR) This question operationalizes a Statistical Method detection for MITRE
    ATT&CK T1636.003 (Contact List) on Android/iOS. This operationalizes a Statistical Method detection.
    Weekly, list devices with sideloaded apps and calculate a weighted risk score over their sensitive
    permissions (for example, Contacts=10, Microphone=10, SMS=8, Location=7). Create tickets for the top
    5% of devices or any device scoring above 20, and apply a robust [modified Z-score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)
    over the fleet score distribution to set the outlier cutoff rather than relying on a fixed value.
    A positive result surfaces devices accumulating high-risk sideloaded permissions (with contact access
    weighted heavily), the population most likely to be harvesting contacts; a negative result lowers
    priority. This supports Collection by prioritizing the devices whose sideloaded-app permission posture
    most strongly enables contact gathering.'
  answer_sources: *id003
  range: Last 90 days (use >=30 days of history to establish per-device/fleet baselines)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=mdm source="MDM Application Inventory Log" install_source IN ("sideload","unknown")

      | eval w=case(perm="READ_CONTACTS",10, perm="RECORD_AUDIO",10, perm="READ_SMS",8, perm="ACCESS_FINE_LOCATION",7,
      true(),1)

      | stats sum(w) as risk_score by device_id

      | eventstats median(risk_score) as med, median(abs(risk_score-med)) as mad

      | eval mz=0.6745*(risk_score-med)/mad

      | where mz > 3.5 OR risk_score > 20

      | sort - risk_score | table device_id, risk_score, mz'
- question: '[Collection] Cluster outlier device configurations: Have you applied DBSCAN (and a parallel
    Isolation Forest) to MDM device features (os_patch_level, failed_integrity_checks_last_30d, sideloaded_app_count,
    high_risk_permission_count) to find outlier devices that deviate from secure baselines, surfacing
    the top-3 contributing features per alert?'
  context: 'Tactic relevance (Collection): Has an adversary successfully collected contact list data from
    corporate mobile devices? (PIR) This question operationalizes a Machine Learning detection for MITRE
    ATT&CK T1636.003 (Contact List) on Android/iOS. This operationalizes a Machine Learning detection.
    Apply DBSCAN to MDM features such as os_patch_level, failed_integrity_checks_last_30d, sideloaded_app_count,
    and high_risk_permission_count, and investigate outlier devices that deviate from secure baselines.
    Run an [Isolation Forest](https://doi.org/10.1145/2133360.2133363) in parallel on the same feature
    vector for explainable per-feature anomaly attribution, surfacing the top-3 contributing features
    (e.g., ''failed_integrity_checks_last_30d'', ''sideloaded_app_count'', ''os_patch_level'') in each
    alert. A positive (outlier) result identifies devices whose configuration profile diverges from the
    secure fleet baseline in ways that correlate with compromise and over-permissioning, the conditions
    under which silent contact harvesting occurs; a negative result reduces suspicion. This supports Collection
    by flagging the device population whose posture most enables unauthorized contact-list access.'
  answer_sources: *id003
  range: Last 90 days (use >=30 days of history to establish per-device/fleet baselines)
  queries:
  - technology: ML/pseudocode
    query: "F = device_features(os_patch_level, failed_integrity_checks_last_30d,\n        sideloaded_app_count,\
      \ high_risk_permission_count)\nlabels = DBSCAN(eps, min_samples).fit_predict(F)\nscores = IsolationForest().fit(F).score_samples(F)\n\
      for d in devices where labels[d]==-1 or scores[d] in bottom_1pct:\n    raise_alert(d, top3=feature_attribution(F[d])[:3])"
