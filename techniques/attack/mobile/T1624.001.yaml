name: 'T1624.001: Broadcast Receivers'
id: 6611a94a-3fd7-4d93-856d-ee53ae56167b
description: 'Investigate adversary persistence on Android mobile devices established through abuse of
  broadcast receivers. Malicious apps subscribe to system or app-generated broadcast intents (e.g., BOOT_COMPLETED,
  SMS_RECEIVED, USER_PRESENT, CONNECTIVITY_CHANGE, NEW_OUTGOING_CALL) so that code executes automatically
  when those events fire, surviving reboots and bypassing normal user-driven app lifecycle. This playbook
  helps an analyst hunt across three vantage points: (1) static analysis of AndroidManifest.xml for high-risk
  or ''toxic'' receiver and permission combinations, (2) runtime telemetry of registerReceiver() calls
  and event-triggered background execution from mobile EDR/sandbox sources, and (3) statistical rarity
  and machine learning models over receiver/intent/permission features. Post-Android-8 restrictions on
  manifest-declared implicit broadcasts make persistent manifest receivers for restricted actions especially
  anomalous. The goal is to surface apps whose broadcast-receiver behavior indicates covert persistence
  and follow-on background processing or exfiltration.'
type: technique
related:
- tactic_id: TA0028
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Which non-allowlisted apps in the fleet declare a manifest <receiver> for a high-risk system
    broadcast action together with an enabling dangerous permission?
  context: 'Persistence (TA0028): Parse each app''s AndroidManifest.xml and alert when a non-allowlisted
    app declares a <receiver> for high-risk implicit broadcast actions (android.intent.action.BOOT_COMPLETED,
    android.provider.Telephony.SMS_RECEIVED, android.intent.action.USER_PRESENT, android.net.conn.CONNECTIVITY_CHANGE,
    android.intent.action.NEW_OUTGOING_CALL) alongside an enabling <uses-permission> such as RECEIVE_BOOT_COMPLETED+INTERNET
    or RECEIVE_SMS+SEND_SMS. These receiver+permission pairs grant an app the ability to wake on device
    boot or inbound SMS and then act in the background, the core persistence primitive. Manifest declarations
    that still target restricted implicit broadcasts post-Android-8 are anomalous because the OS no longer
    delivers most implicit broadcasts to manifest-declared receivers. A positive match for a non-allowlisted
    app warrants sandboxing; allowlisted OEM/launcher/communications apps are expected to legitimately
    use some of these.'
  answer_sources:
  - Parsed AndroidManifest.xml from APKs
  - UEM application inventory metadata
  - Threat intelligence indicators
  - 'NAI: Corporate Unified Endpoint Management (UEM) platform; Static Application Security Testing (SAST)
    pipeline; Internal corporate application repository; Third-party application vetting sandboxes'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'manifest_receivers

      | where app NOT IN (allowlist)

      | where receiver_action IN (''BOOT_COMPLETED'',''SMS_RECEIVED'',''USER_PRESENT'',''CONNECTIVITY_CHANGE'',''NEW_OUTGOING_CALL'')

      | join uses_permission on app

      | where permission IN (''RECEIVE_BOOT_COMPLETED'',''RECEIVE_SMS'',''SEND_SMS'',''INTERNET'')

      | alert app, receiver_action, permission'
- question: Which receiver actions are rare across the corporate app population, and which apps declare
    an unusually high number of distinct high-risk receivers?
  context: 'Persistence (TA0028): Compute per-receiver-action prevalence across the corporate app inventory
    and flag receiver actions falling below the 5th percentile of population frequency, especially when
    co-occurring with high-risk permissions. Derive the percentile cut from your own fleet so common OEM/launcher
    receivers are not flagged as anomalies. Additionally count the distinct high-risk receivers each app
    declares and alert when an app declares >=3. Rare receiver registration combined with multiple high-risk
    receivers suggests an app engineering broad event-driven persistence rather than serving a normal
    single-purpose function. Set realistic malware base rates and time-aware thresholds to control false
    positives under app-population drift.'
  answer_sources:
  - Parsed AndroidManifest.xml from APKs
  - UEM application inventory metadata
  - Threat intelligence indicators
  - 'NAI: Corporate Unified Endpoint Management (UEM) platform; Static Application Security Testing (SAST)
    pipeline; Internal corporate application repository; Third-party application vetting sandboxes'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'manifest_receivers

      | stats app_count=dcount(app) by receiver_action

      | eval prevalence = app_count / total_apps

      | where prevalence < percentile(prevalence, 5)

      | join high_risk_permission_apps

      ; -- and --

      manifest_receivers | where receiver_action in high_risk_set

      | stats distinct_receivers=dcount(receiver_action) by app

      | where distinct_receivers >= 3'
- question: For each high-risk receiver an app declares, is the enabling dangerous/runtime permission
    actually granted on managed devices, and is the app repeatedly re-prompting for it in the background?
  context: 'Persistence (TA0028): Join each high-risk <receiver> to whether its enabling runtime/dangerous
    permission is actually granted on managed devices. A declared SMS_RECEIVED receiver whose RECEIVE_SMS
    permission is granted is far higher-fidelity than a declared-but-ungranted one, because only the granted
    state lets the receiver actually fire and act. Conversely, repeated permission re-request prompts
    (a failure signal) from a background app are themselves suspicious and indicate an app pressing for
    capability it has not been given. Prioritize apps where a granted dangerous permission backs a high-risk
    receiver. A positive result is a high-confidence persistence capability; a denied/ungranted state
    lowers immediate risk but persistent re-prompting is its own indicator.'
  answer_sources:
  - Parsed AndroidManifest.xml from APKs
  - UEM application inventory metadata
  - Threat intelligence indicators
  - 'NAI: Corporate Unified Endpoint Management (UEM) platform; Static Application Security Testing (SAST)
    pipeline; Internal corporate application repository; Third-party application vetting sandboxes'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'manifest_receivers high_risk

      | join device_permission_state on (app, enabling_permission)

      | eval fidelity = case(granted==''true'',''HIGH'', else ''LOW'')

      | union permission_prompt_events

      | stats reprompt_count=count by app, permission where app_foreground==''false''

      | where fidelity==''HIGH'' OR reprompt_count > threshold'
- question: Which apps does a classifier trained on manifest receiver/intent/permission vectors flag as
    malicious with probability >0.8, and what top features drive each alert?
  context: 'Persistence (TA0028): Train a classifier on manifest receiver/intent/permission feature vectors
    and flag apps with malicious probability >0.8 for sandboxing. Prefer a linear/interpretable model
    (or SHAP over a Random Forest) so each alert surfaces the top-3 contributing features (e.g., BOOT_COMPLETED
    receiver + SEND_SMS + INTERNET) directly in the alert text, making the result triable by an analyst.
    This catches receiver+permission combinations indicative of persistence that rule lists miss. Guard
    against dataset bias when selecting architecture, and validate with temporally-consistent splits and
    the AUT metric so model performance reflects real-world drift rather than optimistic in-sample accuracy.'
  answer_sources:
  - Parsed AndroidManifest.xml from APKs
  - UEM application inventory metadata
  - Threat intelligence indicators
  - 'NAI: Corporate Unified Endpoint Management (UEM) platform; Static Application Security Testing (SAST)
    pipeline; Internal corporate application repository; Third-party application vetting sandboxes'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = vectorize(manifest.receivers + manifest.intents + manifest.permissions)\nscore\
      \ = model.predict_proba(features)\nif score > 0.8:\n    top3 = shap_top_features(model, features,\
      \ k=3)\n    emit_alert(app, score, top3) -> sandbox_queue"
- question: Which apps make runtime registerReceiver() calls with high-risk IntentFilter actions despite
    not belonging to the Communications or System Tools categories, particularly while running with no
    foreground activity?
  context: 'Persistence (TA0028): Trigger alerts when a runtime registerReceiver() call uses a high-risk
    IntentFilter action (NEW_OUTGOING_CALL, DEVICE_ADMIN_ENABLED, SMS_RECEIVED, BOOT_COMPLETED) and the
    app category is not Communications or System Tools, and especially when the receiver is registered
    while the app has no foreground activity. Event-triggered background registration (per detection strategy
    AN1837) is the runtime signature of broadcast-receiver persistence: the app subscribes to an event
    so it can execute outside the normal user-driven lifecycle. Dynamically registered receivers without
    permission protection are a known abuse class. Resolve which broadcasts can actually reach the receiver
    using ICC mapping to cut false positives from receivers that no real broadcast targets.'
  answer_sources:
  - Mobile EDR API call logs
  - Dynamic Analysis Sandbox API Traces (JSON)
  - Android Debug Bridge (adb) logcat output
  - 'NAI: Endpoint fleet of corporate-managed mobile devices; Mobile EDR/Threat Defense management console;
    Automated dynamic application security testing (DAST) pipeline'
  range: Last 90 days
  queries:
  - technology: Mobile EDR/Rule pseudocode
    query: 'api_calls

      | where api == ''registerReceiver''

      | where intent_filter_action IN (''NEW_OUTGOING_CALL'',''DEVICE_ADMIN_ENABLED'',''SMS_RECEIVED'',''BOOT_COMPLETED'')

      | where app_category NOT IN (''Communications'',''System Tools'')

      | where app_foreground == ''false''

      | alert app, intent_filter_action, ts'
- question: When does an app or device register an IntentFilter action for the first time, and do apps
    register receivers at an anomalous rate or immediately initiate outbound network after registration?
  context: 'Persistence (TA0028): Baseline the set of unique IntentFilter actions each app/device has
    historically registered and alert when a new action is first observed (first-seen detection). Pair
    this with frequency thresholds: alert when an app registers receivers at an anomalous rate (e.g.,
    >N registerReceiver calls/minute) or registers a receiver and then initiates outbound network within
    X seconds, capturing the event->execute->exfil causal chain that signals active broadcast-receiver
    persistence with follow-on activity. Treat the first-seen window and thresholds as drift-sensitive
    and re-baseline over time, anchoring ''normal'' intent-usage expectations in measured benign app behavior.'
  answer_sources:
  - Mobile EDR API call logs
  - Dynamic Analysis Sandbox API Traces (JSON)
  - Android Debug Bridge (adb) logcat output
  - 'NAI: Endpoint fleet of corporate-managed mobile devices; Mobile EDR/Threat Defense management console;
    Automated dynamic application security testing (DAST) pipeline'
  range: Last 90 days; for the register->outbound chain correlate within X seconds of each registerReceiver
    event
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'api_calls api==''registerReceiver''

      | join historical_actions on (app, intent_filter_action)

      | where historical_actions == null  // first-seen

      ; -- rate --

      | stats reg_rate=count by app, bin(ts,1m) | where reg_rate > N

      ; -- chain --

      | join network_outbound within 30s after registerReceiver by app | emit chain_alert'
- question: Which background apps are repeatedly throwing SecurityExceptions on registerReceiver/sendBroadcast,
    requesting permissions they do not hold, or having broadcasts denied by policy?
  context: 'Persistence (TA0028): Track the state/failure signal by counting SecurityExceptions on registerReceiver/sendBroadcast,
    receivers that require a permission the app does not hold, and broadcasts denied by policy or MAC
    (SE Android) enforcement. A background app that repeatedly attempts and fails to register or receive
    privileged broadcasts is a distinct, high-value indicator of an adversary probing for a persistence
    foothold it cannot yet achieve. Source these failure events from runtime IPC/flow instrumentation
    and MAC denial logs. A rising count of denials from a single non-interactive app is a strong triage
    trigger.'
  answer_sources:
  - Mobile EDR API call logs
  - Dynamic Analysis Sandbox API Traces (JSON)
  - Android Debug Bridge (adb) logcat output
  - 'NAI: Endpoint fleet of corporate-managed mobile devices; Mobile EDR/Threat Defense management console;
    Automated dynamic application security testing (DAST) pipeline'
  range: Last 90 days
  queries:
  - technology: Mobile EDR/Stats pseudocode
    query: 'api_call_results

      | where exception == ''SecurityException'' AND api IN (''registerReceiver'',''sendBroadcast'')

      | union mac_denial_logs(action=''broadcast''), permission_denied_events

      | where app_foreground == ''false''

      | stats failures=count by app, denied_action

      | where failures > threshold | alert app, denied_action, failures'
- question: Which apps produce anomalous registerReceiver/API call sequences according to a sequence model,
    and what calls drive the anomaly?
  context: 'Persistence (TA0028): Train an LSTM autoencoder on per-app sequences of registerReceiver/API
    calls and alert on reconstruction errors in the top 1st percentile, emitting the top-3 contributing
    calls in the alert. Complement with Markov-chain transition-probability features over the abstracted
    call sequence executed after onReceive(), which are robust to API churn and concept drift. This catches
    persistence behavior expressed as an unusual ordering of registration and follow-on calls rather than
    a single suspicious API. Choose the sequence-model architecture deliberately and confirm exploitable
    post-trigger data flows statically (source-to-sink) to validate that the anomalous sequence corresponds
    to a real malicious flow.'
  answer_sources:
  - Mobile EDR API call logs
  - Dynamic Analysis Sandbox API Traces (JSON)
  - Android Debug Bridge (adb) logcat output
  - 'NAI: Endpoint fleet of corporate-managed mobile devices; Mobile EDR/Threat Defense management console;
    Automated dynamic application security testing (DAST) pipeline'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "seq = per_app_api_call_sequence(window)\nrecon_err = lstm_autoencoder.reconstruction_error(seq)\n\
      if recon_err > percentile(all_errors, 99):\n    top3 = contributing_calls(seq, k=3)\n    emit_alert(app,\
      \ recon_err, top3)\n# augment with markov_transition_prob(post_onReceive_sequence)"
- question: Does any app's manifest contain a known 'toxic combination' of a broadcast receiver plus permissions
    that together form a high-impact malicious capability?
  context: 'Persistence (TA0028): Maintain a curated list of toxic receiver-permission combinations (e.g.,
    SMS_RECEIVED receiver + READ_CONTACTS + INTERNET; BOOT_COMPLETED receiver + SEND_SMS) and alert when
    an app manifest contains a full match. Such combinations bundle an event trigger with the permissions
    needed to harvest and exfiltrate data, the hallmark of weaponized persistence. Reduce false positives
    by confirming with static taint analysis that the receiver establishes an actual source-to-sink data
    flow (e.g., SMS body -> network), and derive the combination set from established Intent/IPC risk
    taxonomies plus ICC reachability analysis. A full match with a confirmed taint flow is a high-confidence
    finding.'
  answer_sources:
  - Parsed AndroidManifest.xml from APKs
  - UEM application inventory metadata
  - 'NAI: UEM/MDM application inventory database; Static Application Security Testing (SAST) platform;
    Mobile Threat Defense (MTD) management console'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "manifest\n| where match_toxic_combo(receivers, permissions, toxic_combo_list)\n  // e.g. ('SMS_RECEIVED'\
      \ AND 'READ_CONTACTS' AND 'INTERNET')\n  //   OR ('BOOT_COMPLETED' AND 'SEND_SMS')\n| where taint_flow_confirmed(app,\
      \ source='SMS_body', sink='network')\n| alert app, matched_combo"
- question: Which apps rank in the top 5th percentile of aggregate risk based on the rarity of their receiver-permission
    co-occurrences relative to the benign corpus?
  context: 'Persistence (TA0028): Compute rarity scores from receiver-permission co-occurrence (e.g.,
    pointwise mutual information or empirical joint probability of a receiver action with each requested
    permission across the benign corpus) and flag apps in the top 5th percentile of aggregate risk. Combinations
    rare in benign apps but frequent in known-malicious sets score highest, surfacing unusual pairings
    that hand-curated toxic-combo lists miss. Calibrate benign co-occurrence baselines from measured benign
    app behavior and validate thresholds with realistic base rates and temporal splits to avoid drift-driven
    false positives. A high aggregate rarity score warrants deeper static/dynamic review.'
  answer_sources:
  - Parsed AndroidManifest.xml from APKs
  - UEM application inventory metadata
  - 'NAI: UEM/MDM application inventory database; Static Application Security Testing (SAST) platform;
    Mobile Threat Defense (MTD) management console'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each app:\n  for (receiver, perm) in app.pairs:\n    pmi = log( p(receiver,perm) / (p(receiver)*p(perm))\
      \ )  // over benign corpus\n  risk = aggregate(pmi_scores)\nflag apps where risk >= percentile(all_risk,\
      \ 95)"
- question: Do receiver/permission feature vectors form small dense clusters not tied to known vendors
    or signing certificates, and what features define them?
  context: 'Persistence (TA0028): Use DBSCAN over receiver/permission feature vectors and prioritize small,
    dense clusters not tied to known vendors/signing certs for triage. Such tight clusters of apps sharing
    an unusual receiver/permission fingerprint often correspond to a malware family or campaign reusing
    the same persistence template. Surface the top-3 features that define each flagged cluster (the discriminating
    receiver actions and permissions) in the alert so analysts understand why apps grouped together. Select
    the clustering/representation approach deliberately and avoid spatial/temporal evaluation bias when
    setting cluster-density thresholds.'
  answer_sources:
  - Parsed AndroidManifest.xml from APKs
  - UEM application inventory metadata
  - 'NAI: UEM/MDM application inventory database; Static Application Security Testing (SAST) platform;
    Mobile Threat Defense (MTD) management console'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = receiver_permission_vectors(all_apps)\nlabels = DBSCAN(eps, min_samples).fit_predict(X)\n\
      for cluster in clusters(labels):\n  if small_and_dense(cluster) and not known_vendor_or_cert(cluster):\n\
      \    top3 = defining_features(cluster, k=3)\n    emit_alert(cluster.apps, top3)"
