questions:
- question: '[Command And Control] Correlate resolver use with IOC destinations: have you applied the
    Symbolic Logic approach to detect dead-drop resolver activity on managed mobile devices, to answer
    the intelligence requirement — Has the adversary established external command and control (C2) channels
    on mobile devices? (PIR)'
  context: 'Tactic relevance (Command And Control): Has the adversary established external command and
    control (C2) channels on mobile devices? (PIR) This question operationalizes a Symbolic Logic detection
    for MITRE ATT&CK T1481.001 (Dead Drop Resolver) on Android/iOS. Evidence under investigation: A network
    connection from a single mobile device source IP to a known public web service (e.g., pastebin.com,
    github.com, social media APIs) is followed within a 60-second window by a second, distinct outbound
    connection from the same source IP. The destination of this second connection is considered anomalous
    if it meets one of the following criteria: a) it is present on a threat intelligence feed, b) its
    domain popularity rank is in the bottom 5th percentile across the organization, or c) it has a high-risk
    ASN or reputation score. Recommended approach: Identify app-attributed mobile connections to known
    dead-drop services (paste/code-hosting/social/cloud APIs) followed within 60 seconds by a distinct
    outbound connection from the same device, and alert when the second destination matches threat-intelligence
    C2 indicators or passive-DNS-derived malicious reputation. Template this resolver-fetch-then-pivot
    correlation as SIEM rules over mobile-proxy/Zeek logs ([SigmaHQ](https://github.com/SigmaHQ/sigma))
    and score pivot reputation with passive-DNS features ([EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf)).
    A positive result indicates the device is performing the resolver-fetch-then-pivot behavior characteristic
    of a dead drop resolver — retrieving obfuscated C2-pointing content from a trusted web service and
    then connecting to attacker infrastructure — and should be corroborated against the other questions
    in this playbook (resolver correlation, pivot-destination reputation/rarity, polling cadence, response
    entropy, and TLS fingerprint anomalies); a negative result lowers but does not eliminate suspicion
    because adversaries deliberately hide in expected, TLS-encrypted noise to legitimate platforms.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - Threat intelligence indicators
  - 'NAI: Corporate Wi-Fi egress points, VPN concentrators handling mobile device traffic, MDM-managed
    device network segments, and network segments dedicated to guest or BYOD mobile devices.'
  range: Last 90 days (correlate resolver fetch and pivot within a 60-120s event window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=zeek (sourcetype=conn OR sourcetype=http OR sourcetype=ssl OR sourcetype=dns) src_ip\
      \ IN MOBILE_CIDR\n| where dest_domain IN KNOWN_DEADDROP_SVCS  // paste/code/social/cloud APIs\n\
      | join src_ip [ search sourcetype=conn src_ip IN MOBILE_CIDR\n    | eval dt=pivot_ts - resolver_ts\
      \ | where dt>0 AND dt<=60 ]\n| lookup ThreatIntel.Feed pivot_dest OUTPUT ti_hit\n| eval pdns_rep=passivedns_reputation(pivot_dest)\n\
      | where isnotnull(ti_hit) OR pdns_rep=\"malicious\"\n| eval severity=\"critical\" | table src_ip,\
      \ app, resolver_dest, pivot_dest"
