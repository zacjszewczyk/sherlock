    query: 'read conn.log,http.log | identify resolver_fetch -> pivot pairs (dt<=60s)

      | pop_pct = domain_popularity_percentile(pivot_dest)  // fleet prevalence

      | resolver_ratio = orig_bytes_r/resp_bytes_r

      | eventstats perc95(orig_bytes) as p95_orig by pivot_port

      | where pop_pct <= 5 AND resolver_ratio < median_ratio AND pivot_orig_bytes > p95_orig

      | enrich passive_dns(distinct_ips, distinct_asns, ttl_var, name_novelty)

