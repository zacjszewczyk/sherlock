name: 'T1481.001: Dead Drop Resolver'
id: 433d2133-7cf5-4b79-adf5-082c998d8ef1
description: 'This playbook helps an analyst investigate MITRE ATT&CK T1481.001 (Dead Drop Resolver) on
  managed Android and iOS devices, where an adversary abuses a legitimate, high-reputation external web
  service (paste sites, code-hosting, social-media APIs, collaboration or cloud-storage platforms) to
  host obfuscated/encoded domains or IP addresses that redirect infected devices to back-end command and
  control (C2) infrastructure. It supports the Command and Control mission question by chaining the resolver-fetch-then-pivot
  pattern: an app-attributed request to a known public platform that returns small or encoded content,
  followed within a short window by a distinct outbound connection to a newly-derived, low-popularity,
  or threat-intel-flagged destination, especially when the device is locked, backgrounded, or without
  recent user interaction. The questions combine deterministic symbolic-logic correlation (resolver→IOC
  pivots, extracted-indicator-then-connect, invalid/newly-issued certificates, non-browser TLS client
  stacks), statistical baselining (polling-cadence periodicity, low-popularity high-byte pivots, response
  entropy/compression, rare JA3/JA4 fingerprints), and machine-learning detectors (connection-pair classification,
  SARIMA volume forecasting, online autoencoder flow anomaly, DBSCAN TLS clustering) over Zeek, mobile-proxy,
  MDM, and threat-intelligence telemetry.'
type: technique
related:
- tactic_id: TA0037
  tactic_name: Command And Control
