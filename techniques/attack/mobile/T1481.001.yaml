    for MITRE ATT&CK T1481.001 (Dead Drop Resolver) on Android/iOS. Evidence under investigation: A mobile
    device connects to a legitimate content-hosting web service, and the content of the response body,
    such as from an unencrypted HTTP response or a captured file, contains an IP address or a Fully Qualified
    Domain Name (FQDN). The same mobile device subsequently initiates a connection to that extracted IP
    or FQDN within a 2-minute window. Recommended approach: Parse resolver response bodies/files (HTTP/files.log)
    for embedded IPs/FQDNs (including base64/hex/obfuscated forms), match extracted indicators and the
    subsequent destination to threat intelligence and passive-DNS reputation, and alert when the same
    device connects to the extracted indicator within 2 minutes ([SigmaHQ](https://github.com/SigmaHQ/sigma),
    [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf)). A positive result
    indicates the device is performing the resolver-fetch-then-pivot behavior characteristic of a dead
    drop resolver — retrieving obfuscated C2-pointing content from a trusted web service and then connecting
    to attacker infrastructure — and should be corroborated against the other questions in this playbook
    (resolver correlation, pivot-destination reputation/rarity, polling cadence, response entropy, and
    TLS fingerprint anomalies); a negative result lowers but does not eliminate suspicion because adversaries
    deliberately hide in expected, TLS-encrypted noise to legitimate platforms.'
