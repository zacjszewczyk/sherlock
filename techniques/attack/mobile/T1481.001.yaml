    Malware Traffic](https://arxiv.org/abs/1703.02200)). A positive result indicates the device is performing
    the resolver-fetch-then-pivot behavior characteristic of a dead drop resolver — retrieving obfuscated
    C2-pointing content from a trusted web service and then connecting to attacker infrastructure — and
    should be corroborated against the other questions in this playbook (resolver correlation, pivot-destination
