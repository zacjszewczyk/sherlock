    features (time delta, pivot bytes and byte ratio, domain-popularity percentile, ASN diversity, TTL
    stats, JA4) to alert on probabilities >0.85, layered in parallel with the deterministic rule above;
    do not delete the rule. Surface the top-3 contributing features (e.g., time-delta, pivot byte volume,
    popularity percentile) in alert text via SHAP ([SHAP IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)).
