  range: Last 90 days (use >=7-30 days of history to establish per-app/fleet baselines)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'read conn.log | where dest IN KNOWN_DEADDROP_SVCS | group by app, dest_svc

      | deltas = inter_arrival(ts)

      | cv = stdev(deltas)/avg(deltas); madv = mad(deltas); skew = bowley_skew(deltas)

      | period = FFT_autocorr(deltas).dominant_peak; n = count(fetches)

      | baseline thresholds over 7-30d fleet history

      | where (cv < 0.1 OR period_persistent) AND n >= 12

      | eval severity="medium"'
