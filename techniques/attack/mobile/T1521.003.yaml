name: 'T1521.003: SSL Pinning'
id: 4f4ccf1c-1d0f-4404-8030-6c15b3157b14
description: Investigate whether an adversary is abusing SSL/TLS certificate or public-key pinning on
  managed mobile devices (Android and iOS) to shield Command-and-Control (C2) traffic from enterprise
  TLS inspection. Legitimate apps pin certificates to harden communications, but the same mechanism lets
  malicious apps refuse the enterprise interception certificate and tunnel C2 inside opaque, un-inspectable
  TLS sessions. This playbook helps an analyst hunt the network-side fingerprint of pinning — a measurable
  spike in TLS handshake/validation failures that occur ONLY under the enterprise inspecting proxy, followed
  by a direct (uninspected) retry to the same endpoint within a short correlation window — using Zeek
  ssl.log/x509.log/conn.log enriched with MDM application context and threat intelligence. It guides certificate-centric
  hunting for self-signed or statistically rare issuers, short-validity certs, high-entropy server names,
  and abnormal JA3/JA4/JA4X fingerprints; statistical and ML scoring of opaque-TLS beaconing (inter-arrival
  regularity, payload dispersion, byte ratios, destination rarity); time-series anomaly detection of per-app/per-server
  failure spikes; and static analysis of mobile application packages (APK/IPA) for pinning constructs
  (Android network_security_config <pin-set>, OkHttp CertificatePinner, custom TrustManager/HostnameVerifier,
  TrustKit; iOS NSPinnedDomains/ATS, AFNetworking trust evaluation). Together these questions surface
  the fail-under-inspection-then-bypass primitive that distinguishes adversary pinning of C2 from benign
  app pinning across both Android and iOS fleets.
type: technique
related:
- tactic_id: TA0037
  tactic_name: Command and Control
