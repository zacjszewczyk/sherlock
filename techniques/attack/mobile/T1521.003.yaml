    query: "features = [pinning_libs, declared_permissions, obfuscation_entropy,\n            nsc_trust_anchor_cleartext_rules,\
      \ embedded_domain_reputation,\n            undeclared_background_network]\nclf = Classifier(train=labeled_apps)\n\
      score = clf.predict_proba(app)\nif score > risk_threshold:\n  alert 'risky pinning implementation'\
