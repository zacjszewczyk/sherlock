    and Zeek conn.log at the egress gateway.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      flows = encrypted_flow_features(conn join edr_app_attribution)
              where src_ip in mobile_device_subnet;
      iso = IsolationForest(); ocsvm = OneClassSVM();
      etbert = load('et_bert_perapp.pt'); etssl = load('et_ssl.pt');
      for f in flows:
        if iso.anomaly(f) or ocsvm.anomaly(f) or etbert.ood(f) or etssl.ood(f):
          alert(device=f.src_ip, app=f.app, flow=f.id,
                top_features=lime_top3(iso,f))
