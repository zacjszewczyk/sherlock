name: 'T1521: Encrypted Channel'
id: 1a46d1d3-6caa-4897-a6f3-e294e7b9597b
description: 'Investigate whether an adversary is using a known encryption algorithm to conceal command
  and control (C2) traffic to or from managed Android and iOS mobile devices, beyond the protections inherent
  to a communication protocol. This playbook helps a SOC analyst hunt for application-layer encrypted
  channels across multiple vantage points: anomalous TLS certificate and domain attributes (self-signed
  certs, non-approved CAs, short validity windows, newly registered or low-reputation domains); TLS validation
  failures and blocked egress bursts that signal C2 retries; rare or high-entropy destination domains;
  non-allowlisted or statistically rare TLS-stack fingerprints (JA3/JA3S/JA4/JA4S); encrypted beaconing
  characterized by periodicity, low jitter, low byte variance, and unusually long-lived low-throughput
  connections; and on-device evidence where a managed app invokes cryptographic APIs (AES/RSA/KeyStore)
  on locally staged data and then transmits structured traffic in the background, while the device is
  locked, or without user interaction, including static crypto-API misuse such as ECB mode, hardcoded
  keys, and constant IVs/salts. Detection methods span deterministic symbolic logic, statistical baselining,
  and machine learning so an analyst can determine whether a custom or non-standard encrypted channel
  is being used to control compromised mobile devices.'
type: technique
related:
- tactic_id: TA0037
  tactic_name: Command And Control
