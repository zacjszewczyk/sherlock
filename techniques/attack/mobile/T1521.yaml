- question: When label-free anomaly detectors and self-supervised encrypted-traffic models score the egress
    flows produced by managed apps, which flows are flagged as out-of-distribution relative to each app's
    learned normal encrypted-flow profile, and what features explain the anomaly?
  context: You usually cannot decrypt mobile TLS, so detection must work on flow metadata alone. Score
    egress flows with label-free anomaly detectors (Isolation Forest or One-Class SVM with LIME top-feature
    attribution, per the Robust IoT Security study) and self-supervised encrypted-traffic models (ET-SSL
    and ET-BERT) that learn each app's normal encrypted-flow distribution and flag out-of-distribution
    flows. Surfacing the top-3 contributing features in the alert lets an analyst see why a flow is anomalous
    (timing, size sequence, direction ratio) without needing plaintext. A positive result is a flow that
    deviates sharply from the app's learned profile; flows consistent with the learned distribution are
    benign. This serves Command and Control detection by exposing concealed encrypted channels purely
    from their traffic shape, even under TLS 1.3/ECH.
  answer_sources:
  - MobileEDR OS API Execution telemetry
  - MobileEDR File Creation telemetry
  - MobileEDR Application State
