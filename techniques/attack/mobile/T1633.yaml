name: 'T1633: Virtualization-Sandbox Evasion'
id: 1cb145e7-3e28-43c1-819f-f5e61b7ef46c
description: 'Investigate whether malware on a corporate mobile device is attempting to detect that it
  is running inside a sandbox, emulator, or analysis environment so it can alter its behavior, disengage,
  or conceal its payload (MITRE ATT&CK T1633, Virtualization/Sandbox Evasion on Android and iOS). This
  playbook helps an analyst hunt for the tell-tale environment-checking behaviors evasive mobile malware
  performs shortly after install or first launch: querying system properties and build fingerprints associated
  with QEMU/Android emulators (ro.hardware:goldfish/ranchu, ro.kernel.qemu:1, ro.product.model:sdk, generic
  brand/manufacturer, emulator-default IMEI and phone numbers); rapidly requesting human-interaction permissions
  and sensors (contacts, call log, accelerometer, gyroscope, light sensor) and then going network-dormant
  when no human presence is found; and bursting DNS lookups to public NTP and IP-geolocation services
  to validate the device''s time and location against the static or incorrect values a sandbox often provides.
  Detection methods span symbolic logic (correlating MDM, Logcat, and Zeek telemetry against artifact
  watchlists), statistical baselining (volume, frequency, entropy, and ratio outliers versus a trusted-app
  fleet distribution), and machine learning (Random Forest classification of evasive apps, LSTM autoencoders
  over sensor streams, and DBSCAN clustering of evasion DNS profiles), with deterministic floors and adversarial
  hardening so analysts can determine whether an application is fingerprinting its runtime environment
  to evade dynamic analysis.'
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
