questions:
- question: Did a third-party application process (one not on the trusted OS/vendor publisher allowlist)
    query two or more distinct Android emulator system properties — such as ro.hardware:goldfish, ro.hardware:ranchu,
    ro.kernel.qemu:1, ro.product.model:sdk, ro.product.manufacturer:Genymotion, or ro.product.brand:generic
    — within 60 seconds of its first execution, or read TelephonyManager identifiers that resolve to emulator
    defaults (all-zero IMEI, phone number 15555215554)?
  context: 'Virtualization/Sandbox Evasion under Defense Evasion frequently begins with the malware fingerprinting
    its runtime by reading build/system properties that differ between a real handset and an emulator.
    This symbolic-logic check joins MDM process-start logs with Android Logcat so you can attribute getprop/android.os.SystemProperties
    reads to a specific app, then fires when an app that is NOT on a pre-approved publisher allowlist
    touches two or more entries from the emulator-artifact watchlist (ro.hardware:goldfish, ro.hardware:ranchu,
    ro.kernel.qemu:1, ro.product.model:sdk, ro.product.manufacturer:Genymotion, ro.product.brand:generic)
    within 60 seconds of launch. The watchlist is drawn from the canonical QEMU/build-property fingerprint
    enumeration in [Evading Android Runtime Analysis via Sandbox Detection](https://users.ece.cmu.edu/~tvidas/papers/ASIACCS14.pdf)
    and the evasion taxonomy in [Malware Dynamic Analysis Evasion Techniques: A Survey](https://arxiv.org/abs/1811.01190).
    Also flag reads of TelephonyManager identifiers that resolve to emulator defaults (all-zero IMEI,
    phone number 15555215554). A positive hit — an app deliberately probing emulator artifacts moments
    after launch — strongly indicates the payload is deciding whether to disengage; treat the app, its
    publisher, and the device as immediate triage leads. A negative result lowers but does not eliminate
    suspicion, because a single well-chosen check or native-code probing may not surface in Logcat.'
  answer_sources:
  - Android Logcat
  - MDM Application Inventory Logs
  - MDM Process Activity Logs
  - Zeek conn.log
  - 'NAI: Managed Mobile Device Endpoints, Mobile Device Management (MDM) Platform, Centralized Log Aggregator/SIEM,
    Network Security Monitoring (NSM) sensors at internet gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "proc = join(mdm_process_start, android_logcat) on (device_id, package, pid);\nemu_props =\
      \ ['ro.hardware:goldfish','ro.hardware:ranchu','ro.kernel.qemu:1',\n             'ro.product.model:sdk','ro.product.manufacturer:Genymotion','ro.product.brand:generic'];\n\
      emu_telephony = ['imei:000000000000000','line1number:15555215554'];\nalert when proc.publisher not\
      \ in allowlist\n  and ( count(distinct p in proc.property_reads where p in emu_props) >= 2\n   \
      \     or any(t in proc.telephony_reads where t in emu_telephony) )\n  and proc.read_time - proc.first_exec_time\
      \ <= 60s;\noutput device_id, package, publisher, matched_props, read_time"
- question: For each third-party application, do its system-property access patterns in the first minutes
    after launch stand out as statistical outliers — an unusually high count of unique emulator-related
    properties, an elevated getprop/SystemProperties call rate, an emulator-artifact-to-total-property
    ratio approaching 1.0, or very low Shannon entropy of queried property names — relative to the trusted-app
    fleet baseline?
  context: 'Rather than matching fixed strings, this statistical method profiles HOW an app interrogates
    system properties and compares it to the behavior of vetted, trusted apps across the fleet — the real-vs-emulator
    behavioral gap measured in [EMULATOR vs REAL PHONE: Android Malware Detection Using Machine Learning](https://arxiv.org/abs/1703.10926).
    By Volume, compute the fleet-wide 99th percentile for the count of unique emulator-related properties
    any single app reads in its first five minutes and alert on apps exceeding it. By Frequency, alert
    when getprop/SystemProperties calls exceed a baseline-derived threshold (e.g., >20/min concentrated
    on the artifact watchlist). By State, track the ratio of emulator-artifact reads to total property
    reads — a ratio near 1.0 means the app is doing little except fingerprinting — and compute Shannon
    entropy of queried property names, where entropy < 1.5 reveals repetitive checking of a small artifact
    set. All thresholds derive from the trusted-app distribution, so this catches evasive apps that vary
    their exact property strings to dodge the watchlist. A positive result is an app whose property-access
    shape is anomalously fingerprint-heavy; investigate alongside its install source and subsequent network
    behavior.'
  answer_sources:
  - Android Logcat
  - MDM Application Inventory Logs
  - MDM Process Activity Logs
  - Zeek conn.log
  - 'NAI: Managed Mobile Device Endpoints, Mobile Device Management (MDM) Platform, Centralized Log Aggregator/SIEM,
    Network Security Monitoring (NSM) sensors at internet gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "logs = android_logcat.property_reads joined to mdm_process_start;\nper app in first_5min:\n\
      \  uniq_emu = count(distinct emulator_props_read);\n  rate     = getprop_calls / minutes;\n  ratio\
      \    = emulator_prop_reads / total_prop_reads;\n  ent      = shannon_entropy(property_names);\n\
      baseline = fleet_distribution(trusted_apps);\nalert when uniq_emu > pct99(baseline.uniq_emu)\n \
      \ or rate > baseline.rate_threshold\n  or ratio >= 0.9\n  or ent < 1.5;\noutput app, uniq_emu, rate,\
      \ ratio, ent"
- question: When a supervised model is scored against an application's MDM/Logcat features — count and
    ratio of suspicious property queries, entropy of property names, getprop calls per minute, time from
    install to first query, publisher reputation, and requested permissions — does it classify the app
    as exhibiting evasive behavior, and do the top-3 contributing features support that call?
  context: 'This machine-learning method trains a Random Forest to predict evasive behavior from explainable
    static and behavioral features, following the explainable-detection approach of [DREBIN: Effective
    and Explainable Detection of Android Malware](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf).
    The model combines property-query count and ratio, property-name entropy, getprop rate, install-to-first-query
    latency, publisher reputation, and requested permissions to flag apps that probe their environment
    like evasive malware. Crucially, every alert MUST surface the top-3 contributing features (for example
    ''emulator-property-ratio=0.92, getprop/min=44, install-to-query=3s'') so an analyst can triage without
    re-running the model. Because attackers craft problem-space evasions, the model should be adversarially
    trained and ensembled ([Adversarial Deep Ensemble: Evasion Attacks and Defenses for Malware Detection](https://arxiv.org/abs/2006.16545);
    [Problem-Space Evasion Attacks in the Android OS: a Survey](https://arxiv.org/abs/2205.14576)) and
    the deterministic watchlist/statistical rules retained as a parallel floor. High-confidence predictions
    should be correlated with subsequent Zeek conn.log activity — connections to malicious IPs or unusual
    ports — to escalate priority. A positive, well-explained prediction warrants deeper reverse-engineering
    of the app; treat low-confidence or weakly-explained hits as leads to corroborate, not standalone
    verdicts.'
  answer_sources:
  - Android Logcat
  - MDM Application Inventory Logs
  - MDM Process Activity Logs
  - Zeek conn.log
  - 'NAI: Managed Mobile Device Endpoints, Mobile Device Management (MDM) Platform, Centralized Log Aggregator/SIEM,
    Network Security Monitoring (NSM) sensors at internet gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [emu_prop_count, emu_prop_ratio, prop_name_entropy, getprop_per_min,\n        \
      \    install_to_first_query_sec, publisher_reputation, requested_permissions];\nmodel = RandomForest(adversarially_trained=true,\
      \ ensemble=true);\nscore = model.predict_proba(features);\nalert when score >= 0.8 with top3 = model.explain(features);\n\
      enrich with zeek_conn[device_id] -> {malicious_dest_ip, unusual_ports};\noutput app, score, top3,\
      \ correlated_network"
- question: Did a newly launched application get granted three or more human-interaction permissions (READ_CONTACTS,
    READ_CALL_LOG, BODY_SENSORS, ACTIVITY_RECOGNITION) within 60 seconds of first launch, and then go
    network-dormant — zero outbound connections, or a single TCP/UDP session with fewer than 1024 orig_bytes
    in Zeek conn.log — over the following five minutes?
  context: 'A classic sandbox-evasion pattern under Defense Evasion is the reverse-Turing / human-presence
    check: the malware grabs sensors and personal-data permissions to test whether a real human is using
    the device, finds no human signal in the analysis environment, and disengages by staying silent on
    the network. This symbolic-logic rule joins MDM permission-grant logs with Zeek conn.log to fire when
    an app is granted three or more permissions from the human-interaction watchlist (android.permission.READ_CONTACTS,
    READ_CALL_LOG, BODY_SENSORS, ACTIVITY_RECOGNITION) within 60 seconds of first launch AND then exhibits
    network dormancy (zero outbound connections, or a single TCP/UDP session with orig_bytes < 1024) over
    the next five minutes — the detection-independent evasion behavior catalogued in [Malware Dynamic
    Analysis Evasion Techniques: A Survey](https://arxiv.org/abs/1811.01190) and the static-sensor/no-input
    artifacts in [Evading Android Runtime Analysis via Sandbox Detection](https://users.ece.cmu.edu/~tvidas/papers/ASIACCS14.pdf).
    As a failure-mode companion, separately count denied permission grants and blocked outbound connections
    per app, which signal stalling/evasion when an app is repeatedly thwarted. A positive hit — aggressive
    human-presence probing followed by deliberate silence — is a strong evasion indicator; a talkative
    app that genuinely uses those permissions for features is the benign negative.'
  answer_sources:
  - MDM Permission Grant Logs
  - Android Logcat
  - Zeek conn.log
  - 'NAI: Managed Mobile Device Endpoints, Mobile Device Management (MDM) Platform, Centralized Log Aggregator/SIEM,
    Network Security Monitoring (NSM) sensors at internet gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "perms = mdm_permission_grants; net = zeek_conn;\nhuman_perms = ['READ_CONTACTS','READ_CALL_LOG','BODY_SENSORS','ACTIVITY_RECOGNITION'];\n\
      granted = count(distinct p in perms[app] where p in human_perms\n                and grant_time\
      \ - first_launch <= 60s);\ndormant = (outbound_conns(app, first_launch .. +5min) == 0)\n       \
      \   or (sessions == 1 and orig_bytes < 1024);\nalert when granted >= 3 and dormant;\nalso_track\
      \ denied_grants(app), blocked_conns(app);\noutput device_id, app, granted_perms, net_summary"
- question: Compared to a per-category baseline of trusted apps, is a new application's first-five-minute
    behavior anomalous — a startup API-call transition profile (Markov chain / Levenshtein distance) in
    the 98th percentile, an API-call count and outbound byte count both below the category 1st percentile,
    or accelerometer/gyroscope entropy near zero for 30+ seconds indicating static, non-human sensor data?
  context: 'Emulated environments produce a measurably different runtime shape than real handsets, and
    this statistical method exploits that gap. For each app category (Productivity, Games, etc.), build
    a baseline of normal startup API-call sequences from trusted apps and model call transitions as a
    Markov chain per [MaMaDroid: Detecting Android Malware by Building Markov Chains of Behavioral Models](https://arxiv.org/abs/1612.04433);
    flag apps whose first-five-minute transition profile, or Levenshtein distance to the category baseline,
    lands in the 98th percentile. [EMULATOR vs REAL PHONE: Android Malware Detection Using Machine Learning](https://arxiv.org/abs/1703.10926)
    showed API activity and network volume drop under emulation, so by Volume/State, alert when an app''s
    API-call count AND outbound byte count both fall below the category 1st percentile — the suppression
    itself is the signal. Additionally, monitor the entropy of accelerometer/gyroscope streams; entropy
    near zero for >=30s indicates static, non-human sensor data typical of an emulator. A positive result
    is an app whose startup behavior is statistically unlike its peers in a way consistent with running
    in or detecting an analysis sandbox; corroborate with the permission/dormancy rule and sensor model.'
  answer_sources:
  - MDM Permission Grant Logs
  - Android Logcat
  - Zeek conn.log
  - 'NAI: Managed Mobile Device Endpoints, Mobile Device Management (MDM) Platform, Centralized Log Aggregator/SIEM,
    Network Security Monitoring (NSM) sensors at internet gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for category in app_categories:\n  base_mc = markov_chain(trusted_apps[category].startup_api_sequences);\n\
      \  base_vol = distribution(trusted_apps[category].{api_count, out_bytes});\nper new_app in first_5min:\n\
      \  dist = levenshtein(app.api_sequence, base_mc) or markov_score(app, base_mc);\n  alert when dist\
      \ >= pct98(category)\n    or (app.api_count < pct1(base_vol.api_count) and app.out_bytes < pct1(base_vol.out_bytes))\n\
      \    or (entropy(app.accel_gyro_stream over >=30s) ~ 0);\noutput app, category, dist, api_count,\
      \ out_bytes, sensor_entropy"
- question: When an LSTM autoencoder trained on normal human device usage is fed the real-time accelerometer
    and gyroscope streams associated with a newly installed app, does the reconstruction error exceed
    the statistically derived threshold — indicating non-human (emulated) sensor activity — and do the
    top-3 contributing signals (e.g., accel-entropy, reconstruction error multiple, fixed sensor update
    rate) support that conclusion?
  context: 'Emulators and analysis sandboxes rarely reproduce the rich, noisy motion of a human carrying
    a phone. This machine-learning method deploys an LSTM autoencoder for time-series anomaly detection
    on sensor streams (accelerometer, gyroscope), trained on normal human usage. Feeding real-time sensor
    data attributed to a newly installed app''s process, a reconstruction error above a statistically
    derived threshold signifies non-human, emulated activity — the app is likely seeing (or generating)
    synthetic motion characteristic of a sandbox. Each alert MUST include the top-3 contributing signals
    (for example ''accel-entropy=0.0, recon-error=12.4x baseline, sensor-update-rate=fixed'') for explainability,
    consistent with the interpretable-feature philosophy of [DREBIN: Effective and Explainable Detection
    of Android Malware](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf). Because
    evasion can be auto-generated at scale ([A Large Language Model Approach to Generating Bypass Rules
    for Malware Evasion in Analysis Sandbox](https://arxiv.org/abs/2605.21821)), keep the deterministic
    sensor-entropy and permission rules as a parallel floor and adversarially harden the model ([Adversarial
    Deep Ensemble: Evasion Attacks and Defenses for Malware Detection](https://arxiv.org/abs/2006.16545)).
    A positive, well-explained anomaly indicates the app is operating against non-human sensor data and
    may be fingerprinting the environment; corroborate before declaring a verdict.'
  answer_sources:
  - MDM Permission Grant Logs
  - Android Logcat
  - Zeek conn.log
  - 'NAI: Managed Mobile Device Endpoints, Mobile Device Management (MDM) Platform, Centralized Log Aggregator/SIEM,
    Network Security Monitoring (NSM) sensors at internet gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "ae = LSTM_Autoencoder(trained_on=human_sensor_usage);\nstream = sensor_stream(accel, gyro)\
      \ attributed_to new_app.process;\nrecon_err = ae.reconstruction_error(stream);\nthreshold = mean(human_err)\
      \ + k*std(human_err);\nalert when recon_err > threshold\n  with top3 = explain(accel_entropy, recon_err_multiple,\
      \ sensor_update_rate);\nfloor: keep deterministic sensor_entropy + permission rules in parallel;\n\
      output app, recon_err, threshold, top3"
- question: Within the first five minutes after install, did an application process initiate DNS queries
    for three or more distinct public NTP or IP-geolocation service domains (e.g., pool.ntp.org, time.nist.gov,
    ip-api.com, ipinfo.io, ifconfig.me, ip.sb) — behavior consistent with verifying the device's true
    time and location to detect a sandbox supplying static or incorrect values?
  context: 'Sandboxes often present static or implausible clock and geolocation values, so evasive malware
    queries external time and geolocation services to check whether the environment is real. This symbolic-logic
    rule correlates MDM install logs with Zeek dns.log and fires when a mobile process generates DNS queries
    for three or more unique domains from a watchlist of public time/geolocation services (pool.ntp.org,
    time.nist.gov, ip-api.com, ipinfo.io, ifconfig.me, ip.sb) within its first five minutes — the network
    ''wear-and-tear'' / environment-check evasion vector documented in [Malware Dynamic Analysis Evasion
    Techniques: A Survey](https://arxiv.org/abs/1811.01190) and [Evading Android Runtime Analysis via
    Sandbox Detection](https://users.ece.cmu.edu/~tvidas/papers/ASIACCS14.pdf). Tying the DNS burst to
    a freshly installed app via MDM install logs distinguishes evasion reconnaissance from ordinary NTP
    sync. A positive hit — a just-installed app fanning out to multiple time/geo providers — suggests
    the payload is validating its surroundings before deciding whether to detonate; pivot to the app''s
    subsequent connections. A negative result is expected for normal apps that rely on the OS time service.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - MDM Application Installation Logs
  - 'NAI: Corporate DNS Resolvers, Network Security Monitoring (NSM) sensors at internet gateways, Centralized
    Log Aggregator/SIEM, Mobile Device Management (MDM) Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "dns = zeek_dns; installs = mdm_app_install;\ntimegeo = ['pool.ntp.org','time.nist.gov','ip-api.com','ipinfo.io','ifconfig.me','ip.sb'];\n\
      for app in installs:\n  q = dns where src=app.device and ts in (install .. +5min);\n  uniq = count(distinct\
      \ d in q.query where d matches timegeo);\n  alert when uniq >= 3;\noutput device_id, app, matched_domains,\
      \ first_query_ts"
- question: Against a 30-day rolling per-device baseline, does a device show a burst of time/geolocation
    DNS activity — distinct such domains in a 10-minute window exceeding three standard deviations above
    baseline, or a single-domain query rate above its 99th percentile — and is there an accompanying spike
    in NXDOMAIN/SERVFAIL or blocked lookups immediately followed by app dormancy, or a high DNS-query-to-established-connection
    ratio with near-zero data transfer?
  context: 'This statistical method baselines each device''s normal use of time/geolocation domains over
    30 days and flags deviations characteristic of sandbox-evasion reconnaissance. By Frequency, in a
    10-minute sliding window, alert if the count of distinct time/geo domains exceeds three standard deviations
    above the device baseline, or if the query rate to a single domain exceeds its 99th percentile. As
    a failure-mode signal, profile the NXDOMAIN/SERVFAIL and blocked-connection rates for these lookups
    separately — a burst of failed time/geo resolutions immediately followed by app dormancy is a strong
    evasion indicator, reflecting the dormant-on-failure behavior measured in [EMULATOR vs REAL PHONE:
    Android Malware Detection Using Machine Learning](https://arxiv.org/abs/1703.10926). By Volume, track
    the DNS-query-to-established-connection ratio; a high ratio with near-zero data transfer indicates
    reconnaissance without payload. A positive result is a device exhibiting anomalous, failure-prone,
    or payload-less time/geo querying; correlate with the install-time DNS-burst rule to attribute it
    to a specific app.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - MDM Application Installation Logs
  - 'NAI: Corporate DNS Resolvers, Network Security Monitoring (NSM) sensors at internet gateways, Centralized
    Log Aggregator/SIEM, Mobile Device Management (MDM) Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = rolling_30d(per_device, timegeo_domain_query_count_freq);\nwindow = 10min sliding over\
      \ zeek_dns;\nalert when distinct_timegeo_domains(window) > base.mean + 3*base.std\n  or query_rate(single_domain)\
      \ > pct99(base);\ntrack nxdomain_servfail_rate, blocked_conn_rate for timegeo lookups;\nflag failed_timegeo_burst\
      \ immediately_followed_by app_dormancy;\ntrack dns_query_to_established_conn_ratio with near_zero_bytes;\n\
      output device_id, window, metrics"
- question: When DBSCAN clusters five-minute windows of mobile-subnet traffic using Zeek dns.log/conn.log
    features (count and entropy of unique FQDNs, DNS-to-connection ratio, NXDOMAIN ratio, destination
    ports 53/123/80/443, and JA3/JA3S hashes), do any windows fall out as 'noise' outliers exhibiting
    high time/geo DNS volume followed by minimal data transfer?
  context: 'This machine-learning method uses unsupervised clustering to surface evasion DNS profiles
    that fixed rules may miss. Apply DBSCAN to five-minute windows of mobile-subnet traffic, featurizing
    each window with the count of unique FQDNs, entropy of FQDNs, DNS-to-connection ratio, NXDOMAIN ratio,
    destination ports (53,123,80,443), and JA3/JA3S TLS-fingerprint hashes. DBSCAN groups normal behavior
    into dense clusters and leaves anomalous windows as ''noise'' outliers; investigate those outliers
    that show high time/geo DNS volume followed by minimal data transfer, the signature of environment-checking
    without payload delivery. Output the top-3 distinguishing features per flagged window in the alert
    for explainability (cf. [DREBIN: Effective and Explainable Detection of Android Malware](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf)),
    and retain the deterministic watchlist plus statistical thresholds as a parallel floor, since ML clustering
    alone is evadable ([Problem-Space Evasion Attacks in the Android OS: a Survey](https://arxiv.org/abs/2205.14576)).
    A positive result is a noise-outlier window whose feature mix matches sandbox-evasion reconnaissance;
    pivot from the window to the originating device and app for confirmation.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - MDM Application Installation Logs
  - 'NAI: Corporate DNS Resolvers, Network Security Monitoring (NSM) sensors at internet gateways, Centralized
    Log Aggregator/SIEM, Mobile Device Management (MDM) Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "windows = featurize(zeek_dns+zeek_conn, bin=5min, subnet=mobile,\n  feats=[uniq_fqdn, fqdn_entropy,\
      \ dns_to_conn_ratio, nxdomain_ratio,\n         dest_ports{53,123,80,443}, ja3, ja3s]);\nlabels =\
      \ DBSCAN(windows, eps, min_samples);\nnoise = windows where label == -1;\ninvestigate noise where\
      \ high_timegeo_dns and minimal_data_transfer;\nalert with top3 = distinguishing_features(window);\n\
      floor: keep watchlist + statistical thresholds in parallel;\noutput window, device_id, top3"
