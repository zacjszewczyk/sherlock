name: 'T1417.001: Keylogging'
id: 5e4d5ca3-5003-4cb9-a883-790037dfdca3
description: Investigate adversary input capture on managed mobile devices (iOS/Android), covering both
  Keylogging (T1417.001) and GUI Input Capture (T1417.002) across the Credential Access and Collection
  tactics. This playbook helps an analyst determine whether a non-allowlisted keyboard (IME), accessibility
  service, or overlay-capable app is intercepting credentials or harvesting sensitive content such as
  messages, contacts, and on-screen data. It chains MDM application inventory/permission telemetry, on-device
  logcat/unified-log signals (capability grant, foreign-package text/commit callbacks, overlay/activity-on-top
  events, look-alike prompts and WebViews, local keylog/credential/form artifact writes), and Zeek network
  evidence (low-volume regular beaconing for credential exfil vs. large bursty post-app-use egress for
  bulk collection, new destinations, suspicious TLS/JA3, DGA entropy). It applies deterministic source-to-sink
  rules, statistical baselining/beacon analysis, Markov behavioral modeling, and explainable ML classification
  to surface defensible, attributable detections for a SOC analyst.
type: technique
related:
- tactic_id: TA0031
  tactic_name: Credential Access
- tactic_id: TA0035
  tactic_name: Collection
