    keys). A risk score > 0.8 triggers automated device isolation and a critical SOC incident; retain
    the deterministic permission/overlay rules as the non-ML floor. The explanation lets the analyst confirm
    whether the high score reflects genuine phishing capability or a benign-but-overprivileged app.'
  answer_sources:
