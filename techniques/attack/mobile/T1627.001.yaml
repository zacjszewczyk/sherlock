name: 'T1627.001: Geofencing'
id: 223a284f-07ab-4e02-bbf5-cc31effde7b2
description: 'This playbook helps an analyst investigate MITRE ATT&CK T1627.001 (Geofencing) on managed
  Android and iOS devices, where an adversary uses a device''s geographic location to gate, suppress,
  or trigger malicious behavior in order to evade detection and analysis. Geofenced malware commonly stays
  dormant or shows only benign behavior outside a target region (including malware-analysis sandboxes
  located elsewhere) and activates second-stage payloads, network callbacks, background execution, or
  protected-resource access only after the device enters, exits, or remains within a qualifying region.
  The playbook supports the Defense Evasion mission question by chaining two investigative angles: (1)
  static application vetting -- detecting high-risk persistent/background location permissions that are
  implausible for an app''s category, proving location-to-decision/egress data flow with taint analysis,
  and flagging location-gated trigger predicates (geofence logic bombs); and (2) dynamic sandbox and network
  analysis -- forcing the geofence trigger with targeted location injection and measuring abrupt, sustained
  shifts in beaconing, egress volume, HTTP fingerprints, DNS randomness, and failure rates that coincide
  with a simulated GPS region change. Questions combine deterministic symbolic-logic rules (Kirin-style
  permission rules, FlowDroid/TaintDroid taint, TriggerScope predicate analysis, RITA periodicity, DECANTeR
  HTTP fingerprints), statistical baselining (per-category prevalence, KL-divergence DNS randomness, volume/frequency
  and error-rate shifts, time-aware threshold derivation), and machine-learning detectors (explainable
  DREBIN/MaMaDroid classifiers, LSTM autoencoders, and TRANSCENDENT conformal-prediction rejection) across
  MDM/app-vetting telemetry and Zeek network logs.'
type: technique
