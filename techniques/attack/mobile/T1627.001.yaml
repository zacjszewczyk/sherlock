questions:
- question: '[Defense Evasion] Alert on persistent location permission outside approved app categories:
    Have you flagged managed apps that declare high-risk persistent/background location permissions together
    with internet access while belonging to an app-store or corporate category that has no plausible need
    for continuous location?'
  context: 'Tactic relevance (Defense Evasion): Is the adversary using geofencing to evade detection or
    analysis on our mobile devices? (PIR) This question operationalizes a Symbolic Logic detection for
    MITRE ATT&CK T1627.001 (Geofencing) on Android/iOS. Apply Kirin-style deterministic install-time rules
    over the manifest/permission combination ([On Lightweight Mobile Phone Application Certification](https://patrickmcdaniel.org/pubs/ccs09b.pdf)).
    Alert when an app declares ACCESS_FINE_LOCATION AND ACCESS_BACKGROUND_LOCATION on Android (or an NSLocationAlwaysAndWhenInUseUsageDescription
    key with a requestAlwaysAuthorization() call on iOS) AND INTERNET, while its store/corporate category
    (e.g., Productivity, Finance) is NOT in the approved location-using list (Navigation, Weather, Fitness,
    Ride-share). A ''Finance'' app that insists on always-on background location plus network access is
    exactly the implausible pairing geofenced malware needs to evaluate region and call home. Keep this
    rule as a hard deterministic floor beneath the statistical and ML detectors. A positive result indicates
    an application is conditioning its behavior on device location -- the hallmark of geofencing used
    to evade detection and sandbox analysis -- while a negative result lowers but does not eliminate suspicion,
    so corroborate with the other questions in this playbook (location capability acquisition -> repeated
    location/region evaluation -> location-gated behavior change -> network egress or payload activation).'
  answer_sources:
  - MDM app inventory report
  - Static analysis tool output
  - Corporate application policy
  - Application store metadata
  - 'NAI: Mobile Device Management (MDM) Platform, Application Vetting Sandbox, Corporate App Store Repository,
    Managed Mobile Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=mdm source=\"MDM app inventory report\"\n| eval bg_loc=if((\"ACCESS_FINE_LOCATION\"\
      \ in perms AND \"ACCESS_BACKGROUND_LOCATION\" in perms)\n    OR (ios_key=\"NSLocationAlwaysAndWhenInUseUsageDescription\"\
      \ AND calls_requestAlways=true),1,0)\n| where bg_loc=1 AND \"INTERNET\" in perms\n| lookup ApprovedLocationCategories\
      \ category OUTPUT approved\n| where isnull(approved)   /* category not in Navigation/Weather/Fitness/Ride-share\
      \ */\n| eval severity=\"high\"\n| table device_id, package_name, category, perms"
- question: '[Defense Evasion] Prove location-to-decision/egress flow via static taint analysis: Have
    you used static (and, where obfuscated, dynamic) taint analysis to prove that a device location source
    actually flows into a control-flow decision, network send, or persisted preference inside a suspect
    app?'
  context: 'Tactic relevance (Defense Evasion): Is the adversary using geofencing to evade detection or
    analysis on our mobile devices? (PIR) This question operationalizes a Symbolic Logic detection for
    MITRE ATT&CK T1627.001 (Geofencing) on Android/iOS. Run lifecycle-aware static taint analysis ([FlowDroid](https://www.bodden.de/pubs/far+14flowdroid.pdf),
    validated against [DroidBench](https://github.com/secure-software-engineering/DroidBench)) treating
    location APIs as taint sources (getLastKnownLocation, Location.getLatitude/getLongitude, FusedLocationProviderClient,
    CLLocationManager) and treating network-send, conditional branches, and SharedPreferences writes as
    sinks. Alert when a location source reaches any sink, which demonstrates the app is making decisions
    or exfiltrating based on location rather than merely holding the permission. When reflection or obfuscation
    defeats static analysis, confirm with runtime taint tracking ([TaintDroid](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf)).
    A positive result indicates an application is conditioning its behavior on device location -- the
    hallmark of geofencing used to evade detection and sandbox analysis -- while a negative result lowers
    but does not eliminate suspicion, so corroborate with the other questions in this playbook (location
    capability acquisition -> repeated location/region evaluation -> location-gated behavior change ->
    network egress or payload activation).'
  answer_sources:
  - MDM app inventory report
  - Static analysis tool output
  - Corporate application policy
  - Application store metadata
  - 'NAI: Mobile Device Management (MDM) Platform, Application Vetting Sandbox, Corporate App Store Repository,
    Managed Mobile Endpoints'
  range: Last 90 days
  queries:
  - technology: Static-analysis/pseudocode
    query: "sources = {getLastKnownLocation, getLatitude, getLongitude,\n           FusedLocationProviderClient,\
      \ CLLocationManager}\nsinks   = {network_send, conditional_branch, SharedPreferences.write}\nflows\
      \ = FlowDroid.taint(app, sources, sinks)   # validate engine on DroidBench\nif flows.any():\n  \
      \  raise_alert(app, paths=flows.top(3))\nif app.is_obfuscated or app.uses_reflection:\n    flows\
      \ += TaintDroid.runtime_trace(app, sources, sinks)"
- question: '[Defense Evasion] Detect location-gated trigger predicates (geofence logic bomb): Have you
    applied trigger/predicate analysis to find narrow location-comparison checks that guard a path to
    a sensitive API -- i.e., a geofence logic bomb -- even when the permission set looks legitimate?'
  context: 'Tactic relevance (Defense Evasion): Is the adversary using geofencing to evade detection or
    analysis on our mobile devices? (PIR) This question operationalizes a Symbolic Logic detection for
    MITRE ATT&CK T1627.001 (Geofencing) on Android/iOS. Apply trigger analysis ([TriggerScope](https://sites.cs.ucsb.edu/~chris/research/doc/oakland16_triggerscope.pdf))
    using symbolic execution and path-predicate minimization to flag narrow checks that compare a location-derived
    value against hard-coded constants (latitude/longitude bounds, geofence radius, GeofencingClient.addGeofences,
    CLCircularRegion) AND guard a path to a sensitive API. This catches the core geofencing evasion behavior
    -- behavior that only fires inside a specific region -- even for an app whose declared permissions
    appear plausible, which is the case the prevalence and permission rules miss. A positive result indicates
    an application is conditioning its behavior on device location -- the hallmark of geofencing used
    to evade detection and sandbox analysis -- while a negative result lowers but does not eliminate suspicion,
    so corroborate with the other questions in this playbook (location capability acquisition -> repeated
    location/region evaluation -> location-gated behavior change -> network egress or payload activation).'
  answer_sources:
  - MDM app inventory report
  - Static analysis tool output
  - Corporate application policy
  - Application store metadata
  - 'NAI: Mobile Device Management (MDM) Platform, Application Vetting Sandbox, Corporate App Store Repository,
    Managed Mobile Endpoints'
  range: Last 90 days
  queries:
  - technology: Static-analysis/pseudocode
    query: "for branch in TriggerScope.symbolic_execute(app):\n    pred = branch.predicate\n    if pred.compares(location_value,\
      \ hardcoded_constant) \\\n       or pred.uses({addGeofences, CLCircularRegion, geofence_radius}):\n\
      \        if branch.guards_path_to(sensitive_api):\n            raise_alert(app, predicate=pred,\
      \ guarded_api=branch.target)"
- question: '[Defense Evasion] Detect rare persistent-location requests by category (prevalence baseline):
    Have you computed how rare an app''s background/always-location request is within its own category
    across the fleet and app store, flagging statistical outliers?'
  context: 'Tactic relevance (Defense Evasion): Is the adversary using geofencing to evade detection or
    analysis on our mobile devices? (PIR) This question operationalizes a Statistical Method detection
    for MITRE ATT&CK T1627.001 (Geofencing) on Android/iOS. Compute per-category prevalence of background/always
    location requests across the managed fleet and app store using static-feature distributions in the
    spirit of [DREBIN](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf). Flag apps
    in categories where such a request is below the 5th percentile of prevalence (derive the percentile
    cutoff per-fleet and re-validate quarterly). Also track a distinct State feature: the ratio of granted
    vs. denied/downgraded-to-''while-in-use'' location requests per app, since geofenced malware often
    aggressively re-requests after denial. A statistically anomalous persistent-location request for the
    category is a strong, baseline-driven indicator that complements the deterministic rules. A positive
    result indicates an application is conditioning its behavior on device location -- the hallmark of
    geofencing used to evade detection and sandbox analysis -- while a negative result lowers but does
    not eliminate suspicion, so corroborate with the other questions in this playbook (location capability
    acquisition -> repeated location/region evaluation -> location-gated behavior change -> network egress
    or payload activation).'
  answer_sources:
  - MDM app inventory report
  - Static analysis tool output
  - Corporate application policy
  - Application store metadata
  - 'NAI: Mobile Device Management (MDM) Platform, Application Vetting Sandbox, Corporate App Store Repository,
    Managed Mobile Endpoints'
  range: Last 90 days (use >=90 days of fleet/app-store history to establish per-category baselines)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=mdm source="MDM app inventory report" requests_persistent_location=true

      | stats dc(app_id) as apps_with by category

      | appendcols [ stats dc(app_id) as total by category ]

      | eval prevalence = apps_with/total

      | eventstats perc5(prevalence) as p5 by category

      | where prevalence < p5

      | eval grant_ratio = granted_loc_requests/(denied_loc_requests+downgraded_loc_requests+1)

      | table app_id, category, prevalence, grant_ratio'
- question: '[Defense Evasion] Derive and re-validate thresholds with time-aware evaluation: Have you
    set and periodically re-derived your static-vetting thresholds (probability cutoff, prevalence percentile)
    using time-ordered, realistically imbalanced evaluation, and are you tracking per-category error rates?'
  context: 'Tactic relevance (Defense Evasion): Is the adversary using geofencing to evade detection or
    analysis on our mobile devices? (PIR) This question operationalizes a Statistical Method detection
    for MITRE ATT&CK T1627.001 (Geofencing) on Android/iOS. Set and periodically re-derive all static-vetting
    thresholds (the ML probability cutoff and the prevalence percentile) using time-ordered, realistically
    imbalanced (~10% malicious) evaluation ([TESSERACT](https://arxiv.org/pdf/1807.07838), [code](https://github.com/s2labres/tesseract-ml-release))
    so that performance reflects real deployment rather than a randomly shuffled test set. Explicitly
    report and monitor false-positive and false-negative rates per app category as a profiled failure
    mode rather than a single accuracy number. This question is about defensibility: it ensures the geofencing
    detectors are not silently degrading as apps and malware evolve over time. A positive result indicates
    an application is conditioning its behavior on device location -- the hallmark of geofencing used
    to evade detection and sandbox analysis -- while a negative result lowers but does not eliminate suspicion,
    so corroborate with the other questions in this playbook (location capability acquisition -> repeated
    location/region evaluation -> location-gated behavior change -> network egress or payload activation).'
  answer_sources:
  - MDM app inventory report
  - Static analysis tool output
  - Corporate application policy
  - Application store metadata
  - 'NAI: Mobile Device Management (MDM) Platform, Application Vetting Sandbox, Corporate App Store Repository,
    Managed Mobile Endpoints'
  range: Last 90 days (rolling, with time-ordered splits over >=6 months of history)
  queries:
  - technology: ML/Stats pseudocode
    query: "splits = time_ordered_splits(samples, malicious_ratio=0.10)  # TESSERACT\nfor cutoff in candidate_cutoffs:\n\
      \    fp, fn = evaluate(model, splits, cutoff, group_by='category')\nbest = argmin_over(cutoff, cost(fp,\
      \ fn))\npublish_thresholds(best); per_category_report(fp_rate, fn_rate)\nalert_if(drift: current_fp_rate\
      \ > baseline_fp_rate * 1.5)"
- question: '[Defense Evasion] Classify geofencing-capable apps from static features with explanations:
    Have you scored apps with an explainable classifier over static features (permissions, geofencing
    API calls, components, URLs) and surfaced the top contributing features for any high-probability geofencing-malware
    verdict?'
  context: 'Tactic relevance (Defense Evasion): Is the adversary using geofencing to evade detection or
    analysis on our mobile devices? (PIR) This question operationalizes a Machine Learning detection for
    MITRE ATT&CK T1627.001 (Geofencing) on Android/iOS. Train an explainable linear SVM ([DREBIN](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf),
    [dataset](https://www.sec.tu-bs.de/~danarp/drebin/)) on permissions, geofencing API calls (GeofencingClient,
    CLLocationManager, CLCircularRegion), declared components, and embedded URLs. Alert when malicious
    probability exceeds 0.85 AND surface the top-3 contributing features in the alert text (e.g., ACCESS_BACKGROUND_LOCATION,
    addGeofences, a hard-coded C2 URL) so an analyst can triage quickly. Run behavior-based Markov-chain
    models ([MaMaDroid](https://arxiv.org/pdf/1612.04433)) in parallel for resilience to feature drift.
    This gives broad, learned coverage of geofencing-capable apps beyond the deterministic rules. A positive
    result indicates an application is conditioning its behavior on device location -- the hallmark of
    geofencing used to evade detection and sandbox analysis -- while a negative result lowers but does
    not eliminate suspicion, so corroborate with the other questions in this playbook (location capability
    acquisition -> repeated location/region evaluation -> location-gated behavior change -> network egress
    or payload activation).'
  answer_sources:
  - MDM app inventory report
  - Static analysis tool output
  - Corporate application policy
  - Application store metadata
  - 'NAI: Mobile Device Management (MDM) Platform, Application Vetting Sandbox, Corporate App Store Repository,
    Managed Mobile Endpoints'
  range: Last 90 days (retrain on >=6 months of labeled history)
  queries:
  - technology: ML/pseudocode
    query: "features = [permissions, geofence_api_calls(GeofencingClient, CLLocationManager,\n       \
      \     CLCircularRegion), declared_components, embedded_urls]\np = LinearSVM.predict_proba(features)[malicious]\n\
      if p > 0.85:\n    raise_alert(prob=p, top3=feature_attribution(features)[:3])\ndrift_score = MaMaDroid.markov_anomaly(api_sequences)\
      \  # parallel detector"
- question: '[Defense Evasion] Quarantine drifting/low-confidence app verdicts: Have you wrapped the classifier
    with conformal-prediction rejection so that low-credibility or drifting app verdicts are routed to
    manual analysis instead of being auto-allowed?'
  context: 'Tactic relevance (Defense Evasion): Is the adversary using geofencing to evade detection or
    analysis on our mobile devices? (PIR) This question operationalizes a Machine Learning detection for
    MITRE ATT&CK T1627.001 (Geofencing) on Android/iOS. Apply conformal-prediction rejection ([TRANSCENDENT](https://arxiv.org/pdf/2010.03856),
    [code](https://github.com/s2labres/transcendent-release)) on top of the classifier. When a sample''s
    credibility/p-value falls below the calibrated threshold, route the app to manual analysis rather
    than auto-allowing it. This converts model uncertainty -- often caused by a novel geofencing technique
    the classifier has not seen -- into an explicit failure-mode signal, preventing evasive apps from
    slipping through on a low-confidence ''benign'' verdict. A positive result indicates an application
    is conditioning its behavior on device location -- the hallmark of geofencing used to evade detection
    and sandbox analysis -- while a negative result lowers but does not eliminate suspicion, so corroborate
    with the other questions in this playbook (location capability acquisition -> repeated location/region
    evaluation -> location-gated behavior change -> network egress or payload activation).'
  answer_sources:
  - MDM app inventory report
  - Static analysis tool output
  - Corporate application policy
  - Application store metadata
  - 'NAI: Mobile Device Management (MDM) Platform, Application Vetting Sandbox, Corporate App Store Repository,
    Managed Mobile Endpoints'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "cred, p_value = Transcendent.conformal_eval(model, sample)\nif cred < calibrated_credibility_threshold\
      \ or p_value < calibrated_p:\n    route_to_manual_analysis(sample, reason='low_credibility')\nelse:\n\
      \    apply_verdict(model.predict(sample))"
- question: '[Defense Evasion] Force the geofence trigger with targeted location injection: Have you driven
    the sandbox with targeted location injection -- computing the coordinates/device state needed to satisfy
    guarded location-dependent APIs -- rather than relying on random GPS fuzzing?'
  context: 'Tactic relevance (Defense Evasion): Is the adversary using geofencing to evade detection or
    analysis on our mobile devices? (PIR) This question operationalizes a Symbolic Logic detection for
    MITRE ATT&CK T1627.001 (Geofencing) on Android/iOS. Instead of random GPS fuzzing, compute the path
    constraints needed to reach guarded location-dependent APIs and inject exactly those spoofed coordinates
    and device state ([IntelliDroid](https://www.ndss-symposium.org/wp-content/uploads/2017/09/intellidroid-targeted-input-generator-dynamic-analysis-android-malware.pdf),
    [code](https://github.com/miwong/IntelliDroid)). Record whether sensitive behavior activates only
    inside the satisfying region. This directly defeats the evasion premise of geofencing -- malware that
    hides outside its target area -- by deterministically placing the analysis device inside the qualifying
    region and observing whether dormant behavior wakes up. A positive result indicates an application
    is conditioning its behavior on device location -- the hallmark of geofencing used to evade detection
    and sandbox analysis -- while a negative result lowers but does not eliminate suspicion, so corroborate
    with the other questions in this playbook (location capability acquisition -> repeated location/region
    evaluation -> location-gated behavior change -> network egress or payload activation).'
  answer_sources:
  - Mobile application vetting sandbox logs
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Application Vetting Sandbox, Network Egress Points (VPN, Corporate Wi-Fi), DNS Resolvers, Web
    Proxy Servers'
  range: Per-sample sandbox detonation (observe at least 10 minutes pre- and post-injection)
  queries:
  - technology: Dynamic-analysis/pseudocode
    query: "constraints = IntelliDroid.path_constraints_to(location_guarded_apis)\ncoords = solve(constraints)\
      \            # satisfying lat/long + device state\nbaseline = observe(app, minutes=10)\ninject_gps(coords);\
      \ state = observe(app, minutes=10)\nif state.activates(sensitive_behavior) and not baseline.active:\n\
      \    raise_alert(app, region=coords, apis=triggered_apis)"
- question: '[Defense Evasion] Detect beacon onset/cessation after simulated GPS change: Have you baselined
    periodic egress in the sandbox and confirmed that beaconing begins only after entering the target
    region (or ceases after leaving it) following a simulated GPS change?'
  context: 'Tactic relevance (Defense Evasion): Is the adversary using geofencing to evade detection or
    analysis on our mobile devices? (PIR) This question operationalizes a Symbolic Logic detection for
    MITRE ATT&CK T1627.001 (Geofencing) on Android/iOS. Build a 10-minute baseline of periodic egress
    in Zeek conn.log using Fourier periodicity scoring ([RITA](https://github.com/activecm/rita)), then
    simulate GPS changes between permitted and restricted regions. Alert when beaconing starts only after
    entering the target region OR ceases for at least 5 minutes after leaving it (a combined Frequency
    + State change). These concrete timing/count thresholds are kept as a deterministic floor. Location-correlated
    onset or cessation of beaconing is among the clearest network-side signatures of geofenced command-and-control.
    A positive result indicates an application is conditioning its behavior on device location -- the
    hallmark of geofencing used to evade detection and sandbox analysis -- while a negative result lowers
    but does not eliminate suspicion, so corroborate with the other questions in this playbook (location
    capability acquisition -> repeated location/region evaluation -> location-gated behavior change ->
    network egress or payload activation).'
  answer_sources:
  - Mobile application vetting sandbox logs
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Application Vetting Sandbox, Network Egress Points (VPN, Corporate Wi-Fi), DNS Resolvers, Web
    Proxy Servers'
  range: Per-sample sandbox detonation (10-minute baseline plus >=5-minute post-change windows)
  queries:
  - technology: Zeek/pseudocode
    query: "baseline = RITA.periodicity(conn.log, window=10m)  # dominant beacon period\ninject_gps(target_region)\n\
      after = RITA.periodicity(conn.log, window=10m)\nif not baseline.beaconing and after.beaconing:\n\
      \    raise_alert('beacon_onset_after_region_entry')\ninject_gps(restricted_region)\nif observe(conn.log).no_beacon_for(minutes=5):\n\
      \    raise_alert('beacon_cessation_after_region_exit')"
- question: '[Defense Evasion] Detect per-app HTTP egress fingerprint shift: Have you baselined each app''s
    outbound HTTP fingerprint and alerted on an abrupt deviation (new Host headers, User-Agent, request
    structure, first-seen destinations) coincident with the location change?'
  context: 'Tactic relevance (Defense Evasion): Is the adversary using geofencing to evade detection or
    analysis on our mobile devices? (PIR) This question operationalizes a Symbolic Logic detection for
    MITRE ATT&CK T1627.001 (Geofencing) on Android/iOS. Baseline each app''s outbound HTTP behavior and
    alert on abrupt deviation from that fingerprint coincident with the location change ([DECANTeR](https://doi.org/10.1145/3134600.3134605))
    -- new Host headers, a changed User-Agent, altered request structure, or first-seen destinations.
    A geofenced second stage frequently changes who it talks to and how once it believes it is in the
    target region, so a fingerprint break aligned in time with the simulated GPS transition is a high-confidence
    behavioral indicator. A positive result indicates an application is conditioning its behavior on device
    location -- the hallmark of geofencing used to evade detection and sandbox analysis -- while a negative
    result lowers but does not eliminate suspicion, so corroborate with the other questions in this playbook
    (location capability acquisition -> repeated location/region evaluation -> location-gated behavior
    change -> network egress or payload activation).'
  answer_sources:
  - Mobile application vetting sandbox logs
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Application Vetting Sandbox, Network Egress Points (VPN, Corporate Wi-Fi), DNS Resolvers, Web
    Proxy Servers'
  range: Per-sample sandbox detonation (baseline pre-change vs. post-change HTTP)
  queries:
  - technology: Zeek/pseudocode
    query: "fp_before = DECANTeR.fingerprint(http.log, phase='pre_gps_change')\ninject_gps(target_region)\n\
      fp_after  = DECANTeR.fingerprint(http.log, phase='post_gps_change')\ndelta = fp_after.diff(fp_before)\
      \  # new Host, User-Agent, structure, dest\nif delta.is_abrupt():\n    raise_alert(app, changed=delta.fields,\
      \ new_dests=delta.first_seen)"
- question: '[Defense Evasion] Measure post-change shifts in volume, frequency, and DNS randomness: Have
    you quantified before/after the GPS change the shifts in egress volume, connection/DNS frequency,
    and DNS-domain randomness (via KL divergence) within tight time windows?'
  context: 'Tactic relevance (Defense Evasion): Is the adversary using geofencing to evade detection or
    analysis on our mobile devices? (PIR) This question operationalizes a Statistical Method detection
    for MITRE ATT&CK T1627.001 (Geofencing) on Android/iOS. In 60-second windows compare before vs. after
    the GPS change: (Volume) 90th-percentile and total orig_bytes in conn.log, alerting on a >75% drop
    or >300% rise; (Frequency) connections/min and DNS queries/min; and (State) DNS-domain randomness
    measured as KL divergence against an English/known-good distribution rather than raw Shannon entropy
    ([Using Entropy in Threat Hunting](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/)),
    alerting on entropy shifts beyond 1.5 standard deviations. Derive the sigma baselines per app/sandbox.
    A sudden, sustained statistical shift in any of these dimensions timed to the location change is the
    quantitative signature the evidence describes (e.g., >80% egress reduction when entering a ''restricted''
    region). A positive result indicates an application is conditioning its behavior on device location
    -- the hallmark of geofencing used to evade detection and sandbox analysis -- while a negative result
    lowers but does not eliminate suspicion, so corroborate with the other questions in this playbook
    (location capability acquisition -> repeated location/region evaluation -> location-gated behavior
    change -> network egress or payload activation).'
  answer_sources:
  - Mobile application vetting sandbox logs
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Application Vetting Sandbox, Network Egress Points (VPN, Corporate Wi-Fi), DNS Resolvers, Web
    Proxy Servers'
  range: Per-sample sandbox detonation (60-second windows around the GPS change)
  queries:
  - technology: Zeek/Stats pseudocode
    query: "for w in windows(span=60s, around=gps_change):\n    vol  = sum(conn.orig_bytes); p90 = perc90(conn.orig_bytes)\n\
      \    freq = conns_per_min; dns_freq = dns_queries_per_min\n    rnd  = KL_divergence(dns.query_chars,\
      \ english_dist)\nd_vol = (after.vol-before.vol)/before.vol\nif d_vol < -0.75 or d_vol > 3.0:   \
      \     raise_alert('volume_shift')\nif abs(after.rnd-before.rnd) > 1.5*sigma: raise_alert('dns_randomness_shift')"
- question: '[Defense Evasion] Profile failure/error-rate signals across the location transition: Have
    you measured error/failure rates (NXDOMAIN, HTTP 4xx/5xx, S0/REJ connections) before and after the
    GPS change to catch a transition between dormant probing and clean successful sessions?'
  context: 'Tactic relevance (Defense Evasion): Is the adversary using geofencing to evade detection or
    analysis on our mobile devices? (PIR) This question operationalizes a Statistical Method detection
