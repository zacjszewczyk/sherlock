name: 'T1628.002: User Evasion'
id: bd4013bb-ae65-466a-98ee-fce34517ba1e
description: 'Investigate whether an adversary is hiding malicious behavior from the user of a corporate-managed
  mobile device (Android) by gating activity to periods of inferred user absence (User Evasion, T1628.002).
  Malware can read motion sensors (accelerometer, gyroscope), the proximity sensor, and device-activity/screen-state
  APIs without any user-facing permission prompt, then use that no-permission user-presence signal to
  suppress C2 beaconing, data exfiltration, and other sensitive framework activity while the device is
  being handled and resume it only when the device is at rest, screen-off, or idle. This playbook helps
  an analyst correlate MTD/EDR sensor-access and application-state telemetry with MDM application-category
  allowlists and Zeek network flow logs to find the documented probe-then-suppress pattern: non-allowlisted
  apps touching motion or proximity sensors, periodic low-entropy beaconing that ceases the instant motion
  begins, covered-state data transfer spikes, idle-window connection-failure bursts, negative motion-to-traffic
  correlation, and background sensitive activity that fires only during user-absent windows. It spans
  symbolic-logic rules, statistical baselining, and machine-learning models (motion-state prediction,
  sensor/network contradiction detection, context-aware sensor anomaly modeling, and OS-API/app-state
  sequence anomaly detection) so the analyst can determine whether an application is deliberately evading
  user detection to persist longer on the device.'
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did a non-allowlisted application begin reading the motion sensors (accelerometer or gyroscope)
    immediately after a window of regular, low-byte, low-entropy C2-style beaconing, and then cut its
    outbound connections by more than 95% for at least five minutes once device motion began?
  context: 'This is the canonical User Evasion primitive: motion-sensor reads require no permission, and
    constant-versus-varying readings let an app tell an at-rest device from a handled one, so malware
    probes for user presence and suppresses beaconing the moment the user picks up the device ([Vidas
    & Christin](https://users.ece.cmu.edu/~tvidas/papers/ASIACCS14.pdf)). MTD/MDM telemetry and app-category
    allowlists make this a first-party rule ([NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf)).
    Tie MTD sensor-access events to Zeek conn/dns flows: first confirm periodic beaconing (low bytes,
    regular inter-arrival, low destination entropy) in the preceding ~10 minutes, then a non-allowlisted
    app''s motion-sensor access, then a >95% drop in connection count for >=5 minutes. A match strongly
    indicates behavior gated to user-absent periods to evade detection (Defense Evasion); a non-match
    where beaconing continues through motion argues against this specific evasion mechanic. Tune the suppression
    percentage and idle minutes per fleet but keep the threshold.'
  answer_sources:
  - MTD sensor access logs
  - MDM application inventory logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoints: Corporate-managed mobile devices with MTD/MDM agents. Network: Network taps at corporate
    Wi-Fi access points, VPN egress points, and internet gateways where Zeek sensors are deployed. Infrastructure:
    MDM servers and DNS servers. Analytics Platform: SIEM or data lake where MTD, MDM, and Zeek logs are
    aggregated for correlation.'
  range: Last 90 days; correlate within a 15-minute event-centered window around each motion-access event
  queries:
  - technology: SIEM/Rule pseudocode
    query: "motion = mtd_sensor_access(sensor in [accel,gyro]) where app not in motion_allowlist;\nbeacon\
      \ = zeek_conn where app==motion.app and t in [motion.t-10m, motion.t]\n         and low_bytes and\
      \ regular_iat and low_dst_entropy;\npost = count(conn where app==motion.app and t in [motion.t,\
      \ motion.t+5m]);\nprior = count(conn where app==motion.app and t in [motion.t-5m, motion.t]);\n\
      alert when beacon present and post <= 0.05*prior"
- question: During motion/idle windows, is a given application generating bursts of DNS NXDOMAIN, connection-refused/reset,
    or HTTP 404 failures that exceed three times its active-window baseline, indicating C2 reachability
    attempts deliberately timed to user-absent periods?
  context: Independently of suppression, an evasive app that gates C2 to idle periods will show its connection-failure
    activity concentrated in those windows. Profile per-app DNS NXDOMAIN, TCP refused/reset, and 404 counts
    during motion/idle versus active windows and alert when idle-window failure bursts exceed 3x the active-window
    baseline. Flow-state success/fail features are discriminative for evasive mobile traffic ([CorrNetDroid](https://arxiv.org/abs/2503.01396))
    with ground-truth flow labels in [CICAndMal2017](https://www.unb.ca/cic/datasets/andmal2017.html).
    A positive result means the app is reaching for infrastructure when it thinks the user is away — a
    Defense Evasion tell; a flat ratio suggests normal, user-correlated traffic.
  answer_sources:
  - MTD sensor access logs
  - MDM application inventory logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoints: Corporate-managed mobile devices with MTD/MDM agents. Network: Network taps at corporate
    Wi-Fi access points, VPN egress points, and internet gateways where Zeek sensors are deployed. Infrastructure:
    MDM servers and DNS servers. Analytics Platform: SIEM or data lake where MTD, MDM, and Zeek logs are
    aggregated for correlation.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'fail = nxdomain + conn_refused + conn_reset + http_404;

      idle_rate = sum(fail) over motion/idle windows per app;

      active_rate = sum(fail) over active windows per app;

      alert when idle_rate > 3 * active_rate'
- question: Over a rolling 24-hour window, is an app's per-minute connection count strongly negatively
    correlated with device motion state (Pearson r < -0.8) while its at-rest traffic shows low destination
    entropy?
  context: If an application talks to the network mainly when the device is at rest and goes quiet when
    handled, motion state and traffic volume become inversely correlated. Compute a rolling 24-hour Pearson
    correlation between motion state and per-minute connection counts and alert when r < -0.8 with low
    destination entropy at rest. Derive the threshold from each device's own history (baseline-deviation
    paradigm, [Andromaly](https://link.springer.com/article/10.1007/s10844-010-0148-x)) using Volume (bytes/min),
    Frequency (conns/min), and State (fail rate) features from flow logs ([CorrNetDroid](https://arxiv.org/abs/2503.01396);
    [CICAndMal2017](https://www.unb.ca/cic/datasets/andmal2017.html)). Strong negative correlation is
    direct evidence of activity gated to user absence (Defense Evasion); near-zero or positive correlation
    is benign user-driven traffic.
  answer_sources:
  - MTD sensor access logs
  - MDM application inventory logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoints: Corporate-managed mobile devices with MTD/MDM agents. Network: Network taps at corporate
    Wi-Fi access points, VPN egress points, and internet gateways where Zeek sensors are deployed. Infrastructure:
    MDM servers and DNS servers. Analytics Platform: SIEM or data lake where MTD, MDM, and Zeek logs are
    aggregated for correlation.'
  range: Last 90 days; compute on rolling 24-hour windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'series_motion = motion_state per minute; series_conn = conn_count per minute;

      r = pearson(series_motion, series_conn) over rolling 24h per device/app;

      alert when r < -0.8 and at_rest_dst_entropy < device_threshold'
- question: Can a classifier predict 'at-rest' motion state from an app's network features (connection_rate,
    byte_rate, byte ratios, inter-arrival-time statistics, protocol mix) with high confidence at the very
    moments MTD telemetry reports the device is actually in motion — i.e. the app's traffic looks idle-gated
    even though the user is present?
  context: Train a model to predict motion (moving/at-rest) purely from network behavior and flag apps
    whose traffic predicts 'at-rest' with >85% accuracy while MTD independently reports motion. The contradiction
    means the app's network activity is shaped to user-absence windows. Because labeled malicious idle
    behavior is scarce, use a one-class model trained only on benign idle-state behavior ([IoT One-Class](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/))
    and emit the top-3 contributing features per alert via LIME ([OC-SVM + LIME](https://www.nature.com/articles/s41598-025-20445-4))
    for triage. Flow-only Volume/Frequency/State metrics discriminate evasive mobile spyware ([CorrNetDroid](https://arxiv.org/abs/2503.01396)).
    A confident contradiction is a high-value Defense Evasion lead; agreement between predicted and reported
    state is benign.
  answer_sources:
  - MTD sensor access logs
  - MDM application inventory logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoints: Corporate-managed mobile devices with MTD/MDM agents. Network: Network taps at corporate
    Wi-Fi access points, VPN egress points, and internet gateways where Zeek sensors are deployed. Infrastructure:
    MDM servers and DNS servers. Analytics Platform: SIEM or data lake where MTD, MDM, and Zeek logs are
    aggregated for correlation.'
  range: Last 90 days for training; score in near-real-time
  queries:
  - technology: ML/pseudocode
    query: 'model = OneClass.fit(benign_idle[conn_rate,byte_rate,byte_ratio,iat_stats,proto_mix]);

      pred = model.predict(window.features);

      alert when pred==''at_rest'' with conf>0.85 and mtd_motion(window)==''moving'';

      explain = LIME.top3(window.features)'
- question: Did a non-allowlisted application access the proximity sensor and then, while the sensor reported
    'covered' for over 60 seconds, push outbound data exceeding 5x its 30-day baseline — with that traffic
    stopping within 10 seconds of the sensor returning to 'uncovered'?
  context: The proximity sensor 'covered' state (phone in pocket, face-down, or in a bag) is a no-permission
    proxy for the device being put away, which an evasive app abuses to time exfiltration to inferred
    user-absent periods ([Vidas & Christin](https://users.ece.cmu.edu/~tvidas/papers/ASIACCS14.pdf); MTD/MDM
    observability per [NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf)).
    Trigger when a non-allowlisted app accesses proximity, outbound volume exceeds 5x its 30-day baseline
    during 'covered', and escalate if traffic ceases within 10 seconds of 'uncovered'. The tight coupling
    of a data spike to the covered window and its abrupt halt on uncover is the signature; keep the 5x
    and 10-second floors and tune per fleet. A match indicates Defense Evasion via user-presence gating;
    uncorrelated traffic does not.
  answer_sources:
  - MTD sensor access logs
  - MDM application inventory logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoints: Corporate-managed mobile devices with MTD/MDM agents. Network: Network taps at corporate
    Wi-Fi access points, VPN egress points, and internet gateways where Zeek sensors are deployed. Infrastructure:
    MDM servers and DNS servers. Analytics Platform: SIEM or data lake where MTD, MDM, and Zeek logs are
    aggregated for correlation.'
  range: Last 90 days; correlate within a 2-minute window around each proximity state change
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'prox = mtd_sensor(proximity==''covered'' for >60s) where app not in comm_allowlist;

      vol = bytes_out(app, prox.window); base = baseline_30d(app);

      alert when vol > 5*base;

      escalate when bytes_out(app, prox.uncovered_t + 10s) ~ 0'
- question: Are an app's per-minute bytes and connection-rate during proximity-'covered' states statistical
    outliers (Z-score > 3 for two consecutive intervals) relative to its 'uncovered'-state baseline, and
    do covered-state connection-failure rates spike too?
  context: Baseline bytes/min and connection-rate during 'uncovered' (in-use) states and alert when 'covered'-state
    Z-scores exceed 3 for two consecutive intervals; additionally track covered-state NXDOMAIN/refused
    rates as a distinct signal. Per-app/per-device baselining follows [Andromaly](https://link.springer.com/article/10.1007/s10844-010-0148-x);
    flow Volume/State features per [CorrNetDroid](https://arxiv.org/abs/2503.01396) and [CICAndMal2017](https://www.unb.ca/cic/datasets/andmal2017.html).
    Sustained covered-state outliers mean the app does its heavy network work specifically when the user
    has put the device away — a Defense Evasion indicator. Normal apps show comparable or higher activity
    while in use.
  answer_sources:
  - MTD sensor access logs
  - MDM application inventory logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoints: Corporate-managed mobile devices with MTD/MDM agents. Network: Network taps at corporate
    Wi-Fi access points, VPN egress points, and internet gateways where Zeek sensors are deployed. Infrastructure:
    MDM servers and DNS servers. Analytics Platform: SIEM or data lake where MTD, MDM, and Zeek logs are
    aggregated for correlation.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = mean,std(bytes_per_min, conn_rate during uncovered) per app/device;

      z = zscore(covered_interval, base);

      alert when z>3 for 2 consecutive intervals;

      also track covered nxdomain/refused rate as separate signal'
- question: Does a model that predicts proximity covered/uncovered state from network features disagree
    with what MTD actually reports — for example predicting 'covered' with >0.9 confidence while MTD reports
    'uncovered', or predicting 'uncovered' while a data spike occurs during a reported 'covered' state?
  context: Train a logistic-regression or one-class model to infer covered/uncovered from network features
    and alert on contradictions with MTD's reported state. Contradiction between inferred and reported
    sensor/interaction context is the canonical user-evasion signal ([6thSense](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-sikder.pdf)).
    Surface the top-3 contributing features per alert ([OC-SVM + LIME](https://www.nature.com/articles/s41598-025-20445-4))
    so analysts can validate quickly. A confident model-versus-sensor disagreement implies the app is
    shaping behavior to a user-presence assumption that doesn't match reality — Defense Evasion; agreement
    is benign.
  answer_sources:
  - MTD sensor access logs
  - MDM application inventory logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoints: Corporate-managed mobile devices with MTD/MDM agents. Network: Network taps at corporate
    Wi-Fi access points, VPN egress points, and internet gateways where Zeek sensors are deployed. Infrastructure:
    MDM servers and DNS servers. Analytics Platform: SIEM or data lake where MTD, MDM, and Zeek logs are
    aggregated for correlation.'
  range: Last 90 days for training; score in near-real-time
  queries:
  - technology: ML/pseudocode
    query: "model = logreg_or_oneclass.fit(network_features -> covered/uncovered);\npred = model.predict_proba(window);\n\
      alert when (pred_covered>0.9 and mtd=='uncovered')\n      or (pred_uncovered and mtd=='covered'\
      \ and data_spike);\nexplain = LIME.top3(window.features)"
- question: Did a non-allowlisted app query motion sensors or device-activity/screen-state APIs while
    the screen was off or the device had been idle for more than N minutes (default 5), then within T
    seconds (default 30) start background sensitive-API use or network connections, and suppress that
    activity again on user return?
  context: 'This is the sensor-gated execution chain seen directly in on-device telemetry: query user-presence
    -> infer absence -> resume background sensitive/network work -> suppress on return ([Vidas & Christin](https://users.ece.cmu.edu/~tvidas/papers/ASIACCS14.pdf)).
    Alert when a non-allowlisted app reads motion sensors or screen-state/idle APIs during screen-off/idle
    and promptly begins background activity, observable via MobileEDR OS-API execution and Application
    State logs ([NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf)).
    Tune N and T per fleet but preserve the deterministic floor. A full chain is a strong Defense Evasion
    detection; background activity that also runs during active use is less suspicious.'
  answer_sources:
  - MobileEDR OS API execution logs
  - MobileEDR application-state logs
  - MDM application inventory logs
  - Zeek conn.log
  - 'NAI: Endpoints: Corporate-managed mobile devices with MTD/MDM agents. Network: Network taps at corporate
    Wi-Fi access points, VPN egress points, and internet gateways where Zeek sensors are deployed. Infrastructure:
    MDM servers and DNS servers. Analytics Platform: SIEM or data lake where MTD, MDM, and Zeek logs are
    aggregated for correlation.'
  range: Last 90 days; correlate sensor-query to background-activity within a T-second (default 30s) window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "q = osapi(app reads motion_sensor or screen_state/idle_api)\n    where app not in allowlist\
      \ and (screen_off or idle>N_min(5));\nbg = appstate(app -> background) and (osapi_sensitive or zeek_conn)\n\
      \     within T_sec(30) of q;\nsuppress = activity_drop on user_return;\nalert when q and bg and\
      \ suppress"
- question: Does an application request a network plus foreground-service/background-execution permission
    combination that is rare for its declared app category, giving it the means to run and exfiltrate
    while gating that behavior with no-permission motion sensors?
  context: 'Motion sensors need no permission, but the ability to keep running in the background and reach
    the network does — and an unusual high-privilege permission set for an app''s declared category is
    a strong, explainable malware signal ([Identification of Significant Permissions](https://arxiv.org/pdf/2103.00643)).
    During app vetting and at runtime, deny or escalate apps whose network + background-execution permission
    combination is rare for their category, and pair this with dynamic behavioral vetting since these
    apps are environment-aware ([mobile malware survey](https://arxiv.org/pdf/1801.02837)). This is a
    proactive Defense Evasion control: it flags the capability to evade before the evasion is observed.
    A common, category-appropriate permission set lowers suspicion.'
  answer_sources:
  - MobileEDR OS API execution logs
  - MobileEDR application-state logs
  - MDM application inventory logs
  - Zeek conn.log
  - 'NAI: Endpoints: Corporate-managed mobile devices with MTD/MDM agents. Network: Network taps at corporate
    Wi-Fi access points, VPN egress points, and internet gateways where Zeek sensors are deployed. Infrastructure:
    MDM servers and DNS servers. Analytics Platform: SIEM or data lake where MTD, MDM, and Zeek logs are
    aggregated for correlation.'
  range: Point-in-time at app install/update vetting; re-evaluate over Last 90 days at runtime
  queries:
  - technology: SIEM/Rule pseudocode
    query: "perms = mdm_inventory(app).permissions;\nrare = (network in perms) and (foreground_service\
      \ or background_exec in perms)\n       and perm_set not common_for(app.category);\nalert/deny when\
      \ rare; require dynamic_behavior_vetting(app)"
- question: For each app, what share of its sensitive-API invocations and outbound bytes/connections occurs
    while the screen is off or the device is idle, and does that screen-off share exceed the 95th percentile
    of the app's 30-day history or its category's fleet-wide baseline?
  context: Apps that hide behavior from the user concentrate their sensitive activity in screen-off/idle
    windows. Baseline the screen-off/idle share of each app's sensitive-API calls and outbound bytes/connections
    and alert when it exceeds the app's 30-day 95th percentile or the per-category fleet baseline. Continuous
    lightweight feature sampling with per-device baselining follows [Andromaly](https://link.springer.com/article/10.1007/s10844-010-0148-x).
    A high screen-off share is consistent with Defense Evasion via user-absence gating; a balanced or
    screen-on-weighted profile is expected for legitimate apps.
  answer_sources:
  - MobileEDR OS API execution logs
  - MobileEDR application-state logs
  - MDM application inventory logs
  - Zeek conn.log
  - 'NAI: Endpoints: Corporate-managed mobile devices with MTD/MDM agents. Network: Network taps at corporate
    Wi-Fi access points, VPN egress points, and internet gateways where Zeek sensors are deployed. Infrastructure:
    MDM servers and DNS servers. Analytics Platform: SIEM or data lake where MTD, MDM, and Zeek logs are
    aggregated for correlation.'
  range: Last 90 days; baseline on rolling 30-day window
  queries:
  - technology: SIEM/Stats pseudocode
    query: "off_share = (sensitive_api_off + bytes_off + conns_off)\n          / (total_sensitive_api\
      \ + total_bytes + total_conns) per app;\nalert when off_share > p95(app.history_30d) or off_share\
      \ > category_baseline"
- question: Given the device's inferred user-activity context, are an app's sensor activations inconsistent
    with that context — for example using motion sensors while the device is idle or the user is inferred
    absent — per a context-aware sensor-state model?
  context: Model the normal correlation between inferred user-activity context and which sensors are active
    using a Markov-chain sensor-state transition model plus Naive Bayes/Random Forest, and flag activations
    that don't fit the current context ([6thSense](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-sikder.pdf)
    is the canonical context-aware sensor-evasion detector). Surface the top-3 contributing sensors/features
    per alert ([OC-SVM + LIME](https://www.nature.com/articles/s41598-025-20445-4)). Context-inconsistent
    sensor use — especially motion sensing during idle/absent periods — is precisely the User Evasion
    behavior (Defense Evasion); context-consistent sensor use is benign.
  answer_sources:
  - MobileEDR OS API execution logs
  - MobileEDR application-state logs
  - MDM application inventory logs
  - Zeek conn.log
  - 'NAI: Endpoints: Corporate-managed mobile devices with MTD/MDM agents. Network: Network taps at corporate
    Wi-Fi access points, VPN egress points, and internet gateways where Zeek sensors are deployed. Infrastructure:
    MDM servers and DNS servers. Analytics Platform: SIEM or data lake where MTD, MDM, and Zeek logs are
    aggregated for correlation.'
  range: Last 90 days for training; score in near-real-time
  queries:
  - technology: ML/pseudocode
    query: 'ctx_model = MarkovChain(sensor_state_transitions) + NaiveBayes/RF(context->sensors);

      score = ctx_model.consistency(active_sensors, inferred_context);

      alert when sensor_use inconsistent (e.g. motion while idle/absent);

      explain = LIME.top3(sensors/features)'
- question: In an app's stream of OS-API-execution and application-state log keys, does the ordering deviate
    from learned-benign sequences — specifically the improbable sensor-query -> inferred-user-absence
    -> background-activity ordering — falling outside the top-g predicted next keys?
  context: Train an LSTM on benign OS-API-execution and application-state log-key sequences and flag log
    keys that fall outside the top-g model predictions, catching the improbable sensor-query then user-absence
    then background-activity ordering and surfacing the deviating key for triage ([DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf)).
    Retrain incrementally to track fleet baselines. A sequence anomaly highlights the causal evasion chain
    even when each individual event looks benign — a Defense Evasion lead; sequences within normal predictions
    are expected app behavior.
  answer_sources:
  - MobileEDR OS API execution logs
  - MobileEDR application-state logs
  - MDM application inventory logs
  - Zeek conn.log
  - 'NAI: Endpoints: Corporate-managed mobile devices with MTD/MDM agents. Network: Network taps at corporate
    Wi-Fi access points, VPN egress points, and internet gateways where Zeek sensors are deployed. Infrastructure:
    MDM servers and DNS servers. Analytics Platform: SIEM or data lake where MTD, MDM, and Zeek logs are
    aggregated for correlation.'
  range: Last 90 days for training; score in near-real-time on streaming log keys
  queries:
  - technology: ML/pseudocode
    query: 'lstm = train(benign osapi+appstate log_key sequences);

      for key in stream: if key not in lstm.topg(prev_keys): flag(key);

      review flagged: sensor_query -> user_absence -> background_activity;

      retrain incrementally'
