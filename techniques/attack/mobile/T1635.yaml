name: 'T1635: Steal Application Access Token'
id: de26a890-4426-4b3c-bc95-dc6ae74a5d0f
description: 'Investigate whether an adversary is stealing application access tokens (OAuth/OIDC) from
  managed mobile devices to acquire credentials for remote systems and cloud/SaaS resources. This playbook
  helps an analyst hunt for the canonical T1635 vector: a user is lured (via social engineering or URI
  hijacking) into completing an OAuth authorization flow whose redirect is intercepted by a malicious
  or lookalike application. It correlates network-side evidence (outbound OAuth authorization requests
  with non-allowlisted redirect_uri values, malicious-domain contact immediately preceding an OAuth flow,
  high-entropy or rare redirect domains, token-endpoint failure spikes) with mobile endpoint and MDM/UEM
  evidence (apps registering protected or typosquatted custom URI schemes, missing App Links/Digital Asset
  Links verification, and runtime access to token material via AccountManager/Keystore/KeyChain or token
  caches). The questions span symbolic-logic rules, statistical baselining, and machine-learning classifiers
  so an analyst can confirm or rule out token acquisition and prioritize containment.'
type: technique
related:
- tactic_id: TA0031
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
