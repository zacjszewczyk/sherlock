questions:
- question: Are any OAuth 2.0 authorization requests from mobile devices using a redirect_uri that, after
    URL decoding, does not exactly match an approved registered OAuth callback on the managed allowlist?
  context: 'This is the highest-fidelity Credential Access indicator for T1635: an adversary performing
    redirect manipulation/hijacking substitutes a redirect_uri so the authorization code (and ultimately
    the access token) is delivered to attacker-controlled infrastructure. Identify OAuth flows by the
    presence of response_type and client_id parameters in the HTTP request, then extract and URL-decode
    the redirect_uri and compare it with exact-string matching against the allowlist of registered callbacks.
    Per RFC 9700, exact match (not wildcard or substring) is the authoritative rule. A non-allowlisted
    redirect is a strong sign the token is being routed to an unauthorized party; pivot to the originating
    device and destination domain. A clean result means observed flows used approved callbacks only. References:
    [OAuth 2.0 Security Best Current Practice (RFC 9700)](https://www.rfc-editor.org/rfc/rfc9700.txt);
    [A Comprehensive Formal Security Analysis of OAuth 2.0, Fett et al.](https://arxiv.org/pdf/1601.01229).'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Corporate network egress points, including firewalls, VPN concentrators, and Cloud Access Security
    Brokers (CASBs) inspecting traffic from corporate Wi-Fi and VPN-connected mobile devices; Cloud-native
    network sensors (e.g., VPC Flow Logs, cloud firewalls).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'from http.log where uri contains "response_type" and uri contains "client_id"

      and id.orig_h in MOBILE_IP_RANGES

      let cb = url_decode(extract_param(uri, "redirect_uri"))

      where cb NOT EXACTLY IN oauth_callback_allowlist

      => alert("Non-allowlisted OAuth redirect_uri", device=id.orig_h, redirect=cb)'
- question: Are native or public-client OAuth flows from mobile devices missing PKCE (code_challenge with
    S256), using PKCE 'plain' downgrade, delivering callbacks to private-use custom URI schemes instead
    of verified https App Links, or being initiated inside an embedded WebView?
  context: 'PKCE (RFC 7636) is mandatory for native/public clients; its absence, or a downgrade to the
    ''plain'' method, leaves the authorization code interceptable and is a precondition for token theft.
    Likewise, callbacks delivered to custom (private-use) URI schemes are first-come and non-unique, so
    a malicious app can claim them, whereas verified claimed-https App Links/Universal Links cannot be
    hijacked. Initiating OAuth in an embedded WebView (rather than the system browser or a Custom Tab)
    lets a hosting app observe credentials and tokens, violating RFC 8252. Flagging these hygiene failures
    surfaces flows that an attacker could exploit to acquire credentials even before a confirmed compromise.
    References: [Proof Key for Code Exchange (RFC 7636)](https://www.rfc-editor.org/rfc/rfc7636.txt);
    [OAuth 2.0 for Native Apps (RFC 8252)](https://www.rfc-editor.org/rfc/rfc8252.txt).'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Corporate network egress points, including firewalls, VPN concentrators, and Cloud Access Security
    Brokers (CASBs) inspecting traffic from corporate Wi-Fi and VPN-connected mobile devices; Cloud-native
    network sensors (e.g., VPC Flow Logs, cloud firewalls).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'from http.log where is_oauth_authz(uri)

      flag if missing_param(uri,"code_challenge") or param(uri,"code_challenge_method")!="S256"

      flag if token_request and missing_param(body,"code_verifier")

      flag if redirect_uri_scheme(uri) is custom_scheme and not verified_applink

      flag if user_agent indicates embedded_webview

      => alert("Hijackable OAuth flow (PKCE/scheme/WebView)", device=id.orig_h)'
- question: Among alerted OAuth redirect domains, which exhibit statistically anomalous lexical characteristics
    (high Shannon entropy, unusual length, abnormal character-class ratios) compared with a 90-day baseline
    of legitimate redirect_uri domains?
  context: 'Token-theft infrastructure frequently uses algorithmically generated (DGA) or lookalike domains.
    Computing the FQDN Shannon entropy, length, and character-class ratios and comparing each against
    the 90-day distribution of legitimate redirect_uri domains lets you flag values above the 95th percentile
    as probable malicious infrastructure, mirroring lexical scoring used for covert-channel and DNS-exfiltration
    detection. This is a statistical enrichment for the exact-match rule: a non-allowlisted redirect that
    is also lexically anomalous is far more likely to be adversary-controlled and warrants escalation.
    Benign-looking values may simply be newly registered legitimate callbacks pending allowlisting. References:
    [Detection of Malicious and Low-Throughput Data Exfiltration Over the DNS Protocol](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Corporate network egress points, including firewalls, VPN concentrators, and Cloud Access Security
    Brokers (CASBs) inspecting traffic from corporate Wi-Fi and VPN-connected mobile devices; Cloud-native
    network sensors (e.g., VPC Flow Logs, cloud firewalls).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = distribution(entropy(domain), len(domain), charclass_ratio(domain))\n  over legitimate\
      \ redirect_uri domains, last 90 days\nfor each alerted_domain:\n  score = percentile_rank(entropy(alerted_domain),\
      \ baseline.entropy)\n  if score > 95th_percentile or len/charclass anomalous => flag(\"high-entropy\
      \ redirect domain\")"
- question: Is there a spike in OAuth token-endpoint failures (e.g., invalid_grant or redirect-URI mismatch
    rejections) for any specific client_id or device that would indicate an intercepted authorization
    code failing PKCE or exact-redirect verification?
  context: 'When an authorization code is stolen and replayed by an attacker, the token exchange commonly
    fails PKCE verification or exact redirect matching, producing invalid_grant and redirect-URI-mismatch
    errors. Tracking per-client_id and per-device rates of these token-endpoint errors over time and alerting
    on statistically significant spikes provides an interception signal that is distinct from the authorization-request-side
    rules. A localized spike tied to one device or client_id suggests active code theft/replay; broad,
    gradual changes more likely reflect a configuration or app-update issue. References: [Proof Key for
    Code Exchange (RFC 7636)](https://www.rfc-editor.org/rfc/rfc7636.txt); [OAuth 2.0 Security Best Current
    Practice (RFC 9700)](https://www.rfc-editor.org/rfc/rfc9700.txt).'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Corporate network egress points, including firewalls, VPN concentrators, and Cloud Access Security
    Brokers (CASBs) inspecting traffic from corporate Wi-Fi and VPN-connected mobile devices; Cloud-native
    network sensors (e.g., VPC Flow Logs, cloud firewalls).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from token_endpoint_logs

      stats count by client_id, device, error_code, bin(time, 1h)

      where error_code in ("invalid_grant","redirect_uri_mismatch")

      baseline mean/stddev per client_id over 90d

      if hourly_count > mean + 3*stddev => alert("token-endpoint failure spike", client_id, device)'
- question: When OAuth request features are scored by a supervised classifier, which mobile-originated
    flows exceed a 0.90 malicious probability, and what are the top contributing features?
  context: 'A logistic-regression or gradient-boosted classifier can fuse weak signals into a high-fidelity
    verdict. Useful features include redirect_uri entropy, domain age/registration from passive DNS, TLD
    reputation, presence/length of state and PKCE parameters, URI path depth, and JA3/JA3S TLS fingerprints
    from Zeek ssl.log. Escalating flows whose predicted malicious probability exceeds 0.90 and surfacing
    the top-3 contributing features in the alert gives the analyst an explainable starting point for triage.
    This complements the deterministic rules by catching novel redirect-hijack variants that do not trip
    a single static rule; treat it as a prioritization aid, not sole proof. References: [A Systematic
    Review on the Integration of Explainable AI in Intrusion Detection Systems](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Corporate network egress points, including firewalls, VPN concentrators, and Cloud Access Security
    Brokers (CASBs) inspecting traffic from corporate Wi-Fi and VPN-connected mobile devices; Cloud-native
    network sensors (e.g., VPC Flow Logs, cloud firewalls).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [redirect_entropy, domain_age, tld_reputation, state_present, pkce_present,\n \
      \           pkce_len, uri_path_depth, ja3, ja3s]\np = model.predict_proba(features)\nif p > 0.90\
      \ => alert(\"suspicious OAuth flow\", prob=p, top3=explain(features))"
- question: Did any mobile device contact a known-malicious domain and then, within roughly 60 seconds,
    initiate a new OAuth authorization flow to a different (potentially legitimate) service provider?
  context: 'This temporal correlation captures the canonical T1635 user-action-then-redirect-hijack pattern:
    a victim visits an attacker page (flagged by threat intelligence), is induced to start an OAuth flow,
    and the resulting code/token is intercepted. Trigger when, from the same mobile source IP within a
    60-second window, (A) Zeek dns.log or conn.log shows a destination flagged malicious by threat intel,
    and (B) Zeek http.log shows OAuth parameters (response_type, client_id). The tight time proximity
    and shared source make this a high-severity Credential Access alert. Investigate the device, the malicious
    domain, and which provider''s tokens were targeted. References: [Steal Application Access Token, MITRE
    ATT&CK T1635](https://attack.mitre.org/techniques/T1635/).'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Threat Intelligence Platform Feed
  - 'NAI: Web proxy logs and network sensor data (e.g., Zeek) at the internet gateway; SIEM platform with
    integrated threat intelligence feeds.'
  range: Last 90 days (correlate within a 60-second sliding window per source IP)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'A: from (dns.log|conn.log) where dest in threat_intel_malicious

      B: from http.log where uri contains "response_type" and uri contains "client_id"

      correlate A,B on id.orig_h where abs(B.time - A.time) <= 60s

      => high_severity_alert("malicious-domain -> OAuth flow", device=id.orig_h)'
- question: Is any user initiating an OAuth flow to a client_id or redirect domain that is absent from
    their 90-day baseline and used by fewer than 1% of the organization during that period?
  context: 'Illicit-consent and token-theft campaigns often route victims to OAuth applications that are
    rare in the environment. Maintaining a 90-day per-user and organization-wide baseline of OAuth client_id/redirect
    domains lets you raise risk when a domain is both new to the user and accessed by under 1% of users
    overall - the same rare-app/consent heuristic Microsoft uses to surface illicit grants. A hit warrants
    reviewing the app''s legitimacy and any consent granted; common, well-established providers will not
    trip this and can be deprioritized. References: [Detect and Remediate Illicit Consent Grants, Microsoft](https://learn.microsoft.com/en-us/defender-office-365/detect-and-remediate-illicit-consent-grants).'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Threat Intelligence Platform Feed
  - 'NAI: Web proxy logs and network sensor data (e.g., Zeek) at the internet gateway; SIEM platform with
    integrated threat intelligence feeds.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline_user = set(oauth_domains per user, last 90d)\norg_prevalence = fraction_of_users_accessing(domain,\
      \ last 90d)\nfor new_flow:\n  if domain not in baseline_user[user] and org_prevalence(domain) <\
      \ 0.01\n    => raise_risk(\"rare OAuth provider\", user, domain)"
- question: Do any users exhibit anomalous browsing-to-OAuth sequences (e.g., malicious-category page
    immediately preceding an OAuth provider) that a sequence model flags as a reconstruction-error outlier?
  context: 'Modeling each user''s browsing as an ordered sequence of domain categories and training an
    LSTM/autoencoder on benign sequences lets you detect the abnormal transition pattern characteristic
    of token theft - for example, a malicious page leading directly into an oauth_provider request. When
    the reconstruction error for an observed sequence exceeds 3 standard deviations above the rolling
    mean, escalate for critical review and report the specific deviating events. This catches multi-step
    lures that no single-event rule would flag; a normal reconstruction error indicates ordinary browsing
    leading into expected OAuth use. References: [DeepLog: Anomaly Detection and Diagnosis from System
    Logs, Du et al.](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Threat Intelligence Platform Feed
  - 'NAI: Web proxy logs and network sensor data (e.g., Zeek) at the internet gateway; SIEM platform with
    integrated threat intelligence feeds.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "seq = ordered_domain_categories(user, session)\nerr = autoencoder.reconstruction_error(seq)\n\
      if err > rolling_mean + 3*rolling_std\n  => escalate(\"anomalous browsing->OAuth sequence\", user,\
      \ deviating_events(seq))"
- question: Has any managed app registered a protected OAuth URI scheme (e.g., ms-auth://) whose owning
    bundle ID and signing-certificate hash do not match the official, expected values for that scheme?
  context: 'Custom (private-use) URI schemes are non-unique and assigned first-come, so a malicious or
    lookalike app can register a legitimate scheme and intercept the OAuth callback - the hijack precondition
    described in RFC 8252. Ingest UEM/MDM inventory, parse each app manifest for registered URI schemes
    and intent filters, and compare against an allowlist mapping legitimate schemes to their official
    bundle IDs and signing-certificate hashes. Alert when an app claims a protected scheme but does not
    match the expected bundle ID or signer. A match by an unexpected app strongly indicates a token-stealing
    handler; legitimate first-party apps will match their registered signer. References: [OAuth 2.0 for
    Native Apps (RFC 8252)](https://www.rfc-editor.org/rfc/rfc8252.txt); [Measuring the Insecurity of
    Mobile Deep Links of Android, Liu et al.](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-liu.pdf).'
  answer_sources:
  - UEM Application Manifest Data
  - MDM Application Inventory Log
  - Mobile Threat Protection (MTP) Event Log
  - 'NAI: Mobile Device Management (MDM) / Unified Endpoint Management (UEM) platforms; Application security
    testing (AST) reports for in-house developed apps; Mobile Threat Protection (MTP) solution consoles
    and log repositories.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from uem_manifest_inventory\nfor app, scheme in registered_uri_schemes(app):\n  if scheme\
      \ in protected_scheme_allowlist:\n    expected = allowlist[scheme]  # {bundle_id, signer_hash}\n\
      \    if app.bundle_id != expected.bundle_id or app.signer_hash != expected.signer_hash\n      =>\
      \ alert(\"unauthorized handler for protected scheme\", app, scheme)"
- question: For apps that declare intent filters for protected claimed-https hosts, is Digital Asset Links
    (assetlinks.json) verification present and correctly binding the host to the app's package and signing
    certificate?
  context: 'Verified Android App Links (and iOS Universal Links) cannot be hijacked, unlike custom schemes,
    because the OS confirms a Digital Asset Links relationship between the domain and the app''s package
    + signing certificate. For each app claiming a protected host, confirm that assetlinks.json verification
    exists and matches; flag any app declaring an intent filter for a protected host without matching
    verification. App vetting should also prefer explicit intents and signer checks. A missing or mismatched
    verification on a protected host is a sign the app may be poised to intercept OAuth redirects intended
    for the legitimate owner. References: [Verify Android App Links, Android Developers](https://developer.android.com/training/app-links/verify-android-applinks);
    [Steal Application Access Token, MITRE ATT&CK T1635](https://attack.mitre.org/techniques/T1635/).'
  answer_sources:
  - UEM Application Manifest Data
  - MDM Application Inventory Log
  - Mobile Threat Protection (MTP) Event Log
  - 'NAI: Mobile Device Management (MDM) / Unified Endpoint Management (UEM) platforms; Application security
    testing (AST) reports for in-house developed apps; Mobile Threat Protection (MTP) solution consoles
    and log repositories.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from uem_manifest_inventory\nfor app, host in claimed_https_hosts(app):\n  if host in protected_hosts\
      \ and not verified_asset_links(host, app.package, app.signer)\n    => alert(\"unverified App Link\
      \ for protected host\", app, host)"
- question: Among newly installed, non-allowlisted apps, which have display names, schemes, or hosts within
    a small Levenshtein distance of allowlisted values while also registering URI schemes (i.e., likely
    typosquats)?
  context: 'Adversaries disguise token-stealing handlers as lookalikes (e.g., ms-authe:// vs ms-auth://).
    For each newly installed app not on the allowlist, compute the Levenshtein distance between its display
    name (and any registered scheme/host) and the allowlisted values; when the distance is small (for
    example under 3) and the app registers any URI schemes, flag it for prioritized review as a potential
    lookalike handler. This statistical screen catches near-miss imposters that exact-match allowlisting
    alone would not, since the imposter scheme differs slightly. Apps with large edit distances or no
    scheme registration are lower priority. References: [Measuring the Insecurity of Mobile Deep Links
    of Android, Liu et al.](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-liu.pdf).'
  answer_sources:
  - UEM Application Manifest Data
  - MDM Application Inventory Log
  - Mobile Threat Protection (MTP) Event Log
  - 'NAI: Mobile Device Management (MDM) / Unified Endpoint Management (UEM) platforms; Application security
    testing (AST) reports for in-house developed apps; Mobile Threat Protection (MTP) solution consoles
    and log repositories.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for app in newly_installed and app not in allowlist:\n  d_name = min(levenshtein(app.name,\
      \ x) for x in allowlist.names)\n  d_scheme = min(levenshtein(app.scheme, x) for x in allowlist.schemes)\n\
      \  if (d_name < 3 or d_scheme < 3) and app.registers_uri_schemes\n    => flag(\"typosquatted scheme\
      \ handler\", app)"
- question: When static MDM/UEM features are scored by an explainable classifier, which apps exceed a
    0.85 malicious probability and should be quarantined with a ticket, and what features drove the verdict?
  context: 'An explainable model (e.g., linear SVM or Random Forest) trained on static MDM/UEM features
    can flag malicious apps before runtime compromise. Useful features include app source, the number
    and type of registered URI schemes and intent filters, requested permissions, declared API calls/network
    addresses, developer-certificate age/reputation, the Levenshtein lookalike score, and jailbroken/rooted
    device status. When malicious probability exceeds 0.85, trigger automatic quarantine and a ticket,
    and surface the top contributing features so the analyst understands why. This fuses the individual
    heuristics above into a prioritized verdict and resists the single-signal evasion that fools narrow
    rules. References: [Drebin: Effective and Explainable Detection of Android Malware, Arp et al.](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf).'
  answer_sources:
  - UEM Application Manifest Data
  - MDM Application Inventory Log
  - Mobile Threat Protection (MTP) Event Log
  - 'NAI: Mobile Device Management (MDM) / Unified Endpoint Management (UEM) platforms; Application security
    testing (AST) reports for in-house developed apps; Mobile Threat Protection (MTP) solution consoles
    and log repositories.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [app_source, n_schemes, n_intent_filters, permissions, declared_apis,\n       \
      \     net_addrs, cert_age, cert_reputation, levenshtein_score, rooted_flag]\np = model.predict_proba(features)\n\
      if p > 0.85 => quarantine(app); open_ticket(app, prob=p, top_features=explain(features))"
- question: Where runtime/behavioral telemetry exists, do any apps show abstracted API-call sequences
    (AccountManager/KeyStore/KeyChain access, intent handling, reads of token caches under /data/data/<pkg>/(shared_prefs|databases),
    then network egress) that deviate from benign behavioral profiles?
  context: 'Behavioral modeling resists the obfuscation that defeats static signatures. Model abstracted
    API-call sequences - access to AccountManager/KeyStore/KeyChain, intent handling, reads of token caches
    under /data/data/<pkg>/(shared_prefs|databases), followed by network egress - as Markov-chain transitions
    and score deviations from benign per-app profiles. A short window in which an app reads token material
    and then immediately egresses data is the runtime signature of token acquisition and exfiltration
    (consistent with MITRE analytic AN1743). Complement the Markov approach with unsupervised Isolation
    Forest outlier scoring of per-app feature vectors as a low-tuning baseline. Strong deviations warrant
    containment; profiles consistent with benign baselines can be cleared. References: [MaMaDroid, Mariconti
    et al.](https://arxiv.org/pdf/1612.04433); [Isolation Forest, Liu, Ting and Zhou](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
  - UEM Application Manifest Data
  - MDM Application Inventory Log
  - Mobile Threat Protection (MTP) Event Log
  - 'NAI: Mobile Device Management (MDM) / Unified Endpoint Management (UEM) platforms; Application security
    testing (AST) reports for in-house developed apps; Mobile Threat Protection (MTP) solution consoles
    and log repositories.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seq = abstracted_api_calls(app)  # AccountManager,KeyStore,KeyChain,intent,file_read,net

      p_transition = markov_model.score(seq, benign_profile[app])

      if p_transition below benign_threshold => alert("token-theft behavior", app)

      also: iforest_score = isolation_forest.score(per_app_feature_vector(app))

      if iforest_score is outlier => alert("behavioral outlier", app)'
