    Logic detection for MITRE ATT&CK T1630.002 (File Deletion) on Android. Monitor EDR/agent file-deletion
    events (captured via the Android inotify wrapper DELETE/DELETE_SELF events, [Android FileObserver](https://developer.android.com/reference/android/os/FileObserver)).
    Generate a high-severity alert when the initiating process/package is on a malware IOC list or absent
    from an allowlist of legitimate uninstaller and cache-clearing processes. Add a union rule from [CryptoDrop](https://faculty.cc.gatech.edu/~traynor/papers/scaife-icdcs16.pdf):
    escalate when a single process exhibits file-type funneling (many file types read, few/none written)
    together with a deletion burst. A positive result indicates an app has acquired destructive capability
    and/or is actively deleting operational, evidentiary, or sensitive files (potentially as part of an
    exfiltrate-then-wipe anti-forensic chain); a negative result reduces but does not eliminate suspicion,
    so corroborate with the other questions in this playbook (destructive-capability acquisition → anomalous
    deletion burst → sensitive-path/critical-extension loss → outbound transfer before wipe).'
  answer_sources:
  - EDR.FileModificationEvents
  - Android.Logcat
  - Internal.SystemProcessAllowlist
  - 'NAI: User data partitions on corporate mobile devices, Application sandboxes on mobile devices, MDM/EDR
    management console, Centralized Log Aggregator (SIEM)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'read EDR.FileModificationEvents where op IN ("DELETE","DELETE_SELF")

      | lookup Internal.SystemProcessAllowlist process OUTPUT approved

      | eval ioc=lookup_malware_ioc(package)

      | where isnotnull(ioc) OR isnull(approved)

      | eval funnel=if(types_read>5 AND types_written<=1 AND delete_burst=true,1,0)

      | eval severity=if(funnel=1 OR isnotnull(ioc),"critical","high")'
- question: '[Defense Evasion] Detect deletion volume outliers by device: have you determined whether
