questions:
- question: '[Defense Evasion] Alert on admin grants to unapproved apps: have you determined whether "Alert
    on admin grants to unapproved apps" is warranted on corporate-managed mobile devices, using the Symbolic
    Logic approach described, to answer the intelligence requirement — Is an adversary deleting files
    or wiping data on corporate mobile devices to evade detection or cause impact? (PIR)'
  context: 'Tactic relevance (Defense Evasion): Is an adversary deleting files or wiping data on corporate
    mobile devices to evade detection or cause impact? (PIR) This question operationalizes a Symbolic
    Logic detection for MITRE ATT&CK T1630.002 (File Deletion) on Android. Create a SIEM rule to query
    MDM logs for every device-administrator/device-owner privilege grant (apps requesting USES_POLICY_WIPE_DATA
    or owner authority, the deterministic precondition for full-device wipe per [Android DevicePolicyManager](https://developer.android.com/reference/android/app/admin/DevicePolicyManager)).
    Join the application''s package name and signing-certificate hash against the corporate allowlist
    and generate a high-severity alert for any app not on the allowlist. Keep this hard rule even when
    ML scoring is added, since permission/API-only ML detectors are evadable ([Android HIV](https://arxiv.org/abs/1808.04218)).
    A positive result indicates an app has acquired destructive capability and/or is actively deleting
    operational, evidentiary, or sensitive files (potentially as part of an exfiltrate-then-wipe anti-forensic
    chain); a negative result reduces but does not eliminate suspicion, so corroborate with the other
    questions in this playbook (destructive-capability acquisition → anomalous deletion burst → sensitive-path/critical-extension
    loss → outbound transfer before wipe).'
  answer_sources:
  - MDM.PrivilegeGrantEvents
  - EDR.ApplicationInventoryLogs
  - Internal.CorporateAppAllowlist
  - 'NAI: Corporate-managed mobile devices (iOS, Android), Mobile Device Management (MDM) Platform, Application
    Vetting System, Corporate App Store, Centralized Log Aggregator (SIEM)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'read MDM.PrivilegeGrantEvents

      | where grant_type IN ("device_admin","device_owner") OR policy="USES_POLICY_WIPE_DATA"

      | lookup Internal.CorporateAppAllowlist package_name, signing_cert_hash OUTPUT approved

      | where isnull(approved)

      | eval severity="high"

      | table device_id, user, package_name, signing_cert_hash, policy'
- question: '[Defense Evasion] Flag destructive-capability apps from static features: have you determined
    whether "Flag destructive-capability apps from static features" is warranted on corporate-managed
    mobile devices, using the Symbolic Logic approach described, to answer the intelligence requirement
    — Is an adversary deleting files or wiping data on corporate mobile devices to evade detection or
    cause impact? (PIR)'
  context: 'Tactic relevance (Defense Evasion): Is an adversary deleting files or wiping data on corporate
    mobile devices to evade detection or cause impact? (PIR) This question operationalizes a Symbolic
    Logic detection for MITRE ATT&CK T1630.002 (File Deletion) on Android. For every newly installed or
    updated app, run static analysis and alert when the manifest/dex requests destructive admin capability
    (BIND_DEVICE_ADMIN + USES_POLICY_WIPE_DATA) combined with suspicious APIs (DexClassLoader, Runtime.exec,
    reflection) and embedded network endpoints. These are the explainable Drebin static feature sets ([Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf));
    list the matched features in the alert. A positive result indicates an app has acquired destructive
    capability and/or is actively deleting operational, evidentiary, or sensitive files (potentially as
    part of an exfiltrate-then-wipe anti-forensic chain); a negative result reduces but does not eliminate
    suspicion, so corroborate with the other questions in this playbook (destructive-capability acquisition
    → anomalous deletion burst → sensitive-path/critical-extension loss → outbound transfer before wipe).'
  answer_sources:
  - MDM.PrivilegeGrantEvents
  - EDR.ApplicationInventoryLogs
  - Internal.CorporateAppAllowlist
  - 'NAI: Corporate-managed mobile devices (iOS, Android), Mobile Device Management (MDM) Platform, Application
    Vetting System, Corporate App Store, Centralized Log Aggregator (SIEM)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "read EDR.ApplicationInventoryLogs where event IN (\"install\",\"update\")\n| static_analyze(apk)\
      \ -> manifest_perms, dex_apis, embedded_endpoints\n| where \"BIND_DEVICE_ADMIN\" in manifest_perms\
      \ AND \"USES_POLICY_WIPE_DATA\" in manifest_perms\n  AND any(dex_apis IN (\"DexClassLoader\",\"\
      Runtime.exec\",\"reflection\"))\n| eval matched_features=join(manifest_perms+dex_apis+embedded_endpoints)\n\
      | eval severity=\"high\" | table package_name, matched_features"
- question: '[Defense Evasion] Baseline fleet-wide privilege grant volume: have you determined whether
    "Baseline fleet-wide privilege grant volume" is warranted on corporate-managed mobile devices, using
    the Statistical Method approach described, to answer the intelligence requirement — Is an adversary
    deleting files or wiping data on corporate mobile devices to evade detection or cause impact? (PIR)'
  context: 'Tactic relevance (Defense Evasion): Is an adversary deleting files or wiping data on corporate
    mobile devices to evade detection or cause impact? (PIR) This question operationalizes a Statistical
    Method detection for MITRE ATT&CK T1630.002 (File Deletion) on Android. Ingest MDM privilege-grant
    events into a time-series database. Compute a 30-day rolling baseline (mean and standard deviation)
    of daily admin grants across the fleet and alert when a 24-hour count exceeds mean + 3 sigma. Layer
    a CUSUM/PELT change-point test ([change-point detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/))
    over the same series to catch abrupt onsets (e.g., a mass-enrollment campaign) that a static z-score
    misses, and separately track the failed/denied grant rate as a distinct signal. A positive result
    indicates an app has acquired destructive capability and/or is actively deleting operational, evidentiary,
    or sensitive files (potentially as part of an exfiltrate-then-wipe anti-forensic chain); a negative
    result reduces but does not eliminate suspicion, so corroborate with the other questions in this playbook
    (destructive-capability acquisition → anomalous deletion burst → sensitive-path/critical-extension
    loss → outbound transfer before wipe).'
  answer_sources:
  - MDM.PrivilegeGrantEvents
  - EDR.ApplicationInventoryLogs
  - Internal.CorporateAppAllowlist
  - 'NAI: Corporate-managed mobile devices (iOS, Android), Mobile Device Management (MDM) Platform, Application
    Vetting System, Corporate App Store, Centralized Log Aggregator (SIEM)'
  range: Last 90 days (use >=30 days of history to establish per-device/fleet baselines)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'read MDM.PrivilegeGrantEvents | bin _time span=1d

      | stats count as grants by _time

      | eventstats avg(grants) as mu stdev(grants) as sd over last 30d

      | where grants > mu + 3*sd

      | append [ CUSUM/PELT change_point(grants_series) -> onset_alert ]

      | append [ stats count(denied) as failed_grants by _time ]'
- question: '[Defense Evasion] Score risky admin grants in real time: have you determined whether "Score
