  queries:
  - technology: SIEM/Stats pseudocode
    query: 'read EDR.FileModificationEvents where op="DELETE" | bin _time span=5m

      | stats count as del_ct by device_id, user, process, _time

      | eventstats perc99(del_ct) as p99 over last 30d by device_id, process

      | where del_ct > p99

      | enrich frac_tree_touched, access_entropy, ext_set  # ShieldFS/EldeRan features'
