    deletion/extension-change *rate* is a robust cross-family destruction signal ([EldeRan](https://arxiv.org/abs/1609.03020)).
    Also profile the read-delete sequence rate from [UNVEIL](https://www.usenix.org/system/files/conference/usenixsecurity16/sec16_paper_kharraz.pdf).
    A positive result indicates an app has acquired destructive capability and/or is actively deleting
    operational, evidentiary, or sensitive files (potentially as part of an exfiltrate-then-wipe anti-forensic
    chain); a negative result reduces but does not eliminate suspicion, so corroborate with the other
    questions in this playbook (destructive-capability acquisition → anomalous deletion burst → sensitive-path/critical-extension
