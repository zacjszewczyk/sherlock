name: 'T1630.002: File Deletion'
id: 2de4a438-bed5-432a-8d20-294a6a74d7ad
description: This playbook helps an analyst investigate MITRE ATT&CK T1630.002 (File Deletion) on corporate-managed
  mobile devices (primarily Android), where an adversary wipes a device or deletes individual files to
  evade detection, destroy evidence, or cause impact. It supports the Defense Evasion mission question
  by chaining destructive-capability acquisition (an unapproved app granted device-administrator/device-owner
  authority with USES_POLICY_WIPE_DATA, a rooted or non-compliant posture, or destructive static features
  such as BIND_DEVICE_ADMIN, DexClassLoader, and reflection) to anomalous file-deletion behavior (per-process
  deletion bursts, sensitive-path and critical-extension deletions by non-allowlisted apps, file-type
  funneling, and abrupt change-points in deletion rate) and to the anti-forensic exfiltrate-then-wipe
  chain (low-reputation outbound transfers immediately followed by high-volume deletions). The questions
  combine deterministic allowlist/threat-intel/taint-flow checks, statistical baselining (rolling means
  and 3-sigma thresholds, 99th-percentile per-process deletion counts, CUSUM/PELT change-point detection,
  process-name entropy, failed-deletion and NXDOMAIN failure-mode series), and machine-learning detectors
  (Random Forest grant scoring, ARIMA/LSTM deletion-burst anomaly, DeepLog log-key sequences, DBSCAN per-user
  file-access clustering, RNN/LSTM cross-source activity sequences) across MDM/UEM, MobileEDR, Android
  logcat, and Zeek network telemetry.
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
