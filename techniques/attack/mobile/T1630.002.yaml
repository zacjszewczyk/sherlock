    detection for MITRE ATT&CK T1630.002 (File Deletion) on Android. Train a Random Forest on historical
    MDM/EDR grant events with features such as app category, count of requested permissions, app-store
    reputation, user role, install recency, and time of day; flag events with predicted risk > 0.8 for
    review. Surface the top-3 contributing features per alert using gradient/feature-attribution ([Explaining
    Black-box Android Malware Detection](https://arxiv.org/pdf/1803.03544)), and validate with time-aware
    splits plus drift monitoring to avoid inflated accuracy ([TESSERACT](https://www.usenix.org/system/files/sec19-pendlebury.pdf)).
    A positive result indicates an app has acquired destructive capability and/or is actively deleting
    operational, evidentiary, or sensitive files (potentially as part of an exfiltrate-then-wipe anti-forensic
    chain); a negative result reduces but does not eliminate suspicion, so corroborate with the other
    questions in this playbook (destructive-capability acquisition → anomalous deletion burst → sensitive-path/critical-extension
    loss → outbound transfer before wipe).'
  answer_sources:
  - MDM.PrivilegeGrantEvents
  - EDR.ApplicationInventoryLogs
  - Internal.CorporateAppAllowlist
  - 'NAI: Corporate-managed mobile devices (iOS, Android), Mobile Device Management (MDM) Platform, Application
    Vetting System, Corporate App Store, Centralized Log Aggregator (SIEM)'
  range: Last 90 days (use >=30 days of history to establish per-device/fleet baselines)
  queries:
  - technology: ML/pseudocode
    query: "features = [app_category, num_requested_perms, app_store_reputation,\n            user_role,\
      \ install_recency, time_of_day]\np = RandomForest.predict_proba(features)[risky]\nif p > 0.8:\n\
      \    raise_alert(severity=\"review\",\n        top3=feature_attribution(features)[:3])  # time-aware\
      \ splits + drift monitoring"
- question: '[Defense Evasion] Alert on deletion processes outside allowlists: have you determined whether
    "Alert on deletion processes outside allowlists" is warranted on corporate-managed mobile devices,
