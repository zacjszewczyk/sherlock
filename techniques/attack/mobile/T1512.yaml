name: 'T1512: Video Capture'
id: bb62f206-a99e-4536-aae7-2e5e270a51b1
description: 'Investigate whether an adversary is abusing a compromised Android or iOS device''s camera
  to covertly capture video or interval still images for the Collection goal of gathering sensitive data.
  This playbook helps an analyst hunt across three layers: (1) at the application/permission layer, identifying
  installed apps that request camera permissions (android.permission.CAMERA / NSCameraUsageDescription)
  yet are not allowlisted, are absent from the corporate catalog, request camera access that is statistically
  rare for their functional category, or score as risky under an ML app classifier; (2) at the network
  egress layer, detecting covert multimedia exfiltration via outbound volume anomalies, transfers of video/image
  MIME types to low-reputation or threat-intel destinations, periodic upload beacons consistent with interval
  capture, upload-failure bursts, and modeled exfiltration spikes; and (3) at the runtime/EDR layer, correlating
  camera API invocation (android.hardware.camera2, AVCaptureDevice) without user interaction, while backgrounded
  or device-locked, with downstream media writes and outbound transfer, plus statistical and sequence-model
  detection of anomalous lifecycle transitions. It blends deterministic symbolic-logic rules with statistical
  baselining and machine-learning approaches so silent, API-driven camera capture is caught even when
  the capturing app is otherwise unremarkable.'
type: technique
related:
- tactic_id: TA0035
  tactic_name: Collection
