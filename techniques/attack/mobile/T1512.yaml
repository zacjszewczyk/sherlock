questions:
- question: Which installed mobile apps declare camera capability or permission (android.hardware.camera
    / android.permission.CAMERA on Android, or NSCameraUsageDescription on iOS) while their package name
    or developer signing certificate is NOT on the approved allowlist or is absent from the corporate
    application catalog?
  context: Supports Collection by catching unsanctioned apps that can reach the camera before they ever
    record. Adversaries delivering surveillance-capable apps must declare camera permission to use the
    API on a non-rooted device, so the declaration plus a missing allowlist/catalog match is a strong
    first filter. Pull camera-declaring packages from MDM application inventory and app-vetting scan results,
    then check each package name and developer signing certificate against the approved allowlist and
    corporate catalog; alert on any miss. This applies the attribute-access-to-identity allowlist primitive
    (OverSight) and the manifest hardware/permission feature extraction of Drebin. A positive result identifies
    a specific app+device to vet or remove; a negative means the app is sanctioned and should be assessed
    by the behavioral and network checks below.
  answer_sources: &id001
  - MDM application inventory logs
  - App vetting platform scan results
  - 'NAI: Managed corporate mobile devices, Corporate application store, Mobile Application Management
    (MAM) console'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "cam_apps = MDM_inventory JOIN app_vetting where declares in ['android.permission.CAMERA','android.hardware.camera','NSCameraUsageDescription'];\n\
      for app in cam_apps:\n  if app.package not in approved_allowlist and app.signer not in approved_signers:\n\
      \    alert(device, app.package, app.signer, reason='camera app not allowlisted / not in catalog');\n\
      \  elif app.package not in corporate_catalog:\n    alert(device, app.package, reason='camera app\
      \ absent from corporate catalog')."
- question: Does any camera-permission app ALSO request INTERNET/network access and statically contain
    camera-capture APIs (Android camera2 / iOS AVCaptureDevice) co-occurring with network-send and file-write
    APIs - the classic capture-plus-exfiltrate code signature?
  context: Supports Collection by finding apps wired to both record and ship media off-device. The combination
    of camera-capture APIs, file-write APIs, and network/INTERNET access is a high-precision static co-occurrence
    signal (Drebin) indicating an app built to capture and exfiltrate rather than to merely display a
    viewfinder. Parse app-vetting static results and MDM manifest data for apps that simultaneously declare
    camera permission, request INTERNET, and reference both media-capture and network/file-write APIs.
    A positive result is a strong candidate for covert video capture and exfiltration and should be escalated;
    a negative reduces concern but does not clear apps that load network code dynamically.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for app in cam_apps:\n  has_net = 'INTERNET' in app.permissions or app.calls_any(['Socket','URLConnection','NSURLSession']);\n\
      \  has_cap = app.calls_any(['android.hardware.camera2','AVCaptureDevice']);\n  has_write = app.calls_any(['FileOutputStream','write','NSFileManager.create']);\n\
      \  if has_cap and has_net and has_write:\n    alert(device, app.package, apis=[has_cap,has_net,has_write],\
      \ reason='camera+INTERNET+file-write co-occurrence')."
- question: Among managed apps grouped by functional category, which apps request camera permission even
    though camera access is statistically rare for that category (prevalence below the locally-derived
    5th percentile)?
  context: Supports Collection by surfacing camera access that is anomalous for an app's stated purpose
    - for example a calculator or note-taking app requesting the camera. Compute per-category prevalence
    of camera permission across your managed fleet, then flag apps whose category makes camera access
    rare (bottom 5th percentile), using the feature-distribution rationale of Drebin. Derive the percentile
    threshold from your own MDM inventory rather than a fixed value so it reflects your environment. A
    positive result highlights an app whose camera request is hard to justify functionally and warrants
    vetting; a negative means camera access is normal for the app's category.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "prev = {}  # camera-permission prevalence by category\nfor cat in categories(MDM_inventory):\n\
      \  prev[cat] = fraction(apps_in(cat) where declares_camera);\nthr = percentile(values(prev), 5);\n\
      for app in cam_apps:\n  if prev[app.category] <= thr:\n    alert(device, app.package, app.category,\
      \ prevalence=prev[app.category], thr)."
- question: Does a trained classifier score a camera-permission app's malicious probability above 0.85
    based on its permissions, requested hardware, category, developer reputation, downloads, ratings,
    age, store presence, and embedded network addresses - and what top-3 features drove that score?
  context: Supports Collection by learning a decision boundary for risky camera apps that simple rules
    miss. Train a linear or tree classifier on app attributes (permissions, requested hardware, category,
    developer reputation, downloads, ratings, age, store presence, embedded network addresses) and alert
    when malicious probability exceeds 0.85, surfacing the top-3 contributing features (e.g., camera+INTERNET+suspicious
    API) for analyst triage, per Drebin. Retrain on a time-aware schedule to counter concept drift noted
    in the Deep Learning for Android Malware Defenses survey. A high-confidence hit flags a likely surveillance
    app for removal/vetting; explainability lets the analyst confirm the camera-exfiltration rationale
    quickly.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "feats = [permissions, requested_hardware, category, dev_reputation, downloads, ratings, age,\
      \ store_presence, embedded_net_addrs];\np = risk_classifier.predict_proba(feats(app));\nif p > 0.85:\n\
      \  alert(device, app.package, p, top3_features(app));\nretrain(risk_classifier, schedule='time_aware')."
- question: Is a mobile device making an outbound connection that matches C2/threat-intel indicators while
    sending far more data than it receives (orig_bytes >= 10x resp_bytes) and Zeek files.log shows video/*
    or image/* MIME types - and can the captured media source be tied to that outbound sink from the same
    app?
  context: Supports Collection by detecting the moment captured media leaves the device to attacker infrastructure.
    Alert when a mobile connection matches C2 indicators and is heavily upload-skewed (orig_bytes >= 10x
    resp_bytes) with files.log carrying video/* or image/* MIME types, then correlate the captured media
    source to the outbound sink from the same app per the source->sink model of TaintDroid; build the
    file-creation + network-connection correlation with allowlist exceptions using SigmaHQ rules. A positive
    result is high-confidence multimedia exfiltration to known-bad infrastructure and demands immediate
    containment; a negative does not clear covert uploads to not-yet-flagged destinations, which the volume
    and periodicity methods cover.
  answer_sources: &id002
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - Threat intelligence indicators
  - WHOIS records
  - 'NAI: Network egress points for corporate Wi-Fi, VPN concentrators, and cellular data gateways'
  range: Last 90 days, with event-centered correlation linking the camera/file-write source to the outbound
    connection.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for c in conn.log where dst in ti_c2:\n  if c.orig_bytes >= 10 * c.resp_bytes:\n    media\
      \ = files.log where conn_uid==c.uid and mime in ['video/*','image/*'];\n    if media and source_app(media)==app(c)\
      \ and app not in allowlist:\n      alert(device, app, c.dst, c.orig_bytes, media.mime, reason='media\
      \ exfil to IOC')."
- question: Has a device's 24-hour outbound byte total exceeded its own historical 99th percentile, and
    is that spike enriched by DNS name entropy > 3.5 or a destination WHOIS domain age < 60 days?
  context: Supports Collection by catching covert bulk media exfiltration as a volume anomaly even without
    a threat-intel hit. Baseline each device's daily outbound bytes and alert when a 24-hour total exceeds
    its own historical 99th percentile, then enrich with DNS name entropy > 3.5 (algorithmically generated
    domains) or WHOIS domain age < 60 days (freshly registered infrastructure). Tune the percentile per
    device baseline so heavy-use devices are not constantly noisy. A positive result - large upload to
    a high-entropy or newly-registered domain - is a strong covert-exfiltration signal; a negative means
    egress is within the device's normal envelope.
  answer_sources: *id002
  range: Last 90 days for baseline; evaluate per 24-hour window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = per_device_daily_outbound(conn.log, last=90d);\np99 = percentile(base[device], 99);\n\
      for device, day in windows(24h):\n  out = sum(orig_bytes) by device,day;\n  if out > p99:\n    dom\
      \ = dns.log destinations(device,day);\n    if entropy(dom) > 3.5 or whois_age(dom) < 60d:\n    \
      \  alert(device, out, p99, dom, whois_age, dns_entropy)."
- question: Are there fixed-interval or jittered-interval outbound uploads from a device consistent with
    interval image capture, identifiable via FFT/autocorrelation periodicity analysis after whitelisting
    known-good periodic traffic?
  context: Supports Collection by detecting the rhythmic upload pattern produced by apps that capture
    images at set intervals and beacon them out. Apply FFT/autocorrelation periodicity detection to per-device/per-destination
    connection timing, with whitelist suppression of known benign periodic traffic (push, sync, telemetry),
    to flag fixed- or jittered-interval media uploads per BAYWATCH and the periodic-traffic modeling of
    Haffey et al. A strong periodic peak to a non-whitelisted destination suggests scheduled covert capture-and-upload;
    absence of periodicity does not rule out one-shot or volume-triggered exfiltration covered elsewhere.
  answer_sources: *id002
  range: Last 90 days, with sufficient samples per destination to resolve periodicity.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for device,dst in connection_pairs(conn.log):\n  times = connection_timestamps(device,dst);\n\
      \  spectrum = fft(intervals(times)); ac = autocorrelation(intervals(times));\n  if strong_period(spectrum,\
      \ ac) and dst not in periodic_whitelist:\n    alert(device, dst, dominant_period, jitter, reason='periodic\
      \ upload beacon')."
- question: Is a device or app producing bursts of NXDOMAIN responses, blocked egress connections, or
    HTTP 4xx/5xx upload failures - the failure signature of a covert media-upload app retrying against
    egress controls or DNS sinkholing - even when overall traffic volume looks normal?
  context: Supports Collection by treating upload failures as an independent signal of attempted exfiltration.
    Track per-device rates of NXDOMAIN, blocked egress connections, and HTTP 4xx/5xx upload responses;
    a covert app retrying media upload under egress filtering or DNS sinkholing produces failure bursts
    even when byte volume appears normal. Baseline normal failure rates and alert on statistically significant
    bursts. A positive result reveals exfiltration attempts that controls are partially blocking - a high-value
    lead since the app is actively trying to reach attacker infrastructure; a clean profile argues against
    blocked covert uploads.
  answer_sources: *id002
  range: Last 90 days, hourly aggregation.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "errs = events where type in ['NXDOMAIN','egress_blocked','http_4xx','http_5xx'];\nrate = count(errs)\
      \ by device,app,hour;\nbaseline = historical_rate(device,app);\nif rate > baseline.mean + 3*baseline.std:\n\
      \  alert(device, app, error_types, rate, reason='upload failure burst')."
- question: Do SARIMA forecasting of hourly outbound bytes and an unsupervised autoencoder ensemble over
    per-device volume/frequency/state features flag reconstruction-error outliers indicative of post-capture
    media transfer - and what top-3 features (upload burst size, new destination, off-hours timing) explain
    them?
  context: Supports Collection by modeling normal egress and flagging deviations characteristic of media
    exfiltration. Use SARIMA on hourly outbound bytes to flag spikes against a seasonal forecast, and
    an unsupervised autoencoder ensemble (Kitsune) over per-device volume/frequency/state features to
    flag reconstruction-error outliers, reporting the top-3 contributing features (upload burst size,
    new destination, off-hours timing). This captures multivariate anomalies that single-threshold rules
    miss and works without labeled exfiltration examples. A high reconstruction error tied to a new destination
    and off-hours upload is a strong post-capture-transfer indicator; explainable features speed analyst
    confirmation.
  answer_sources: *id002
  range: Last 90 days for model fit; score hourly.
  queries:
  - technology: SIEM/ML pseudocode
    query: "series = hourly_outbound_bytes(device);\nif sarima(series).residual_spike(today): flag_spike(device);\n\
      X = per_device_features([volume,frequency,state]);\nae = kitsune_autoencoder_ensemble.fit(baseline);\n\
      for device in fleet:\n  err = ae.reconstruction_error(X[device]);\n  if err > outlier_threshold:\n\
      \    alert(device, err, top3_features=[burst_size,new_dst,off_hours])."
- question: Are camera APIs (android.hardware.camera2 / AVCaptureDevice) being invoked while the app has
    been backgrounded for more than 60 seconds, or while the device is locked, with no user tap within
    the preceding 2 seconds - excluding approved apps?
  context: Supports Collection by detecting silent camera capture with no user behind it, the hallmark
    of covert surveillance (PlaceRaider). Trigger alerts from Mobile EDR / OS API-call logs when camera
    API calls occur while the app is backgrounded > 60 seconds or the device is locked with no user tap
    within a 2-second window, excluding allowlisted apps, applying the per-process access attribution
    of OverSight. Legitimate camera use is almost always foreground and immediately preceded by a user
    action; a call without that context strongly implies automated capture. A positive result identifies
    the offending app+device for response; approved apps are excluded to control false positives.
  answer_sources: &id003
  - Mobile EDR logs
  - OS-level API call logs
  - Application lifecycle event logs
  - 'NAI: High-value target mobile devices (e.g., executive leadership, system administrators) with EDR
    agents installed'
  range: Last 90 days, with event-level correlation to UI/lifecycle and input events.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for call in api_calls where api in ['android.hardware.camera2','AVCaptureDevice']:\n  if call.app\
      \ in approved_camera_apps: continue;\n  bg = app_state(call.app, call.time)=='background' and background_duration\
      \ > 60s;\n  locked = device_lock_state(call.time)=='locked';\n  tap = user_input_within(call.app,\
      \ call.time, 2s);\n  if (bg or locked) and not tap:\n    alert(device, call.app, call.api, state=app_state,\
      \ locked, reason='no-interaction camera capture')."
- question: Is a camera session immediately followed by a burst write to media/cache/temp/staging paths
    and then a network transfer, all attributed to the same app identity - the capture-store-exfiltrate
    chain?
  context: Supports Collection by reconstructing the full capture-to-exfiltration sequence from a single
    app, providing high-confidence evidence rather than an isolated indicator. Alert when a camera session
    is followed by a burst write to media/cache/temp/staging paths and a subsequent outbound network transfer
    from the same app identity, applying the source->sink correlation of TaintDroid. Observing all three
    stages tied to one UID is strong proof the app captured media and is moving it off-device. A positive
    result is an escalation-worthy chain; partial matches (capture + write without transfer) still merit
    monitoring for delayed exfiltration.
  answer_sources: *id003
  range: Last 90 days, with event-centered correlation across the capture->write->transfer chain per app
    UID.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "cam = events where type=='camera_session';\nfor s in cam:\n  write = file_create where uid==s.uid\
      \ and path in [media,cache,temp,staging] and time in [s.end, s.end+T];\n  net  = conn.log where\
      \ app==s.app and time in [s.end, s.end+T];\n  if write and net:\n    alert(device, s.app, s.uid,\
      \ ordered=[s, write, net], reason='capture->write->exfil chain')."
- question: For each app, is the time delta between the last user-input event and a camera API call beyond
    the 99.9th percentile of that app's normal tap-to-capture latency - indicating capture not driven
    by user interaction?
  context: Supports Collection as the statistical complement to the deterministic 2-second tap-to-API
    rule, catching covert capture whose latency profile differs from genuine user-driven recording (PlaceRaider's
    no-interaction capture profile). Baseline per-app time deltas between user-input events and camera
    API calls, then alert when a delta exceeds the 99.9th percentile for that app. Where the fixed 2-second
    rule may miss apps with naturally longer latencies, the per-app percentile adapts to each app's normal
    behavior. A positive result flags a camera call abnormally decoupled from user input; a normal delta
    is consistent with user-initiated capture.
  answer_sources: *id003
  range: Last 90 days for per-app baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = per_app_delta(user_input -> camera_api);  # distribution\np999 = percentile(base[app],\
      \ 99.9);\nfor call in camera_api_calls:\n  d = time(call) - last_user_input(call.app, before=call.time);\n\
      \  if d > p999:\n    alert(device, call.app, delta=d, p999, reason='input-to-capture delta outlier')."
- question: Is an app generating bursts of camera-open failures or permission-denied events - the signature
    of repeated covert open attempts while backgrounded or locked - even when no camera session ever completes?
  context: Supports Collection by detecting attempted covert capture that controls or OS policy are blocking,
    which leaves no completed session but does leave error trails. Track per-app rates of camera-open
    failures and permission-denied events as a distinct signal; repeated covert open attempts while backgrounded/locked
    produce failure bursts even when a session never completes. Baseline normal rates and alert on significant
    bursts. A positive result reveals an app persistently trying to access the camera without success
    - a strong intent indicator worth investigating; a clean profile argues against blocked covert attempts.
  answer_sources: *id003
  range: Last 90 days, hourly aggregation.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "errs = events where type in ['camera_open_failed','camera_permission_denied'];\nrate = count(errs)\
      \ by app,hour;\nbaseline = historical_rate(app);\nif rate > baseline.mean + 3*baseline.std:\n  alert(device,\
      \ app, rate, recent_state=app_state, reason='camera-open failure burst')."
- question: Does a sequence model (HMM or LSTM next-event) over app lifecycle and camera events flag a
    low-likelihood sequence - especially a background-to-camera-open transition - and report the top-3
    contributing events of the capture subsequence?
  context: Supports Collection by learning normal app lifecycle->camera event sequences and flagging the
    rare orderings that covert capture produces. Train an HMM or LSTM next-event model on app lifecycle
    and camera events and alert on low-likelihood sequences, especially background-to-camera-open transitions,
    using API-transition modeling from MaMaDroid and step-level sequence diagnosis from DeepLog so the
    alert localizes and reports the top-3 contributing events of the capture subsequence. This catches
    anomalous capture flows that fixed rules and single-feature stats miss. A low-likelihood background-to-camera
    sequence is a strong covert-capture indicator with built-in explainability for triage.
  answer_sources: *id003
  range: Last 90 days for model training; score sessions as they occur.
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = train_hmm_or_lstm(app_lifecycle_and_camera_events);  # MaMaDroid transitions + DeepLog\
      \ diagnosis\nfor seq in app_event_sequences:\n  ll = model.sequence_loglik(seq);\n  if ll < low_likelihood_threshold\
      \ or has_transition(seq,'background->camera_open'):\n    alert(device, seq.app, ll, top3_events=model.localize(seq))."
