name: 'T1426: System Information Discovery'
id: ec25219b-0cbd-4e12-ba63-2d6d3872864a
description: 'Investigate possible System Information Discovery on managed Android and iOS devices, where
  an adversary''s app or implant programmatically reads operating system and hardware attributes (for
  example Android android.os.Build fields such as MODEL, MANUFACTURER, HARDWARE and VERSION.SDK_INT, TelephonyManager
  and Settings.Secure identifier calls, system properties, or iOS UIDevice model and systemVersion) to
  fingerprint the device and shape follow-on behavior. This playbook helps an analyst pursue two complementary
  evidence streams: on-device telemetry (OS API Execution from logcat / iOS unified log and MTD/EMM agents)
  showing bursts of system-info API calls, taint-style identifier source->sink flows, and execution branching;
  and network telemetry (Zeek conn/http/ssl/dns) showing small outbound payloads, high-entropy or DGA
  domains, rare JA3/JA4 fingerprints, direct-to-IP beaconing, and low-reputation destinations that indicate
  exfiltration of discovered device details. It pairs deterministic symbolic-logic rules, per-device and
  per-app statistical baselines, and machine-learning classifiers so an analyst can distinguish benign
  telemetry from reconnaissance used to decide whether to fully infect a target or trigger specific malicious
  actions.'
type: technique
related:
- tactic_id: TA0032
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are any mobile devices sending small outbound payloads to known-bad or suspicious destinations,
    or using rare TLS client fingerprints, shortly after an on-device system-information API burst, consistent
    with exfiltration of discovered device details?
  context: 'Supports the Discovery tactic by catching the network ''sink'' that follows a System Information
    Discovery ''source'': once an app reads OS/hardware attributes, those small details are often beaconed
    out to shape follow-on behavior. Query Zeek dns.log, http.log and ssl.log on a tight cadence (about
    every 15 minutes) for mobile source IPs where the destination appears on a C2/malware intel list,
    the JA3/JA4 TLS fingerprint matches a known reconnaissance or C2 client stack, or the domain is newly
    registered and paired with an anomalous User-Agent. Treat a small outbound payload (roughly 100 bytes
    to 5 KB) that follows a device/system-info API burst as a deterministic source->sink information flow.
    A positive match (destination, fingerprint, or list hit) is a high-severity alert; surface the destination,
    fingerprint, and which list matched in the alert text. Do not discard failed attempts: DNS NXDOMAIN,
    HTTP 4xx, or blocked egress are a distinct beacon-failure signal worth keeping for triage. Citations:
    [JA3](https://github.com/salesforce/ja3), [JA4+](https://github.com/FoxIO-LLC/ja4), [TaintDroid](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf).'
  answer_sources: &id001
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Network egress points for corporate and guest Wi-Fi, VPN concentrators, enterprise DNS resolvers,
    and secure web gateways where mobile device traffic is inspected.'
  range: Last 90 days, with a rolling 15-minute detection window and event-centered correlation to any
    preceding system-info API burst.
  queries:
  - technology: Zeek/SIEM Rule pseudocode
    query: "flows = join(dns.log, http.log, ssl.log) where src_ip in mobile_fleet;\nmatch = flows where\
      \ dest in c2_malware_list\n  or ja3_or_ja4 in known_recon_c2_fingerprints\n  or (domain.newly_registered=true\
      \ and user_agent anomalous);\nexfil = match where 100 <= sent_bytes <= 5120 and preceded_by(system_info_api_burst,\
      \ within=10m);\nfailures = flows where dns_rcode='NXDOMAIN' or http_status in 4xx or egress_blocked=true;\n\
      alert HIGH on exfil; emit destination, ja3_ja4, matched_list, sent_bytes;\nalert BEACON_FAILURE\
      \ on failures separately."
- question: Does a mobile device's recent network behavior deviate from its own 30-day baseline in ways
    that suggest exfiltration of discovered system information, such as high-entropy DNS/URI strings,
    rare TLS fingerprints, or small periodic payloads to new destinations?
  context: 'Reinforces Discovery detection when there is no clean intel match by scoring each device against
    its own normal behavior. Compute hourly per-device risk scores from deviations off a 30-day baseline:
    high-entropy DNS or URI strings above the 98th percentile (Shannon entropy > 4.0), JA3/JA4 fingerprints
    used by under 1% of the fleet, small outbound payloads (100 bytes to 5 KB) to newly-seen destinations,
    and low-variance inter-arrival times that indicate beaconing. Include volume, frequency and state
    features (sent bytes, packet counts, success versus blocked connection counts) and derive thresholds
    per fleet from the empirical percentile distribution rather than fixed magic numbers. Alert when the
    aggregate score crosses threshold within a 15-minute window and list the top-3 contributing features
    so an analyst can immediately see whether entropy, rarity, payload size, or timing drove the score.
    A high score on a device that just performed system-info API reads strongly suggests reconnaissance
    exfiltration; a low score argues for benign telemetry. Citations: [JA4+](https://github.com/FoxIO-LLC/ja4),
    [Andromaly](https://link.springer.com/article/10.1007/s10844-010-0148-x).'
  answer_sources: *id001
  range: Last 90 days, scored hourly against a rolling 30-day per-device baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = per_device_profile(window=30d);\nfeat = hourly_features(device): {dns_uri_entropy,\
      \ ja3_ja4_fleet_share, small_payload_to_new_dest,\n  interarrival_variance, sent_bytes, packets,\
      \ blocked_vs_success};\nscore = sum(zscore_or_percentile_dev(feat, baseline));\nflag entropy>p98(>4.0),\
      \ ja3_ja4 fleet_share<1%, payload in [100,5120] to new_dest,\n  low interarrival_variance;\nalert\
      \ when score > fleet_threshold within 15m; emit top3_contributing_features."
- question: When DGA, malicious-TLS, and connection-anomaly machine-learning models are run over a device's
    DNS, TLS, and connection telemetry, do at least two of them (or one model plus a symbolic match) independently
    flag the same device in a correlated window?
  context: 'Adds ML corroboration to the Discovery picture for stealthy exfiltration that evades single
    rules. Run a DGA classifier on dns.log, a malicious-TLS-fingerprint classifier on ssl.log JA3/JARM,
    and an Isolation Forest or one-class model over conn.log features (bytes, duration, protocol, port)
    trained on benign-only fleet traffic. Each model must emit its top-3 contributing features so verdicts
    stay explainable. To control false positives, trigger a high-severity incident only when at least
    two models agree on the same device in a correlated time window, or when one model is corroborated
    by a symbolic intel/fingerprint match. Convergence of multiple independent models on a device that
    recently read system information is strong evidence of reconnaissance exfiltration; a lone model hit
    warrants watch-listing rather than immediate escalation. Citations: [DL Android review](https://arxiv.org/pdf/2103.05292),
    [mobile malware survey](https://arxiv.org/pdf/1801.02837).'
  answer_sources: *id001
  range: Last 90 days for scoring, with benign-only training windows and correlated multi-model time windows.
  queries:
  - technology: ML pipeline pseudocode
    query: 'dga = dga_classifier(dns.log);

      tls = malicious_tls_model(ssl.log.ja3, ssl.log.jarm);

      conn = isolation_forest(conn.log[bytes,duration,protocol,port], train=benign_only_fleet);

      for each model: emit top3_features;

      hits = models_flagging(device, window=correlated);

      alert HIGH when count(hits) >= 2 or (count(hits)>=1 and symbolic_match(device));

      emit device, model_verdicts, top3_features_per_model.'
- question: Is any single application issuing a rapid burst of sensitive system-info or device-identifier
    API reads, or reading a device identifier and then immediately opening an outbound network connection,
    on Android or iOS?
  context: 'Captures the on-device ''source'' of System Information Discovery directly in OS API Execution
    telemetry, which is the most direct evidence for the Discovery tactic. Maintain a deny/allow list
    of sensitive system-info and identifier APIs (android.os.Build.* reads, TelephonyManager.getDeviceId/getSubscriberId,
    Settings.Secure.ANDROID_ID, getSystemProperty; iOS UIDevice systemVersion/model) drawn from ranked
    malware-API sets. Alert deterministically when a single app issues at least 8 distinct such reads
    within 5 seconds, or when any device-identifier read is followed by an outbound network flow within
    10 seconds (a taint-style source->sink pattern). Tune the burst threshold per app baseline, but never
    delete the hard rule, since it is the deterministic floor. Record which specific APIs fired and the
    network destination in the alert. A burst from a utility app that has no reason to enumerate hardware,
    or an identifier read wired straight to egress, is high-confidence reconnaissance; routine single
    reads by system or telemetry apps are expected. Citations: [DroidAPIMiner](https://link.springer.com/chapter/10.1007/978-3-319-04283-1_6),
    [DREBIN](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf), [TaintDroid](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf).'
  answer_sources: &id002
  - OS API Execution (DC0021)
  - android:logcat
  - iOS:unifiedlog
  - MTD/EMM app behavior telemetry
  - 'NAI: Mobile Threat Defense (MTD)/EMM agents and on-device instrumentation that record application
    API invocations (android.os.Build, TelephonyManager, Settings.Secure, UIDevice) and correlate them
    with subsequent code paths and network activity.'
  range: Last 90 days, evaluated continuously with 5-second burst windows and 10-second source->sink windows.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "sensitive = {android.os.Build.* , TelephonyManager.getDeviceId, getSubscriberId,\n  Settings.Secure.ANDROID_ID,\
      \ getSystemProperty, UIDevice.systemVersion, UIDevice.model};\nevents = os_api_exec where api in\
      \ sensitive group by app;\nburst = app where count(distinct api) >= 8 within 5s;\nsink = app where\
      \ identifier_read followed_by outbound_net_flow within 10s;\nalert when burst or sink; emit app,\
      \ fired_apis, destination."
- question: Does an application's rate of system-info API calls, or its sequence of API-to-API transitions
    (for example android.os.Build reads moving directly to a network send), deviate from its own 30-day
    behavioral baseline?
  context: 'Strengthens Discovery detection by modeling each app''s normal API behavior rather than a
    fixed threshold. Build per-app baselines of system-info API call counts per minute and of API-to-API
    transition probabilities, modeling call sequences as a Markov chain over package/family-abstracted
    states, and flag low-probability transitions such as an android.os.Build read leading directly to
    a network send. Track volume and frequency features (calls/min, distinct APIs touched) and state (success
    versus SecurityException/permission-denied). Alert when an app''s hourly system-info call rate exceeds
    its 30-day 99th percentile or a known malware-frequency threshold, and list the top-3 deviating features.
    A sudden spike in enumeration rate, or a rare source->sink transition, indicates the app is fingerprinting
    the device for decision-making; stable in-baseline behavior argues benign. Citations: [MaMaDroid](https://arxiv.org/pdf/1612.04433),
    [Andromaly](https://link.springer.com/article/10.1007/s10844-010-0148-x).'
  answer_sources: *id002
  range: Last 90 days, scored hourly against a rolling 30-day per-app baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = per_app_profile(window=30d): {sysinfo_calls_per_min, distinct_apis,\n  api_transition_matrix(markov,\
      \ family_abstracted), success_vs_securityexception};\nrate = hourly sysinfo_call_count(app);\nrare_transition\
      \ = transition(app) where prob < low_threshold (e.g., Build_read -> net_send);\nalert when rate\
      \ > p99(baseline) or rare_transition present;\nemit app, top3_deviating_features."
- question: When an app's ordered API method-call sequence is scored by a sequence/static classifier,
    is it labeled as reconnaissance, and is that verdict corroborated by the deterministic burst or source->sink
    rule?
  context: 'Provides explainable ML verdicts on the on-device Discovery ''source''. Score the ordered
    API method-call sequence with an embedding+CNN sequence model and/or a linear-SVM static-feature classifier
    whose weights are explainable; optionally relate app/API/device/IMEI in a heterogeneous information
    network for fleet-scale verdicts. Require the model to surface its top-3 contributing API features
    in the alert so an analyst can see which calls drove the classification. Escalate to high severity
    only when the ML verdict is corroborated by the symbolic burst or source->sink rule, keeping standalone
    ML hits as watch-list candidates. A malicious verdict driven by Build/identifier reads feeding network
    sinks, confirmed by the hard rule, is strong reconnaissance evidence; an uncorroborated verdict needs
    analyst review against the app''s known function. Citations: [Karbab et al.](https://arxiv.org/pdf/1712.08996),
    [DREBIN](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf), [AiDroid](https://arxiv.org/pdf/1811.01027),
    [systematic DL review](https://arxiv.org/pdf/2103.05292).'
  answer_sources: *id002
  range: Last 90 days for scoring, with periodic retraining on labeled benign and malicious app corpora.
  queries:
  - technology: ML pipeline pseudocode
    query: 'seq = ordered_api_method_calls(app);

      v1 = embedding_cnn_sequence_model(seq);

      v2 = linear_svm_static_features(app);  // explainable weights

      hin = optional heterogeneous_network(app, api, device, imei);

      verdict = combine(v1, v2, hin); emit top3_api_features;

      alert HIGH when verdict=recon and (symbolic_burst(app) or source_sink(app));

      else watchlist; emit app, verdict, top3_api_features.'
