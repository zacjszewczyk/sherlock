name: 'T1544: Ingress Tool Transfer'
id: cbae00dd-0922-4a00-b813-e99768ebd4c5
description: 'This playbook helps an analyst investigate potential Ingress Tool Transfer (T1544) against
  corporate-managed mobile devices (Android and iOS), where an adversary transfers tools, payloads, or
  other files from an external system onto a compromised device to facilitate follow-on actions. It guides
  the investigation across three complementary evidence angles: (1) identifying inbound file transfers
  whose file attributes (MIME type, filename, entropy), source reputation (domain age, threat intelligence),
  and network/TLS characteristics (self-signed or invalid certificates, anomalous JA3/JA4 client fingerprints)
  collectively indicate an unauthorized tool; (2) detecting network sessions whose inbound data-transfer
  volume is a statistical outlier versus the device''s own history and its peer group, to non-allowlisted
  destinations; and (3) correlating, on-device, a managed application''s retrieval of content from a non-baselined
  external source with the immediate local creation of a new artifact (executable, archive, DEX/JAR, native
  .so, dylib-like resource, overlay asset, or opaque payload) and any subsequent dynamic loading or execution
  while the app is backgrounded or the device is locked. Together these detections combine deterministic
  symbolic-logic floor rules, statistical baselining, and machine-learning anomaly models to produce defensible,
  granular alerts for a SOC analyst.'
type: technique
related:
- tactic_id: TA0037
  tactic_name: Command And Control
