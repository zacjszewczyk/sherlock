- question: Does any managed app's API/behavior sequence (network API -> file I/O -> dynamic load/exec)
    deviate from its benign baseline when modeled as Markov-chain transitions, and which transitions drive
    the deviation?
  context: 'This machine-learning method models the full download-then-load behavior chain rather than
    individual events, supporting Command and Control by detecting the characteristic sequence of an ingress-tool-transfer
    payload coming to life. Following MaMaDroid, the analyst models the app''s API/behavior sequence (network
    API -> file I/O -> dynamic load/exec) using Markov-chain transition features over package/family abstractions
    and classifies deviations from benign baselines. Temporally consistent training and drift monitoring
    (TESSERACT) keep the model accurate over time, and the top-3 contributing transitions/features per
    alert are surfaced via SHAP. An app whose transition profile shifts toward network->file-write->dynamic-load,
    unlike its benign baseline, is a strong tool-transfer lead; the interpretable transitions help the
    analyst confirm whether the behavior chain is genuinely malicious or an explainable app update flow.
    Source citations: [MaMaDroid, Mariconti et al.](https://arxiv.org/abs/1612.04433); [TESSERACT, Pendlebury
    et al.](https://www.usenix.org/system/files/sec19-pendlebury.pdf); [SHAP Integration in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
