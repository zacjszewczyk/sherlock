questions:
- question: Has any application that is NOT on the corporate application allowlist been granted the BIND_NOTIFICATION_LISTENER_SERVICE
    permission, or has an allowlisted application been updated to a version signed with a new, non-matching
    code-signing certificate hash while holding this permission?
  context: 'Notification-listener access is a rare, user-granted special-access permission, and on a managed
    fleet the set of legitimate listeners is small and known. For the Credential Access tactic this is
    the highest-fidelity precondition for OTP/MFA interception: a listener can read the content of any
    notification, including authenticator and SMS codes. The analyst queries MDM logs for every app holding
    BIND_NOTIFICATION_LISTENER_SERVICE, joins to the corporate allowlist on package name AND signing-certificate
    hash, and fires a HIGH-severity deterministic alert when either field fails to match - including the
    case where an allowlisted package re-appears signed with a new certificate (a classic trojanized-update
    or repackaging indicator). Include device ID, user, app name, package name, and which field failed
    (package vs cert). A positive result warrants immediate triage and likely MDM quarantine; a negative
    result only means no unknown listener was seen, so retain this rule even after adding ML. References:
    [NotificationListenerService](https://developer.android.com/reference/android/service/notification/NotificationListenerService).'
  answer_sources:
  - MDM.PermissionGrantLogs
  - MDM.AppInventoryLogs
  - Corporate.AppAllowlist
  - 'NAI: Centralized Mobile Device Management (MDM) platform; Mobile Threat Defense (MTD) cloud console;
    Internal repository (e.g., Git, database) hosting the application package name and certificate hash
    allowlist.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "mdm_permission_grants\n| where permission == \"BIND_NOTIFICATION_LISTENER_SERVICE\"\n| join\
      \ kind=leftouter corporate_app_allowlist on package_name\n| where allowlist.package_name == \"\"\
      \  // package not allowlisted\n   or allowlist.cert_hash != app.cert_hash  // re-signed / cert drift\n\
      | set failing_field = iff(allowlist.package_name==\"\", \"package\", \"cert\")\n| set severity =\
      \ \"high\"\n| project device_id, user, app_name, package_name, app.cert_hash, failing_field\n| alert"
- question: Among applications holding notification-listener access that are not allowlisted, which are
    statistically rare across the managed fleet and exhibit a high-risk permission combination (e.g.,
    notification access co-occurring with RECEIVE_SMS, INTERNET, and READ_CONTACTS)?
  context: 'Mass-distributed legitimate apps appear on many devices; bespoke spyware or trojanized apps
    appear on very few. For Credential Access, rare prevalence plus a malware-indicative permission set
    sharply raises the probability that a listener exists to steal OTP/MFA codes. The analyst computes
    install prevalence across managed devices and flags apps present on <1% of devices or below the 5th-percentile
    install frequency, then ranks each app''s permission set with significant-permission scoring - the
    co-occurrence of notification access with RECEIVE_SMS, INTERNET, and READ_CONTACTS is strongly malware-indicative.
    Computing the Jaccard distance between the app''s permission set and the mean set for its store category
    surfaces permission drift, and the alert should list the top-3 highest-weight permissions driving
    the score so the analyst can judge relevance quickly. References: [Identification of Significant Permissions](https://arxiv.org/abs/2103.00643).'
  answer_sources:
  - MDM.PermissionGrantLogs
  - MDM.AppInventoryLogs
  - Corporate.AppAllowlist
  - 'NAI: Centralized Mobile Device Management (MDM) platform; Mobile Threat Defense (MTD) cloud console;
    Internal repository (e.g., Git, database) hosting the application package name and certificate hash
    allowlist.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "mdm_app_inventory\n| where has_permission(\"BIND_NOTIFICATION_LISTENER_SERVICE\") and not\
      \ in_allowlist\n| summarize device_count=dcount(device_id) by package_name, permission_set\n| extend\
      \ prevalence = device_count / total_managed_devices\n| where prevalence < 0.01 or prevalence < percentile(prevalence,\
      \ 5)\n| extend risk = sig_perm_score(permission_set,\n    weights={RECEIVE_SMS, INTERNET, READ_CONTACTS,\
      \ NOTIFICATION_LISTENER})\n| extend jaccard_drift = jaccard_distance(permission_set, category_mean_set)\n\
      | project package_name, prevalence, risk, jaccard_drift, top3_permissions\n| order by risk desc"
- question: When an unvetted application with notification access is scored by an explainable classifier
    over static features (permissions, API calls, intents, URLs, signer/store age, obfuscation flags),
    does it exceed the malicious-probability threshold, and which features drive that verdict?
  context: 'Symbolic and statistical checks can miss novel or lightly-obfuscated malware, so an explainable
    ML classifier adds coverage for Credential Access by flagging apps whose overall feature profile resembles
    known SMS-stealers and banking trojans. The analyst scores app metadata with a linear SVM over static
    features (which yields per-app top-feature explanations) or a gradient-boosted/RF model over permissions,
    signer age, store age, and obfuscation flags, and can attribute a likely family/category trained on
    CICAndMal/CICMalDroid. Apps with P(malicious) > 0.85 are watchlisted or quarantined via the MDM API,
    and the alert MUST list the top-3 contributing features so the verdict is auditable. Use time-split,
    drift-aware evaluation and periodic retraining to keep precision honest as the app ecosystem shifts.
    References: [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf); [Identification
    of Significant Permissions](https://arxiv.org/abs/2103.00643); [El Fiky et al.](https://arxiv.org/abs/2107.01927);
    [TESSERACT](https://arxiv.org/abs/1807.07838).'
  answer_sources:
  - MDM.PermissionGrantLogs
  - MDM.AppInventoryLogs
  - Corporate.AppAllowlist
  - 'NAI: Centralized Mobile Device Management (MDM) platform; Mobile Threat Defense (MTD) cloud console;
    Internal repository (e.g., Git, database) hosting the application package name and certificate hash
    allowlist.'
  range: Last 90 days
  queries:
  - technology: ML/Classifier pseudocode
    query: "for app in apps_with_notification_access_unvetted:\n    x = static_features(app)  # permissions,\
      \ API calls, intents, URLs, signer/store age, obfuscation\n    p = classifier.predict_proba(x) \
      \       # linear SVM / GBM / RF\n    if p > 0.85:\n        family = attribute_family(x)       #\
      \ SMS-malware, banking\n        alert(app, p, top3=explain(classifier, x), family)\n        mdm_api.quarantine(app)\n\
      # time-split, drift-aware eval; retrain periodically"
- question: Does any application holding notification-listener access initiate an outbound connection
    to an IP/domain on a threat-intelligence feed, or present a JA3/JA3S TLS fingerprint associated with
    known malware - or, via taint logic, send notification/SMS-derived content to any network sink from
    the background?
  context: 'After intercepting OTP/MFA content, a credential-access actor must move it off the device,
    so correlating the population of notification-access apps with their network egress is decisive. The
    analyst joins MDM logs (apps with notification access) to Zeek conn.log/dns.log/ssl.log on device
    IP and time, checks each destination IP/SNI against threat-intel feeds, and matches JA3/JA3S against
    a malicious-fingerprint blocklist, firing a critical alert on any hit. Crucially, applying source-to-sink
    dataflow (taint) logic means that if notification- or SMS-derived content reaches a network sink from
    a backgrounded listener, the analyst alerts regardless of destination reputation - because the data
    flow itself is the violation. Primary logic runs on first-party network logs and does not require
    external lookups to fire. References: [TaintDroid](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf).'
  answer_sources:
  - MDM.PermissionGrantLogs
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - ThreatIntel.Feed
  - 'NAI: Network egress points including corporate VPN concentrators, WiFi access points, and Cloud Access
    Security Broker (CASB) proxies where Zeek sensors are deployed; SIEM platform containing correlated
    MDM and network logs.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "mdm_notif_apps = apps_with(\"BIND_NOTIFICATION_LISTENER_SERVICE\")\njoin conn.log, dns.log,\
      \ ssl.log on device_ip, time_window\nfor flow in flows_from(mdm_notif_apps):\n    if flow.dest_ip\
      \ in TI_feed or flow.sni in TI_feed\n       or flow.ja3 in malware_ja3 or flow.ja3s in malware_ja3s:\n\
      \        alert(\"critical\", flow)\n    if taint(notification_or_sms_content) reaches network_sink\n\
      \       and app.state == background:\n        alert(\"critical\", flow)  # regardless of dest reputation"
- question: For each notification-access app, do its DNS queries show a Shannon-entropy spike above its
    30-day baseline (DGA), an elevated NXDOMAIN/failed-connection rate, or low-volume periodic beaconing
    detectable via FFT of connection timestamps?
  context: 'C2 channels used to exfiltrate intercepted codes often rely on algorithmically-generated domains,
    exhibit resolution failures, and beacon on a regular cadence. For Credential Access these statistical
    signatures expose covert egress that reputation lists miss. The analyst computes the Shannon entropy
    of domains queried by each app in a 5-minute sliding window and flags spikes above the 95th percentile
    of the app''s 30-day baseline as DGA-like; profiles failure state explicitly by tracking NXDOMAIN
    rate and the count of failed/blocked connections (Zeek conn.log history lacking S/h completion) as
    distinct signals; and applies FFT/periodicity analysis to connection timestamps to surface low-volume
    periodic heartbeats characteristic of C2. Percentile baselines are re-fit on rolling windows to resist
    drift and avoid alert fatigue. References: [TESSERACT](https://arxiv.org/abs/1807.07838).'
  answer_sources:
  - MDM.PermissionGrantLogs
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - ThreatIntel.Feed
  - 'NAI: Network egress points including corporate VPN concentrators, WiFi access points, and Cloud Access
    Security Broker (CASB) proxies where Zeek sensors are deployed; SIEM platform containing correlated
    MDM and network logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per app, per 5-min window:\n  ent = shannon_entropy(dns.query)\n  if ent > p95(app.baseline_30d.entropy):\
      \ flag \"DGA\"\n  nxd_rate = count(dns.rcode==NXDOMAIN)/count(dns)\n  fail_conn = count(conn.history\
      \ not contains \"S\" or \"h\")\n  if nxd_rate or fail_conn elevated: flag \"failure-state\"\n  spec\
      \ = FFT(conn.ts_sequence)\n  if dominant_period(spec): flag \"beacon\"\n# re-fit percentile baselines\
      \ on rolling windows"
- question: When Zeek conn.log feature vectors for a backgrounded notification-access app are scored by
    a sequence anomaly model (LSTM-autoencoder / DeepLog-style) trained on benign mobile behavior, do
    any flows produce high reconstruction error, and which features are most anomalous?
  context: 'Unknown or polymorphic C2 may evade signatures and simple baselines, so a learned model of
    normal mobile network behavior provides Credential Access coverage for novel exfiltration. The analyst
    deploys an LSTM-autoencoder or DeepLog-style sequence model trained on benign mobile network/event
    behavior and feeds it Zeek conn.log feature vectors (orig/resp bytes, ratio, duration, proto, one-hot
    history, dest port). High reconstruction error originating from a backgrounded notification-access
    app triggers the response playbook, and behavioral graph models over app-API relations extend coverage
    to brand-new apps with no history. The alert MUST surface the top-3 anomalous features (e.g., bytes-out,
    periodicity, dest port) so the analyst can validate and avoid acting on opaque scores. References:
    [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf); [AiDroid](https://arxiv.org/abs/1811.01027).'
  answer_sources:
  - MDM.PermissionGrantLogs
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - ThreatIntel.Feed
  - 'NAI: Network egress points including corporate VPN concentrators, WiFi access points, and Cloud Access
    Security Broker (CASB) proxies where Zeek sensors are deployed; SIEM platform containing correlated
    MDM and network logs.'
  range: Last 90 days
  queries:
  - technology: ML/Anomaly pseudocode
    query: "model = LSTM_autoencoder(trained_on=benign_mobile_conn)\nfor flow in conn.log where app in\
      \ notif_access_apps and app.state==background:\n    v = features(orig_bytes, resp_bytes, ratio,\
      \ duration, proto_onehot, history_onehot, dest_port)\n    err = model.reconstruction_error(v)\n\
      \    if err > threshold:\n        alert(flow, top3=most_anomalous_features(v))\n# augment with app-API\
      \ behavior graph model for novel apps"
- question: Was a notification from a trusted authenticator or SMS application programmatically dismissed
    by a DIFFERENT notification-access app within 2 seconds of being posted, with no foreground launch
    of the dismissing app?
  context: 'An attacker who reads an OTP also wants to hide that it ever arrived, and a notification listener
    can call cancelNotification/snoozeNotification on any app''s posts. For Credential Access this rapid,
    cross-app, non-interactive dismissal is a strong indicator the code was silently harvested and suppressed
    before the user noticed. The analyst correlates posted and dismissed events by notification ID and
    device ID and alerts when a notification from a trusted authenticator/SMS source is programmatically
    dismissed by a different notification-access app within 2 seconds of posting, with no foreground launch
    of the dismisser. The hard 2-second threshold should be kept (tuned per environment, not removed)
    because human dismissal is almost never that fast for a freshly-posted security code. References:
    [NotificationListenerService](https://developer.android.com/reference/android/service/notification/NotificationListenerService).'
  answer_sources:
  - MTD.NotificationPostedLogs
  - MTD.NotificationDismissedLogs
  - MDM.ApplicationLaunchLogs
  - 'NAI: Mobile Threat Defense (MTD) cloud console; SIEM platform for log correlation.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'join notif_posted, notif_dismissed on notification_id, device_id

      | where posted.source_app in trusted_auth_sms_apps

      | where dismissed.by_app != posted.source_app

      | where dismissed.by_app in notif_access_apps

      | where (dismissed.time - posted.time) <= 2s

      | join kind=anti app_launch on dismissed.by_app within 5s  // no foreground launch

      | alert("high")'
- question: For each app that interacts with notifications, is any dismissal faster than that app's 5th-percentile
    time-to-dismiss - especially for authenticator/messaging sources - and is the dismissal frequency
    or subsequent launch success/failure pattern anomalous?
  context: 'Hard thresholds can be evaded by an attacker who deliberately delays dismissal, so per-app
    statistical profiling of dismissal speed catches abuse that sits just outside a fixed window. For
    Credential Access the analyst computes the median and 5th-percentile time-to-dismiss for each app
    and flags any dismissal faster than the 5th percentile, weighting authenticator/messaging sources
    most heavily. Tracking the frequency (dismissals/min) and the success/fail state of subsequent app
    launches as distinct features distinguishes automated harvesting from normal user behavior, and modeling
    the notification-event stream as log-key sequences lets the analyst flag deviations from the learned
    normal distribution. References: [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
  answer_sources:
  - MTD.NotificationPostedLogs
  - MTD.NotificationDismissedLogs
  - MDM.ApplicationLaunchLogs
  - 'NAI: Mobile Threat Defense (MTD) cloud console; SIEM platform for log correlation.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per app:\n  med = median(time_to_dismiss); p5 = percentile(time_to_dismiss, 5)\nfor dismissal\
      \ in notif_dismissed:\n  if dismissal.latency < p5[dismissal.by_app]:\n      sev = high if dismissal.source\
      \ in auth_msg_apps else medium\n      flag(dismissal, dismiss_rate_per_min, subsequent_launch_state,\
      \ sev)\n# model event stream as log-key sequence; flag distribution deviation"
- question: When the per-device notification-event stream is modeled as sequences (Posted -> Dismissed
    -> App Launched), does an app produce the high-risk pattern Posted -> Dismissed by App B -> No Launch,
    indicating programmatic harvesting?
  context: 'Legitimate use produces recognizable sequences where a user opens an app after a notification;
    silent harvesting breaks that pattern by dismissing without any user launch. For Credential Access,
    training an RNN/LSTM sequence model on normal user behavior sequences lets the analyst flag [Posted
    -> Dismissed by a different App B -> No Launch] as high-probability programmatic OTP harvesting. Abstracted-API
    behavioral modeling adds drift resilience so the model degrades gracefully as apps update, and honest
    time-split evaluation prevents over-optimistic accuracy claims. Alerts MUST name the top-3 sequence
    features (the dismisser package, the post-to-dismiss latency, and the absence of a launch) so an analyst
    can confirm the behavior rather than trust an opaque score. References: [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf);
    [MaMaDroid](https://arxiv.org/abs/1612.04433); [TESSERACT](https://arxiv.org/abs/1807.07838).'
  answer_sources:
  - MTD.NotificationPostedLogs
  - MTD.NotificationDismissedLogs
  - MDM.ApplicationLaunchLogs
  - 'NAI: Mobile Threat Defense (MTD) cloud console; SIEM platform for log correlation.'
  range: Last 90 days
  queries:
  - technology: ML/Sequence pseudocode
    query: "model = LSTM(trained_on=benign_sequences[Posted->Dismissed->Launched])\nfor seq in device.notification_event_sequences:\n\
      \    if matches(seq, [Posted -> DismissedBy(AppB!=source) -> NoLaunch]):\n        p = model.anomaly_score(seq)\n\
      \        if p high: alert(seq, top3=[dismisser_pkg, post_to_dismiss_latency, no_launch])\n# abstracted-API\
      \ modeling for drift; time-split eval"
- question: Was a help-desk ticket containing keywords about a missing sensitive notification (e.g., 'MFA',
    'OTP', '2FA code not received', 'one-time password') created, and within +/-15 minutes on the reporting
    user's device did MDM logs show a new app install or a grant of BIND_NOTIFICATION_LISTENER_SERVICE?
  context: 'Users frequently report ''I never got my code'' tickets, and when such a report coincides
    closely with a fresh app install or notification-access grant on that user''s device, it strongly
    suggests an app is collecting and suppressing their notifications. For the Collection tactic the analyst
    parses help-desk tickets for keywords (MFA, missing notification, 2FA code not received, one-time
    password) and, on match, queries MDM logs for the reporting user''s device for new app installs or
    grants of BIND_NOTIFICATION_LISTENER_SERVICE within +/-15 minutes of ticket creation, alerting if
    an unvetted app or suspicious permission change is found. Because legitimate notification-access grants
    are rare and user-driven, a fresh grant correlated with a missing-OTP report is high-fidelity evidence
    of harvesting. References: [NotificationListenerService](https://developer.android.com/reference/android/service/notification/NotificationListenerService).'
  answer_sources:
  - ServiceNow.IncidentTickets
  - MDM.AppInstallLogs
  - MDM.PermissionGrantLogs
  - 'NAI: Service desk ticketing system (e.g., Jira, ServiceNow); Centralized SIEM platform; MDM/UEM management
    console; User''s managed mobile device.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'tickets

      | where text matches_any("MFA","missing notification","2FA code not received","one-time password","OTP")

      | join mdm_logs on user

      | where mdm.event in ("app_install","grant:BIND_NOTIFICATION_LISTENER_SERVICE")

      | where abs(mdm.time - ticket.time) <= 15m

      | where mdm.app not in allowlist

      | alert'
- question: On a device that generated a missing-OTP ticket, does any non-system app with notification
    access show a background data-transfer volume with a Z-score > 3 versus its 30-day per-user baseline
    (with failed/blocked egress tracked separately)?
  context: 'Once an app harvests notification content, exfiltration shows up as anomalous background data
    transfer. For Collection, anchoring this statistical check to the device that produced a missing-OTP
    ticket sharply narrows the search. The analyst computes the Z-score of each non-system app''s background
    data-transfer volume against its 30-day per-user baseline and flags Z > 3 for any app holding notification
    access. Adding the count of failed/blocked egress attempts as a distinct feature captures attempts
    that were blocked at the proxy but still reveal intent, and re-fitting baselines on rolling windows
    keeps the detector aligned with legitimate behavior changes over time. References: [TESSERACT](https://arxiv.org/abs/1807.07838).'
  answer_sources:
  - ServiceNow.IncidentTickets
  - MDM.AppInstallLogs
  - MDM.PermissionGrantLogs
  - 'NAI: Service desk ticketing system (e.g., Jira, ServiceNow); Centralized SIEM platform; MDM/UEM management
    console; User''s managed mobile device.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for app in device.nonsystem_apps where app.has_notification_access:\n    z = (app.bg_data_volume\
      \ - mean(app.baseline_30d)) / std(app.baseline_30d)\n    if z > 3: flag(app, z, failed_egress_count)\n\
      # scope to devices with missing-OTP tickets; re-fit baselines on rolling windows"
- question: When help-desk tickets are scored by a fine-tuned text classifier for relevance to notification-based
    credential theft, which tickets exceed P>0.90, and what are the top terms and the suspect package's
    top risk features?
  context: 'Keyword matching misses paraphrased or non-English reports, so an NLP classifier improves
    recall for the Collection mission by scoring the semantic relevance of each ticket to notification-based
    credential theft. The analyst fine-tunes a text classifier (e.g., BERT) on ticket subject/body; for
    P>0.90 the ticket is assigned critical priority, the user/device are tagged high-risk, and the symbolic
    and statistical playbooks are triggered automatically. Combining the ticket score with app-side classification
    of the suspect package links the user complaint to a concrete malicious artifact, and the alert MUST
    surface the top-3 ticket terms and the suspect package''s top-3 risk features so the analyst can validate
    the escalation. References: [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf);
    [El Fiky et al.](https://arxiv.org/abs/2107.01927).'
  answer_sources:
  - ServiceNow.IncidentTickets
  - MDM.AppInstallLogs
  - MDM.PermissionGrantLogs
  - 'NAI: Service desk ticketing system (e.g., Jira, ServiceNow); Centralized SIEM platform; MDM/UEM management
    console; User''s managed mobile device.'
  range: Last 90 days
  queries:
  - technology: ML/NLP pseudocode
    query: "model = finetune(BERT, labels=relevant_to_notification_credential_theft)\nfor ticket in helpdesk_tickets:\n\
      \    p = model.predict_proba(ticket.subject + ticket.body)\n    if p > 0.90:\n        set_priority(ticket,\
      \ critical); tag_high_risk(ticket.user, ticket.device)\n        trigger(symbolic_playbook, statistical_playbook)\n\
      \        alert(top3_terms=explain(model,ticket), suspect_pkg_top3=classify_app(pkg))"
- question: Does any app with notification access make a Zeek conn.log outbound connection on a destination
    port off the allowlist of expected ports for its app category, and does the connection history show
    retransmissions (R) with large orig_bytes or incomplete/failed handshakes?
  context: 'Exfiltration of collected notification data frequently uses non-standard ports or shows transport-level
    anomalies. For the Collection tactic the analyst alerts on any conn.log outbound connection from a
    notification-access app whose id.resp_p is not on the allowlist of expected ports for that app''s
    category, then inspects the history field: retransmissions (R) combined with large orig_bytes elevate
    severity, while incomplete/failed handshakes are profiled as a distinct failure-state signal (blocked
    but attempted). Applying taint source-to-sink logic means notification-derived data reaching any sink
    alerts independently of port reputation. The primary logic uses first-party network logs only, so
    it fires without external enrichment. References: [TaintDroid](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf).'
  answer_sources:
  - Zeek conn.log
  - MDM.PermissionGrantLogs
  - MDM.ApplicationStateLogs
  - 'NAI: Network data collection points such as VPN concentrators, corporate WiFi controllers, and CASB
    proxies; SIEM platform for log correlation and analysis.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for c in conn.log where c.app in notif_access_apps:\n    if c.id.resp_p not in expected_ports[c.app.category]:\n\
      \        sev = high if (\"R\" in c.history and c.orig_bytes large) else medium\n        if handshake_incomplete(c.history):\
      \ flag \"failure-state\"\n        alert(c, sev)\n    if taint(notification_content) reaches sink:\
      \ alert(c)  # independent of port"
- question: For each notification-access app, does its hourly outbound orig_bytes exceed its own 99th-percentile
    30-day history, or does its outbound/inbound byte ratio exceed its peer-group 99th percentile - escalating
    if MDM confirms the app was backgrounded?
  context: 'Bulk collection of notification data produces volume and directionality anomalies that baselining
    exposes. For Collection the analyst baselines hourly outbound orig_bytes and the outbound/inbound
    ratio (orig_bytes/resp_bytes) per notification-access app, and alerts when hourly volume exceeds the
