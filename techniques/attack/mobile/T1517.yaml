name: 'T1517: Access Notifications'
id: c65ec04e-f3a5-4b92-82c9-3fb23caa1dbf
description: 'Investigate adversary abuse of Android notification access (the BIND_NOTIFICATION_LISTENER_SERVICE
  special permission) to intercept, harvest, suppress, or act on sensitive content delivered in OS and
  application notifications - most critically one-time passcodes, MFA/2FA codes, and OTPs sent over SMS,
  email, or authenticator apps. This playbook supports two missions: detecting credential-access interception
  of one-time codes, and detecting collection and exfiltration of notification-derived data. It guides
  an analyst to (1) find applications granted notification-listener access outside the corporate allowlist
  or re-signed with a new certificate, and to score/classify those apps by permission risk; (2) correlate
  notification-access apps with outbound network behavior (threat-intel matches, malicious JA3/JA3S, DGA/entropy
  spikes, beaconing, off-allowlist ports, and high-volume background exfiltration) using Zeek conn/dns/ssl
  logs and taint source-to-sink reasoning; (3) detect rapid programmatic dismissal of OTP/MFA notifications
  by a background listener with no corresponding user launch; and (4) correlate help-desk reports of missing
  OTP/MFA notifications with recent installs or permission grants. It blends deterministic symbolic-logic
  rules, statistical baselining, and explainable machine-learning models so an analyst can confirm interception,
  quarantine the offending app via MDM, and scope the impact.'
type: technique
