name: 'T1577: Compromise Application Executable'
id: b7827f87-4587-4c0b-8a5a-972544ad8345
description: 'Hunt for adversary persistence achieved by compromising a legitimate application executable
  on managed Android devices (MITRE ATT&CK T1577), where attackers inject malicious code into trusted
  apps so the apps carry out adversary tasks while in use. This playbook helps an analyst investigate
  the full chain of repackaging tradecraft: cryptographic hash and APK Signature Scheme v2/v3 signer-lineage
  mismatches against the organizational application manifest; Janus (CVE-2017-13156) style appended-DEX
  artifacts and v1-only signing on modern apps; abnormal APK file-size deltas and high-entropy DEX/native
  sections indicating packed or encrypted injected payloads; clone/near-duplicate packages that match
  an official app but carry a different signer or extra components (e.g., Agent Smith); on-device integrity-attestation
  and anti-repackaging self-check failures; trusted-app network behavior inconsistent with baseline (C2/IOC
  contact, DGA-like DNS, volume and failure-rate outliers); and post-update runtime drift in API/permission
  usage or execution while the device is locked or without recent user interaction. It combines deterministic
  symbolic-logic rules, statistical baselining, and explainable machine-learning models so the analyst
  can confirm tampering, quarantine affected devices, and scope fleet-wide repackaging campaigns.'
type: technique
related:
- tactic_id: TA0028
  tactic_name: Persistence
