- question: After an app update, does the post-update API-package transition distribution diverge from
    the app's baseline beyond a derived threshold (e.g., count/min of new transitions)?
  context: 'Even without a single disallowed API, a grafted payload shifts the overall pattern of API
    usage, so for Persistence modeling API-package transition probabilities quantifies behavioral drift
    after a replacement. The analyst models per-app API package transition probabilities (MaMaDroid-style)
    and alerts when the post-update transition distribution diverges from baseline beyond a derived threshold,
    such as a count/min of newly-observed transitions. Significant divergence after an update suggests
    new code paths were introduced; a distribution matching baseline argues the update behaved like the
    known-good app. This statistical signal corroborates the deterministic allowlist rule and the ML stimulation
    approach below. Reference(s): [MaMaDroid](https://arxiv.org/abs/1612.04433).'
