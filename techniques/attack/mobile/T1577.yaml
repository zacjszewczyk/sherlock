- question: Does a replaced or updated app invoke APIs or permissions outside its known-good allowlist
    (e.g., dynamic code loading, SMS, accessibility), especially while device_locked=true or recent_user_interaction=false?
  context: A payload grafted into a trusted app reveals itself at runtime through new capability usage,
    so for Persistence an allowlist of expected APIs/permissions exposes behavior the legitimate build
    never had. The analyst maintains a per-app allowlist of expected APIs/permissions from the known-good
    build and alerts when a replaced app invokes APIs (e.g., dynamic code loading, SMS, accessibility
    services) or permissions outside that allowlist -- with heightened severity when execution occurs
    while device_locked=true or recent_user_interaction=false, since covert background activity is a hallmark
    of grafted payloads. A disallowed API call under lock/no-interaction is a strong runtime indicator
    of compromise; activity within the allowlist during normal use lowers suspicion. Keep this allowlist
    rule as the deterministic floor.
