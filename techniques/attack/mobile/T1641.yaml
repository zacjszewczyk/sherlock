name: 'T1641: Data Manipulation'
id: 4711f673-acae-4bd1-b639-99aa930628b9
description: 'Investigate whether an adversary is manipulating data on corporate-managed Android mobile
  devices to affect a business process, organizational understanding, or decision making (T1641, Impact).
  This playbook helps an analyst hunt two primary data-manipulation patterns. First, clipboard-based manipulation/exfiltration:
  a non-corporate app reading clipboard data shortly after a corporate app (password manager, email client,
  banking app) writes to it, the classic ''clipper'' pattern where an app silently rewrites copied cryptocurrency/IBAN/wallet
  values, and clipboard-read activity that terminates in network egress to suspicious or newly registered
  domains. Second, on-device file/database tampering: an app writing to files or databases (contacts.db,
  calendar.db, *.sqlite) outside its own sandbox container, high-frequency small writes inconsistent with
  normal user behavior, and integrity violations in critical mobile-backed business records. It pairs
  deterministic symbolic-logic rules (clipboard read/write correlation, clipper content rules, sandbox-violation
  and Merkle/tamper-evident integrity checks, taint-flow confirmation) with statistical baselining (per-app
  clipboard read frequency/volume, write frequency/magnitude, failure-state signals, Markov transition
  outliers) and machine-learning models (Isolation Forest feature scoring, ARIMA/DeepLog exfil forecasting,
  Random Forest write classification) so the analyst can confirm or rule out data manipulation and any
  resulting exfiltration.'
type: technique
related:
- tactic_id: TA0034
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Is a non-corporate mobile application reading the clipboard within roughly 5 seconds of a
    known corporate application (password manager, email client, banking app) writing to it, and does
    that reading app then communicate to an uncategorized or suspicious domain? Specifically, can you
    join Mobile EDR/MDM events on device ID and timestamp to find ClipboardManager.getPrimaryClip / OnPrimaryClipChangedListener
    reads by a non-corporate package immediately after a corporate app's clipboard write, match the reading
    app's package name or signing certificate against threat intelligence, and confirm a clipboard-source-to-network/file/db-sink
    data flow via taint analysis?
  context: 'Under the Impact tactic, T1641 data manipulation often begins with theft or substitution of
    data copied to the clipboard, which on Android is globally readable by any app holding focus. Correlating
    clipboard reads with prior corporate writes isolates the case where a corporate app (the writer) is
    followed within ~5 seconds by a different, non-corporate app (the reader) — the signature of clipboard
    snooping. Enrich the reader''s package/signing cert against a malicious-app threat-intel feed, and
    confirm intent with static ([FlowDroid](https://www.bodden.de/pubs/far+14flowdroid.pdf)) or runtime
    ([TaintDroid](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf)) taint analysis:
    a deterministic flow from a clipboard/content-provider source to a network or file/db sink is conclusive.
    A positive match (corporate write -> foreign read -> egress to an uncategorized domain) is a high-severity
    manipulation/exfil indicator; a negative result lowers suspicion that clipboard contents were captured
    off-device.'
  answer_sources:
  - Mobile EDR/MDM logs (capturing API calls, process activity, and clipboard access events)
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Corporate-managed mobile devices, Corporate Wi-Fi and VPN network gateways, Cloud-hosted MDM/EDR
    platforms'
  range: Last 90 days (correlate clipboard write/read pairs within a 5-second window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM mobile_edr.clipboard, mobile_edr.process\nJOIN ON device_id\nLET writes = events WHERE\
      \ api='setPrimaryClip' AND pkg IN corporate_apps\nLET reads  = events WHERE api IN ('getPrimaryClip','OnPrimaryClipChangedListener')\n\
      \           AND pkg NOT IN corporate_apps\nMATCH read WHERE 0 <= read.ts - write.ts <= 5s (same\
      \ device_id)\nALERT (high) IF read.pkg IN threat_intel.malicious_apps\n          OR signing_cert(read.pkg)\
      \ IN threat_intel.bad_certs\n          OR taint_flow(clipboard_source -> network|file|db sink) \
      \ // FlowDroid/TaintDroid\nENRICH WITH subsequent conn.log/dns.log egress to uncategorized domain"
- question: Does any app exhibit the 'clipper' pattern — registering a clipboard change listener (OnPrimaryClipChangedListener)
    AND issuing clipboard writes (setPrimaryClip) while it is NOT the foreground/focused app — and does
    the written value differ from the immediately preceding clipboard content, especially when the new
    value matches a cryptocurrency address, IBAN, or wallet pattern?
  context: 'This targets the clipper malware variant of T1641, where an app silently substitutes copied
    payment/wallet identifiers so the victim sends funds to the adversary — a direct manipulation of transmitted
    data. The deterministic tell is an app that BOTH listens for clipboard changes AND writes to the clipboard
    while running in the background, then replaces the prior value with a different one. Add a content
    rule: a background clipboard write whose new value matches a crypto/IBAN/wallet regex but differs
    from the value just read is the address-substitution behavior documented by [ESET''s report on the
    first clipper malware on Google Play](https://www.welivesecurity.com/2019/02/08/first-clipper-malware-google-play/).
    Any match is high-severity; there is little legitimate reason for a backgrounded app to rewrite clipboard
    contents to a wallet-like string.'
  answer_sources:
  - Mobile EDR/MDM logs (capturing API calls, process activity, and clipboard access events)
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Corporate-managed mobile devices, Corporate Wi-Fi and VPN network gateways, Cloud-hosted MDM/EDR
    platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM mobile_edr.clipboard\nFOR each app:\n  has_listener = registered(OnPrimaryClipChangedListener)\n\
      \  bg_write     = event(setPrimaryClip) WHERE is_foreground == false\n  ALERT (high) IF has_listener\
      \ AND bg_write\n    AND new_clip_value != prior_clip_value\n    AND new_clip_value MATCHES /(crypto_addr|IBAN|wallet)/"
- question: For each app, is its clipboard read FREQUENCY (count per 24h) exceeding its own 30-day 99th
    percentile, has a new/unseen source-app to destination-app clipboard interaction appeared, or has
    clipboard read VOLUME (bytes) jumped more than 3 sigma above baseline — and are there bursts of clipboard-access
    STATE failures (permission-denied, blocked background access) or rare clipboard->network API transitions?
  context: Statistical baselining catches stealthy clipboard manipulation that no single rule anticipates,
    which matters for Impact because adversaries tune dwell time to evade thresholds. Baseline each app's
    clipboard read count/24h and compute the 99th percentile over 30 days, baseline the normal set of
    source-app/destination-app clipboard pairs, and baseline read volume in bytes. Alert (medium) on a
    daily count above the 99th percentile, a never-before-seen source/destination interaction, or volume
    exceeding baseline by >3 sigma. Treat clipboard-access permission-denied / background-access-blocked
    attempts as a distinct elevated signal of probing, and model rare clipboard->network API transitions
    as Markov outliers ([MaMaDroid](https://arxiv.org/pdf/1612.04433)). Derive all thresholds from your
    own 30-day device population, not fixed global values. A positive result flags an app whose clipboard
    behavior has shifted in a way consistent with data capture.
  answer_sources:
  - Mobile EDR/MDM logs (capturing API calls, process activity, and clipboard access events)
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Corporate-managed mobile devices, Corporate Wi-Fi and VPN network gateways, Cloud-hosted MDM/EDR
    platforms'
  range: Last 90 days (per-app 30-day baseline; evaluate daily)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each app:\n  baseline_30d(reads_per_24h, src_dst_pairs, read_bytes)\n  ALERT (med) IF\
      \ reads_today > p99(reads_per_24h)\n    OR (src_app,dst_app) NOT IN baseline.src_dst_pairs\n   \
      \ OR read_bytes > mean30d + 3*std30d\n  ELEVATE IF count(clipboard_access_state IN ('PERM_DENIED','BG_BLOCKED'))\
      \ burst\n  markov = transition_baseline(api_sequence)  // MaMaDroid\n  FLAG rare clipboard->network\
      \ transitions as outliers"
- question: When per-app/per-device clipboard and egress feature vectors (clipboard_reads_per_min, clipboard_writes_per_min,
    is_foreground, outbound_bytes_60s, distinct_dest_domains, hour_of_day, write_permission_denied_count)
    are scored by an unsupervised model trained on benign behavior, do any vectors score as short-isolation-path
    outliers — and what are the top-3 contributing features for each flagged vector?
  context: Multivariate unsupervised scoring surfaces clipboard-driven manipulation patterns that single-metric
    thresholds miss, which is valuable under Impact where the adversary blends several weakly anomalous
    behaviors. Train an [Isolation Forest](https://ieeexplore.ieee.org/document/4781136) on benign per-app/per-device
    feature vectors (clipboard read/write rates, foreground flag, outbound bytes in 60s, distinct destination
    domains, hour-of-day, write-permission-denied count), then score new vectors and flag short-isolation-path
    outliers (medium). The alert MUST list the top-3 contributing features (e.g., 'reads_per_min, outbound_bytes_60s,
    is_foreground=false') so the analyst can triage without re-querying. A high-scoring outlier — for
    instance an app reading the clipboard rapidly while backgrounded and uploading bytes to several domains
    — is a strong manipulation/exfil lead.
  answer_sources:
  - Mobile EDR/MDM logs (capturing API calls, process activity, and clipboard access events)
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Corporate-managed mobile devices, Corporate Wi-Fi and VPN network gateways, Cloud-hosted MDM/EDR
    platforms'
  range: Last 90 days (train on benign baseline; score continuously)
  queries:
  - technology: ML/Anomaly-detection pseudocode
    query: "X = [clipboard_reads_per_min, clipboard_writes_per_min, is_foreground,\n     outbound_bytes_60s,\
      \ distinct_dest_domains, hour_of_day,\n     write_permission_denied_count]\nmodel = IsolationForest\
      \ fit on benign per-app/per-device vectors\nscore new vectors\nALERT (med) IF short_isolation_path(outlier)\n\
      EMIT top3_contributing_features per alert  // required for triage"
- question: Using a time-series forecast of expected per-device outbound volume, do actual outbound bytes
    (Zeek conn.log orig_bytes) per 1-minute interval exceed the upper confidence bound by more than 3
    sigma, and does that network spike occur within 60 seconds after a non-standard app reads the clipboard
    (an abnormal clipboard-read -> network-send sequence)?
  context: This closes the loop between on-device clipboard manipulation and the network exfiltration
    of the manipulated/stolen data — the payoff stage of T1641 under Impact. Fit a forecasting model (e.g.,
    ARIMA) on Zeek conn.log to predict expected orig_bytes per device per 1-minute interval and flag actuals
    beyond the upper confidence bound by >3 sigma. Corroborate with [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf)-style
    sequence anomaly detection over device event logs (an abnormal clipboard-read followed by a network-send
    as the next event) and per-host outbound-HTTP fingerprint deviation ([DECANTeR](https://doi.org/10.1145/3134600.3134605)).
    When the network anomaly lands within 60 seconds of a non-standard app reading the clipboard, classify
    as 'Suspicious Data Manipulation and Exfiltration' (high) and emit the top-3 deviating features/events.
    A positive result is a temporally linked read-then-exfil chain; a negative result indicates clipboard
    reads were not immediately followed by anomalous egress.
  answer_sources:
  - Mobile EDR/MDM logs (capturing API calls, process activity, and clipboard access events)
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Corporate-managed mobile devices, Corporate Wi-Fi and VPN network gateways, Cloud-hosted MDM/EDR
    platforms'
  range: Last 90 days (forecast per 1-minute interval; 60-second correlation window)
  queries:
  - technology: ML/Time-series pseudocode
    query: "FOR each device, EACH 1m interval:\n  pred = ARIMA.forecast(conn.orig_bytes)\n  net_anom =\
      \ conn.orig_bytes > pred.upper_ci + 3*sigma\n  seq_anom = DeepLog(event_seq) flags clipboard_read\
      \ -> network_send\n  http_dev = DECANTeR per-host fingerprint deviation\nCLASSIFY 'Suspicious Data\
      \ Manipulation and Exfiltration' (high)\n  IF net_anom AND non_standard_app.clipboard_read within\
      \ 60s before\nEMIT top3_deviating_features/events per alert"
- question: Is any app performing file/database write events where its sandbox path does not match the
    parent directory of the target file — i.e., writing OUTSIDE its own application data container (excluding
    known inter-app frameworks and OS processes) — and can a taint flow from a sensitive source to that
    cross-sandbox file/db sink confirm intent?
  context: 'Mobile OS sandboxing isolates each app''s data container, so a write whose acting process
    sandbox path differs from the target file''s parent directory is a direct sandbox violation and a
    strong T1641 manipulation signal under Impact. Query Mobile EDR file-access logs for such cross-sandbox
    writes, excluding legitimate inter-app frameworks and OS processes; any remaining event is high-severity.
    Confirm intent with taint analysis ([FlowDroid](https://www.bodden.de/pubs/far+14flowdroid.pdf) statically,
    [TaintDroid](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf) at runtime): a
    flow from a sensitive source into a cross-sandbox file/db sink shows the adversary is inserting, deleting,
    or altering data it should not touch. A positive result is a concrete sandbox-breaking write to investigate;
    a negative result reduces suspicion of on-device data tampering.'
  answer_sources:
  - Mobile EDR/MDM logs (capturing file system and database modifications)
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Corporate-managed mobile devices, Application servers receiving mobile data, Application data
    containers on mobile devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM mobile_edr.file_access WHERE event=WRITE\nLET app_sandbox = sandbox_path(process)\nALERT\
      \ (high) IF parent_dir(target_path) NOT UNDER app_sandbox\n  AND process NOT IN (inter_app_frameworks,\
      \ os_processes)\nCONFIRM via taint_flow(sensitive_source -> cross_sandbox file|db sink)\n  // FlowDroid\
      \ (static) / TaintDroid (runtime)"
- question: For critical mobile-backed business records, does an append-only Merkle-hashed audit log show
    a hash mismatch or a failed inclusion/consistency proof, indicating that a record was inserted, deleted,
    or altered regardless of which process made the change?
  context: Tamper-evident logging gives process-independent, deterministic proof of data manipulation,
    which is decisive for Impact because it detects the EFFECT (altered records) even when the manipulating
    process evades behavioral detection. Maintain an append-only Merkle-hashed audit log of each critical
    record's state and periodically verify inclusion and consistency proofs in the style of [Certificate
    Transparency, RFC 6962](https://www.rfc-editor.org/rfc/rfc6962.txt). A hash mismatch or a failed consistency
    proof is unambiguous evidence of insertion, deletion, or alteration of a protected record — generate
    a high-severity integrity-violation alert. A positive result is conclusive tampering to investigate;
    a clean proof set affirmatively rules out alteration of those records over the verified interval.
  answer_sources:
  - Mobile EDR/MDM logs (capturing file system and database modifications)
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Corporate-managed mobile devices, Application servers receiving mobile data, Application data
    containers on mobile devices'
  range: Last 90 days (continuous append; verify proofs on each update)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "MAINTAIN append_only_merkle_log(record_state) per critical record\nON each update / on schedule:\n\
      \  ok = verify_inclusion_proof(record) AND verify_consistency_proof(log)\n  ALERT (high, integrity-violation)\
      \ IF NOT ok\n  // RFC 6962 Certificate Transparency style; process-independent"
- question: For critical files (contacts.db, calendar.db, *.sqlite), is any permitted app exceeding its
    30-day 95th-percentile write FREQUENCY (count/min) or data-change MAGNITUDE (delta file size in bytes),
    or showing a distinct pattern of write STATE failures (write-permission-denied, EACCES, rollback)
    that would indicate rapid data injection or tamper?
  context: High-frequency small writes or large unexpected size deltas to sensitive databases are the
    statistical signature of data injection/tampering under Impact, distinct from normal user-driven edits.
    For each critical file, baseline per-permitted-app write frequency (count/min) and data-change magnitude
    (delta file size, bytes) and compute the 95th percentile over 30 days. Alert (medium) when an app
    exceeds its frequency or delta-size percentile. Profile write-state failures (write-permission-denied,
    EACCES, rollback) as a separate signal of probing or partial tampering. Combine with unsupervised
    outlier scoring ([Isolation Forest](https://ieeexplore.ieee.org/document/4781136)) and sequence/parameter
    anomaly detection ([DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf)), and derive thresholds
    from your own device population. A positive result is an app modifying a sensitive store at a rate
    or magnitude inconsistent with normal activity.
  answer_sources:
  - Mobile EDR/MDM logs (capturing file system and database modifications)
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Corporate-managed mobile devices, Application servers receiving mobile data, Application data
    containers on mobile devices'
  range: Last 90 days (per-app 30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each critical_file IN (contacts.db, calendar.db, *.sqlite):\n  FOR each permitted_app:\n\
      \    baseline_30d(write_freq_per_min, delta_file_size_bytes)\n    ALERT (med) IF write_freq > p95(write_freq)\n\
      \      OR delta_size > p95(delta_file_size)\n    PROFILE write_state failures (PERM_DENIED, EACCES,\
      \ rollback)\n  AUGMENT with IsolationForest outliers + DeepLog seq/param anomalies"
- question: When file-write events are scored by a supervised classifier trained on labeled features (process_name,
    target_file_extension, write_frequency_per_minute, bytes_written, is_outside_sandbox, write_failed,
    hour_of_day), do any real-time writes score above 0.85 probability of being malicious — and does the
    alert surface the top-3 SHAP/feature contributors?
  context: A supervised model generalizes across the many ways T1641 file/db tampering can manifest, complementing
    rules and baselines under Impact. Train a Random Forest on Mobile EDR file-write features, labeling
    'malicious' from attack-simulation data and 'benign' from a 30-day baseline; use an explainable-feature
    approach analogous to [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf)
    and add behavioral-transition features ([MaMaDroid](https://arxiv.org/pdf/1612.04433)) to resist obfuscation.
    Score writes in real time; a probability above 0.85 triggers a medium alert. The alert MUST surface
    the top-3 SHAP/feature contributors (e.g., 'is_outside_sandbox=1, write_frequency_per_minute, target_file_extension=.db')
    so the analyst can review without re-querying. A high-probability write — especially one outside the
    sandbox to a database extension at an odd hour — is a strong manipulation lead.
  answer_sources:
  - Mobile EDR/MDM logs (capturing file system and database modifications)
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Corporate-managed mobile devices, Application servers receiving mobile data, Application data
    containers on mobile devices'
  range: Last 90 days (train on labeled data; score writes in real time)
  queries:
  - technology: ML/Classification pseudocode
    query: "features = [process_name, target_file_extension, write_frequency_per_minute,\n           \
      \ bytes_written, is_outside_sandbox, write_failed, hour_of_day]\nmodel = RandomForest trained on\
      \ (malicious=attack-sim, benign=30d baseline)\n  + MaMaDroid transition features  // obfuscation\
      \ resistance\nscore file-writes in real time\nALERT (med) IF P(malicious) > 0.85\nEMIT top3 SHAP/feature\
      \ contributors per alert  // required"
