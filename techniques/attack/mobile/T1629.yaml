name: 'T1629: Impair Defenses'
id: f20d61fb-344e-4c77-a73d-79af48c7e444
description: 'Investigate whether an adversary is impairing or disabling security defenses on managed
  mobile devices (primarily Android) to evade detection and operate with reduced observability. This playbook
  helps an analyst hunt for the causal chain MITRE describes for T1629: a security or monitoring capability
  is altered first (accessibility-service abuse, overlay+accessibility permission pairing, termination
  of an MTD agent, disabling Google Play Protect, granting Device Administrator, or unauthorized policy
  changes), followed by degradation or cessation of expected telemetry (silenced MTD/MDM heartbeats, missing
  check-ins, dropped sensor visibility), followed by continued execution under diminished monitoring.
  It covers detecting managed devices that miss their expected MDM/MTD check-in without an authorized
  administrative action, statistical baselining of per-device check-in cadence and of failed/blocked connection
  attempts, time-series forecasting of check-in gaps, matching mobile-device network traffic against rooting-kit/spyware
  threat intelligence (DNS, TLS SNI, file hashes), behavioral classification of malicious network flows,
  taint analysis of covert source-to-sink exfiltration, deterministic alerting on explicit defense-impairment
  events without an approved change ticket, anomaly detection on compliance-violation and high-risk-permission
  spikes, UEBA sequence modeling of defense-impairment chains, and explainable static risk scoring of
  installed or sideloaded APKs. Detection methods span symbolic logic, statistical baselining, and machine
  learning so an analyst can determine whether on-device defenses are being deliberately weakened.'
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
