questions:
- question: Has a managed mobile device stopped sending its periodic MDM/MTD heartbeat or check-in beyond
    its expected interval without any corresponding authorized administrative action (unenroll, wipe,
    decommission, retire) recorded for that device?
  context: 'In the Defense Evasion tactic, a silenced agent is a primary defense-impairment indicator:
    on-device security events stop reaching the management server while the rest of the fleet keeps reporting
    normally. This symbolic-logic correlation fires when an MDM/MTD check-in for a specific device ID
    is not observed within roughly 2x its nominal heartbeat period, then automatically queries MDM audit
    logs for an authorizing event (unenroll, wipe, decommission, retire) within a +/-15-minute window
    of the missed check-in. If no authorized action explains the silence, raise a medium-severity alert.
    A positive result (gap with no authorization) suggests the agent was disabled, blocked, or removed
    to reduce observability; a negative result (gap with a matching authorized action) is benign lifecycle
    activity. Corroborate with Zeek conn.log to confirm whether the device stopped connecting to the MDM
    FQDN entirely. Source research: [Malware Detection for Internet of Things Using One-Class Classification](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/).'
  answer_sources:
  - Zeek conn.log
  - MDM Server Logs
  - MTD Server Logs
  - 'NAI: Organization''s internet gateway, Wi-Fi network infrastructure, and MDM/MTD Management Servers'
  range: Last 90 days, evaluated continuously with a +/-15-minute correlation window around each missed
    check-in
  queries:
  - technology: SIEM/Rule pseudocode
    query: "missed = devices where now - last_checkin(device_id) > 2 * nominal_heartbeat(device_id);\n\
      for d in missed:\n  auth = mdm_audit_log[device_id=d.id, action in ('unenroll','wipe','decommission','retire'),\n\
      \                       time within d.missed_time +/- 15m];\n  if auth is empty: alert(severity='medium',\
      \ device=d.id, last_checkin=d.last_checkin);"
- question: Which managed devices have a current time-since-last-check-in that exceeds their own device-specific
    99th-percentile gap derived from a rolling 30-day per-device baseline?
  context: 'Mobile devices have individual, context-dependent check-in cadences, so a single fleet-wide
    threshold produces noise. This statistical method ingests MDM/MTD check-in timestamps (or Zeek conn.log
    session-end times to the MDM FQDN) and computes, per device, the 99th percentile of the time delta
    between consecutive check-ins over a rolling 30-day window, deriving the threshold separately per
    OS version and roaming/Wi-Fi context. Running every five minutes, it flags any device whose current
    gap exceeds its own p99. Baselines should be trained on benign cadence only so that genuine deviations
    stand out as in one-class anomaly detection. A flagged device may indicate an agent that has been
    throttled, suspended, or disabled to impair defenses; benign causes (travel, power-off) should be
    ruled out via network context. Source research: [Malware Detection for Internet of Things Using One-Class
    Classification](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/).'
  answer_sources:
  - Zeek conn.log
  - MDM Server Logs
  - MTD Server Logs
  - 'NAI: Organization''s internet gateway, Wi-Fi network infrastructure, and MDM/MTD Management Servers'
  range: Last 90 days for review; per-device baseline computed over a rolling 30 days, evaluated every
    5 minutes
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each device d, os_version, network_context:\n  deltas = diff(sorted(checkin_times[d])\
      \ over last 30d);\n  p99 = percentile(deltas, 99);\n  if (now - last_checkin[d]) > p99: flag(d,\
      \ gap=now-last_checkin[d], threshold=p99);\nschedule: every 5 minutes"
- question: Is a device generating an abnormally high rate of failed or blocked MDM/MTD connection attempts
    (NXDOMAIN to the MDM domain, S0/REJ/RSTO connection states, or TLS handshake failures) while its successful
    check-ins have dropped to zero?
  context: 'Failure telemetry is a distinct signal from simple absence: active blocking or tampering produces
    failed attempts, whereas a benign offline device produces silence. This statistical method baselines,
    per device from Zeek conn.log/ssl.log/dns.log against the MDM/MTD FQDN, the counts of (a) NXDOMAIN
    responses to the MDM domain, (b) connections in S0/REJ/RSTO (blocked/reset) states, and (c) TLS handshake
    failures. It alerts when a device''s failed-attempt rate exceeds 3 standard deviations above its 30-day
    mean while successful check-ins fall to zero, distinguishing deliberate interference (host-file tampering,
    firewall rules, certificate manipulation) from a phone that is simply off. Thresholds are derived
    per network segment, and time-ordered baselining is required to avoid bias. A positive result strongly
    implies on-device defense impairment. Source research: [TESSERACT: Eliminating Experimental Bias in
    Malware Classification across Space and Time](https://arxiv.org/abs/1807.07838).'
  answer_sources:
  - Zeek conn.log
  - MDM Server Logs
  - MTD Server Logs
  - 'NAI: Organization''s internet gateway, Wi-Fi network infrastructure, and MDM/MTD Management Servers'
  range: Last 90 days; per-device failure baseline over a rolling 30 days
  queries:
  - technology: Zeek/pseudocode
    query: "per device d over rolling 30d, per network_segment:\n  fail = count(dns.log NXDOMAIN to mdm_fqdn)\n\
      \       + count(conn.log conn_state in (S0,REJ,RSTO) to mdm_fqdn)\n       + count(ssl.log handshake_failure\
      \ to mdm_fqdn);\n  mean,std = baseline(fail[d]);\n  if current_fail[d] > mean + 3*std AND successful_checkins[d]\
      \ == 0:\n    alert(d, fail_rate=current_fail[d])"
- question: Does a device fail to produce an expected check-in within the 95% prediction interval of a
    per-device time-series forecast of its check-in cadence?
  context: 'Normal check-in cadence varies, so static thresholds either miss slow drifts or over-alert.
    This machine-learning method builds a per-device time-series forecasting model (e.g., ARIMA) on the
    historical check-in sequence and alerts when an actual check-in does not arrive within the model''s
    95% prediction interval, which inherently accounts for normal variability. Each alert surfaces the
    top-3 contributing factors (predicted-vs-actual gap, recent failed-connection count, last-known network)
    to speed triage. Models are retrained on a rolling window and monitored for concept drift because
    mobile fleet behavior changes over time. A breach of the prediction interval indicates the device
    deviated from its learned rhythm in a way consistent with an agent being impaired or blocked, warranting
    correlation with the failure-rate and authorization checks. Source research: [TESSERACT: Eliminating
    Experimental Bias in Malware Classification across Space and Time](https://arxiv.org/abs/1807.07838).'
  answer_sources:
  - Zeek conn.log
  - MDM Server Logs
  - MTD Server Logs
  - 'NAI: Organization''s internet gateway, Wi-Fi network infrastructure, and MDM/MTD Management Servers'
  range: Last 90 days; rolling-window retraining with drift monitoring
  queries:
  - technology: SIEM/ML pseudocode
    query: "for each device d:\n  model = ARIMA.fit(checkin_interval_series[d], rolling_window);\n  pred,\
      \ lo95, hi95 = model.forecast(next_checkin_time);\n  if observed_checkin[d] is None at hi95 OR actual_gap\
      \ > hi95:\n    alert(d, factors=top3(pred_vs_actual_gap, recent_failed_conns, last_network));\n\
      \  monitor_drift(model); retrain_on_schedule()"
- question: Does network traffic from a corporate mobile device match mobile-specific threat intelligence
    for rooting kits or spyware (DNS query name, TLS SNI server_name, or a downloaded APK/IPA file hash)?
  context: 'Adversaries impairing mobile defenses frequently rely on rooting kits or commercial spyware
    that beacon to known infrastructure or are delivered as known-bad packages. This symbolic-logic rule
    matches Zeek fields in real time against a curated mobile threat-intel list: dns.log query and ssl.log
    server_name against known rooting-kit/spyware C2 domains, and files.log md5/sha1 against known mobile-malware
    hashes. A single match originating from a corporate mobile IP generates a high-severity alert, because
    network-address and URL feature sets are well-established discriminators of Android malware. A positive
    result is high-fidelity and ties the device to known malicious tooling; tune the feed to mobile-relevant
    indicators to limit false positives from generic enterprise traffic. Source research: [Drebin: Effective
    and Explainable Detection of Android Malware in Your Pocket](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Organization''s internet gateway and Wi-Fi network infrastructure'
  range: Last 90 days, real-time matching
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ti = feed['mobile_rootkit_spyware'];\nalert(high) when src_ip in corporate_mobile_subnet AND\
      \ (\n  dns.log.query in ti.domains OR\n  ssl.log.server_name in ti.domains OR\n  files.log.md5 in\
      \ ti.hashes OR files.log.sha1 in ti.hashes );\noutput device_ip, indicator, indicator_type"
- question: Within a short window, does a mobile device exhibit both a fleet-rare HTTP User-Agent and
    a high-entropy DNS query to a non-allowlisted domain, and is any single device showing an NXDOMAIN
    spike?
  context: 'Defense-impairing malware often introduces unusual client signatures and algorithmically generated
    or obfuscated C2 domains. This statistical method computes, for HTTP/S sessions from the mobile subnet,
    the population rarity of http.log user_agent (flagging those present in <1% of the fleet), and for
    DNS queries to non-allowlisted domains computes the Shannon entropy of the second-level domain. It
    raises a medium-severity alert when a device shows both a rare UA and a high-entropy query (score
    > 4.0) within a 5-minute window. Separately, a per-device spike in NXDOMAIN responses is baselined
    and alerted as a distinct DGA/blocked-C2 signal. A combined rare-UA-plus-high-entropy hit suggests
    non-standard tooling reaching obfuscated infrastructure consistent with evasion; the NXDOMAIN spike
    points to domain-generation or blocked beaconing. Source research: [Malware Detection for Internet
    of Things Using One-Class Classification](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/).'
  answer_sources:
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Organization''s internet gateway and Wi-Fi network infrastructure'
  range: Last 90 days; correlation window of 5 minutes
  queries:
  - technology: Zeek/pseudocode
    query: "ua_rarity = count(device with ua)/fleet_size;\nH(domain) = -sum(p(c)*log2(p(c))) over second_level_domain\
      \ chars;\nalert(medium) when device has ua_rarity < 0.01 AND\n  exists dns.query to non_allowlisted\
      \ with H(domain) > 4.0 within 5m;\nseparately: baseline NXDOMAIN per device; alert on spike > mean+3std"
- question: When scored by a supervised connection classifier over engineered Zeek features, does a mobile
    device's network flow exceed the calibrated malicious-probability threshold?
  context: 'Many malicious mobile connections are not in any threat feed, so behavioral classification
    adds coverage. This machine-learning method scores connections in real time with a supervised classifier
    (Random Forest/XGBoost) using first-party features engineered from Zeek logs: conn.log duration, orig_bytes,
    resp_bytes, byte-ratio (volume), connections-per-minute (frequency), conn-state success/fail mix (state),
    JA3/JA3S from ssl.log, SNI entropy, and UA rarity. It triggers a high-severity investigation above
    a calibrated threshold (e.g., 0.90) and lists the top-3 contributing features in the alert. Tree ensembles
    provide interpretable feature importances, and SHAP/LIME attributions are attached for analyst triage.
    A high score with explainable drivers (e.g., high byte-ratio plus rare JA3) indicates covert C2 or
    exfiltration consistent with a device whose defenses have been impaired. Source research: [Comprehensive
    evaluation of Mal-API-2019 dataset by machine learning in malware detection](https://arxiv.org/abs/2403.02232),
    [Explainable Artificial Intelligence (XAI) for Malware Analysis: A Survey](https://arxiv.org/html/2409.13723v2).'
  answer_sources:
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Organization''s internet gateway and Wi-Fi network infrastructure'
  range: Last 90 days, real-time scoring
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [duration, orig_bytes, resp_bytes, byte_ratio, conns_per_min,\n            state_success_fail_mix,\
      \ ja3, ja3s, sni_entropy, ua_rarity];\nscore = classifier.predict_proba(features);  // RandomForest/XGBoost\n\
      if score >= 0.90: alert(high, top3=feature_importance(features), shap=explain(features))"
- question: Do static or dynamic taint-analysis results show an app routing sensitive sources (IMEI, location,
    contacts, security-config reads) to network sinks despite holding only normal permission grants, and
    does that app correlate with the device's gateway connections?
  context: 'Apps that impair defenses often also exfiltrate sensitive data while appearing to use only
    granted permissions. Where on-device or sandbox analysis is available (MTD app vetting), this machine-learning
    method applies static/dynamic taint analysis to flag apps that route sensitive sources to network
    sinks. It uses static source-to-sink rules (FlowDroid, with DroidBench ground truth) and runtime taint
    propagation (TaintDroid), then correlates confirmed flows with the device''s gateway connections to
    raise a high-severity exfiltration alert. A confirmed source-to-sink flow that lines up with outbound
    traffic at the gateway is strong evidence of covert exfiltration enabled by weakened on-device controls;
    absence of correlating network flow may indicate staged or dormant capability. Source research: [FlowDroid](https://www.bodden.de/pubs/far+14flowdroid.pdf),
    [TaintDroid](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Organization''s internet gateway and Wi-Fi network infrastructure'
  range: Last 90 days for vetting results; correlate with gateway flows near the analysis timestamp
  queries:
  - technology: MTD/Taint-analysis pseudocode
    query: "flows = FlowDroid.static_source_to_sink(apk) UNION TaintDroid.runtime_taint(app);\nsensitive\
      \ = {IMEI, location, contacts, security_config};\nfor f in flows where f.source in sensitive and\
      \ f.sink == network:\n  if correlated(f.app, device.gateway_connections):\n    alert(high, app=f.app,\
      \ source=f.source, sink=f.sink)"
- question: Did an explicit MDM/MTD defense-impairment event occur (security agent process terminated,
    Google Play Protect disabled, or Device Administrator / high-risk permission granted) without an authorizing
    IT change-management ticket in the prior 24 hours?
  context: 'Some defense-impairment actions are logged directly by the management platform and are unambiguous
    when they lack authorization. This symbolic-logic rule generates a high-severity alert on ingestion
    of critical MDM/MTD event IDs (''Security Agent Process Terminated'', ''Compliance Policy Violation:
    Google Play Protect Disabled'', ''High-Risk Permission Granted: Device Administrator''). Before alerting
    it queries the IT change-management system for a ticket authorizing the change for that user/device
    within the prior 24 hours; if none exists, it fires. These deterministic rules should never be removed.
    A positive result is a direct, high-confidence indicator that on-device defenses were weakened outside
    of approved processes; a matching change ticket reclassifies it as sanctioned administrative activity.'
  answer_sources:
  - Mobile Threat Defense (MTD) Agent Logs
  - Mobile Device Management (MDM) Compliance Logs
  - IT Change Management System Logs
  - 'NAI: Managed mobile device endpoints and MDM/MTD Management Servers'
  range: Last 90 days; change-ticket lookback of 24 hours
  queries:
  - technology: SIEM/Rule pseudocode
    query: "crit = {'Security Agent Process Terminated',\n        'Compliance Policy Violation: Google\
      \ Play Protect Disabled',\n        'High-Risk Permission Granted: Device Administrator'};\non event\
      \ e in crit:\n  ticket = change_mgmt[user=e.user, device=e.device, time within e.time - 24h];\n\
      \  if ticket is empty: alert(high, e)"
- question: Did a non-allowlisted app enable an accessibility service (BIND_ACCESSIBILITY_SERVICE) or
    simultaneously hold overlay (SYSTEM_ALERT_WINDOW) and accessibility permissions?
  context: 'The combination of overlay and accessibility permissions is a high-fidelity defense-impairment
    indicator: it lets malware silently auto-grant further permissions or Device Administrator and suppress
    security prompts (the Cloak-and-Dagger technique), directly degrading on-device defenses. This symbolic-logic
    rule alerts when a non-allowlisted app enables an accessibility service, or when an app holds both
    SYSTEM_ALERT_WINDOW and accessibility permissions at once. The accessibility-service package is cross-referenced
    against an approved-app allowlist before alerting to suppress legitimate assistive apps. A positive
    result for an unknown package strongly indicates malware positioning itself to manipulate the UI feedback
    loop and bypass user consent; an allowlisted match is expected behavior. Source research: [Cloak and
    Dagger: From Two Permissions to Complete Control of the UI Feedback Loop](http://cloak-and-dagger.org/).'
  answer_sources:
  - Mobile Threat Defense (MTD) Agent Logs
  - Mobile Device Management (MDM) Compliance Logs
  - IT Change Management System Logs
  - 'NAI: Managed mobile device endpoints and MDM/MTD Management Servers'
  range: Last 90 days
  queries:
  - technology: MDM/MTD Rule pseudocode
    query: "alert when app not in approved_allowlist AND (\n  app.enabled(BIND_ACCESSIBILITY_SERVICE)\
      \ OR\n  (app.has(SYSTEM_ALERT_WINDOW) AND app.has(accessibility)) );\noutput device, app_package,\
      \ permissions"
- question: Has a user or device produced a 24-hour count of compliance-violation alerts or high-risk-permission
    grants that exceeds three standard deviations above its peer-group (role-based) baseline, including
    failed/blocked policy pushes?
  context: 'A burst of compliance violations or high-risk permission grants can indicate an active attempt
    to dismantle device defenses. This statistical method establishes a 30-day rolling baseline of compliance-violation
    alerts and high-risk-permission grants with separate baselines per user role (Developers, Sales, Executives),
    and runs hourly to flag any user/device whose 24-hour event count exceeds three standard deviations
    above its peer-group mean. Failed or blocked policy pushes are profiled as a distinct signal, since
    repeated failures can signal tampering with policy enforcement. Baselines are trained on benign behavior
    so deviations score as anomalies. A flagged spike points to concentrated defense-impairment activity
    on one device or account against the norm for its role. Source research: [Malware Detection for Internet
    of Things Using One-Class Classification](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/).'
  answer_sources:
  - Mobile Threat Defense (MTD) Agent Logs
  - Mobile Device Management (MDM) Compliance Logs
  - IT Change Management System Logs
  - 'NAI: Managed mobile device endpoints and MDM/MTD Management Servers'
  range: Last 90 days; role-based baseline over a rolling 30 days, evaluated hourly
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for role in (Developers, Sales, Executives):\n  mean,std = baseline(daily_count(compliance_violations\
      \ + high_risk_grants) over 30d, role);\n  for d in devices[role]:\n    if count_24h(d) > mean +\
      \ 3*std: flag(d, count=count_24h(d));\nprofile failed_policy_pushes separately as distinct signal;\n\
      schedule: hourly"
- question: Does a UEBA sequence model report high reconstruction error for a device/user, indicating
    an anomalous chain of defense-impairment events (e.g., VPN login from new country -> sideload -> accessibility
    enabled -> Device Admin granted -> Play Protect disabled -> MTD check-in missed)?
  context: 'Individual events may be benign, but their ordered combination reveals an attack narrative.
    This machine-learning method integrates MDM/MTD, VPN, and network event streams into a UEBA platform
    and uses a sequence model (e.g., LSTM autoencoder) to learn normal user/device activity sequences,
    scoring reconstruction error. It flags high-error chains such as ''[VPN login from new country] ->
    [app installed from unknown source] -> [accessibility enabled] -> [Device Admin granted] -> [Play
    Protect disabled] -> [MTD check-in missed]'' and surfaces the top-3 contributing events. Package/family-abstracted
    behavioral models resist API churn, and the model is retrained periodically to handle concept drift.
    A high-reconstruction-error sequence that ends in telemetry loss matches the T1629 causal pattern
    of impairing defenses before continuing under reduced monitoring. Source research: [Deep Learning
    for Android Malware Defenses: a Systematic Literature Review](https://arxiv.org/abs/2103.05292), [MaMaDroid:
    Detecting Android Malware by Building Markov Chains of Behavioral Models](https://arxiv.org/abs/1612.04433),
    [TESSERACT: Eliminating Experimental Bias in Malware Classification across Space and Time](https://arxiv.org/abs/1807.07838).'
  answer_sources:
  - Mobile Threat Defense (MTD) Agent Logs
  - Mobile Device Management (MDM) Compliance Logs
  - IT Change Management System Logs
  - 'NAI: Managed mobile device endpoints and MDM/MTD Management Servers'
  range: Last 90 days; periodic retraining with drift monitoring
  queries:
  - technology: UEBA/ML pseudocode
    query: "seq = order_events(MDM, MTD, VPN, network) per user/device;\nerr = lstm_autoencoder.reconstruction_error(seq);\n\
      if err > threshold:\n  alert(user, device, top3_events=highest_error_steps(seq));\nretrain_periodically();\
      \ monitor_concept_drift()"
- question: When each installed or sideloaded APK from the MTD app inventory is scored by an explainable
    static classifier over manifest/dex features, which apps receive a high risk verdict driven by defense-relevant
    features (Device-Admin APIs, dynamic code loading, suspicious permissions)?
  context: 'Static analysis of app contents can flag defense-impairing capability before runtime. This
    machine-learning method scores each installed/sideloaded APK reported by MTD app-inventory using an
    explainable static classifier over manifest/dex features (requested/used permissions, components,
    intents, and restricted/suspicious API calls such as Device-Admin APIs and dynamic code loading).
    It uses a linear SVM that surfaces top-weighted features per verdict (Drebin) or a TF-IDF tree ensemble
    with feature importances, presenting the top-3 features in the alert. A high-risk verdict whose drivers
    are defense-relevant (Device-Admin APIs, dynamic loading, accessibility/overlay permissions) indicates
    an app built to weaken on-device controls and should be prioritized; explainable features let the
    analyst confirm the rationale rather than trust an opaque score. Source research: [Drebin: Effective
    and Explainable Detection of Android Malware in Your Pocket](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf),
    [Comprehensive evaluation of Mal-API-2019 dataset by machine learning in malware detection](https://arxiv.org/abs/2403.02232),
    [Explainable Artificial Intelligence (XAI) for Malware Analysis: A Survey](https://arxiv.org/html/2409.13723v2).'
  answer_sources:
  - Mobile Threat Defense (MTD) Agent Logs
  - Mobile Device Management (MDM) Compliance Logs
  - IT Change Management System Logs
  - 'NAI: Managed mobile device endpoints and MDM/MTD Management Servers'
  range: Last 90 days; rescore on each new app-inventory report
  queries:
  - technology: MTD/ML pseudocode
    query: "features = manifest_dex_features(apk);  // permissions, components, intents,\n           \
      \                             // restricted/suspicious APIs (Device-Admin, dynamic code load)\n\
      verdict = linear_svm.score(features)  // or TF-IDF tree ensemble;\nif verdict >= risk_threshold:\n\
      \  alert(app, top3=top_weighted_features(features))"
