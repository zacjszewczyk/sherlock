name: 'T1474.003: Compromise Software Supply Chain'
id: 8aa76c1c-86ed-481b-a380-a3d4ddf729ef
description: Investigate adversary compromise of the mobile software supply chain, where a trusted or
  managed Android/iOS application is manipulated before it reaches the device through tampered source
  code, a hijacked update/distribution channel, or a modified compiled release. This playbook helps an
  analyst confirm whether a newly installed or updated app deviates from its known-good baseline in signing/provenance,
  manifest permissions, privileged framework behavior, background execution, or network communication.
  It correlates MDM/UEM inventory and Mobile Threat Defense signals with post-install network telemetry
  to surface signature/hash mismatches, risky permission and capability drift, anomalous first-run behavior,
  and outbound connections to malicious C2, DGA domains, malicious TLS fingerprints, abnormal egress volume,
  or non-standard ports shortly after an update event.
type: technique
related:
- tactic_id: TA0027
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: For every mobile application install or update recorded in MDM/MTD inventory, does the signing
    certificate and APK/IPA hash match the vendor allowlist, and are the declared manifest components,
    permissions, and intent filters identical to the known-good version for that package name?
  context: 'This is the deterministic floor for detecting a software supply-chain compromise on mobile.
    A trusted package whose stable package name suddenly presents a different signer/certificate, an unverifiable
    signature, or a hash that does not match the vendor-published value is a strong indicator the distribution
    or build pipeline was tampered with prior to delivery. The analyst compares each install/update against
    a vendor allowlist and a threat-intel denylist, and validates that manifest invariants (declared permissions,
    components, intent filters) are unchanged from the baselined version. For pre-installed or vendor-trusted
    apps, requested privileged capabilities must match an approved baseline, since system-privileged pre-installed
    apps are a high-value supply-chain attack surface. Treat signature/provenance verification as the
    deterministic floor per [SoK: Taxonomy of Attacks on OSS Supply Chains](https://arxiv.org/abs/2204.04008)
    and [SoK: Secure Design Properties](https://arxiv.org/abs/2406.10109); maintain manifest invariants
    using the static feature sets of [DREBIN](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf);
    and treat pre-installed apps as a supply-chain attack surface per [FirmScope](https://www.usenix.org/system/files/sec20-elsabagh.pdf).
    A positive result (signer change, denylist hit, or manifest deviation) maps directly to Initial Access
    via a manipulated trusted app and warrants immediate quarantine; a clean match lowers but does not
    eliminate suspicion, so pair it with the behavioral checks below.'
  answer_sources: &id001
  - MDM application inventory logs
  - Mobile Threat Defense (MTD) signature analysis reports
  - Vendor-published application hashes
  - Internal application hash baseline
  - Application manifest files
  - 'NAI: MDM/UEM servers, corporate-owned mobile endpoints, and internal/external application repositories
    used by the organization.'
  range: Last 90 days, centered on each app install/update event.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FOR each app_install_or_update IN mdm_mtd_inventory: LOOKUP signer_cert, apk_ipa_hash; ALERT
      when signer_cert NOT IN vendor_allowlist[package_name] OR hash NOT IN vendor_published_hashes OR
      signer_cert IN threat_intel_denylist OR signature_unverified=true; COMPARE manifest(permissions,components,intent_filters)
      TO known_good[package_name,prior_version] AND ALERT on any deviation; for pre_installed apps REQUIRE
      privileged_capabilities IN approved_baseline; OUTPUT package_name, version, signer, hash, deviation_reason.'
- question: After an application update, has the permission set drifted substantially from the prior version,
    or has the weighted high-risk permission score (BIND_ACCESSIBILITY_SERVICE, READ_SMS, REQUEST_INSTALL_PACKAGES,
    SYSTEM_ALERT_WINDOW) jumped beyond the per-app fleet norm?
  context: A compromised update frequently introduces new, high-risk permissions absent from the baselined
    version. The analyst computes Jaccard similarity between the prior and new manifest permission sets
    and flags updates where similarity falls below threshold (e.g., <0.90 for minor/patch updates), and
    computes a weighted permission risk score that weights accessibility, SMS read, install-packages,
    and overlay permissions highest. Updates whose risk increase exceeds the per-app 99th percentile,
    derived from 90 days of fleet update history, are escalated. Metadata churn such as a signer/publisher
    change, version-lineage gap, or installer-source change are weak-link provenance signals that compound
    the concern, per [What are Weak Links in the npm Supply Chain?](https://arxiv.org/abs/2112.10165).
    As a failure-mode signal, count update attempts that fail signature verification or are rolled back
    as a distinct anomaly. In the Initial Access context, sudden privilege expansion right after an update
    is exactly how a tampered app gains the access it needs to compromise data or the device.
  answer_sources: *id001
  range: Last 90 days of fleet update history for baselining, evaluated at each update event.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each update(package_name): jaccard = |perm_prev ∩ perm_new| / |perm_prev ∪ perm_new|;
      risk_delta = weighted_risk(perm_new) - weighted_risk(perm_prev) WITH weights{BIND_ACCESSIBILITY_SERVICE,READ_SMS,REQUEST_INSTALL_PACKAGES,SYSTEM_ALERT_WINDOW=high};
      ALERT when jaccard<0.90 OR risk_delta>per_app_p99(90d) OR signer/publisher/version_lineage/installer_source
      changed; COUNT sig_verify_failures AND rollbacks as distinct anomaly; OUTPUT package_name, jaccard,
      risk_delta, new_high_risk_perms.'
- question: Does a supervised classifier flag a recently updated app as a compromised release based on
    its signature/provenance status, permission drift, new high-risk permissions, and first-run behavioral
    features?
  context: When no single signal is conclusive, a machine-learning model fuses provenance and behavior
    into a single verdict. The analyst feeds signature/provenance match status, Jaccard score, weighted
    permission-risk delta, count of new high-risk permissions, and post-install behavior features into
    a Random Forest / Gradient Boosting model using the static feature sets of [DREBIN](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf)
    and the install/first-run payload behaviors catalogued in [Backstabber's Knife Collection](https://arxiv.org/abs/2005.09535)
    and [MalOSS](https://arxiv.org/abs/2002.01139). First-run behavioral drift is modeled with Markov-chain
    API call-family transitions per [MaMaDroid](https://arxiv.org/abs/1612.04433) for resilience to obfuscation.
    Alert when compromise probability exceeds 0.85, especially when accompanied by a signature mismatch,
    and surface the top-3 contributing features (e.g., signer change, new accessibility permission, new
    C2 destination) in the alert text for an explainable verdict, following DREBIN's explainable-verdict
    design. A high-probability hit on a trusted app is a direct Initial Access indicator; analysts should
    validate the contributing features before containment.
  answer_sources: *id001
  range: Last 90 days for feature history, with live scoring of each new install/update.
  queries:
  - technology: ML pipeline pseudocode
    query: features = [signature_provenance_match, jaccard_score, weighted_perm_risk_delta, new_high_risk_perm_count,
      first_run_api_family_transitions(markov), install_behavior_features]; prob = gbm_or_rf.predict_proba(features);
      ALERT when prob>=0.85 (boost if signature_mismatch=true); OUTPUT package_name, prob, top_shap_3.
- question: Within 24 hours of a mobile app update event, does network telemetry from that device show
    connections to known-malicious C2/IOC destinations, matching malicious JA3/JA3S TLS fingerprints,
    or HTTP/DNS services running on non-standard ports?
  context: A tampered app commonly fetches a second stage or beacons to attacker infrastructure shortly
    after install. The analyst joins MDM install/update events to Zeek conn/dns/http/ssl logs for the
    device IP within a 24-hour window and alerts on IOC destination IP/domain matches, malicious JA3/JA3S
    hashes, or common protocols running on non-standard ports (e.g., HTTP over 8888). Freshly installed
    apps contacting fresh domains during or after install — the post-install second-stage download and
    exfiltration behaviors catalogued in [Backstabber's Knife Collection](https://arxiv.org/abs/2005.09535)
    and [MalOSS](https://arxiv.org/abs/2002.01139) — and TLS handshakes presenting self-signed or anomalous
    certificates per [Deciphering Malware's Use of TLS](https://arxiv.org/abs/1607.01639), are strong
    corroboration. In the Initial Access context this confirms that a supply-chain-compromised app has
    established adversary communications; a positive result should be tied back to the specific install/update
    event and the app implicated by the signature/permission checks, while a clean window over 24h reduces
    but does not eliminate the concern.
  answer_sources: &id002
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - MDM application update logs
  - Threat intelligence indicators
  - 'NAI: Network egress points (firewalls, proxies), corporate DNS resolvers, VPN concentrators, and
    WiFi access points servicing managed mobile devices.'
  range: 24-hour window following each MDM app update event (search within Last 90 days).
  queries:
  - technology: Zeek/SIEM correlation pseudocode
    query: JOIN mdm_install_update_events TO zeek_conn/dns/http/ssl ON device_ip, time_window<=24h; ALERT
      when dest_ip/domain IN ioc_feed OR ja3/ja3s IN malware_fingerprints OR (service=HTTP/DNS AND dst_port
      NOT IN standard_ports) OR tls_cert self_signed/anomalous; OUTPUT device, package_name, dest, port,
      ja3, match_reason, update_time.
- question: After an app update, does the device's outbound traffic exceed its own 30-day baseline for
    egress volume, destination diversity, or port usage, or do DNS lookups show high-entropy DGA-like
    domains and NXDOMAIN bursts?
  context: Statistical baselining catches malicious post-update behavior that has no prior IOC. The analyst
    maintains 30-day per-device baselines for daily egress bytes (Volume), unique destination IPs and
    connection count/min (Frequency), and destination-port usage, then alerts when post-update egress
    exceeds the 99th percentile, a new low-prevalence non-ephemeral port appears, or DNS shows domains
    with Shannon entropy >3.5 and DGA-like n-gram/length/vowel-digit features per [FANCI](https://www.usenix.org/system/files/conference/usenixsecurity18/sec18-schuppen.pdf).
    As a failure-mode signal, the NXDOMAIN rate and the rate of blocked/failed outbound connections after
    the update are tracked as distinct indicators, since DGA-based C2 generates NXDOMAIN bursts while
    it searches for a live rendezvous domain. Thresholds are derived per-device rather than fleet-wide.
    A spike or DGA pattern shortly after an update strongly supports a supply-chain compromise enabling
    Initial Access and command-and-control.
  answer_sources: *id002
  range: Last 90 days, with rolling 30-day per-device baselines evaluated against the post-update window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline per device over 30d => daily_egress_bytes, unique_dst_ips, conn_per_min, dst_port_usage;
      ALERT when post_update_egress>p99 OR new_low_prevalence_nonephemeral_port_seen OR dns_domain shannon_entropy>3.5
      with dga_ngram/length/vowel_digit features; TRACK nxdomain_rate AND blocked_failed_outbound_rate
      as distinct indicators; OUTPUT device, package_name, metric, value, baseline_p99.
- question: Does a per-device time-series anomaly model flag the post-update traffic as deviating from
    normal, combining bytes-out, destination diversity, TLS flow metadata, and DGA NXDOMAIN classification
    into a composite risk score?
  context: Where simple thresholds are noisy, a learned per-device model captures the device's normal
    rhythm and scores deviations. The analyst trains a per-device time-series anomaly model on hourly
    bytes-out, unique destination IPs, and byte ratio, augmented with TLS flow-metadata features (offered
    cipher suites, extensions, certificate attributes, packet-length and inter-arrival distributions)
    per [Deciphering Malware's Use of TLS](https://arxiv.org/abs/1607.01639), and classifies DGA NXDOMAINs
    with RF/SVM per [FANCI](https://www.usenix.org/system/files/conference/usenixsecurity18/sec18-schuppen.pdf).
    Alert when traffic falls outside the 99% confidence interval for more than one hour, then combine
    that with the install/update event and the permission/signature signals into a composite risk score,
    surfacing the top-3 contributing features (e.g., egress spike, new ASN, DGA NXDOMAIN burst) in the
    alert. This fused view is the most robust way to confirm that a supply-chain-compromised app has begun
    adversary communications consistent with Initial Access and follow-on C2.
  answer_sources: *id002
  range: Last 90 days for training, with continuous scoring of post-update traffic windows.
  queries:
  - technology: ML pipeline pseudocode
    query: model = per_device_timeseries(hourly_bytes_out, unique_dst_ips, byte_ratio, tls_flow_metadata[cipher_suites,extensions,cert_attrs,pkt_len,inter_arrival]);
      dga = rf_svm_classify_nxdomain(dns_features); ALERT when outside 99%_CI for >1h; composite = combine(traffic_anomaly,
      install_update_event, permission_signature_signals); OUTPUT device, package_name, composite_score,
      top_3_features.
