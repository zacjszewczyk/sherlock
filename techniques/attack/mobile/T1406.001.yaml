name: 'T1406.001: Steganography'
id: ddd4e390-4864-4afe-9787-31e52d8be921
description: Investigate whether an adversary is using steganography on managed mobile devices (Android)
  to hide data in digital media — images, audio, video, or text — in order to exfiltrate sensitive information
  or covertly deliver malicious tooling while evading detection. This playbook helps an analyst correlate
  opaque media arriving over the network with high-entropy or anomalous edits to media files in app-writable
  storage, and with subsequent decoding/extraction or upload/share of the modified carrier. It guides
  network-level hunting (Zeek files/conn/http/dns) for media transfers to known-bad or never-before-used
  infrastructure, oversized or high-entropy carriers, poor recompression ratios, and bursts of failed/blocked
  media egress; device-level hunting (MDM inventory, mobile EDR, sandbox reports) for embedded steganography
  libraries, anomalous on-device media entropy, LSB colour-model and audio MFCC artifacts, and CNN/ML
  steganalysis of quarantined media; and behavioral correlation of a non-allowlisted process reading a
  media file and rapidly egressing to a blocklisted or statistically rare destination. Together these
  questions surface the read-media-then-exfiltrate primitive that characterizes stegomalware on mobile
  fleets.
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
