questions:
- question: Are media files (image/audio/video) transferred to or from mobile devices reaching destination
    IPs or domains that appear on threat-intelligence blocklists, or arriving from a CDN/domain the app
    has never used before?
  context: 'Defense Evasion: stegomalware carriers typically arrive from or are exfiltrated to infrastructure
    distinct from the legitimate gallery/CDN sources an app normally uses, so destination reputation and
    novelty are strong leads. Join Zeek files.log with conn.log on the uid field to attribute each media
    object to its connection, then enrich with http.log (Host header) and dns.log (query/answer). A positive
    result is an opaque image/*, audio/* or video/* object whose destination IP (id.resp_h) or resolved
    domain matches a known-malicious feed, or which is downloaded from a domain/ASN with no prior history
    for that app — both warrant pivoting to on-device evidence. A negative result (well-known, previously-seen
    media CDN) lowers but does not eliminate suspicion.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Corporate Wi-Fi network egress points, Guest Wi-Fi network segments, VPN concentrators serving
    mobile devices, Cloud storage service gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "join files.log f, conn.log c on f.uid==c.uid\nlookup http.log h on uid -> host; lookup dns.log\
      \ d on host -> query\nwhere f.mime_type in ('image/*','audio/*','video/*')\nand (c.id.resp_h in\
      \ threat_intel_ips or d.query in threat_intel_domains\n     or host not in seen_media_hosts[app])\n\
      => alert 'media transfer to known-bad or novel host'"
- question: Do any transferred media files exceed the 99th-percentile size for their MIME type, or carry
    Shannon entropy above the ~7.2 floor (approaching 8.0), indicating embedded or encrypted content rather
    than ordinary media?
  context: 'Defense Evasion: embedding hidden payloads inflates carrier size and randomness. For each
    mime_type in files.log build a 30-day rolling baseline of seen_bytes and per-type Shannon entropy,
    then alert when a transfer exceeds the type''s 99th-percentile size (Volume) OR when entropy exceeds
    the deterministic floor of 7.2 — clean JPEG/PNG payload bytes typically sit below ~7.0 while encrypted/embedded
    content approaches 8.0. Derive a tighter per-MIME threshold from your own baseline to limit false
    positives. A positive result is an oversized or high-entropy carrier; correlate with destination reputation
    and on-device file events to confirm.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Corporate Wi-Fi network egress points, Guest Wi-Fi network segments, VPN concentrators serving
    mobile devices, Cloud storage service gateways'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each mime_type in files.log over last 30d:\n  base_size = p99(seen_bytes); base_H = baseline(entropy)\n\
      for new file f:\n  if f.seen_bytes > base_size[f.mime] or f.entropy > max(7.2, p99_entropy[f.mime]):\n\
      \    alert 'oversized/high-entropy media carrier'"
- question: When already-compressed media (JPEG/MP4/MP3) is re-compressed with a strong archiver, does
    the recompression ratio fall in the worst-compressing 1% for that MIME type, suggesting embedded data
    has broken the carrier's statistical structure?
  context: 'Defense Evasion: embedding hidden information disrupts the natural statistical structure of
    a carrier and raises its entropy, so stego carriers compress measurably worse than clean files of
    the same already-compressed type. For each transferred media file compute the recompression ratio
    (compressed size / original size) using a strong archiver and compare against the per-MIME distribution.
    A positive result is a file whose ratio is in the top 1% of poorly-compressing files for its type
    — clean JPEG/MP4/MP3 are already near-incompressible but consistent, whereas stego content deviates.
    This is a useful complement to raw entropy because it captures structural disruption that entropy
    alone may miss.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Corporate Wi-Fi network egress points, Guest Wi-Fi network segments, VPN concentrators serving
    mobile devices, Cloud storage service gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each already-compressed media f (jpeg/mp4/mp3):\n  ratio = size(strong_archiver(f)) /\
      \ f.size\n  if ratio in top1pct(poor_compression[f.mime]):\n    alert 'compression-ratio anomaly:\
      \ possible stego carrier'"
- question: Is any app generating a burst of failed or blocked media egress — blocked outbound connections,
    TLS handshake failures, NXDOMAIN responses, or HTTP 4xx/5xx on media requests — immediately before
    a successful opaque-media upload?
  context: 'Defense Evasion: exfiltration attempts often probe infrastructure and fail before succeeding,
    so a spike in failed/blocked media egress preceding a successful opaque-media POST is a distinct signal.
    Track per-app rates of blocked outbound connections, TLS handshake failures, dns.log NXDOMAIN (rcode)
    responses, and HTTP 4xx/5xx on media-content requests as a State/Failure metric, and alert when an
    app''s failure rate exceeds 3 standard deviations above its 30-day mean. A positive result — a failure
    burst then a successful media upload — should raise severity and trigger correlation with destination
    reputation and on-device file activity.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Corporate Wi-Fi network egress points, Guest Wi-Fi network segments, VPN concentrators serving
    mobile devices, Cloud storage service gateways'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per app over 1m windows:\n  fails = count(blocked_conn + tls_fail + dns.rcode==NXDOMAIN +\
      \ http.status in 4xx/5xx on media)\n  if fails > mean30d(app) + 3*std30d(app) and followed_by(successful\
      \ media upload):\n    alert 'failed media egress burst then upload'"
- question: Does an Isolation Forest trained on benign media-transfer features score any new transfer
    in the top 1% of anomaly scores, and which features (entropy delta, ASN rarity, upload/download ratio)
    drive that score?
  context: 'Defense Evasion: many stego signals are multivariate and only emerge when size, entropy, timing,
    and destination are considered together. Train an Isolation Forest on benign-traffic features from
    files.log/conn.log/http.log — file size, MIME type, computed entropy, transfer duration, bytes-up/bytes-down
    ratio (Volume), connection frequency per minute (Frequency), destination ASN rarity, port, user agent,
    and time of day. Score new transfers and investigate the top 1% anomaly scores; the alert MUST list
    the top-3 contributing features so an analyst can triage quickly (e.g., entropy delta + ASN rarity
    + upload/download ratio strongly suggests exfiltration of a stego carrier). A positive result is a
    high-scoring transfer with interpretable drivers; pivot to device evidence to confirm.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Corporate Wi-Fi network egress points, Guest Wi-Fi network segments, VPN concentrators serving
    mobile devices, Cloud storage service gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [size, mime, entropy, duration, up_down_ratio, conn_freq_per_min,\n           \
      \ dest_asn_rarity, port, user_agent, hour]\nmodel = IsolationForest(train=benign_transfers)\nscore\
      \ = model.decision_function(new_transfer)\nif score in top1pct(anomalies):\n  alert with top3_contributing_features(new_transfer)"
- question: Do any installed app binaries (.apk/.ipa) contain strings, function names, or import-table
    entries matching known steganography libraries (PixelKnot, F5, OpenStego, LSBSteganography, Steghide,
    OutGuess), especially when combined with INTERNET and storage permissions?
  context: 'Defense Evasion: stegomalware ships its embedding/extraction code inside the carrier app,
    so the presence of a known steganography library is a direct, high-severity indicator. Via MDM/EDR,
    retrieve installed .apk binaries and scan with YARA for the function names, strings, and import-table
    entries of common stego libraries. A positive result is a YARA hit — and severity rises sharply when
    the same app also requests INTERNET plus READ/WRITE_EXTERNAL_STORAGE, because that combination supplies
    both the means to embed/extract and the channel to move carriers. A negative result reduces but does
    not eliminate risk, since custom or obfuscated embedding code may evade signatures.'
  answer_sources:
  - MDM application inventory logs
  - Mobile EDR file creation events
  - Mobile EDR file modification events
  - Mobile application sandbox analysis reports
  - 'NAI: Managed mobile device fleet, Enterprise application store and repository, Mobile device sandboxing
    environment'
  range: Last 90 days
  queries:
  - technology: MDM/EDR YARA pseudocode
    query: "for each installed_app a from MDM inventory:\n  hits = yara_scan(a.binary, rules=['PixelKnot','F5','OpenStego',\n\
      \         'LSBSteganography','Steghide','OutGuess'])\n  if hits and a.perms superset {INTERNET,\
      \ READ/WRITE_EXTERNAL_STORAGE}:\n    alert 'stego library + exfil permissions' severity=high"
- question: On periodic EDR scans of DCIM/Downloads/Pictures, does any new or modified media file have
    an entropy z-score above 3 for its file type while also exceeding the absolute 7.2 entropy floor?
  context: 'Defense Evasion: hidden or encrypted payloads raise a media file''s entropy above its peers.
    Periodically scan media via the EDR agent and, per extension, maintain a baseline of Shannon entropy
    (mean mu, std sigma). For each new/modified file compute entropy and the z-score z=(x-mu)/sigma; alert
    when z exceeds 3 AND absolute entropy exceeds the 7.2 hard floor. Keeping the hard floor prevents
    alerting on naturally high-variance but benign formats while the z-score adapts per type. A positive
    result is a statistical outlier carrier on local storage; correlate with the originating app, file-creation
    timing, and any subsequent network egress.'
  answer_sources:
  - MDM application inventory logs
  - Mobile EDR file creation events
  - Mobile EDR file modification events
  - Mobile application sandbox analysis reports
  - 'NAI: Managed mobile device fleet, Enterprise application store and repository, Mobile device sandboxing
    environment'
  range: Last 90 days
  queries:
  - technology: EDR/Stats pseudocode
    query: "for ext in media_exts: (mu, sigma) = baseline_entropy(ext)\nfor new_or_modified file f in\
      \ DCIM/Downloads/Pictures:\n  z = (entropy(f) - mu[f.ext]) / sigma[f.ext]\n  if z > 3 and entropy(f)\
      \ > 7.2:\n    alert 'on-device high-entropy media outlier'"
- question: For PNG/BMP images on device, do per-channel statistics after RGB<->HSV conversion deviate
    from the baseline for that source app or camera, indicating least-significant-bit (LSB) embedding?
  context: 'Defense Evasion: LSB embedding perturbs the least-significant-bit plane in ways that surface
    as channel-statistic deviations once an image is converted between colour models. For PNG/BMP images
    convert RGB<->HSV and compute per-channel statistic deltas, then flag images whose post-conversion
    channel deltas exceed the baseline for that source app/camera. This colour-model approach catches
    spatial-domain LSB stego that raw whole-file entropy can miss because the change is localized to a
    bit plane. A positive result is an image whose channel statistics diverge from its source profile;
    quarantine and escalate to deeper steganalysis.'
  answer_sources:
  - MDM application inventory logs
  - Mobile EDR file creation events
  - Mobile EDR file modification events
  - Mobile application sandbox analysis reports
  - 'NAI: Managed mobile device fleet, Enterprise application store and repository, Mobile device sandboxing
    environment'
  range: Last 90 days
  queries:
  - technology: EDR/Stats pseudocode
    query: "for each png/bmp img on device:\n  hsv = rgb_to_hsv(img)\n  deltas = per_channel_stats(img)\
      \ - per_channel_stats(hsv)\n  if any(deltas > baseline[source_app_or_camera]):\n    alert 'LSB embedding\
      \ suspected (colour-model anomaly)'"
- question: Do audio tracks or video audio streams on device produce MFCC features that score as high-anomaly
    against a benign-audio Gaussian Mixture Model / calibrated baseline, suggesting audio steganography?
  context: 'Defense Evasion: audio carriers can hide data via transcoding, LSB, or phase embedding that
    does not show up in simple entropy. Extract MFCC (mel-frequency cepstral coefficient) features from
    audio tracks and video audio streams and score them against a Gaussian Mixture Model or calibrated
    (re-embedding) feature baseline trained on benign device audio; alert on high anomaly likelihood.
    This is effective specifically for transcoding steganography and LSB/phase audio embedding. A positive
    result is an audio file with anomalous MFCC likelihood; quarantine and correlate with the source app
    and any media egress.'
  answer_sources:
  - MDM application inventory logs
  - Mobile EDR file creation events
  - Mobile EDR file modification events
  - Mobile application sandbox analysis reports
  - 'NAI: Managed mobile device fleet, Enterprise application store and repository, Mobile device sandboxing
    environment'
  range: Last 90 days
  queries:
  - technology: EDR/Stats pseudocode
    query: "gmm = train(MFCC(benign_device_audio))\nfor each audio/video-audio stream a on device:\n \
      \ feats = MFCC(a)\n  if -gmm.log_likelihood(feats) > anomaly_threshold:\n    alert 'audio steganogram\
      \ suspected (MFCC anomaly)'"
- question: Does a residual-front-end CNN steganalyzer flag any quarantined image as containing weak adaptive
    embedding (S-UNIWARD/WOW/J-UNIWARD), and which regions/features drive the score?
  context: 'Defense Evasion: modern adaptive embedding (S-UNIWARD, WOW, J-UNIWARD) hides data in hard-to-model
    regions and evades entropy-based detection. Run a residual-front-end CNN steganalyzer (fixed SRM high-pass
    filter bank with truncation activation, or a DenseNet with the CNN-SCA-GFR ensemble for JPEG) on quarantined
    images to detect this weak adaptive embedding. Deploy with continual learning so the model adapts
    to new embedding tools without full retraining, and require the alert to surface the top-3 features/regions
    driving the score for analyst triage. A positive result is a high-confidence steganalysis hit; treat
    the carrier as confirmed stego and reconstruct its arrival and egress path.'
  answer_sources:
  - MDM application inventory logs
  - Mobile EDR file creation events
  - Mobile EDR file modification events
  - Mobile application sandbox analysis reports
  - 'NAI: Managed mobile device fleet, Enterprise application store and repository, Mobile device sandboxing
    environment'
  range: Last 90 days
  queries:
  - technology: EDR/ML pseudocode
    query: "model = ResidualCNN(SRM_filters + truncation) or DenseNet(CNN-SCA-GFR)\nfor each quarantined\
      \ image img:\n  p = model.predict_stego(img)\n  if p > threshold:\n    alert 'adaptive embedding\
      \ detected' with top3_regions(img)\ncontinual_learning.update(model, new_tool_samples)"
- question: Does a Gradient Boosting classifier using sandbox + MDM features flag any installed app as
    steganography-capable, and what are the top contributing features behind its risk score?
  context: 'Defense Evasion: combining static, dynamic, and provenance signals classifies risky apps better
    than any single indicator. Train a Gradient Boosting Classifier to flag steganography-capable apps
    using sandbox + MDM features: requested permissions (READ/WRITE_EXTERNAL_STORAGE, INTERNET), YARA
    stego-library hits, suspicious API sequences, store-of-origin (official vs. third-party), and obfuscation
    metrics. Output a per-app risk score and surface the top-3 contributing features in the alert. A positive
    result is a high-risk app — particularly one sideloaded from a third-party store with stego-library
    hits and broad storage+network permissions; prioritize it for sandbox review and fleet-wide prevalence
    checks.'
  answer_sources:
  - MDM application inventory logs
  - Mobile EDR file creation events
  - Mobile EDR file modification events
  - Mobile application sandbox analysis reports
  - 'NAI: Managed mobile device fleet, Enterprise application store and repository, Mobile device sandboxing
    environment'
  range: Last 90 days
  queries:
  - technology: Sandbox/ML pseudocode
    query: "features = [perms(READ/WRITE_EXTERNAL_STORAGE, INTERNET), yara_stego_hits,\n            suspicious_api_seqs,\
      \ store_of_origin, obfuscation_metrics]\nclf = GradientBoosting(train=labeled_apps)\nscore = clf.predict_proba(app)\n\
      if score > risk_threshold:\n  alert 'steganography-capable app' with top3_features(app)"
- question: Does a non-allowlisted process read a media file (.jpg/.png/.mp3/.mp4) and within 5 seconds
    initiate an outbound connection to a threat-intel-blocklisted destination?
  context: 'Defense Evasion: the read-media-then-egress chain is the core stegomalware exfiltration primitive.
    In a SIEM, join EDR process and network logs and trigger when one process (a) is not on the allowlist
    of standard media viewers/editors, (b) performs a file-read on a media extension, and (c) within a
    5-second window initiates an outbound connection to a blocklisted destination. The tight temporal
    window and the allowlist exclusion make this a high-fidelity rule. A positive result strongly implies
    a carrier was just read and its hidden payload exfiltrated; isolate the device, capture the media,
    and trace the destination.'
  answer_sources:
  - Mobile EDR process events
  - Mobile EDR file access events
  - Mobile EDR network flow logs
  - Zeek conn.log
  - 'NAI: Managed mobile device fleet, Corporate Wi-Fi network egress points, VPN concentrators'
  range: 'Last 90 days (event-centered: media_read +/- 5s of network_connect)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'join edr_process p, edr_file_access fa, edr_net n on (device, pid)

      where p.name not in media_app_allowlist

      and fa.ext in (''.jpg'',''.png'',''.mp3'',''.mp4'')

      and n.ts - fa.ts <= 5s

      and n.dest in threat_intel_blocklist

      => alert ''read-media-then-egress to known-bad'''
- question: After reading a media file, does a process connect to an ASN in the bottom 5% of its historical
    frequency or a never-before-seen ASN — and is this preceded by repeated failed/blocked connection
    attempts?
  context: 'Defense Evasion: even without a blocklist hit, exfiltration often targets rare or novel infrastructure.
    Baseline each app process by the ASNs it contacts and historical connection frequency per ASN (Frequency),
    and flag as anomalous when a process reads a media file then connects to an ASN in the bottom 5% of
    its historical frequency or to a never-before-seen ASN. Concurrently profile the process''s failed/blocked
    connection rate (State); repeated connection failures before a successful media upload raise severity.
    A positive result is a rare-ASN media-related egress, especially after a failure burst; correlate
    with destination reputation and on-device carrier entropy.'
  answer_sources:
  - Mobile EDR process events
  - Mobile EDR file access events
  - Mobile EDR network flow logs
  - Zeek conn.log
  - 'NAI: Managed mobile device fleet, Corporate Wi-Fi network egress points, VPN concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per process: freq[asn], seen_asns, fail_rate\non media_read by proc then network_connect:\n\
      \  if dest.asn not in seen_asns[proc] or freq[proc][dest.asn] in bottom5pct:\n    sev = base\n \
      \   if recent_failed_conn_burst(proc): sev += 1\n    alert 'rare-ASN media egress' severity=sev"
- question: Does an LSTM autoencoder trained on benign EDR event sequences flag a high reconstruction
    error for a process's event flow, and do the top contributing transitions include media_read -> external_connect
    within 5 seconds?
  context: 'Defense Evasion: malicious read-media-then-exfiltrate flows form abnormal event sequences
    that a sequence model can learn to recognize. Train an LSTM autoencoder on benign EDR event sequences
    (process_start, file_read_media, network_connect_external, file_write) encoded as fixed-length vectors;
    high reconstruction error flags abnormal flows. Require the alert to report the top-3 events/transitions
    contributing most to the reconstruction error (e.g., media_read -> external_connect within 5s) so
    an analyst can triage. A positive result is a high-error sequence whose drivers match the exfiltration
    primitive; pivot to network and on-device evidence to confirm.'
  answer_sources:
  - Mobile EDR process events
  - Mobile EDR file access events
  - Mobile EDR network flow logs
  - Zeek conn.log
  - 'NAI: Managed mobile device fleet, Corporate Wi-Fi network egress points, VPN concentrators'
  range: Last 90 days
  queries:
  - technology: EDR/ML pseudocode
    query: "model = LSTM_autoencoder(train=benign_event_sequences)\nseq = encode([process_start, file_read_media,\
      \ network_connect_external, file_write])\nerr = reconstruction_error(model, seq)\nif err > threshold:\n\
      \  alert 'anomalous event sequence' with top3_transitions(seq)"
