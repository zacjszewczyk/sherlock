name: 'T1676: Linked Devices'
id: 7762efbf-5489-4342-af0d-3e243049ffa1
description: 'Investigate suspected abuse of the "linked devices" feature in end-to-end encrypted messaging
  apps (Signal, WhatsApp) where an adversary registers the victim''s account to an attacker-controlled
  companion device (desktop, web, or tablet) to gain persistence, collect messages and contacts, and send
  messages as the victim. Because linking is cryptographically legitimate, this playbook focuses on enrollment
  and identity-change events the user did not initiate: a new entry in the account device list, per-contact
  security-code/identity-key changes, bulk message-history transfer or session sync to a new device fingerprint,
  and outbound traffic from previously unseen endpoints. It also covers the common QR-code phishing (quishing)
  front-end, where a lure masquerading as a group invite, security alert, or pairing instruction tricks
  the user into scanning a code that links their account. The playbook combines a deterministic device-list/security-code-change
  baseline with statistical scoring of new-device source attributes, change-point detection on linking
  volume and frequency, sequence-based anomaly detection of the enrollment chain, and pre-scan classification
  of malicious QR images.'
type: technique
