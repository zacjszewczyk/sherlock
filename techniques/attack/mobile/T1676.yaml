questions:
- question: Does the messaging-app companion/linked-device list for any monitored account contain a device
    that is not on the approved allowlist, and was a new device-link event, per-contact security-code/identity-key
    change, or unmanaged pairing observed that the user did not initiate?
  context: 'Tactic: Persistence. The linked-device list is authoritative state: every legitimate companion
    device (Signal desktop, WhatsApp web/desktop, tablet) appears as an entry, and identity-key (security-code)
    changes occur when a new device joins. Treat the per-account device list as an allowlist built from
    OS notification logs, application audit records, and MDM/UEM audit logs, then alert on any addition,
    any per-contact security-code/identity-key change, or any pairing from an unmanaged device. This implements
    the companion-device architecture in the WhatsApp Encryption Overview white paper, the Sesame device-set
    model in Multi-Device for Signal, and the enterprise allowlist/audit model in NIST SP 800-124r2. A
    device-link from a fingerprint/IP/ASN not on the approved list is a high-confidence (floor) alert
    regardless of any model score; a match to an approved device is benign. This deterministic floor must
    always run alongside the statistical and ML methods and must never be replaced by them.'
  answer_sources:
  - Mobile EDR/MTD telemetry
  - Mobile OS notification logs
  - Application audit logs
  - MDM/UEM audit logs
  - Email/message gateway (QR-image attachments)
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Enterprise-managed mobile devices, MDM/UEM and mobile threat defense consoles, corporate web/email
    gateways that may carry QR-code lures, and linked desktop/tablet endpoints used to access messaging
    services.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM os_notifications, app_audit, mdm_audit\nWHERE event IN ('device_linked','companion_added','security_code_change','identity_key_change')\n\
      JOIN approved_device_allowlist ON account, device_fingerprint\nWHERE device_fingerprint NOT IN approved_device_allowlist[account]\n\
      \   OR event IN ('security_code_change','identity_key_change')\n   OR device_managed = false\nEMIT\
      \ high_confidence_alert"
- question: Was a QR-code scan, camera-decode event, or delivery of a QR-image attachment through the
    mail/message gateway followed within a short window (default <=120 seconds) by a messaging-app device-link,
    especially when the QR arrived externally or was disguised as a group invite, security alert, or pairing
    instruction?
  context: 'Tactic: Persistence. QR-code phishing (quishing) is the documented front-end of linked-device
    abuse: the adversary tricks the user into scanning a code that links the account to an attacker-controlled
    device. Correlate a QR scan/camera-decode event (or gateway delivery of a QR-image attachment) with
    a device-link occurring within a tight time window. A short-interval QR-scan -> device-link sequence
    is strong evidence of the lure-to-linking chain described in Gone Quishing and Hooked. Prioritize
    when the QR was delivered externally or masqueraded as a group invite, security alert, or legitimate
    pairing instruction. A positive result tightly couples a social-engineering delivery with a sensitive
    account-state change; a negative result (link without any preceding QR) points to other linking vectors.'
  answer_sources:
  - Mobile EDR/MTD telemetry
  - Mobile OS notification logs
  - Application audit logs
  - MDM/UEM audit logs
  - Email/message gateway (QR-image attachments)
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Enterprise-managed mobile devices, MDM/UEM and mobile threat defense consoles, corporate web/email
    gateways that may carry QR-code lures, and linked desktop/tablet endpoints used to access messaging
    services.'
  range: 'Last 90 days; event-centered: correlate QR-scan/QR-delivery events to device-link events within
    120 seconds'
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM qr_events (camera_decode OR gateway_qr_attachment)

      JOIN device_link_events ON account

      WHERE device_link.time - qr_event.time BETWEEN 0 AND 120s

      SET priority = high IF qr_event.source = external OR qr_event.lure_type IN (''group_invite'',''security_alert'',''pairing_instruction'')

      EMIT alert'
- question: After a device-link enrollment, was there a rapid bulk message-history sync, message export,
    or outbound traffic from a newly seen endpoint, particularly where a security-code change was immediately
    followed by a bulk history read or where the new device sent messages or downloaded history within
    minutes of pairing?
  context: 'Tactic: Persistence. Takeover-style linking shows a characteristic burst: enrollment, then
    near-immediate bulk history transfer and outbound traffic from a brand-new endpoint. WhatsApp automatically
    sends an encrypted copy of recent history to a newly linked device, and Signal fans messages out to
    every device in the set, so a legitimate link still produces sync traffic - but a malicious takeover
    compresses enrollment, security-code change, bulk read, and exfiltration into minutes from an unfamiliar
    fingerprint/IP. Correlate the link event with Zeek conn.log/ssl.log flows from the new endpoint. Prioritize
    a security-code change immediately followed by bulk history read, or messaging/downloading within
    minutes of pairing. A positive result indicates active collection/exfiltration via the linked device.'
  answer_sources:
  - Mobile EDR/MTD telemetry
  - Mobile OS notification logs
