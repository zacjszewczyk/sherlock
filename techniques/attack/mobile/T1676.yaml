  range: Last 90 days (use 30-90 days of per-account history to fit priors)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each link_event:\n  p_legit = LR(src_ip, asn, geo, device_fp, hour | account_history,\
      \ population_prior)\n  score = -log(p_legit)\n  ALERT IF asn rare_for(account) OR geo rare_for(account)\
      \ OR device_fp NOT IN account_history OR score > threshold"
- question: Do per-account baselines of linking volume, frequency, and failure state show an anomaly -
    history-sync or post-link outbound bytes above the 95th percentile or 3 standard deviations, >=2 new
    devices linking in a short window, or repeated failed pairings preceding a success?
  context: 'Tactic: Persistence. Build per-account baselines across three dimensions: Volume (message-history
    sync byte volume and post-link outbound bytes), Frequency (device-links per 30 days and sessions/min
    after pairing), and State (failed vs. successful pairing attempts). Alert when sync or outbound volume
    exceeds the account''s 95th percentile or 3 sigma, when two or more new devices link in a short window,
    or when repeated failed pairings precede a success (brute-force/lure-retry signature). Detect the
    abrupt shift in device count and sync volume at link time using CUSUM/PELT/Bayesian online change-point
    methods (Aminikhanghahi & Cook), and use scan/engagement base rates from Hooked and Gone Quishing
    to prioritize QR-preceded links. Derive dataset-specific thresholds from 30-90 days of per-account
    history. A change-point at link time concurrent with a volume spike is strong evidence of abuse.'
