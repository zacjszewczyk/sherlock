  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each account:\n  baseline = stats(history_sync_bytes, post_link_outbound_bytes, links_per_30d,\
      \ sessions_per_min, failed_pairings) over 30-90d\n  cp = changepoint(device_count, sync_volume)\
      \  # CUSUM/PELT/Bayesian\n  ALERT IF sync_bytes > p95 OR > mean+3*std\n        OR new_devices_in_window\
      \ >= 2\n        OR repeated_failed_pairings_before_success\n        OR cp coincides_with link_time"
- question: When the ordered sequence of mobile/MDM/app events is modeled, does an enrollment chain (device-link
    -> bulk-sync -> outbound) appear as an unexpected ordering compared with normal account behavior,
    and which top contributing events drive the anomaly?
  context: 'Tactic: Persistence. Train an LSTM log-sequence model on the normal ordering of mobile/MDM/app
    events so an unexpected device-link -> bulk-sync -> outbound chain is flagged as an out-of-order anomaly
    (DeepLog). Use an interpretable attention-RNN (Brown et al.) so each alert surfaces the top-3 contributing
    events - e.g., security-code change, sync-volume spike, new ASN - rather than a bare score, giving
    the analyst an explainable starting point. Combine with the trainable device/geo/behavioral risk classifiers
    of Freeman et al. and Doerfler et al. Run all models in parallel with the deterministic device-list/security-code-change
    floor and never replace it. A flagged sequence with explainable top events that match takeover behavior
    warrants escalation; a sequence consistent with the user''s normal linking workflow is benign.'
