  range: 'Last 90 days; event-centered: examine 0-15 minutes after each device-link event'
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM device_link_events AS link

      JOIN app_audit a ON account WHERE a.event IN (''history_sync'',''message_export'',''bulk_read'')
      AND a.time - link.time < 15m

      JOIN zeek_conn c ON src_endpoint = link.new_device WHERE c.first_seen >= link.time

      SET priority = high IF security_code_change BETWEEN link.time AND a.time

      EMIT alert'
  - technology: Zeek/pseudocode
    query: 'conn.log + ssl.log: filter orig_h == new_linked_device_ip AND ts >= link_time

      aggregate orig_bytes over 15m window; flag if first_seen_endpoint AND bytes > history_sync_threshold'
- question: Does the source IP/ASN, geolocation, device fingerprint, or time-of-day of a device-link or
    first companion session deviate from the account's historical baseline, e.g. a rare ASN/geo for that
    account or a never-before-seen device fingerprint?
  context: 'Tactic: Persistence. Score each link/enrollment and first companion session with a likelihood-ratio
    model over source IP/ASN, geolocation, device fingerprint, and time-of-day, smoothing never-before-seen
    values with population priors (Freeman et al., NDSS 2016). Use the device-history plus geolocation-deviation
    step-up logic and base rates from Doerfler et al. (WWW 2019) and the attacker-vs-victim source mismatch
    from Thomas et al. (CCS 2017). Alert when the linking source ASN/geo is rare for the account or the
    device fingerprint is new. This catches the common pattern where an attacker links from infrastructure
    (hosting ASN, foreign geo) that the victim never uses. A high anomaly score is suspicious but should
    be fused with the deterministic device-list floor; a score matching the account''s normal sources
    is benign.'
