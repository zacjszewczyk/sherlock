  queries:
  - technology: SIEM/ML pseudocode
    query: "model = LSTM_logsequence(train=normal_event_order)  # DeepLog\nattn = attention_RNN(interpretable=true)\
      \  # Brown et al.\nFOR each event_sequence:\n  if model.predict_next != observed_event: flag_anomaly\n\
      \  alert.top3 = attn.contributing_events(seq)  # e.g. security_code_change, sync_spike, new_asn\n\
      fuse_with deterministic_device_list_floor (never replace)"
- question: When a QR image is rendered in a message or email, can it be classified as malicious vs. benign
    directly from its structure and pixel patterns - before any user scans it or its payload is visited
    - to pre-empt the QR-phishing vector that initiates linked-device abuse?
  context: 'Tactic: Persistence. Add a pre-scan prevention layer: where a QR image appears in a message
    or email, classify it as malicious vs. benign directly from QR structure and pixel patterns without
    extracting or visiting the encoded payload, using the tree-ensemble (XGBoost, AUC ~0.91) approach
    of Trad & Chehab (2025). Surface the top contributing structural features in the alert for analyst
    review. Because scanning a malicious QR is the documented trigger for linked-device abuse, catching
    the lure at delivery time stops the attack before the user can scan it. A malicious classification
    on an inbound QR-bearing message should trigger quarantine/warning; a benign classification lets the
    message through while logging for correlation with later link events.'
