  range: Last 90 days; evaluate at message/email delivery time
  queries:
  - technology: Email gateway/ML pseudocode
    query: "FOR each inbound message WITH qr_image:\n  features = extract_structural_pixel_features(qr_image)\
      \  # no payload extraction\n  p_mal = xgboost_qr_classifier(features)  # Trad & Chehab 2025\n  IF\
      \ p_mal > threshold: quarantine + alert(top_features)\n  ELSE: deliver + log for correlation"
