name: 'T1658: Exploitation for Client Execution'
id: 454270a5-c4d5-458b-8a3b-83047ea17006
description: 'Investigate whether an adversary is exploiting vulnerabilities in client applications on
  managed mobile devices (Android and iOS) to achieve arbitrary code execution, including powerful zero-click
  and one-click delivery via SMS/iMessage, malicious web content (drive-by), and Apple Wireless Direct
  Link (AWDL/AirDrop) exploitation. This playbook helps an analyst hunt for the observable consequences
  of client-side exploitation: client application processes (e.g., mobile Safari, Gmail) spawning shells
  or command-line utilities or beaconing to malicious, newly registered, high-entropy, or raw-IP destinations;
  statistically significant spikes in application or OS-level crashes (WebKit, SpringBoard, ImageIO, IMTransferAgent)
  correlated with the installation of unsanctioned apps or configuration profiles, as seen in the FORCEDENTRY
  zero-click chain; and anomalous peer-to-peer AWDL traffic using IPv6 link-local addressing on corporate
  WLAN segments followed by crashes, unauthorized process execution, or external callbacks. Detection
  methods span symbolic logic (threat-intel and allowlist matching, syscall self-profiles, AWDL protocol
  fingerprints), statistical baselining (rare process chains, DNS entropy and NXDOMAIN change points,
  cohort crash-rate outliers, P2P volume baselines), and machine learning (URL/DNS/connection classifiers,
  log-sequence and static app-vetting models, and intra-WLAN anomaly detection) so analysts can determine
  whether mobile devices are being actively exploited for client execution.'
type: technique
related:
- tactic_id: TA0041
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any managed mobile device query or connect to a domain that appears in threat intelligence,
    was first observed or registered within the last 30 days (a newly registered domain), or did a device
    contact a raw IP address directly over HTTP/HTTPS?
  context: Under the Execution tactic, successful client-side exploitation almost always produces outbound
    command-and-control. This symbolic-logic check joins Zeek dns.log (for the resolving query) to Zeek
    conn.log (to confirm an established connection) for mobile-device source IPs and alerts when the queried
    domain is on a threat-intel feed or was registered/first-seen within the last 30 days. Passive-DNS
    rules over query time, answer set, TTL, and name patterns (per [EXPOSURE](https://www.ndss-symposium.org/wp-content/uploads/2017/09/12_3.pdf))
    reinforce the verdict. Raw-IP destinations on HTTP/HTTPS bypass DNS entirely and are treated as a
    separate high-severity signal because legitimate mobile apps overwhelmingly use named hosts. A positive
    hit on a freshly exploited browser or messaging app is strong evidence of an implant calling home;
    a negative result reduces but does not eliminate suspicion since C2 may use aged or compromised legitimate
    infrastructure.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Mobile EDR/MDM process logs
  - Mobile EDR/MDM syscall/sandbox logs
  - Mobile OS crash logs
  - 'NAI: Corporate Wi-Fi network gateways, Cloud-based mobile security gateways, Mobile Device Management
    (MDM) servers, Endpoint mobile devices'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'mob_ips = asset_inventory(type=mobile);

      q = join(zeek_dns, zeek_conn) on uid where dns.src in mob_ips and conn.state=''SF'';

      nrd = (domain.first_seen >= now-30d) or (domain in ti_feed[''malicious'']);

      rawip = conn.proto in (''http'',''https'') and dest is_ip_literal;

      alert when nrd or rawip;

      output device, query, answer, dest_ip, conn.duration, match_reason'
- question: Did a client application process (for example com.apple.mobilesafari or com.google.android.gm)
    spawn a shell or command-line utility such as /bin/sh, curl, or wget, or execute a system-call sequence
    that does not match its learned normal behavior profile?
  context: For the Execution tactic, the clearest sign of exploitation-for-client-execution on the endpoint
    is a benign content-rendering app suddenly behaving like a launcher. Using mobile EDR/MDM process
    and sandbox telemetry, this rule alerts when a known client app spawns /bin/sh, curl, or wget, or
    when its observed system-call n-gram sequence falls outside the 'self' profile built for that app
    (the immune-system 'self' approach from [A Sense of Self for Unix Processes](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf)
    by Forrest et al.). The alert surfaces the offending parent->child process pair or the count of unmatched
    syscall sequences. Browsers and mail clients essentially never need an interactive shell, so a true
    positive is high-fidelity evidence of code execution; tuning the self-profile per app version limits
    false positives from legitimate helper invocations.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Mobile EDR/MDM process logs
  - Mobile EDR/MDM syscall/sandbox logs
  - Mobile OS crash logs
  - 'NAI: Corporate Wi-Fi network gateways, Cloud-based mobile security gateways, Mobile Device Management
    (MDM) servers, Endpoint mobile devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'ev = edr_process_events(platform=mobile);

      client_apps = [''com.apple.mobilesafari'',''com.google.android.gm'', ...];

      bad_children = [''/bin/sh'',''sh'',''curl'',''wget''];

      alert when ev.parent in client_apps and ev.child in bad_children;

      seq = syscall_ngrams(ev.proc, n=6);

      alert when client_apps contains ev.proc and seq not in self_profile[ev.proc];

      output device, parent, child, unmatched_seq_count'
- question: Has a managed mobile device produced a parent-child process pair never (or rarely) seen across
    the fleet, or shown DNS queries with abnormally high entropy or a sudden change in its NXDOMAIN failure
    rate?
  context: This statistical method supports the Execution tactic by catching exploitation that does not
    match any known signature. It builds a 30-day baseline of parent-child process pairs from MDM/EDR
    logs and alerts on brand-new pairs or those in the bottom 1st percentile of prevalence. In parallel
    it computes per-query DNS name length, label count, and Shannon entropy, plus the per-device NXDOMAIN
    rate, alerting when entropy exceeds 3.5 (and is not allowlisted) or when a CUSUM/PELT change point
    appears in the failure rate (per [Ahmed et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf)).
    High DNS entropy and NXDOMAIN bursts are classic indicators of DGA-based C2 following an implant;
    rare process lineages reveal exploit-spawned execution. Thresholds must be tuned to the fleet's benign
    distribution to control noise.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Mobile EDR/MDM process logs
  - Mobile EDR/MDM syscall/sandbox logs
  - Mobile OS crash logs
  - 'NAI: Corporate Wi-Fi network gateways, Cloud-based mobile security gateways, Mobile Device Management
    (MDM) servers, Endpoint mobile devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = baseline(parent_child_pairs, window=30d);\nalert when pair.new or percentile(pair.freq)\
      \ < 1;\nfor q in dns_queries(device): e = shannon_entropy(q.name);\n  alert when e > 3.5 and q.name\
      \ not in allowlist;\nnx = nxdomain_rate(device, window=1h);\nalert when changepoint(nx) detected;\n\
      output device, pair, q.name, e, nx"
- question: Do machine-learning models flag URLs delivered via SMS/iMessage or web, DNS queries, or drive-by
    JavaScript on mobile browsers as malicious even when they are not yet on any blocklist?
  context: Supporting the Execution tactic, this ML layer scores threats before signatures exist. Not-yet-blocklisted
    URLs delivered through SMS/iMessage or web are scored with a character/word-level CNN ([URLNet](https://arxiv.org/abs/1802.03162));
    DNS queries are scored with an Isolation Forest over lexical features ([Ahmed et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf));
    and drive-by JavaScript served to mobile browsers is scored proxy-side with an SVM over static and
    dynamic features ([Cujo](https://mlsec.org/docs/2010-acsac.pdf)). The system alerts above a calibrated
    probability (e.g., >0.90) and surfaces the top-3 contributing features per the [XAI-IDS standard](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)
    so analysts can validate the verdict. This directly targets the one-click/zero-click delivery vectors
    central to T1658 (malicious links in messages, drive-by compromise), giving early warning of an exploitation
    attempt.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Mobile EDR/MDM process logs
  - Mobile EDR/MDM syscall/sandbox logs
  - Mobile OS crash logs
  - 'NAI: Corporate Wi-Fi network gateways, Cloud-based mobile security gateways, Mobile Device Management
    (MDM) servers, Endpoint mobile devices'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "for url in sms_imessage_web_urls where url not in blocklist:\n  p = URLNet.score(url);\n \
      \ alert when p > 0.90 with top3_features(url);\nfor q in dns_queries: a = isoforest_dns.score(lexical(q));\
      \ alert when a high;\nfor js in mobile_browser_js: s = svm_cujo.score(static+dynamic(js)); alert\
      \ when s>0.90;\noutput device, artifact, prob, top3_features"
- question: Does a Random Forest classifier trained on Zeek connection features flag a mobile device's
    network connection as malicious with high confidence?
  context: For the Execution tactic, post-exploitation C2 channels often differ subtly from benign mobile
    traffic. A Random Forest is trained on Zeek-derived features (query length and entropy, TLD, subdomain
    count, destination port, connection duration, bytes transferred, and connection state) and alerts
    when classification confidence exceeds 0.90, reporting the top-3 features driving the score for analyst
    triage. This complements the symbolic NRD/raw-IP rule by catching malicious connections to infrastructure
    that is not yet flagged in threat intel, learning the multivariate signature of beaconing and exfiltration
    that follows successful client execution.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Mobile EDR/MDM process logs
  - Mobile EDR/MDM syscall/sandbox logs
  - Mobile OS crash logs
  - 'NAI: Corporate Wi-Fi network gateways, Cloud-based mobile security gateways, Mobile Device Management
    (MDM) servers, Endpoint mobile devices'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "feat = zeek_features(conn, dns);  // len, entropy, tld, subdomain_cnt, dport, duration, bytes,\
      \ state\nfor c in mobile_connections:\n  conf = random_forest.predict_proba(feat(c));\n  alert when\
      \ conf > 0.90 with top3_features(c);\noutput device, dest, conf, top3_features"
- question: Did a managed mobile device install a non-allowlisted application or apply an unsanctioned
    configuration profile, and were application or OS crashes recorded on that device in the preceding
    60 minutes?
  context: 'This symbolic-logic check targets the Execution tactic''s zero-click implant-drop chain (a
    vulnerable parser crashes, then an implant or configuration profile is dropped), exactly as documented
    for [FORCEDENTRY](https://googleprojectzero.blogspot.com/2021/12/a-deep-dive-into-nso-zero-click.html).
    It monitors MDM application-install and configuration-profile events, compares them to maintained
    allowlists, and alerts on any non-allowlisted install or profile, enriching the alert with crash logs
    from the previous 60 minutes. The temporal pairing of an unexpected crash followed by a new profile/app
    is far more suspicious than either alone: it indicates that exploitation may have succeeded and persistence
    is being established. A clean allowlist match with no preceding crash is routine; a non-allowlisted
    profile arriving right after a WebKit/IMTransferAgent crash warrants immediate device isolation.'
  answer_sources:
  - Mobile OS crash logs
  - Mobile Device Management (MDM) application inventory logs
  - Mobile Device Management (MDM) configuration profile logs
  - Mobile application bytecode/static analysis (app vetting)
  - Zeek conn.log
  - 'NAI: Mobile Device Management (MDM) servers, Endpoint mobile devices, Corporate Wi-Fi network gateways'
  range: Last 90 days; enrich each install/profile event with crash logs from the preceding 60 minutes
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for ev in mdm_events(type in ['app_install','profile_update']):\n  if ev.item not in allowlist:\n\
      \    crashes = crash_logs(ev.device, window=[ev.time-60m, ev.time]);\n    alert(severity=high) with\
      \ ev.item, ev.device, crashes;\noutput device, installed_item, profile, preceding_crashes"
- question: Is a mobile device experiencing a statistically significant spike in WebKit, SpringBoard,
    ImageIO, or IMTransferAgent crashes relative to its model/OS-version cohort, accompanied by an unusual
    outbound-to-inbound byte ratio shortly afterward?
  context: Under the Execution tactic, repeated exploitation attempts against memory-unsafe parsers produce
    crash bursts before a stable implant lands. This method maintains a 30-day baseline of hourly crash
    rates per device cohort (grouped by model and OS version) for high-value crashing components and alerts
    when a device exceeds 3 standard deviations above the cohort mean or triggers a CUSUM/PELT change
    point ([change-point survey](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)). It escalates when
    the Zeek conn.log outbound-to-inbound byte ratio exceeds the 98th percentile within 15 minutes of
    the crash spike, which would indicate data being staged or exfiltrated immediately after exploitation.
    Cohort-relative baselining controls for benign OS-wide instability so that genuine targeted exploitation
    stands out.
  answer_sources:
  - Mobile OS crash logs
  - Mobile Device Management (MDM) application inventory logs
  - Mobile Device Management (MDM) configuration profile logs
  - Mobile application bytecode/static analysis (app vetting)
  - Zeek conn.log
  - 'NAI: Mobile Device Management (MDM) servers, Endpoint mobile devices, Corporate Wi-Fi network gateways'
  range: Last 30 days; correlate Zeek byte-ratio within 15 minutes of each crash spike
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'cohort = group(devices, by=[model, os_version]);

      base = baseline(hourly_crashes[component in [''WebKit'',''SpringBoard'',''ImageIO'',''IMTransferAgent'']],
      30d);

      alert when device.crash_rate > cohort.mean + 3*cohort.std or changepoint(crash_series);

      ratio = bytes_out/bytes_in (zeek_conn, window=15m around spike);

      escalate when ratio > p98;

      output device, component, crash_rate, byte_ratio'
- question: Do log-sequence and static app-analysis models identify exploit-driven crash->restart->callback
    chains or trojanized/exploit-carrying applications in the MDM app inventory?
  context: 'For the Execution tactic, this ML layer models the temporal and static signatures of mobile
    exploitation. An LSTM log-sequence model ([DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf))
    over per-device crash/restart log keys flags low-probability transitions characteristic of an exploit
    causing a crash, then a restart, then a network callback. In parallel, MDM app inventory is vetted
    with explainable static models: [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf)
    (feature-based static classification), [MaMaDroid](https://arxiv.org/pdf/1612.04433) (Markov-chain
    API-call models), and [DexRay](https://arxiv.org/pdf/2109.03326) (a bytecode-image CNN that catches
    packed payloads) to identify trojanized or exploit-carrying apps. Each detection surfaces the top-3
    contributing features so analysts can confirm. This catches both the dynamic aftermath of exploitation
    and the malicious app that may be its delivery or persistence vehicle.'
  answer_sources:
  - Mobile OS crash logs
  - Mobile Device Management (MDM) application inventory logs
  - Mobile Device Management (MDM) configuration profile logs
  - Mobile application bytecode/static analysis (app vetting)
  - Zeek conn.log
  - 'NAI: Mobile Device Management (MDM) servers, Endpoint mobile devices, Corporate Wi-Fi network gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "keys = log_template_keys(crash_restart_logs, per_device);\nfor seq in keys: p = deeplog.next_prob(seq);\
      \ alert when p < epsilon (anomalous transition);\nfor app in mdm_inventory:\n  if drebin.score(app)>thr\
      \ or mamadroid.score(app)>thr or dexray.score(bytecode_image(app))>thr:\n    alert with top3_features(app);\n\
      output device, anomalous_sequence, app, model, top3_features"
- question: Is Apple Wireless Direct Link (AWDL) or other peer-to-peer traffic, identified by IPv6 link-local
    addresses (fe80::/10), AWDL action frames, channel-hopping, or mDNS service discovery, occurring on
    a corporate WLAN segment where AirDrop is not sanctioned?
  context: Supporting the Execution tactic, AWDL is the attack surface for zero-interaction RCE on iOS
    (the AWDL buffer-overflow chain). This high-severity rule fires on any Zeek conn.log connection using
    IPv6 link-local addressing (fe80::/10) or matching AWDL protocol fingerprints, mDNS discovery, or
    channel-hopping on corporate WLAN segments where AirDrop is unsanctioned (using the fingerprints from
    [Stute et al.](https://www.usenix.org/system/files/sec19-stute.pdf)). It correlates with MDM to confirm
    there is no legitimate AirDrop use, and treats remote AWDL force-activation as the precondition for
    zero-click exploitation. Because AWDL should not appear on a managed corporate WLAN where AirDrop
    is disabled, a positive result is a strong lead that an adversary is forcing the AWDL interface up
    to exploit it.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Mobile OS crash logs
  - Mobile EDR/MDM process logs
  - 'NAI: Corporate Wi-Fi network gateways, Endpoint mobile devices'
  range: Last 90 days; correlate downstream events within 5 minutes
  queries:
  - technology: Zeek/pseudocode
    query: "awdl = zeek_conn where (src in fe80::/10 or dst in fe80::/10)\n        or proto_fingerprint\
      \ in ['awdl_action_frame','mdns_discovery','channel_hop'];\nalert(severity=high) when awdl on corporate_wlan\
      \ and airdrop_unsanctioned;\ncorrelate mdm: confirm no legitimate airdrop session;\noutput device,\
      \ peer, fe80_addr, fingerprint"
- question: Does a mobile device's AWDL/peer-to-peer connection count or hourly data volume exceed its
    own 30-day 99th-percentile baseline, especially within 5 minutes of a system crash or unauthorized
    process execution?
  context: For the Execution tactic, even where AWDL is permitted, exploitation produces abnormal P2P
    volume and timing. This method maintains a per-device 30-day baseline of AWDL/P2P connection counts
    and hourly data volume and alerts when a device exceeds its 99th percentile, applying CUSUM/PELT change-point
    detection to the per-device P2P connection-count series ([change-point survey](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)).
    It escalates when the anomaly occurs within a 5-minute window of a system crash or unauthorized process
    execution, the temporal signature of AWDL exploitation leading to code execution. Per-device baselining
    accommodates legitimate heavy AirDrop users while still surfacing the sudden bursts that accompany
    an exploit.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Mobile OS crash logs
  - Mobile EDR/MDM process logs
  - 'NAI: Corporate Wi-Fi network gateways, Endpoint mobile devices'
  range: Last 30 days; escalate when anomaly is within 5 minutes of a crash or unauthorized process
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = baseline(awdl_conn_count, awdl_hourly_bytes, per_device, 30d);

      alert when value > p99 or changepoint(conn_count_series);

      escalate when within 5m of (crash_event or unauthorized_proc_exec) on same device;

      output device, conn_count, bytes, correlated_event'
- question: Do unsupervised anomaly models (Isolation Forest or autoencoder) flag intra-WLAN connections
    with unusual protocol, port, duration, byte volume, byte ratio, or periodicity characteristic of AWDL
    exploitation?
  context: Closing out the Execution tactic, this ML method learns the normal shape of intra-WLAN traffic
    and flags outliers. An Isolation Forest or autoencoder is trained on features such as protocol, destination
    port, duration, byte volume, byte ratio, and periodicity, and assigns high anomaly scores to connections
    on non-standard ports or with unusual transfer patterns characteristic of AWDL exploitation (per [Stute
    et al.](https://www.usenix.org/system/files/sec19-stute.pdf)). The top-3 contributing features are
    surfaced in the alert per the [XAI-IDS standard](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
    This complements the AWDL symbolic rule by catching exploitation that uses permitted protocols but
    in anomalous ways, and the per-feature explanation lets an analyst quickly judge whether the session
    reflects a benign transfer or an exploit.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Mobile OS crash logs
  - Mobile EDR/MDM process logs
  - 'NAI: Corporate Wi-Fi network gateways, Endpoint mobile devices'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "feat = [proto, dport, duration, bytes, byte_ratio, periodicity];\nmodel = isolation_forest(intra_wlan_conn);\
      \  // or autoencoder reconstruction error\nfor c in intra_wlan_connections:\n  s = model.score(feat(c));\n\
      \  alert when s anomalous (esp. non_standard_port) with top3_features(c);\noutput device, peer,\
      \ dport, anomaly_score, top3_features"
