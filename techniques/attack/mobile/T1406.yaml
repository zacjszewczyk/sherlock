name: 'T1406: Obfuscated Files or Information'
id: 1eda4019-b9a6-4273-8fbe-bde493b29982
description: 'This playbook helps an analyst investigate whether an adversary is using obfuscated files
  or information to evade defenses on mobile devices (MITRE ATT&CK T1406, Obfuscated Files or Information).
  Adversaries make payloads difficult to discover or analyze by encrypting, encoding, compressing, archiving,
  or splitting them into seemingly benign fragments that are reassembled and dynamically loaded on the
  device. The hunt pursues this behavior from complementary angles across network and on-device telemetry:
  files transferred to mobile IP ranges that show high Shannon entropy or mime-type/extension mismatches
  (e.g., an APK or IPA masquerading as a .jpg); multiple small split-archive fragments (.partN, .zNN,
  .001) delivered to a single device in a short window and later reassembled; developer/build-host process
  creations using encoding or packing utilities (certutil, base64, openssl, ProGuard, DexGuard, iXGuard,
  upx) followed by staging transfers; executable code (.dex, .so, .jar, .ipa, application/octet-stream)
  downloaded from sources outside approved app stores or CDNs; and the on-device staging sequence in which
  a high-entropy artifact is written to app-private/shared storage and, within a tight window, decoded
  and dynamically loaded (DexClassLoader/PathClassLoader, JNI dlopen, posix_spawn, mmap/mprotect to PROT_EXEC).
  Detection methods combine deterministic symbolic-logic rules, statistical baselining (entropy thresholds,
  file-velocity z-scores, command-line entropy percentiles, write-then-load timing, failure-mode signals
  such as code-signing/decode failures and NXDOMAIN/404 fragment-fetch errors), and machine learning (Random
  Forest/1D-CNN obfuscation classifiers, DBSCAN/Isolation Forest delivery clustering, LSTM/Markov process-
  and API-sequence models), applied to Zeek files/conn/http/dns logs, Windows process-creation and file-access
  events, and android:logcat / iOS:unifiedlog mobile telemetry, so the analyst can corroborate suspected
  obfuscated-payload delivery and execution against network, host, and on-device context.'
type: technique
