      per app_uid: baseline entropy(new_files), latency(write->load) over history

      | alert when E > 7.5 AND latency < p1_window

      | OR decode_burst_io > mean+3*std

      | also flag codesign_validation_fail preceding load'
- question: '[Defense Evasion] Can you score the on-device decode-to-execute API/system-call sequence
    (file-write -> decode/decompress -> .dex/.so creation -> dynamic-load -> exec) against benign app
    behavior using an LSTM or Markov model?'
  context: 'Why this matters: Under Defense Evasion (TA0030), the ordered staging sequence is the most
    robust on-device signature of obfuscated-payload execution and resists string-level obfuscation and
    drift. The ''Score decode-to-execute behavior sequences'' approach (Machine Learning) trains a sequence
    model (LSTM or Markov) on the ordered API/system-call trace and scores deviations from benign behavior,
    surfacing the top-3 contributing transitions; Markov abstraction (MaMaDroid) resists obfuscation while
    LSTMs capture staging order. A positive result -- an anomalous decode-to-execute chain -- is high-value
    evidence; pivot to the app, written artifact, and source download. A negative result lowers suspicion
    but should be corroborated with the symbolic load rule and the timing/entropy baseline. Training behaviors
    available from CICMalDroid2020.'
