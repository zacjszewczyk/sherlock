    when a high-entropy write is loaded within the 1st-percentile latency or when decode-burst I/O volume
    exceeds 3 sigma; it also profiles code-signing validation failures preceding load as a distinct failure-mode
    signal. A positive result is strong on-device staging evidence; pivot to the app and artifact. A negative
    result should be corroborated with the symbolic load rule and the sequence model. Thresholds derivable
    from CICMalDroid2020.'
  answer_sources:
