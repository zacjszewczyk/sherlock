questions:
- question: '[Defense Evasion] Can you identify any file transferred to a mobile device IP range whose
    Zeek files.log mime_type indicates an executable bundle (application/vnd.android.package-archive,
    application/x-itunes-ipa, or a packed dex/so blob) while its filename extension claims a benign type
    such as .png, .jpg, .pdf, or .docx?'
  context: 'Why this matters: Under the Defense Evasion tactic (TA0030), adversaries disguise executable
    payloads as benign documents or images to slip past content filters and human inspection before runtime
    dynamic loading. This question targets file-signature/extension mismatch and executable-type smuggling,
    which are core obfuscated-delivery indicators. The ''Alert on executable mime-type mismatches'' approach
    (Symbolic Logic) inspects Zeek files.log records destined for mobile IP ranges and flags those where
    the magic-derived mime_type contradicts the advertised extension. A positive result -- an APK/IPA
    or packed blob arriving as a supposed image -- is strong evidence of obfuscated delivery; pivot to
    the source host, downloading app/User-Agent, and the on-device write/load activity. A negative result
    reduces but does not eliminate this vector, since encryption or store-channel delivery can avoid a
    visible mismatch.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Corporate Wi-Fi access points, Mobile Device Management (MDM) servers, network gateways, and
    VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: '# Alert on executable mime-type mismatches (Symbolic Logic)

      files.log where dest_ip IN mobile_ip_ranges

      | filter mime_type IN [application/vnd.android.package-archive, application/x-itunes-ipa, packed_dex_so]

      | where ext(filename) IN [.png, .jpg, .pdf, .docx]

      | join conn.log on uid -> enrich src_ip, host

      | alert ''executable masquerading as benign file type'''
- question: '[Defense Evasion] Can you find files transferred to mobile IPs whose Shannon entropy exceeds
    the 95th percentile for their mime_type baseline or an absolute threshold (E > 7.5), indicating packing
    or encryption?'
  context: 'Why this matters: Under Defense Evasion (TA0030), packed or encrypted payloads raise byte
    entropy far above native code, so entropy is a reliable distributional signal of obfuscation that
    resists string-based evasion. The ''Detect high-entropy payloads by type'' approach (Statistical Method)
    computes per-file Shannon entropy and maintains a 30-day per-mime_type baseline, alerting when entropy
    exceeds the type''s 95th percentile or an absolute E > 7.5 (packed/encrypted content runs ~7.2-8.0
    versus 5.0-6.5 for native code). A positive result flags likely packing/encryption for triage; correlate
    with mime/extension mismatch and source reputation. A negative result is reassuring but lightly-obfuscated
    or partial payloads may stay under threshold, so derive type-specific thresholds from your own traffic
    and labeled mobile corpora (e.g., CICAndMal2017).'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Corporate Wi-Fi access points, Mobile Device Management (MDM) servers, network gateways, and
    VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Detect high-entropy payloads by type (Statistical Method)

      files.log where dest_ip IN mobile_ip_ranges

      | compute E = shannon_entropy(payload)

      | baseline p95_entropy by mime_type over 30d

      | alert when E > p95_entropy[mime_type] OR E > 7.5'
- question: '[Defense Evasion] Can you detect spikes in signature-validation or decode failures -- code-signing/integrity
    validation failures on newly written Mach-O/dex/so, repeated decompress/decode errors, and elevated
    404/blocked-connection rates -- that precede successful obfuscated-payload staging?'
  context: 'Why this matters: Under Defense Evasion (TA0030), staging obfuscated payloads often generates
    failure-mode noise before success -- integrity checks reject tampered binaries, decoders retry on
    malformed blobs, and fetches get blocked. The ''Profile signature-validation and decode failures''
    approach (Statistical Method) treats these as distinct indicators and alerts when validation failures
    or decode-retry loops exceed a 30-day baseline (e.g., >3 per app-UID/hour). A positive result -- a
    failure spike -- is an early-warning precursor to successful staging; pivot to the implicated app-UID
    and subsequent file writes/loads. A negative result does not clear the host, as a clean payload may
    stage without errors.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Corporate Wi-Fi access points, Mobile Device Management (MDM) servers, network gateways, and
    VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Profile signature-validation and decode failures (Statistical Method)

      events where type IN [codesign_fail, integrity_fail, decode_error, http_404, conn_blocked]

      | bin by app_uid, 1h

      | baseline failure_rate over 30d

      | alert when failures > 3 per app_uid per hour OR > baseline+3sigma'
- question: '[Defense Evasion] Can you classify mobile file downloads as suspiciously obfuscated using
    a machine-learning model over files.log/http.log features (entropy, byte-histogram texture, size,
    mime_type, extension, User-Agent, source-IP reputation)?'
  context: 'Why this matters: Under Defense Evasion (TA0030), single heuristics miss novel packers, so
    a learned model that fuses many weak signals can surface obfuscated downloads that individual rules
    miss. The ''Classify obfuscated file downloads'' approach (Machine Learning) trains a Random Forest
    (or 1D-CNN over a bytecode-image representation) on per-download features and alerts on high obfuscation
    scores, surfacing the top-3 contributing features (e.g., entropy, mime/extension mismatch, domain
    age) for triage. A positive result warrants review of the download chain and on-device follow-on;
    a negative result lowers suspicion but should be corroborated with the symbolic and statistical checks.
    Tree and image/CNN models capture packed/high-entropy byte structure (DexRay, Drebin).'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Corporate Wi-Fi access points, Mobile Device Management (MDM) servers, network gateways, and
    VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: '# Classify obfuscated file downloads (Machine Learning)

      X = features(files.log, http.log: entropy, byte_histogram, size, mime_type, ext, user_agent, src_ip_rep)

      model = RandomForest()  # or 1D-CNN over bytecode image

      score = model.predict_proba(X)

      | alert when score > threshold with top3 SHAP features'
- question: '[Defense Evasion] Can you identify a single mobile device IP receiving more than three small
    file fragments from one source IP within five minutes, where filenames match split-archive patterns
    (.partN, .zNN, .rNN, .001)?'
  context: 'Why this matters: Under Defense Evasion (TA0030), adversaries split a malicious payload into
    seemingly benign fragments that only reveal functionality once reassembled on-device, defeating signature
    inspection of any single file. The ''Alert on split-archive filename patterns'' approach (Symbolic
    Logic) groups Zeek files.log by source/destination IP, flags split-archive naming, and alerts when
    more than three such files transfer within five minutes, correlating with conn.log by uid. A positive
    result strongly suggests staged delivery requiring later in-memory reconstruction; pivot to the source
    domain/IP and look for the on-device reassembly burst. A negative result does not rule out chunked
    delivery using non-obvious naming.'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek dns.log
  - 'NAI: Network egress points, corporate Wi-Fi segments, and DNS resolvers servicing mobile device clients.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: '# Alert on split-archive filename patterns (Symbolic Logic)

      files.log group by dest_ip, src_ip

      | where filename ~ /\.(part\d+|z\d{2}|r\d{2}|\d{3})$/

      | count distinct fragments within 5min

      | join conn.log on uid

      | alert when fragment_count > 3'
- question: '[Defense Evasion] Can you detect mobile IPs whose file-download velocity (files per 1-minute
    window) exceeds 3 standard deviations above a 30-day baseline, especially when the source domain is
    newly registered?'
  context: 'Why this matters: Under Defense Evasion (TA0030), bulk delivery of payload fragments produces
    an abnormal burst of small downloads from a single source in a short window. The ''Detect high file-velocity
    downloads'' approach (Statistical Method) maintains a 30-day baseline of per-source file counts in
    1-minute windows for mobile IPs and alerts when velocity exceeds baseline+3sigma, enriching with DNS/WHOIS
    to flag newly registered source domains. A positive result -- a velocity spike from a young domain
    -- is a high-value lead for fragment delivery; pivot to the fragment filenames and reassembly activity.
    A negative result is consistent with slow, low-and-slow delivery and should be corroborated with the
    split-archive rule.'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek dns.log
  - 'NAI: Network egress points, corporate Wi-Fi segments, and DNS resolvers servicing mobile device clients.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Detect high file-velocity downloads (Statistical Method)

      files.log where dest_ip IN mobile_ip_ranges

      | count files by src_ip per 1min

      | baseline mean,std over 30d

      | enrich dns.log/WHOIS domain_age

      | alert when velocity > mean+3*std (boost if domain_age < 30d)'
- question: '[Defense Evasion] Can you find clusters of fragment-fetch failures -- NXDOMAIN responses,
    HTTP 404/416 range errors, and blocked/reset connections -- occurring while a mobile IP pulls sequential
    fragments (.001, .002, ...)?'
  context: 'Why this matters: Under Defense Evasion (TA0030), partially failed reassembly leaves a distinctive
    trail of retrieval errors interleaved with successful fragment transfers. The ''Profile fragment-fetch
    failures'' approach (Statistical Method) treats failures as a separate signal and alerts when failed-fetch
    counts for a single mobile IP exceed a 30-day baseline (e.g., >5 NXDOMAIN or 404 in 5 minutes) concurrent
    with successful fragment transfers. A positive result indicates an in-progress or broken staging attempt
    worth investigating; a negative result does not clear the host since a fully successful pull leaves
    no failures.'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek dns.log
  - 'NAI: Network egress points, corporate Wi-Fi segments, and DNS resolvers servicing mobile device clients.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Profile fragment-fetch failures (Statistical Method)

      dns.log/http.log/conn.log where dest_ip = mobile_ip

      | count errors IN [NXDOMAIN, http_404, http_416, conn_reset] per 5min

      | concurrent with successful fragment transfers (.001,.002,...)

      | baseline over 30d

      | alert when errors > 5 in 5min above baseline'
- question: '[Defense Evasion] Can you cluster conn.log/files.log delivery behavior (IPs, protocol, port,
    total bytes, byte ratios, inter-arrival times) to surface outlier or dense micro-clusters consistent
    with split-payload delivery?'
  context: 'Why this matters: Under Defense Evasion (TA0030), staged fragment delivery has a characteristic
    flow shape -- many similar small transfers with tight inter-arrival times -- that unsupervised models
    can isolate even without labels. The ''Cluster split-payload delivery behavior'' approach (Machine
    Learning) applies DBSCAN (or Isolation Forest for unlabeled streams) to conn.log/files.log features
    and investigates outlier clusters or dense micro-clusters, correlating with threat intel and reporting
    the top-3 driving features. A positive result (an anomalous cluster) warrants pivoting to the involved
    IPs and fragment filenames; a negative result lowers suspicion but should be combined with the rule-
    and stats-based checks.'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek dns.log
  - 'NAI: Network egress points, corporate Wi-Fi segments, and DNS resolvers servicing mobile device clients.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: '# Cluster split-payload delivery behavior (Machine Learning)

      X = features(conn.log, files.log: src_ip, dst_ip, proto, dport, total_bytes, byte_ratio, inter_arrival)

      labels = DBSCAN(X)  # or IsolationForest for unlabeled

      | flag outliers / dense micro-clusters

      | correlate threat_intel; report top3 features'
- question: '[Defense Evasion] On developer or build hosts, can you correlate process creations using
    encoding/packing tools (certutil -encode, base64, openssl enc, ProGuard, DexGuard, iXGuard, upx) with
    outbound connections to mobile VLANs or file-sharing domains within 10 minutes?'
  context: 'Why this matters: Under Defense Evasion (TA0030), adversaries (or insiders) staging obfuscated
    mobile payloads frequently encode/pack artifacts on a build host and then transfer them toward devices
    or staging services. The ''Correlate packing tools with outbound transfers'' approach (Symbolic Logic)
    detects Windows Event ID 4688 process creations invoking packing/encoding utilities and correlates
    them with Zeek conn.log connections to mobile VLANs or file-sharing domains within 10 minutes. These
    tools produce encrypted dex/native blobs and string-encoded artifacts characteristic of mobile packers.
    A positive result -- pack tool then outbound transfer -- is a strong staging lead; pivot to the artifact
    and destination. A negative result does not clear legitimate obfuscation in sanctioned build pipelines,
    which must be allowlisted to reduce noise.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Developer workstations, CI/CD build servers, code repositories, and artifact management systems.'
  range: Last 90 days (correlate event-centered windows of +/- 10 minutes around tool execution)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Correlate packing tools with outbound transfers (Symbolic Logic)

      EventID=4688 where process IN [certutil -encode, base64, openssl enc, proguard, dexguard, ixguard,
      upx]

      | join conn.log on host within 10min

      | where dest IN [mobile_VLANs, file_sharing_domains]

      | alert ''pack/encode followed by outbound staging'''
- question: '[Defense Evasion] Can you baseline per-process command-line entropy on developer tooling
    (git.exe, gradle.bat, xcodebuild) and alert when entropy exceeds the 98th percentile, indicating embedded
    encoded data?'
  context: 'Why this matters: Under Defense Evasion (TA0030), encoded payloads or commands embedded in
    command lines raise entropy well above normal tool invocations. The ''Baseline command-line entropy
    for dev tools'' approach (Statistical Method) maintains a 30-day per-process baseline of command-line
    entropy and alerts above the 98th percentile, the canonical packed/encoded-content signal. A positive
    result -- an unusually high-entropy command line -- suggests an embedded blob worth decoding and reviewing;
    pivot to the process tree and any resulting files/transfers. A negative result is expected for routine
    builds but does not preclude encoding done in files rather than on the command line.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Developer workstations, CI/CD build servers, code repositories, and artifact management systems.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Baseline command-line entropy for dev tools (Statistical Method)

      EventID=4688

      | compute cl_entropy = shannon_entropy(command_line)

      | baseline p98 by process_name over 30d

      | alert when cl_entropy > p98[process_name]'
- question: '[Defense Evasion] Can you detect anomalous parent-child process sequences on developer hosts
    (e.g., javac.exe -> certutil.exe -> curl.exe) that capture an encode/pack/stage chain and correlate
    with subsequent transfers?'
  context: 'Why this matters: Under Defense Evasion (TA0030), the temporal order of build, encode, pack,
    and stage steps is itself a signal that a single process check misses. The ''Detect anomalous dev
    process sequences'' approach (Machine Learning) trains an LSTM on parent-child process sequences from
    Windows Event ID 4688 and alerts on anomalous sequences, correlating with subsequent file transfers
    or connections and surfacing the top-3 sequence transitions driving the score. A positive result --
    e.g., compile then encode then exfil tool -- is a strong staging indicator; pivot to the produced
    artifact and its destination. A negative result reflects normal build ordering but should be corroborated
    with the entropy and correlation checks.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Developer workstations, CI/CD build servers, code repositories, and artifact management systems.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: '# Detect anomalous dev process sequences (Machine Learning)

      seqs = parent_child_chains(EventID=4688)

      model = LSTM().fit(benign_seqs)

      score = model.anomaly(seqs)  # e.g., javac->certutil->curl

      | correlate later transfers; alert with top3 transitions'
- question: '[Defense Evasion] Can you find mobile devices downloading executable code (.dex, .so, .jar,
    .ipa, or application/octet-stream) from hosts that are not on an approved app-store/CDN allowlist?'
  context: 'Why this matters: Under Defense Evasion (TA0030), fetching executable code outside official
    store/CDN channels for runtime dynamic loading is the primary obfuscated-payload delivery primitive
    (sideloading / dynamic code loading). The ''Alert on executable downloads from unapproved hosts''
    approach (Symbolic Logic) alerts when Zeek files.log shows .dex/.so/.jar/.ipa downloads to mobile
    IPs while the http.log host is absent from the approved repository/CDN allowlist. A positive result
    is a high-confidence sideloading lead; pivot to the destination device, app/User-Agent, and on-device
    load activity. A negative result is reassuring but executables can be tunneled or renamed, so combine
    with entropy and mime-mismatch checks.'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - 'NAI: Corporate Wi-Fi access points, DNS resolvers, and network egress points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: '# Alert on executable downloads from unapproved hosts (Symbolic Logic)

      files.log where dest_ip IN mobile_ip_ranges

      | where mime_type=application/octet-stream OR ext IN [.dex, .so, .jar, .ipa]

      | join http.log on uid -> host

      | alert when host NOT IN approved_store_cdn_allowlist'
- question: '[Defense Evasion] Can you profile mime_type/extension distributions per app User-Agent over
    30 days and alert when an app downloads a file type outside its top-99% baseline, especially application/octet-stream
    or application/x-java-archive?'
  context: 'Why this matters: Under Defense Evasion (TA0030), an app suddenly retrieving an executable
    file type it never normally fetches is a behavioral anomaly that resists surface-string obfuscation.
    The ''Detect rare executable file types per app'' approach (Statistical Method) builds per-User-Agent
    distributions of mime_type/extension over 30 days and alerts on types outside the app''s top-99% baseline,
    especially octet-stream or java-archive. A positive result -- an app pulling a rare executable type
    -- merits review of the source and on-device follow-on; a negative result fits normal app behavior
    but should be corroborated with allowlist and ML checks. Derive baselines from labeled mobile datasets
    (CICMalDroid2020).'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - 'NAI: Corporate Wi-Fi access points, DNS resolvers, and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Detect rare executable file types per app (Statistical Method)

      http.log/files.log

      | baseline mime_type,ext distribution by user_agent over 30d

      | alert when downloaded type NOT IN top99%[user_agent]

      | flag application/octet-stream, application/x-java-archive'
- question: '[Defense Evasion] Can you model mobile download events with an Isolation Forest over http/files/dns
    features (method, User-Agent, mime_type, size, byte ratios, source-IP reputation, domain age) to flag
    outlier downloads?'
  context: 'Why this matters: Under Defense Evasion (TA0030), sideloading and dynamic code loading produce
    download events that deviate across multiple dimensions at once, which an unsupervised outlier model
    can isolate. The ''Model anomalous download events'' approach (Machine Learning) trains an Isolation
    Forest on combined http.log/files.log/dns.log features and flags outlier downloads as potential sideloading
    or dynamic code loading, surfacing the top-3 anomalous features (e.g., mime_type, domain age, size).
    A positive result warrants pivoting to the device, source, and on-device load chain; a negative result
    lowers suspicion but should be combined with the symbolic allowlist and statistical baseline checks.'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - 'NAI: Corporate Wi-Fi access points, DNS resolvers, and network egress points.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: '# Model anomalous download events (Machine Learning)

      X = features(http.log, files.log, dns.log: method, user_agent, mime_type, size, byte_ratio, src_ip_rep,
      domain_age)

      model = IsolationForest().fit(X)

      | flag outliers as sideload/dynamic-load; report top3 features'
- question: '[Defense Evasion] On a mobile endpoint, can you detect dynamic code loading from app-writable
    or recently-written paths -- DexClassLoader/PathClassLoader from a non-standard/recently-created path,
    System.load/dlopen of a .so written by the same app UID within 60s, or SELinux AVC execute_no_trans/execmem
    after a decode/unpack burst?'
  context: 'Why this matters: Under Defense Evasion (TA0030), loading code from app-writable or external
    storage without integrity checks is the core dynamic-code-loading abuse, and packers reconstruct encrypted
    dex/native code in memory just before loading. The ''Detect dynamic load from app-writable or recently-written
    paths'' approach (Symbolic Logic) alerts on these load events tied to recent same-UID writes and SELinux
    execmem/execute_no_trans denials. A positive result is the on-device signature of obfuscated-payload
    execution; pivot to the written artifact, the loading app, and the originating download. A negative
    result does not clear the device, since load events can be sparse or masked, so combine with the timing/entropy
    and sequence checks.'
  answer_sources:
  - android:logcat
  - iOS:unifiedlog
  - File Creation
  - Module Load
  - 'NAI: Mobile endpoints with MDM/EDR mobile-threat-defense agents, on-device app sandboxes, and SELinux/dyld
    telemetry.'
  range: Last 90 days (correlate event-centered windows of +/- 60 seconds around the file write)
