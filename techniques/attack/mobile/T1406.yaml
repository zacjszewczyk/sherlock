      module_load OR api_call events

      | alert when DexClassLoader/PathClassLoader from non-standard/recent path

      | OR System.load/dlopen of .so written by same app_uid within 60s

      | OR SELinux AVC execute_no_trans/execmem after decode/unpack burst'
- question: '[Defense Evasion] Can you baseline per-app on-device write-then-load timing and entropy,
