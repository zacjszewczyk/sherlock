name: 'T1423: Network Service Scanning'
id: c31adf15-990a-47a8-a135-845ab36c8b5a
description: >-
  Investigate whether a compromised or rogue mobile device (Android or iOS) is being used to perform network
  service scanning against the internal enterprise network, reached either over local connectivity (corporate
  Wi-Fi) or through a VPN. This playbook helps an analyst hunt for the network-visible artifacts of port
  and vulnerability scanning originating from mobile device IP space: a single device fanning out to a
  statistically significant number of unique internal destination IPs (horizontal scan) or unique ports
  on a single host (vertical scan), elevated ratios of failed or rejected TCP connection states (S0, REJ,
  RSTO, RSTR, RSTOS0) versus established (SF) sessions, hits against decoy canary IPs/ports, Zeek scan
  notices, known scanner User-Agents and signatures (Nmap, masscan, ZGrab), high-entropy probe payloads,
  and flows that supervised or unsupervised models classify as scanning. It combines deterministic rules,
  statistical baselining (per-device and peer-group), sequential hypothesis testing (Threshold Random
  Walk), and machine-learning detectors so detection never depends on a single method, and surfaces explainable
  feature drivers for fast SOC triage.
type: technique
related:
- tactic_id: TA0032
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
