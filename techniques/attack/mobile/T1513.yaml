- question: Does a per-device time-series forecast (SARIMA/Prophet) of hourly outbound volume show actual
    traffic exceeding the 99% forecast interval, and does that excess correlate with a recent accessibility-service
    grant?
  context: 'Time-series forecasting captures each device''s normal diurnal traffic pattern, so deviations
    reveal exfil that static thresholds miss. Within Collection, a per-device SARIMA/Prophet model alerts
    when hourly volume exceeds the 99% forecast interval and correlates the breach with accessibility
    grants. The analyst reviews alerts that surface the top-3 driving features and confirms the temporal
    link to a recent grant, applying robustness/model-selection guidance from the deep-learning Android
    survey. A positive result (forecast breach soon after an accessibility grant) strongly suggests capture-driven
    exfil; in-interval volume is normal. References: [Qiu et al.](https://arxiv.org/abs/2103.05292).'
  answer_sources:
