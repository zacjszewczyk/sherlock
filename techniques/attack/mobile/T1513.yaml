      \ embedded_hosts)\n    if any(host in threat_intel.c2_indicators): severity = HIGH\n    alert(\"\
      non-allowlisted accessibility grant\", grant.package, host)"
- question: Under on-device taint tracking, did accessibility-read screen content reach a network sink,
    and which app and destination were responsible?
  context: 'When accessibility services read foreground content, taint tracking (TaintDroid) can confirm
    whether that content was exfiltrated. Within Collection, this deterministically links accessibility-based
    capture to network egress. The analyst examines taint flows where accessibility-read screen content
    reaches a network sink, naming the app and destination. A positive result is direct proof of accessibility-driven
    capture-then-exfil; absence of such a flow suggests the content stayed local or no instrumentation
    was present. References: [TaintDroid](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf).'
