- question: For authorized adb source IPs, do session duration or byte counts exceed the 95th percentile
    (or mean + 2 standard deviations) of their baseline, or does near-zero inter-arrival variance indicate
    automation rather than interactive use?
  context: 'Even authorized adb access can be abused, so baselining per-IP session metrics exposes anomalous
    transfers. Within Collection, the analyst baselines adb session duration and bytes per authorized
    IP and alerts when metrics exceed the 95th percentile or mean + 2 sigma, and flags near-zero inter-arrival
    variance as automation (scripted capture pulls). Per-IP local baselines (Andromaly-style) reduce noise.
    A positive result (oversized session or machine-like timing from a normally interactive IP) suggests
    bulk capture exfil; metrics within baseline are routine developer use. References: [Andromaly](https://link.springer.com/article/10.1007/s10844-010-0148-x).'
  answer_sources:
