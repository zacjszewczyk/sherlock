      \    flag(\"automated adb session\", session.src_ip)"
- question: Does a classifier trained on conn.log features (duration, bytes, history, conn_state, allowlist
    flag) score an adb session's malicious probability above 0.9, warranting automated SOAR isolation?
  context: 'Supervised classification of adb sessions catches malicious access patterns beyond simple
    thresholds. Within Collection, a classifier on conn.log features (duration, bytes, history, conn_state,
    allowlist flag) triggers SOAR isolation when malicious probability exceeds 0.9, emitting the top-3
    contributing features for analyst review; model selection follows deep-learning Android detection
    guidance. The analyst validates high-probability alerts and the contributing features before/after
    auto-isolation. A positive result (probability >0.9) is strong evidence of malicious remote adb capture
    activity and drives containment; low-probability sessions are likely benign. References: [Qiu et al.](https://arxiv.org/abs/2103.05292);
    [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
