questions:
- question: Has a mobile application that is NOT on the corporate software allowlist been granted screen
    recording (MediaProjection) permission while also holding android.permission.INTERNET, and does it
    combine capture-capable APIs with an embedded or known command-and-control host or URL?
  context: 'Within the Collection tactic, the cleanest deterministic signal of screen-capture abuse is
    a non-allowlisted package that can both capture the screen and reach the network. The analyst joins
    MDM/EMM application inventory and permission-grant logs to find packages outside the allowlist that
    received screen recording permission AND declare INTERNET. Statically corroborate with Drebin-style
    features: a non-allowlisted app combining capture-capable APIs, INTERNET, and an embedded/known C2
    host or URL is high-confidence malicious. A positive result (non-allowlisted + capture grant + INTERNET
    + known-bad host) warrants immediate triage and likely isolation; a negative result (allowlisted recorder,
    or no network capability) reduces concern. References: [Drebin](https://www.sec.cs.tu-bs.de/~danarp/drebin/).'
  answer_sources:
  - MDM/EMM application inventory logs
  - MDM/EMM permission grant logs
  - Zeek conn.log
  - Zeek files.log
  - Zeek dns.log
  - Threat intelligence indicators
  - Mobile EDR OS API/Application State telemetry
  - 'NAI: Corporate MDM/EMM servers, managed mobile device endpoints, network data collection points (e.g.,
    Zeek sensors at internet gateway), and internal DNS servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each app in mdm_permission_grants where permission == \"screen_recording\":\n  if app.package\
      \ NOT in allowlist AND app.has_permission(\"android.permission.INTERNET\"):\n    enrich with static_features(capture_apis,\
      \ embedded_hosts)\n    if any(host in threat_intel.c2_indicators): severity = HIGH\n    alert(\"\
      non-allowlisted screen recording grant + INTERNET\", app.package, host)"
- question: Did a MediaProjection-style screen capture session begin WITHOUT a preceding createScreenCaptureIntent()
    consent dialog, from a backgrounded app or a foreground-service lacking foregroundServiceType="mediaProjection"
    (Android 14+), or while a different/sensitive app was in the foreground?
  context: 'Android''s MediaProjection API is consent-gated: a legitimate capture session must follow
    a createScreenCaptureIntent() consent dialog and, on Android 14+, run as a foreground service typed
    mediaProjection. Within Collection, deviations from this documented lifecycle reveal covert capture.
    The analyst uses mobile EDR OS API/Application State telemetry to confirm that a capture session began
    without the consent prompt, originated from a backgrounded app or an improperly-typed foreground service,
    or ran while another (sensitive) app was foregrounded. A positive result indicates capture outside
    the sanctioned user-driven workflow; a negative result (consent dialog present, app foregrounded,
    correct service type) reflects expected recording. References: [Android MediaProjection docs](https://developer.android.com/media/grow/media-projection).'
  answer_sources:
  - MDM/EMM application inventory logs
  - MDM/EMM permission grant logs
  - Zeek conn.log
  - Zeek files.log
  - Zeek dns.log
  - Threat intelligence indicators
  - Mobile EDR OS API/Application State telemetry
  - 'NAI: Corporate MDM/EMM servers, managed mobile device endpoints, network data collection points (e.g.,
    Zeek sensors at internet gateway), and internal DNS servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each mediaprojection_session in mobile_edr.os_api:\n  if NOT preceded_by(createScreenCaptureIntent_consent,\
      \ session, window=\"60s\")\n     OR session.app.state in (\"backgrounded\")\n     OR (session.is_foreground_service\
      \ AND session.fg_service_type != \"mediaProjection\")\n     OR foregrounded_app(session.start) !=\
      \ session.app:\n    alert(\"MediaProjection lifecycle deviation\", session.app, foregrounded_app(session.start))"
- question: Where on-device taint instrumentation is available, did screen or framebuffer data tainted
    as captured content flow to a network sink, and which app and destination were responsible?
  context: 'Information-flow (taint) tracking such as TaintDroid deterministically links captured screen/framebuffer
    data to a network egress, removing ambiguity about whether captured content actually left the device.
    Within Collection, this is the strongest confirmation that screen capture led to exfiltration. The
    analyst reviews taint-tracking telemetry for screen/framebuffer-sourced taint reaching a network sink
    and records the responsible app and destination IP/host. A positive result is direct evidence of capture-then-exfil
    and names the actor app; absence of taint reaching a sink suggests captured data stayed on-device
    (or no instrumentation was present). References: [TaintDroid](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf).'
  answer_sources:
  - MDM/EMM application inventory logs
  - MDM/EMM permission grant logs
  - Zeek conn.log
  - Zeek files.log
  - Zeek dns.log
  - Threat intelligence indicators
  - Mobile EDR OS API/Application State telemetry
  - 'NAI: Corporate MDM/EMM servers, managed mobile device endpoints, network data collection points (e.g.,
    Zeek sensors at internet gateway), and internal DNS servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each taint_event in taintdroid.flows:\n  if taint_event.source in (\"screen\",\"framebuffer\"\
      ) AND taint_event.sink == \"network\":\n    alert(\"captured screen data reached network sink\"\
      , taint_event.app, taint_event.dest)"
- question: Does the device's 24-hour outbound orig_bytes exceed the 98th percentile (or mean + 3 standard
    deviations) of its 30-day baseline, with subdomain entropy >3 standard deviations above baseline,
    an orig_bytes/resp_bytes ratio >10 for >1MB connections, or an NXDOMAIN/failed-resolution spike?
  context: 'Captured screenshots and video produce upload-dominant, high-volume outbound transfers and
    often DNS-tunneling-style patterns. Within Collection, statistical baselining per device exposes these
    without fixed thresholds. The analyst compares 24-hour outbound orig_bytes against the device''s own
    30-day baseline (flag above the 98th percentile or mean + 3 sigma), checks subdomain entropy (>3 sigma
    deviation), flags upload-dominant flows (orig_bytes/resp_bytes > 10 for >1MB connections), and treats
    NXDOMAIN/failed-resolution spikes as a distinct low-throughput exfil signal. Per-device baselines
    (Andromaly-style) reduce false positives. A positive result indicates abnormal bulk upload or covert
    DNS exfil consistent with captured-media theft; values within baseline argue against it. References:
    [Andromaly](https://link.springer.com/article/10.1007/s10844-010-0148-x); [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources:
  - MDM/EMM application inventory logs
  - MDM/EMM permission grant logs
  - Zeek conn.log
  - Zeek files.log
  - Zeek dns.log
  - Threat intelligence indicators
  - Mobile EDR OS API/Application State telemetry
  - 'NAI: Corporate MDM/EMM servers, managed mobile device endpoints, network data collection points (e.g.,
    Zeek sensors at internet gateway), and internal DNS servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = per_device 30d distribution of daily orig_bytes and subdomain_entropy\nfor device,\
      \ day:\n  if day.orig_bytes > p98(baseline) OR day.orig_bytes > mean + 3*std:\n    flag(\"outbound\
      \ volume outlier\", device)\n  for conn where conn.orig_bytes > 1MB:\n    if conn.orig_bytes / conn.resp_bytes\
      \ > 10: flag(\"upload-dominant\", conn)\n  if subdomain_entropy(day) > mean + 3*std: flag(\"DNS\
      \ entropy outlier\", device)\n  if nxdomain_rate(day) > baseline_nxdomain + 3*std: flag(\"NXDOMAIN\
      \ spike\", device)"
- question: Within one hour of a screen recording permission grant, do conn.log flows score as outliers
    under an Isolation Forest (on duration, bytes, protocol, periodicity, destination port), or do TLS-hidden
    uploads to rare destinations appear anomalous under an encrypted-traffic model?
  context: 'Machine learning surfaces covert exfil that fixed rules miss, especially right after a capture-permission
    grant. Within Collection, an Isolation Forest over conn.log features (duration, bytes, protocol, periodicity,
    destination port) flags high-score outliers within one hour of permission grants, and a self-supervised
    encrypted-traffic model over flow metadata catches TLS-hidden uploads to rare destinations. The analyst
    reviews high-score alerts that emit the top-3 contributing features for explainability and correlates
    them with the preceding grant. A positive result (anomalous flow tied to a recent capture grant) is
    strong evidence of capture-then-exfil; benign periodic app traffic typically scores low. References:
    [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf); [ET-SSL, Scientific Reports
    2025](https://www.nature.com/articles/s41598-025-08568-0).'
  answer_sources:
  - MDM/EMM application inventory logs
  - MDM/EMM permission grant logs
  - Zeek conn.log
  - Zeek files.log
  - Zeek dns.log
  - Threat intelligence indicators
  - Mobile EDR OS API/Application State telemetry
  - 'NAI: Corporate MDM/EMM servers, managed mobile device endpoints, network data collection points (e.g.,
    Zeek sensors at internet gateway), and internal DNS servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = IsolationForest(features=[duration,orig_bytes,resp_bytes,proto,periodicity,dest_port])\n\
      for conn within 1h after permission_grant(device):\n  score = model.score(conn)\n  if score > threshold:\n\
      \    alert(\"anomalous post-grant flow\", device, conn.dest, top3_features(conn))\n# extend: encrypted_traffic_model(flow_metadata)\
      \ for TLS uploads to rare destinations"
- question: Has an application whose package name is NOT on the pre-approved allowlist been granted Android
    Accessibility Service privileges (BIND_ACCESSIBILITY_SERVICE), per MDM compliance logs, especially
    combined with INTERNET and a known C2 host?
  context: 'Accessibility services can read foreground UI content, an out-of-band capture path NOT covered
    by MediaProjection consent. Within Collection, enforcing an accessibility-service allowlist and alerting
    on compliance violations is a deterministic detection of this covert capture vector. The analyst reviews
    MDM/EMM compliance logs for non-allowlisted apps granted accessibility privileges and corroborates
    with Drebin static features (BIND_ACCESSIBILITY_SERVICE + INTERNET + C2 host). A positive result (non-allowlisted
    accessibility grant, especially with network capability and known-bad host) is high-confidence malicious;
    an allowlisted assistive app reduces concern. References: [Android MediaProjection docs](https://developer.android.com/media/grow/media-projection);
    [Drebin](https://www.sec.cs.tu-bs.de/~danarp/drebin/).'
  answer_sources:
