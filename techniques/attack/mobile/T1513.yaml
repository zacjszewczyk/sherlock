  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "for each app:\n  seq = abstract_api_calls(app.runtime_trace)  # family/package abstraction\n\
      \  markov = build_markov_chain(seq)\n  label = classifier.predict(markov)  # MaMaDroid-style\n \
      \ if label == \"capture_then_exfil\":\n    alert(\"malicious capture-exfil sequence\", app.package,\
      \ top_weighted_transitions(markov))"
- question: Is the screencap or screenrecord process executing on a managed device, or is inbound TCP/5555
    (remote adb) reaching a device from a source other than authorized developer IPs?
  context: 'Privileged screencap/screenrecord runs outside the consent-gated MediaProjection lifecycle
    and should never originate from non-developer contexts; remote adb over TCP/5555 enables exactly this.
    Within Collection, blocking inbound TCP/5555 except for authorized developer IPs and alerting on screencap/screenrecord
    execution is a deterministic control. The analyst correlates mobile EDR process telemetry for screencap/screenrecord
    execution with Zeek/firewall records of inbound TCP/5555 from non-allowlisted sources. A positive
    result (capture binary execution or unauthorized adb session) indicates hands-on or scripted screen
    theft; authorized developer activity is the benign explanation. References: [Android MediaProjection
    docs](https://developer.android.com/media/grow/media-projection).'
  answer_sources:
  - Mobile EDR logs
  - Android logcat
  - Zeek conn.log
  - Zeek notice.log
  - Firewall logs
  - MDM/EMM developer mode/USB debugging logs
  - 'NAI: Managed mobile device endpoints with EDR/logging agents, network infrastructure (firewalls,
    IDS/IPS), and specific network segments designated for developer access.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each proc in mobile_edr.process_exec:\n  if proc.name in (\"screencap\",\"screenrecord\"\
      ) AND proc.context != \"developer\":\n    alert(\"privileged screen capture execution\", proc.device,\
      \ proc.cmdline)\nfor each conn in (zeek_conn, firewall) where conn.dest_port == 5555 AND conn.dir\
      \ == \"inbound\":\n  if conn.src_ip NOT in authorized_developer_ips:\n    block(conn); alert(\"\
      unauthorized remote adb\", conn.src_ip, conn.dest_ip)"
- question: Are there blocked or failed inbound TCP/5555 connection attempts, counted separately from
    successful sessions, that indicate reconnaissance or unauthorized adb access attempts?
  context: 'Failed/blocked adb attempts are a reconnaissance signal distinct from successful sessions.
    Within Collection, explicitly counting and alerting on blocked/failed inbound TCP/5555 attempts (a
    failure-rate signal) reveals adversaries probing for remote adb before a successful capture. The analyst
    aggregates blocked/failed TCP/5555 attempts per source and per device over time and alerts on spikes.
    A positive result (rising blocked-attempt counts) signals targeting/recon even if no session succeeded;
    a flat near-zero count is normal. References: [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
