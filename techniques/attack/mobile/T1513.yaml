name: 'T1513: Screen Capture'
id: 61ef2fa8-8c74-422a-ac73-9f4a5b755267
description: 'Investigate whether an adversary is using Android screen capture (T1513) to collect sensitive
  information displayed on corporate mobile devices, such as foreground application content, user data,
  credentials, or other secrets. This playbook helps a SOC analyst determine whether a managed device
  is being abused for screen-content theft via three primary capture paths: (1) a non-allowlisted app
  being granted MediaProjection-style screen recording permission together with INTERNET access and then
  exfiltrating captured media; (2) a non-allowlisted app being granted Android Accessibility Service privileges
  and reading foreground UI content out-of-band, followed by anomalous outbound transfer; and (3) privileged
  screencap/screenrecord execution or remote adb access over TCP/5555 from unauthorized sources. It correlates
  MDM/EMM application inventory, permission grant, and compliance logs with mobile EDR OS API and application-state
  telemetry, Android logcat, and network evidence (Zeek conn.log, files.log, dns.log, notice.log, and
  firewall logs). The analysis combines deterministic symbolic-logic rules (allowlist enforcement, MediaProjection
  consent-lifecycle validation, taint/information-flow confirmation, adb/port-5555 controls), statistical
  baselining (per-device outbound volume, upload/download ratios, DNS entropy, NXDOMAIN spikes, adb session
  metrics), and machine-learning models (Isolation Forest, SARIMA/Prophet forecasting, Markov-chain API-sequence
  modeling, and supervised session classification) to distinguish covert capture-and-exfil behavior from
  legitimate, user-consented recording on mobile endpoints.'
