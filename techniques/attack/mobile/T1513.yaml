    query: "for each device:\n  model = SARIMA_or_Prophet(device.hourly_orig_bytes_history)\n  forecast\
      \ = model.predict(next_hour, interval=0.99)\n  if actual.orig_bytes > forecast.upper:\n    if exists\
      \ accessibility_grant(device, within=\"recent\"):\n      alert(\"forecast-breach outbound + accessibility\
      \ grant\", device, top3_features())"
- question: When the app's abstracted API-call transitions are modeled as Markov chains, do they classify
    as a capture-then-exfil behavioral sequence, and which transitions carry the highest weight?
  context: 'Behavioral sequence modeling (MaMaDroid) abstracts API calls into Markov-chain transitions
    that are robust across API versions, classifying whether an app''s behavior matches a capture-then-exfil
    pattern. Within Collection, this distinguishes malicious capture+upload sequences from benign app
    behavior. The analyst reviews the classification and the highest-weight transitions reported as explanation
    (e.g., screen-read API -> file write -> network send). A positive classification with capture->exfil
    transitions is strong behavioral evidence; benign apps lack such transition patterns. References:
    [MaMaDroid](https://bitbucket.org/gianluca_students/mamadroid_code).'
