name: 'T1628.001: Suppress Application Icon'
id: 9dbb6ec1-531e-4dcf-8f9b-1d5c0c61f3c9
description: 'Investigate whether an adversary is concealing a malicious Android application by suppressing
  its launcher icon (T1628.001) on managed and BYOD mobile endpoints, hiding the fact the app is installed
  and making it harder for users to find and uninstall it. This playbook helps an analyst hunt for the
  concealment signature across three vantage points: (1) a cross-view differential where an app present
  in the MDM/MTD package inventory has no corresponding LAUNCHER intent activity in mobile EDR logs, combined
  with prevalence baselining and an explainable logistic-regression risk score that fuses permission,
  install-provenance, and network-behavior features; (2) the Android 10+ synthesized-icon path, where
  tapping a hidden app''s launcher entry redirects to its system-settings details page, detected via launcher-to-settings
  process-creation correlation, frequency-spike statistics, and sequence-anomaly modeling of UI navigation;
  and (3) static app-vetting that flags APKs invoking PackageManager.setComponentEnabledSetting with COMPONENT_ENABLED_STATE_DISABLED
  against a MAIN/LAUNCHER component, reinforced with API-distance/entropy statistics and an explainable
  gradient-boosting classifier. Together these checks let a SOC determine whether a hidden-but-operational
  app is evading detection while continuing background execution, sensor access, or network communication.'
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Which application packages appear in the MDM/MTD installed-app inventory for a device but
    have NO corresponding LAUNCHER intent activity recorded in mobile EDR over the last 30 days?
  context: 'This is the core cross-view differential for Defense Evasion via Suppress Application Icon:
    the authoritative installed-app view (MDM/MTD package inventory, source A) must agree with the user-facing
    launcher view obtained from LauncherApps.getActivityList in mobile EDR (source B). Left-join A to
    B on device ID + package name and alert when an app present in A has no LAUNCHER activity in B within
    30 days. On fully managed devices and work profiles Android fully hides the icon, so this gap is the
    expected concealment signature; on non-managed Android 10+ devices a synthesized settings-entry is
    normal and a fully missing entry is more anomalous. Suppress alerts for an allowlist of known non-launcher
    helper apps and system apps. A positive result is an app deliberately hidden from the launcher while
    still installed and operational - pivot on the package SHA256 and name into threat intelligence to
    confirm malice; a negative result means installed apps reconcile with their launcher presence. Sources:
    [Stealthy Malware Detection Through VMM-Based Out-of-the-Box Semantic View Reconstruction, Jiang et
    al.](https://www.cs.purdue.edu/homes/dxu/pubs/CCS07.pdf); [An Architecture for Specification-Based
    Detection of Semantic Integrity Violations, Petroni et al.](https://www.usenix.org/legacy/event/sec06/tech/full_papers/petroni/petroni.pdf);
    [LauncherApps.getActivityList](https://developer.android.com/reference/android/content/pm/LauncherApps);
    [Suppress Application Icon (T1628.001), MITRE ATT&CK](https://attack.mitre.org/techniques/T1628/001/).'
  answer_sources:
  - MDM application inventory logs
  - Mobile EDR launcher intent / LauncherApps.getActivityList logs
  - Threat intelligence package name blocklists
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Corporate-owned and bring-your-own-device (BYOD) mobile endpoints, MDM and Mobile Threat Defense
    (MTD) management servers, Security Information and Event Management (SIEM) platform, Network egress
    gateways, Internal DNS resolvers'
  range: Last 30 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "inv = mdm_inventory;            // source A: device_id, package, sha256, is_system\nlaunch\
      \ = edr_launcher_intents;  // source B: device_id, package from LauncherApps.getActivityList\nhidden\
      \ = leftjoin(inv, launch, on=[device_id, package])\n         where launch.package is null      \
      \      // no LAUNCHER activity in 30d\n           and inv.package not in allowlist\n           and\
      \ inv.is_system == false;\nfor h in hidden: enrich(h.sha256, h.package) via threat_intel;\nalert\
      \ device_id, package, sha256, days_since_install"
- question: Among apps that lack a launcher intent, which ones are installed across an unusually large
    share of the fleet AND continue sustained background network activity while invisible?
  context: 'Once hidden apps are identified, prevalence and physics-of-activity baselining separate benign
    non-launcher helpers from operational malware (Defense Evasion). Compute fleet-wide install prevalence
    (unique device installs) for every non-allowlisted no-launcher app, build a 90-day baseline distribution
    for known-benign helpers, and alert at high severity when a NEW hidden app''s install count exceeds
    the 99th percentile of that baseline - a sign of a rapidly spreading concealed app. Then add the Andromaly-style
    activity layer: for each flagged hidden app profile Volume (mean bytes/day sent+received per device),
    Frequency (connections/hour), and State (ratio of failed/blocked connections and NXDOMAIN responses)
    from Zeek conn.log/dns.log. Alert when a no-launcher app sustains network volume or connection frequency
    above the benign-helper baseline, because a hidden but operational app keeps communicating while invisible.
    Low prevalence with no traffic suggests a dormant or genuinely benign helper. Sources: ["Andromaly",
    Shabtai et al.](https://link.springer.com/article/10.1007/s10844-010-0148-x).'
  answer_sources:
  - MDM application inventory logs
  - Mobile EDR launcher intent / LauncherApps.getActivityList logs
  - Threat intelligence package name blocklists
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Corporate-owned and bring-your-own-device (BYOD) mobile endpoints, MDM and Mobile Threat Defense
    (MTD) management servers, Security Information and Event Management (SIEM) platform, Network egress
    gateways, Internal DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "candidates = hidden_apps where package not in allowlist;\nprevalence = count_distinct(device_id)\
      \ per package over 90d;\nbaseline = pctl(benign_helper_prevalence, 99);\nalert package where is_new\
      \ and prevalence > baseline;\n// physics-of-activity from Zeek per device_ip<->package\nvolume =\
      \ mean(bytes_sent+bytes_recv)/day;\nfreq   = conns/hour;\nstate  = (failed_conns + nxdomain)/total;\n\
      alert when volume > helper_baseline.volume\n         or freq   > helper_baseline.freq"
- question: What is the malice probability for each no-launcher app when an explainable logistic-regression
    model fuses its permission, install-provenance, and network-behavior features, and which features
    drove a high score?
  context: 'This applies an explainable Drebin-style linear model to rank hidden apps for analyst review
    under Defense Evasion. For each app lacking a launcher intent, engineer features from MDM logs (sideloaded-install
    flag, count of dangerous permissions, presence of BIND_ACCESSIBILITY_SERVICE / SYSTEM_ALERT_WINDOW
    / QUERY_ALL_PACKAGES, app age in days) and from network logs by correlating the device IP: Shannon
    entropy of destination IPs and of queried domains, low-reputation-domain connection ratio, and failed/blocked-connection
    and NXDOMAIN rates (CICAndMal2017-style flow features). Flag for review when P(malicious) > 0.8 and,
    per Drebin explainability, surface the top-3 weighted contributing features in the alert text (e.g.,
    ''sideloaded; +Accessibility permission; high NXDOMAIN rate''). A high score with accessibility abuse
    and beaconing entropy is a strong hidden-malware indicator; retrain quarterly to track drift. Logistic
    regression keeps the verdict interpretable so analysts can justify action. Sources: [Drebin, Arp et
    al.](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf); [Identification of Significant
    Permissions, Rathore et al.](https://arxiv.org/pdf/2103.00643); [CICAndMal2017, Lashkari et al.](https://www.unb.ca/cic/datasets/andmal2017.html).'
  answer_sources:
  - MDM application inventory logs
  - Mobile EDR launcher intent / LauncherApps.getActivityList logs
  - Threat intelligence package name blocklists
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Corporate-owned and bring-your-own-device (BYOD) mobile endpoints, MDM and Mobile Threat Defense
    (MTD) management servers, Security Information and Event Management (SIEM) platform, Network egress
    gateways, Internal DNS resolvers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "for app in hidden_apps:\n  f = features(\n    sideloaded, n_dangerous_perms,\n    has_accessibility,\
      \ has_overlay, has_query_all_packages,\n    app_age_days,\n    H_dest_ip   = -sum(p*log2(p)),  \
      \ // conn.log\n    H_domains   = -sum(p*log2(p)),   // dns.log\n    low_rep_ratio, failed_conn_rate,\
      \ nxdomain_rate)\n  p = logreg.predict_proba(f)\n  if p > 0.8: alert(app, p, top3_weighted_features(f))\n\
      // retrain quarterly"
- question: Did a known launcher process spawn the system settings process with a command line that navigates
    directly to a specific app's details page (the Android 10+ synthesized-icon redirection)?
  context: 'On Android 10+ a suppressed app is represented by a synthesized launcher icon that, when tapped,
    opens the app''s system-settings details page rather than the app itself - a tell-tale of icon suppression
    (Defense Evasion). Build a SIEM correlation rule on a process-creation event where parent_process_name
    is on an allowlist of known launchers (e.g., com.google.android.apps.nexuslauncher) and process_name
    is com.android.settings, validating that process_cmdline contains both ''com.android.settings.ApplicationDetailsPages''
    and ''package:''. Extract the target package and alert for investigation, cross-referencing it against
    the cross-view ''no LAUNCHER activity'' list from the first evidence item to confirm a genuinely icon-suppressed
    app rather than a normal settings shortcut. A confirmed match shows the user (or automation) interacting
    with a hidden app''s synthesized entry; correlation with the no-launcher list elevates confidence.
    Sources: [Suppress Application Icon (T1628.001), MITRE ATT&CK](https://attack.mitre.org/techniques/T1628/001/).'
  answer_sources:
  - Mobile EDR process creation event logs
  - Android Logcat logs
  - ITSM ticket data
  - 'NAI: Managed mobile endpoints running Android 10 or newer, EDR and SIEM log aggregation platforms,
    IT Service Management system'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "evt = process_creation_events;\nalert when evt.parent_process_name in launcher_allowlist\n\
      \       and evt.process_name == 'com.android.settings'\n       and evt.process_cmdline contains\
      \ 'com.android.settings.ApplicationDetailsPages'\n       and evt.process_cmdline contains 'package:';\n\
      pkg = extract_package(evt.process_cmdline);\nif pkg in no_launcher_list: severity = high;\noutput\
      \ device_id, pkg, evt.process_cmdline"
- question: For each app, do launcher-to-settings redirection events spike above its fleet baseline, and
    is the redirected app then NOT foregrounded yet still running background services or network activity?
  context: 'This statistical layer prioritizes synthesized-icon redirections and distinguishes benign
    curiosity from concealed operations (Defense Evasion). For each package identified by the symbolic
    rule, maintain a daily per-device count of launcher-to-settings redirection events (Frequency), compute
    a 30-day moving average MA30 and standard deviation sigma30 across the fleet, and alert when a single
    app''s daily count exceeds MA30 + 3*sigma30. Pair this with the post-redirection State metric: count
    how often the redirected app is then NOT launched/foregrounded yet continues background service or
    network activity within the following hour. A user curiously tapping a synthesized icon typically
    lands in settings and stops (benign), whereas an operational hidden app keeps running invisibly -
    the combination of a redirection spike plus continued background activity without foregrounding is
    the high-confidence malicious pattern.'
  answer_sources:
  - Mobile EDR process creation event logs
  - Android Logcat logs
  - ITSM ticket data
  - 'NAI: Managed mobile endpoints running Android 10 or newer, EDR and SIEM log aggregation platforms,
    IT Service Management system'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "daily = count(redirection_events) per package per device per day;\nMA30  = mean(daily, 30d);\
      \  S30 = stddev(daily, 30d);\nalert when daily > MA30 + 3*S30;\n// State: redirected but not foregrounded\
      \ yet active\nfor hit: bg = background_service_or_net_activity(pkg, +1h);\n         fg = foregrounded(pkg,\
      \ +1h);\nif bg and not fg: severity = high"
- question: Do UI-event / process-creation sequences show a low-probability direct HomeScreen -> AppDetailsPage
    transition that deviates from learned normal navigation, indicating use of a synthesized hidden-app
    icon?
  context: 'This models normal mobile UI navigation and flags the synthesized-icon path as a sequence
    anomaly (Defense Evasion). Treat UI-event/process-creation sequences from mobile EDR/logcat as a log-key
    stream and apply a DeepLog-style LSTM next-event predictor (or an equivalent HMM) over states such
    as ''HomeScreen'', ''AppDrawer'', ''SettingsMenu'', ''AppDetailsPage''. Train on baseline normal-usage
    sequences; the direct ''HomeScreen'' -> ''AppDetailsPage'' transition - the synthesized-icon path
    - is a low-probability event and is flagged when it falls outside the model''s top-g predicted next
    events. Surface the specific deviating log key/transition and the offending package for explainability,
    and score sessions rather than single events to reduce noise. A flagged session means navigation jumped
    straight to an app''s settings page without the normal drawer/menu path, consistent with tapping a
    hidden app''s synthesized entry. Sources: [DeepLog, Du et al.](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
  answer_sources:
  - Mobile EDR process creation event logs
  - Android Logcat logs
  - ITSM ticket data
  - 'NAI: Managed mobile endpoints running Android 10 or newer, EDR and SIEM log aggregation platforms,
    IT Service Management system'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "seq = ui_event_stream(device, session);  // log keys: HomeScreen, AppDrawer, SettingsMenu,\
      \ AppDetailsPage\nfor each next_event in seq:\n  preds = deeplog.predict_topg(history)\n  if next_event\
      \ not in preds: anomaly=true\nif transition('HomeScreen'->'AppDetailsPage') and anomaly:\n  alert(device,\
      \ session, deviating_log_key, package)\n// score per session, not per event"
- question: Does an APK invoke PackageManager.setComponentEnabledSetting with COMPONENT_ENABLED_STATE_DISABLED
    against a component declared with both MAIN and LAUNCHER intents (a deterministic icon-hiding capability
    to hard-block)?
  context: 'This is a deterministic static-vetting block for the icon-hiding capability (Defense Evasion).
    Integrate a YARA rule into the app-vetting pipeline to detect the bytecode for Landroid/content/pm/PackageManager;->setComponentEnabledSetting
    together with the integer constant for COMPONENT_ENABLED_STATE_DISABLED (value 2). On match, parse
    AndroidManifest.xml and confirm the disabled component declares both android.intent.action.MAIN and
    android.intent.category.LAUNCHER; a confirmed match flags the app and blocks distribution. Because
    the API + DISABLED flag against a LAUNCHER component is exactly the mechanism that programmatically
    hides an app''s icon, this should be a hard block rather than a score. A match in a developer CI/CD
    or managed-store submission stops a concealment-capable app before it reaches devices; absence of
    the pattern does not rule out other hiding paths but removes the most direct one. Sources: [Vetting
    the Security of Mobile Applications, NIST SP 800-163r1](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-163r1.pdf);
    [T1628.001, MITRE ATT&CK](https://attack.mitre.org/techniques/T1628/001/).'
  answer_sources:
  - Static analysis reports from application vetting sandbox
  - Mobile application reputation service logs
  - APK files
  - 'NAI: Organizational application stores (e.g., managed Google Play), Application vetting sandboxes,
    Developer CI/CD pipelines, Threat intelligence platforms'
  range: Last 90 days
  queries:
  - technology: YARA/Static-analysis pseudocode
    query: "rule hide_launcher_icon {\n  strings:\n    $api = \"Landroid/content/pm/PackageManager;->setComponentEnabledSetting\"\
      \n    $disabled = { 12 2? }   // const COMPONENT_ENABLED_STATE_DISABLED = 2\n  condition: $api and\
      \ $disabled }\non match:\n  comp = manifest_disabled_component(apk)\n  if comp has 'android.intent.action.MAIN'\n\
      \     and comp has 'android.intent.category.LAUNCHER':\n       block_distribution(apk); flag(apk)"
- question: Which submitted APKs contain the icon-hiding API AND fall in the top percentile for API-set
    Jaccard distance from the benign corpus, classes.dex entropy, or rare dangerous-permission count?
  context: 'This statistical screen prioritizes obfuscated/packed icon-hiding apps during vetting (Defense
    Evasion). For each submitted APK, extract its API-call set and compute the Jaccard distance d = 1
    - |A intersect B| / |A union B| between the new app''s API set A and a benign-corpus baseline B, plus
    the Shannon entropy of classes.dex to gauge obfuscation/packing. Flag for manual review when the app
    contains the icon-hiding API AND both its Jaccard distance and entropy fall in the top 5th percentile
    of all scanned apps. Reinforce with a permission-rarity signal: a high count of rarely-needed dangerous
    permissions co-occurring with the icon-hiding API sharply raises priority. An app that both hides
    its icon and is statistically far from benign norms (highly obfuscated, rare permissions) is far more
    likely malicious than a benign helper that legitimately toggles a component. Sources: [Identification
    of Significant Permissions, Rathore et al.](https://arxiv.org/pdf/2103.00643).'
  answer_sources:
  - Static analysis reports from application vetting sandbox
  - Mobile application reputation service logs
  - APK files
  - 'NAI: Organizational application stores (e.g., managed Google Play), Application vetting sandboxes,
    Developer CI/CD pipelines, Threat intelligence platforms'
  range: Last 90 days
  queries:
  - technology: Static-analysis/Stats pseudocode
    query: "A = api_set(apk);  B = benign_api_baseline;\ndJ = 1 - |A & B| / |A | B|;\nent = shannon_entropy(classes.dex);\n\
      rare_perms = count(dangerous_perms_rare(apk));\nif has_icon_hiding_api(apk)\n   and dJ >= pctl(all_dJ,\
      \ 95)\n   and ent >= pctl(all_ent, 95):\n     flag_for_review(apk, dJ, ent, rare_perms)"
- question: What malice score does an explainable gradient-boosting classifier assign each submitted APK
    from its static features, and which top contributing features justify auto-reject or analyst-quarantine?
  context: 'This is the ML verdict stage of app vetting (Defense Evasion). Train a gradient boosting classifier
    (XGBoost/LightGBM) on a labeled benign/malicious corpus (e.g., Drebin) using static features: presence
    of suspicious APIs (setComponentEnabledSetting), count of dangerous permissions, packer/obfuscation
    signatures, and reputation of embedded URLs/IPs. Optionally add MaMaDroid-style Markov transition
    probabilities over abstracted API-call sequences to resist API-name evasion. Deploy in the vetting
    sandbox: auto-reject above a high malice threshold (e.g., > 0.9) and quarantine the 0.7-0.9 band for
    analyst review. Following Drebin explainability, include the top-3 contributing features (e.g., ''setComponentEnabledSetting
    on LAUNCHER component; +Accessibility permission; low-reputation C2 host'') in each verdict so analysts
    can validate. A high score combining icon-hiding with accessibility abuse and bad-reputation endpoints
    is a strong reject; scores in the gray band warrant manual confirmation before distribution. Sources:
    [Drebin dataset](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf); [MaMaDroid,
    Onwuzurike et al.](https://arxiv.org/pdf/1612.04433).'
  answer_sources:
  - Static analysis reports from application vetting sandbox
  - Mobile application reputation service logs
  - APK files
  - 'NAI: Organizational application stores (e.g., managed Google Play), Application vetting sandboxes,
    Developer CI/CD pipelines, Threat intelligence platforms'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "f = static_features(apk):\n  has_setComponentEnabledSetting, n_dangerous_perms,\n  packer_obfuscation_sig,\
      \ embedded_url_ip_reputation,\n  mamadroid_markov_transitions(api_seq)\np = gbm.predict_proba(f)\n\
      if p > 0.9: auto_reject(apk)\nelif p >= 0.7: quarantine(apk)\nverdict.explain = top3_features(f)"
