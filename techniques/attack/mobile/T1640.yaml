name: 'T1640: Account Access Removal'
id: 002c0db6-df88-4d67-bb39-57814a277e5a
description: Investigate whether an adversary is removing or denying legitimate users access to corporate
  accounts (Account Access Removal) by abusing compromised mobile devices, mobile-network egress, and
  account-management interfaces. This playbook helps an analyst hunt for accounts that are deleted, locked,
  or manipulated (credentials reset, MFA revoked) to lock legitimate users out. It correlates Windows
  account-lockout (Event ID 4740) and password-reset (Event ID 4724) activity with source IPs belonging
  to mobile-carrier ASNs (via Zeek conn.log), device user-agents that do not match the user's enrolled
  profile in the Mobile Device Management (MDM) platform, and Cloud Identity Provider events. It examines
  abusive bursts of HTTP POST/DELETE requests against critical account-management API endpoints (password
  reset, account deletion, MFA revocation) observed at WAF and API Gateway tiers, and ties anomalous authentication
  abuse back to managed mobile devices that granted Device Administrator permission to non-standard, newly
  installed, or sideloaded apps - the privilege that enables resetPassword/lockNow/wipeData abuse. Detection
  methods span symbolic logic (deterministic correlation rules and watchlists), statistical baselining
  (modified Z-score outliers, sequential hypothesis testing of failure ratios, URI path entropy, rate-of-change),
  and machine learning (seasonal time-series anomaly detection, isolation forest/one-class SVM, permission-based
  app classifiers, device clustering, and graph link-prediction) so analysts can determine whether legitimate
  user access is being deliberately stripped away.
type: technique
