- question: When a managed device enters a high-risk cluster (by app count, high-risk permissions, compliance,
    enrollment age), do graph link-prediction and causal credential-switch rules surface an improbable
    new identity edge from that device that coincides with a lockout or failed MFA?
  context: This machine-learning method clusters all managed devices (K-Means/DBSCAN) on installed-app
    count, count of high-risk permissions (Device Admin, Accessibility), compliance status, and enrollment
    age. When a device enters a high-risk cluster, lower the alert thresholds for subsequent anomalous
    behavior so that even a single 4740 lockout or failed MFA from it triggers review. In parallel, rank
    improbable new identity edges originating from that device using unsupervised graph link-prediction
    (CyberGraph) and apply causal credential-switch plus first-time-access rules (Hopper) to surface the
    rare access path for triage. A flagged rare edge from a high-risk device tied to a lockout/MFA failure
    is a strong Account Access Removal signal; absence of such edges lowers concern even for clustered
    devices.
