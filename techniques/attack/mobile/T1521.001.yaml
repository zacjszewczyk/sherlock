    query: 'model = IsolationForest(train=known_good_protocol_adherent)

      features=[duration, orig_bytes, resp_bytes, byte_ratio, proto, service, conn_state, history_char_dist,
      dest_port]

      | score(flow) | where anomaly_score high | alert with top3 SHAP features'
- question: Can payload-agnostic, version-agnostic flow-level classifiers (effective across TLS 1.2/1.3,
    using datagram-byte representations) identify encrypted tunnels masquerading on standard ports?
  context: TLS 1.3 reduces metadata visibility (encrypted SNI/certificates), so classifiers must rely
    on payload-agnostic flow features and datagram-byte representations that remain effective across TLS
    1.2 and 1.3. Applying such version-agnostic flow-level classifiers (and ET-BERT-style datagram models)
    identifies encrypted tunnels masquerading on standard ports even when handshake metadata is unavailable.
    This complements the deterministic protocol-mismatch checks for cases where the tunnel does present
    a plausible-looking handshake. A positive classification indicates a likely encrypted tunnel; explainable
    output and analyst review support triage and reduce false positives. Directly supports Command and
    Control by classifying disguised encrypted tunnels regardless of TLS version. Apply payload-agnostic
    classifiers effective across TLS 1.2/1.3 per [Extending C2 Traffic Detection from TLS 1.2 to TLS 1.3](https://dl.acm.org/doi/10.1145/3678890.3678921)
    and datagram-byte models per [ET-BERT](https://arxiv.org/abs/2202.06335).
