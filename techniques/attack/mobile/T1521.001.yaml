- question: Do per-device DNS resolution failure rates (NXDOMAIN/SERVFAIL) and TCP connection failure
    states (S0/REJ/RSTO) show sustained elevations beyond three MADs from baseline, signaling C2 fallback
    within a tunneling scenario?
  context: As with direct beaconing, tunneling implants generate failed and blocked attempts when rotating
    through fallback infrastructure or when egress controls intervene. Tracking NXDOMAIN/SERVFAIL rates
    and TCP conn_state failures (S0/REJ/RSTO) per device and alerting on sustained elevations beyond three
    MADs from baseline treats these failed/blocked attempts as a distinct C2 signal. This is especially
    useful when the successful tunnel is fully encrypted and otherwise blends in. A sustained elevation
    with retry cadence indicates fallback behavior; captive portals and outages are benign confounders,
    so weigh persistence and regularity. Supports Command and Control by detecting the resilience behavior
    of the tunnel. Treat failed/blocked attempts as a distinct C2 signal per [Real-Time Detection of DNS
    Exfiltration and Tunneling](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).
