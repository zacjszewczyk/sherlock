    query: 'model = DeepClassifier(input=[raw_datagram_bytes, flow_metadata])  # ET-BERT style pretrain

      | predict(flow)

      | where label==non_benign OR app_structure==unseen

      | alert with explainable_features'
- question: Are there connections on standard service ports (443/TCP, 53/UDP) recorded in Zeek conn.log
    that have no corresponding protocol record — no TLS handshake in ssl.log for the same connection UID,
    or no matching query in dns.log — and can these protocol mismatches be enriched with threat intelligence
    and JA3/JA4 fingerprints?
  context: Adversaries tunnel C2 over well-known ports (443, 53) to blend with normal traffic, but the
    traffic often does not actually speak the expected protocol. Left-joining conn.log to ssl.log for
    port 443 and to dns.log for port 53 by connection UID and alerting on missing protocol records deterministically
    exposes this tunneling. Enriching mismatched flows with threat intelligence on destination IP/ASN
    and JA3/JA3S fingerprints raises confidence and severity for high-risk ASNs or known implant fingerprints.
    A protocol mismatch on a standard port is a strong tunneling indicator; benign causes include non-TLS
    services on 443 or QUIC, so corroborate. This targets Command and Control protocol-impersonation tunneling.
    Enrich with threat intelligence and [JA3](https://github.com/salesforce/ja3)/[JA4+](https://github.com/FoxIO-LLC/ja4)
    TLS fingerprints.
