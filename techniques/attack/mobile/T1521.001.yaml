      UNION conn.log[port==53/udp] LEFT JOIN dns.log on uid -> where dns.uid is null

      | enrich dest_ip/asn with ti, compute ja3/ja3s

      | alert, raise severity for high_risk_asn OR known_implant_fp'
- question: For protocol-mismatched flows on standard ports, does the payload exhibit sustained high Shannon
    entropy (> 7.5) indicating an embedded symmetric-crypto tunnel?
  context: A connection that uses a standard service port but does not speak that protocol is suspicious;
    if its payload is also high-entropy, it strongly suggests an embedded encrypted (symmetric-crypto)
    tunnel rather than a misconfigured benign service. Computing payload Shannon entropy on the mismatched
    flows and deterministically flagging sustained entropy above ~7.5 confirms the channel is encrypted/compressed.
    Combining protocol mismatch with high entropy substantially reduces false positives compared to either
    signal alone. A positive result is high-confidence tunneling evidence; legitimate encrypted but non-conforming
    traffic (rare) should be allowlisted. Directly supports Command and Control tunnel detection. The
    entropy threshold follows [Using Entropy Analysis to Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989).
