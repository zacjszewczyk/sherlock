name: 'T1521.001: Symmetric Cryptography'
id: 9058bd3d-5237-4d51-a04f-426f6ed024cd
description: Investigate whether a managed mobile device (Android or iOS) is using symmetric cryptography
  (e.g., AES, RC4, Blowfish) to conceal command-and-control (C2) traffic. This playbook helps an analyst
  hunt for application C2 beacons characterized by periodic connections, high-entropy (symmetrically encrypted)
  payloads, and non-standard destination ports, as well as protocol-tunneling where traffic on standard
  service ports (443/TCP, 53/UDP) fails to conform to the expected application-layer protocol. It correlates
  network telemetry (Zeek conn/ssl/dns/files/http/software logs, MDM network flow logs, mobile EDR network
  connection logs) with on-device symmetric-crypto API misuse (AES/ECB, hardcoded or reused keys, constant
  IVs) and background/locked execution context from mobile EDR OS-API telemetry. The included questions
  span deterministic symbolic-logic matching (threat-intel joins, JA3/JA4 fingerprinting, entropy thresholds,
  protocol-mismatch detection), statistical baselining (beacon periodicity scoring, jittered-cadence CT-HMM
  modeling, failure-state and protocol-mismatch ratio profiling), and machine-learning approaches (time-series
  anomaly detection, Isolation/Random Forest flow classification, and decryption-free encrypted-traffic
  classification) to surface covert encrypted C2 channels on mobile devices.
type: technique
related:
- tactic_id: TA0037
  tactic_name: Command And Control
