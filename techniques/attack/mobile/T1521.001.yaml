  - MDM network flow logs
  - Mobile EDR network connection logs
  - Mobile EDR OS API execution logs
  - Threat intelligence indicators
  - 'NAI: Managed mobile devices, Corporate Wi-Fi network sensors, VPN concentrators, Internet Gateway
    / Egress Firewall, Cloud Access Security Broker (CASB), Mobile Device Management (MDM) Server'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'conn.log, dns.log | per device per day

      | stats failed_ratio = (S0+REJ+RSTO)/total, nxdomain_rate

      | baseline median+3*MAD per device

      | where failed_ratio > baseline OR nxdomain_rate > baseline | alert'
- question: Does a two-stage machine-learning pipeline — a per-device time-series model flagging spikes/irregular
    cadence in high-entropy outbound traffic, followed by a flow classifier (Random Forest / Isolation
    Forest) using inter-arrival stats, entropy, duration, byte counts/ratios, destination port/ASN and
    JA3/JA3S — identify encrypted C2 flows?
  context: When deterministic and simple statistical rules are insufficient, a layered ML approach improves
    coverage. Stage 1 uses a per-device LSTM/transformer time-series model to flag spikes and irregular
    cadence in high-entropy outbound traffic; Stage 2 classifies the flagged flows with a Random Forest
    or Isolation Forest over inter-arrival statistics, entropy, duration, byte counts/ratios, destination
    port/ASN and JA3/JA3S. Using payload-agnostic flow features keeps the model robust to TLS 1.3 where
    SNI/cert visibility is reduced, and SHAP/LIME surfaces the top-3 contributing features per alert for
    analyst triage. A positive classification warrants investigation; explainability and human review
    are essential to manage false positives. Directly targets Command and Control via encrypted-channel
    classification. Stage 1 follows [C2 Beaconing Detection via AI-Based Time-Series Analysis](https://link.springer.com/chapter/10.1007/978-3-032-00627-1_20);
    Stage 2 uses a Random Forest / [Isolation Forest](https://ieeexplore.ieee.org/document/4781136). Payload-agnostic
    features robust to TLS 1.3 come from [Extending C2 Traffic Detection from TLS 1.2 to TLS 1.3](https://dl.acm.org/doi/10.1145/3678890.3678921),
    with top-3 contributing features surfaced via SHAP/LIME per [the systematic review on explainable
    AI in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek software.log
  - Zeek http.log
