- question: Do daily protocol-mismatch ratios for ports 443 and 53 on any device exceed three MADs from
    the device baseline or the 99th percentile across the fleet, after suppressing legitimate keep-alives?
  context: A single protocol mismatch may be noise, but a device whose proportion of mismatched flows
    on 443/53 rises sharply indicates systematic tunneling. Computing daily protocol-mismatch ratios per
    device and alerting when the ratio exceeds three median absolute deviations from the device baseline,
    or the 99th fleet percentile, surfaces this behavior statistically. Corroborating with benign-periodicity
    baselines suppresses legitimate keep-alives and health checks that can appear non-conforming. A sustained
    elevated ratio is a behavioral C2-tunneling signal; benign app updates or new services can shift the
    baseline, so review trend persistence. Supports Command and Control by detecting tunneling at the
    device-behavior level. Corroborate with benign-periodicity baselines from [Modeling, Analysis and
    Characterization of Periodic Traffic](https://cspages.ucalgary.ca/~cwill/papers/2018/Mack-MASCOTS2018.pdf)
    to suppress legitimate keep-alives.
  answer_sources:
