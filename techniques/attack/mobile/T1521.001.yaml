    / Egress Firewall, Cloud Access Security Broker (CASB), Mobile Device Management (MDM) Server'
  range: Last 90 days
  queries:
  - technology: Mobile EDR/pseudocode
    query: 'os_api.log | where api IN (Cipher.getInstance, SecretKeySpec)

      AND (mode==ECB OR key_reused OR iv_constant OR key_hardcoded)

      | join network.log on app_id where tx_time within 60s after crypto_op

      | raise severity if app_state==background OR device_locked==true'
- question: When outbound connections from a mobile device are grouped by destination IP/port in 1-hour
    windows, do any destinations exceed an anomaly score threshold based on periodic timing (inter-arrival
    stddev < 5s or coefficient of variation < 0.1), high payload entropy (> 7.5), and use of high-numbered
    non-allowlisted ports?
  context: 'Beaconing is the behavioral signature of C2 regardless of encryption. This statistical approach
    scores each destination within rolling 1-hour windows: +3 for highly regular timing (stddev < 5s or
    CV < 0.1), +3 for high payload entropy (> 7.5), and +2 for high-numbered non-allowlisted destination
    ports, alerting when the cumulative score exceeds 4. FFT/periodicity extraction (BAYWATCH) and CV/skewness
    scoring (RITA) isolate machine-driven cadence, while fleet-percentile and benign-periodicity baselines
    suppress legitimate keep-alives. A high score indicates an automated encrypted channel; legitimate
    push/sync services can score moderately, so whitelist suppression is essential. Central to detecting
    the Command and Control beacon. Use FFT/periodicity extraction per [BAYWATCH](https://dsail.kaist.ac.kr/files/WWW17.pdf),
    CV/skewness scoring per [RITA](https://github.com/activecm/rita), and fleet-percentile/benign-periodicity
    baselines from [Modeling, Analysis and Characterization of Periodic Traffic](https://cspages.ucalgary.ca/~cwill/papers/2018/Mack-MASCOTS2018.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek software.log
  - Zeek http.log
  - Zeek ssl.log
  - MDM network flow logs
  - Mobile EDR network connection logs
  - Mobile EDR OS API execution logs
  - Threat intelligence indicators
  - 'NAI: Managed mobile devices, Corporate Wi-Fi network sensors, VPN concentrators, Internet Gateway
    / Egress Firewall, Cloud Access Security Broker (CASB), Mobile Device Management (MDM) Server'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'conn.log | bin 1h | group by dest_ip, dest_port

      | stats iat_stddev, iat_cv, payload_entropy, dest_port

      | score = 3*(iat_stddev<5 OR iat_cv<0.1) + 3*(entropy>7.5) + 2*(dest_port>1024 AND dest NOT IN allowlist)

      | where score > 4 | alert'
- question: For destinations that evade fixed-interval beacon rules, does modeling beacon timing as state
    transitions (Continuous-Time Hidden Markov Model) reveal persistent low-entropy timing states indicative
    of jittered C2 cadence?
  context: 'Sophisticated implants add random jitter to beacon intervals to defeat simple stddev/CV thresholds.
    Modeling the inter-arrival sequence as a Continuous-Time Hidden Markov Model captures the underlying
    timing state structure; a beacon that jitters around a hidden state still exhibits persistent low-entropy
    timing states, whereas genuinely random human/app traffic does not. Alerting on these persistent states
    catches cadence that fixed-interval scoring misses. A positive result suggests deliberate timing obfuscation
    typical of C2; it requires sufficient connection history per destination to fit the model. This deepens
    Command and Control beacon detection against evasive adversaries. Model the cadence per [NetSpectra
    Sentinel: CT-HMM for C2 Beaconing Detection](https://www.sciencedirect.com/science/article/pii/S1084804525000244).'
