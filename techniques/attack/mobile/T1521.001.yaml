    query: 'stage1 = LSTM_per_device(high_entropy_outbound) -> flag spikes/irregular_cadence

      stage2 = RandomForest/IsolationForest(features=[iat_stats, entropy, duration, bytes, byte_ratio,
      dest_port, dest_asn, ja3, ja3s])

      | predict(stage1_flagged) -> if non_benign: alert with top3 SHAP features'
- question: Can a deep learning model trained on raw datagram bytes and flow metadata distinguish benign
    mobile-app TLS from symmetric-crypto C2 without decryption, flagging flows classified as non-benign
    or matching unseen-app structure?
  context: Because C2 payloads are encrypted, content inspection is impossible; instead, decryption-free
    classifiers learn from raw datagram byte patterns and flow metadata. Mobile-specific encrypted-traffic
    representations and datagram pre-training (ET-BERT-style) capture per-app structural signatures, allowing
    a model to flag flows that are classified as non-benign or that exhibit unseen-app structure (suggesting
    an app masquerading or a new implant). This is valuable on mobile where many apps use TLS and per-app
    baselining is feasible. A positive result indicates traffic that does not match the known benign-app
    fleet; explainable feature output should accompany each alert to support triage. Supports Command
    and Control by classifying the encrypted channel without breaking encryption. Leverage mobile-specific
    encrypted-traffic representations from [Mobile Encrypted Traffic Classification Using Deep Learning](https://www.sciencedirect.com/science/article/abs/pii/S1389128619304669)
    and datagram pre-training from [ET-BERT](https://arxiv.org/abs/2202.06335).
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek software.log
  - Zeek http.log
  - Zeek ssl.log
  - MDM network flow logs
  - Mobile EDR network connection logs
  - Mobile EDR OS API execution logs
  - Threat intelligence indicators
  - 'NAI: Managed mobile devices, Corporate Wi-Fi network sensors, VPN concentrators, Internet Gateway
    / Egress Firewall, Cloud Access Security Broker (CASB), Mobile Device Management (MDM) Server'
  range: Last 90 days
