questions:
- question: Do any C2 destinations (IP addresses or domains) contacted by managed mobile devices match
    known C2 threat-intelligence indicators, or do any TLS flows present JA3/JA3S client/server fingerprints
    associated with known implant stacks (or a non-browser fingerprint from an app claiming to be a browser)?
  context: 'Command-and-control over symmetric cryptography still requires the implant to reach an attacker-controlled
    endpoint. By joining Zeek conn.log and MDM network flow logs against curated C2 threat-intelligence
    (destination IP/domain/ASN) you can deterministically catch known infrastructure. Enriching TLS flows
    with JA3/JA3S fingerprints from ssl.log lets you detect known implant TLS stacks even when the destination
    is novel, and flags impersonation where an app presenting itself as a browser uses a non-browser TLS
    fingerprint. A positive match is high-confidence evidence of C2; a negative result does not clear
    the device, since novel infrastructure and fingerprints evade allow/deny lists. This is tactic-specific
    to Command and Control: it targets the rendezvous step of the encrypted channel. Per [JA3 TLS Client
    Fingerprinting](https://github.com/salesforce/ja3) and the version-resilient [JA4+ suite](https://github.com/FoxIO-LLC/ja4).'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek software.log
  - Zeek http.log
  - Zeek ssl.log
  - MDM network flow logs
  - Mobile EDR network connection logs
  - Mobile EDR OS API execution logs
  - Threat intelligence indicators
  - 'NAI: Managed mobile devices, Corporate Wi-Fi network sensors, VPN concentrators, Internet Gateway
    / Egress Firewall, Cloud Access Security Broker (CASB), Mobile Device Management (MDM) Server'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'join conn.log, mdm_flow.log with ti_indicators on dest_ip/dest_domain/dest_asn

      | where match == true

      | alert severity=high'
  - technology: Zeek/pseudocode
    query: 'ssl.log | compute ja3, ja3s

      | lookup ja3 in known_c2_fingerprints OR (app_claims_browser AND ja3 NOT IN browser_ja3_set)

      | alert'
- question: Are managed mobile devices transferring sustained high-entropy payloads (Shannon entropy >
    7.5) to non-allowlisted external destinations, consistent with symmetrically encrypted or compressed
    C2 data?
  context: Symmetric encryption produces high-entropy byte streams that are statistically indistinguishable
    from random data. Computing Shannon entropy on transferred payload bytes (from Zeek files.log or extracted
    buffers) and deterministically flagging sustained entropy above ~7.5 separates encrypted/compressed
    content from plaintext protocols. Restricting the alert to non-allowlisted destinations suppresses
    legitimate TLS/CDN traffic. A positive result on an unexpected destination is a strong indicator of
    an encrypted channel that may be symmetric-crypto C2; benign causes include legitimate encrypted apps
    and media, so corroborate with periodicity and destination reputation. This supports the Command and
    Control tactic by detecting the concealment mechanism itself. The entropy threshold separating symmetrically
    encrypted/compressed content from plaintext is established by [Using Entropy Analysis to Find Encrypted
    and Packed Malware](https://ieeexplore.ieee.org/document/4140989).
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek software.log
  - Zeek http.log
  - Zeek ssl.log
  - MDM network flow logs
  - Mobile EDR network connection logs
  - Mobile EDR OS API execution logs
  - Threat intelligence indicators
  - 'NAI: Managed mobile devices, Corporate Wi-Fi network sensors, VPN concentrators, Internet Gateway
    / Egress Firewall, Cloud Access Security Broker (CASB), Mobile Device Management (MDM) Server'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'files.log | compute shannon_entropy(payload_bytes)

      | where entropy > 7.5 AND dest NOT IN allowlist AND sustained_over_window

      | alert'
- question: Does on-device mobile EDR OS-API telemetry show symmetric-crypto call patterns indicative
    of locally-keyed C2 staging — such as Cipher.getInstance with AES/RC4/Blowfish in ECB mode, SecretKeySpec
    with hardcoded or reused keys, or constant IVs — that precede outbound network transmission, especially
    while the app is backgrounded or the device is locked?
  context: Where MobileEDR OS-API telemetry exists, you can observe the cryptographic operations directly
    rather than inferring them from traffic. Misuse patterns — ECB mode, hardcoded/reused symmetric keys,
    constant IVs — are characteristic of malware that bundles a weak local crypto routine to obfuscate
    C2, as documented by CryptoLint-style analyses. Correlating these crypto operations with subsequent
    outbound transmission strongly suggests data staging for an encrypted channel. Severity should be
    raised when the crypto and staging occur while app_state=background or device_locked=true, since legitimate
    apps rarely perform encryption-then-exfil with no user interaction. A positive finding is high-fidelity
    on-device evidence of symmetric-crypto C2; absence only means telemetry was unavailable or the routine
    was hidden. Directly supports Command and Control. The misuse rules (ECB mode, hardcoded/reused keys,
    constant IVs) follow [An Empirical Study of Cryptographic Misuse in Android Applications](https://www.cs.ucsb.edu/~chris/research/doc/ccs13_cryptolint.pdf).
