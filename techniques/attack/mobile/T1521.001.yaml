- question: 'Does an Isolation Forest trained on known-good protocol-adherent traffic (features: duration,
    byte counts/ratios, proto, service, conn_state, history character distribution, destination port)
    assign high anomaly scores to flows that deviate from expected protocol behavior?'
  context: Rule-based protocol-mismatch detection can miss subtle non-conformance. An Isolation Forest
    trained on known-good protocol-adherent traffic learns the normal joint distribution of flow features
    — duration, byte counts/ratios, proto, service, conn_state, the Zeek history character distribution,
    and destination port — and assigns high anomaly scores to flows that deviate, such as tunnels riding
    standard ports. Surfacing the top-3 contributing features via SHAP/LIME makes each anomaly explainable
    for triage. A high anomaly score warrants review as potential tunneling; the model needs a clean training
    baseline and human validation to control false positives. Supports Command and Control by catching
    non-standard protocol use anomalously. Train on known-good protocol-adherent traffic with an [Isolation
    Forest](https://ieeexplore.ieee.org/document/4781136) and surface the top-3 contributing features
    via SHAP/LIME per [the explainable-AI-in-IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
