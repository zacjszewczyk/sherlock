    / Egress Firewall, Cloud Access Security Broker (CASB), Mobile Device Management (MDM) Server'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'conn.log | per dest_ip collect inter_arrival_sequence

      | fit CT-HMM(states)

      | where exists persistent low_entropy timing_state

      | alert'
- question: Do per-device connection and resolution failure metrics — TCP conn_state distribution (S0/REJ/RSTO),
    refused/blocked egress counts, and DNS NXDOMAIN rate — exceed three MADs from the device's own baseline,
    indicating C2 fallback behavior?
  context: Implants frequently cycle through fallback infrastructure when primary C2 is down or blocked,
    producing elevated connection failures (S0/REJ/RSTO), refused/blocked egress, and DNS NXDOMAIN responses.
    Tracking these failure-state metrics per device and alerting when ratios exceed three median absolute
    deviations from the device baseline surfaces this fallback signal. A sustained elevation with retry
    cadence is a distinct C2 indicator even when the successful channel is fully encrypted; benign causes
    include captive portals and transient network outages, so correlate with retry regularity. Supports
    Command and Control by detecting resilience/fallback behavior of the encrypted channel. Follow the
    failure-rate profiling in [Real-Time Detection of DNS Exfiltration and Tunneling](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).
  answer_sources:
