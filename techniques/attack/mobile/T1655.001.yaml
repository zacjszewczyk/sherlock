questions:
- question: Does any installed mobile application have a package name or signer SHA-256 thumbprint that
    exactly matches an entry on a threat-intelligence feed of known-malicious mobile identifiers?
  context: 'This is the IOC floor for Match Legitimate Name or Location: a deterministic, low-false-positive
    check that catches known-bad masquerading apps before any behavioral analysis. Query MDM/EMM application-inventory
    logs for every installed package name and signer SHA-256 thumbprint and correlate against curated
    threat-intel of malicious mobile identifiers, raising a high-severity alert on any exact match. For
    Defense Evasion, a match means a device is already running an app fingerprinted by the community as
    malicious despite wearing a trusted name/icon. A positive result is high-confidence and warrants immediate
    containment; a negative result does not clear the fleet because novel or repackaged look-alikes will
    not yet be in any feed, so corroborate with the allowlist, similarity, and behavioral checks. References:
    [Masquerading: Match Legitimate Name or Location (MITRE ATT&CK T1655.001)](https://attack.mitre.org/techniques/T1655/001/)'
  answer_sources:
  - Mobile Device Management (MDM) Application Inventory Log
  - 'NAI: Mobile Device Management (MDM) server database; Cloud-hosted MDM administrative consoles; Corporate-managed
    iOS and Android devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM mdm_app_inventory\nWHERE package_name IN ti_malicious_packages\n   OR signer_sha256 IN\
      \ ti_malicious_signers\nEMIT severity=high WITH device_id, user, package_name, signer_sha256, ti_source"
- question: Is any allowlisted package name present with an unknown signer certificate, or does any installed
    display name that visually matches a trusted app map to a signer that is not on the organizational
    allowlist?
  context: 'Maintain an organizational allowlist of trusted apps as tuples of (package_name, signer_SHA-256_thumbprint,
    icon_perceptual_hash). Because Android''s same-origin update policy requires an update to be signed
    by the originally installed certificate, a genuine app can never legitimately change signers; a look-alike
    therefore necessarily carries a different signer. Alert when (a) an allowlisted package_name appears
    with an unknown signer, or (b) an installed display name visually matching a trusted app maps to a
    signer not on the allowlist. For Defense Evasion this directly exposes impersonation that an exact-IOC
    check would miss. A positive result strongly indicates a masquerade or repackaged clone; tune the
    allowlist to documented legitimate variants to limit noise. References: [Application Signing (Android
    Open Source Project)](https://source.android.com/docs/security/features/apksigning) [You Shall not
    Repackage! (Merlo et al.)](https://arxiv.org/abs/2009.04718)'
  answer_sources:
  - Mobile Device Management (MDM) Application Inventory Log
  - 'NAI: Mobile Device Management (MDM) server database; Cloud-hosted MDM administrative consoles; Corporate-managed
    iOS and Android devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM mdm_app_inventory\nJOIN allowlist(package_name, signer_sha256, icon_phash)\nWHERE (package_name\
      \ IN allowlist.package_name AND signer_sha256 NOT IN allowlist.signer_sha256)\n   OR (visual_match(display_name,\
      \ allowlist.display_name) AND signer_sha256 NOT IN allowlist.signer_sha256)\nEMIT alert WITH device_id,\
      \ package_name, display_name, signer_sha256"
- question: Does any display name map to more than one signer certificate across the fleet (signer fan-out),
    or is any installed package name within Levenshtein distance 1-2 of an allowlisted package name (typosquatting)?
  context: 'Two complementary statistical signals expose cloning. First, daily group all installed apps
    by display name and count unique signer certificates per name; a legitimate app has exactly one signer,
    so a name associated with more than one signer (excluding documented variants) betrays a clone via
    signer fan-out. Second, compute Levenshtein distance between every installed package name and each
    allowlisted package name and alert on distance greater than 0 and less than 3, the classic typosquatting
    band (e.g., com.gooogle.android.gm vs com.google.android.gm). For Defense Evasion these catch attackers
    who reuse a trusted name with a fresh certificate or who subtly alter a package identifier to slip
    past exact matching. Positive results are strong leads requiring signer/resource confirmation. References:
    [Li et al., Rebooting Research on Detecting Repackaged Android Apps](https://arxiv.org/abs/1811.08520)
    [AOSP App Signing](https://source.android.com/docs/security/features/apksigning) [Woodbridge et al.](https://arxiv.org/abs/1805.09738)'
  answer_sources:
  - Mobile Device Management (MDM) Application Inventory Log
  - 'NAI: Mobile Device Management (MDM) server database; Cloud-hosted MDM administrative consoles; Corporate-managed
    iOS and Android devices.'
  range: Last 90 days; recompute daily
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM mdm_app_inventory\nSTATS dcount(signer_sha256) AS signers BY display_name, window=1d\n\
      WHERE signers > 1 AND display_name NOT IN documented_variants\nEMIT alert WITH display_name, signers\n\
      UNION\nFOR each package_name, allow IN allowlist.package_name:\n  d = levenshtein(package_name,\
      \ allow)\n  ALERT IF d > 0 AND d < 3\nEMIT alert WITH package_name, allow, d"
- question: Does any installed app's launcher icon fall within a small perceptual-hash (pHash) Hamming
    distance of a trusted app's icon while belonging to a non-allowlisted signer, and does its display
    name also fall within a small edit/visual distance of that trusted app?
  context: 'Attackers preserve the look-and-feel of the app they imitate, so visual similarity is a robust
    signal. Compute a perceptual hash (e.g., pHash) of each installed app''s launcher icon and the Hamming
    distance to allowlisted genuine icons; flag icons within a small distance of a trusted icon but belonging
    to a non-allowlisted signer. Combine with edit/visual distance on display names so a near-identical
    icon plus a near-identical name plus a foreign signer compounds confidence. For Defense Evasion this
    quantifies the deliberate visual imitation users rely on, catching pixel-level icon copies that exact
    hash matching misses. A positive result -- trusted-looking icon and name with an untrusted signer
    -- is strong evidence of masquerading; calibrate the Hamming threshold against your own icon corpus.
    References: [Woodbridge et al.](https://arxiv.org/abs/1805.09738)'
  answer_sources:
  - Mobile Device Management (MDM) Application Inventory Log
  - 'NAI: Mobile Device Management (MDM) server database; Cloud-hosted MDM administrative consoles; Corporate-managed
    iOS and Android devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each app IN mdm_app_inventory:\n  FOR each trusted IN allowlist:\n    icon_d = hamming(phash(app.icon),\
      \ trusted.icon_phash)\n    name_d = edit_distance(app.display_name, trusted.display_name)\n    ALERT\
      \ IF icon_d <= ICON_THRESHOLD\n         AND app.signer_sha256 NOT IN allowlist.signer_sha256\n \
      \        AND name_d <= NAME_THRESHOLD\n    EMIT alert WITH app.package_name, trusted.display_name,\
      \ icon_d, name_d"
- question: Does a suspected look-alike app request a dangerous-permission set that diverges significantly
    from the baseline permission profile of the legitimate app it imitates (e.g., a fake 'Settings' requesting
    SEND_SMS/RECEIVE_SMS/BIND_DEVICE_ADMIN)?
  context: 'A clone often grafts in capabilities the genuine app never needed, so its manifest permissions
    deviate from the imitated app''s baseline. For each trusted app, record its baseline dangerous-permission
    set; for a suspected look-alike, rank manifest permissions by Fisher''s Exact test or mutual information
    and flag apps whose dangerous-permission set diverges from the imitated app''s baseline. Random Forest
    plus Fisher''s Exact has reached 99.34% accuracy at 0.56% FPR, and a statistically-selected 16-permission
    subset suffices for low-overhead scoring. For Defense Evasion, a ''Settings'' look-alike requesting
    SMS or device-admin permissions is a glaring mismatch between claimed identity and actual capability.
    A positive result indicates the app''s behavior contradicts its trusted disguise and warrants vetting/removal.
    References: [Saleem et al., Feature Ranking of Permissions](https://arxiv.org/abs/2201.08468) [Identification
    of Significant Permissions](https://arxiv.org/abs/2103.00643)'
  answer_sources:
  - Mobile Device Management (MDM) Application Inventory Log
  - 'NAI: Mobile Device Management (MDM) server database; Cloud-hosted MDM administrative consoles; Corporate-managed
    iOS and Android devices.'
  range: Last 90 days; re-run on each app install/update
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each suspect_app, imitated = nearest_trusted(suspect_app):\n  baseline = imitated.dangerous_permission_set\n\
      \  scores = rank_permissions(suspect_app.manifest_permissions,\n                            method=FisherExact|mutual_information)\n\
      \  divergence = symmetric_diff(suspect_app.dangerous_permissions, baseline)\n  ALERT IF divergence\
      \ beyond baseline (e.g., SEND_SMS/RECEIVE_SMS/BIND_DEVICE_ADMIN)\n  EMIT alert WITH suspect_app.package_name,\
      \ imitated, divergence, top_scores"
- question: Does an explainable static classifier (Drebin-style linear SVM over permissions, components,
    intent filters, suspicious/restricted API calls, and embedded network strings) classify any installed
    app as masquerade above a tuned confidence (e.g., >0.90), and what are the top-3 contributing features?
  context: 'Single-feature rules miss combinations that individually look benign; a supervised static
    classifier captures them. Apply an explainable Drebin-style linear SVM over a joint vector space of
    requested permissions, declared components, intent filters, suspicious/restricted API calls, and network-address
    strings embedded in the APK. Flag apps classified as masquerade above a tuned confidence (e.g., >0.90)
    and, to satisfy the explainability requirement, emit the top-3 contributing features in the alert
    (e.g., ''requests SEND_SMS'', ''restricted API getDeviceId'', ''package-name entropy high''). Cross-check
    with permission-only RF/DNN models and account for concept drift via periodic retraining. For Defense
    Evasion this provides breadth against novel look-alikes; run it alongside the deterministic IOC/allowlist
    floor. References: [Drebin (Arp et al.)](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf)
    [Deep Learning for Android Malware Defenses (Liu et al.)](https://arxiv.org/abs/2103.05292) [SigPID-style](https://arxiv.org/abs/2103.00643)'
  answer_sources:
  - Mobile Device Management (MDM) Application Inventory Log
  - 'NAI: Mobile Device Management (MDM) server database; Cloud-hosted MDM administrative consoles; Corporate-managed
    iOS and Android devices.'
  range: Last 90 days; re-run on each app install/update
  queries:
  - technology: App-vetting/ML pseudocode
    query: "features = static_extract(apk:\n  permissions, components, intent_filters,\n  suspicious_restricted_api_calls,\
      \ embedded_network_strings)\np = Drebin_linear_SVM.predict_proba(features)\nWHEN p > 0.90:\n  EMIT\
      \ alert WITH package_name, p, top3_features\n# cross-check with permission-only RF/DNN; retrain\
      \ for concept drift\n# run alongside deterministic IOC/allowlist floor"
- question: Does a Siamese CNN that embeds rendered app display names (and optionally icons) place any
    installed app's name/icon within a learned distance of a trusted target while its signer is not allowlisted,
    and which legitimate app does it most resemble?
  context: 'Homoglyph and Unicode tricks (e.g., Cyrillic look-alike characters) and subtle icon spoofs
    defeat exact allowlists and even edit distance. Render each installed app''s display name (and optionally
    its icon) to an image and embed it with a Siamese CNN trained on genuine app names/icons; flag any
    string whose embedding is within a learned distance of a trusted target but whose signer is not allowlisted.
    The model outputs the nearest legitimate target as an explainable ''looks-like-<app>'' result, telling
    the analyst exactly which trusted brand is being impersonated. For Defense Evasion this catches the
    most deceptive visual spoofs that pure string and hash methods cannot. A positive result -- a name/icon
    embedding near a trusted app with a foreign signer -- is strong masquerade evidence. References: [Woodbridge
    et al.](https://arxiv.org/abs/1805.09738) [endgameinc/homoglyph](https://github.com/endgameinc/homoglyph)'
  answer_sources:
  - Mobile Device Management (MDM) Application Inventory Log
  - 'NAI: Mobile Device Management (MDM) server database; Cloud-hosted MDM administrative consoles; Corporate-managed
    iOS and Android devices.'
  range: Last 90 days; re-run on each app install/update
  queries:
  - technology: App-vetting/ML pseudocode
    query: "emb = SiameseCNN.embed(render(app.display_name) [, app.icon])\ntarget, dist = nearest_trusted_embedding(emb,\
      \ trusted_name_icon_embeddings)\nWHEN dist <= LEARNED_THRESHOLD AND app.signer_sha256 NOT IN allowlist.signer_sha256:\n\
      \  EMIT alert WITH app.package_name, looks_like=target, dist\n# catches homoglyph/unicode and icon\
      \ spoofs that defeat exact match + edit distance"
- question: For devices running a suspected masquerading app, does any DNS query match a malicious-domain
    feed or any TLS JA3 client hash match a malicious-JA3 feed in the Zeek logs filtered to those devices'
    IPs?
  context: 'Once MDM inventory identifies which devices run a suspected masquerading app, resolve those
    devices to their IP addresses and filter Zeek logs to that traffic. Join dns.log queries against a
    malicious-domain feed and ssl.log JA3 client hashes against a malicious-JA3 feed, raising a high-severity
    alert on any match. This identifier-to-device-to-traffic correlation turns a static suspicion into
    network-level confirmation. For Defense Evasion, a masquerading app reaching known-malicious domains
    or presenting a malware-associated TLS fingerprint confirms the disguise hides real malicious activity.
    A positive result is high-confidence command-and-control or exfiltration evidence; a negative result
    does not clear the app because new infrastructure will not be in any feed. References: [MITRE T1655.001](https://attack.mitre.org/techniques/T1655/001/)'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - Mobile Device Management (MDM) Application Inventory Log
  - 'NAI: Network egress points (Firewalls, Proxies), Corporate WiFi network segments, and VPN concentrators'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "device_ips = mdm_app_inventory[app == suspect].device_ip\nFROM dns.log WHERE id.orig_h IN\
      \ device_ips AND query IN ti_malicious_domains\n  EMIT severity=high WITH id.orig_h, query, ti_source\n\
      FROM ssl.log WHERE id.orig_h IN device_ips AND ja3 IN ti_malicious_ja3\n  EMIT severity=high WITH\
      \ id.orig_h, ja3, server_name"
- question: For a suspect app's traffic, is any DNS query domain above the 99th percentile of 30-day DNS
    entropy, any destination port outside the genuine app's profile, any outbound/inbound byte ratio or
    connections-per-minute beyond three standard deviations of baseline, or any elevated NXDOMAIN / S0
    / REJ / TLS-handshake-failure rate?
  context: 'Compare the suspect app''s network behavior to the baseline of the legitimate app it imitates
    across four signal classes. (1) In dns.log, compute Shannon entropy per queried domain and flag domains
    above the 99th percentile of 30-day organizational DNS entropy (DGA-like lookups). (2) In conn.log,
    build the genuine app''s destination-port profile and alert on any port outside it (State). (3) Compute
    outbound/inbound byte ratio (Volume) and connections-per-minute (Frequency), flagging deviations beyond
    three standard deviations of the legitimate baseline. (4) Profile failure modes explicitly -- NXDOMAIN
    rate, blocked/rejected S0/REJ connections, and TLS handshake failures -- as distinct signals, since
    masquerading C2 often beacons to dead or blocked infrastructure. For Defense Evasion, multiple concurrent
    outliers strongly indicate the look-alike is behaving unlike the app it impersonates. Derive all thresholds
    from the legitimate app''s own baseline. References: [MaMaDroid (Mariconti et al.)](https://arxiv.org/abs/1612.04433)'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - Mobile Device Management (MDM) Application Inventory Log
  - 'NAI: Network egress points (Firewalls, Proxies), Corporate WiFi network segments, and VPN concentrators'
  range: Last 90 days; baseline window 30 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: "device_ips = mdm_app_inventory[app == suspect].device_ip\ngenuine = baseline(imitated_app,\
      \ lookback=30d)\nFROM dns.log WHERE id.orig_h IN device_ips:\n  ALERT IF shannon_entropy(query)\
      \ > p99(org_dns_entropy_30d)\nFROM conn.log WHERE id.orig_h IN device_ips:\n  ALERT IF id.resp_p\
      \ NOT IN genuine.port_profile\n  ALERT IF orig_bytes/resp_bytes > genuine.byte_ratio_mean + 3*std\n\
      \  ALERT IF conn_per_min > genuine.freq_mean + 3*std\n  ALERT IF rate(conn_state IN ('S0','REJ'))\
      \ high OR tls_handshake_fail high\nFROM dns.log: ALERT IF rate(rcode=='NXDOMAIN') high\nEMIT alert\
      \ WITH id.orig_h, signal"
- question: Does an LSTM/autoencoder trained on the legitimate app's traffic produce a reconstruction
    error above the 99th-percentile training threshold for 5-minute Zeek-derived feature vectors of devices
    running the suspect app, and which top-3 features drive the error?
  context: 'An autoencoder captures the legitimate app''s normal multivariate traffic shape and flags
    deviations no single rule would catch. Train an LSTM/autoencoder on the genuine app''s traffic, then
    for each device running the suspect app build 5-minute feature vectors from Zeek logs (connection
    count, unique destination IPs, total bytes, out/in ratio, DNS query count, NXDOMAIN count). A reconstruction
    error above the 99th-percentile training threshold triggers an alert, and the alert must list the
    top-3 features driving the error for explainability. Complement with MaMaDroid Markov-chain behavioral
    classification of API/network behavior, and account for concept drift in deployment. For Defense Evasion
    this models the full behavioral fingerprint of the impersonated app so a look-alike that diverges
    -- even subtly across many features -- is surfaced. Keep the deterministic feed-match and percentile
    rules running as the floor. References: [Mariconti et al.](https://arxiv.org/abs/1612.04433) [Liu
    et al.](https://arxiv.org/abs/2103.05292)'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - Mobile Device Management (MDM) Application Inventory Log
  - 'NAI: Network egress points (Firewalls, Proxies), Corporate WiFi network segments, and VPN concentrators'
  range: Last 90 days; 5-minute feature windows
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = LSTM_Autoencoder.fit(legit_app_traffic, lookback=90d)\nFOR each device running suspect_app:\n\
      \  FOR each 5-min window:\n    v = features(conn.log,dns.log: conn_count, uniq_dst_ips, total_bytes,\n\
      \                 out_in_ratio, dns_query_count, nxdomain_count)\n    err = reconstruction_error(model,\
      \ v)\n    WHEN err > p99(training_error):\n      EMIT alert WITH device_ip, err, top3_features(err)\n\
      # complement with MaMaDroid Markov classification; watch concept drift"
- question: Does any candidate app's set of resource/asset file hashes (icons, layouts, drawables) exactly
    match a known-good app's resource hashes while its signer SHA-256 thumbprint differs from that genuine
    app's certificate?
  context: 'Repackaged clones preserve the original''s resources and assets but are re-signed with a different
    certificate. For each candidate app, hash its resource and asset files (icons, layouts, drawables)
    and exactly match the set against the genuine app''s resource hashes; if the resources match a known-good
    app but the signer SHA-256 differs, flag it as a repackaged clone. Resource-hash plus certificate-divergence
    matching is an established, robust pairwise signal, and integrity self-check primitives can corroborate
    tampering. For Defense Evasion this directly catches the copy-genuine-assets-but-resign pattern at
    the heart of look-alike repackaging. A positive result -- identical assets, different signer -- is
    strong, near-deterministic evidence of a repackaged masquerade. References: [Li et al., Rebooting
    Research on Detecting Repackaged Android Apps](https://arxiv.org/abs/1811.08520) [Merlo et al.](https://arxiv.org/abs/2009.04718)'
  answer_sources:
  - Mobile Device Management (MDM) Application Inventory Log
  - Application Vetting (static analysis of APK resources, manifest, and DEX)
  - 'NAI: MDM/EMM application repository and APK archive; application-vetting/sandbox pipeline; corporate-managed
    Android devices.'
  range: Last 90 days; re-run on each app install/update
  queries:
  - technology: App-vetting/Rule pseudocode
    query: "FOR each candidate IN app_vetting:\n  cand_hashes = set(hash(f) for f in candidate.resources_assets)\
      \  # icons, layouts, drawables\n  FOR each genuine IN allowlist:\n    IF cand_hashes == genuine.resource_hashes\n\
      \       AND candidate.signer_sha256 != genuine.signer_sha256:\n      EMIT alert(repackaged_clone)\
      \ WITH candidate.package_name, genuine.package_name"
- question: Does fuzzy hashing of DEX/opcode sequences and Jaccard similarity of resource-hash sets show
    any candidate app with high code/resource similarity to an allowlisted genuine app but a different
    signer certificate?
  context: 'An attacker may alter a clone enough that exact resource-hash matching fails, so measure approximate
    similarity. Compute pairwise similarity between the candidate and allowlisted genuine apps using fuzzy
    hashing (e.g., ssdeep/SDHash) of DEX/opcode sequences and Jaccard similarity of resource-hash sets;
    high code/resource similarity to a trusted app combined with a different signer indicates repackaging.
    Tune the similarity threshold on your own app corpus to balance detection against false positives.
    For Defense Evasion this catches clones that have been lightly modified or had payloads grafted in
    but still substantially overlap the genuine app. A positive result -- high similarity, foreign signer
    -- is strong repackaging evidence and a candidate for deeper static/dynamic vetting. References: [Li
    et al.](https://arxiv.org/abs/1811.08520)'
  answer_sources:
  - Mobile Device Management (MDM) Application Inventory Log
  - Application Vetting (static analysis of APK resources, manifest, and DEX)
  - 'NAI: MDM/EMM application repository and APK archive; application-vetting/sandbox pipeline; corporate-managed
    Android devices.'
  range: Last 90 days; re-run on each app install/update
  queries:
  - technology: App-vetting/Stats pseudocode
    query: "FOR each candidate, genuine IN allowlist:\n  code_sim = fuzzy_hash_sim(candidate.dex_opcode_seq,\
      \ genuine.dex_opcode_seq)\n  res_sim  = jaccard(candidate.resource_hashes, genuine.resource_hashes)\n\
      \  IF (code_sim > THRESH OR res_sim > THRESH)\n     AND candidate.signer_sha256 != genuine.signer_sha256:\n\
      \    EMIT alert WITH candidate.package_name, genuine.package_name, code_sim, res_sim\n# tune THRESH\
      \ on local app corpus"
- question: Does a behavioral classifier with active learning flag any app as piggybacked/repackaged malware
    -- a malicious segment grafted into a benign host -- and which contributing behavioral features support
    the verdict?
  context: 'The most sophisticated clones graft a malicious segment into an otherwise benign host app,
    which static similarity may under-detect. Train a classifier to detect piggybacked/repackaged malware
    whose malicious payload is grafted into a benign host, using active learning (the Aion approach) to
    request more accurate behavioral representations and generalize to novel clones, and surface the contributing
    behavioral features in the alert. Pair this with MaMaDroid behavioral modeling of API call transitions.
    For Defense Evasion this targets the grafted-payload variant of masquerading where the app looks and
    largely behaves like the genuine one until the injected segment activates. A positive verdict, with
    its explanatory behavioral features, identifies a clone that evaded static comparison and warrants
    removal and device investigation; retrain to counter drift. References: [Stimulation and Detection
    of Android Repackaged Malware with Active Learning (Salem et al.)](https://arxiv.org/abs/1808.01186)
    [Mariconti et al.](https://arxiv.org/abs/1612.04433)'
  answer_sources:
  - Mobile Device Management (MDM) Application Inventory Log
  - Application Vetting (static analysis of APK resources, manifest, and DEX)
  - 'NAI: MDM/EMM application repository and APK archive; application-vetting/sandbox pipeline; corporate-managed
    Android devices.'
  range: Last 90 days
  queries:
  - technology: App-vetting/ML pseudocode
    query: "clf = ActiveLearning_BehavioralClassifier(Aion).train(piggybacked_corpus)\nFOR each candidate:\n\
      \  behav = stimulate_and_observe(candidate)          # dynamic behavioral representation\n  label,\
      \ feats = clf.predict(behav, return_features=True)\n  WHEN label == 'piggybacked_repackaged':\n\
      \    EMIT alert WITH candidate.package_name, contributing_features=feats\n# pair with MaMaDroid\
      \ API-transition modeling; retrain to counter drift"
