name: 'T1655.001: Match Legitimate Name or Location'
id: 49a23db6-08a9-4f13-957a-f18c31483b35
description: 'Investigate whether an adversary is masquerading malicious mobile applications as legitimate,
  trusted apps on corporate-managed iOS and Android devices to evade detection (MITRE ATT&CK T1655.001,
  Match Legitimate Name or Location). Attackers give a malicious app the package name, display name, and
  launcher icon of a trusted application (e.g., a fake ''Settings'' or com.google.android.gm), and frequently
  repackage a genuine app -- preserving its resources and look-and-feel -- while re-signing it with a
  different certificate and grafting in a payload. This playbook helps an analyst pursue three overlapping
  evidence trails: (1) application identity and signer analysis from MDM/EMM inventory -- matching package
  names and signer SHA-256 thumbprints to threat-intel IOCs and a trusted allowlist, detecting signer
  fan-out and typosquatting, scoring icon/name visual similarity (perceptual hashing, Siamese networks),
  profiling permission deviation, and classifying masquerade apps from manifest features; (2) anomalous
  network behavior of a suspect app versus the baseline of the app it imitates -- malicious DNS/JA3 matches,
  DNS entropy, unusual ports, volume/frequency outliers, and failure-state (NXDOMAIN, S0/REJ) beaconing
  signals from Zeek logs, plus autoencoder-based traffic modeling; and (3) repackaging/clone analysis
  -- resource/asset hash matching with certificate divergence, fuzzy-hash code similarity, and behavioral
  classification of grafted (piggybacked) payloads. Each trail offers symbolic-logic, statistical, and
  machine-learning approaches so an analyst can confirm whether an installed app is impersonating a trusted
  application to evade defenses.'
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
