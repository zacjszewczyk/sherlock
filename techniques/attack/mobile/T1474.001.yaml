name: 'T1474.001: Compromise Software Dependencies and Development Tools'
id: 712c0620-d947-40d8-baea-54dec0c1869e
description: 'Investigate T1474.001 Compromise Software Dependencies and Development Tools, where an adversary
  injects malicious code into the third-party libraries or build/CI tooling that underpin the organization''s
  mobile applications, so that the trojanized app ships to users through an expected, trusted distribution
  path. This playbook helps an analyst hunt the technique across three vantage points: (1) anomalous network
  behavior from managed mobile apps - IOC infrastructure matches, DGA-like high-entropy domains, per-app
  egress and rare-JA3/certificate-issuer outliers, elevated connection failure rates, and unsupervised
  session anomalies indicative of injected-dependency C2; (2) suspicious developer-workstation and CI/CD
  build-server activity - dev tools (gradle, xcodebuild, MSBuild, npm) spawning scripting interpreters
  with encoded/download arguments, dependency/lockfile tampering, signed-parent/unsigned-child process
  lineage, dev-tool connections to newly registered domains, and classified suspicious build sessions;
  and (3) post-install/post-update behavioral drift on managed Android and iOS devices - first-seen sensitive
  OS API and permission/entitlement use, background activation without user interaction, and sensitive-data
  taint flows to network sinks. It supports a threat model of a sophisticated external actor performing
  a supply-chain compromise under TA0027 Initial Access, while remaining realistic for commodity malware
  and insider tampering, drawing on Zeek/PCAP network telemetry, Windows/Sysmon endpoint logs, and MDM/Mobile-EDR
  mobile telemetry.'
type: technique
related:
- tactic_id: TA0027
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Is any managed mobile application communicating with infrastructure (IP, domain, SSL/TLS certificate
    serial, or JA3/JA3S/JA4 fingerprint) that appears on curated threat-intelligence feeds, or presenting
    un-approved User-Agent strings and ad/dependency redirect chains with brand/landing-domain mismatch?
  context: 'A trojanized dependency or manipulated build output most often reveals itself on the wire
    by beaconing to attacker infrastructure. Correlate Zeek conn/dns/ssl/http logs and MDM-proxied traffic
    against threat-intelligence indicators and alert when a mobile app reaches a known-bad domain/IP,
    TLS certificate serial, or JA3/JA4 fingerprint - the canonical mobile precedent being XcodeGhost,
    whose injected build-time code beaconed device metadata to init.icloud-analysis.com. Also flag HTTP
    User-Agent strings absent from an approved list for common libraries, and ad/dependency delivery that
    exhibits long redirect chains or brand/landing-domain mismatch. A positive hit is a high-confidence
    indicator of supply-chain C2 and warrants immediate device isolation and app forensics; a negative
    result shifts attention to the behavioral/statistical methods. Tie findings to TA0027 Initial Access:
    a compromised dependency gives the adversary a foothold on the device the moment the trusted app runs.'
  answer_sources: &id001
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - MDM application inventory logs
  - Threat intelligence indicators
  - 'NAI: Corporate Wi-Fi network gateways, VPN concentrators, and Mobile Device Management (MDM) platforms
    monitoring mobile device traffic.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'app_flows = JOIN zeek_conn/dns/ssl/http WITH mdm_app_inventory ON device+app

      ti = load_threat_intel([domain, ip, cert_serial, ja3, ja3s, ja4])

      ALERT where app_flows MATCH ti

      ALERT where http.user_agent NOT IN approved_library_ua

      ALERT where redirect_chain_len > N OR brand_domain != landing_domain

      OUTPUT device, app_package, dst, indicator_type, ti_source'
- question: For each mobile application, do daily egress volume, DNS query name entropy, or JA3/certificate-issuer
    prevalence deviate from that app's own 30-day baseline strongly enough to accumulate a risk score
    above a tuned threshold?
  context: 'Injected dependencies frequently change an app''s network statistical profile even when no
    single connection is overtly malicious. Build 30-day per-app baselines for daily egress bytes, DNS
    query-name entropy/character-count, and JA3/certificate-issuer fleet prevalence, then add risk points
    when egress exceeds the 95th percentile (Volume), DNS name entropy or character count exceeds three
    standard deviations (DGA-like behavior), or the JA3/issuer falls in the bottom 1% of fleet prevalence
    (rare crypto stack). Alert when the cumulative score crosses a per-fleet threshold derived from the
    empirical distribution. This catches stealthy exfiltration and novel C2 that evade static IOCs. Tie
    findings to TA0027 Initial Access: a successful supply-chain implant alters the trusted app''s outbound
    behavior the moment it activates on the device.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = per_app_30d([egress_bytes, dns_name_entropy, ja3_prevalence, issuer_prevalence])

      score = 0

      score += w1 if daily_egress > p95(baseline.egress)

      score += w2 if dns_name_entropy > mean+3*std(baseline.entropy)

      score += w3 if ja3_or_issuer_prevalence <= fleet_p01

      ALERT where score >= tuned_threshold

      OUTPUT app_package, contributing_metrics, score'
- question: Does a single mobile application show a per-hour rate of failed connections - NXDOMAIN responses,
    failed TLS handshakes, blocked/refused connections, and HTTP 404/5xx - that exceeds three standard
    deviations over its 30-day baseline?
  context: 'Dead-drop resolvers and staged C2 retrieval by an injected dependency produce a distinctive
    failure signature: the app repeatedly probes infrastructure that is not yet live, has rotated, or
    rejects unauthenticated callers. Treat error/failure rates as signals distinct from successful traffic
    - track per-app NXDOMAIN counts, failed TLS handshakes, blocked/refused connections, and HTTP 404/5xx
    per hour, and alert when one app''s failure rate exceeds three standard deviations over its 30-day
    baseline. A sustained failure spike from an otherwise reputable app suggests a dormant or rotating
    C2 channel introduced through the supply chain. Tie findings to TA0027 Initial Access: failed-connection
    bursts often precede successful adversary access as the implant searches for its live controller.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'fails = per_app_per_hour(count nxdomain + failed_tls + refused_conn + http_4xx_5xx)

      baseline = per_app_30d_failrate

      ALERT where fails > mean+3*std(baseline)

      OUTPUT app_package, hour, failure_breakdown'
- question: Do unsupervised anomaly models over per-session Zeek features (duration, bytes, byte ratios,
    DNS query length, certificate validity period, server-name length) flag high reconstruction-error
    or outlier mobile sessions as potential malicious C2, with the top contributing features emitted for
    triage?
  context: 'Supply-chain implants produce novel C2 patterns that signatures and per-metric thresholds
    miss, so train an Isolation Forest or online autoencoder ensemble (e.g., Kitsune) over per-session
    Zeek features - duration, bytes, byte ratios, DNS query length, certificate validity period, server-name
    length - and flag high reconstruction-error or outlier sessions. Prefer one-class models for adversarial
    robustness, and emit the top-3 contributing features (e.g., egress ratio, query length, cert validity)
    using LIME-style attribution so an analyst can act on the alert. Compare against per-host HTTP fingerprint
    baselines (DECANTeR) to expose unknown backdoors. A flagged session that also overlaps with a recent
    app update is strong evidence of a compromised dependency. Tie findings to TA0027 Initial Access:
    unsupervised detection surfaces the first beacons of an implant that arrived inside a trusted app.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: 'feats = per_session_features([duration, bytes, byte_ratio, dns_qlen, cert_validity, sni_len])

      model = isolation_forest_or_autoencoder(one_class=true)

      score = model.score(feats)

      explain = top3_features(score)  # LIME-style attribution

      ALERT where score > anomaly_threshold

      OUTPUT session, app_package, explain'
- question: Are development tools (xcodebuild, gradle.bat, MSBuild.exe, npm.cmd) spawning scripting interpreters
    with encoded or download-related command-line arguments, or are signed development tools spawning
    unsigned child processes - especially during install-time/package-lifecycle execution or lockfile
    tampering?
  context: 'A core path to a poisoned mobile build is malicious code executed during dependency resolution
    or the build itself. Alert when development tools spawn scripting interpreters (powershell.exe, cmd,
    bash) with encoded/download arguments, correlate with PowerShell Script Block (Event ID 4104) logs,
    and flag signed parent processes spawning unsigned children. Treat install-time/package-lifecycle
    hooks and lockfile tampering as high-signal, consistent with the documented supply-chain payload taxonomy
    (Backstabber''s Knife Collection). A positive result on a developer endpoint or CI/CD host means attacker
    code may already be baked into build artifacts and demands artifact quarantine and pipeline review.
    Tie findings to TA0027 Initial Access: compromising the build tool lets the adversary ride a trusted,
    signed app onto every downstream device.'
  answer_sources: &id002
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 3
  - Windows Sysmon Event ID 11
  - Zeek conn.log
  - Zeek dns.log
  - Threat intelligence indicators
  - 'NAI: Developer endpoints and continuous integration/continuous delivery (CI/CD) build servers within
    the corporate network.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ALERT FROM proc_creation (4688/Sysmon1) WHERE\n  parent_image IN [xcodebuild, gradle.bat,\
      \ MSBuild.exe, npm.cmd, node, java]\n  AND child_image IN [powershell.exe, cmd.exe, bash, sh, curl,\
      \ wget]\n  AND cmdline MATCH [base64, -enc, IEX, DownloadString, Invoke-WebRequest]\nALERT where\
      \ parent_signed=true AND child_signed=false\nENRICH with Sysmon11 lockfile writes during package_lifecycle\n\
      JOIN Sysmon4104 ON host FOR script_block_context"
- question: Do resolved dependency artifacts in the build differ from known-good library code when compared
    with clone/code-similarity detection, indicating injected or mismatched code regions that hash- or
    coordinate-based identification would miss?
  context: 'Adversaries evade software-composition analysis by cloning, shading, and bytecode-rewriting
    libraries so that names, versions, and hashes still appear legitimate. Because hash/coordinate identification
    fails against these techniques, compare resolved dependency artifacts against a trusted known-good
    corpus using clone/similarity detection and alert on injected or mismatched code regions (per Dietrich
    et al. on SCA blind spots). A flagged artifact that resolves to a trusted coordinate but contains
    divergent code is a direct indicator of dependency tampering and should block the build pending review.
    Tie findings to TA0027 Initial Access: code-level tampering of a dependency is the precise mechanism
    by which the adversary gains initial access through a trusted app.'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: Build/Code-similarity pseudocode
    query: "for artifact in resolved_dependencies(build):\n  ref = known_good_corpus(artifact.coordinate)\n\
      \  sim = clone_similarity(artifact.code, ref.code)\n  injected = diff_regions(artifact, ref)\n \
      \ ALERT where sim < threshold OR injected not empty\n  OUTPUT coordinate, similarity, injected_regions"
- question: Against 30-day baselines of parent-child process relationships and per-tool command-line entropy/length,
    are dev tools producing unseen child processes, command lines exceeding three standard deviations,
    connections to domains registered within the last 30 days, or spikes in failed downloads from a build
    host?
  context: 'Statistical baselining of developer and CI/CD behavior surfaces tampering that no single rule
    anticipates. Maintain 30-day baselines of parent-child process relationships and command-line entropy/length
    per dev tool; alert on previously unseen child processes or command-line entropy/length greater than
    three standard deviations (encoded/packed payload indicator), flag dev-tool network connections to
    domains registered within the last 30 days (newly-registered-domain heuristic), and treat spikes in
    failed downloads (HTTP 404/5xx, NXDOMAIN, blocked connections) from a build host as a distinct staged-payload
    signal. Convergence of these on a build host indicates an active compromise of the toolchain. Tie
    findings to TA0027 Initial Access: anomalous build-host behavior is an early warning that the adversary
    is staging the implant before it reaches users.'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = per_tool_30d([parent_child_pairs, cmdline_entropy, cmdline_len])

      ALERT where child_process NOT IN baseline.parent_child_pairs

      ALERT where cmdline_entropy OR cmdline_len > mean+3*std(baseline)

      ALERT where dev_tool_connects domain WITH reg_age < 30d

      ALERT where failed_download_rate(host) spikes  # 404/5xx, nxdomain, blocked

      OUTPUT host, tool, anomaly_type'
- question: Does a supervised classifier over 5-minute build sessions - using child-process count, command-line
    entropy, network-connection count, newly registered destinations, and dependency-file modifications
    - flag a build session as suspicious, with the top-3 contributing features emitted for analyst triage?
  context: 'Individual build events may be benign while their combination is malicious, so train a supervised
    classifier over 5-minute build sessions using features such as child-process count, command-line entropy,
    network-connection count, newly registered destination count, and dependency-file modification count.
    Train and validate against curated malicious-package corpora (Backstabber''s Knife Collection dataset)
    and emit the top-3 contributing features in the alert (after Drebin-style explainability) so analysts
    can triage quickly. A session classified as malicious on a developer or CI/CD host is strong evidence
    the build is being weaponized and should halt promotion of its artifacts. Tie findings to TA0027 Initial
    Access: catching a malicious build session prevents the adversary''s implant from ever reaching a
    trusted app store path.'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: 'sessions = window_build_events(5m, by=host)

      feats = [child_proc_count, cmdline_entropy, net_conn_count, new_reg_dest_count, depfile_mods]

      model = supervised_classifier(trained_on=malicious_package_corpus)

      pred = model.predict(feats)

      explain = top3_features(pred)

      ALERT where pred = malicious

      OUTPUT host, session_window, explain'
- question: After a known mobile app installs or updates, does it gain or first exercise a sensitive permission/entitlement
    or sensitive OS API without a business-justified change, activate a background service or foreground
    without recent user interaction, or show taint flows from privacy-sensitive sources (IMEI, location,
    contacts) to network sinks?
  context: 'Compromised third-party libraries and manipulated build tooling leave runtime fingerprints
    when a previously trusted app suddenly behaves differently after a version change. Maintain a per-package,
    per-version manifest of declared permissions/entitlements and observed sensitive OS API use (accessibility,
    content providers, dynamic code loading, account services, WebView bridges, crypto/network APIs);
    alert when a known app gains or first exercises a sensitive permission/API after an update without
    a corresponding business-justified change, or activates a background service / foregrounds without
    recent user interaction immediately after the update. Treat taint flows from privacy-sensitive sources
    to network sinks (TaintDroid-style) as a direct exfiltration alert. Tie findings to TA0027 Initial
    Access: post-update capability drift in a trusted app is the observable consequence of a dependency-level
    compromise granting the adversary access to device data.'
  answer_sources: &id003
  - android:MDMLog
  - iOS:MDMLog
  - MobileEDR:telemetry
  - Application Permission
  - Application State
  - OS API Execution
  - 'NAI: Mobile Device Management (MDM) platforms and Mobile EDR/UEM telemetry on managed Android and
    iOS devices, captured across app install/update events.'
  range: Last 90 days; center analysis on app install/update events
  queries:
  - technology: MDM/MobileEDR rule pseudocode
    query: "manifest = per_package_per_version(declared_perms, entitlements, observed_apis)\nALERT where\
      \ app_version_change AND (new_sensitive_perm OR first_seen_sensitive_api)\n  AND NOT business_justified_change\n\
      ALERT where background_service_start OR foreground WITH no_recent_user_interaction\nALERT where\
      \ taint_flow(source IN [imei, location, contacts] -> sink = network)\nOUTPUT device, app_package,\
      \ version, drift_detail"
- question: For a given app, do per-session counts of sensitive API calls, permission exercises, background-wake
    frequency, and post-launch network connections exceed three standard deviations of the prior-version
    baseline after a version change, and are new failure signals (permission denials, blocked API calls)
    appearing?
  context: 'Quantify behavioral drift by building, for each app, a baseline distribution over per-session
    counts of sensitive API calls, permission exercises, background-wake frequency, and post-launch network
    connection counts. After a version change, alert when these Volume/Frequency metrics exceed three
    standard deviations of the prior-version baseline, and profile new failure signals - permission denials
    and blocked API calls - as distinct indicators that the app is attempting capabilities it did not
    previously use. A statistically significant jump immediately following an update points to injected
    functionality from a compromised dependency rather than normal feature evolution. Tie findings to
    TA0027 Initial Access: measurable behavioral escalation right after an update is how a supply-chain
    implant manifests on the managed fleet.'
  answer_sources: *id003
  range: Last 90 days; compare prior-version vs post-update windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = prior_version_per_session([sensitive_api_count, perm_exercise_count, bg_wake_freq,
      post_launch_conn_count])

      post = post_update_per_session(metrics)

      ALERT where any(post.metric > mean+3*std(baseline.metric))

      ALERT where new_perm_denials OR blocked_api_calls appear

      OUTPUT app_package, version, deviating_metrics'
- question: Does a Markov-chain model of abstracted API-call transitions (or an explainable static classifier
    over permissions, components, suspicious API calls, and embedded URLs) classify an app's post-update
    behavior as matching malicious patterns, with the top-3 contributing features emitted?
  context: 'To detect malicious behavior robust to API churn and obfuscation, model the app''s behavior
    as a Markov chain of abstracted API-call transitions and classify whether post-update behavior matches
    known malicious patterns (MaMaDroid). Alternatively, apply an explainable static classifier over permissions,
    components, suspicious API calls, and embedded URLs (Drebin) that surfaces the top contributing features
    per app. Emit the top-3 contributing features (e.g., new SEND_SMS use, reflection API, first-seen
    C2 URL) in the alert so analysts can validate and respond. A malicious classification on a freshly
    updated, previously trusted app strongly implicates a compromised dependency or build tool. Tie findings
    to TA0027 Initial Access: behavioral classification catches the implant''s intent even when the adversary
    obfuscates the injected code that granted them access.'
  answer_sources: *id003
  range: Last 90 days; evaluate each post-update behavior window
  queries:
  - technology: ML pipeline pseudocode
    query: 'seq = abstract_api_call_transitions(app_runtime)

      markov_pred = markov_chain_classifier(seq)  # MaMaDroid

      static_pred = drebin_classifier([permissions, components, susp_apis, embedded_urls])

      explain = top3_features(static_pred)

      ALERT where markov_pred = malicious OR static_pred = malicious

      OUTPUT app_package, version, prediction, explain'
