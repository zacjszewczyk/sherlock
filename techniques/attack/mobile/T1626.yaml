name: 'T1626: Abuse Elevation Control Mechanism'
id: 5029f442-502c-45ef-8431-d13956c07c59
description: Investigate whether an adversary is abusing native elevation-control mechanisms on managed
  Android mobile devices to escalate privileges, principally by coercing or clickjacking the system consent
  flows that gate high-risk capabilities such as Device Administrator (BIND_DEVICE_ADMIN), Accessibility
  Service (BIND_ACCESSIBILITY_SERVICE), screen overlays (SYSTEM_ALERT_WINDOW), and package installation
  (REQUEST_INSTALL_PACKAGES). This playbook helps an analyst hunt for elevation-control grants to applications
  that are not on a curated corporate allowlist or are statistically rare across the fleet, manifests
  that combine high-risk permissions with restricted UI-automation or installer APIs, and the Cloak-and-Dagger
  primitive in which an app concurrently holds overlay and accessibility privileges to silently auto-grant
  further permissions. It correlates grant events with downstream network behavior (IOC matches, high-entropy
  DNS, byte/connection-state outliers, and modeled time-series anomalies) and with device-side failure
  signals such as denied or re-prompted permission requests and resistance to device-admin removal or
  uninstall. The guidance layers deterministic symbolic-logic rules, statistical baselining, and explainable
  machine-learning detectors (logistic regression / linear SVM, LSTM autoencoders, Markov/Random-Forest
  sequence models, information-flow tracking, and semi-supervised behavioral models) so that detection
  of privilege-escalation abuse never depends on a single method and every alert surfaces explainable
  drivers for fast SOC triage.
type: technique
related:
- tactic_id: TA0029
  tactic_name: Privilege Escalation
contributors:
- Zachary Szewczyk
