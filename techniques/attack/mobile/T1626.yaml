questions:
- question: Did any application that is absent from the curated corporate allowlist receive a Device Administrator
    (BIND_DEVICE_ADMIN) or Accessibility Service (BIND_ACCESSIBILITY_SERVICE) privilege grant on a managed
    device?
  context: 'In the Privilege Escalation tactic, the cleanest deterministic signal of elevation-control
    abuse is a high-risk grant going to software that should never have it. Google Play policy restricts
    accessibility use to genuine assistive purposes and corporate policy normally limits device-admin
    and accessibility apps to a small, vetted set, so a grant to a package ID that is not on the approved
    allowlist violates the normative baseline and is inherently suspicious. Build a high-severity rule
    that fires on any ''Device Administrator Granted'' or ''Accessibility Service Enabled'' event where
    the package ID is not in the allowlist. A positive result is high-confidence and should drive immediate
    triage of the app and device; a negative result does not clear the device because an attacker could
    abuse an already-allowlisted but vulnerable app. Citations: [Use of the Accessibility API, Google
    Play Policy](https://support.google.com/googleplay/android-developer/answer/10964491); [Abuse Elevation
    Control Mechanism (T1626), MITRE ATT&CK](https://attack.mitre.org/techniques/T1626/).'
  answer_sources:
  - MDM device administrator event logs
  - MDM accessibility service grant logs
  - MDM application inventory report
  - Corporate app store metadata
  - APK signer/permission metadata
  - 'NAI: Centralized MDM/EMM log platform, Corporate Application Store database, and the population of
    managed mobile devices.'
  range: Last 90 days, with real-time alerting on any non-allowlisted grant.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'alert when event in [''DeviceAdminGranted'',''AccessibilityServiceEnabled''] and package_id
      not in approved_allowlist;


      severity = high;


      output device_id, package_id, event, signer, timestamp.'
- question: Do any installed APKs declare a dangerous combination of elevation permissions (BIND_ACCESSIBILITY_SERVICE,
    SYSTEM_ALERT_WINDOW, BIND_DEVICE_ADMIN, or REQUEST_INSTALL_PACKAGES) together with restricted installer
    or UI-automation API references?
  context: 'A static pre-screen of the application manifest and referenced APIs deterministically flags
    apps that are tooled for elevation-control abuse before any grant occurs, supporting Privilege Escalation
    detection at install time. Using the manifest-plus-API feature screen from the Drebin work, parse
    each APK''s manifest for high-risk permissions and cross-reference its code for restricted/suspicious
    installer or UI-automation API references (e.g., package-installer flows, dispatchGesture, performGlobalAction).
    An app that requests accessibility or device-admin power and also carries package-install or UI-automation
    capability matches the tradecraft of T1626 abuse. A match warrants deeper review and possible blocking;
    a clean screen lowers but does not eliminate suspicion, since obfuscated or dynamically loaded code
    can hide such references. Citations: [Drebin, Arp et al.](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf).'
  answer_sources:
  - MDM device administrator event logs
  - MDM accessibility service grant logs
  - MDM application inventory report
  - Corporate app store metadata
  - APK signer/permission metadata
  - 'NAI: Centralized MDM/EMM log platform, Corporate Application Store database, and the population of
    managed mobile devices.'
  range: Last 90 days, re-evaluated on every new app install or app update.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each installed_apk:\n  perms = manifest.permissions;\n  flag = ('BIND_ACCESSIBILITY_SERVICE'\
      \ in perms or 'SYSTEM_ALERT_WINDOW' in perms or\n          'BIND_DEVICE_ADMIN' in perms or 'REQUEST_INSTALL_PACKAGES'\
      \ in perms)\n         and api_refs intersects restricted_installer_or_ui_automation_apis;\nalert\
      \ when flag; output package_id, perms, matched_apis."
- question: Was an elevation-control grant made to an application whose prevalence across the managed
    fleet is in the bottom 5th percentile, or whose signer has low reputation?
  context: 'Legitimate accessibility and device-admin apps are few and widely deployed, so an elevation
    grant involving a rare app is statistically anomalous and a strong Privilege Escalation indicator.
    Compute daily app prevalence across the fleet from the MDM inventory and alert when a grant involves
    an app below the 5th percentile of prevalence or signed by a low-reputation signer. Derive percentile
    and signer baselines from the managed inventory and external population corpora such as AndroZoo,
    and tune the percentile cutoff to your fleet''s app diversity. A grant to a bottom-percentile or low-reputation
    app should be escalated; widespread, well-signed apps are comparatively low risk for this signal alone.
    Citations: [AndroZoo, Allix et al.](https://androzoo.uni.lu/).'
  answer_sources:
  - MDM device administrator event logs
  - MDM accessibility service grant logs
  - MDM application inventory report
  - Corporate app store metadata
  - APK signer/permission metadata
  - 'NAI: Centralized MDM/EMM log platform, Corporate Application Store database, and the population of
    managed mobile devices.'
  range: Last 90 days, with daily fleet-wide prevalence computation.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'daily: prevalence[app] = count(devices with app) / total_devices;


      p5 = percentile(prevalence, 5);


      on grant event: alert when prevalence[package_id] < p5 or signer_reputation(package_id) == low;


      output device_id, package_id, prevalence, signer_reputation.'
- question: When an explainable linear model (logistic regression or linear SVM) scores an elevation grant,
    does the malicious probability exceed 0.85, and which features drove the score?
  context: 'An explainable machine-learning layer generalizes beyond fixed rules while keeping verdicts
    auditable, which is essential when accusing an app of Privilege Escalation. Train a logistic regression
    or linear SVM (per the Drebin approach) on features such as app prevalence, app age, requested-permission
    count, restricted-API presence, signer reputation, and app-store source. Alert when the model''s malicious
    probability exceeds 0.85 and include the top-3 contributing features (e.g., BIND_ACCESSIBILITY_SERVICE
    present, package-installer API referenced, low prevalence) in the alert text so an analyst can immediately
    judge plausibility. A high-probability score with intuitive drivers warrants investigation; the linear,
    explainable design avoids opaque verdicts and supports tuning against false positives. Citations:
    [Drebin, Arp et al.](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf).'
  answer_sources:
  - MDM device administrator event logs
  - MDM accessibility service grant logs
  - MDM application inventory report
  - Corporate app store metadata
  - APK signer/permission metadata
  - 'NAI: Centralized MDM/EMM log platform, Corporate Application Store database, and the population of
    managed mobile devices.'
  range: Last 90 days for scoring, with periodic retraining on labeled grant data.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [prevalence, app_age, perm_count, restricted_api_present, signer_reputation, store_source];


      p = LogisticRegression_or_LinearSVM.predict_proba(features);


      alert when p > 0.85;


      output device_id, package_id, p, top3_features.'
- question: Within 5 minutes of an elevation-control grant, did the device contact an IP address or domain
    that matches a threat-intelligence indicator?
  context: 'Banking-trojan and ransomware families that abuse Device Admin or Accessibility typically
    pivot quickly to command-and-control or exfiltration, so correlating a fresh grant with malicious
    network destinations ties the Privilege Escalation event to concrete adversary infrastructure. Join
    Device Administrator / Accessibility grant events to Zeek conn.log and dns.log within a 5-minute window
    and alert when the destination IP or domain matches threat-intelligence indicators. The CICAndMal2017
    ransomware/scareware families exhibit exactly this post-grant C2 behavior. A match is high-confidence
    evidence of an active compromise and should trigger device isolation; no match does not exonerate
    the grant, as the C2 may be dormant or use unknown infrastructure. Citations: [CICAndMal2017, Canadian
    Institute for Cybersecurity](https://www.unb.ca/cic/datasets/andmal2017.html).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - MDM device administrator event logs
  - MDM accessibility service grant logs
  - Threat intelligence indicators
  - 'NAI: Network TAPs or switch SPAN ports feeding Zeek sensors at the network egress, centralized DNS
    server logs, and the centralized MDM/EMM log platform.'
  range: Last 90 days, correlating grant events with network logs in a 5-minute window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'join grant_events G with zeek_conn/zeek_dns N on device_id where N.ts between G.ts and G.ts+5min;


      alert when N.dest_ip in ti_indicators or N.query_domain in ti_indicators;


      output device_id, package_id, dest_ip, query_domain, G.ts, N.ts.'
- question: In the 5 minutes after an elevation-control grant, did the device exhibit DNS query entropy
    above 4.5, outbound bytes above the 99th percentile of its 30-day baseline, or a spike in blocked/failed
    connections?
  context: 'Post-grant network anomalies betray the exfiltration or C2 activity that follows privilege
    escalation even when the destination is not yet a known indicator, making statistical profiling a
    key complement in the Privilege Escalation tactic. After a grant event, alert when DNS query entropy
    exceeds 4.5 (suggesting DGA-style domains), outbound bytes exceed the 99th percentile of the device''s
    own 30-day baseline, or the count of blocked/failed connections (NXDOMAIN, blocked conns) spikes within
    a 5-minute window. Treat the failure state as a distinct first-class signal and derive thresholds
    from per-device baselines and flow features as in CICAndMal2017. A breach of any threshold shortly
    after a grant warrants correlation with the grant and IOC checks; behavior within baseline supports
    a benign read. Citations: [CICAndMal2017, Canadian Institute for Cybersecurity](https://www.unb.ca/cic/datasets/andmal2017.html).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - MDM device administrator event logs
  - MDM accessibility service grant logs
  - Threat intelligence indicators
  - 'NAI: Network TAPs or switch SPAN ports feeding Zeek sensors at the network egress, centralized DNS
    server logs, and the centralized MDM/EMM log platform.'
  range: Last 90 days, with 5-minute post-grant windows over a 30-day per-device baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "on grant event G, window = [G.ts, G.ts+5min]:\n  dns_H = shannon_entropy(dns_queries in window);\n\
      \  out_bytes = sum(orig_bytes in window);\n  fail = count(conn_state in ['S0','REJ','RSTO'] or dns_rcode=='NXDOMAIN'\
      \ in window);\nbaseline = rolling_30d(device);\nalert when dns_H > 4.5 or out_bytes > p99(baseline.out_bytes)\
      \ or fail > p99(baseline.fail);\noutput device_id, dns_H, out_bytes, fail."
- question: Does an LSTM autoencoder trained on per-device network time-series flag elevated reconstruction
    error in the 10 minutes after an elevation-control grant, and which time-series features contributed?
  context: 'A sequence model captures subtle, multi-feature post-grant network deviations that fixed thresholds
    miss, strengthening Privilege Escalation detection. Train an LSTM autoencoder on per-device time-series
    metrics (outbound bytes, connection count, DNS rate, failed-connection rate) and alert when reconstruction
    error exceeds a dynamic threshold in the 10 minutes after a grant, surfacing the top contributing
    time-series features in the alert. Follow the architecture and drift/evaluation guidance from the
    deep-learning Android-malware-defense literature. A reconstruction-error spike concentrated right
    after a grant indicates anomalous burst behavior consistent with C2 or exfiltration and merits investigation;
    normal reconstruction supports a benign conclusion. Run it alongside the rule and statistical checks
    so detection never depends on a single method. Citations: [Deep Learning for Android Malware Defenses,
    Liu et al.](https://arxiv.org/abs/2103.05292).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - MDM device administrator event logs
  - MDM accessibility service grant logs
  - Threat intelligence indicators
  - 'NAI: Network TAPs or switch SPAN ports feeding Zeek sensors at the network egress, centralized DNS
    server logs, and the centralized MDM/EMM log platform.'
  range: Last 90 days, with 10-minute post-grant scoring and >=30 days of training history.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'series = per_minute([out_bytes, conn_count, dns_rate, failed_conn_rate]) per device;


      model = LSTM_Autoencoder(train>=30d);


      on grant G: err = reconstruction_error(series in [G.ts, G.ts+10min]);


      alert when err > dynamic_threshold;


      output device_id, err, top_contributing_features.'
- question: Does any single package concurrently hold both SYSTEM_ALERT_WINDOW (overlay) and BIND_ACCESSIBILITY_SERVICE,
    or was an accessibility grant immediately preceded by overlay rendering by the same app?
  context: 'The combination of overlay and accessibility permissions is the core Cloak-and-Dagger primitive
    that lets an app silently auto-grant further privileges and clickjack consent flows, making it a high-fidelity
    Privilege Escalation signal. Alert when one package holds both SYSTEM_ALERT_WINDOW and BIND_ACCESSIBILITY_SERVICE,
    or when an accessibility grant is immediately preceded by overlay rendering from the same app, per
    the Cloak-and-Dagger research and the overlay-deception API patterns catalogued in UI-deception studies.
    Because legitimate apps rarely need both, a concurrent hold is strongly suspicious and should be triaged
    urgently; the overlay-then-grant sequence is even more indicative of an active clickjacking attack.
    Citations: [Cloak and Dagger, Fratantonio et al.](http://cloak-and-dagger.org/); [What the App is
    That?, Bianchi et al.](https://sites.cs.ucsb.edu/~chris/research/doc/oakland15_uideception.pdf).'
  answer_sources:
  - MobileEDR:telemetry
  - MDM application permission logs
  - OS API execution telemetry (Accessibility events, dispatchGesture/performGlobalAction)
  - Window manager / overlay state
  - 'NAI: Mobile EDR/agent telemetry on the device, centralized MDM/EMM permission logs, and OS API-execution
    traces.'
  range: Last 90 days, with real-time alerting on concurrent or sequential overlay+accessibility.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'alert when package holds {''SYSTEM_ALERT_WINDOW'',''BIND_ACCESSIBILITY_SERVICE''} concurrently;


      or when overlay_render(package) immediately_precedes accessibility_grant(package);


      output device_id, package_id, perms_held, overlay_ts, grant_ts.'
- question: Did an accessibility service call performGlobalAction or dispatchGesture, subscribe to events
    across all packages, or read getRootInActiveWindow against a system permission/consent dialog within
    seconds of a grant and with no corresponding user touch event?
  context: 'Synthetic gestures or global actions directed at system consent dialogs without genuine user
    input are the mechanical signature of automated consent abuse used to escalate privileges. Alert when
    an accessibility service invokes performGlobalAction or dispatchGesture, subscribes to events across
    all packages, or reads getRootInActiveWindow targeting a system permission/consent dialog within seconds
    of a grant and absent a corresponding user touch event, per the AccessibilityService API documentation.
    The absence of a hardware touch event correlated with a UI action that approves a dialog is the key
    tell. A positive result is strong evidence of clickjacked consent and warrants immediate response;
    legitimate accessibility tools act in response to real user interaction. Citations: [AccessibilityService
    API, Google Developers](https://developer.android.com/guide/topics/ui/accessibility/service).'
  answer_sources:
  - MobileEDR:telemetry
  - MDM application permission logs
  - OS API execution telemetry (Accessibility events, dispatchGesture/performGlobalAction)
  - Window manager / overlay state
  - 'NAI: Mobile EDR/agent telemetry on the device, centralized MDM/EMM permission logs, and OS API-execution
    traces.'
  range: Last 90 days, correlated against touch-input telemetry within seconds of each grant.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "on accessibility_api_call C in {performGlobalAction, dispatchGesture, getRootInActiveWindow,\
      \ subscribe_all_packages}:\n  near_grant = exists grant within seconds(C.ts);\n  target_sysdialog\
      \ = C.target in system_permission_consent_dialogs;\n  user_touch = exists touch_event within window(C.ts);\n\
      alert when near_grant and target_sysdialog and not user_touch;\noutput device_id, package_id, api_call,\
      \ target, C.ts."
- question: For each device, does the per-device permission-grant frequency or accessibility-event/auto-click
    rate spike into a burst above its baseline, indicating automated consent abuse?
  context: 'Automated consent abuse produces bursts of grants and accessibility events in a short window
    that stand out from a human''s measured interaction, a statistical signature of Privilege Escalation.
    Profile per-device permission-grant frequency and accessibility-event rates and alert on grant bursts
    (multiple high-risk grants within minutes) or auto-click rates exceeding the device baseline, the
    pattern described in the Cloak-and-Dagger research. Derive burst thresholds from fleet baselines.
    A sudden cluster of high-risk grants or an abnormally high auto-click rate is consistent with scripted
    consent manipulation and warrants investigation; rates within baseline reflect normal use. Citations:
    [Cloak and Dagger, Fratantonio et al.](http://cloak-and-dagger.org/).'
  answer_sources:
  - MobileEDR:telemetry
  - MDM application permission logs
  - OS API execution telemetry (Accessibility events, dispatchGesture/performGlobalAction)
  - Window manager / overlay state
  - 'NAI: Mobile EDR/agent telemetry on the device, centralized MDM/EMM permission logs, and OS API-execution
    traces.'
  range: Last 90 days, with minute-scale burst windows over per-device and fleet baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per device: grant_rate = count(high_risk_grants per 5min);

      click_rate = count(accessibility_auto_clicks per min);

      baseline = fleet_and_device_baseline(device);

      alert when grant_rate > baseline.burst_threshold or click_rate > baseline.click_threshold;

      output device_id, grant_rate, click_rate, window.'
- question: When post-grant API-call sequences are modeled as Markov chains and classified with a Random
    Forest, do the transition patterns match accessibility abuse, and which transitions contributed?
  context: 'Modeling the sequence of actions an app takes after a grant captures behavioral tradecraft
    that individual events miss, strengthening Privilege Escalation detection. Build Markov chains of
    abstracted post-grant API-call sequences (UI automation, gesture dispatch, package install) and classify
    them with a Random Forest in the style of MaMaDroid, training on dynamic behavior data from CICMalDroid
    2020. Flag transition patterns characteristic of accessibility abuse (e.g., grant -> subscribe-all
    -> dispatchGesture -> package-install) and surface the top contributing transitions in the alert.
    A malicious classification with intuitive abusive transitions warrants investigation; the explainable
    transition output lets analysts validate against legitimate automation. Run alongside the deterministic
    rules so detection is layered. Citations: [MaMaDroid, Mariconti et al.](https://arxiv.org/abs/1612.04433);
    [CICMalDroid 2020, Canadian Institute for Cybersecurity](https://www.unb.ca/cic/datasets/maldroid-2020.html).'
  answer_sources:
  - MobileEDR:telemetry
  - MDM application permission logs
  - OS API execution telemetry (Accessibility events, dispatchGesture/performGlobalAction)
  - Window manager / overlay state
  - 'NAI: Mobile EDR/agent telemetry on the device, centralized MDM/EMM permission logs, and OS API-execution
    traces.'
  range: Last 90 days for scoring, with periodic retraining on labeled behavior traces.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seq = abstract_post_grant_api_sequence(device, package);


      markov = build_transition_matrix(seq);


      pred = RandomForest.predict(markov_features);


      alert when pred == ''accessibility_abuse'';


      output device_id, package_id, pred, top_contributing_transitions.'
- question: Does information-flow tracking show data moving from accessibility/UI sources to network sinks
    after an elevation-control grant?
  context: 'Accessibility services can read on-screen content across apps, so a taint flow from accessibility
    or UI sources to a network sink after a grant reveals screen-scraping exfiltration enabled by privilege
    escalation. Apply TaintDroid-style information-flow tracking to flag data flowing from accessibility/UI
    sources to network sinks after a grant. A detected source-to-sink flow is high-confidence evidence
    that the elevated privilege is being used to steal data (credentials, messages, 2FA codes) and should
    trigger immediate response; absence of such a flow does not fully clear the app, since taint tracking
    can be evaded by implicit flows, but its presence is a decisive Privilege Escalation indicator. Citations:
    [TaintDroid, Enck et al.](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf).'
  answer_sources:
  - MobileEDR:telemetry
  - MDM application permission logs
  - OS API execution telemetry (Accessibility events, dispatchGesture/performGlobalAction)
  - Window manager / overlay state
  - 'NAI: Mobile EDR/agent telemetry on the device, centralized MDM/EMM permission logs, and OS API-execution
    traces.'
  range: Last 90 days, evaluated on post-grant information flows.
  queries:
  - technology: MobileEDR/ML pseudocode
    query: 'taint = TaintDroid_track(sources={AccessibilityNode, UIContent}, sinks={network_send});


      on grant G: alert when exists flow(source->sink) after G.ts;


      output device_id, package_id, source, sink, flow_ts.'
- question: Did a package repeatedly re-prompt for high-risk permissions after denial, or did attempts
    to deactivate its device-admin or uninstall it fail?
  context: 'Resistance to removal and repeated re-prompting are explicitly prohibited app behaviors and
    a characteristic failure-state signal of T1626 abuse, where an app coerces consent or entrenches itself
    to preserve escalated privileges. Alert when a package repeatedly re-prompts for high-risk permissions
    after a denial, or when device-admin deactivation or uninstall attempts fail. Uninstall obstruction
    is a known tactic of banking trojans and ransomware abusing Device Admin and is prohibited by Google
    Play policy. A positive result is strong evidence of an app fighting to retain elevated control and
    warrants forced removal procedures; it directly serves Privilege Escalation detection by catching
    persistence of the escalated state. Citations: [Use of the Accessibility API, Google Play Policy](https://support.google.com/googleplay/android-developer/answer/10964491);
    [Abuse Elevation Control Mechanism (T1626), MITRE ATT&CK](https://attack.mitre.org/techniques/T1626/).'
  answer_sources:
  - MDM application permission logs
  - MDM device administrator event logs
  - MobileEDR:telemetry
  - OS API execution telemetry (system calls, binder)
  - 'NAI: Centralized MDM/EMM logs and mobile EDR/agent behavioral telemetry across the managed fleet.'
  range: Last 90 days, with real-time alerting on removal failures and re-prompt loops.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'alert when count(reprompt_after_denial(package)) >= N within window;


      or when device_admin_deactivate(package)==''failed'' or uninstall(package)==''failed'';


      output device_id, package_id, signal, attempt_count, timestamp.'
- question: For each app and device, does the count of denied/re-prompted permission requests or failed
    removal attempts spike above baseline over the measurement window?
  context: Treating failure rate as a first-class statistical signal, distinct from successful grants,
    exposes apps that are persistently coercing consent or resisting removal in pursuit of escalated privileges.
    Count denied/re-prompted permission requests and failed removal attempts per app per device over a
    window and alert on spikes above baseline. A device or app showing an abnormal concentration of denial/re-prompt
    or removal-failure events is behaving like elevation-abusing malware even if no single event is conclusive.
    A spike warrants investigation and correlation with grant and behavioral signals; counts within baseline
    reflect normal permission churn.
  answer_sources:
  - MDM application permission logs
  - MDM device administrator event logs
  - MobileEDR:telemetry
  - OS API execution telemetry (system calls, binder)
  - 'NAI: Centralized MDM/EMM logs and mobile EDR/agent behavioral telemetry across the managed fleet.'
  range: Last 90 days, with per-app per-device windows over a rolling baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per (device, app) per window: denied = count(permission_denied or reprompt);

      fail_remove = count(failed device_admin_deactivate or failed uninstall);

      baseline = rolling_baseline(device, app);

      alert when denied > baseline.p99 or fail_remove > baseline.p99;

      output device_id, package_id, denied, fail_remove.'
- question: Does a semi-supervised deep model scoring post-grant system-call/binder behavior flag banking/riskware-like
    activity, and which behaviors contributed?
  context: 'Most dynamic behavior is unlabeled, so a semi-supervised model that learns from mostly-unlabeled
    traces can flag the post-grant system-call and binder patterns of elevation-abusing malware that supervised
    rules miss, supporting Privilege Escalation detection. Score post-grant system-call/binder behavior
    with a semi-supervised deep model trained on dynamic traces as in the Dynamic Android Malware Category
    Classification work over CICMalDroid 2020, and alert on banking/riskware-like behavior while surfacing
    the top contributing behaviors. A high anomaly or category score with intuitive drivers (e.g., abnormal
    binder transactions, system-call bursts after a grant) warrants investigation; the explainable output
    lets analysts validate against legitimate app behavior. Deploy alongside the rule and statistical
    layers for defense in depth. Citations: [Dynamic Android Malware Category Classification, Mahdavifar
    et al.](https://ieeexplore.ieee.org/document/9520802); [CICMalDroid 2020, Canadian Institute for Cybersecurity](https://www.unb.ca/cic/datasets/maldroid-2020.html).'
  answer_sources:
  - MDM application permission logs
  - MDM device administrator event logs
  - MobileEDR:telemetry
  - OS API execution telemetry (system calls, binder)
  - 'NAI: Centralized MDM/EMM logs and mobile EDR/agent behavioral telemetry across the managed fleet.'
  range: Last 90 days for scoring, with periodic retraining on dynamic behavioral traces.
  queries:
  - technology: MobileEDR/ML pseudocode
    query: 'behavior = post_grant_syscall_binder_trace(device, package);


      score = SemiSupervisedDeepModel.predict(behavior);


      alert when score indicates banking/riskware behavior;


      output device_id, package_id, score, top_contributing_behaviors.'
