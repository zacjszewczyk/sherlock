- question: Does a device's total daily upload volume exceed the 99th percentile of its 30-day baseline
    (using Seasonal-Hybrid ESD for seasonality), and are blocked-upload or failed-connection counts rising
    as a separate failure-mode signal?
  context: 'Tactic: Collection (TA0035). Mission question: Is an adversary collecting and exfiltrating
    location data from our mobile devices? (PIR) Detection method: Statistical Method. Per-device daily
    upload baselining catches slow or bursty data theft. Build a 30-day baseline of daily upload volume
    and alert when a day exceeds the device''s 99th percentile; apply Seasonal-Hybrid ESD for seasonal
    patterns. Enrich alerts with top destination ASNs and the active apps. Separately track blocked-upload
    and failed-connection counts, since blocked exfiltration attempts still indicate adversary activity
    worth investigating. Evidence under examination: A mobile device exfiltrates an anomalously large
    volume of data to an external, non-whitelisted destination, coinciding with the activity of an application
    that has location permissions. This is evidenced by the total daily data upload volume (sum of `orig_bytes`
    in Zeek conn.log) exceeding the 99th percentile of the device''s 30-day historical baseline, where
    MDM/MTD logs confirm a location-aware application was active during the period of high traffic. Source
    guidance: Maintain a 30-day baseline of daily upload volume per device and alert when a day''s total
    exceeds the 99th percentile of the device baseline; for seasonality use Seasonal-Hybrid ESD per [Hochenbaum
    et al.](https://arxiv.org/pdf/1704.07706). Enrich with top destination ASNs and active apps. Track
    blocked-upload and failed-connection counts as a separate failure-mode signal.'
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      index=zeek_conn mobile
        | bin _time span=1d | stats sum(orig_bytes) as up by device,_time
        | eventstats perc99(up) as p99 by device
        | where up > p99
        | append [search zeek_conn mobile | stats count(blocked_upload) count(failed_conn) by device]
        | enrich top_dest_asn, active_app
- question: Do observed daily upload volumes exceed a Prophet/ARIMA upper confidence interval, do one-class
    models (Isolation Forest / autoencoder / OC-SVM) trained on benign egress flag a session, do Markov-chain
    location-read->network-send sequence features deviate, and do anomaly-window destination ASNs cluster
    abnormally under DBSCAN?
  context: 'Tactic: Collection (TA0035). Mission question: Is an adversary collecting and exfiltrating
    location data from our mobile devices? (PIR) Detection method: Machine Learning. This layered ML approach
    targets zero-day covert exfiltration. Forecast daily upload volume with Prophet/ARIMA and alert above
    the upper CI. One-class models trained only on benign egress flag never-before-seen exfil patterns.
    Markov-chain features model the app''s location-read-to-network-send API sequence to capture behavioral
    deviation. DBSCAN over anomaly-window destination ASNs surfaces clustered suspicious infrastructure.
    Report the top-3 contributing features per alert for explainability. Evidence under examination: A
    mobile device exfiltrates an anomalously large volume of data to an external, non-whitelisted destination,
    coinciding with the activity of an application that has location permissions. This is evidenced by
    the total daily data upload volume (sum of `orig_bytes` in Zeek conn.log) exceeding the 99th percentile
    of the device''s 30-day historical baseline, where MDM/MTD logs confirm a location-aware application
    was active during the period of high traffic. Source guidance: Use Prophet/ARIMA per [Intrusion Detection
    via Time Series Forecasting, Aldallal et al.](https://link.springer.com/article/10.1186/s13677-023-00491-x)
    to forecast daily upload volume and alert when observed volumes exceed the upper confidence interval.
    Detect zero-day covert exfiltration with one-class models (Isolation Forest / autoencoder / OC-SVM)
    trained only on benign egress per [One-Class Classification for IoT, Alani et al.](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/),
    and model the app''s location-read->network-send API sequence with Markov-chain behavioral features
    per [MaMaDroid, Mariconti et al.](https://arxiv.org/pdf/1612.04433). Cluster anomaly-window destination
    ASNs with DBSCAN per [Ester et al.](https://cdn.aaai.org/KDD/1996/KDD96-037.pdf) and report the top-3
    contributing features in each alert.'
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      fc = prophet_arima(daily_upload[device]); alert where obs > fc.upper
        oc = isolation_forest/ocsvm/autoencoder(benign_egress); alert where oc.flag
        seq = markov_features(location_read -> network_send)
        asn_clusters = DBSCAN(anomaly_window_dest_asn)
        for a in alerts: report top3_features(a)
