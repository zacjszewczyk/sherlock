questions:
- question: Which managed applications hold high-risk location permissions (Android ACCESS_BACKGROUND_LOCATION,
    iOS Always authorization, or the com.apple.locationd.preauthorized entitlement), and do any of them
    match known-malicious package names or file hashes in threat intelligence?
  context: 'Tactic: Discovery (TA0032). Mission question: Is an adversary discovering the physical location
    of our mobile devices? (PIR) Detection method: Symbolic Logic. Background or ''Always'' location access
    lets an app read coordinates even when not in use, the exact capability covert trackers need. Pull
    the MDM/UEM app inventory, list every app retaining background/Always location, and query threat intel
    by package name and SHA-256. A match to a known-malicious indicator is a critical alert. Also flag
    any app that keeps background location WITHOUT a declared foreground-service location type or an allow-listed
    business justification, since legitimate apps almost always declare one. Evidence under examination:
    An application''s manifest (AndroidManifest.xml) or property list (Info.plist) contains a high-risk
    location permission, specifically `ACCESS_BACKGROUND_LOCATION` on Android or `NSLocationAlwaysAndWhenInUseUsageDescription`
    on iOS, and this permission is not present on an established allow-list for the given application
    or application category. Source guidance: Use MDM inventory to list apps holding ACCESS_BACKGROUND_LOCATION
    (Android 10+ separate runtime grant) or iOS Always authorization / com.apple.locationd.preauthorized
    and query threat intel by package name and file hash; trigger a critical alert on matches to known
    malicious indicators. Flag any app retaining background-location WITHOUT a declared foreground-service
    location type or allow-listed business justification per [Android Location Permissions Developer Documentation,
    Google](https://developer.android.com/develop/sensors-and-location/location/permissions).'
  answer_sources: &id001
  - Mobile Device Management (MDM) application inventory logs
  - AndroidManifest.xml
  - Info.plist
  - Threat intelligence feeds
  - 'NAI: MDM/UEM server, internal application repository, cloud-hosted application vetting sandboxes,
    threat intelligence platform.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      index=mdm_app_inventory
        | where (perm="ACCESS_BACKGROUND_LOCATION" OR ios_auth="Always" OR entitlement="com.apple.locationd.preauthorized")
        | lookup threat_intel package_name OUTPUT ti_verdict, ti_hash_match
        | eval no_justification=if(isnull(fg_service_location_type) AND NOT allowlisted, 1, 0)
        | where ti_verdict="malicious" OR ti_hash_match=1 OR no_justification=1
        | eval severity=if(ti_verdict="malicious","critical","high")
- question: Are any applications obtaining location through covert or side-channel routes (photo EXIF
    GPS, Wi-Fi/router MAC lookup, a permissioned app writing coordinates to shared storage/IPC for a permission-less
    app) or bundling known abusive location SDKs such as Baidu or Salmonads?
  context: 'Tactic: Discovery (TA0032). Mission question: Is an adversary discovering the physical location
    of our mobile devices? (PIR) Detection method: Symbolic Logic. Manifest/Info.plist permission checks
    miss apps that never request location yet still obtain it via side channels documented by Reardon
    et al. Inspect static app features for EXIF-GPS reads, Wi-Fi BSSID/router-MAC collection, IPC/shared-storage
    coordinate hand-offs between a permissioned app and a permission-less one, and embedded tracker SDKs.
    Presence of these patterns indicates an attempt to evade permission-based controls and warrants quarantine
    review. Evidence under examination: An application''s manifest (AndroidManifest.xml) or property list
    (Info.plist) contains a high-risk location permission, specifically `ACCESS_BACKGROUND_LOCATION` on
    Android or `NSLocationAlwaysAndWhenInUseUsageDescription` on iOS, and this permission is not present
    on an established allow-list for the given application or application category. Source guidance: Beyond
    manifest checks, flag apps that read location via covert/side channels documented in [50 Ways to Leak
    Your Data, Reardon et al.](https://www.usenix.org/system/files/sec19-reardon.pdf) (photo EXIF GPS,
    Wi-Fi/router MAC, or a permissioned app writing coordinates to shared storage/IPC for a permission-less
    app) and apps bundling known abusive SDKs (e.g., Baidu, Salmonads).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      index=app_static_analysis
        | eval covert=case(
            uses_exif_gps=1,"exif_gps",
            reads_wifi_bssid=1,"wifi_mac",
            writes_coords_to_shared_ipc=1,"ipc_handoff",
            sdk IN ("baidu","salmonads"),"abusive_sdk")
        | where isnotnull(covert)
        | table app, package_name, covert, sdk
- question: Within each app store category, which applications request background location while also
    holding a total permission count above the 95th percentile for that category?
  context: 'Tactic: Discovery (TA0032). Mission question: Is an adversary discovering the physical location
    of our mobile devices? (PIR) Detection method: Statistical Method. Over-privileged apps are suspicious
    relative to their peers. Group fleet apps by store category, compute the distribution of total permission
    counts per category, and flag apps that both request background location and exceed the category''s
    95th-percentile permission count. Derive the threshold from your own MDM inventory so it reflects
    your fleet. Outliers merit manual vetting; a benign flashlight app demanding background location and
    40 permissions is a classic red flag. Evidence under examination: An application''s manifest (AndroidManifest.xml)
    or property list (Info.plist) contains a high-risk location permission, specifically `ACCESS_BACKGROUND_LOCATION`
    on Android or `NSLocationAlwaysAndWhenInUseUsageDescription` on iOS, and this permission is not present
    on an established allow-list for the given application or application category. Source guidance: Group
    apps by store category and compute permission distributions; flag apps requesting background location
    with total permission counts above the 95th percentile for their category. Derive the threshold per
    fleet from your own MDM inventory.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      index=mdm_app_inventory
        | stats dc(permission) as perm_count by app, category
        | eventstats perc95(perm_count) as p95 by category
        | join app [search index=mdm_app_inventory perm="ACCESS_BACKGROUND_LOCATION" | fields app]
        | where perm_count > p95
- question: When an explainable static classifier scores an application's manifest and code features,
    which location-permission apps exceed a malicious-confidence threshold of 0.90, and what top features
    drive that score?
  context: 'Tactic: Discovery (TA0032). Mission question: Is an adversary discovering the physical location
    of our mobile devices? (PIR) Detection method: Machine Learning. Static ML (Drebin-style or a DNN)
    generalizes beyond signatures by learning from permission vectors, suspicious API strings, exported-component
    counts, and embedded URLs. Run the classifier across the app inventory; quarantine and alert when
    malicious confidence exceeds 0.90, and surface the top-3 SHAP/LIME contributing features (e.g., background-location
    permission, GPS API call, embedded tracker URL) so an analyst can validate the verdict rather than
    trust a black box. Evidence under examination: An application''s manifest (AndroidManifest.xml) or
    property list (Info.plist) contains a high-risk location permission, specifically `ACCESS_BACKGROUND_LOCATION`
    on Android or `NSLocationAlwaysAndWhenInUseUsageDescription` on iOS, and this permission is not present
    on an established allow-list for the given application or application category. Source guidance: Apply
    an explainable static classifier on manifest+code features (permission vector incl. location, restricted/suspicious
    API strings, exported component counts, URLs) following [Drebin, Arp et al.](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf)
    or a DNN per [Using Deep Neural Network for Android Malware Detection, Naway and Li](https://arxiv.org/pdf/1904.00736).
    Quarantine and alert when malicious confidence exceeds 0.90, and surface the top-3 contributing features
    (e.g., background-location permission, GPS API, embedded tracker URL) in the alert using SHAP/LIME
    per [XAI for Malware Analysis Survey, Manthena et al.](https://arxiv.org/html/2409.13723v2).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      features = extract(manifest_permissions, suspicious_api_strings, exported_components, urls)
        score = drebin_or_dnn_model.predict_proba(features)
        if score >= 0.90:
            top3 = shap_explain(model, features)[:3]
            quarantine(app); alert(app, score, top3)
- question: Do network connections (Zeek conn.log/dns.log) originating from mobile IP ranges and tied
    to location-permission apps reach destinations matching C2 or malicious threat intelligence, ideally
    where a location-read API was followed by a network transmission in the same session?
  context: 'Tactic: Discovery (TA0032). Mission question: Is an adversary discovering the physical location
    of our mobile devices? (PIR) Detection method: Symbolic Logic. This pairs network egress with threat
    intel and a taint-style source-to-sink rule. Match Zeek destinations from mobile ranges against C2
    indicators, enrich with device/user from MDM/VPN logs, and raise high severity on a hit. Requiring
    the location-source-API-read followed by a network-sink transmission within one session (per SUSI/TaintDroid)
    suppresses benign map traffic and confirms the app is shipping location data out. Evidence under examination:
    A managed mobile device exhibits a statistically significant spike in location service API calls,
    or it communicates location data to a new or suspicious network destination. This is evidenced by
    either: 1) the hourly count of location API calls from an MTD agent exceeding 3 standard deviations
    above the device''s 30-day rolling average, or 2) network flow data (Zeek conn.log) showing a connection
    to a destination IP address not seen from the mobile device fleet in the last 60 days, where MTD logs
    confirm a location-aware app was active. Source guidance: Match Zeek conn.log/dns.log destinations
    from mobile IP ranges against C2 or malicious threat intel; alert at high severity and enrich with
    device/user from MDM/VPN logs. Add the source-to-sink rule from [SUSI, Rasthofer et al.](https://www.bodden.de/pubs/rab14classifying.pdf)
    and [TaintDroid, Enck et al.](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf):
    fire when an app''s location-source API read is followed by a network-sink transmission within the
    same session.'
  answer_sources: &id002
  - Mobile Threat Defense (MTD) API call logs
  - MDM location history logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Corporate-managed mobile devices, network egress points (e.g., VPN concentrators, corporate
    Wi-Fi access points), DNS resolvers, cloud-hosted MTD/MDM platforms.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      conn = load(conn.log) where id.orig_h in MOBILE_RANGES
        ti_hits = join(conn, dns.log, threat_intel) on dest_ip|query|sni == ti.c2_indicator
        taint = sessions where location_api_read precedes network_send (same app, same session)
        alert(high) for ti_hits intersect taint enriched with mdm.device,user
- question: Do consecutive device-reported coordinates imply physically impossible travel speeds (e.g.,
    >1000 km/h), or does device GPS persistently disagree with the GeoIP of its network egress IP, suggesting
    sensor spoofing or injected coordinates?
  context: 'Tactic: Discovery (TA0032). Mission question: Is an adversary discovering the physical location
    of our mobile devices? (PIR) Detection method: Symbolic Logic. Impossible-travel velocity logic catches
    fabricated or manipulated location data. Compute implied speed between consecutive coordinate reports
    and flag values above a physical threshold. Separately reconcile device GPS against the GeoIP of the
    egress IP; a persistent mismatch indicates spoofed sensor data or coordinate injection. Either condition
    undermines the integrity of location telemetry and points to adversary manipulation. Evidence under
    examination: A managed mobile device exhibits a statistically significant spike in location service
    API calls, or it communicates location data to a new or suspicious network destination. This is evidenced
    by either: 1) the hourly count of location API calls from an MTD agent exceeding 3 standard deviations
    above the device''s 30-day rolling average, or 2) network flow data (Zeek conn.log) showing a connection
    to a destination IP address not seen from the mobile device fleet in the last 60 days, where MTD logs
    confirm a location-aware app was active. Source guidance: Apply the velocity-feasibility logic of
    [WO2018085161A1 Impossible Travel, Microsoft](https://patents.google.com/patent/WO2018085161A1/en)
    to consecutive device-reported coordinates; flag implied speeds exceeding a physical threshold (e.g.,
    >1000 km/h) and reconcile device GPS against GeoIP of the network egress IP, alerting on persistent
    mismatch (sensor spoofing / injected coordinates).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      index=mdm_location_history
        | sort device, _time
        | streamstats current=f last(lat) as plat last(lon) as plon last(_time) as pt by device
        | eval km=haversine(plat,plon,lat,lon), hrs=(_time-pt)/3600
        | eval speed=km/hrs
        | eval geoip_mismatch=if(geoip(egress_ip)!=region(lat,lon),1,0)
        | where speed>1000 OR geoip_mismatch=1
- question: Does a device's hourly location-API call count exceed 3 standard deviations above its 30-day
    rolling average (using Seasonal-Hybrid ESD for commute seasonality), and is it contacting destination
    IP:port pairs not seen from that device in 60 days?
  context: 'Tactic: Discovery (TA0032). Mission question: Is an adversary discovering the physical location
    of our mobile devices? (PIR) Detection method: Statistical Method. Covert tracking shows up as abnormal
    call cadence and novel destinations. Maintain a 30-day per-device baseline of hourly location-API
    calls and alert beyond 3 sigma; for seasonal commute patterns use Seasonal-Hybrid ESD (STL + median/MAD)
    to avoid false positives. Track destination IP:port over 60 days and alert on first-seen destinations,
    enriching with GeoIP/ASN and JA3. Also track failure-mode series (denied location grants, blocked
    egress, NXDOMAIN to tracker domains) separately, since denied apps still leak. Evidence under examination:
    A managed mobile device exhibits a statistically significant spike in location service API calls,
    or it communicates location data to a new or suspicious network destination. This is evidenced by
    either: 1) the hourly count of location API calls from an MTD agent exceeding 3 standard deviations
    above the device''s 30-day rolling average, or 2) network flow data (Zeek conn.log) showing a connection
    to a destination IP address not seen from the mobile device fleet in the last 60 days, where MTD logs
    confirm a location-aware app was active. Source guidance: Maintain a 30-day baseline of hourly location
    API call counts per device and alert when counts exceed 3 standard deviations; for seasonal commute
    patterns prefer Seasonal-Hybrid ESD (STL + median/MAD) per [Seasonal Hybrid ESD, Hochenbaum et al.](https://arxiv.org/pdf/1704.07706).
    Track destination IP:port pairs over 60 days and alert on first-seen destinations, enriching with
    GeoIP/ASN and JA3 from Zeek ssl.log. Separately track failure-mode series (denied location grants,
    blocked egress, NXDOMAIN to tracker domains) as distinct signals, since denied apps still leak per
    [50 Ways to Leak Your Data, Reardon et al.](https://www.usenix.org/system/files/sec19-reardon.pdf).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      index=mtd_api_calls api="location*"
        | bin _time span=1h | stats count as calls by device,_time
        | eventstats avg(calls) as mu stdev(calls) as sd by device
        | eval z=(calls-mu)/sd
        | append [search zeek_conn mobile | stats earliest(_time) as first by device,dest_ip,dest_port | where first>relative_time(now(),"-60d")]
        | where z>3 OR isnotnull(dest_ip)
- question: Do hourly location-API counts breach a Seasonal-Hybrid ESD / Prophet confidence band, and
    do new geo-coordinates fall outside DBSCAN-established routine location clusters (noise label)?
  context: 'Tactic: Discovery (TA0032). Mission question: Is an adversary discovering the physical location
    of our mobile devices? (PIR) Detection method: Machine Learning. This applies time-series and spatial
    ML. Forecast hourly location-API counts with Seasonal-Hybrid ESD or Prophet and alert on points above
    the confidence band, capturing abnormal tracking cadence. Cluster historical coordinates with DBSCAN
    and alert when new points are labelled noise (outside routine clusters), reporting nearest-cluster
    distance so the analyst can gauge how far off-pattern the location is. Evidence under examination:
    A managed mobile device exhibits a statistically significant spike in location service API calls,
    or it communicates location data to a new or suspicious network destination. This is evidenced by
    either: 1) the hourly count of location API calls from an MTD agent exceeding 3 standard deviations
    above the device''s 30-day rolling average, or 2) network flow data (Zeek conn.log) showing a connection
    to a destination IP address not seen from the mobile device fleet in the last 60 days, where MTD logs
    confirm a location-aware app was active. Source guidance: Apply Seasonal-Hybrid ESD per [Hochenbaum
    et al.](https://arxiv.org/pdf/1704.07706) or Prophet forecasting per [Intrusion Detection via Time
    Series Forecasting, Aldallal et al.](https://link.springer.com/article/10.1186/s13677-023-00491-x)
    to hourly location API counts and alert on anomalies above the confidence band. Cluster historical
    geo-coordinates with DBSCAN per [Ester et al.](https://cdn.aaai.org/KDD/1996/KDD96-037.pdf) and alert
    when new location points fall outside established routine clusters (noise label), reporting the nearest-cluster
    distance in the alert.'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      ts = hourly_location_api_counts(device, 90d)
        resid = prophet_or_shesd(ts); alert where resid outside conf_band
        clusters = DBSCAN(historical_coords[device], eps, min_pts)
        for p in new_coords: if label(p)==NOISE: alert(p, dist_to_nearest_cluster(p))
- question: When MDM/MTD app network logs are joined with Zeek conn/dns/ssl by device IP and time, do
    any location-permission apps reach a destination IP, DNS query, or SNI matching C2 threat intel, confirmed
    by a location-source-to-network-sink pairing?
  context: 'Tactic: Collection (TA0035). Mission question: Is an adversary collecting and exfiltrating
    location data from our mobile devices? (PIR) Detection method: Symbolic Logic. Joining app-attributed
    network logs with Zeek lets you attribute a C2 hit to a specific location-permission app. Alert when
    the destination IP, DNS query, or TLS SNI matches C2 intel for such an app. Requiring the SUSI/TaintDroid
    location-source-to-network-sink pairing suppresses benign map traffic and raises confidence that the
    app is exfiltrating location to attacker infrastructure. Evidence under examination: A network connection
    originating from an application with location permissions exhibits indicators of C2 communication.
    This is evidenced by one or more of the following: the destination IP/domain matches a known C2 indicator;
    the connection uses a self-signed or unusual SSL/TLS certificate; or the TLS client fingerprint (JA3
    hash) is exceptionally rare across the mobile fleet (e.g., prevalence < 0.01% over 30 days). Source
    guidance: Join MDM/MTD app network logs with Zeek conn.log/dns.log/ssl.log by device IP and time;
    alert when destination IP, DNS query, or SNI matches C2 threat intel for a location-permission app.
    Require the location-source-to-network-sink pairing from [SUSI, Rasthofer et al.](https://www.bodden.de/pubs/rab14classifying.pdf)
    / [TaintDroid, Enck et al.](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf)
    to suppress benign map traffic.'
  answer_sources: &id003
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Threat intelligence feeds
  - MDM/MTD application network logs
  - 'NAI: Network egress points, firewalls, proxies, VPN concentrators, DNS resolvers, threat intelligence
    platforms, MDM/MTD cloud consoles.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      | join device_ip,_time [search index=mdm_mtd_net app_perm="location"] [search zeek conn,dns,ssl]
        | lookup threat_intel dest_ip,dns_query,sni OUTPUT c2_match
        | eval sink=if(location_api_read_then_network_send=1,1,0)
        | where c2_match=1 AND sink=1
        | eval severity="high"
- question: Does any location-permission app use a TLS JA3 fingerprint observed in fewer than 0.01% of
    mobile sessions over 30 days, and are per-device blocked-connection or TLS-handshake-failure counts
    spiking?
  context: 'Tactic: Collection (TA0035). Mission question: Is an adversary collecting and exfiltrating
    location data from our mobile devices? (PIR) Detection method: Statistical Method. Rare JA3 hashes
    often indicate non-standard or malicious TLS stacks used by malware rather than mainstream map SDKs.
    Compute 30-day JA3 prevalence across mobile traffic and alert when a location-permission app uses
    a hash seen in <0.01% of sessions, enriching with destination IP/ASN. Track blocked-connection and
    handshake-failure counts per device as a distinct failure-mode series, since thwarted exfiltration
    still signals intent. Evidence under examination: A network connection originating from an application
    with location permissions exhibits indicators of C2 communication. This is evidenced by one or more
    of the following: the destination IP/domain matches a known C2 indicator; the connection uses a self-signed
    or unusual SSL/TLS certificate; or the TLS client fingerprint (JA3 hash) is exceptionally rare across
    the mobile fleet (e.g., prevalence < 0.01% over 30 days). Source guidance: Compute 30-day JA3 prevalence
    for mobile traffic; alert when a location-permission app uses a JA3 hash observed in less than 0.01%
    of sessions and enrich with destination IP/ASN. Track per-device blocked-connection and TLS-handshake-failure
    counts as a distinct failure-mode series.'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      ssl = load(ssl.log) join app_attribution where app_perm="location"
        prev = count(ja3)/total_sessions over 30d
        alert where prev < 0.0001 enrich dest_ip, asn
        failures = stats by device count(blocked_conn), count(tls_handshake_fail)
- question: When an explainable XGBoost model scores outbound connections using destination reputation,
    port rarity, JA3 prevalence, DNS entropy, duration, and byte volumes plus a location-app flag, which
    connections exceed a risk score of 0.85?
  context: 'Tactic: Collection (TA0035). Mission question: Is an adversary collecting and exfiltrating
    location data from our mobile devices? (PIR) Detection method: Machine Learning. A gradient-boosted
    model fuses many weak network signals into a single risk score. Features include destination reputation,
    port rarity, JA3 prevalence, DNS entropy, connection duration, orig/resp bytes, and whether the originating
    app holds location permissions. Open a ticket when risk exceeds 0.85 and surface the top-3 feature
    importances so the analyst can see why (e.g., low-reputation destination + rare JA3 + location app),
    supporting a defensible triage decision. Evidence under examination: A network connection originating
    from an application with location permissions exhibits indicators of C2 communication. This is evidenced
    by one or more of the following: the destination IP/domain matches a known C2 indicator; the connection
    uses a self-signed or unusual SSL/TLS certificate; or the TLS client fingerprint (JA3 hash) is exceptionally
    rare across the mobile fleet (e.g., prevalence < 0.01% over 30 days). Source guidance: Train an explainable
    XGBoost model (feature importances per [Mal-API-2019 evaluation, Wang et al.](https://arxiv.org/abs/2403.02232))
    using destination reputation, port rarity, JA3 prevalence, DNS entropy, duration, orig_bytes, resp_bytes,
    and a flag for location-permission app. Open a ticket when risk exceeds 0.85 and surface the top-3
    contributing features per [XAI for Malware Analysis Survey, Manthena et al.](https://arxiv.org/html/2409.13723v2).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      X = [dest_reputation, port_rarity, ja3_prevalence, dns_entropy, duration, orig_bytes, resp_bytes, is_location_app]
        risk = xgboost_model.predict_proba(X)
        if risk > 0.85:
            top3 = feature_importance(model, X)[:3]
            open_ticket(conn_id, risk, top3)
- question: Does any mobile device upload more than 50MB (orig_bytes) to a non-allowlisted destination
    in a single session while a location-aware app is active, especially where a location-source-to-network-sink
    flow was observed?
  context: 'Tactic: Collection (TA0035). Mission question: Is an adversary collecting and exfiltrating
    location data from our mobile devices? (PIR) Detection method: Symbolic Logic. Bulk egress to an unapproved
    destination is a hallmark of exfiltration. Maintain an allowlist of approved domains/IPs and alert
    when a device uploads >50MB orig_bytes to anything off it in one session, enriching with device ID
    and the active app from MDM logs. Prioritize sessions where a TaintDroid-style location-read-to-network-send
    flow was seen, indicating the uploaded payload likely contains harvested location data. Evidence under
    examination: A mobile device exfiltrates an anomalously large volume of data to an external, non-whitelisted
    destination, coinciding with the activity of an application that has location permissions. This is
    evidenced by the total daily data upload volume (sum of `orig_bytes` in Zeek conn.log) exceeding the
    99th percentile of the device''s 30-day historical baseline, where MDM/MTD logs confirm a location-aware
    application was active during the period of high traffic. Source guidance: Maintain an allowlist of
    approved domains/IPs; alert when a mobile device uploads more than 50MB orig_bytes to a non-allowlisted
    destination in a single session and enrich with device ID and active app from MDM logs. Prioritize
    sessions where a location-source-to-network-sink flow was observed per [TaintDroid, Enck et al.](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf).'
  answer_sources: &id004
  - Zeek conn.log
  - MDM/MTD application activity logs
  - 'NAI: Network egress points (e.g., VPN concentrators, corporate Wi-Fi gateways), corporate-managed
    mobile devices, MDM/MTD cloud consoles.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
