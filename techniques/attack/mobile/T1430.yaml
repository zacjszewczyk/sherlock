name: 'T1430: Location Tracking'
id: 5b965442-a23d-43e3-a35b-fd27225ba2da
description: 'Investigate potential mobile Location Tracking (T1430), where an adversary uses malicious
  or exploited applications to read a device''s physical location via OS APIs and may exfiltrate that
  data. This playbook helps an analyst answer two mission questions: (1) whether an adversary is discovering
  the physical location of managed mobile devices, and (2) whether an adversary is collecting and exfiltrating
  location data from them. It guides examination of application permission posture (Android ACCESS_FINE_LOCATION
  / ACCESS_BACKGROUND_LOCATION; iOS When-In-Use vs Always authorization and com.apple.locationd.preauthorized
  entitlement), abnormal location-sensor API call volume and cadence (including background or device-locked
  access), location-source-to-network-sink data flows, anomalous or first-seen network destinations, rare
  TLS/JA3 fingerprints, C2 indicators, and large or impossible data egress. It combines symbolic logic
  (allow-list and threat-intel matching, taint-style source-to-sink correlation, impossible-travel checks),
  statistical baselining (3-sigma, percentile, Seasonal-Hybrid ESD), and machine learning (static malware
  classification, time-series forecasting, clustering, one-class anomaly detection) across MDM/UEM, Mobile
  Threat Defense, and network (Zeek) telemetry.'
type: technique
related:
- tactic_id: TA0032
  tactic_name: Discovery
- tactic_id: TA0035
  tactic_name: Collection
