questions:
- question: '[Collection] Match calendar apps to malicious destinations: have you determined whether ''match
    calendar apps to malicious destinations'' is warranted on managed mobile devices, using the Symbolic
    Logic approach described, to answer the intelligence requirement — Is an adversary collecting calendar
    entries from managed mobile devices? (PIR)'
  context: 'Tactic relevance (Collection): Is an adversary collecting calendar entries from managed mobile
    devices? (PIR) This question operationalizes a Symbolic Logic detection for MITRE ATT&CK T1636.001
    (Calendar Entries) on Android/iOS. This deterministic correlation pivots from capability to destination:
    for each mobile device IP, retrieve from MDM/UEM inventory the installed apps that hold READ_CALENDAR/WRITE_CALENDAR
    (Android) or declare NSCalendarsUsageDescription (iOS), then join Zeek conn.log/dns.log connections
    from that IP and match destination FQDN/IP against threat intelligence denylists and passive-DNS reputation
    features (short-lived domain, low TTL, high name entropy). Most apps do not need calendar access,
    so an app that both holds it and talks to a known-bad or reputation-poor destination is a strong exfiltration
    lead. A positive result surfaces the matched app, destination, and rule that fired and warrants immediate
    triage; a negative result lowers but does not eliminate suspicion, so corroborate with the source-to-sink,
    volume, beaconing, and ML questions in this playbook. Source citations: [ATT&CK T1636.001](https://attack.mitre.org/techniques/T1636/001/);
    [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/ndss11_exposure.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Mobile Device Management (MDM) Application Inventory
  - Threat Intelligence Feeds
  - 'NAI: Corporate network gateways, VPN concentrators, DNS resolvers, and MDM/UEM platforms monitoring
    mobile device traffic and application installations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=mdm source=MDM.AppInventory

      | where perms IN ("READ_CALENDAR","WRITE_CALENDAR") OR ios_key="NSCalendarsUsageDescription"

      | join device_ip [ search index=zeek (sourcetype=conn OR sourcetype=dns) ]

      | lookup ThreatIntel dest_ip OUTPUT ti_ip | lookup ThreatIntel query AS fqdn OUTPUT ti_dom

      | eval rep_bad=if(domain_age<30d OR dns_ttl<60 OR name_entropy>3.5,1,0)

      | where isnotnull(ti_ip) OR isnotnull(ti_dom) OR rep_bad=1

      | eval severity="high" | table device_ip, app, dest_ip, fqdn, rule_fired'
- question: '[Collection] Tie calendar reads to network sinks: have you determined whether ''tie calendar
    reads to network sinks'' is warranted on managed mobile devices, using the Symbolic Logic approach
    described, to answer the intelligence requirement — Is an adversary collecting calendar entries from
    managed mobile devices? (PIR)'
  context: 'Tactic relevance (Collection): Is an adversary collecting calendar entries from managed mobile
    devices? (PIR) This question operationalizes a Symbolic Logic detection for MITRE ATT&CK T1636.001
    (Calendar Entries) on Android/iOS. Where dynamic instrumentation or Mobile Threat Defense (MTD) is
    available, this rule proves source-to-sink exfiltration by raising a critical alert when an app reads
    a calendar source (Android Content Provider / iOS EventKit) and emits an outbound flow to a non-allowlisted
    destination within the same session. Per-app VPN or secure-web-gateway egress is the enforcement and
    observation point. Establishing that the same app both touched calendar data and sent it outbound
    within one session is the most direct evidence of T1636.001 collection-to-exfiltration; a positive
    result is high confidence, while a negative result simply means instrumentation did not observe the
    chain and other detectors should be consulted. Source citations: [TaintDroid](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf);
    [NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Mobile Device Management (MDM) Application Inventory
  - Threat Intelligence Feeds
  - 'NAI: Corporate network gateways, VPN concentrators, DNS resolvers, and MDM/UEM platforms monitoring
    mobile device traffic and application installations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=mtd source=MTD.DynamicInstrumentation

      | where api_read IN ("ContentProvider:calendar","EventKit")

      | transaction app_id maxspan=session

      | join app_id [ search index=zeek sourcetype=conn ]

      | lookup EgressAllowlist dest_fqdn OUTPUT approved

      | where read_calendar=true AND isnull(approved)

      | eval severity="critical" | table device_id, app_id, calendar_api, dest_fqdn'
- question: '[Collection] Baseline outbound volume and failure state for calendar apps: have you determined
    whether ''baseline outbound volume and failure state for calendar apps'' is warranted on managed mobile
    devices, using the Statistical Method approach described, to answer the intelligence requirement —
    Is an adversary collecting calendar entries from managed mobile devices? (PIR)'
  context: 'Tactic relevance (Collection): Is an adversary collecting calendar entries from managed mobile
    devices? (PIR) This question operationalizes a Statistical Method detection for MITRE ATT&CK T1636.001
    (Calendar Entries) on Android/iOS. This statistical baseline builds, per calendar-permission app,
    a 30-day profile of outbound orig_bytes/session and request rate from Zeek conn.log and alerts when
    a session exceeds the 99.5th percentile. It additionally computes DNS subdomain entropy, unique-subdomain
    count, and query length from dns.log (elevating when entropy exceeds 3.5 alongside the volume anomaly)
    and tracks NXDOMAIN/refused and blocked-connection rates per app as a distinct covert-channel signal.
    The aim is to catch bulk or covert exfiltration of harvested calendar data even when the destination
    is not yet known-bad. Thresholds should be derived per fleet from labeled flows. A positive result
    indicates abnormal egress for an app that can read the calendar; a negative result is reassuring but
    should be combined with beaconing and ML detectors. Source citations: [Andromaly](https://link.springer.com/article/10.1007/s10844-010-0148-x);
    [CorrNetDroid](https://arxiv.org/abs/2503.01396); [Nadler et al.](https://arxiv.org/abs/1709.08395);
    [CICAndMal2017](https://www.unb.ca/cic/datasets/andmal2017.html).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Mobile Device Management (MDM) Application Inventory
  - Threat Intelligence Feeds
  - 'NAI: Corporate network gateways, VPN concentrators, DNS resolvers, and MDM/UEM platforms monitoring
    mobile device traffic and application installations.'
  range: Last 90 days (use >=30 days of history to establish per-device/fleet baselines)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "index=zeek sourcetype=conn app IN (calendar_perm_apps)\n| stats sum(orig_bytes) as sess_bytes\
      \ count as reqs by app, session_id\n| eventstats perc99.5(sess_bytes) as p995 by app\n| append [\
      \ search sourcetype=dns | eval ent=shannon(subdomain), qlen=len(query)\n    | stats avg(ent) as\
      \ dns_entropy dc(subdomain) as uniq_sub by app ]\n| eventstats avg(eval(rcode IN (NXDOMAIN,REFUSED)))\
      \ as fail_rate by app\n| where sess_bytes > p995 OR dns_entropy > 3.5 OR fail_rate > baseline"
- question: '[Collection] Detect low-jitter beaconing: have you determined whether ''detect low-jitter
    beaconing'' is warranted on managed mobile devices, using the Statistical Method approach described,
    to answer the intelligence requirement — Is an adversary collecting calendar entries from managed
    mobile devices? (PIR)'
  context: 'Tactic relevance (Collection): Is an adversary collecting calendar entries from managed mobile
    devices? (PIR) This question operationalizes a Statistical Method detection for MITRE ATT&CK T1636.001
    (Calendar Entries) on Android/iOS. This method applies FFT/autocorrelation over connection inter-arrival
    times per device/destination to detect periodic exfiltration heartbeats that remain detectable despite
    jitter, then suppresses benign periodic services (NTP, push, telemetry) via allowlisting. Automated
    calendar-data exfiltration often manifests as small, regular callbacks rather than large transfers,
    so periodicity is a key signal even when volume is low. A positive result (a strong dominant period
    to a non-benign destination) points to an implanted beacon and warrants pivoting on the app holding
    calendar access; a negative result reduces but does not eliminate suspicion of low-and-slow exfiltration.
    Source citations: [BAYWATCH](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Mobile Device Management (MDM) Application Inventory
  - Threat Intelligence Feeds
  - 'NAI: Corporate network gateways, VPN concentrators, DNS resolvers, and MDM/UEM platforms monitoring
    mobile device traffic and application installations.'
  range: Last 90 days (use >=30 days of history to establish per-device/fleet baselines)
  queries:
  - technology: Zeek/Stats pseudocode
    query: "read conn.log | group by device_ip, dest_ip\n| deltas = inter_arrival_times(connections)\n\
      | period = FFT_autocorrelation(deltas).dominant_period\n| if period_strong AND jitter_low AND dest\
      \ not in benign_periodic_allowlist:\n    raise_alert(\"calendar-app beacon\", device_ip, dest_ip,\
      \ period)"
- question: '[Collection] Detect anomalous outbound spikes per device: have you determined whether ''detect
    anomalous outbound spikes per device'' is warranted on managed mobile devices, using the Machine Learning
    approach described, to answer the intelligence requirement — Is an adversary collecting calendar entries
    from managed mobile devices? (PIR)'
  context: 'Tactic relevance (Collection): Is an adversary collecting calendar entries from managed mobile
    devices? (PIR) This question operationalizes a Machine Learning detection for MITRE ATT&CK T1636.001
    (Calendar Entries) on Android/iOS. This unsupervised approach trains one-class models (Isolation Forest,
    autoencoder, or OC-SVM) only on benign hourly outbound volume and flow features (bytes, inter-arrival
    time, up/down ratio) per device from Zeek conn.log, alerting when reconstruction error or anomaly
    score exceeds three standard deviations above the mean. Encrypted-traffic app fingerprinting attributes
    the flow to an app and flags flows matching no known app. The top-3 contributing features (e.g., orig_bytes,
    destination rarity, IAT regularity) are included in alert text to speed triage. This catches novel
    exfiltration patterns the deterministic rules miss; a positive result is an anomalous device-level
    egress that should be tied back to calendar-permission apps, while a negative result supports but
    does not prove benign behavior. Source citations: [IoT One-Class](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/);
    [CorrNetDroid](https://arxiv.org/abs/2503.01396); [FlowPrint](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24412-paper.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Mobile Device Management (MDM) Application Inventory
  - Threat Intelligence Feeds
  - 'NAI: Corporate network gateways, VPN concentrators, DNS resolvers, and MDM/UEM platforms monitoring
    mobile device traffic and application installations.'
  range: Last 90 days (use >=30 days of history to train baselines; correlate within session windows)
  queries:
  - technology: ML/pseudocode
    query: "X = per_device_hourly(orig_bytes, iat, up_down_ratio, dest_rarity)  # benign-only train\n\
      model = IsolationForest()/Autoencoder()/OCSVM()\nscore = model.anomaly_score(X)\napp = FlowPrint.fingerprint(flow)\
      \  # attribute flow to app\nif score > mean + 3*std or app is None:\n    raise_alert(top3=feature_contributions(X)[:3],\
      \ unmatched_app=(app is None))"
- question: '[Collection] Alert on calendar permissions outside allowlist: have you determined whether
    ''alert on calendar permissions outside allowlist'' is warranted on managed mobile devices, using
    the Symbolic Logic approach described, to answer the intelligence requirement — Is an adversary collecting
    calendar entries from managed mobile devices? (PIR)'
  context: 'Tactic relevance (Collection): Is an adversary collecting calendar entries from managed mobile
    devices? (PIR) This question operationalizes a Symbolic Logic detection for MITRE ATT&CK T1636.001
    (Calendar Entries) on Android/iOS. This deterministic check ingests MDM/MTD inventory and tests apps
    holding READ_CALENDAR/WRITE_CALENDAR or NSCalendarsUsageDescription against allow/deny lists — alerting
    medium for non-allowlisted apps and high for denylisted apps — and flags calendar-permission requests
    inconsistent with the app''s stated function during vetting. Because most apps have no legitimate
    need for calendar access, an unsanctioned app holding the permission is the earliest, cheapest indicator
    that an adversary has positioned capability for T1636.001 collection. A positive result identifies
    an app to investigate and potentially remediate (revoke permission/uninstall); a negative result means
    current inventory is within policy but should be re-evaluated as apps and permissions change. Source
    citations: [NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf);
    [ATT&CK T1636.001](https://attack.mitre.org/techniques/T1636/001/); [NIST SP 800-163r1](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-163r1.pdf).'
  answer_sources:
  - Mobile Device Management (MDM) Application Inventory
  - Mobile Threat Defense (MTD) Scan Results
  - Public App Store Metadata
  - 'NAI: Mobile Device Management (MDM) platform, Mobile Threat Defense (MTD) platform, and public application
    stores (e.g., Google Play, Apple App Store).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=mdm (source=MDM.AppInventory OR source=MTD.ScanResults)

      | where perms IN ("READ_CALENDAR","WRITE_CALENDAR") OR ios_key="NSCalendarsUsageDescription"

      | lookup AppAllowlist package_name OUTPUT allow_state

      | eval severity=case(allow_state="deny","high", isnull(allow_state),"medium")

      | eval vetting_flag=if(calendar_perm AND stated_function NOT_NEEDS_calendar,1,0)

      | where severity!="" OR vetting_flag=1 | table device_id, package_name, severity'
- question: '[Collection] Score low-prevalence risky categories: have you determined whether ''score low-prevalence
    risky categories'' is warranted on managed mobile devices, using the Statistical Method approach described,
    to answer the intelligence requirement — Is an adversary collecting calendar entries from managed
    mobile devices? (PIR)'
  context: 'Tactic relevance (Collection): Is an adversary collecting calendar entries from managed mobile
    devices? (PIR) This question operationalizes a Statistical Method detection for MITRE ATT&CK T1636.001
    (Calendar Entries) on Android/iOS. This statistical scoring focuses on calendar-permission apps not
    on the allowlist, computing fleet installation prevalence and assigning risk points for low prevalence
    and high-risk categories (e.g., Games, Social) that should not need calendar access, and flagging
    apps that exceed a tuned threshold for review. Rare high-privilege permission combinations are strong
    malware signals, so the count of dangerous permissions co-requested with calendar access is also tracked.
    Rarity plus a category mismatch is a classic profile for targeted or trojanized apps. A positive result
    queues a suspicious app for analyst review; a negative result indicates the app looks ordinary by
    prevalence and category but should still be weighed against network-side detectors. Source citations:
    [Significant Permissions](https://arxiv.org/pdf/2103.00643).'
  answer_sources:
  - Mobile Device Management (MDM) Application Inventory
  - Mobile Threat Defense (MTD) Scan Results
  - Public App Store Metadata
  - 'NAI: Mobile Device Management (MDM) platform, Mobile Threat Defense (MTD) platform, and public application
    stores (e.g., Google Play, Apple App Store).'
  range: Last 90 days (use >=30 days of history to establish per-device/fleet baselines)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=mdm source=MDM.AppInventory perms IN ("READ_CALENDAR","WRITE_CALENDAR")

      | where allow_state!="allow"

      | stats dc(device_id) as installs by package_name, category, dangerous_perm_count

      | eventstats dc(device_id) as fleet | eval prevalence=installs/fleet

      | eval risk=0 + if(prevalence<0.01,3,0) + if(category IN ("Games","Social"),2,0) + dangerous_perm_count

      | where risk > tuned_threshold | sort - risk'
- question: '[Collection] Rank apps with a risk classifier: have you determined whether ''rank apps with
    a risk classifier'' is warranted on managed mobile devices, using the Machine Learning approach described,
    to answer the intelligence requirement — Is an adversary collecting calendar entries from managed
    mobile devices? (PIR)'
  context: 'Tactic relevance (Collection): Is an adversary collecting calendar entries from managed mobile
    devices? (PIR) This question operationalizes a Machine Learning detection for MITRE ATT&CK T1636.001
    (Calendar Entries) on Android/iOS. This machine-learning detector uses a Random Forest/SVM/MLP over
    a compact set of significant features (permission count and combinations, developer reputation, app
    category, rating variance, enterprise prevalence) to score calendar-access apps by malice probability
    for analyst queueing, surfacing the top-3 contributing features (e.g., low prevalence, dangerous-permission
    count, untrusted developer) in each alert. It generalizes beyond hand-tuned rules to rank the riskiest
    apps first. A high score prioritizes an app for vetting and possible removal; a low score deprioritizes
    but does not clear it, and should be combined with the deterministic allowlist and network exfiltration
    questions. Source citations: [Significant Permissions](https://arxiv.org/pdf/2103.00643); [Mobile
    malware survey](https://arxiv.org/pdf/1801.02837).'
  answer_sources:
