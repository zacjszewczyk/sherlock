    devices? (PIR) This question operationalizes a Machine Learning detection for MITRE ATT&CK T1636.001
    (Calendar Entries) on Android/iOS. This machine-learning approach ties sensitive calendar-source reads
    to network sinks via information-flow (taint) tracking, learning benign source-to-sink behavior and
