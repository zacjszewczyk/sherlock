    result is high-confidence exfiltration evidence; a negative result indicates no tainted/anomalous
    sequence was observed but should be corroborated with the timing and volume detectors. Source citations:
    [TaintDroid](https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Enck.pdf); [IoT One-Class](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/).'
