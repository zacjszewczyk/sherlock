    query: "# information-flow taint: calendar source -> network sink\nif taint(calendar_read).reaches(network_send):\n\
      \    raise_alert(\"tainted calendar data to network\")\nseq = (process_name, file_path_accessed,\
      \ destination_ip)\nscore = OneClass/SequenceModel.score(seq)\nif matches(\"non_system_process ->\
