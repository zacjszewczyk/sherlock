name: 'T1636.001: Calendar Entries'
id: d1292cb8-6968-4e83-ab3d-cf9894fbc38a
description: This playbook helps an analyst investigate MITRE ATT&CK T1636.001 (Calendar Entries) on managed
  Android and iOS mobile devices, where an adversary abuses standard operating system APIs (Android Calendar
  Content Provider, iOS EventKit) — or, on jailbroken/rooted devices, direct access to the calendar database
  — to harvest calendar entries containing sensitive meeting subjects, attendees, locations, and dial-in
  details. It supports the Collection mission question by chaining capability acquisition (an app holding
  READ_CALENDAR/WRITE_CALENDAR on Android or NSCalendarsUsageDescription on iOS, especially when non-allowlisted,
  low-prevalence, or in a category that should not need calendar access) to source-to-sink exfiltration
  (calendar reads followed by outbound network flows to malicious, rare, or non-allowlisted destinations)
  and high-risk direct database access on rooted/jailbroken devices. The questions combine deterministic
  allowlist/threat-intel/permission checks (Symbolic Logic), statistical baselining (outbound volume,
  DNS subdomain entropy, beacon periodicity, fleet prevalence, file-access-to-network timing, connection/DNS
  failure rates), and machine-learning detectors (per-device one-class anomaly models, app risk classifiers,
  information-flow/sequence models) across MDM/UEM inventory and device status, MTD scan and file-integrity
  results, public app-store metadata, and Zeek conn.log/dns.log network telemetry.
type: technique
