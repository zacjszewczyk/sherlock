      \ rating_variance, enterprise_prevalence]\np = RandomForest/SVM/MLP.predict_proba(features)[malicious]\n\
      queue_for_analyst(sort_desc=p)\nalert.top3 = feature_attribution(features)[:3]  # e.g. low prevalence,\
      \ dangerous-perm count, untrusted dev"
- question: '[Collection] Alert on calendar database access on rooted devices: have you determined whether
    ''alert on calendar database access on rooted devices'' is warranted on managed mobile devices, using
    the Symbolic Logic approach described, to answer the intelligence requirement — Is an adversary collecting
    calendar entries from managed mobile devices? (PIR)'
  context: 'Tactic relevance (Collection): Is an adversary collecting calendar entries from managed mobile
    devices? (PIR) This question operationalizes a Symbolic Logic detection for MITRE ATT&CK T1636.001
    (Calendar Entries) on Android/iOS. This deterministic join combines MDM device status with MTD file-integrity
    alerts and triggers a critical alert if a device is rooted/jailbroken and a non-system process accesses
    the calendar database path (e.g., */Calendar.sqlitedb on iOS or com.android.providers.calendar on
    Android). On a compromised-integrity device an adversary can bypass the permission model and read
    calendar data directly, so any non-system process touching the calendar DB is highly suspicious. A
    positive result is a high-confidence T1636.001 indicator on a high-risk device and should drive containment;
    a negative result depends on having file-integrity visibility, so absence is not proof of safety.
    Source citations: [ATT&CK T1636.001](https://attack.mitre.org/techniques/T1636/001/); [NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf).'
  answer_sources:
  - Mobile Device Management (MDM) Device Status
  - Mobile Threat Defense (MTD) File Integrity Monitoring Logs
  - Zeek conn.log
  - 'NAI: MDM/MTD platforms, Endpoint file systems on high-risk mobile devices, Corporate network egress
    points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=mdm source=MDM.DeviceStatus\n| where root_jailbreak_status=\"compromised\"\n| join device_id\
      \ [ search index=mtd source=MTD.FileIntegrity ]\n| where file_path IN (\"*/Calendar.sqlitedb\",\"\
      com.android.providers.calendar*\")\n    AND process NOT IN (system_processes)\n| eval severity=\"\
      critical\" | table device_id, process, file_path"
- question: '[Collection] Measure file-access-to-network timing and state: have you determined whether
    ''measure file-access-to-network timing and state'' is warranted on managed mobile devices, using
    the Statistical Method approach described, to answer the intelligence requirement — Is an adversary
    collecting calendar entries from managed mobile devices? (PIR)'
  context: 'Tactic relevance (Collection): Is an adversary collecting calendar entries from managed mobile
    devices? (PIR) This question operationalizes a Statistical Method detection for MITRE ATT&CK T1636.001
    (Calendar Entries) on Android/iOS. This statistical method, scoped to rooted/jailbroken devices, correlates
    calendar-DB access events with Zeek conn.log connections from the same device and alerts when the
    median access-to-connect delta for a process is under five seconds over a 24-hour window, elevating
    when accompanied by a volume outlier or DNS exfil signal. Failed/blocked egress attempts are profiled
    as a distinct signal. A tight, repeated read-then-send timing relationship is strong behavioral evidence
    that calendar data is being exfiltrated immediately after access. A positive result indicates a likely
    automated exfiltration loop; a negative result lowers suspicion of near-real-time exfiltration but
    not of staged/batched theft. Source citations: [Nadler et al.](https://arxiv.org/abs/1709.08395);
    [CorrNetDroid](https://arxiv.org/abs/2503.01396).'
  answer_sources:
  - Mobile Device Management (MDM) Device Status
  - Mobile Threat Defense (MTD) File Integrity Monitoring Logs
  - Zeek conn.log
  - 'NAI: MDM/MTD platforms, Endpoint file systems on high-risk mobile devices, Corporate network egress
    points'
  range: Last 90 days (use >=30 days of history to establish per-device/fleet baselines)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=mdm device_root_status="compromised"

      | join device_id, process [ search calendar_db_access_events ]

      | join device_id [ search index=zeek sourcetype=conn ]

      | eval delta = conn_time - file_access_time

      | stats median(delta) as med_delta by device_id, process (window=24h)

      | eventstats avg(eval(conn_state IN (S0,REJ,RSTO))) as fail_rate

      | where med_delta < 5s | eval severity=if(volume_outlier OR dns_exfil,"critical","high")'
