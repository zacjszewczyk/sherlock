name: 'T1604: Proxy Through Victim'
id: 9f3d3a44-ae7c-4366-86cd-1c2524029db1
description: 'This playbook helps an analyst investigate whether a managed Android mobile device is being
  abused as a proxy server (commonly a SOCKS proxy) to relay an adversary''s command-and-control or other
  malicious traffic, masquerading it as legitimate traffic that originates from the compromised device
  in order to evade IP-based restrictions and alerts on services such as bank accounts and social media.
  It guides the hunt across four behavioral lines of evidence: (1) anomalously large outbound data volume
  relative to the device''s own history and its peer group; (2) bursty resolution of and connection to
  an unusually high number of unique, high-entropy destination domains/IPs characteristic of automated
  relaying rather than human browsing; (3) outbound connections on proxy-associated ports (e.g., SOCKS/1080,
  3128, 8080, 8888) or ports inconsistent with the apps in the device''s MDM inventory, correlated with
  the responsible app/process; and (4) relay-structure signatures such as high concurrent outbound connections,
  exceptionally long-lived sessions, near-symmetric byte ratios, and inbound-to-outbound session bridging.
  Each line combines symbolic-logic rules, statistical baselining/outlier tests, and machine-learning
  models so the analyst can confirm or refute unauthorized proxying with defensible evidence under the
  Defense Evasion tactic.'
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Is a managed mobile device transmitting an extreme spike of outbound data within a short window
    (for example more than 5 GB in 1 hour) that cannot be attributed to sanctioned activity such as OS
    updates or cloud backups?
  context: A device coerced into acting as a proxy must push the relayed payload back out to the Internet,
    producing outbound (orig_bytes) volume far beyond what a normal mobile client generates. Under Defense
    Evasion the adversary relies on this traffic blending in with the device's legitimate flows, so a
    hard volume threshold gives a fast, high-confidence trip-wire. Sum orig_bytes per device IP over rolling
    windows and alert past a static threshold, excluding known-good destinations (corporate backup servers,
    OS-update CDNs) via an explicit allowlist to control false positives, mirroring the legitimate-relay-pair
    allowlisting used in stepping-stone detection. A positive result is a device exceeding the threshold
    to a non-allowlisted destination; a negative result is volume attributable to sanctioned services.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Corporate Wi-Fi network segments, VPN gateways, and network egress points monitoring traffic
    from mobile device subnets.'
  range: Last 90 days (evaluate in 1-hour and 24-hour windows)
  queries:
  - technology: Zeek/pseudocode
    query: 'from conn.log where id.orig_h in mobile_subnets

      bucket by id.orig_h, window=1h

      sum_orig = sum(orig_bytes)

      where resp_h not in allowlist(backup_servers, os_update_cdns)

      alert when sum_orig > 5GB'
- question: Does a device's outbound byte volume exceed its own 30-day moving baseline by more than 3
    standard deviations, or exceed the 99th percentile of its peer group, in any 1-hour window?
  context: Static thresholds miss low-and-slow proxying and over-fire on naturally heavy devices. A per-device
    and per-peer-group statistical baseline adapts to normal behavior and flags relative anomalies that
    are the hallmark of unauthorized resource use under Defense Evasion. For each device sum orig_bytes
    in 1-hour windows, compute a 30-day moving average and standard deviation for the device and for its
    peer group, and alert when a window exceeds 3 sigma above the device mean or the 99th percentile of
    the peer group. Thresholds derive from the bytes/sec and volume distributions known to separate tunneled
    from interactive traffic. A positive result is a sustained statistical excursion; investigate whether
    it coincides with proxy-port or fan-out signatures.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Corporate Wi-Fi network segments, VPN gateways, and network egress points monitoring traffic
    from mobile device subnets.'
  range: Last 90 days (30-day rolling baseline, 1-hour evaluation windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for each device, window=1h: vol = sum(orig_bytes)

      mean,std = rolling_stats(vol, lookback=30d) per device

      peer_p99 = percentile(peer_group_vol, 99)

      alert when vol > mean + 3*std OR vol > peer_p99'
- question: Do a device's sessions show near-symmetric upstream/downstream byte ratios that deviate more
    than 2 standard deviations from its 30-day baseline, indicating bridged rather than client-only traffic?
  context: Normal mobile browsing is download-skewed (small requests, large responses). A proxy that bridges
    a client and a destination relays roughly the same bytes in each direction, producing near-symmetric,
    sustained transfers. Computing orig_bytes/resp_bytes and bidirectional symmetry per 1-hour window
    exposes this relay signature that supports Defense Evasion by hiding the true origin. Alert when the
    ratio/symmetry is more than 2 standard deviations from the device's 30-day baseline, using flow byte-ratio
    features validated on encrypted/VPN-shaped traffic. A positive result is persistent symmetry uncharacteristic
    of the user; a negative result is the usual download-heavy skew.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Corporate Wi-Fi network segments, VPN gateways, and network egress points monitoring traffic
    from mobile device subnets.'
  range: Last 90 days (30-day rolling baseline, 1-hour evaluation windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for each device, window=1h:

      ratio = sum(orig_bytes)/max(sum(resp_bytes),1)

      sym = symmetry(orig_bytes, resp_bytes)

      mean,std = rolling_stats(ratio, 30d) per device

      alert when |ratio-mean| > 2*std OR sym ~ 1.0 (sustained)'
- question: When modeled as a time series, does a device's hourly outbound volume exceed its forecast
    confidence interval, or trigger high autoencoder reconstruction error on bandwidth/packet-rate features?
  context: Seasonal forecasting (SARIMA/Prophet) on >=90 days of hourly outbound volume learns each device's
    normal diurnal/weekly rhythm; observations beyond the forecast confidence interval flag anomalies
    that simple thresholds miss, supporting detection of stealthy proxying under Defense Evasion. As a
    label-free online alternative, score per-device bandwidth/packet-rate features with an autoencoder
    ensemble and alert on reconstruction-error spikes, surfacing the top-3 contributing features (outbound
    bytes/sec, packet rate, jitter) in the alert. Retrain on schedule to handle concept drift. A positive
    result is a forecast breach or error spike whose driving features point to relay-like bandwidth use.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Corporate Wi-Fi network segments, VPN gateways, and network egress points monitoring traffic
    from mobile device subnets.'
  range: Last 90 days minimum for training; score hourly
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = SARIMA_or_Prophet(device_hourly_outbound, train>=90d)

      forecast, ci = model.predict(next_hours)

      alert when observed > ci_upper

      alt: ae = autoencoder(bandwidth,pkt_rate,jitter)

      alert when recon_error spikes; report top3 features'
- question: Is a device resolving an unusually high number of unique domains (for example more than 100)
    within a 5-minute window that are not on an allowlist of common corporate and popular domains?
  context: Automated proxying fans out to many destinations on behalf of the relayed client, producing
    bursts of unique DNS resolutions that human-driven browsing rarely matches. Under Defense Evasion
    this fan-out is how a single victim device fronts traffic for varied adversary targets. From Zeek
    dns.log, count unique queried domains per device IP in 5-minute windows and alert when the count is
    high and the domains are not on an allowlist of common corporate/popular domains, prioritizing newly-observed-enterprise-wide
    domains. A positive result is a burst of rare unique domains; a negative result is repeated resolution
    of a few known domains.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Internal DNS servers, network firewalls, and web proxies that log DNS queries and outbound connections
    from mobile devices.'
  range: Last 90 days (5-minute evaluation windows)
  queries:
  - technology: Zeek/pseudocode
    query: 'from dns.log where id.orig_h in mobile_subnets

      bucket by id.orig_h, window=5m

      uniq = distinct(query) not in allowlist(common_domains)

      alert when count(uniq) > 100

      boost priority if domains newly_observed_enterprise_wide'
- question: Within a 1-hour window, does a device's count of unique second-level domains exceed the 98th
    percentile of its peer group while the Shannon entropy of that SLD set is more than 2 standard deviations
    above its 30-day baseline?
  context: Proxying produces both high domain diversity and high randomness (entropy) in the resolved-domain
    set, unlike the patterned, repetitive resolutions of normal use. Combining a peer-relative unique-SLD
    count with a device-relative entropy excursion catches automated relaying that either metric alone
    would miss, reinforcing Defense Evasion detection. Per device per 1-hour window compute the unique-SLD
    count and the Shannon entropy of the SLD set; alert when the count exceeds the 98th peer-group percentile
    and entropy exceeds the 30-day baseline by more than 2 sigma. A positive result is simultaneous diversity
    and entropy outliers.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Internal DNS servers, network firewalls, and web proxies that log DNS queries and outbound connections
    from mobile devices.'
  range: Last 90 days (30-day baseline, 1-hour evaluation windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for each device, window=1h:

      slds = distinct(second_level_domain(query))

      cnt = count(slds); ent = shannon_entropy(slds)

      mean,std = rolling_stats(ent, 30d) per device

      alert when cnt > peer_p98 AND ent > mean + 2*std'
- question: Using a sequential probability ratio test on first-contact resolutions and connections, is
    a device's failed-to-successful ratio (NXDOMAIN/rcode!=NOERROR and conn_state!=SF) elevated consistent
    with fan-out relaying?
  context: A relay reaching out to many destinations on demand hits more dead ends than a human, so its
    first-contact DNS and TCP attempts show elevated failure rates (NXDOMAIN or rcode!=NOERROR in dns.log;
    RST/REJ/timeouts where conn_state!=SF in conn.log). Modeling each first contact as a Bernoulli trial
    and applying Wald's SPRT to the failed-to-successful ratio flags this quickly with tunable error bounds,
    the same hypothesis-testing approach used for fast portscan detection. Under Defense Evasion, this
    surfaces automated proxy behavior even when volume is modest. A positive result is the SPRT crossing
    the malicious threshold.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Internal DNS servers, network firewalls, and web proxies that log DNS queries and outbound connections
    from mobile devices.'
  range: Last 90 days (sequential, per device)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for each device, stream first-contact resolutions/conns:

      trial = fail if (dns rcode!=NOERROR) or (conn_state!=SF) else success

      update SPRT(fail_ratio) with bounds (alpha,beta)

      alert when SPRT crosses H1 (relay) threshold'
- question: Does an Isolation Forest over per-device hourly DNS/connection features (unique destination
    IPs, unique DNS queries, SLD entropy, DNS failure ratio, TCP failure ratio) flag the device as a strong
    outlier with relay-like driving features?
  context: Single metrics can be evaded; an Isolation Forest jointly models per-device 1-hour features
    from dns.log and conn.log (unique destination IP count, unique DNS query count, SLD entropy, ratio
    of failed-to-successful DNS queries, ratio of failed-to-successful TCP connections) to isolate the
    multidimensional anomaly that proxying creates. Flag strong outliers and surface the top-3 contributing
    features (e.g., unique-IP count, failure ratio, entropy) for explainable triage under Defense Evasion.
    A positive result is a high anomaly score whose top features describe fan-out/relay behavior; a negative
    result is a feature vector near the normal cluster.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Internal DNS servers, network firewalls, and web proxies that log DNS queries and outbound connections
    from mobile devices.'
  range: Last 90 days for training; score hourly
  queries:
  - technology: SIEM/ML pseudocode
    query: "feat = [uniq_dst_ip, uniq_dns_q, sld_entropy,\n        dns_fail_ratio, tcp_fail_ratio] per\
      \ device, 1h\nmodel = IsolationForest(feat, train=90d)\nalert when score is strong outlier; report\
      \ top3 features"
- question: Is a managed device connecting to known proxy ports (1080, 3128, 8080, 8888) where the responsible
    app has no approved VPN, browser, or remote-access role per MDM app inventory?
  context: SOCKS and HTTP proxy listeners commonly use ports 1080/3128/8080/8888. A managed app that originates
    such traffic but holds no VPN/tunneling/browser/remote-access role is a strong proxy indicator under
    Defense Evasion. In Zeek conn.log and firewall logs alert on connections from the mobile subnet to
    these ports (excluding approved internal services), correlate with MDM.AppInventoryLogs, and where
    possible bind the flow to the responsible app/process and OS socket/Proxy-API call so a policy-violating
    managed app raises a high-priority alert. A positive result is proxy-port traffic attributed to an
    unauthorized app role; a negative result is traffic from a sanctioned VPN/browser app.
  answer_sources:
  - Zeek conn.log
  - MDM.AppInventoryLogs
  - Firewall Logs
  - 'NAI: Network flow collectors at egress points, firewall logs, and MDM/EMM management platforms.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'from conn.log + firewall where id.orig_h in mobile_subnets

      and id.resp_p in {1080,3128,8080,8888}

      and resp_h not in approved_internal_services

      join MDM.AppInventoryLogs on device,app

      alert HIGH when app.role not in {vpn,browser,remote_access}'
- question: In a rolling 1-hour window, does a device's ratio of connections to rare (non-baseline) destination
    ports versus common ports exceed the 95th percentile of its peer group?
  context: Building a 30-day baseline of each device's normal destination ports lets us detect the emergence
    of rare ports that accompany tunnel/relay flows under Defense Evasion. In a rolling 1-hour window
    compute the ratio of connections to non-baseline ports versus common ports and alert when it exceeds
    the 95th peer-group percentile. This catches proxying on non-standard ports that a fixed proxy-port
    list would miss. A positive result is a sustained shift toward rare ports; a negative result is continued
    use of the device's normal port profile.
  answer_sources:
  - Zeek conn.log
  - MDM.AppInventoryLogs
  - Firewall Logs
  - 'NAI: Network flow collectors at egress points, firewall logs, and MDM/EMM management platforms.'
  range: Last 90 days (30-day baseline, 1-hour evaluation windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline_ports = top_ports(device, lookback=30d)

      for each device, window=1h:

      rare = count(conn where id.resp_p not in baseline_ports)

      ratio = rare / max(total_conn,1)

      alert when ratio > peer_p95'
- question: Can a suspected relay be confirmed via passive VPN/proxy fingerprinting (byte patterns, packet
    sizes, server-response behavior) or optional active probing of the suspected listener?
  context: Before escalating, confirm a flagged device is truly relaying by applying passive fingerprints
    (byte patterns, packet sizes, server-response behavior) and, where authorized, active probing of the
    suspected listener, techniques that flag VPN/proxy flows at line rate with negligible false positives.
    Combine this with the inbound-to-outbound bridging check so a confirmed tunnel under Defense Evasion
    is backed by concrete protocol evidence. A positive result is a fingerprint/probe match identifying
    a proxy or tunnel listener; a negative result weakens the proxy hypothesis and redirects triage.
  answer_sources:
  - Zeek conn.log
  - MDM.AppInventoryLogs
  - Firewall Logs
  - 'NAI: Network flow collectors at egress points, firewall logs, and MDM/EMM management platforms.'
  range: Last 90 days (targeted at flagged devices; event-centered)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'for device in flagged:

      match passive_fingerprint(byte_patterns,pkt_sizes,resp_behavior)

      optional active_probe(suspected_listener_port)

      confirm if fingerprint==vpn/proxy AND inbound_outbound_bridge'
- question: Does a per-device one-class SVM over connection features (destination port, protocol, duration)
    flag flows as anomalous, especially unseen ports/protocols or HTTPS-disguised SOCKS/relay channels?
  context: A one-class SVM trained per device or device-group on historical connection features (destination
    port, protocol, duration) learns the normal envelope and flags deviations, emphasizing unseen ports/protocols
    that proxying introduces under Defense Evasion. Optionally classify the flow's application/tunnel
    identity from metadata to expose a SOCKS/relay channel disguised as HTTPS. Surface the top-3 features
    (port, protocol, duration) driving the score for explainable triage. A positive result is an anomalous
    flow whose features indicate a hidden relay; a negative result is a flow consistent with the learned
    profile.
  answer_sources:
  - Zeek conn.log
  - MDM.AppInventoryLogs
  - Firewall Logs
  - 'NAI: Network flow collectors at egress points, firewall logs, and MDM/EMM management platforms.'
  range: Last 90 days for training; score continuously
  queries:
  - technology: SIEM/ML pseudocode
    query: 'feat = [id.resp_p, proto, duration] per conn

      model = OneClassSVM(feat, train=90d per device/group)

      alert when flow scored anomalous (esp. unseen port/proto)

      optional: classify tunnel identity; report top3 features'
- question: Does a single TCP connection from a mobile device last beyond a long-lived threshold (for
    example more than 24 hours) with conn_state=SF to a destination not on an allowlist of corporate/major-cloud
    services?
  context: Persistent C2 relays and traffic tunnels hold connections open far longer than typical mobile
    sessions. In Zeek conn.log alert on any single TCP connection from a mobile device with duration exceeding
    a static threshold (e.g., 24 hours) and conn_state=SF to a destination not on an allowlist of corporate/major-cloud
    services. Under Defense Evasion this long-lived channel is how the adversary maintains a stable proxy
    without drawing attention. A positive result is an unusually durable established connection to a non-allowlisted
    host; a negative result is normal short-lived sessions or long sessions to sanctioned cloud services.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network flow collectors (e.g., Zeek sensors) at key chokepoints like the Wi-Fi access controller
    or VPN concentrator.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'from conn.log where id.orig_h in mobile_subnets

      and proto==tcp and conn_state==''SF''

      and duration > 24h

      and resp_h not in allowlist(corp, major_cloud)

      alert'
- question: Can an inbound session to the device be correlated with a near-simultaneous outbound flow
    to an unrelated destination whose ON/OFF activity envelopes match, revealing relay (stepping-stone)
    structure?
  context: The defining structure of a proxy/stepping-stone is an inbound session bridged to an outbound
    session whose timing and size envelopes track each other, even when content is encrypted. Correlate
    inbound device sessions with near-simultaneous outbound flows to unrelated destinations, matching
    their ON/OFF activity envelopes (timing/size only, content-agnostic), and alert on coincident bridges
    not on an allowlist of legitimate relay pairs (VPN concentrators, bastions). This directly evidences
    Defense Evasion through traffic relaying. A positive result is a content-agnostic timing match between
    an inbound and outbound flow; a negative result is no correlated outbound counterpart.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network flow collectors (e.g., Zeek sensors) at key chokepoints like the Wi-Fi access controller
    or VPN concentrator.'
  range: Last 90 days (event-centered correlation around inbound sessions)
  queries:
  - technology: Zeek/pseudocode
    query: "inbound = conn where resp_h==device\noutbound = conn where orig_h==device\nfor each inbound:\
      \ find outbound with overlapping ON/OFF\n  envelopes (timing/size) within small lag\nalert when\
      \ bridge_pair not in allowlist(vpn,bastion)"
- question: In 5-minute intervals, does a device's concurrent outbound connection count and average session
    duration register as a multivariate outlier (Mahalanobis distance) against its 30-day profile?
  context: A relay sustains many concurrent outbound connections, often with low-variance long durations,
    a joint signature better captured multivariately than by either metric alone. In 5-minute intervals
    compute per device the count of active outbound connections and the average duration of connections
    terminating in the interval, then apply a Mahalanobis-distance outlier test against the device's 30-day
    profile. Sustained high concurrency with long, steady durations is the relay signature seen in bandwidth-abuse
    flow statistics, supporting Defense Evasion detection. A positive result is a large Mahalanobis distance
    from the device's normal profile.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network flow collectors (e.g., Zeek sensors) at key chokepoints like the Wi-Fi access controller
    or VPN concentrator.'
  range: Last 90 days (30-day profile, 5-minute evaluation intervals)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for each device, interval=5m:

      x = [active_outbound_conn_count, avg_duration_terminated]

      mu,cov = profile(device, lookback=30d)

      d = mahalanobis(x, mu, cov)

      alert when d > chi2_threshold'
- question: When the fleet is clustered on 24-hour relay features (avg concurrent outbound connections,
    95th-percentile duration, total outbound bytes, byte-ratio), does a device fall out as a DBSCAN noise
    point or trigger high autoencoder reconstruction error?
  context: Fleet-wide clustering reveals devices that behave unlike their peers. Apply DBSCAN to the device
    population using 24-hour features (average concurrent outbound connections, 95th-percentile duration,
    total outbound bytes, byte-ratio); noise points are behavioral outliers prioritized for triage as
    potential relays under Defense Evasion. As an online complement, score per-device flow features with
    an autoencoder ensemble and alert on reconstruction error, reporting the top-3 contributing features.
    A positive result is a device labeled noise or showing an error spike with relay-like driving features;
    a negative result is membership in a normal behavioral cluster.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network flow collectors (e.g., Zeek sensors) at key chokepoints like the Wi-Fi access controller
    or VPN concentrator.'
  range: Last 90 days (24-hour feature windows)
  queries:
  - technology: SIEM/ML pseudocode
    query: "feat = [avg_concurrent_outbound, dur_p95,\n        total_outbound_bytes, byte_ratio] per device,\
      \ 24h\nlabels = DBSCAN(feat)\nflag noise_points for triage\nalt: autoencoder recon_error; report\
      \ top3 features"
