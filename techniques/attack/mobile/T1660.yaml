questions:
- question: Are mobile devices (identified by DHCP/MDM-mapped IP ranges and mobile-browser User-Agents)
    resolving or connecting to domains that appear on phishing/URL-shortener threat-intel feeds, or to
    domains within Damerau-Levenshtein distance 1-2 (including homoglyph and TLD-swap variants) of a protected
    brand or partner domain?
  context: Initial Access via mobile phishing frequently begins with a victim's device contacting adversary-controlled
    infrastructure. This symbolic-logic check monitors Zeek dns.log for queries from mobile IP ranges
    to domains that match curated phishing and URL-shortener threat-intel lists, alerts at high severity,
    and enriches each hit with the User-Agent from Zeek http.log to confirm a mobile origin. Because pure
    intel matching misses freshly stood-up infrastructure, maintain a deterministic floor that also flags
    any destination within Damerau-Levenshtein distance 1-2 of your protected brand/partner domains plus
    homoglyph and TLD-swap variants, and pre-seed that watchlist from newly issued certificates naming
    your brand in Certificate Transparency logs. A positive hit means a mobile device reached known or
    lookalike phishing infrastructure and should be triaged immediately for credential entry or malware
    delivery; a negative result lowers but does not eliminate suspicion since novel domains evade static
    feeds.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek conn.log
  - External WHOIS data
  - 'NAI: Corporate and guest Wi-Fi network segments, VPN concentrators, Mobile Device Management (MDM)
    logs, and network egress points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      dns = zeek_dns(); http = zeek_http();
      mobile = dns where src_ip in mdm_dhcp_mobile_ranges;
      alert when mobile.query in ti_feed['phishing_domains','url_shorteners']
        or damerau_levenshtein(mobile.query, protected_brand_domains) <= 2
        or is_homoglyph_or_tldswap(mobile.query, protected_brand_domains)
        or mobile.query in ct_log_lookalike_watchlist;
      enrich with http.user_agent (confirm mobile browser/WebView);
      output src_ip, query, user_agent, match_reason, severity=high
- question: For each DNS query originating from a mobile device, does a composite risk score built from
    character entropy/label length (above the 98th percentile), domain age under 30 days (WHOIS), and
    TLD rarity (top 1% over 30 days) reach an alerting threshold, and is the device also exhibiting an
    elevated NXDOMAIN rate or anomalous credential-POST byte ratios?
  context: 'Adversaries running mobile phishing campaigns register disposable domains that are often algorithmically
    generated, very new, and on cheap or uncommon TLDs. This statistical method computes a per-query risk
    score from character entropy and label length above the 98th percentile, WHOIS-derived domain age
    under 30 days, and TLD rarity in the top 1% over a 30-day window, alerting when two or more signals
    fire and a mobile browser/WebView User-Agent is confirmed in Zeek http.log. Add failure-mode and volume
    signals: flag devices whose NXDOMAIN rate exceeds 3x their 30-day baseline (a sign of resolving dead
    phishing infrastructure) and credential-POST sessions with an anomalous bytes-out/bytes-in ratio.
    Passive-DNS prevalence, first-seen, and TTL features sharpen the rarity estimate. A high score points
    to a device interacting with throwaway phishing infrastructure tied to Initial Access.'
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek conn.log
  - External WHOIS data
  - 'NAI: Corporate and guest Wi-Fi network segments, VPN concentrators, Mobile Device Management (MDM)
    logs, and network egress points.'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: |-
      for q in zeek_dns where src_ip in mobile_ranges:
        score = 0
        if entropy(q.domain) > p98 or label_len(q.domain) > p98: score += 1
        if whois_age_days(q.domain) < 30: score += 1
        if tld_rarity(q.tld) in top1pct_over_30d: score += 1
        ua_mobile = lookup zeek_http.user_agent(q) is mobile_browser_or_webview
        alert when score >= 2 and ua_mobile;
        flag device when nxdomain_rate(src_ip) > 3 * baseline_30d(src_ip);
        flag session when cred_post and bytes_out/bytes_in anomalous;
        enrich rarity with passive_dns(prevalence, first_seen, ttl)
- question: When a logistic-regression baseline (domain length, entropy, n-gram profile, TLD rarity, subdomain
    dictionary-word count, domain age) or a character+word-level CNN scoring the full URL is applied to
    mobile-originated web traffic, do any destinations exceed a malicious probability of 0.9, and which
    top-3 features drove that score?
  context: Threat-intel and fixed heuristics cannot keep pace with the volume of new phishing domains,
    so this machine-learning layer generalizes to unseen infrastructure. A logistic-regression baseline
    over domain length, entropy, n-gram profile, TLD rarity, subdomain dictionary-word count, and domain
    age provides an interpretable first pass (alert when malicious probability exceeds 0.9), while a character-
    and word-level CNN (URLNet) scores the entire URL string to catch obfuscated or previously unseen
    domains that evade lists. Surfacing the top-3 contributing features (for example domain age, entropy,
    TLD) via SHAP attributions in the alert text gives the analyst defensible reasoning for triage. A
    high-probability classification on mobile traffic indicates a likely phishing destination supporting
    Initial Access; review the device, user, and any subsequent credential submission.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek conn.log
  - External WHOIS data
  - 'NAI: Corporate and guest Wi-Fi network segments, VPN concentrators, Mobile Device Management (MDM)
    logs, and network egress points.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      features = [domain_len, entropy, ngram_profile, tld_rarity, subdomain_dict_words, domain_age]
      p_lr = logistic_regression.predict_proba(features)
      p_cnn = urlnet.score(full_url)         # char+word level CNN
      malicious = max(p_lr, p_cnn)
      alert when malicious > 0.9 and src_ip in mobile_ranges;
      explain = shap_top3(features)          # e.g. domain_age, entropy, tld
      output url, malicious_prob, explain
- question: Do any TLS connections from mobile devices present certificates that match threat-intel fingerprints,
    are self-signed for external domains, or carry suspicious issuer strings, and do their JA3/JA4 client
    fingerprints indicate a non-browser/in-app stack impersonating a mobile browser User-Agent?
  context: Phishing sites that proxy credentials or serve malware to mobile devices often expose anomalies
    in their TLS layer. This symbolic-logic check scans Zeek ssl.log for mobile connections whose certificate
    fingerprints match threat intel, are self-signed for external domains, or carry suspicious issuer
    strings, and alerts on matches. It additionally deny-lists clients whose JA3/JA4 fingerprint reveals
    a non-browser or in-app stack masquerading behind a browser User-Agent, a common trait of phishing
    toolkits and malicious WebViews, and cross-checks the SNI against a Certificate Transparency lookalike
    watchlist. A match means the mobile device negotiated TLS with suspect infrastructure consistent with
    phishing-driven Initial Access; pivot to the destination domain, the user, and any following authentication.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek http.log
  - 'NAI: Network sensors monitoring corporate and guest Wi-Fi networks, and VPN concentrators logging
    traffic from remote mobile devices.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      ssl = zeek_ssl(); http = zeek_http();
      mobile = ssl where src_ip in mobile_ranges;
      alert when mobile.cert_fp in ti_cert_fingerprints
        or (mobile.self_signed and is_external(mobile.server_name))
        or mobile.issuer matches suspicious_issuer_strings;
      denylist client when ja3/ja4(mobile) is non_browser_or_inapp
        and http.user_agent claims browser;
      cross_check mobile.server_name against ct_log_lookalike_watchlist;
      output src_ip, server_name, issuer, ja3, ja4, reason
- question: Is a mobile device querying a domain that is absent from the 30-day enterprise baseline and
    requested by fewer than three users in 24 hours, and does the user's current session diverge sharply
    (Jaccard similarity below 0.2) from their 30-day profile, especially with a null/non-standard HTTP
    Referer immediately followed by a credential-form POST?
  context: Newly seen, rarely visited domains are a strong indicator of targeted mobile phishing, particularly
    QR-driven (quishing) redirects. This statistical method maintains a 30-day enterprise baseline of
    observed domains and flags mobile DNS queries to domains absent from that baseline and requested by
    fewer than three users in 24 hours, scoring rarity with passive-DNS prevalence, first-seen, and answer-dynamics
    features. It computes the Jaccard similarity of the user's current session to their 30-day profile
    and alerts when similarity drops below 0.2 for rare domains. A state signal weights up sessions exhibiting
    a null/non-standard HTTP Referer followed immediately by a credential-form POST, the expected footprint
    of a QR-code redirect where no linking page exists. A positive result suggests the device reached
    attacker infrastructure outside normal browsing patterns during Initial Access.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek http.log
  - 'NAI: Network sensors monitoring corporate and guest Wi-Fi networks, and VPN concentrators logging
    traffic from remote mobile devices.'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: |-
      baseline = enterprise_domains_seen(last_30d);
      for q in zeek_dns where src_ip in mobile_ranges:
        rare = q.domain not in baseline and distinct_users(q.domain, 24h) < 3;
        rarity = passive_dns_score(prevalence, first_seen, answer_dynamics);
        jac = jaccard(current_session(user), profile_30d(user));
        alert when rare and jac < 0.2;
        weight_up when zeek_http.referer in (null, nonstandard) and next_event == credential_post;
      output user, domain, rarity, jac
- question: When a one-class SVM or Isolation Forest trained per user/device on requested TLDs, server
    ports, protocols, JA3/JA3S hashes, connection durations, and transfer volumes is scored against live
    mobile traffic, do any connections fall out as outliers, and does a parallel URLNet score on the destination
    URL corroborate the anomaly?
  context: Each user/device has a fairly stable network fingerprint; quishing and other mobile phishing
    redirects push connections outside that envelope. This machine-learning method trains a one-class
    SVM or Isolation Forest per user/device on features such as requested TLDs, server ports, protocols,
    JA3/JA3S hashes, connection durations, and transfer volumes, then flags outlier mobile connections
    as potential phishing redirects. Scoring the destination URL with URLNet in parallel provides an independent
    signal, and reporting the top-3 deviating features per alert via SHAP makes the anomaly explainable
    for triage. A corroborated outlier indicates the device contacted infrastructure inconsistent with
    its baseline, a likely sign of phishing-driven Initial Access; investigate the destination and any
    credential activity.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek http.log
  - 'NAI: Network sensors monitoring corporate and guest Wi-Fi networks, and VPN concentrators logging
    traffic from remote mobile devices.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      model = OneClassSVM | IsolationForest trained per user/device on
        [requested_tlds, server_ports, protocols, ja3, ja3s, conn_duration, bytes];
      for c in mobile_connections:
        if model.predict(c) == outlier:
           url_score = urlnet.score(c.url)
           alert when url_score corroborates outlier;
           explain = shap_top3(c.features)
      output user, dest, outlier_score, url_score, explain
- question: Does a mobile device resolve a known URL-shortener domain whose final resolved IP matches
    phishing threat intel, and is that connection (free-CA issuer with certificate validity under 90 days
    for an external SNI) followed by a successful authentication event (Windows Event ID 4624 or Azure
    AD sign-in) for the associated user from the same source IP?
  context: URL shorteners hide the true phishing destination and are heavily used in mobile lures. This
    symbolic-logic correlation tracks DNS requests to known URL-shortener domains, resolves the final
    IPs, checks them against phishing threat intel, and alerts on matches, then correlates with subsequent
    successful authentication events (Windows Event ID 4624 or Azure AD sign-in) from the same source
    IP to detect a completed credential compromise. A deterministic certificate floor (free-CA issuer
    plus certificate validity under 90 days for an external SNI) ensures coverage even when intel is stale.
    A correlated hit is a high-confidence indicator that phishing-driven Initial Access succeeded and
    an account was accessed; treat it as an active compromise and begin containment.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - Zeek conn.log
  - Windows Event ID 4624
  - Azure AD Sign-in logs
  - 'NAI: Network egress points, VPN concentrators, Active Directory Domain Controllers, and cloud identity
    provider infrastructure (e.g., Azure AD, Okta).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      shortener_dns = zeek_dns where query in known_url_shorteners and src_ip in mobile_ranges;
      final_ip = resolve_final(shortener_dns);
      phish = final_ip in ti_phishing_infra
              OR (ssl.issuer is free_ca and cert_validity_days < 90 and is_external(ssl.server_name));
      auth = auth_events(4624 | azuread_signin) where result=success
             and src_ip == shortener_dns.src_ip within 5m;
      alert critical when phish and auth;
      output user, shortener, final_ip, auth.account, auth.time
- question: Are there mobile TLS connections whose certificate validity is in the bottom 5th percentile
    (typically under 90 days), issuer is a free CA, and SNI is typosquatted/homoglyph, and within five
    minutes is there a successful login from the same source IP (or a preceding burst of 4625 failures
    indicating credential replay)?
  context: Phishing infrastructure aimed at mobile users tends to use short-lived free-CA certificates
    on lookalike domains. This statistical method alerts on mobile TLS connections where certificate validity
    falls in the bottom 5th percentile (typically under 90 days), the issuer is a free CA, and the SNI
    is typosquatted or uses homoglyphs; the same features can pre-classify Certificate-Transparency-logged
    certificates before an attack lands. It then queries authentication logs for successful logins from
    the same source IP within five minutes and escalates on matches. A failure-mode signal -- a burst
    of failed logons (Event ID 4625) preceding a success from a mobile source IP -- indicates credential
    replay from a phishing harvest. A correlated result confirms phishing-driven Initial Access reaching
    account access.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - Zeek conn.log
  - Windows Event ID 4624
  - Azure AD Sign-in logs
  - 'NAI: Network egress points, VPN concentrators, Active Directory Domain Controllers, and cloud identity
    provider infrastructure (e.g., Azure AD, Okta).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      tls = zeek_ssl where src_ip in mobile_ranges;
      risky = cert_validity_days(tls) <= p05 (typically <90)
              and tls.issuer in free_cas
              and is_typosquat_or_homoglyph(tls.server_name);
      auth = auth_events(success) where src_ip==tls.src_ip within 5m;
      fail_burst = count(4625 where src_ip==tls.src_ip) preceding a success;
      alert when risky and (auth or fail_burst);
      output src_ip, server_name, issuer, cert_validity, auth.account
- question: Does a Stage-1 Random Forest over Zeek features (certificate validity, issuer, domain entropy,
    TLD rarity, duration, bytes) plus a URLNet URL score flag a mobile connection with probability above
    0.9, and does Stage-2 find a successful authentication within five minutes from the same source IP,
    warranting a critical alert?
  context: Combining content-based risk scoring with identity correlation yields the highest-confidence
    evidence that a mobile phishing attempt achieved Initial Access. Stage 1 runs a Random Forest over
    Zeek-derived features (certificate validity, issuer, domain entropy, TLD rarity, connection duration,
    bytes) plus a URLNet URL score to flag high-risk connections at probability above 0.9. Stage 2 searches
    for successful authentication events within five minutes from the same source IP and triggers a critical
    alert when they correlate. Emitting the top-3 contributing features per stage via SHAP makes the verdict
    defensible. A positive two-stage result strongly implies an account was compromised through mobile
    phishing; respond as an active incident, revoke sessions, and investigate the destination infrastructure.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - Zeek conn.log
  - Windows Event ID 4624
  - Azure AD Sign-in logs
  - 'NAI: Network egress points, VPN concentrators, Active Directory Domain Controllers, and cloud identity
    provider infrastructure (e.g., Azure AD, Okta).'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      # Stage 1: content risk
      feat = [cert_validity, issuer, domain_entropy, tld_rarity, duration, bytes]
      p_rf = random_forest.predict_proba(feat)
      p_url = urlnet.score(url)
      stage1 = max(p_rf, p_url) > 0.9
      # Stage 2: identity correlation
      auth = auth_events(4624 | azuread_signin, success) where src_ip==conn.src_ip within 5m
      alert critical when stage1 and auth;
      explain = shap_top3(feat) + shap_top3(url_features)
      output src_ip, url, p_rf, p_url, auth.account, explain
- question: In available SMS/MDM message content, do messages contain a URL-shortener or distance-1/2
    lookalike URL co-occurring with urgency/OTP lure keywords (e.g., 'verify', 'OTP', 'suspended', 'winner'),
    and do any inbound voice calls originate from a spoofed caller-ID or a VoIP/disposable number block?
  context: Smishing and vishing are primary mobile Initial Access vectors that may never touch the network
    sensor until after the click, so messaging and call telemetry must be inspected directly. This symbolic-logic
    check, applied to available SMS/MDM content, alerts when a message contains a URL-shortener or a Damerau-Levenshtein
    distance-1/2 lookalike URL co-occurring with urgency/OTP lure keywords such as 'verify', 'OTP', 'suspended',
    or 'winner'. For voice, it deterministically flags inbound calls whose caller-ID is spoofed or that
    originate from a VoIP/disposable number block. A positive match identifies a likely phishing lure
    or fraudulent caller targeting a user; correlate with that user's subsequent web traffic and sensitive
    actions to determine whether the lure succeeded.
  answer_sources:
  - MDM/UEM message logs
  - SMS gateway/carrier logs
  - Zeek dns.log
  - Zeek http.log
  - Unified communications / VoIP call detail records
  - Audio recordings (where lawfully captured)
  - 'NAI: MDM/UEM consoles, enterprise SMS gateways, VoIP/UC platforms (call detail records and caller-ID
    metadata), and network egress sensors observing post-click mobile traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      sms = mdm_sms_messages();
      alert when (contains_url_shortener(sms.body) or
                  min_levenshtein(extract_urls(sms.body), protected_domains) <= 2)
             and contains_any(sms.body, ['verify','OTP','suspended','winner','urgent']);
      calls = uc_cdr();
      alert when calls.caller_id_spoofed or calls.origin in voip_disposable_blocks;
      output recipient, sender, body, url, call.origin, reason
- question: Do inbound SMS messages exhibit structural patterns (high counts of URLs, shorteners, phone
    numbers, all-caps/character-stylistic cues) that statistically discriminate smishing, and do any call
    sources show anomalous volume/frequency (fan-out calls per minute), elevated VoIP-origin rate, or
    abnormal abandoned/short-duration call ratios against baseline?
  context: Phishing messages and fraudulent call campaigns have measurable structural and behavioral signatures
    distinct from legitimate traffic. This statistical method scores SMS by structural-pattern frequency
    -- counts of URLs, shorteners, phone numbers, and all-caps/character-stylistic cues -- which strongly
    discriminate smishing. For vishing, it profiles per-source call volume and frequency (fan-out calls
    per minute), VoIP-origin rate, and failure-mode behavior (abandoned or short-duration call ratio)
    against a baseline and alerts on outliers. A positive result highlights message senders or call sources
    behaving like an automated phishing/vishing operation conducting mobile Initial Access; pivot to the
    targeted users and their follow-on activity.
  answer_sources:
  - MDM/UEM message logs
  - SMS gateway/carrier logs
  - Zeek dns.log
  - Zeek http.log
  - Unified communications / VoIP call detail records
  - Audio recordings (where lawfully captured)
  - 'NAI: MDM/UEM consoles, enterprise SMS gateways, VoIP/UC platforms (call detail records and caller-ID
    metadata), and network egress sensors observing post-click mobile traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      # SMS structural scoring
      sms_score = f(count_urls, count_shorteners, count_phone_numbers, allcaps_ratio, stylistic_cues)
      alert when sms_score > smishing_threshold;
      # Vishing behavioral profiling per source
      for src in call_sources:
        vol = calls_per_minute(src); voip_rate = voip_origin_rate(src);
        fail = abandoned_or_short_call_ratio(src);
        alert when vol or voip_rate or fail > baseline_outlier(src);
      output src, sms_score, vol, voip_rate, fail
- question: When a smishing text classifier (text normalization plus Naive Bayes or a multi-signal model
    fusing semantic, structural, stylistic, and contextual-embedding features) scores inbound SMS, and
    an audio-spoofing classifier (RawNet2/AASIST/SSL front-ends) scores lawfully captured call audio,
    do any messages or voices classify as phishing or AI-cloned/deepfake?
  context: Adversaries increasingly use generated text and AI-cloned voices to make mobile phishing more
    convincing, defeating fixed keyword rules. This machine-learning method classifies SMS using text
    normalization plus Naive Bayes or a multi-signal model fusing semantic, structural, stylistic, and
    contextual-embedding features (reported ~97.89% accuracy, 99.73% AUC), and -- where audio is lawfully
    captured -- runs an audio-spoofing classifier (RawNet2, AASIST, or SSL front-ends) to flag AI-cloned/deepfake
    voice in calls and voicemails. Because generalization to unseen synthesizers is limited, retain the
    deterministic caller-ID floor alongside the model, and surface the top contributing tokens/features
    per alert for explainability. A positive classification indicates a sophisticated smishing/vishing
    attempt at mobile Initial Access; correlate with the targeted user's actions and treat suspected deepfake
    calls as high-risk social engineering.
  answer_sources:
  - MDM/UEM message logs
  - SMS gateway/carrier logs
  - Zeek dns.log
  - Zeek http.log
  - Unified communications / VoIP call detail records
  - Audio recordings (where lawfully captured)
  - 'NAI: MDM/UEM consoles, enterprise SMS gateways, VoIP/UC platforms (call detail records and caller-ID
    metadata), and network egress sensors observing post-click mobile traffic.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      # SMS text classification
      text = normalize(sms.body)
      p_sms = naive_bayes(text) | multisignal_model(semantic, structural, stylistic, ctx_embeddings)
      alert when p_sms > smishing_threshold;
      # Audio deepfake detection (where lawfully captured)
      p_voice = audio_spoof_classifier(call_audio)   # RawNet2 | AASIST | SSL front-end
      alert when p_voice == synthetic;  # retain caller-ID deterministic floor
      explain = shap_top_tokens(text); output sender, p_sms, p_voice, explain
