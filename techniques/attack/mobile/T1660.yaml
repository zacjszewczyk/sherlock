name: 'T1660: Phishing'
id: 100c07fc-1785-4561-af47-edb0a8987c96
description: 'Investigate whether an adversary is attempting to gain initial access to enrolled mobile
  devices (Android and iOS) through phishing delivered over email, SMS (smishing), QR codes (quishing),
  social media, or voice calls (vishing, including AI-cloned/deepfake voice). This playbook helps an analyst
  hunt for the network and messaging artifacts that phishing leaves behind: mobile-originated DNS and
  HTTP/S connections to newly registered, high-entropy, or rare-TLD domains; lookalike/typosquatted and
  homoglyph domains targeting protected brands; URL-shortener redirects; suspicious or free-CA-issued
  TLS certificates with short validity and mismatched subject names; non-browser JA3/JA4 client stacks
  impersonating mobile browsers; QR-driven sessions exhibiting null referers followed by credential-form
  POSTs; and the correlation of these events with successful authentications (Windows Event ID 4624, Azure
  AD sign-ins) from the same source IP. Where SMS/MDM and unified-communications telemetry exists, it
  also covers smishing lure content, spoofed caller-ID/VoIP origins, and deepfake voice in calls and voicemails.
  Detection methods span symbolic logic (threat-intel and deterministic floors), statistical baselining
  (entropy, rarity, volume, and failure-mode scoring), and machine learning (URLNet, one-class models,
  text and audio classifiers with SHAP explanations) so analysts can determine whether a mobile phishing
  campaign is successfully establishing an initial foothold.'
type: technique
