questions:
- question: '[Command And Control] Match connections to known abused services and C2 client fingerprints:
    Can you determine, using the ''Match connections to known abused services and C2 client fingerprints''
    (Symbolic Logic) approach, whether an adversary is abusing a legitimate external web service for bidirectional
    command and control of a compromised mobile device? This evidence centers on the condition that: A
    mobile device application establishes periodic, low-volume ''heartbeat'' connections to a legitimate
    web service characterized by a low coefficient of variation / standard deviation of inter-arrival
    times (e.g., stddev <1 second over a 10-minute window), or initiates anomalous data transfers. Anomalous
    transfers are defined as a total data volume (orig_bytes + resp_bytes) deviating more than 3 standard
    deviations (or above the 99th percentile) from a 30-day baseline for the user/device/app/service tuple,
    OR a highly skewed outbound-to-inbound byte ratio (e.g., >10:1) uncharacteristic for the service,
    OR a bidirectional read-then-write exchange (small inbound fetch immediately followed by an outbound
    POST/PUT/upload) recurring at a stable interval. Profile connection failure/state explicitly: bursts
    of failed/reset/blocked TLS sessions or repeated retries to the same service are a distinct beacon-retry
    signal.'
  context: 'Why this matters: Under the Command And Control tactic (TA0037), an adversary who has compromised
    an Android or iOS device may abuse an existing, legitimate external web service as a covert two-way
    channel -- retrieving commands hosted on a trusted platform and posting command output back (a comment,
    pull request, document update, upload, message, or API write) -- so the malicious traffic blends into
    the SSL/TLS noise the device already generates (MITRE ATT&CK T1481.002, Bidirectional Communication).
    This evidence focuses on the condition that: A mobile device application establishes periodic, low-volume
    ''heartbeat'' connections to a legitimate web service characterized by a low coefficient of variation
    / standard deviation of inter-arrival times (e.g., stddev <1 second over a 10-minute window), or initiates
    anomalous data transfers. Anomalous transfers are defined as a total data volume (orig_bytes + resp_bytes)
    deviating more than 3 standard deviations (or above the 99th percentile) from a 30-day baseline for
    the user/device/app/service tuple, OR a highly skewed outbound-to-inbound byte ratio (e.g., >10:1)
    uncharacteristic for the service, OR a bidirectional read-then-write exchange (small inbound fetch
    immediately followed by an outbound POST/PUT/upload) recurring at a stable interval. Profile connection
    failure/state explicitly: bursts of failed/reset/blocked TLS sessions or repeated retries to the same
    service are a distinct beacon-retry signal. The ''Match connections to known abused services and C2
    client fingerprints'' approach (Symbolic Logic) works as follows: Join conn.log and ssl.log and alert
    when server_name or id.resp_h matches threat-intelligence indicators for abused web services, or when
    the JA3/JA4 client fingerprint matches a known implant stack or a non-browser fingerprint claiming
    a browser, per [JA3 TLS Client Fingerprinting](https://github.com/salesforce/ja3) and the version-resilient
    [JA4+ suite](https://github.com/FoxIO-LLC/ja4). A positive result -- a rule match, statistical outlier,
    or model alert -- indicates probable abuse of a legitimate web service for bidirectional C2 from a
    mobile device; pivot to the responsible device and app (resolve the app/bundle ID and device via MDM/UEM,
    and the network identity via VPN/proxy/CASB and DHCP/RADIUS leases to a user), the abused destination
    service and endpoint, the full read-then-write exchange, the beacon cadence and byte profile, any
    local staging or protected-resource access that preceded the outbound write, and the app/device state
    (backgrounded, locked, idle) at the time of the exchange to scope intent and impact. A negative result
    helps rule out this particular vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, low-and-slow, or jittered C2 hiding in trusted
    web-service traffic.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Threat intelligence indicators
  - 'NAI: Network security monitoring sensors at internet gateways, corporate Wi-Fi gateways, VPN concentrators,
    and Cloud Access Security Broker (CASB) or Unified Endpoint Management (UEM) log sources where mobile
    device traffic is observable.'
