      and the version-resilient [JA4+ suite](https://github.com/FoxIO-LLC/ja4).


      emit: high-priority alert with supporting fields (device + app/bundle ID -> user, abused destination
      service/endpoint, read-then-write exchange, beacon cadence/byte profile, contributing features/timeline)
      for analyst triage.'
