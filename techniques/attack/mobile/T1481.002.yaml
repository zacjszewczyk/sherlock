name: 'T1481.002: Bidirectional Communication'
id: a1725e51-8d77-42ed-9c06-ecd410953424
description: 'This playbook helps an analyst investigate whether an adversary is abusing a legitimate,
  external web service as a bidirectional command-and-control (C2) channel for a compromised mobile device
  (MITRE ATT&CK T1481.002, Bidirectional Communication, under the Command and Control tactic). In this
  technique an implant on an Android or iOS device leverages popular, trusted platforms -- collaboration
  suites, social media, cloud storage, code-hosting, and messaging services such as GitHub, Pastebin,
  Discord, Google, or Twitter/X -- to receive commands and exfiltrate output, hiding inside the expected
  SSL/TLS noise that hosts already generate before a compromise. The hunt pursues this behavior across
  complementary network and device telemetry: profiling periodic low-volume ''heartbeat'' beacons by their
  inter-arrival regularity (low coefficient of variation), byte-volume and outbound:inbound ratio outliers,
  small inbound-fetch-then-outbound-write (read-then-write) exchanges, and beacon-retry failure bursts
  in Zeek conn.log/ssl.log; inspecting HTTP/S metadata for high-entropy URIs, missing or anomalous User-Agent
  and JA3/JA4/JA4H client fingerprints, and dead-drop 4xx/5xx polling errors; and correlating MDM/UEM
  app/bundle identity against destination web-service category, app role, app/device state (backgrounded,
  locked, long last-user-interaction delta), and allowlists. Detection methods combine deterministic symbolic-logic
  matching (threat-intel and fingerprint joins, malicious URI/UA regex, app-to-destination allowlisting),
  statistical baselining (FFT/CV periodicity scoring, 3-sigma/99th-percentile byte outliers, URI entropy
  baselines, rare-user-agent and rare-app-category prevalence scoring, CT-HMM jittered-beacon modeling),
  and machine learning (SARIMA/Prophet and LSTM/transformer volume forecasting, HTTP-request classifiers,
  bipartite app-service graph/GCN community detection, and per-app encrypted-traffic fingerprinting via
  MIMETIC/CorrNetDroid/Kitsune autoencoders), each surfacing top contributing features for explainable
  triage. Source platforms: Android, iOS.'
type: technique
