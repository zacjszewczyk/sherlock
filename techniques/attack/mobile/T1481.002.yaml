- question: '[Command And Control] Match known malicious URI and User-Agent patterns: Can you determine,
    using the ''Match known malicious URI and User-Agent patterns'' (Symbolic Logic) approach, whether
    an adversary is abusing a legitimate external web service for bidirectional command and control of
    a compromised mobile device? This evidence centers on the condition that: An outbound HTTP/S request
    from a mobile application to a legitimate web service contains a URI path or query string with a Shannon
    entropy value greater than 4.5 (or a statistical outlier for that specific service), consistent with
    encoded command/output tokens. Alternatively, the request''s User-Agent string is missing, matches
    a known-malicious signature, or does not conform to a known-good format for common mobile browsers
    or the specific application, OR the request''s JA4H HTTP fingerprint (header order/case) is inconsistent
    with the claimed client. Track failure state: elevated 4xx/5xx response rates to the same service
    can indicate command-polling against a now-removed dead-drop resource.'
