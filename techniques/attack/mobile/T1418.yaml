questions:
- question: Is any endpoint belonging to a developer, IT-support staffer, or security analyst running
    adb.exe with a command line that enumerates installed Android packages (e.g., 'shell pm list packages',
    'cmd package list packages', or 'dumpsys package'), and is that host absent from the approved mobile-developer
    asset list?
  context: 'Discovery via adb is the most direct way an operator or attacker on a managed endpoint inventories
    apps on a tethered mobile device. The deterministic signature is a process-creation event (Windows
    EID 4688 / Sysmon EID 1) whose ProcessName ends in ''adb.exe'' and whose CommandLine contains ''shell''
    plus a package-listing verb. Correlating the source host against a pre-approved list of authorized
    mobile developers separates routine engineering work from suspicious activity — a hit on a non-developer
    host (HR, finance, an executive laptop) is a strong lead. A positive result warrants pivoting to what
    the operator did next (pulling files, installing APKs). A negative result across the fleet reduces
    the likelihood of host-side enumeration. This follows the established Sigma argument-set pattern for
    discovery-utility command lines. References: [SigmaHQ](https://github.com/SigmaHQ/sigma) [Android
    package visibility](https://developer.android.com/training/package-visibility) [T1418, MITRE ATT&CK](https://attack.mitre.org/techniques/T1418/)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoint devices of developers, IT support staff, and security analysts with mobile device management
    responsibilities.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "rule process_creation:\n  where ProcessName endswith 'adb.exe'\n  and CommandLine contains\
      \ 'shell'\n  and (CommandLine contains all ['pm','list','packages']\n       or CommandLine contains\
      \ 'cmd package list packages'\n       or CommandLine contains 'dumpsys package')\n  | lookup host\
      \ against authorized_mobile_dev_assets\n  | where host not in authorized_mobile_dev_assets\n  ->\
      \ alert(severity=high)"
- question: For each user, has the frequency of adb.exe package-enumeration commands abruptly spiked above
    their personal baseline, shown unusually high command-line entropy, or produced a burst of failed/denied
    adb sessions that would indicate scripted or automated discovery rather than manual debugging?
  context: 'Even authorized developers have a stable rhythm of adb usage. By establishing a 30-day per-user
    baseline of adb.exe invocation frequency (count/min and count/day), an analyst can alert when ''pm
    list packages'' executions exceed mean+3σ of that user''s own average (Volume/Frequency). Computing
    Shannon entropy of each full command line and alerting above the 98th percentile per user surfaces
    obfuscated or machine-generated commands. Change-point detection (CUSUM/PELT) on the per-user daily
    adb count catches sustained regime shifts that a static mean+3σ threshold misses. Tracking failed/denied
    sessions (device unauthorized/offline) as a distinct State signal flags repeated probing of devices
    the operator does not legitimately control. A spike confined to one user plus denied-session bursts
    is a high-fidelity lead. References: [A Survey of Methods for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoint devices of developers, IT support staff, and security analysts with mobile device management
    responsibilities.'
  range: Last 90 days (30-day rolling baseline per user)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from process_creation where ProcessName endswith 'adb.exe'\n  | stats count() as cmds by user,\
      \ bin(1d)\n  | baseline mean,std over trailing 30d per user\n  | where cmds > mean + 3*std\n  |\
      \ extend entropy = shannon(CommandLine)\n  | where entropy > percentile(entropy,98) by user\n  |\
      \ join failed_adb_sessions (state in ['unauthorized','offline'])\n  | changepoint(cmds per user\
      \ daily) -> alert"
- question: When a classifier is applied to adb process-creation events using command-line length, entropy,
    keyword flags, parent process, and time-of-day, which executions score above a high malicious-probability
    threshold, and what are the top contributing features driving each score?
  context: 'A supervised classifier (Random Forest/XGBoost) trained on process-creation features — command-line
    length, entropy, keyword flags (''shell'',''pm'',''list'',''install'',''pull''), parent process (''cmd.exe'',''powershell.exe'',''explorer.exe''),
    and time-of-day/is_business_hours — can separate benign developer activity from malicious enumeration
    that simple rules miss (for example, adb spawned by an unusual parent during off-hours). Alerting
    on malicious probability > 0.90 and surfacing the top-3 contributing features (e.g., entropy, parent
    process, off-hours) lets an analyst triage on rationale rather than an opaque score. A high score
    with an explainable feature set such as ''powershell.exe parent + high entropy + 03:00'' is far more
    actionable than a bare alert. References: [Explaining Black-box Android Malware Detection](https://arxiv.org/pdf/1803.03544)
    [Performance Comparative Study on Zero Day Malware Detection Using XGBoost and Random Forest](https://www.researchgate.net/publication/386124227_Performance_Comparative_Study_on_Zero_Day_Malware_Detection_Using_XGBoost_and_Random_Forest_Classifiers)'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoint devices of developers, IT support staff, and security analysts with mobile device management
    responsibilities.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [cmdline_len, entropy, kw_shell, kw_pm, kw_list, kw_install,\n            kw_pull,\
      \ parent_proc, hour_of_day, is_business_hours]\nmodel = RandomForest/XGBoost (trained on labeled\
      \ adb events)\nscore = model.predict_proba(features)\nif score > 0.90: alert(top3=shap_top_features(features))"
- question: Is a managed mobile device sending small outbound-dominant HTTP POSTs (request body 1KB–50KB)
    to a newly registered or threat-intel-flagged domain, or issuing abnormally long DNS queries (>100
    characters) to low-reputation domains, consistent with exfiltrating an app inventory?
  context: 'After enumerating installed apps, malware commonly ships the small inventory off-device. The
    deterministic floor: from the mobile device IP range, alert when a Zeek http.log entry shows an HTTP
    POST with request_body_len between 1024 and 51200 bytes AND the destination host matches a threat-intel
    feed or a domain younger than 30 days, OR a Zeek dns.log query length exceeds 100 characters to a
    low-reputation domain (possible DNS tunneling of the inventory). These concrete byte/length/age thresholds
    are the tunable deterministic baseline. A positive result on a device that has no business contacting
    a brand-new domain is a strong exfil lead; pivot to the on-device telemetry for that device to confirm
    preceding enumeration. References: [T1418, MITRE ATT&CK](https://attack.mitre.org/techniques/T1418/)'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Corporate network egress points, wireless network segments, VPN concentrators, and DNS resolvers.'
  range: Last 90 days (30-day rolling baseline for domain age/rarity)
  queries:
  - technology: Zeek/pseudocode
    query: "from http.log where id.orig_h in MOBILE_RANGE\n  and method == 'POST'\n  and request_body_len\
      \ between 1024 and 51200\n  and (host in TI_FEED or domain_age(host) < 30d)\n  -> alert\nUNION\n\
      from dns.log where id.orig_h in MOBILE_RANGE\n  and len(query) > 100 and reputation(query) == low\n\
      \  -> alert"
- question: For each managed mobile device, does any outbound connection exceed the device's 99th-percentile
    transfer size with a short duration to a rarely-seen destination, or do bursts of blocked/rejected
    egress and DNS NXDOMAIN responses indicate probing or exfil retries?
  context: 'Per-device baselining catches exfil that absolute thresholds miss. For each mobile device
    IP, baseline outbound transfer sizes (orig_bytes), the orig_bytes:resp_bytes ratio, and connection
    count/min over a 30-day rolling window. Alert when a connection''s orig_bytes exceeds the device''s
    99th percentile and duration < 10s, enriched by destination rarity (seen by < 5 internal devices).
    Separately profile failure State — bursts of blocked/rejected egress (conn_state S0/REJ) and elevated
    DNS NXDOMAIN rates per device are distinct signals of probing or exfil retries against dead/blocked
    C2. Applying change-point detection to per-device egress volume catches sustained regime shifts. A
    short, large, outbound-heavy flow to a rare destination is the classic inventory-exfil shape. References:
    [50 Ways to Leak Your Data](https://www.usenix.org/system/files/sec19-reardon.pdf) [A Survey of Methods
    for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Corporate network egress points, wireless network segments, VPN concentrators, and DNS resolvers.'
  range: Last 90 days (30-day rolling baseline per device)
  queries:
  - technology: Zeek/Stats pseudocode
    query: "from conn.log where id.orig_h in MOBILE_RANGE\n  | baseline per device: orig_bytes, orig:resp\
      \ ratio, conn/min over 30d\n  | where orig_bytes > p99(orig_bytes) and duration < 10s\n        and\
      \ dest_rarity(id.resp_h) < 5 devices\n  | also flag: bursts of conn_state in [S0,REJ], high NXDOMAIN\
      \ rate per device\n  | changepoint(egress_volume per device) -> alert"
- question: Which mobile-device network flows are flagged as outliers by unsupervised anomaly detection
    over byte/duration/protocol features, and do their destination FQDNs also score high on a DGA model,
    indicating algorithmically-generated C2 receiving an exfiltrated inventory?
  context: 'A two-stage ML pipeline finds exfil that thresholds and baselines miss. Stage 1 runs unsupervised
    anomaly detection (Isolation Forest and/or an autoencoder) over Zeek conn.log mobile flows using features
    orig_bytes, resp_bytes, duration, proto, and the orig/resp byte ratio, training only on benign baselines
    and flagging reconstruction-error/score outliers and sparse clusters. Stage 2 extracts the destination
    FQDN from http.log/dns.log and scores it with a DGA model, escalating when anomaly + DGA score > 0.85.
    Emitting the top-3 features driving each alert (e.g., byte ratio, destination rarity, body length)
    supports triage. A flow that is both a behavioral outlier and bound for a DGA-like domain is a high-confidence
    exfil channel. References: [Isolation Forest vs. Autoencoders for Zero-Day Network Attack Detection](https://ieeexplore.ieee.org/document/10143005/)
    [Malware Detection for IoT Using One-Class Classification](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/)'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Corporate network egress points, wireless network segments, VPN concentrators, and DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "Stage1: X = conn.log[orig_bytes,resp_bytes,duration,proto,byte_ratio]\n  model1 = IsolationForest\
      \ / Autoencoder (train on benign only)\n  anom = model1.score(X)  # outlier / high reconstruction\
      \ error\nStage2: fqdn = extract from http.log/dns.log\n  dga = dga_model.score(fqdn)\n  if anom_outlier\
      \ and dga > 0.85: alert(top3_features)"
- question: Has the MDM/MTD platform recorded the install or update of any managed app that requests Android
    android.permission.QUERY_ALL_PACKAGES, declares many specific <queries> targets, or is flagged for
    using restricted enumeration APIs (getInstalledPackages/getInstalledApplications/queryIntentActivities)
    or the iOS private LSApplicationWorkspace API / heavy canOpenURL scheme probing — and is that app
    outside the approved allowlist?
  context: 'QUERY_ALL_PACKAGES gives an app broad visibility into every installed app; Google Play treats
    it as sensitive and restricts it to a narrow approved set (launchers, security tools, etc.), requiring
    most apps to declare specific <queries> instead — so its presence is a strong deterministic indicator
    of enumeration intent. On iOS, an app declaring near the 50-scheme cap in LSApplicationQueriesSchemes
    or calling the private LSApplicationWorkspace API is equally suspicious. Configuring a high-severity
    MDM/MTD alert on these conditions, with an allowlist of approved security/MDM tools to suppress false
    positives, surfaces apps purpose-built to inventory the device. Restricted/suspicious enumeration
    APIs (Drebin/DroidAPIMiner static signatures) provide additional deterministic signals. A non-allowlisted
    app requesting QUERY_ALL_PACKAGES is a high-priority lead. References: [Google Play QUERY_ALL_PACKAGES
    policy](https://support.google.com/googleplay/android-developer/answer/10158779?hl=en) [Android package
    visibility](https://developer.android.com/training/package-visibility) [Apple canOpenURL](https://developer.apple.com/documentation/uikit/uiapplication/1622952-canopenurl)
    [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf) [DroidAPIMiner](https://link.springer.com/chapter/10.1007/978-3-319-04283-1_6)'
  answer_sources:
  - MDM/MTD application inventory logs
  - MDM/MTD security alert logs
  - 'NAI: Corporate MDM/MTD platform and Application Vetting Systems.'
  range: Last 90 days
  queries:
  - technology: MDM/Rule pseudocode
    query: "from mdm_app_inventory on (install or update)\n  where android_perm == 'QUERY_ALL_PACKAGES'\n\
      \     or queries_targets_count > threshold\n     or static_flag in ['getInstalledPackages','getInstalledApplications',\n\
      \                        'queryIntentActivities','LSApplicationWorkspace']\n     or ios_LSApplicationQueriesSchemes_count\
      \ >= 45\n  | where app not in approved_security_tool_allowlist\n  -> alert(severity=high)"
- question: When every app's permissions are weighted inversely to their fleet-wide prevalence, which
    newly observed apps land in the top 1% of risk — driven by rarely-needed high-privilege permissions
    like QUERY_ALL_PACKAGES — and therefore merit review?
  context: 'Permission request-frequency distributions diverge sharply between benign and malicious apps,
    and a small set of ranked permissions provides strong separation. Ingesting the MDM application inventory,
    compute each permission''s fleet-wide prevalence (apps requesting it / total unique apps) and assign
    a risk weight inversely proportional to prevalence, then sum weights per app for a risk score. Alerting
    on any new app in the top 1% (99th percentile) surfaces apps that request unusual, rarely-needed permission
    combinations — weighting QUERY_ALL_PACKAGES and other rare high-privilege permissions heaviest. A
    common photo app requesting common permissions ranks low; an obscure utility requesting QUERY_ALL_PACKAGES
    plus SMS/accessibility ranks high and warrants vetting. References: [Android Malware Detection using
    Feature Ranking of Permissions](https://arxiv.org/pdf/2201.08468) [Identification of Significant Permissions](https://arxiv.org/pdf/2103.00643)'
  answer_sources:
  - MDM/MTD application inventory logs
  - MDM/MTD security alert logs
  - 'NAI: Corporate MDM/MTD platform and Application Vetting Systems.'
  range: Last 90 days
  queries:
  - technology: MDM/Stats pseudocode
    query: 'inv = mdm_app_inventory

      for perm p: prevalence[p] = apps_requesting(p) / total_unique_apps

      weight[p] = 1 / prevalence[p]   # rare = heavy; boost QUERY_ALL_PACKAGES

      risk[app] = sum(weight[p] for p in app.permissions)

      alert if app is new and risk[app] >= p99(risk)'
- question: When an explainable classifier scores managed apps from their permission vector, restricted-API
    flags, install source, developer reputation, and app age, which apps exceed the malicious-probability
    quarantine threshold, and which features (e.g., QUERY_ALL_PACKAGES, sideloaded source, enumeration
    APIs) drive each verdict?
  context: 'A Drebin-style explainable classifier (linear-SVM/RF) over a feature space of binary permission
    vector, binary restricted/suspicious API flags (getInstalledPackages, queryIntentActivities, LSApplicationWorkspace),
    install source (store vs sideload), developer reputation, app age, and a QUERY_ALL_PACKAGES flag reaches
    ~94% detection at ~1% false positive (permission-only models ~94–97% accuracy). Quarantining apps
    with malicious probability > 0.95 and ALWAYS surfacing the top-3 contributing features via gradient/weight-based
    attribution lets analysts validate the verdict (e.g., ''QUERY_ALL_PACKAGES + sideloaded + enumeration
    APIs''). This catches malicious apps that individually-benign signals would miss, while keeping decisions
    auditable. References: [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf)
    [Identification of Significant Permissions](https://arxiv.org/pdf/2103.00643) [DroidAPIMiner](https://link.springer.com/chapter/10.1007/978-3-319-04283-1_6)
    [Explaining Black-box Android Malware Detection](https://arxiv.org/pdf/1803.03544) [XAI for Malware
    Analysis: A Survey](https://arxiv.org/html/2409.13723v2)'
  answer_sources:
  - MDM/MTD application inventory logs
  - MDM/MTD security alert logs
  - 'NAI: Corporate MDM/MTD platform and Application Vetting Systems.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [perm_vector, api_flags(getInstalledPackages, queryIntentActivities,\n        \
      \    LSApplicationWorkspace), install_source, dev_reputation,\n            app_age, query_all_packages_flag]\n\
      model = linearSVM/RandomForest (Drebin-style)\np = model.predict_proba(features)\nif p > 0.95: quarantine(app);\
      \ alert(top3=weight_attribution(features))"
- question: Is any single app process issuing a burst of installed-app enumeration calls (≥20 calls within
    60s) — Android getInstalledPackages/getInstalledApplications/queryIntentActivities or 'pm list packages',
    or iOS canOpenURL across ≥20 distinct URL schemes — despite having no launcher or security business
    need for broad app visibility?
  context: 'On-device telemetry from EDR/MTD instrumentation captures enumeration at the source. The deterministic
    rule fires when a single app process issues ≥ N installed-app enumeration calls within a short window
    (default N≥20 within 60s) — the documented Android PackageManager APIs / ''pm list packages'', or
    iOS canOpenURL across ≥20 distinct schemes — especially when the app is not a launcher or security
    tool. Tuning N to the fleet''s benign 99th percentile keeps this as a defensible deterministic floor.
    A burst from an app that has no legitimate reason to inventory other apps (e.g., a game, a flashlight)
    is a strong indicator of T1418 discovery; pivot to whether a local inventory file write and small
    egress follow. References: [Android package visibility](https://developer.android.com/training/package-visibility)
    [Apple canOpenURL](https://developer.apple.com/documentation/uikit/uiapplication/1622952-canopenurl)
    [T1418, MITRE ATT&CK](https://attack.mitre.org/techniques/T1418/)'
  answer_sources:
  - android:logcat (OS API Execution / Command Execution)
  - iOS:unifiedlog (OS API Execution / Application Log)
  - MDM/MTD on-device telemetry
  - 'NAI: Managed Android and iOS devices with on-device EDR/MTD instrumentation or developer-mode logging.'
  range: Last 90 days
  queries:
  - technology: EDR/Rule pseudocode
    query: "from on_device_api_telemetry\n  group by app_process, window(60s)\n  count enum_calls where\
      \ api in [getInstalledPackages, getInstalledApplications,\n        queryIntentActivities, 'pm list\
      \ packages']\n     or canOpenURL_distinct_schemes\n  | where enum_calls >= 20 (tune to fleet p99)\n\
      \        and app_type not in ['launcher','security']\n  -> alert"
- question: For each app, has its enumeration-API call rate or distinct-scheme/package count risen above
    its own baseline, and is it returning a high ratio of false canOpenURL results or denied PackageManager
    queries that signals broad probing rather than legitimate, targeted lookups?
  context: 'Establish a per-app baseline of enumeration-API call rate (count/min) and distinct-scheme/package
    count over a 14–30 day window, then alert above mean+3σ (Volume/Frequency). Tracking State — the count
    of canOpenURL calls returning false for undeclared schemes and denied PackageManager queries — distinguishes
    broad probing (high false/denied ratio) from legitimate targeted use. Modeling normal API-call transition
    sequences and flagging improbable enumeration sequences via Markov-chain transition probabilities
    (MaMaDroid/DroidAPIMiner) adds sequence-aware sensitivity. An app whose enumeration rate jumps above
    its baseline while most of its scheme probes return false is exhibiting the spray-and-check pattern
    of malware mapping the device. References: [Apple canOpenURL](https://developer.apple.com/documentation/uikit/uiapplication/1622952-canopenurl)
    [50 Ways to Leak Your Data](https://www.usenix.org/system/files/sec19-reardon.pdf) [MaMaDroid](https://arxiv.org/pdf/1612.04433)
    [DroidAPIMiner](https://link.springer.com/chapter/10.1007/978-3-319-04283-1_6)'
  answer_sources:
  - android:logcat (OS API Execution / Command Execution)
  - iOS:unifiedlog (OS API Execution / Application Log)
  - MDM/MTD on-device telemetry
  - 'NAI: Managed Android and iOS devices with on-device EDR/MTD instrumentation or developer-mode logging.'
  range: Last 90 days (14–30 day per-app baseline)
  queries:
  - technology: EDR/Stats pseudocode
    query: "per app: baseline enum_rate(count/min), distinct_scheme/pkg_count over 14-30d\n  | alert if\
      \ rate > mean + 3*std\n  | State: ratio of canOpenURL==false (undeclared) and denied PackageManager\
      \ queries\n  | markov_seq_prob(api_call_sequence) -> flag improbable enumeration chains"
- question: When a behavioral classifier scores on-device API streams using enumeration call counts/rates,
    package/scheme diversity, Markov transition probabilities between API families, time-of-day, and prior
    foreground-target checks, which apps exceed the malicious-probability threshold, and what features
    explain each verdict?
  context: 'Build behavioral feature vectors from on-device API streams — enumeration call counts/rates,
    distinct package/scheme diversity, Markov transition probabilities between API families, time-of-day,
    and foreground-target-app checks performed before queries — and classify with RF/SVM. MaMaDroid-style
    API abstraction keeps the model robust to OS/API churn (F1 up to 0.99). Alerting on malicious probability
    > 0.90 and surfacing the top-3 contributing features (e.g., enumeration rate, scheme diversity, a
    prior foreground-target check on a banking app) supports analyst triage. Detecting that an app checked
    which banking app was in the foreground and then enumerated installed packages is a behavior sequence
    strongly tied to targeted mobile malware. References: [MaMaDroid](https://arxiv.org/pdf/1612.04433)
    [Explaining Black-box Android Malware Detection](https://arxiv.org/pdf/1803.03544)'
  answer_sources:
  - android:logcat (OS API Execution / Command Execution)
  - iOS:unifiedlog (OS API Execution / Application Log)
  - MDM/MTD on-device telemetry
  - 'NAI: Managed Android and iOS devices with on-device EDR/MTD instrumentation or developer-mode logging.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [enum_call_count, enum_rate, pkg_scheme_diversity,\n            markov_transition_probs(api_families),\
      \ time_of_day,\n            foreground_target_check_before_query]\nmodel = RandomForest/SVM (MaMaDroid-style\
      \ abstraction)\np = model.predict_proba(features)\nif p > 0.90: alert(top3=shap_top_features(features))"
