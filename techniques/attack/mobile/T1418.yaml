name: 'T1418: Software Discovery'
id: c00d9347-7aeb-433b-a597-c971b21d40d3
description: 'Investigate whether an adversary is attempting to discover the applications installed on
  managed mobile devices (MITRE ATT&CK T1418, Software Discovery). Adversaries enumerate installed apps
  to shape follow-on behavior — deciding whether to fully infect a target, identify security/anti-analysis
  tooling, or locate high-value banking, identity, and authenticator apps. This playbook helps an analyst
  hunt across four vantage points: (1) developer/IT/security endpoints running adb-based package enumeration
  (Windows EID 4688 / Sysmon EID 1); (2) network egress from managed mobile devices showing small outbound-dominant
  inventory exfiltration over HTTP POST or long DNS queries (Zeek conn/http/dns); (3) MDM/MTD application-inventory
  and app-vetting signals such as Android QUERY_ALL_PACKAGES, broad <queries> declarations, restricted
  enumeration APIs, or the iOS LSApplicationWorkspace private API and heavy canOpenURL scheme probing;
  and (4) on-device telemetry showing bursts of installed-app enumeration calls followed by local inventory
  writes and small egress. For each vantage point the playbook offers deterministic (symbolic-logic),
  statistical baselining, and machine-learning detection approaches.'
type: technique
related:
- tactic_id: TA0032
  tactic_name: Discovery
