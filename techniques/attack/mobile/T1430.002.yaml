name: 'T1430.002: Impersonate SS7 Nodes'
id: 9460f5e2-5599-4e72-8dfd-7b20a7a18551
description: Investigate adversary abuse of Signaling System 7 (SS7) by impersonating trusted network
  nodes to discover and collect mobile subscriber location information. Adversaries exploit the lack of
  authentication in SS7 signaling to send Mobile Application Part (MAP) queries (e.g., SRI-SM/OpCode 45,
  PSI/OpCode 70, AnyTimeInterrogation, SendRoutingInfo) from external Global Titles (GTs) impersonating
  internal nodes, resolving a victim's MSISDN to a serving MSC/VLR, cell area, or nearest cell tower.
  This playbook helps an analyst determine whether non-whitelisted GTs are issuing anomalous location
  queries (Discovery) and whether the network is successfully returning subscriber location data to unauthorized
  destinations (Collection). It correlates SS7/MAP transaction logs, HLR/HSS and VLR query logs, signaling
  gateway egress, and the roaming-partner GT whitelist using rule-based filters, statistical baselining
  (volume/frequency, Z-scores, entropy, error-rate and success-rate profiling), and machine-learning classifiers
  (Random Forest, DBSCAN, LSTM, graph anomaly detection) to surface large-scale scanning, targeted individual
  tracking, and successful location exfiltration.
type: technique
related:
- tactic_id: TA0032
  tactic_name: Discovery
- tactic_id: TA0035
  tactic_name: Collection
