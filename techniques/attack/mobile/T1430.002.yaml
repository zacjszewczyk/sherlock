tags: none
questions:
- question: Are SS7 MAP location queries (SRI-SM/OpCode 45, PSI/OpCode 70, AnyTimeInterrogation, SendRoutingInfo)
    reaching the HLR/HSS from external Global Titles that are not on the approved roaming-partner whitelist?
  context: 'Discovery: An adversary impersonating an SS7 node must originate location queries from some
    Global Title (GT). Legitimate location queries normally arrive only from a known set of roaming partners.
    Joining the SGW/STP MAP transaction logs against the roaming-partner GT whitelist and filtering for
    location-query OpCodes lets you catch queries that have no legitimate business arriving from that
    source GT. A positive result (a location OpCode from a non-whitelisted GT hitting the HLR) is a strong
    first-order indicator of SS7 reconnaissance; a negative result means observed queries came from approved
    partners. This rule-based GT+OpCode filter is the implemented baseline in the SS7 vulnerabilities
    survey and Attack Detection in SS7 literature. Sources: [SS7 vulnerabilities survey](https://doi.org/10.1109/comst.2020.2971757);
    [Attack Detection in SS7](https://doi.org/10.1007/978-3-031-20215-5_2).'
  answer_sources:
  - SGW_map_transactions.log
  - HLR_query_logs
  - roaming_partner_gt_whitelist.csv
  - 'NAI: Core network infrastructure, specifically the SS7 signaling plane interfaces (Signaling Gateways),
    subscriber databases (HLR/HSS), and network security monitoring platforms.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "JOIN map_txn (SGW_map_transactions.log, HLR_query_logs) WITH roaming_partner_gt_whitelist\
      \ ON source_gt\nWHERE opcode IN (45 /*SRI-SM*/, 70 /*PSI*/, 'AnyTimeInterrogation', 'SendRoutingInfo')\n\
      \  AND source_gt NOT IN whitelist.gt\n=> ALERT severity=high, fields=[source_gt, opcode, msisdn,\
      \ dest_node, ts]"
- question: Are any inbound interconnect messages that should never legitimately arrive from an external
    network (AnyTimeInterrogation, ProvideSubscriberInformation, SendIMSI) being received, or are there
    unsolicited MAP responses with no matching outbound request?
  context: 'Discovery: GSMA FS.11 (as codified by ENISA) categorizes certain MAP messages as Category-1
    - messages that should never cross the interconnect from another operator. Receiving AnyTimeInterrogation,
    ProvideSubscriberInformation, or SendIMSI inbound is by definition illegitimate and should be dropped
    or critically alerted. Separately, a MAP response arriving with no matching outbound request is a
    protocol-spec violation indicative of injection/impersonation. Watching for both the forbidden-OpCode
    set and the stateless/unsolicited-response condition catches node impersonation early, before a victim''s
    location is resolved. Sources: [ENISA signalling security in telecom SS7/Diameter/5G](https://www.enisa.europa.eu/publications/signalling-security-in-telecom-ss7-diameter-5g);
    [Tan et al.](https://doi.org/10.1109/cns53000.2021.9705031).'
  answer_sources:
  - SGW_map_transactions.log
  - HLR_query_logs
  - roaming_partner_gt_whitelist.csv
  - 'NAI: Core network infrastructure, specifically the SS7 signaling plane interfaces (Signaling Gateways),
    subscriber databases (HLR/HSS), and network security monitoring platforms.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM map_txn\nWHERE direction='inbound' AND interconnect=true\n  AND ( opcode IN ('AnyTimeInterrogation','ProvideSubscriberInformation','SendIMSI')\
      \ /* GSMA Cat-1 */\n     OR (msg_type='response' AND NOT EXISTS matching outbound request by transaction_id)\
      \ )\n=> DROP or ALERT severity=critical, fields=[source_gt, opcode, transaction_id]"
- question: For each source Global Title, does the ratio of location queries to all other SS7 message
    types exceed the 99th percentile of its own 30-day baseline?
  context: 'Discovery: A GT that legitimately participates in roaming sends a mix of message types. A
    GT focused on surveillance sends a disproportionate share of location queries. Computing the location-query
    ratio (volume/frequency) per source GT over rolling 24-hour windows and comparing it to a per-GT 30-day
    baseline highlights sources whose behavior has shifted toward location resolution. Deriving the percentile
    per operator/GT controls false positives because each partner has its own normal mix. Exceeding the
    99th percentile signals reconnaissance even if the absolute volume is modest. Sources: [Beumier &
    Debatty](https://doi.org/10.1007/978-3-031-20215-5_2); [Pavloski & Gelenbe](https://doi.org/10.5220/0005019802060212).'
  answer_sources:
  - SGW_map_transactions.log
  - HLR_query_logs
  - roaming_partner_gt_whitelist.csv
  - 'NAI: Core network infrastructure, specifically the SS7 signaling plane interfaces (Signaling Gateways),
    subscriber databases (HLR/HSS), and network security monitoring platforms.'
  range: Last 90 days; compute against a rolling 30-day per-GT baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM map_txn EARLIEST=-30d

      bucket span=24h by source_gt

      loc_ratio = count(opcode in location_query_set) / count(*)

      baseline_p99 = percentile(loc_ratio, 99) over per-GT 30d history

      WHERE loc_ratio > baseline_p99 => ALERT fields=[source_gt, loc_ratio, baseline_p99]'
- question: Which source Global Titles exhibit an abnormally high rate of failed or rejected queries (unknown-subscriber
    / absent-subscriber results), exceeding 20% and their own 3-sigma baseline?
  context: 'Discovery: Reconnaissance scanning probes MSISDNs that may not exist or are not served locally,
    producing an abnormally high proportion of unknown-subscriber/rejected results. Tracking the failure
    (error) ratio per source GT as a distinct signal - separate from raw volume - catches scanners that
    deliberately keep volume low. Alerting when a GT''s failed-query rate exceeds 20% AND its 3-sigma
    baseline is a failure-mode signal recommended in the ENISA signalling-security guidance. A high error
    ratio with non-whitelisted origin is highly suspicious; a low, stable error ratio is consistent with
    legitimate partner traffic. Sources: [ENISA signalling-security guidance](https://www.enisa.europa.eu/publications/signalling-security-in-telecom-ss7-diameter-5g).'
  answer_sources:
  - SGW_map_transactions.log
  - HLR_query_logs
  - roaming_partner_gt_whitelist.csv
  - 'NAI: Core network infrastructure, specifically the SS7 signaling plane interfaces (Signaling Gateways),
    subscriber databases (HLR/HSS), and network security monitoring platforms.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM map_txn EARLIEST=-30d

      bucket span=24h by source_gt

      fail_rate = count(result in (''unknownSubscriber'',''absentSubscriber'',''rejected'')) / count(*)

      mean,std = avg/stdev(fail_rate) over per-GT 30d

      WHERE fail_rate > 0.20 AND fail_rate > mean + 3*std => ALERT fields=[source_gt, fail_rate]'
- question: Does a supervised classifier (Random Forest) flag SS7 MAP transactions as suspicious with
    confidence above 0.90, and which features (OpCode, source GT, failure ratio) drive the decision?
  context: 'Discovery: Single rules miss multivariate patterns. A Random Forest trained on SS7 MAP transactions
    using features such as source GT, message type/OpCode, time of day, country of origin, query frequency,
    and failure ratio can classify suspicious transactions while remaining explainable. Alert when suspicious
    confidence exceeds 0.90 and prioritize non-whitelisted GTs. Surfacing the top-3 contributing features
    (e.g., OpCode, source GT, failure ratio) in the alert lets the analyst quickly validate. Use SMOTE/resampling
    for the rare-event imbalance. This classifier set is benchmarked in the SS7 vulnerabilities survey
    and on real captures by Guo et al. Sources: [SS7 vulnerabilities survey](https://doi.org/10.1109/comst.2020.2971757);
    [Guo et al.](https://doi.org/10.3390/info14090509); [Krasic & Celar](https://doi.org/10.23919/softcom55329.2022.9911518).'
  answer_sources:
  - SGW_map_transactions.log
  - HLR_query_logs
  - roaming_partner_gt_whitelist.csv
  - 'NAI: Core network infrastructure, specifically the SS7 signaling plane interfaces (Signaling Gateways),
    subscriber databases (HLR/HSS), and network security monitoring platforms.'
  range: Last 90 days for scoring; train on >=6 months of labeled history
  queries:
  - technology: ML/pseudocode
    query: 'features = [source_gt, opcode, hour_of_day, origin_country, query_freq, fail_ratio]

      model = RandomForest(class_weight via SMOTE)

      score = model.predict_proba(features)[''suspicious'']

      WHERE score > 0.90 ORDER BY (source_gt NOT IN whitelist) DESC

      => ALERT confidence=score, top3=model.feature_importances(row)'
- question: Is any single external source Global Title issuing location queries for more than 500 unique
    MSISDNs within any one-hour window?
  context: 'Discovery: Large-scale enumeration of subscribers is a hallmark of an adversary mapping a
    victim population or harvesting location data at scale. A deterministic floor - more than 500 unique
    MSISDNs queried by one source GT in any rolling 1-hour window - provides a high-confidence, low-noise
    scanning alert. This rule-based filter is consistent with the SS7 vulnerabilities survey and Attack
    Detection in SS7. Tune the threshold to your interconnect volume; crossing it from a non-whitelisted
    GT warrants immediate investigation and likely blocking. Sources: [SS7 vulnerabilities survey](https://doi.org/10.1109/comst.2020.2971757);
    [Attack Detection in SS7](https://doi.org/10.1007/978-3-031-20215-5_2).'
  answer_sources:
  - SGW_map_transactions.log
  - HLR_query_logs
  - 'NAI: Core network infrastructure, specifically the SS7 signaling plane interfaces (Signaling Gateways)
    and subscriber databases (HLR/HSS).'
  range: Last 90 days; evaluate per rolling 1-hour window
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM map_txn

      bucket span=1h by source_gt

      uniq_msisdn = distinct_count(msisdn)

      WHERE uniq_msisdn > 500 => ALERT severity=high, fields=[source_gt, uniq_msisdn, window]'
- question: Does the hourly count of unique MSISDNs queried per source Global Title show a Z-score above
    3.0 against its 30-day baseline?
  context: 'Discovery: A static 500-MSISDN floor can miss a low-and-slow scanner whose normal volume is
    tiny. Computing hourly unique-MSISDN counts (volume) per source GT and Z-scoring them against per-GT
    30-day baselines catches relative spikes regardless of absolute volume. Alert when the Z-score exceeds
    3.0, applying the per-node signalling-rate deviation model of Pavloski & Gelenbe. Deriving the mean/stddev
    per GT keeps false positives low because each partner has its own normal rate. A sudden 3-sigma spike
    indicates a behavioral change worth correlating with whitelist status and failure ratio. Sources:
    [Pavloski & Gelenbe](https://doi.org/10.5220/0005019802060212).'
  answer_sources:
  - SGW_map_transactions.log
  - HLR_query_logs
  - 'NAI: Core network infrastructure, specifically the SS7 signaling plane interfaces (Signaling Gateways)
    and subscriber databases (HLR/HSS).'
  range: Last 90 days; compute against a rolling 30-day per-GT baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM map_txn EARLIEST=-30d

      bucket span=1h by source_gt

      uniq_msisdn = distinct_count(msisdn)

      mean,std = avg/stdev(uniq_msisdn) over per-GT 30d

      z = (uniq_msisdn - mean)/std

      WHERE z > 3.0 => ALERT fields=[source_gt, uniq_msisdn, z]'
- question: During scanning bursts, does a source Global Title's unknown-subscriber/absent-subscriber
    failed-lookup ratio exceed 30% within the hourly window?
  context: 'Discovery: Scanning across guessed or sequential MSISDN ranges produces elevated unknown-subscriber/absent-subscriber
    errors because many guessed numbers are invalid or not locally served. Alerting when a GT''s failed-lookup
    ratio exceeds 30% within the same hourly window is a distinct failure-mode signal per ENISA. Combined
    with the unique-MSISDN volume signal, a high error ratio strongly differentiates enumeration from
    legitimate roaming traffic, which resolves successfully the vast majority of the time. Sources: [ENISA
    signalling security in telecom SS7/Diameter/5G](https://www.enisa.europa.eu/publications/signalling-security-in-telecom-ss7-diameter-5g).'
  answer_sources:
  - SGW_map_transactions.log
  - HLR_query_logs
  - 'NAI: Core network infrastructure, specifically the SS7 signaling plane interfaces (Signaling Gateways)
    and subscriber databases (HLR/HSS).'
  range: Last 90 days; evaluate per rolling 1-hour window
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM map_txn

      bucket span=1h by source_gt

      fail_ratio = count(result in (''unknownSubscriber'',''absentSubscriber'')) / count(*)

      WHERE fail_ratio > 0.30 => ALERT fields=[source_gt, fail_ratio, window]'
- question: Does unsupervised clustering (DBSCAN) classify any source Global Title as an outlier based
    on its scanning features, and what feature values distinguish it?
  context: 'Discovery: When labels are unavailable, unsupervised clustering surfaces anomalous behavior.
    Apply DBSCAN using features such as source GT, unique-MSISDN count per hour, location-query ratio,
    and failure ratio; GTs classified as outliers (noise points) are candidate scanners. Investigate outliers
    and report the top-3 distinguishing feature values in the alert so the analyst understands why the
    GT was flagged. Unsupervised clustering/autoencoding for unlabeled SS7 scanning is validated by Guo
    et al., with imbalance handling per Krasic & Celar. Sources: [Guo et al.](https://doi.org/10.3390/info14090509);
    [Krasic & Celar](https://doi.org/10.23919/softcom55329.2022.9911518).'
  answer_sources:
  - SGW_map_transactions.log
  - HLR_query_logs
  - 'NAI: Core network infrastructure, specifically the SS7 signaling plane interfaces (Signaling Gateways)
    and subscriber databases (HLR/HSS).'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features per source_gt = [source_gt_id, uniq_msisdn_per_hour, location_query_ratio, fail_ratio]

      labels = DBSCAN(features, eps, min_samples)

      WHERE label == -1 /* outlier */ => INVESTIGATE

      => ALERT fields=[source_gt, top3_distinguishing_feature_values]'
- question: Is any non-whitelisted external Global Title issuing three or more location queries for the
    same single MSISDN within a 15-minute window?
  context: 'Collection: Whereas broad scanning enumerates many subscribers, targeted tracking repeatedly
    queries one victim to follow their movement. Grouping HLR/MAP queries by MSISDN and source GT and
    alerting when a non-whitelisted GT issues three or more location queries for the same MSISDN within
    15 minutes catches focused surveillance of an individual. This targeted-tracking floor aligns with
    the rule-based detection in the SS7 vulnerabilities survey and the high-risk SRI-SM/location operations
    highlighted by Jover. A hit identifies both the likely victim and the collecting GT. Sources: [SS7
    vulnerabilities survey](https://doi.org/10.1109/comst.2020.2971757); [Jover](https://doi.org/10.1145/3424302.3425909).'
  answer_sources:
  - HLR_query_logs
  - SGW_map_transactions.log
  - VLR_event_logs
  - roaming_partner_gt_whitelist.csv
  - 'NAI: Subscriber location databases (HLR/HSS, VLR) and the signaling gateways (SGW) that route queries
    to them.'
  range: Last 90 days; evaluate per rolling 15-minute window per MSISDN
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM map_txn JOIN whitelist ON source_gt

      WHERE source_gt NOT IN whitelist.gt AND opcode in location_query_set

      bucket span=15m by (msisdn, source_gt)

      WHERE count(*) >= 3 => ALERT fields=[msisdn, source_gt, count, window]'
- question: Do consecutive location/UpdateLocation results for a single MSISDN imply physically impossible
    movement between serving VLRs/cells?
  context: 'Collection: Impersonation-driven tracking can be exposed by physical plausibility. Cross-checking
    location/UpdateLocation results for one MSISDN against physical movement constraints - if consecutive
    queries place the subscriber in serving VLRs/cells that are too far apart to traverse in the elapsed
    time - reveals injected or spoofed signaling. Velocity and roaming-plausibility checks are specified
    by Singh, Holtmanns & Kantola and ENISA. An impossible-velocity event is high-confidence evidence
    of impersonation; consistent, plausible movement is benign. Sources: [Singh, Holtmanns & Kantola](https://doi.org/10.1007/978-3-030-12942-2_16);
    [ENISA signalling security in telecom SS7/Diameter/5G](https://www.enisa.europa.eu/publications/signalling-security-in-telecom-ss7-diameter-5g).'
  answer_sources:
  - HLR_query_logs
  - SGW_map_transactions.log
  - VLR_event_logs
  - roaming_partner_gt_whitelist.csv
  - 'NAI: Subscriber location databases (HLR/HSS, VLR) and the signaling gateways (SGW) that route queries
    to them.'
  range: Last 90 days; correlate consecutive events per MSISDN
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM (HLR_query_logs, VLR_event_logs) ORDER BY ts by msisdn\nFOR consecutive results r1,r2:\n\
      \  dist = geo_distance(cell(r1.vlr), cell(r2.vlr))\n  speed = dist / (r2.ts - r1.ts)\nWHERE speed\
      \ > MAX_PLAUSIBLE_KMH => ALERT fields=[msisdn, r1.vlr, r2.vlr, speed]"
- question: Which MSISDNs show low Shannon entropy of source Global Titles (queries dominated by a single
    GT) in the bottom 5th percentile over 24 hours?
  context: 'Collection: A subscriber queried by many partners over a day has high source-GT entropy; one
    tracked by a single GT has low entropy. Computing Shannon entropy of source GTs per MSISDN over 24
    hours and flagging MSISDNs in the bottom 5th percentile surfaces subscribers under focused surveillance,
    where queries are dominated by one GT. Pair this with per-subscriber query-rate deviation thresholds
    from Pavloski & Gelenbe to avoid flagging low-activity subscribers with naturally sparse data. Low
    entropy plus elevated rate is a strong targeted-collection signal. Sources: [Pavloski & Gelenbe](https://doi.org/10.5220/0005019802060212).'
  answer_sources:
  - HLR_query_logs
  - SGW_map_transactions.log
  - VLR_event_logs
  - roaming_partner_gt_whitelist.csv
  - 'NAI: Subscriber location databases (HLR/HSS, VLR) and the signaling gateways (SGW) that route queries
    to them.'
  range: Last 90 days; compute entropy per MSISDN over 24-hour windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM map_txn EARLIEST=-24h

      by msisdn: entropy = shannon( distribution(source_gt) )

      rate_dev = per-subscriber query-rate deviation

      thresh = percentile(entropy, 5)

      WHERE entropy <= thresh AND rate_dev high => ALERT fields=[msisdn, entropy, dominant_gt]'
- question: Does a sequence model (RNN/LSTM) over per-MSISDN MAP event sequences flag anomalous tracking
    patterns, such as repeated location queries without follow-on legitimate call/SMS activity?
  context: 'Collection: Legitimate location lookups usually precede real call or SMS delivery. Tracking
    generates repeated location queries with no subsequent legitimate activity. An RNN/LSTM over per-MSISDN
    MAP event sequences learns normal interaction patterns and flags anomalous tracking sequences. LSTM/CNN/autoencoder
    sequence models for SS7 are evaluated by Guo et al. Emit the top-3 sequence features (repeat count,
    inter-query interval, absence of follow-on activity) with each alert so the analyst can confirm the
    pattern. Repeated location resolution with no call/SMS follow-on is highly indicative of covert collection.
    Sources: [Guo et al.](https://doi.org/10.3390/info14090509).'
  answer_sources:
  - HLR_query_logs
  - SGW_map_transactions.log
  - VLR_event_logs
  - roaming_partner_gt_whitelist.csv
  - 'NAI: Subscriber location databases (HLR/HSS, VLR) and the signaling gateways (SGW) that route queries
    to them.'
  range: Last 90 days for scoring; train on historical per-MSISDN sequences
  queries:
  - technology: ML/pseudocode
    query: 'seq per msisdn = ordered MAP events [opcode, ts, result, followon_call_sms?]

      model = LSTM_autoencoder(seq)

      recon_err = model.score(seq)

      WHERE recon_err > threshold AND no_followon_activity

      => ALERT fields=[msisdn, repeat_count, inter_query_interval, followon=false]'
- question: Is the network sending successful SS7 MAP responses carrying location data (serving MSC/VLR
    address, cell ID) to destination Global Titles not on the roaming-partner whitelist?
  context: 'Collection: Detection should not stop at the query; the critical event is successful exfiltration
    of location data. Correlating inbound location queries with outbound responses by transaction ID and
    alerting critically when a successful response carrying location data (serving MSC/VLR address, cell
    ID) is forwarded to a non-whitelisted destination GT confirms that the adversary actually obtained
    the subscriber''s location. This egress-collection rule is described in Attack Detection in SS7 and
    the SS7 vulnerabilities survey. A positive result is the highest-severity indicator: the data has
    left the network to an unauthorized party. Sources: [Attack Detection in SS7](https://doi.org/10.1007/978-3-031-20215-5_2);
    [SS7 vulnerabilities survey](https://doi.org/10.1109/comst.2020.2971757).'
  answer_sources:
  - HLR_query_logs
  - SGW_map_transactions.log
  - roaming_partner_gt_whitelist.csv
  - 'NAI: Egress points of the core network''s signaling plane, specifically the Signaling Gateways (SGWs)
    responsible for forwarding responses to external networks.'
  range: Last 90 days; correlate inbound/outbound by transaction ID
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM map_txn\nCORRELATE inbound_query WITH outbound_response BY transaction_id\nWHERE response.success=true\
      \ AND response.payload contains (serving_msc_vlr OR cell_id)\n  AND dest_gt NOT IN whitelist.gt\n\
      => ALERT severity=critical, fields=[dest_gt, msisdn, serving_vlr, cell_id, transaction_id]"
- question: Do non-whitelisted Global Titles show hourly location-query success rates above 90% and above
    the 95th percentile of legitimate-partner baseline success rates?
  context: 'Collection: A non-whitelisted GT that not only queries but reliably succeeds is effectively
    collecting data. Computing hourly success rates (state metric) of location queries for non-whitelisted
    GTs and alerting when the success rate exceeds 90% and the 95th percentile of baseline legitimate-partner
    success rates distinguishes effective collectors from failing scanners. Profiling both success and
    failure ratios per Beumier & Debatty and ENISA gives a fuller behavioral picture. High success from
    an unauthorized origin means location data is consistently being returned and harvested. Sources:
    [Beumier & Debatty](https://doi.org/10.1007/978-3-031-20215-5_2); [ENISA signalling security in telecom
    SS7/Diameter/5G](https://www.enisa.europa.eu/publications/signalling-security-in-telecom-ss7-diameter-5g).'
  answer_sources:
  - HLR_query_logs
  - SGW_map_transactions.log
  - roaming_partner_gt_whitelist.csv
  - 'NAI: Egress points of the core network''s signaling plane, specifically the Signaling Gateways (SGWs)
    responsible for forwarding responses to external networks.'
  range: Last 90 days; compute hourly, compare to partner baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM map_txn WHERE source_gt NOT IN whitelist.gt

      bucket span=1h by source_gt

      success_rate = count(result=''success'') / count(*)

      baseline_p95 = percentile(partner_success_rate, 95)

      WHERE success_rate > 0.90 AND success_rate > baseline_p95 => ALERT fields=[source_gt, success_rate]'
- question: Modeling Global Titles and MSISDNs as a bipartite graph, which non-whitelisted GTs show anomalously
    high fan-in of successful collections, and what graph features explain it?
  context: 'Collection: A prolific collector links to many MSISDNs with high success. Modeling GTs and
    MSISDNs as a bipartite graph and applying anomaly/centrality detection identifies non-whitelisted
    GTs with high fan-in successful-collection patterns. Flag nodes with anomalously high successful-link
    counts and report the top-3 contributing graph features (fan-in, success ratio, query volume) for
    explainability. Graph/ML detection on SS7/Diameter signalling is supported by Guo et al. and the device/spec-based
    corroboration of Tan et al. A central, high-success GT node is a likely collection hub. Sources: [Guo
    et al.](https://doi.org/10.3390/info14090509); [Tan et al.](https://doi.org/10.1109/cns53000.2021.9705031).'
  answer_sources:
  - HLR_query_logs
  - SGW_map_transactions.log
  - roaming_partner_gt_whitelist.csv
  - 'NAI: Egress points of the core network''s signaling plane, specifically the Signaling Gateways (SGWs)
    responsible for forwarding responses to external networks.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "build bipartite graph G(nodes=GTs+MSISDNs, edges=successful_collection)\nfor gt in GTs where\
      \ gt NOT IN whitelist:\n  fan_in = successful_link_count(gt); centrality = score(gt)\nWHERE fan_in\
      \ anomalously high => ALERT fields=[gt, fan_in, success_ratio, query_volume]"
- question: For high-confidence collection alerts involving call/SMS redirection, does an independent
    out-of-band signal (e.g., audio-based distance bounding) corroborate path rerouting?
  context: 'Collection: Some SS7 abuse redirects calls or SMS, but signaling logs alone can yield false
