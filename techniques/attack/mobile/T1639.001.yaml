questions:
- question: Are any mobile-device IPs issuing DNS queries that violate protocol structure or policy --
    specifically queries using NULL, TXT, or CNAME record types to a non-authorized service, any single
    DNS label exceeding 63 octets or a total name exceeding 255 octets (out-of-spec per RFC 1035), or
    queries whose parent domain matches a known DNS-tunneling threat-intelligence list?
  context: 'DNS tunneling is a classic way to smuggle data out of a mobile device over an unencrypted,
    non-C2 protocol because DNS is almost always permitted to egress. This deterministic, high-precision
    first cut keys on the structural and record-type artifacts that legitimate DNS rarely exhibits: tunneling
    tools favor TXT/NULL/CNAME records to carry payload, and encoded data frequently pushes labels past
    the [RFC 1035](https://www.rfc-editor.org/rfc/rfc1035) 63-octet label / 255-octet name limits. Combining
    the record-type filter with label-structure and subdomain-cardinality checks (per [Below the Radar,
    Tatang et al.](https://docs.apwg.org/ecrimeresearch/2019/Nov13_DennisTatang.pdf)) and a threat-intel
    domain match yields a low-false-positive rule. For the Exfiltration tactic, a hit means a managed
    mobile device is very likely encoding stolen data into DNS queries to an attacker-controlled authoritative
    server. A positive result should be high severity; a negative result does not clear the device because
    well-tuned tunnels can stay in-spec, so corroborate with the statistical and ML baselines. This deterministic
    DNS-abuse rule guidance aligns with [MITRE ATT&CK T1071.004](https://attack.mitre.org/techniques/T1071/004/).'
  answer_sources: &id001
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic logs
  - MDM/UEM Network Flow Logs
  - 'NAI: Network egress points, DNS resolver logs, VPN concentrators, corporate Wi-Fi access point logs,
    Mobile Device Management (MDM) platforms, Cloud Access Security Broker (CASB) logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM dns.log\nWHERE id.orig_h IN mobile_device_subnets\n  AND ( qtype_name IN ('NULL','TXT','CNAME')\
      \ AND parent_domain NOT IN authorized_services\n        OR max_label_len > 63 OR total_name_len\
      \ > 255\n        OR parent_domain IN ti_dns_tunneling_list )\nEMIT severity=high WITH id.orig_h,\
      \ query, qtype_name, parent_domain"
- question: For each mobile-device IP and parent domain, does the DNS query length exceed the 99th percentile
    or Shannon entropy exceed 4.5, does the query rate to a single parent domain exceed 3 standard deviations
    in a 1-minute window, and is there a sustained high NXDOMAIN/SERVFAIL ratio with high-entropy subdomains
    versus a 30-day lexical/volumetric baseline?
  context: Tuned DNS tunnels can evade pure structural rules, so build a 30-day per-(mobile IP, registered
    domain) baseline of lexical and volumetric features (distinct subdomain count, average subdomain length,
    Shannon entropy, numeric/uppercase character ratios, RR-type diversity), per [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf)
    Alert when query length passes the 99th percentile or entropy passes 4.5, and when query rate to one
    parent domain exceeds 3 standard deviations in a 1-minute window, escalating if both fire within 5
    minutes. Confirm suspected tunnels with a lossless-compression bound (benign domains compress, tunnels
    do not, per [Born, Gustafson, Paxson](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_paxson.pdf))
    and an n-gram/Zipfian matching score ([Dusi et al., NgViz](https://arxiv.org/pdf/1004.4359)). For
    resolver-side coverage of slow, low-throughput channels, use an information heavy-hitter estimator
    ([Ozery et al., ibHH](https://www.ndss-symposium.org/wp-content/uploads/2024-388-paper.pdf)) and sliding-window
    baselines ([Nadler et al. (low-throughput)](https://arxiv.org/abs/1709.08395)). A sustained high NXDOMAIN/SERVFAIL
    ratio combined with high-entropy subdomains is a strong failure-mode signal of blind or staged exfiltration.
    Derive dataset-specific thresholds from [CIC-Bell-DNS-EXF-2021](https://www.unb.ca/cic/datasets/dns-exf-2021.html).
    For Exfiltration, this catches covert channels that look benign per-query but are anomalous in aggregate.
  answer_sources: *id001
  range: Last 90 days; baseline window 30 days, evaluate per 1-minute window
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each (mobile_ip, parent_domain):\n  baseline = profile(dns.log, lookback=30d:\n    distinct_subdomains,\
      \ avg_subdomain_len, shannon_entropy, num_ratio, upper_ratio, rrtype_diversity)\n  ALERT IF subdomain_len\
      \ > p99(baseline.len) OR shannon_entropy(subdomain) > 4.5\n  ALERT IF query_rate(window=1m) > mean\
      \ + 3*stddev(baseline.rate)\n  ESCALATE IF both fire WITHIN 5m\n  CONFIRM IF compression_ratio(subdomains)\
      \ ~ 1.0  # does not compress -> tunnel\n  SIGNAL high (NXDOMAIN+SERVFAIL)/total WITH high entropy\
      \ -> blind exfil"
- question: Does an Isolation Forest over per-registered-domain DNS features flag anomalies (with the
    top-3 contributing features surfaced), does a supervised Random Forest or character-level CNN assign
    a tunneling probability above 0.9, and for confirmed tunnels can a metadata-sequence model attribute
    the responsible tool or malware family, while a SARIMA forecast flags TXT/NULL query volume beyond
    its confidence interval?
  context: Machine learning captures multi-feature tunneling patterns that single-dimension rules miss.
    Score DNS per registered domain with an Isolation Forest over the lexical/volumetric features ([Nadler
    et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf)) and emit the top-3 contributing
    features (e.g., subdomain entropy, average length, TXT/NULL ratio) in the alert so analysts can triage
    quickly. Add a supervised Random Forest or character-level CNN validated on real traffic ([Lambion
    et al.](https://faculty.washington.edu/mdecock/papers/dlambion2020a.pdf)) and alert when probability
    exceeds 0.9. For confirmed tunnels, run a metadata-sequence model ([Domainator, AlNabulsi et al.](https://arxiv.org/abs/2505.22220))
    to attribute the responsible tool/malware family, which sharpens incident response. Maintain a SARIMA
    forecast of TXT/NULL query volume per device and alert on volumes that exceed the forecast confidence
    interval, catching slow ramp-ups. For the Exfiltration tactic, a high-probability classification on
    a mobile device's DNS strongly corroborates covert data egress; keep the deterministic and statistical
    detectors running in parallel and retrain to counter drift and evasion.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = per_registered_domain(dns.log:\n  subdomain_entropy, avg_len, txt_null_ratio, distinct_subdomains,\
      \ rrtype_diversity)\niso = IsolationForest.fit(features); WHEN iso.anomaly: EMIT alert WITH top3_features\n\
      p = RandomForest|CharCNN.predict_proba(features); WHEN p > 0.9: EMIT alert\nFOR confirmed tunnel:\
      \ family = Domainator.attribute(metadata_sequence)\nforecast = SARIMA(txt_null_volume per device);\
      \ WHEN observed > forecast_ci_upper: EMIT alert"
- question: Are there outbound HTTP POST or PUT requests from mobile-device IPs where the destination
    matches threat intel, the domain was registered under 30 days ago, the User-Agent contains command-line-tool
    substrings (curl, wget, python-requests), a generic Content-Type (application/octet-stream) is sent
    to a non-API endpoint, or the request body/query string contains known PII identifiers (IMEI, device
    ID, advertising ID, location, credentials)?
  context: 'HTTP is unencrypted in the clear (absent TLS) and ubiquitous, making it an attractive non-C2
    exfiltration channel. This deterministic rule flags the tell-tale indicators of scripted or tooled
    data upload from a mobile device: command-line User-Agents that no legitimate mobile app emits, generic
    octet-stream content posted to endpoints that are not real APIs, and destinations that are low-reputation,
    newly registered, or on a threat-intel list. Layered on top, deterministic string matching for PII
    identifiers in request bodies and query strings (per [ReCon, Ren et al.](https://david.choffnes.com/pubs/recon-mobisys16.pdf))
    catches the actual sensitive data leaving the device. For the Exfiltration tactic, a match is high-confidence
    evidence that data is being POST/PUT-ed off the device over plain HTTP; pivot from the request to
    the device, user, and originating app. Tie HTTP-abuse rules to [MITRE ATT&CK T1071.004](https://attack.mitre.org/techniques/T1071/004/)
    guidance. A negative result does not clear the device because PII can be encoded; corroborate with
    the statistical and ML detectors.'
  answer_sources: &id002
  - Zeek http.log
  - Zeek conn.log
  - Zeek files.log
  - MDM/UEM Network Flow Logs
  - 'NAI: Network egress points, API Gateways, web proxy logs, MDM/UEM logs with network activity, and
    Cloud Access Security Broker (CASB) logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM http.log\nWHERE id.orig_h IN mobile_device_subnets AND method IN ('POST','PUT')\n  AND\
      \ ( host IN ti_bad_destinations OR domain_age(host) < 30d\n        OR user_agent MATCHES 'curl|wget|python-requests'\n\
      \        OR (content_type == 'application/octet-stream' AND uri NOT MATCHES api_endpoint)\n    \
      \    OR body|query_string MATCHES pii_regex(IMEI|device_id|ad_id|location|credentials) )\nEMIT severity=high\
      \ WITH id.orig_h, host, user_agent, content_type, uri"
- question: For each mobile device and destination, does an HTTP POST/PUT exceed the 99th percentile of
    post_body_len or 5MB with body Shannon entropy above 4.2, does the POST-to-GET ratio exceed 3 standard
    deviations above the 30-day baseline, and is there a burst of HTTP 4xx/5xx errors to a low-reputation
    host alongside a few large successful POSTs?
  context: Bulk data exfiltration over HTTP shows up as request bodies far larger than the device's norm
    and as a skewed upload-versus-download pattern. Maintain a 30-day baseline of post_body_len and POST-to-GET
    ratio per destination. Alert when a POST/PUT exceeds the device's 99th percentile or 5MB, then compute
    body Shannon entropy and escalate if it exceeds 4.2 -- high entropy indicates compressed/encoded or
    already-encrypted-at-rest data being shipped out (consistent with [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf)'s
    entropy/length anomaly approach). A POST-to-GET ratio more than 3 standard deviations above baseline
    indicates a device that is predominantly uploading, atypical for normal mobile use. The failure-mode
    signal -- a burst of 4xx/5xx errors to a low-reputation host accompanied by a few large successful
    POSTs -- reveals exfiltration attempts and retries against flaky attacker infrastructure. For the
    Exfiltration tactic, these volumetric anomalies catch covert uploads that individually evade signature
    rules; derive thresholds from per-device and per-destination baselines.
  answer_sources: *id002
  range: Last 90 days; baseline window 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each (device_ip, destination):\n  baseline = profile(http.log, lookback=30d: post_body_len,\
      \ post_to_get_ratio)\n  ALERT IF post_body_len > max(p99(baseline.post_body_len), 5MB)\n    THEN\
      \ escalate IF shannon_entropy(body) > 4.2\n  ALERT IF post_to_get_ratio > mean + 3*stddev(baseline.ratio)\n\
      \  SIGNAL burst(status IN 4xx|5xx) to low_rep_host WITH few large successful POSTs -> exfil retries"
- question: Does an Isolation Forest over HTTP request features (post_body_len, destination IP rarity,
    body entropy, User-Agent rarity, Content-Type rarity, POST-to-GET ratio) flag anomalies with the top-3
    features surfaced, does an online autoencoder ensemble (Kitsune) flag abnormal outbound volume/timing
    via reconstruction error, and do per-destination decision-tree classifiers detect app-attributed PII
    leaks?
  context: Supervised and unsupervised models capture combinations of weak signals that no single HTTP
    rule will catch. Use an Isolation Forest on request features (post_body_len, destination IP rarity,
    body entropy, User-Agent rarity, Content-Type rarity, POST-to-GET ratio) per [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf),
    surfacing the top-3 contributing features in each alert for explainability. Complement it with the
    online autoencoder ensemble of [Kitsune, Mirsky et al.](https://arxiv.org/abs/1802.09089) over incremental
    flow statistics (bandwidth, rate, jitter, inter-arrival) to flag abnormal outbound volume and timing
    via reconstruction error -- effective for streaming, low-and-slow exfiltration. For app-attributed
    PII leaks, train per-destination decision-tree classifiers as in [ReCon, Ren et al.](https://david.choffnes.com/pubs/recon-mobisys16.pdf)
    to identify which app is leaking which identifier to which host. For the Exfiltration tactic, a high-confidence
    model hit on a mobile device's HTTP traffic corroborates covert upload; keep deterministic and statistical
    detectors running in parallel and retrain periodically.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = extract(http.log,conn.log:\n  post_body_len, dst_ip_rarity, body_entropy, ua_rarity,\
      \ content_type_rarity, post_to_get_ratio)\niso = IsolationForest.fit(features); WHEN iso.anomaly:\
      \ EMIT alert WITH top3_features\nkitsune = AutoencoderEnsemble.online(flow_stats: bw, rate, jitter,\
      \ inter_arrival)\nWHEN kitsune.recon_error > thresh: EMIT alert\nFOR pii_leak: clf = DecisionTree.per_destination();\
      \ WHEN clf.flags_leak: EMIT alert WITH app, host"
- question: Is any mobile-device IP connecting outbound to TCP port 21 (FTP), does Zeek ftp.log show STOR
    or APPE upload commands on that session, and does the MDM/UEM application inventory confirm there
    is no approved FTP client installed on that device?
  context: 'FTP is an unencrypted, non-C2 protocol with essentially no legitimate use case on a corporate
    mobile device, so any FTP traffic is inherently suspicious and warrants a zero-tolerance critical
    alert. Trigger on any conn.log entry where a mobile device connects to port 21, escalate when ftp.log
    shows STOR or APPE commands (active file upload -- the core of exfiltration), and cross-check the
    MDM/UEM inventory: if no authorized FTP client is installed, treat it as confirmed malicious activity.
    This deterministic policy rule aligns with application-layer-abuse detection guidance in [MITRE ATT&CK
    T1071.004](https://attack.mitre.org/techniques/T1071/004/). For the Exfiltration tactic, a positive
    result is among the highest-confidence indicators in this playbook that data is being shipped off
    a device over an unencrypted channel; pivot immediately to the device, user, destination host, and
    the responsible application.'
  answer_sources: &id003
  - Zeek ftp.log
  - Zeek conn.log
  - MDM/UEM Network Flow Logs
  - MDM/UEM Application Inventory
  - 'NAI: Network egress points, network firewalls, VPN concentrators, corporate Wi-Fi access points,
    and DMZ network segments.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'FROM conn.log

      WHERE id.orig_h IN mobile_device_subnets AND id.resp_p == 21

      EMIT severity=critical

      JOIN ftp.log: ESCALATE IF command IN (''STOR'',''APPE'')

      JOIN mdm_app_inventory(device_id): IF no approved_ftp_client -> confirmed_malicious'
- question: For any FTP session from a mobile device, does total session volume (orig_bytes + resp_bytes)
    exceed 10MB or the 99.9th percentile of the device's 30-day baseline, is this the device's first-ever
    FTP usage, and are there repeated failed FTP control responses (e.g., 530 login failures, 550 errors)?
  context: 'Once any FTP session is detected, statistical context determines how severe it is. Analyze
    total session volume (orig_bytes + resp_bytes) and escalate to highest priority when volume exceeds
    10MB or the 99.9th percentile of the device''s 30-day baseline, since large transfers indicate substantive
    data loss. First-ever FTP usage by a device also escalates, because a brand-new protocol behavior
    on a mobile device is a strong anomaly. The failure-mode signal is critical here: repeated failed
    FTP control responses -- 530 login failures, 550 errors, failed STOR attempts -- indicate exfiltration
    attempts even when no bytes ultimately transfer, so they must not be dismissed as benign noise. For
    the Exfiltration tactic, these measures distinguish a trivial probe from active bulk data theft and
    surface attempts that fail before completing.'
  answer_sources: *id003
  range: Last 90 days; baseline window 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each ftp_alert(device_id):\n  volume = orig_bytes + resp_bytes\n  ESCALATE highest IF\
      \ volume > max(10MB, p999(baseline_30d.volume))\n  ESCALATE IF first_ever_ftp_usage(device_id)\n\
      \  SIGNAL count(ftp.reply_code IN ('530','550')) repeated -> exfil attempts even with 0 bytes"
- question: Does K-Means clustering over daily device features (FTP usage flag, distinct protocol count,
    destination port entropy, average outbound bytes, total sessions) place any device in a micro-cluster
    or FTP-defined cluster (with the driving features reported), and does an online autoencoder ensemble
    (Kitsune) flag anomalous FTP session volume or timing via reconstruction error?
  context: Unsupervised clustering reveals devices whose overall behavior is an outlier without needing
    labeled attack data. Run K-Means on daily per-device features (FTP usage flag, distinct protocol count,
    destination port entropy, average outbound bytes, total sessions) and flag devices that fall into
    micro-clusters or clusters defined by FTP usage for immediate investigation, reporting the features
    that drove the cluster assignment so the analyst understands why. Complement this with the online
    autoencoder ensemble of [Kitsune, Mirsky et al.](https://arxiv.org/abs/1802.09089) over flow statistics
    to flag anomalous FTP session volume and timing via reconstruction error, surfacing the top contributing
    flow features in the alert. For the Exfiltration tactic, a device isolated into an FTP-defined or
    micro-cluster is behaving unlike the rest of the fleet -- a strong prior for covert exfiltration over
    this unencrypted protocol; keep the deterministic zero-tolerance rule running in parallel as the floor.
  answer_sources: *id003
  range: Last 90 days; daily feature aggregation
  queries:
  - technology: SIEM/ML pseudocode
    query: "daily_features = per_device(conn.log,ftp.log:\n  ftp_usage_flag, distinct_protocols, dst_port_entropy,\
      \ avg_outbound_bytes, total_sessions)\nkm = KMeans.fit(daily_features)\nWHEN device IN micro_cluster\
      \ OR ftp_defined_cluster: EMIT alert WITH driving_features\nkitsune = AutoencoderEnsemble.online(ftp_flow_stats)\n\
      WHEN kitsune.recon_error > thresh: EMIT alert WITH top_flow_features"
