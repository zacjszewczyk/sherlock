name: 'T1639.001: Exfiltration Over Unencrypted Non-C2 Protocol'
id: fd22a1b0-d550-439d-abf4-e089e695769c
description: 'Investigate whether an adversary is exfiltrating data from corporate mobile devices over
  an unencrypted network protocol distinct from the existing command-and-control channel, possibly to
  an alternate destination, by hiding the data (encoding, compression, or header embedding) inside natively
  unencrypted protocols such as DNS, HTTP, or FTP. This playbook helps an analyst pursue three overlapping
  evidence trails tied to the Exfiltration tactic: (1) DNS tunneling, where a mobile device issues sustained,
  high-frequency queries to a single parent domain with abnormally long, high-entropy subdomains and atypical
  record types (TXT, CNAME, NULL); (2) suspicious outbound HTTP POST/PUT activity, characterized by oversized
  high-entropy request bodies, command-line-tool User-Agents, generic Content-Types to non-API endpoints,
  low-reputation or newly registered destinations, and embedded PII identifiers; and (3) outbound FTP
  from mobile devices, which is inherently anomalous and critically elevated when STOR/APPE uploads, large
  transfers, or unapproved FTP clients are involved. Each evidence trail provides symbolic-logic, statistical,
  and machine-learning detection approaches so an analyst can confirm whether data is leaving the device
  covertly over an unencrypted non-C2 protocol, attribute the responsible app or tool, and scope the exposure.'
type: technique
related:
- tactic_id: TA0036
  tactic_name: Exfiltration
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
