questions:
- question: Are managed mobile devices contacting destination domains or IP addresses that match known
    command-and-control indicators or packaged proxy/Zeek detection rules for rare User-Agents, framework
    URIs, and non-browser HTTPS initiation?
  context: 'Adversaries use web protocols (HTTP/HTTPS) for C2 because the traffic blends with ordinary
    device activity. The most deterministic floor is to match destination FQDNs and IPs seen in Zeek dns.log
    and http.log against curated threat-intelligence C2 indicator feeds, and to apply Sigma-style proxy/Zeek
    rules that flag rare or framework-specific User-Agent strings, known C2 URI patterns, and HTTPS connections
    initiated by non-browser clients. Restrict matching to mobile-device network segments to reduce noise.
    A positive exact match is high-confidence and should be triaged immediately; a negative result does
    not clear the device because adversaries rotate infrastructure, so pair this with the behavioral analytics
    below. This directly supports the Command and Control tactic by identifying the channel an operator
    uses to reach compromised handsets. References: [Sigma](https://github.com/SigmaHQ/sigma); [MITRE
    T1437.001](https://attack.mitre.org/techniques/T1437/001/).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - Threat intelligence indicators
  - 'NAI: Corporate Wi-Fi network egress points, VPN concentrators, Mobile Device Management (MDM) gateways,
    forward/reverse proxies, and central DNS resolvers that process traffic from managed mobile device
    subnets or enrolled devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ti = load_c2_indicators(domains, ips, ja3, uris, user_agents);\nobs = join(zeek_dns, zeek_http)\
      \ where src_subnet in mobile_device_segments;\nalert when obs.dest_fqdn in ti.domains or obs.dest_ip\
      \ in ti.ips\n  or obs.user_agent matches rare_or_framework_UA_rules\n  or (obs.proto='https' and\
      \ obs.client_is_non_browser=true);\noutput device_id, dest, user_agent, uri, matched_indicator."
- question: Is HTTP/S traffic to mobile push-notification endpoints (FCM/GCM such as fcm.googleapis.com
    or mtalk.google.com, or APNS *.push.apple.com) originating from an application that does not declare
    messaging or notification functionality?
  context: 'Push-notification services are legitimate HTTP/S channels native to Android and iOS, and adversaries
    abuse them (GCM/FCM for two-way, APNS server-to-device) to deliver commands and exfiltrate results
    while appearing as routine device traffic that enterprises rarely inspect. The detection correlates
    the destination push endpoint with the originating application''s declared manifest/entitlements:
    a flow to FCM/GCM or APNS from an app that has no messaging or notification capability is anomalous
    and indicates the push channel is being repurposed for C2. Analysts should confirm the app identity
    (package name / bundle ID via MDM inventory), the endpoint, and whether the app legitimately uses
    push. A positive result strongly implicates notification-service abuse for command and control; benign
    push libraries embedded in many apps can cause false positives, so validate the app''s expected behavior.
    References: [MITRE T1437.001](https://attack.mitre.org/techniques/T1437/001/).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - Threat intelligence indicators
  - 'NAI: Corporate Wi-Fi network egress points, VPN concentrators, Mobile Device Management (MDM) gateways,
    forward/reverse proxies, and central DNS resolvers that process traffic from managed mobile device
    subnets or enrolled devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "push = join(zeek_http, zeek_ssl, mdm_app_inventory) where\n  dest in ['fcm.googleapis.com','mtalk.google.com','*.push.apple.com'];\n\
      alert when push.app.declares_messaging=false and push.app.declares_notifications=false;\noutput\
      \ device_id, app_package, dest_endpoint, bytes, session_count."
- question: For each mobile device and destination, do connection cadence, payload size, byte ratio, and
    URI entropy indicate automated beaconing rather than human-driven web activity?
  context: 'Beaconing is a hallmark of web-protocol C2: implants poll a controller on a regular schedule,
    producing low inter-arrival-time variance and structured payload exchanges. Compute per-destination
    beacon scores from the inter-arrival-time coefficient of variation (CV below 0.1), MAD/Bowley skewness
    of payload sizes, FFT periodicity, long connection duration, and external-destination rarity (RITA-style).
    Add the orig_bytes/resp_bytes ratio (greater than 10.0 or less than 0.1) and URI entropy or low-compressibility
    above the 98th percentile using compression-based per-field information bounds. Derive thresholds
    per environment from a rolling 30-day baseline and alert only when a destination trips multiple independent
    anomalies to control false positives from legitimate polling apps. A positive multi-signal hit indicates
    an automated C2 channel; investigate the app, destination reputation, and data volume. References:
    [RITA](https://github.com/activecm/rita); [Practical Comprehensive Bounds, Paxson et al.](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_paxson.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - Threat intelligence indicators
  - 'NAI: Corporate Wi-Fi network egress points, VPN concentrators, Mobile Device Management (MDM) gateways,
    forward/reverse proxies, and central DNS resolvers that process traffic from managed mobile device
    subnets or enrolled devices.'
  range: Last 90 days, with a 30-day per-device/destination baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for (device,dest) in zeek_conn|zeek_http:\n  iat = inter_arrival_times(sessions);\n  cv =\
      \ stddev(iat)/mean(iat);\n  skew = bowley_skew(payload_sizes); period = fft_periodicity(iat);\n\
      \  ratio = sum(orig_bytes)/sum(resp_bytes);\n  uri_ent = shannon_entropy(uri_paths);\n  score =\
      \ count_signals(cv<0.1, period_strong, ratio>10 or ratio<0.1,\n                        uri_ent>p98(baseline),\
      \ dest_rarity_high);\nalert when score >= 2; output device, dest, cv, ratio, uri_ent, score."
- question: Is a single destination producing a burst of HTTP 4xx/5xx errors, TLS handshake or certificate-validation
    failures, or blocked/RST egress that deviates from the device's normal failure rate?
  context: 'Dead-drop resolvers and rotating C2 infrastructure produce distinctive failure cadences that
    differ from steady successful beacons: an implant repeatedly attempting to reach a controller that
    is down, blocked, or cycling through domains generates clusters of 4xx/5xx responses, TLS handshake
    or cert-validation failures, or RST/blocked egress. Baseline per-destination error rates per device
    and alert on bursts that exceed the device norm. Treat elevated failure rates to a single destination
    as a distinct C2 signal even in the absence of successful beaconing, because it can reveal infrastructure
    that defenses are already partially blocking. A positive result warrants reviewing the destination,
    the originating app, and whether successful connections later resumed to a related host. References:
    [RITA](https://github.com/activecm/rita).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - Threat intelligence indicators
  - 'NAI: Corporate Wi-Fi network egress points, VPN concentrators, Mobile Device Management (MDM) gateways,
    forward/reverse proxies, and central DNS resolvers that process traffic from managed mobile device
    subnets or enrolled devices.'
  range: Last 90 days, with per-destination error-rate baselines
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = baseline_error_rate by device,dest over 30d;\nwin = summarize by device,dest,1h:\n\
      \  errs = count(http_status in [4xx,5xx]) + count(tls_handshake_fail)\n       + count(cert_validation_fail)\
      \ + count(conn_state in ['RSTO','REJ','blocked']);\nalert when win.errs > base.mean + 3*base.stddev;\n\
      output device, dest, error_count, baseline, error_types."
- question: Does an unsupervised or semi-supervised model flag a mobile device's web sessions or outbound
    data volume as anomalous compared to its benign per-device baseline?
  context: 'When signatures and single-feature thresholds miss novel tradecraft, machine learning can
    surface flows that are collectively abnormal. Train unsupervised detectors (Isolation Forest or One-Class
    SVM, with OCSVM most robust to training poisoning) on benign per-device Zeek/NetFlow features such
    as duration, bytes, byte ratio, bytes-per-minute, URI length, and User-Agent/JA3 frequency, and the
    inter-arrival standard deviation. Complement with semi-supervised app fingerprinting (FlowPrint) that
    flags flows matching no known app fingerprint, and contrastive self-supervised scoring (ET-SSL) on
    encrypted-flow shape. Add a per-device ARIMA forecast on outbound volume and alert on exceedance to
    catch staged exfiltration over the C2 channel. Surface the top-3 contributing features (e.g., byte
    ratio, beacon CV, JA3 rarity) via SHAP/LIME so the analyst understands why a session scored high.
    A high anomaly score plus an interpretable driver should prompt review of the app, destination, and
    volume against the baseline. References: [Robust IoT IF/OCSVM](https://www.nature.com/articles/s41598-025-20445-4);
    [FlowPrint](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24412-paper.pdf); [ET-SSL](https://www.nature.com/articles/s41598-025-08568-0);
    [SHAP-IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - Threat intelligence indicators
  - 'NAI: Corporate Wi-Fi network egress points, VPN concentrators, Mobile Device Management (MDM) gateways,
    forward/reverse proxies, and central DNS resolvers that process traffic from managed mobile device
    subnets or enrolled devices.'
  range: Last 90 days for training; per-device scoring with weekly retraining
  queries:
  - technology: ML/pseudocode
    query: "feats = per_device_flow_features(duration, bytes, byte_ratio, bytes_per_min,\n         uri_len,\
      \ ua_freq, ja3_freq, iat_stddev);\nmodel = train_isolation_forest_or_ocsvm(benign_baseline(feats));\n\
      score = model.anomaly_score(current_flow);\nfp_flag = flowprint_no_match(current_flow);\nvol_excess\
      \ = arima_forecast_exceedance(outbound_volume by device);\nexplain = shap_top3(feats);\nalert when\
      \ score>=threshold or fp_flag or vol_excess;\noutput device, score, explain, dest, app."
- question: Does a TLS session from a managed mobile device present a client or server fingerprint (JA3/JA3S/JA4/JA4S/JA4H/JA4X)
    that matches a known malicious hash on a threat-intelligence feed?
  context: 'TLS fingerprints capture the way a client negotiates encryption (offered cipher suites, extensions,
    curves), which often reveals the malicious tooling behind an encrypted C2 channel even when payloads
    cannot be inspected. Match Zeek ssl.log ja3/ja3s values against threat-intelligence malicious fingerprint
    lists, and add version-resilient JA4/JA4S/JA4H/JA4X matching to catch browser-impersonating HTTP clients
    and anomalous certificate issuers. Alert on any exact match. This is a deterministic, high-confidence
    signal that the encrypted session originates from known-bad software; analysts should pivot to the
    device, destination, certificate, and concurrent flows. Because some fingerprints are shared across
    many tools, validate against the destination and other anomalies before attributing a specific malware
    family. References: [JA3](https://github.com/salesforce/ja3); [JA4+](https://github.com/FoxIO-LLC/ja4).'
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek x509.log
  - Threat intelligence indicators
  - 'NAI: Network sensors at key chokepoints with visibility into traffic from managed mobile devices,
    including corporate Wi-Fi egress points, VPN concentrators, Mobile Device Management (MDM) gateways,
    and forward proxies capable of inspecting TLS handshakes to generate Zeek log data.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "mal_fp = load_malicious_fingerprints(ja3, ja3s, ja4, ja4s, ja4h, ja4x);\ntls = zeek_ssl where\
      \ src_subnet in mobile_device_segments;\nalert when tls.ja3 in mal_fp or tls.ja3s in mal_fp\n  or\
      \ tls.ja4 in mal_fp or tls.ja4s in mal_fp\n  or tls.ja4h in mal_fp or tls.ja4x in mal_fp;\noutput\
      \ device_id, dest, fingerprint, matched_feed."
- question: Is a TLS fingerprint statistically rare across enterprise mobile traffic and accompanied by
    a suspicious server certificate (self-signed, single-SAN, or recently issued)?
  context: 'Rarity alone is unreliable because browser GREASE and TLS extension randomization inflate
    the number of unique JA3 values, so this analytic requires corroboration. Maintain a 30-day JA3/JA4
    frequency baseline for mobile traffic; when a fingerprint falls below the 1st percentile and is not
    on an application allowlist, enrich with x509.log and alert only when the associated certificate is
    self-signed, has a single SAN, or has a not_before date within the last 30 days. These certificate
    properties are common to attacker-stood-up C2 endpoints. A positive result combining a rare fingerprint
    with a freshly minted or self-signed certificate is a strong indicator of a malicious encrypted channel;
    benign but uncommon apps can match, so confirm the destination and app context before escalating.
    References: [Stamus: JA3 Fingerprints Fade](https://www.stamus-networks.com/blog/ja3-fingerprints-fade-browsers-embrace-tls-extension-randomization);
    [Deciphering Malware''s use of TLS, Anderson et al.](https://arxiv.org/abs/1607.01639).'
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek x509.log
  - Threat intelligence indicators
  - 'NAI: Network sensors at key chokepoints with visibility into traffic from managed mobile devices,
    including corporate Wi-Fi egress points, VPN concentrators, Mobile Device Management (MDM) gateways,
    and forward proxies capable of inspecting TLS handshakes to generate Zeek log data.'
  range: Last 90 days, with a 30-day fingerprint frequency baseline
  queries:
  - technology: Zeek/pseudocode
    query: "base = freq_baseline(ja3, ja4) over 30d for mobile_segments;\ntls = join(zeek_ssl, zeek_x509,\
      \ zeek_conn);\nrare = tls.fingerprint_freq < p1(base) and tls.fingerprint not in allowlist;\nsusp_cert\
      \ = cert.self_signed or cert.san_count==1\n          or cert.not_before > now-30d;\nalert when rare\
      \ and susp_cert;\noutput device, dest, fingerprint, cert_subject, not_before, san_count."
- question: Does an explainable classifier score a TLS session as malicious based on its Client Hello
    and flow-metadata features?
  context: 'Some malicious encrypted channels evade both indicator matching and rarity heuristics but
    remain distinguishable by the combination of handshake and flow characteristics. Train an explainable
    model (for example, L1-regularized logistic regression) on TLS handshake and unencrypted flow metadata
    - offered cipher-suite and extension order, supported curves, certificate features, packet-length
    and inter-arrival sequences, and byte distribution - using labeled benign app traffic and malicious
    sandbox traffic. Optionally add decryption-free self-supervised anomaly scoring (ET-SSL). Alert when
    the malicious probability exceeds 0.90 and list the top contributing features in the alert so analysts
    can validate the decision. A high-probability hit identifies likely C2 over TLS without needing decryption;
    analysts should review the contributing features, destination, app, and any corroborating beacon or
    certificate anomalies. References: [Deciphering Malware''s use of TLS, Anderson et al.](https://arxiv.org/abs/1607.01639);
    [ET-SSL](https://www.nature.com/articles/s41598-025-08568-0); [SHAP-IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek x509.log
  - Threat intelligence indicators
  - 'NAI: Network sensors at key chokepoints with visibility into traffic from managed mobile devices,
    including corporate Wi-Fi egress points, VPN concentrators, Mobile Device Management (MDM) gateways,
    and forward proxies capable of inspecting TLS handshakes to generate Zeek log data.'
  range: Last 90 days for training and scoring; periodic retraining
  queries:
  - technology: ML/pseudocode
    query: "feats = tls_features(cipher_order, extension_order, curves, cert_features,\n        pkt_len_seq,\
      \ iat_seq, byte_distribution);\nmodel = train_l1_logreg(labeled_benign_app + malicious_sandbox);\n\
      p = model.predict_proba(feats);\nexplain = top_features(model, feats);\nalert when p > 0.90; output\
      \ device, dest, probability, explain."
