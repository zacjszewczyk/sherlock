name: 'T1437.001: Web Protocols'
id: fec6bfd7-2362-4d03-a709-48d7cffb0cd3
description: Investigate whether an adversary is using web application-layer protocols (HTTP/S) and mobile
  push-notification services (FCM/GCM, APNS) for command and control on managed mobile devices by blending
  malicious traffic with routine web and notification activity. This playbook helps an analyst hunt for
  anomalous web traffic from enrolled Android and iOS devices, including periodic 'heartbeat' beaconing,
  requests to low-reputation or newly registered domains, push-notification endpoints abused by apps that
  do not declare messaging functionality, rare User-Agent strings, high-entropy URIs, highly asymmetric
  byte ratios, anomalous outbound volume, and elevated failure rates that signal dead-drop or rotating
  C2. It also covers TLS fingerprint analysis (JA3/JA3S/JA4/JA4S/JA4H/JA4X) against threat intelligence,
  statistically rare fingerprints corroborated by suspicious certificates, and machine-learning classification
  of encrypted-flow and Client Hello features. Evidence is drawn from network sensors at corporate Wi-Fi
  egress, VPN concentrators, MDM gateways, proxies, and central DNS resolvers that observe traffic from
  managed mobile device subnets.
type: technique
related:
- tactic_id: TA0037
  tactic_name: Command And Control
