questions:
- question: Is there any non-allowlisted Android application holding the SYSTEM_ALERT_WINDOW overlay permission
    that also matches a malicious indicator in the mobile threat intelligence feed, and does any such
    package additionally hold BIND_ACCESSIBILITY_SERVICE?
  context: 'GUI Input Capture on Android most commonly relies on overlay windows, which require the SYSTEM_ALERT_WINDOW
    permission. Because that permission is auto-granted to Play Store installs, its mere presence is not
    anomalous on its own; the deterministic signal comes from joining MDM app inventory to the corporate
    allowlist and a mobile threat feed on package name and signing certificate hash. A high-severity hit
    means a non-allowlisted, overlay-capable app already flagged as malicious is on a managed device.
    Escalate to critical when the SAME package also holds BIND_ACCESSIBILITY_SERVICE: this co-grant is
    the Cloak-and-Dagger primitive that yields a full UI-feedback loop enabling silent credential capture.
    A positive result indicates an active credential-theft capability staged on the device; a negative
    result narrows the hunt to behavior-based analytics below. Source citations: [Cloak and Dagger](https://cloak-and-dagger.org/).'
  answer_sources:
  - MDM.AppInventoryLogs
  - MobileEDR.AppInstallEvents
  - Corporate.AppAllowlist
  - ThreatIntel.Feed
  - 'NAI: Centralized MDM/UEM platform, Mobile EDR data repository, and corporate application vetting
    database.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  mdm_app_inventory\n  | join package_name, signing_cert_hash with corporate_allowlist\
      \ as AL, threatintel_feed as TI\n  | where permissions contains \"android.permission.SYSTEM_ALERT_WINDOW\"\
      \n      and AL.match == false\n      and TI.malicious == true\n  | eval severity = if(permissions\
      \ contains \"android.permission.BIND_ACCESSIBILITY_SERVICE\", \"critical\", \"high\")\n  | emit\
      \ alert(device_id, package_name, signing_cert_hash, severity)"
- question: Which non-allowlisted applications holding SYSTEM_ALERT_WINDOW are rare across the fleet (installation
    prevalence below the 5th percentile), and are any of them newly seen packages installed on only a
    single device?
  context: 'Malware that abuses overlays is typically rare across an enterprise fleet, whereas legitimate
    overlay-using apps (chat heads, accessibility tools) tend to be widely deployed. Schedule a daily
    MDM inventory query for SYSTEM_ALERT_WINDOW holders, compute per-app installation prevalence (count
    of devices), and alert on any non-allowlisted app below the 5th percentile derived from a 30-day per-environment
    baseline. This rare-static-feature distribution is the same signal Drebin uses to separate malware
    from goodware. Treat newly-seen packages (age < 7 days) with a prevalence of exactly 1 device as the
    highest-priority bucket, since this matches the profile of a targeted sideload. A positive result
    surfaces low-prevalence overlay apps worth deeper triage; a negative result means overlay capability
    is broadly and likely legitimately distributed. Source citations: [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf).'
  answer_sources:
  - MDM.AppInventoryLogs
  - MobileEDR.AppInstallEvents
  - Corporate.AppAllowlist
  - ThreatIntel.Feed
  - 'NAI: Centralized MDM/UEM platform, Mobile EDR data repository, and corporate application vetting
    database.'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  mdm_app_inventory earliest=-1d\n  | where permissions contains \"android.permission.SYSTEM_ALERT_WINDOW\"\
      \ and allowlisted==false\n  | stats dc(device_id) as prevalence, min(install_age_days) as age by\
      \ package_name\n  | eventstats perc5(prevalence) as p5 by environment\n  | where prevalence <= p5\n\
      \  | eval priority = if(age < 7 AND prevalence == 1, \"highest\", \"normal\")\n  | emit alert(package_name,\
      \ prevalence, priority)"
- question: When a new application is installed, does a Random Forest classifier trained on the Drebin
    corpus score it as malicious (probability > 0.85) based on its manifest features, and which top-3
    features drive that prediction?
  context: 'Static manifest features predict overlay-phishing malware before any runtime behavior occurs.
    On each new install event from Mobile EDR, extract a feature vector (total permission count, presence
    of SYSTEM_ALERT_WINDOW, presence of other high-risk permissions like BIND_ACCESSIBILITY_SERVICE /
    READ_SMS / POST_NOTIFICATIONS, exported activity count) and score it with a Random Forest trained
    on the labeled Drebin corpus. Quarantine the device via the MDM API when malicious probability exceeds
    0.85. Surface the top-3 contributing features (e.g., accessibility+overlay co-grant, SMS read) via
    per-prediction feature importance so analysts can triage without reverse-engineering. To keep precision
    realistic, retrain on a time-ordered split with a ~10% malware base rate to avoid the temporal/spatial
    bias quantified in TESSERACT. A positive result auto-contains a likely malicious install; a low score
    reduces but does not eliminate suspicion. Source citations: [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf);
    [Performance Comparative Study on Zero Day Malware Detection Using XGBoost and Random Forest](https://www.researchgate.net/publication/386124227_Performance_Comparative_Study_on_Zero_Day_Malware_Detection_Using_XGBoost_and_Random_Forest_Classifiers);
    [TESSERACT](https://arxiv.org/pdf/1807.07838).'
  answer_sources:
  - MobileEDR.AppInstallEvents
  - Corporate.AppAllowlist
  - 'NAI: Centralized MDM/UEM platform, Mobile EDR data repository, and corporate application vetting
    database.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  on mobileedr_app_install:\n    feats = extract(total_perm_count, has_SYSTEM_ALERT_WINDOW,\
      \ has_BIND_ACCESSIBILITY_SERVICE,\n                    has_READ_SMS, has_POST_NOTIFICATIONS, exported_activity_count)\n\
      \    p = random_forest_drebin.predict_proba(feats)\n    if p > 0.85:\n        mdm_api.quarantine(device_id)\n\
      \        emit alert(package_name, p, top3=feature_importance(feats))"
- question: Is any non-allowlisted package generating repeated denied or revoked SYSTEM_ALERT_WINDOW /
    BIND_ACCESSIBILITY_SERVICE requests, or repeated accessibility-bind retries (>=3 within 10 minutes)?
  context: 'Overlay-abusing malware often persistently re-requests overlay and accessibility capabilities
    after the user or OS denies them, because the attack cannot proceed without that primitive. As a distinct
    failure-mode signal, parse MDM/logcat for DENIED or revoked SYSTEM_ALERT_WINDOW / BIND_ACCESSIBILITY_SERVICE
    grants and for repeated accessibility-bind retries by the same package. Alert when a non-allowlisted
    package generates >=3 failed or retried capability requests within a 10-minute window, the persistence
    behavior described in Cloak and Dagger and What the App is That?. This catches credential-theft attempts
    that have not yet succeeded in obtaining the capability, giving defenders an early-stage detection.
    A positive result indicates an app actively struggling to obtain phishing primitives; a negative result
    means no such retry pressure is present. Source citations: [Cloak and Dagger](https://cloak-and-dagger.org/);
    [What the App is That?](https://sites.cs.ucsb.edu/~chris/research/doc/oakland15_uideception.pdf).'
  answer_sources:
  - MDM.AppInventoryLogs
  - MobileEDR.AppInstallEvents
  - Corporate.AppAllowlist
  - ThreatIntel.Feed
  - 'NAI: Centralized MDM/UEM platform, Mobile EDR data repository, and corporate application vetting
    database.'
  range: Last 90 days (10-minute correlation window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  mdm_logcat\n  | where event in (\"PERMISSION_DENIED\",\"PERMISSION_REVOKED\",\"ACCESSIBILITY_BIND_RETRY\"\
      )\n      and capability in (\"SYSTEM_ALERT_WINDOW\",\"BIND_ACCESSIBILITY_SERVICE\")\n      and allowlisted\
      \ == false\n  | bin time span=10m\n  | stats count as fails by package_name, device_id, _time\n\
      \  | where fails >= 3\n  | emit alert(package_name, device_id, fails)"
- question: Has any newly installed app been given a display name within Levenshtein distance 2 of a high-value
    application while its package name or signing certificate does NOT match the legitimate app's official
    metadata?
  context: 'Identity confusion is the core deception primitive for GUI Input Capture: on small mobile
    screens users cannot easily verify app identity, so a near-identical name (e.g., ''Okta Verify'' vs
    ''Okta Verifu'') combined with a copied icon is enough to harvest credentials. Maintain a reference
    table mapping high-value app display names to their official package names and signing certificate
    hashes. On each new install, compute the Levenshtein distance between the new app''s display name
    and reference names; if distance <= 2 AND the package name or certificate hash does not match the
    reference entry, raise a critical brand-impersonation alert. This operationalizes the mobile control-transfer/identity-confusion
    threat model from Phishing on Mobile Devices and What the App is That?. A positive result is a strong,
    high-confidence impersonation indicator; a negative result clears the install on the name-similarity
    axis. Source citations: [Phishing on Mobile Devices](https://people.eecs.berkeley.edu/~daw/papers/mobphish-w2sp11.pdf);
    [What the App is That?](https://sites.cs.ucsb.edu/~chris/research/doc/oakland15_uideception.pdf).'
  answer_sources:
  - MDM.AppInventoryLogs
  - MobileEDR.AppInstallEvents
  - Corporate.AppMetadataStore
  - 'NAI: Centralized MDM/UEM platform and the corporate application metadata repository containing official
    names, package IDs, and signatures.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  on new_install(app):\n    for ref in highvalue_app_reference:\n        if levenshtein(app.display_name,\
      \ ref.display_name) <= 2\n           and (app.package_name != ref.package_name or app.cert_hash\
      \ != ref.cert_hash):\n            emit alert(severity=\"critical\", device_id, app.package_name,\
      \ matched=ref.display_name)"
- question: Is there a statistically significant spike (>3 standard deviations above the 30-day moving
    average) in the daily count of non-allowlisted apps whose display names exceed 0.95 Jaro-Winkler similarity
    to high-value target names?
  context: 'A coordinated impersonation campaign manifests as a fleet-wide surge in look-alike app names
    rather than a single install. Daily, query the MDM inventory and compute the Jaro-Winkler similarity
    of each non-allowlisted app''s display name against high-value target names. Track the daily COUNT
    of apps exceeding a 0.95 similarity threshold and alert on spikes exceeding 3 standard deviations
    above the 30-day moving average, a campaign indicator consistent with the family-clustering behavior
    in Drebin. Report the matched target brand and similarity score in the alert so analysts can identify
    which brand is being impersonated. A positive result signals a possible mass impersonation campaign;
    a flat trend suggests background noise only. Source citations: [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf).'
  answer_sources:
  - MDM.AppInventoryLogs
  - MobileEDR.AppInstallEvents
  - Corporate.AppMetadataStore
  - 'NAI: Centralized MDM/UEM platform and the corporate application metadata repository containing official
    names, package IDs, and signatures.'
  range: Last 90 days (30-day moving average baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  mdm_app_inventory earliest=-1d\n  | where allowlisted == false\n  | eval sim = max_over(highvalue_names,\
      \ n => jaro_winkler(display_name, n))\n  | where sim > 0.95\n  | stats count as daily_lookalikes,\
      \ values(matched_brand) as brands by date\n  | eventstats avg(daily_lookalikes) as mu, stdev(daily_lookalikes)\
      \ as sd over last 30d\n  | where daily_lookalikes > mu + 3*sd\n  | emit alert(date, daily_lookalikes,\
      \ brands)"
- question: Does DBSCAN clustering over app text features (display name, package name, developer name
    via character n-grams) reveal lookalike app families that contain no allowlisted apps, have small
    device footprints (<10 devices), and high internal string similarity?
  context: 'Adversaries often deploy families of related impersonation apps that share naming and developer
    conventions; unsupervised clustering can surface them without prior signatures. Periodically vectorize
    each installed app''s text fields (display name, package name, developer name) using character n-grams
    and apply DBSCAN. Flag clusters that contain no allowlisted apps, have small device footprints (fewer
    than 10 devices), and contain members with high internal string similarity. Emit the cluster''s shared
    n-grams and the nearest legitimate brand as the top contributing features so analysts can triage without
    reverse-engineering. Validate cluster stability over time per the drift guidance in TESSERACT and
    Deep Learning for Android Malware Defenses. A positive result reveals a candidate impersonation family
    for coordinated takedown; an empty result indicates no such grouping currently exists. Source citations:
    [TESSERACT](https://arxiv.org/pdf/1807.07838); [Deep Learning for Android Malware Defenses](https://arxiv.org/pdf/2103.05292).'
  answer_sources:
  - MDM.AppInventoryLogs
  - MobileEDR.AppInstallEvents
  - Corporate.AppMetadataStore
  - 'NAI: Centralized MDM/UEM platform and the corporate application metadata repository containing official
    names, package IDs, and signatures.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  apps = installed_app_inventory\n  X = char_ngram_vectorize(apps[display_name, package_name,\
      \ developer_name], n=2..4)\n  labels = DBSCAN(eps, min_samples).fit_predict(X)\n  for cluster in\
      \ labels.groups():\n      if none(cluster.allowlisted) and cluster.device_footprint < 10 and cluster.internal_sim\
      \ > thresh:\n          emit alert(shared_ngrams=cluster.top_ngrams, nearest_brand=cluster.nearest_legit_brand)"
- question: On any single device, does a sensitive app in the foreground get supplanted within 5 seconds
    by a non-allowlisted overlay/accessibility-capable app, followed within 60 seconds by a connection
    to a blocklisted IP/domain or a domain registered within the last 30 days?
  context: 'This question chains the entire overlay-phishing collection sequence into one deterministic
    correlation. Join Mobile EDR foreground-app events and Zeek logs by device IP and timestamp. Alert
    when (1) a sensitive app (SSO/banking) is in the foreground, (2) within 5 seconds a non-allowlisted
    overlay/accessibility-capable app gains focus (the precise foreground-targeting step required for
    overlay phishing per Cloak and Dagger and the activity-on-top sequence in Task Hijacking), and (3)
    within 60 seconds Zeek conn.log or dns.log shows a connection to a blocklisted IP/domain or a domain
    registered within 30 days. Keep the deterministic 5s/60s windows and tune per environment. A positive
    result is a high-confidence end-to-end capture-and-exfiltrate detection; a negative result rules out
    this tight timing chain for the period. Source citations: [Cloak and Dagger](https://cloak-and-dagger.org/);
    [Towards Discovering and Understanding Task Hijacking in Android](https://www.usenix.org/system/files/conference/usenixsecurity15/sec15-paper-ren-chuangang.pdf).'
  answer_sources:
  - MobileEDR.ForegroundAppEvents
  - Zeek conn.log
  - Zeek dns.log
  - ThreatIntel.Feed
  - PassiveDNS.DomainAge
  - 'NAI: Mobile EDR data repository, network egress points instrumented with Zeek sensors (e.g., VPN
    gateways, corporate Wi-Fi controllers), and APIs for threat intelligence and passive DNS services.'
  range: Last 90 days (5s focus / 60s egress correlation windows)
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  fg = mobileedr_foreground_events\n  | sort device_id, _time\n  | where app in sensitive_apps\n\
      \  | join next-event within 5s where next.app not in allowlist and next.overlay_or_accessibility==true\n\
      \  | join zeek_conn/zeek_dns within 60s by device_ip\n      where dst in threatintel_blocklist or\
      \ passivedns.domain_age_days <= 30\n  | emit alert(device_id, sensitive_app, overlay_app, dst, domain_age)"
- question: After a rare sensitive-app -> overlay-app foreground transition (transition probability below
    the 1st percentile), does the Shannon entropy of FQDNs in Zeek dns.log over the next 5 minutes exceed
    3 standard deviations above the user's 30-day mean, and is the NXDOMAIN rate elevated?
  context: 'Legitimate app usage follows habitual sequences, so an abrupt, statistically rare transition
    from a sensitive app to an overlay-capable app is suspicious. Build a per-user foreground-app transition
    probability matrix (the behavioral-Markov modeling validated for Android in MaMaDroid). When a sensitive-app
    -> overlay-app transition falls below the 1st percentile, compute the Shannon entropy of FQDNs in
    Zeek dns.log for the 5 minutes post-transition and flag if entropy exceeds 3 standard deviations above
    the user''s 30-day mean (entropy-threshold rationale from Using Entropy Analysis to Find Encrypted
    and Packed Malware) - high DNS entropy suggests algorithmically generated lookups. Separately profile
    the post-transition NXDOMAIN rate as a distinct failure-mode signal of DGA-based C2. A positive result
    links anomalous app behavior to suspicious DNS; a negative result indicates the transition did not
    produce abnormal name resolution. Source citations: [MaMaDroid](https://arxiv.org/pdf/1612.04433);
    [Using Entropy Analysis to Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources:
  - MobileEDR.ForegroundAppEvents
  - Zeek dns.log
  - 'NAI: Mobile EDR data repository, network egress points instrumented with Zeek sensors (e.g., VPN
    gateways, corporate Wi-Fi controllers), and APIs for threat intelligence and passive DNS services.'
  range: Last 90 days (5-minute post-transition window; 30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  build per_user transition_matrix(foreground_app_events)\n  on transition(sensitive_app\
      \ -> overlay_app) where P(transition) < perc1:\n      window = dns.log [t, t+5m] for device\n  \
      \    H = shannon_entropy(window.fqdn)\n      if H > user_mean_30d + 3*user_std_30d: emit alert(device,\
      \ H)\n      nx = count(window.rcode==NXDOMAIN)/window.total\n      if nx > baseline+3sd: emit alert(device,\
      \ nxdomain_rate=nx)"
- question: When a rare foreground transition occurs, does a per-device LSTM autoencoder report network
    reconstruction error above the 99th percentile of historical error, and what top-3 features explain
    it?
  context: 'Exfiltration of captured input produces network behavior that deviates from a device''s learned
    normal pattern. Train a per-device LSTM autoencoder on Zeek conn.log features (bytes_out per minute,
    unique destination IPs per minute, protocol distribution), an architecture cataloged for dynamic Android
    features in Deep Learning for Android Malware Defenses. When a rare app transition occurs, score the
    reconstruction error and trigger quarantine/escalation if it exceeds the 99th percentile of historical
    errors. Decompose the error into the top-3 contributing features (e.g., bytes_out spike, new-destination
    count) for the alert, and complement with an Extended Isolation Forest outlier score for explainable
    per-feature attribution on the same vectors. A positive result flags anomalous post-transition egress
    consistent with data exfiltration; a normal score suggests the network behavior remained within learned
    bounds. Source citations: [Deep Learning for Android Malware Defenses](https://arxiv.org/pdf/2103.05292);
    [Extended Isolation Forest](https://arxiv.org/pdf/1811.02141).'
  answer_sources:
  - MobileEDR.ForegroundAppEvents
  - Zeek conn.log
  - 'NAI: Mobile EDR data repository, network egress points instrumented with Zeek sensors (e.g., VPN
    gateways, corporate Wi-Fi controllers), and APIs for threat intelligence and passive DNS services.'
  range: Last 90 days (event-centered on rare transitions)
  queries:
  - technology: ML/pseudocode
    query: ">-\n  model = LSTM_autoencoder.per_device(features=[bytes_out_pm, uniq_dst_pm, proto_dist])\n\
      \  on rare_transition(device):\n      err = model.reconstruction_error(recent_window)\n      if\
      \ err > device.p99_error:\n          mdm_api.quarantine(device)\n          emit alert(device, err,\
      \ top3=decompose(err), eif_score=ExtendedIsolationForest.score(vec))"
- question: After a rare sensitive-app -> overlay-app transition, is there a burst of blocked connections,
    TLS handshake failures (Zeek ssl.log), or HTTP 4xx/5xx responses exceeding 3 standard deviations over
    the device's 30-day baseline in the next 5 minutes?
  context: Exfiltration to sinkholed or freshly-registered infrastructure often fails initially, producing
    a recognizable burst of connection errors. As an explicit failure-state signal, after a rare sensitive-app
    -> overlay-app transition, count blocked connections, TLS handshake failures (Zeek ssl.log), and HTTP
    4xx/5xx responses in the following 5 minutes; alert when any rate exceeds 3 standard deviations over
    the device's 30-day baseline. This captures exfiltration attempts to sinkholed or newly-registered
    collection endpoints that the successful-egress analytics might miss. A positive result indicates
    the device is repeatedly attempting and failing to reach suspicious infrastructure; a negative result
    shows no abnormal failure burst.
  answer_sources:
  - MobileEDR.ForegroundAppEvents
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Mobile EDR data repository, network egress points instrumented with Zeek sensors (e.g., VPN
    gateways, corporate Wi-Fi controllers), and APIs for threat intelligence and passive DNS services.'
  range: Last 90 days (5-minute post-transition window; 30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  on rare_transition(sensitive_app -> overlay_app, device):\n      w = [t, t+5m]\n   \
      \   blocked = count(conn.log where action==blocked)\n      tls_fail = count(ssl.log where handshake_failed)\n\
      \      http_err = count(http.log where status >= 400)\n      for metric in (blocked, tls_fail, http_err):\n\
      \          if rate(metric) > device.baseline_mean_30d + 3*device.baseline_std_30d:\n           \
      \   emit alert(device, metric, rate)"
- question: Was any application granted SYSTEM_ALERT_WINDOW or BIND_ACCESSIBILITY_SERVICE, and if so is
    it non-allowlisted, were BOTH permissions granted to the same package, and does the package/cert match
    any threat-intelligence indicator?
  context: 'Permission grants are the earliest reliable signal of overlay-based credential theft. Generate
    a medium-priority alert whenever an app is granted SYSTEM_ALERT_WINDOW or BIND_ACCESSIBILITY_SERVICE.
    Escalate to high when the package is not on a curated allowlist, and to critical when BOTH are granted
    to the same package - the two-permission primitive that yields complete UI-feedback-loop control in
    Cloak and Dagger. Enrich the package name and signing certificate hash against threat intelligence.
    A graduated severity keeps benign single-permission grants low-noise while ensuring the dangerous
    co-grant is treated as critical. A positive (critical) result indicates a package is fully equipped
    for silent credential capture; lower-severity hits warrant the baselining and scoring analytics that
    follow. Source citations: [Cloak and Dagger](https://cloak-and-dagger.org/).'
  answer_sources:
  - MDM.PermissionGrantLogs
  - 'NAI: MDM/EMM servers, Network egress points (e.g., corporate WiFi gateways, VPN concentrators), Managed
    mobile endpoints (iOS/Android)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  mdm_permission_grant\n  | where permission in (\"SYSTEM_ALERT_WINDOW\",\"BIND_ACCESSIBILITY_SERVICE\"\
      )\n  | stats values(permission) as perms by device_id, package_name, cert_hash\n  | eval severity\
      \ = case(\n        count(perms)==2, \"critical\",\n        not allowlisted(package_name), \"high\"\
      ,\n        true, \"medium\")\n  | lookup threatintel package_name, cert_hash\n  | emit alert(device_id,\
      \ package_name, perms, severity, ti_match)"
- question: Within 24 hours of a flagged permission grant, does the app connect to a destination domain/IP
    absent from its 30-day baseline, and do Zeek ssl.log records show self-signed certificates or JA3/JA3S
    pairs with fleet prevalence below 0.1%?
  context: 'An overlay/accessibility-capable app that immediately reaches new infrastructure after gaining
    its permission is behaving like staged credential-theft malware calling home. For any app flagged
    by the symbolic rule, establish a 30-day baseline of destination domains/IPs from Zeek dns.log and
    conn.log. Alert if within 24 hours of the grant the app initiates connections to a domain absent from
    the baseline. Analyze Zeek ssl.log and flag self-signed certificates or JA3/JA3S pairs with fleet
    prevalence below 0.1% (rare-feature rationale per Drebin), and track NXDOMAIN and handshake-failure
    rates as distinct state signals. A positive result ties a new high-risk permission to anomalous, rare-fingerprint
    network activity; a negative result shows the app stayed within its known destinations. Source citations:
    [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf).'
  answer_sources:
  - MDM.PermissionGrantLogs
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: MDM/EMM servers, Network egress points (e.g., corporate WiFi gateways, VPN concentrators), Managed
    mobile endpoints (iOS/Android)'
  range: Last 90 days (24-hour post-grant window; 30-day baseline)
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  baseline = distinct(conn.dst, dns.query) for app over last 30d\n  on grant(app) -> window\
      \ [t, t+24h]:\n      new = conn/dns dst not in baseline\n      if new: emit alert(app, new_dst)\n\
