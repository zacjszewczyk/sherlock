- question: Was any application granted SYSTEM_ALERT_WINDOW or BIND_ACCESSIBILITY_SERVICE, and is it non-allowlisted
    or holding both permissions (the screen-scraping + overlay primitive), with package/cert enriched
    against threat intelligence and internal inventories?
  context: 'For the Collection objective, the same accessibility permission that enables overlays also
    enables screen-scraping of text and content from sensitive apps. Generate a medium-priority alert
    whenever an app is granted SYSTEM_ALERT_WINDOW or BIND_ACCESSIBILITY_SERVICE; escalate to high when
    not on the allowlist and to critical on co-grant of both (the screen-scraping + overlay primitive
    in Cloak and Dagger). Enrich the package name and signing certificate against threat intelligence
    and internal inventories. This frames the grant specifically as a data-collection capability rather
    than only a credential-prompt capability. A critical co-grant result indicates an app able to silently
    scrape on-screen sensitive data; lower-severity hits feed the exfiltration-volume analytics below.
    Source citations: [Cloak and Dagger](https://cloak-and-dagger.org/).'
  answer_sources:
