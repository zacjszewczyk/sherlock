- question: Within 60 minutes of a permission grant to a non-allowlisted app, does outbound traffic exceed
    the 95th percentile of the device's 30-day baseline orig_bytes to a new destination domain, with high
    payload entropy suggesting compressed/encrypted screen dumps?
  context: 'Exfiltration of scraped screen content or text produces unusually large outbound payloads
    to previously-unseen destinations. For any non-allowlisted app granted these permissions, monitor
    outbound traffic in Zeek conn.log and establish a 30-day baseline of connection size. Alert if orig_bytes
    exceeds the 95th percentile of the baseline AND the destination domain from Zeek dns.log is absent
    from the device''s history, indicating exfiltration of scraped content. Correlate high payload entropy
    per Using Entropy Analysis to Find Encrypted and Packed Malware to distinguish compressed/encrypted
    dumps, and use Extended Isolation Forest for explainable multi-feature (bytes, dst count, duration)
    outlier scoring. A positive result is a strong data-collection-and-exfiltration indicator; a negative
    result shows no abnormal large-payload egress in the window. Source citations: [Using Entropy Analysis
    to Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989); [Extended Isolation
    Forest](https://arxiv.org/pdf/1811.02141).'
  answer_sources:
  - MDM.PermissionGrantLogs
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: MDM/EMM servers, Network egress points (e.g., corporate WiFi gateways, VPN concentrators), Managed
    mobile endpoints (iOS/Android)'
  range: Last 90 days (60-minute post-grant window; 30-day baseline)
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  baseline = perc95(orig_bytes) for device over last 30d; known_dst = distinct(dns.query)\n\
      \  on grant(non_allowlisted_app) -> window [t, t+60m]:\n      for c in conn.log:\n          if c.orig_bytes\
      \ > baseline and c.resp_domain not in known_dst:\n              ent = payload_entropy(c)\n     \
      \         eif = ExtendedIsolationForest.score([orig_bytes, dst_count, duration])\n             \
      \ emit alert(device, c.resp_domain, c.orig_bytes, ent, eif)"
