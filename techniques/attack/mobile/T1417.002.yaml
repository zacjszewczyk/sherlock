name: 'T1417.002: GUI Input Capture'
id: ce4578c0-af23-46e8-8420-c5437550f022
description: 'Investigate suspected GUI Input Capture (T1417.002) on managed mobile devices, where an
  adversary mimics legitimate operating-system or application UI to trick users into entering credentials,
  banking details, or other PII. This playbook helps an analyst hunt for the full overlay/activity-on-top
  phishing chain on Android and the look-alike-prompt/webview chain on iOS: an app gaining overlay, accessibility,
  or notification capability (SYSTEM_ALERT_WINDOW, BIND_ACCESSIBILITY_SERVICE, POST_NOTIFICATIONS); precise
  foreground targeting of a sensitive app (SSO/banking) via accessibility or scene/focus events; presentation
  of a deceptive overlay window, activity-on-top, fake notification, or faux credential prompt; local
  caching of captured input; and near-term network egress of the stolen data. It supports both the Credential
  Access objective (stealing account secrets via GUI impersonation and brand/name look-alike apps) and
  the Collection objective (gathering sensitive user data such as messages, contacts, and scraped screen
  content). Questions span MDM/UEM and Mobile EDR app inventory, install, and permission-grant logs; corporate
  allowlists and app-metadata stores; threat intelligence and passive DNS; and network telemetry from
  Zeek (conn, dns, ssl) at corporate egress points. Methods include deterministic symbolic-logic correlation
  rules, statistical baselining/anomaly detection, and machine-learning classification and sequence modeling,
  each with explainable feature attribution for analyst triage.'
type: technique
