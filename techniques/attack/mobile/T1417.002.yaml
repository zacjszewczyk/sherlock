- question: On a per-user basis, is a credential-bearing app (SSO/banking) immediately followed in the
    foreground by a newly-permissioned overlay/accessibility app at a transition probability below the
    1st percentile?
  context: 'Overlay credential theft requires precise timing: the malicious prompt must appear right when
    the user is interacting with a credential-bearing app. Maintain per-user foreground-app transition
    probability matrices (MaMaDroid) and alert when a credential-bearing app (SSO/banking) is immediately
    followed by the newly-permissioned app with a transition probability below the 1st percentile, the
    precise-timing requirement for overlay credential theft noted in Cloak and Dagger and Phishing on
    Mobile Devices. This behavioral signal is independent of network indicators and catches the on-device
    targeting step. A positive result indicates the suspicious app is positioning itself exactly when
    credentials are entered; a negative result means no such anomalous, well-timed transition was observed.
    Source citations: [MaMaDroid](https://arxiv.org/pdf/1612.04433); [Cloak and Dagger](https://cloak-and-dagger.org/);
    [Phishing on Mobile Devices](https://people.eecs.berkeley.edu/~daw/papers/mobphish-w2sp11.pdf).'
