- question: After a permission grant, is there a burst (>3 standard deviations over baseline) of blocked
    connections, TLS handshake failures (Zeek ssl.log), or NXDOMAIN responses (Zeek dns.log) per minute,
    indicating the app cycling through sinkholed or freshly-registered collection endpoints?
  context: Collection malware that fails to reach its exfil endpoints leaves a distinct failure-state
    fingerprint. As a distinct failure-mode analytic, after the permission grant track blocked connections,
    TLS handshake failures (Zeek ssl.log), and NXDOMAIN responses (Zeek dns.log) per minute; a burst exceeding
    3 standard deviations over baseline indicates the app cycling through sinkholed or freshly-registered
    collection endpoints, complementing the large-payload signal. This catches exfiltration attempts even
    when no successful large transfer is observed. A positive result indicates repeated failed attempts
    to reach collection infrastructure; a negative result shows no abnormal failure burst following the
    grant.
  answer_sources:
  - MDM.PermissionGrantLogs
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: MDM/EMM servers, Network egress points (e.g., corporate WiFi gateways, VPN concentrators), Managed
    mobile endpoints (iOS/Android)'
  range: Last 90 days (per-minute rates; baseline 30 days)
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  on grant(app) -> monitor per-minute rates:\n      blocked = count(conn.log where action==blocked)\n\
      \      tls_fail = count(ssl.log where handshake_failed)\n      nxdomain = count(dns.log where rcode==NXDOMAIN)\n\
      \      for m in (blocked, tls_fail, nxdomain):\n          if m > device.baseline_mean + 3*device.baseline_std:\n\
      \              emit alert(device, app, metric=m)"
