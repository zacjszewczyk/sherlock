name: 'T1641.001: Transmitted Data Manipulation'
id: 0143c8c2-ae64-4501-bdb0-301e9640d6e9
description: 'Investigate possible Transmitted Data Manipulation on Android mobile devices, where an adversary
  alters data en route to storage or other systems to manipulate outcomes, hide activity, or commit fraud.
  A common variant is clipboard hijacking (clipper malware such as Android/Clipper.C), in which a malicious
  app monitors clipboard changes via ClipboardManager.OnPrimaryClipChangedListener and silently substitutes
  copied data — most notably swapping a copied cryptocurrency wallet address or IBAN for one under adversarial
  control before it is pasted and used. This playbook helps an analyst hunt for three complementary signals:
  (1) outbound HTTP POSTs from mobile devices that carry sensitive data patterns (wallet addresses, IBANs)
  to malicious, low-reputation, newly registered, or statistically anomalous destinations; (2) network
  connections to known-malicious C2 or to destinations with anomalous metadata (domain lexicals, JA3/JA3S
  TLS fingerprints, connection/DNS-failure bursts) relative to a per-device baseline; and (3) managed/vetted
  applications that use clipboard-listener APIs together with network permissions, especially where static
  or dynamic taint analysis shows a clipboard source flowing to a network sink. It combines symbolic-logic
  correlation, statistical baselining, and machine-learning scoring across Zeek network telemetry, threat
  intelligence, DHCP/VPN attribution data, and MDM/EDR application-vetting sources.'
type: technique
