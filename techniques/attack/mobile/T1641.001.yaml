questions:
- question: Are any mobile devices sending HTTP POST requests whose body contains sensitive data patterns
    (e.g., Bitcoin/Ethereum wallet addresses or IBANs) to destinations that are blocklisted, low-reputation,
    recently registered, or otherwise risky — or that present a known clipper/banking-trojan TLS fingerprint?
  context: 'Clipper malware substitutes a victim''s copied wallet address or IBAN with an attacker-controlled
    value, then often exfiltrates the stolen/replaced data. To find this under the Impact tactic, first
    attribute network flows to mobile devices by correlating Zeek conn.log source IPs against DHCP and
    VPN lease/session logs. Join to Zeek http.log, filter to POST requests, and scan the request body
    for the exact data types a clipper manipulates using wallet-address and IBAN regexes. Enrich the destination
    with threat intelligence and alert when it is blocklisted, has a reputation score below 40, was registered
    fewer than 60 days ago, and is not on an allowlist. In parallel, match Zeek ssl.log JA3/JA3S values
    against known clipper/banking-trojan TLS fingerprints. A positive result — sensitive data going to
    a risky destination, or a malicious JA3 — is a strong indicator of active data manipulation/exfiltration;
    a negative result helps scope out benign clipboard/network usage. Sources: [ESET: First Clipper Malware
    on Google Play](https://www.welivesecurity.com/2019/02/08/first-clipper-malware-google-play/); [JA3/JA3S,
    Salesforce](https://github.com/salesforce/ja3).'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Threat Intelligence Platform Data
  - DHCP Server Logs
  - VPN Server Logs
  - 'NAI: Corporate and guest Wi-Fi network access points, VPN concentrators, Perimeter firewalls, Web
    proxies, Cloud Access Security Broker (CASB)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'device = conn.log.id_orig_h JOIN dhcp/vpn WHERE lease/session active -> mobile_devices

      http_posts = http.log WHERE method == "POST" AND id_orig_h IN mobile_devices

      hits = http_posts WHERE post_body MATCHES (btc_addr_regex OR eth_addr_regex OR iban_regex)

      enrich hits.dest WITH threat_intel(reputation, first_registered, blocklist)

      ALERT WHEN dest IN blocklist OR reputation < 40 OR age_days(dest) < 60 -- AND dest NOT IN allowlist'
  - technology: Zeek/pseudocode
    query: 'ssl_fp = ssl.log[ja3, ja3s]

      ALERT WHEN ja3 IN clipper_banking_trojan_ja3_set OR ja3s IN clipper_banking_trojan_ja3s_set

      JOIN to mobile_devices on id_orig_h'
- question: For each mobile device, is sensitive data being POSTed to rare/first-seen destinations, or
    is the upload volume or body entropy to a rare destination statistically anomalous versus the device's
    own 30-day baseline?
  context: 'Beyond explicit threat-intel matches, clipper and exfil behavior stands out statistically.
    Maintain a 30-day per-device baseline of destinations that receive sensitive POSTs. Alert when sensitive
    data is sent to destinations in the bottom 5% by frequency, or when the rate of first-seen destinations
    per device exceeds the 98th-percentile new-domain rate. Compute volume features (request_body_len
    and the uploaded:downloaded byte ratio) and flag when upload volume to a rare destination exceeds
    3 standard deviations from the device baseline. Compute Shannon entropy of the POST body and flag
    values > 7.0, which indicate an encrypted/compressed exfil channel. Also profile per-application outbound
    HTTP-header fingerprints and alert on deviation from the host baseline. Under Impact, these anomalies
    reveal covert data manipulation/exfiltration even when the destination is not yet known-bad. Sources:
    [Ahmed et al., Real-Time DNS Exfiltration Detection](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf);
    [Lyda & Hamrock, Entropy Analysis](https://ieeexplore.ieee.org/document/4140989); [DECANTeR, Bortolameotti
    et al.](https://doi.org/10.1145/3134600.3134605).'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Threat Intelligence Platform Data
  - DHCP Server Logs
  - VPN Server Logs
  - 'NAI: Corporate and guest Wi-Fi network access points, VPN concentrators, Perimeter firewalls, Web
    proxies, Cloud Access Security Broker (CASB)'
  range: Last 90 days (rolling 30-day per-device baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = per_device 30d freq(dest) for sensitive POSTs

      ALERT WHEN dest_freq <= p5 OR first_seen_dest_rate(device) > p98

      ALERT WHEN upload_bytes(dest) > mean_dev + 3*std_dev

      ALERT WHEN shannon_entropy(post_body) > 7.0'
  - technology: Zeek/pseudocode
    query: 'per app fingerprint = hash(sorted(http.log request_headers))

      ALERT WHEN app_header_fp deviates from host_baseline_fingerprints'
- question: Are mobile devices generating bursts of failed or blocked outbound POST attempts (HTTP 4xx/5xx,
    TLS handshake failures, proxy/firewall blocks) to new or rare destinations beyond the normal baseline?
  context: 'Failure state is a first-class signal. Clippers retrying dead C2 or rotating through fast-flux/rotating
    infrastructure generate distinctive failure bursts. Count HTTP 4xx/5xx responses, TLS handshake failures,
    and proxy/firewall-blocked connections per device per 10-minute window. Alert when the failure rate
    to new or rare destinations exceeds the 99th percentile of the device baseline. Under the Impact tactic,
    this catches active-but-unsuccessful exfiltration/C2 attempts that would otherwise be invisible if
    only successful transactions were inspected; a sustained failure burst toward novel destinations warrants
    device isolation and app review. Source: [Ahmed et al., Real-Time DNS Exfiltration Detection](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Threat Intelligence Platform Data
  - DHCP Server Logs
  - VPN Server Logs
  - 'NAI: Corporate and guest Wi-Fi network access points, VPN concentrators, Perimeter firewalls, Web
    proxies, Cloud Access Security Broker (CASB)'
  range: Last 90 days (10-minute windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'window = 10m per device

      fail = count(http_status 4xx/5xx) + count(tls_handshake_fail) + count(proxy/fw_blocked)

      rare = dest NOT IN device_30d_destinations

      ALERT WHEN fail_rate_to_rare(device, window) > p99(device_baseline)'
- question: Which outbound POST transactions from mobile devices receive a high risk score from a supervised
    model (or are flagged as novel by an unsupervised model) based on destination, payload, and timing
    features?
  context: 'Train a supervised model (Random Forest or Gradient Boosting) on features including destination
    reputation/age/ASN, post_body entropy, request_body_len, upload:download ratio, JA3, hour-of-day,
    and day-of-week. Alert when the risk score exceeds 0.85 and emit the top-3 contributing features (e.g.,
    destination_age, body_entropy, dest_reputation) in the alert text to speed triage. Run an unsupervised
    Isolation Forest in parallel to surface unlabeled novel patterns. Use time-aware train/test splits
    and the AUT metric, and re-tune thresholds quarterly to counter concept drift. Under Impact, ML scoring
    fuses many weak signals into a single triage-ready verdict for data-manipulation/exfiltration activity;
    explainable top features keep analyst decisions defensible. Sources: [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363);
    [TESSERACT, Pendlebury et al.](https://www.usenix.org/system/files/sec19-pendlebury.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Threat Intelligence Platform Data
  - DHCP Server Logs
  - VPN Server Logs
  - 'NAI: Corporate and guest Wi-Fi network access points, VPN concentrators, Perimeter firewalls, Web
    proxies, Cloud Access Security Broker (CASB)'
  range: Last 90 days (retrain/re-tune quarterly)
  queries:
  - technology: ML/pseudocode
    query: "features = [dest_reputation, dest_age, dest_asn, body_entropy, request_body_len,\n       \
      \     upload_download_ratio, ja3, hour_of_day, day_of_week]\nmodel = RandomForest/GradientBoosting\
      \ (time-aware split, AUT metric)\nALERT WHEN risk_score > 0.85 WITH top3_features\nparallel = IsolationForest(features)\
      \ -> flag novel/unlabeled patterns"
- question: Are mobile devices connecting to known-malicious C2 domains/IPs or presenting malware-associated
    JA3/JA3S TLS fingerprints that are not on an allowlist?
  context: 'This is the direct threat-intel match for clipper C2. Correlate DHCP/VPN logs with Zeek conn.log
    to identify mobile devices, enrich the destination IP/domain from Zeek dns.log and the JA3/JA3S fingerprint
    from Zeek ssl.log, then check both against threat intelligence. Alert on known malicious C2 domains
    or malware-associated JA3/JA3S hashes that are not allowlisted, using IOCs from documented clipper
    campaigns. Under Impact, a confirmed connection to clipper infrastructure indicates an actively compromised
    device performing or coordinating transmitted-data manipulation; this is a high-confidence, low-volume
    detection ideal for immediate response. Sources: [JA3/JA3S, Salesforce](https://github.com/salesforce/ja3);
    [ESET: First Clipper Malware on Google Play](https://www.welivesecurity.com/2019/02/08/first-clipper-malware-google-play/).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - Threat Intelligence Platform Data
  - DHCP Server Logs
  - VPN Server Logs
  - 'NAI: Corporate DNS resolvers, Internet gateway, Wi-Fi network sensors, Cloud Access Security Broker
    (CASB)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "device = conn.log.id_orig_h JOIN dhcp/vpn -> mobile_devices\nenrich dest FROM dns.log(query/answers)\
      \ AND ssl.log(ja3, ja3s)\nALERT WHEN dest_domain IN ti_malicious_c2 OR ja3/ja3s IN ti_malware_fingerprints\n\
      \       AND dest NOT IN allowlist"
- question: For each mobile device, is there an anomalous rate of first-seen domains or previously unseen
    JA3/JA3S hashes, or are contacted domains lexically anomalous (DGA/tunneling-like) versus the device
    baseline?
  context: 'Maintain 30-day per-device baselines of contacted domains and JA3/JA3S hashes. Alert when
    the rate of first-time-seen domains per hour exceeds the 98th percentile, or when a device uses a
    previously unseen JA3/JA3S hash (a new TLS client implementation can mean a newly installed malicious
    app). Score destination domains with stateless lexical features — length, Shannon entropy, character
    and n-gram statistics — and flag entropy/length outliers indicative of DGA or DNS tunneling. Under
    the Impact tactic, these statistical anomalies catch evolving clipper infrastructure and covert channels
    before signatures exist; correlate hits with sensitive-POST findings for higher confidence. Source:
    [Ahmed et al., Real-Time DNS Exfiltration Detection](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - Threat Intelligence Platform Data
  - DHCP Server Logs
  - VPN Server Logs
  - 'NAI: Corporate DNS resolvers, Internet gateway, Wi-Fi network sensors, Cloud Access Security Broker
    (CASB)'
  range: Last 90 days (rolling 30-day per-device baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = per_device 30d set(domains), set(ja3/ja3s)

      ALERT WHEN first_seen_domain_rate_per_hour(device) > p98

      ALERT WHEN ja3/ja3s NOT IN device_baseline

      lex = [len(domain), shannon_entropy(domain), char_ngram_stats(domain)]

      ALERT WHEN lex outlier (DGA/tunneling-like)'
- question: Are mobile devices producing bursts of DNS or connection failures (NXDOMAIN/SERVFAIL, S0/REJ/RSTO)
    beyond their normal baseline, consistent with cycling through dead or fast-flux C2?
  context: 'Count NXDOMAIN/SERVFAIL responses from Zeek dns.log (rcode) and failed/rejected connections
    from Zeek conn.log (conn_state S0/REJ/RSTO) per device per window. Alert when the failure rate exceeds
    the 99th-percentile device baseline. Clippers cycling through dead or fast-flux C2 produce distinctive
    failure bursts that stand out from normal browsing. Under Impact, this resolution-/connection-failure
    signal exposes malware actively attempting to reach its infrastructure even when the eventual destination
    changes, and complements the lexical/first-seen anomaly checks. Source: [Ahmed et al., Real-Time DNS
    Exfiltration Detection](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - Threat Intelligence Platform Data
  - DHCP Server Logs
  - VPN Server Logs
  - 'NAI: Corporate DNS resolvers, Internet gateway, Wi-Fi network sensors, Cloud Access Security Broker
    (CASB)'
  range: Last 90 days (per-window baseline)
  queries:
  - technology: Zeek/pseudocode
    query: 'per device per window:

      dns_fail = count(dns.log.rcode IN {NXDOMAIN, SERVFAIL})

      conn_fail = count(conn.log.conn_state IN {S0, REJ, RSTO})

      ALERT WHEN (dns_fail + conn_fail) > p99(device_baseline)'
- question: Which mobile-device network connections are flagged as anomalous by a per-device Isolation
    Forest trained on connection and DNS metadata?
  context: 'Train an Isolation Forest per device using features such as domain length and entropy, DNS
    query type, connection duration, total bytes (volume), connection frequency, JA3 hash, and destination
    port. Alert on high anomaly scores and surface the top-3 contributing features in the alert for triage.
    Evaluate with time-aware splits and re-fit periodically to avoid drift. Under the Impact tactic, an
    unsupervised model captures the multivariate ''shape'' of normal device behavior and flags clipper
    C2/exfil traffic that no single threshold would catch; the explained top features let an analyst quickly
    judge whether the anomaly is malicious or benign. Sources: [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363);
    [Ahmed et al., Real-Time DNS Exfiltration Detection](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf);
    [TESSERACT, Pendlebury et al.](https://www.usenix.org/system/files/sec19-pendlebury.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - Threat Intelligence Platform Data
  - DHCP Server Logs
  - VPN Server Logs
  - 'NAI: Corporate DNS resolvers, Internet gateway, Wi-Fi network sensors, Cloud Access Security Broker
    (CASB)'
  range: Last 90 days (re-fit periodically)
  queries:
  - technology: ML/pseudocode
    query: "features = [domain_len, domain_entropy, dns_qtype, conn_duration, total_bytes,\n         \
      \   conn_frequency, ja3, dest_port]\nmodel = IsolationForest per device (time-aware split, periodic\
      \ re-fit)\nALERT WHEN anomaly_score high WITH top3_features"
- question: Which installed apps on managed mobile devices use clipboard-listener APIs (ClipboardManager.OnPrimaryClipChangedListener,
    getPrimaryClip, setPrimaryClip) AND also hold the INTERNET permission, without being system or allowlisted
    apps?
  context: 'The defining capability conjunction of clipper malware is the ability to read/modify the clipboard
    plus the ability to send data over the network. Inventory installed apps via MDM/EDR and parse manifests/disassembly
    for clipboard-listener APIs (OnPrimaryClipChangedListener, getPrimaryClip, setPrimaryClip). Cross-check
    granted permissions for android.permission.INTERNET and alert on non-system, non-allowlisted apps
    that hold both. Under Impact, this static capability check surfaces candidate clippers proactively
    — before any malicious network activity — so they can be removed or deeply vetted; a clipboard listener
    with network access and no clear user-facing justification is a strong red flag. Sources: [ESET: First
    Clipper Malware on Google Play](https://www.welivesecurity.com/2019/02/08/first-clipper-malware-google-play/);
    [Drebin, Arp et al.](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf).'
  answer_sources:
  - MDM/EDR application_manifest.xml
  - MDM/EDR api_monitoring.log
  - MDM/EDR application_inventory.csv
  - Public App Store Scraped Data
  - 'NAI: Managed mobile devices (corporate-owned or BYOD enrolled in MDM)'
  range: Last 90 days
  queries:
  - technology: MDM/EDR query pseudocode
    query: 'apps = inventory(managed_devices)

      clip = apps WHERE manifest/disasm USES {OnPrimaryClipChangedListener, getPrimaryClip, setPrimaryClip}

      net = apps WHERE granted_permissions CONTAINS android.permission.INTERNET

      ALERT WHEN app IN (clip AND net) AND app NOT system AND app NOT IN allowlist'
- question: Do any vetted apps exhibit a data flow where a clipboard source (getPrimaryClip / OnPrimaryClipChangedListener)
    reaches a network sink (HttpURLConnection, OkHttp, socket write), as shown by static taint analysis
    or confirmed dynamically at runtime?
  context: 'A clipboard-source-to-network-sink data flow is a definitive transmitted-data-manipulation/exfil
    signature. Run static taint analysis (e.g., FlowDroid) during app vetting and alert when clipboard
    data can reach a network sink. On instrumented/managed devices, confirm dynamically (e.g., TaintDroid)
    by tainting clipboard data and observing transmission to network sinks at runtime. Under the Impact
    tactic, this is the most direct evidence that an app is built to steal/alter clipboard contents and
    send them off-device; a confirmed taint flow with no legitimate feature justification should block
    the app and trigger investigation of affected devices. Sources: [FlowDroid, Arzt et al.](https://www.bodden.de/pubs/far+14flowdroid.pdf);
    [TaintDroid, Enck et al.](https://static.usenix.org/events/osdi10/tech/full_papers/Enck.pdf).'
  answer_sources:
  - MDM/EDR application_manifest.xml
  - MDM/EDR api_monitoring.log
  - MDM/EDR application_inventory.csv
  - Public App Store Scraped Data
  - 'NAI: Managed mobile devices (corporate-owned or BYOD enrolled in MDM)'
  range: Last 90 days
  queries:
  - technology: Static taint analysis pseudocode
    query: 'source = {getPrimaryClip, OnPrimaryClipChangedListener}

      sink = {HttpURLConnection, OkHttp, socket.write}

      ALERT WHEN taint_reachable(source -> sink)  # FlowDroid'
  - technology: Dynamic analysis pseudocode
    query: 'taint clipboard_data on instrumented device  # TaintDroid

      ALERT WHEN tainted clipboard_data observed at network sink at runtime'
- question: Are there managed apps that use clipboard listeners in app categories where that behavior
    is statistically rare, or that contain packed/obfuscated (high-entropy) code segments or improbable
    API-call transition sequences?
  context: 'Use app-store metadata to baseline clipboard-listener usage by category and alert when a managed
    app uses a clipboard listener in a category where prevalence is below the 10th percentile (e.g., a
    flashlight or wallpaper app monitoring the clipboard). Compute Shannon entropy of DEX/native segments
    and flag packed/obfuscated payloads (entropy > 7.0) that hide clipboard logic. Model API-call sequences
    as package/family Markov transitions and flag apps whose clipboard/network transition probabilities
    are improbable. Under Impact, these statistical lenses catch clippers that disguise themselves in
    unrelated app categories or hide behind packers, complementing the explicit capability and taint checks.
    Sources: [Lyda & Hamrock, Entropy Analysis](https://ieeexplore.ieee.org/document/4140989); [MaMaDroid,
    Onwuzurike et al.](https://arxiv.org/pdf/1612.04433).'
  answer_sources:
  - MDM/EDR application_manifest.xml
  - MDM/EDR api_monitoring.log
  - MDM/EDR application_inventory.csv
  - Public App Store Scraped Data
  - 'NAI: Managed mobile devices (corporate-owned or BYOD enrolled in MDM)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'cat_baseline = appstore prevalence(clipboard_listener) per category

      ALERT WHEN app uses clipboard_listener AND category_prevalence < p10

      ALERT WHEN shannon_entropy(dex/native_segment) > 7.0  # packed/obfuscated'
  - technology: Markov-model pseudocode
    query: 'build per-family Markov transition matrix of API-call sequences  # MaMaDroid

      ALERT WHEN P(clipboard -> network transitions) is improbable vs family model'
- question: Which clipboard-enabled apps receive a high risk score from an explainable static classifier
    trained on manifest, code, and store-metadata features?
  context: 'Train an explainable static classifier (e.g., a linear SVM as in Drebin) on manifest+code
    features (permissions, suspicious/used API calls, embedded URLs, app category, ratings, installs,
    developer reputation) and surface the top-3 contributing features per decision in the review queue.
    Complement with a Markov-feature ensemble (Random Forest/KNN as in MaMaDroid) for behavioral robustness.
    Validate with realistic malware:benign ratios and time-aware splits to keep precision honest. Under
    the Impact tactic, ML scoring prioritizes the app-review queue toward the most likely clippers, while
    the explained features keep each verdict auditable and actionable for the security team. Sources:
    [Drebin, Arp et al.](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf); [MaMaDroid,
    Onwuzurike et al.](https://arxiv.org/pdf/1612.04433); [TESSERACT, Pendlebury et al.](https://www.usenix.org/system/files/sec19-pendlebury.pdf).'
  answer_sources:
  - MDM/EDR application_manifest.xml
  - MDM/EDR api_monitoring.log
  - MDM/EDR application_inventory.csv
  - Public App Store Scraped Data
  - 'NAI: Managed mobile devices (corporate-owned or BYOD enrolled in MDM)'
  range: Last 90 days (time-aware validation; periodic retrain)
  queries:
  - technology: ML/pseudocode
    query: "features = [permissions, suspicious_api_calls, used_api_calls, embedded_urls,\n          \
      \  app_category, ratings, installs, developer_reputation]\nmodel = linear_SVM (Drebin) + RandomForest/KNN\
      \ on Markov features (MaMaDroid)\nvalidate with realistic malware:benign ratio + time-aware split\n\
      ALERT WHEN risk_score high WITH top3_features -> review_queue"
