name: 'T1637: Dynamic Resolution'
id: f8ecd2d6-cad6-41ca-9830-0b3e8f90018a
description: 'Investigate whether an adversary is maintaining command and control over a compromised mobile
  device (Android or iOS) by using Dynamic Resolution to evade detection and remediation. This playbook
  helps an analyst hunt for the network and DNS hallmarks of dynamically generated C2 rendezvous: domains
  produced by a Domain Generation Algorithm (DGA) that exhibit high Shannon entropy, high Kullback-Leibler
  divergence from English bigram norms, anomalous numeric/character ratios, and bursts of NXDOMAIN failures
  as malware cycles through candidate domains; connections to newly registered or strategically aged-and-dormant
  low-prevalence domains that beacon with low data volume and highly periodic timing; and fast-flux infrastructure
  where a single domain rotates rapidly across many IPs, /24s, and ASNs with very low DNS TTLs (single-
  and double-flux). Because mobile devices frequently use cellular and public Wi-Fi networks outside enterprise
  control, the playbook focuses on telemetry an analyst can realistically obtain - Zeek dns.log/conn.log
  at corporate Wi-Fi gateways and VPN concentrators, Mobile Device Management (MDM) DNS logs, and Application
  Vetting network telemetry - enriched with WHOIS, domain-prevalence, and IP-to-ASN data. Detection methods
  span symbolic-logic blocklist and rule matching, statistical baselining (entropy/KL divergence, NXDOMAIN
  rate, beacon coefficient of variation and FFT periodicity, IP/ASN churn and TTL analysis), and machine
  learning (LSTM/Random Forest DGA classifiers, autocorrelation and Isolation Forest beacon detection,
  and DBSCAN/decision-tree fast-flux clustering) with SHAP explanations, so an analyst can determine whether
  observed mobile traffic represents adversary C2 via Dynamic Resolution.'
type: technique
related:
- tactic_id: TA0037
  tactic_name: Command and Control
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a mobile device query a DNS domain that matches a known C2/DGA threat-intelligence blocklist
    or a precomputed DGArchive-style corpus, or that violates hard lexical rules (domain length over 18
    characters, more than 12 distinct characters, and zero dictionary-word substrings)?
  context: 'Under the Command and Control tactic, Dynamic Resolution lets malware reach C2 through algorithmically
    generated domains rather than a fixed, easily blocked address. This symbolic-logic check is the fastest,
    highest-confidence path: continuously match the query field in Zeek dns.log (and MDM/Application Vetting
    DNS telemetry) against curated C2/DGA intelligence feeds and a DGArchive-style corpus, and apply deterministic
    lexical rules that catch the obviously machine-generated labels DGAs produce. A direct feed match
    or rule hit is a strong positive that warrants immediate investigation of the mobile device, its user,
    and the resolved infrastructure; a negative result does not clear the host because unknown or dictionary-style
    DGAs may evade fixed lists, so pair this with the statistical and ML checks below. CDN domains can
    resemble these patterns, so confirm against prevalence before escalating.'
  answer_sources:
  - Zeek dns.log
  - Mobile Device Management (MDM) DNS logs
  - Application Vetting network telemetry
  - 'NAI: Corporate Wi-Fi gateways, VPN concentrators, guest network segments, and Mobile Device Management
    (MDM) platform logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'dns = zeek_dns(source_ip in mobile_ip_ranges)

      dga_feed = threatintel[''c2_dga_domains''] + dgarchive_corpus

      rule_hit = length(dns.query) > 18 AND distinct_chars(dns.query) > 12 AND no_dictionary_substring(dns.query)

      alert HIGH when dns.query in dga_feed OR resolved_ip(dns) in dga_feed OR rule_hit

      output device, user, dns.query, resolved_ip, match_reason'
- question: For domains queried by mobile devices, do Shannon entropy and Kullback-Leibler divergence
    from an English bigram baseline, together with the numeric-to-alphabetic character ratio, both exceed
    the 98th percentile of a rolling 30-day baseline?
  context: Many DGA domains are not yet on any blocklist, so this statistical method finds them by their
    structure. First identify mobile device IP ranges from DHCP/VPN logs, then for each unique domain
    those hosts query in Zeek dns.log compute Shannon entropy, the KL divergence of its character-bigram
    distribution against an English-language baseline, and the ratio of numeric to alphabetic characters.
    KL divergence is used alongside raw entropy because it suppresses CDN false positives that high entropy
    alone would flag. Flagging only domains where both the entropy/KL score and the numeric ratio exceed
    98th-percentile thresholds keeps the alert volume manageable while catching the randomized labels
    typical of Dynamic Resolution C2. A positive result is a candidate DGA domain to pivot on (resolved
    IPs, connection volume, registration age); a negative result means the label looks linguistically
    normal.
  answer_sources:
  - Zeek dns.log
  - Mobile Device Management (MDM) DNS logs
  - Application Vetting network telemetry
  - 'NAI: Corporate Wi-Fi gateways, VPN concentrators, guest network segments, and Mobile Device Management
    (MDM) platform logs.'
  range: Last 90 days, with a rolling 30-day baseline for percentile thresholds
  queries:
  - technology: SIEM/Stats pseudocode
    query: "mobile_ips = dhcp_vpn_logs.mobile_ranges\nfor domain in distinct(zeek_dns.query where src\
      \ in mobile_ips):\n  H = shannon_entropy(domain)\n  KL = kl_divergence(bigram_dist(domain), english_bigram_baseline)\n\
      \  num_ratio = count_digits(domain) / count_alpha(domain)\nalert when (H >= p98(H_30d) OR KL >=\
      \ p98(KL_30d)) AND num_ratio >= p98(num_ratio_30d)\noutput domain, H, KL, num_ratio"
- question: Is a mobile device emitting a burst of failed (NXDOMAIN) DNS resolutions that exceeds the
    99th percentile of its own 30-day baseline (for example more than 20 NXDOMAINs in a 10-minute window),
    with the failed labels clustering into a shared lexical family?
  context: A DGA typically iterates through many candidate domains, most of which are unregistered, producing
    a tell-tale burst of NXDOMAIN responses before the malware reaches a live C2 domain. Treating failed
    resolutions as a distinct signal, count NXDOMAIN responses per source mobile IP in 10-minute windows
    from Zeek dns.log and alert when the rate exceeds the host's 99th-percentile 30-day baseline. To confirm
    the failures are algorithmic rather than mistyped or stale references, cluster the failed labels lexically
    (shared length, n-gram, or edit-distance characteristics) to show they belong to one generation family.
    A positive result strongly indicates an active DGA C2 search on that mobile device; a negative result
    means DNS failures are within normal bounds for that host.
  answer_sources:
  - Zeek dns.log
  - Mobile Device Management (MDM) DNS logs
  - Application Vetting network telemetry
  - 'NAI: Corporate Wi-Fi gateways, VPN concentrators, guest network segments, and Mobile Device Management
    (MDM) platform logs.'
  range: Last 90 days, evaluated in 10-minute windows against a 30-day per-host baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for src in mobile_ips:\n  per 10min window: nx = count(zeek_dns where src=src AND rcode=NXDOMAIN)\n\
      \  baseline = p99(nx_per_window over 30d for src)\n  if nx > baseline AND nx > 20:\n    family =\
      \ lexical_cluster(failed_labels)  # edit-distance / n-gram\n    alert src, window, nx, family_size,\
      \ sample_labels"
- question: When a character-level LSTM and a Random Forest over lexical features classify a mobile-queried
    domain as DGA with confidence above 0.90, what are the top-3 contributing features driving that classification?
  context: This machine-learning method catches DGA families that defeat simple thresholds, including
    low-entropy dictionary-word DGAs. Run a character-level LSTM and a Random Forest over lexical features
    (length, entropy, n-gram frequency, vowel/consonant ratio) trained on labeled DGA lists versus an
    allowlist such as the Tranco Top 1M, adding WHOIS side-information and a smashword score to detect
    dictionary DGAs, and use the FANCI feature set for per-query NXDOMAIN scoring. Escalate only classifications
    with confidence above 0.90 and attach the top-3 contributing features (for example entropy, bigram
    rarity, length) via SHAP so an analyst can quickly judge and trust the verdict. A high-confidence,
    well-explained positive is a strong Dynamic Resolution C2 indicator on that mobile device; explainability
    also reduces false escalations on CDN-style domains.
  answer_sources:
  - Zeek dns.log
  - Mobile Device Management (MDM) DNS logs
  - Application Vetting network telemetry
  - 'NAI: Corporate Wi-Fi gateways, VPN concentrators, guest network segments, and Mobile Device Management
    (MDM) platform logs.'
  range: Last 90 days; retrain models periodically on refreshed DGA and allowlist corpora
  queries:
  - technology: ML/Classifier pseudocode
    query: "features = [length, entropy, ngram_freq, vowel_consonant_ratio, whois_age, smashword_score]\n\
      lstm_score = char_lstm(domain)        # Woodbridge et al.\nrf_score = random_forest(features)  \
      \  # trained DGA vs Tranco Top 1M\nfanci_score = fanci(nxdomain_features)\nconf = ensemble(lstm_score,\
      \ rf_score, fanci_score)\nif conf > 0.90:\n  top3 = shap_top_features(features, k=3)\n  alert domain,\
      \ conf, top3"
- question: Did a mobile device resolve a domain or connect to an IP that exactly matches a threat-intelligence
    blocklist of C2 infrastructure or a known dynamic-DNS provider?
  context: Dynamic Resolution frequently leans on dynamic-DNS providers and disposable C2 hosts. This
    symbolic-logic check enriches each mobile DNS query with its resolved IPs and tests both the domain
    and the IP against curated blocklists of C2 infrastructure and known dynamic-DNS services. An exact
    match is a critical-severity positive that should drive immediate containment review of the mobile
    device and identification of every host that touched the same infrastructure. A negative result does
    not clear the device, because adversaries register fresh domains faster than feeds update, so this
    check works in concert with the prevalence, beaconing, and ML methods that follow under the Command
    and Control tactic.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - External WHOIS Data
  - External Domain Prevalence Lists
  - 'NAI: Corporate Wi-Fi gateways, VPN concentrators, guest network segments, and external WHOIS services.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'dns = zeek_dns(src in mobile_ips); enrich resolved_ip

      c2_list = threatintel[''c2_infra''] + dyndns_providers

      alert CRITICAL when dns.query in c2_list OR resolved_ip in c2_list

      output device, user, dns.query, resolved_ip'
- question: Does a mobile device contact a domain that is newly registered (under 30 days), strategically
    aged (dormant over 90 days then spiking), or unpopular (not in the top 1M), scoring above the risk
    threshold, and then exhibit low total bytes and highly regular connection timing in Zeek conn.log?
  context: C2 over Dynamic Resolution often uses domains that are brand new, deliberately aged then suddenly
    activated, or simply absent from popularity lists. This statistical method enriches each mobile-queried
    domain with its WHOIS registration date and Tranco rank, then computes risk = (10*is_new) + (8*is_aged_spike)
    + (5*is_unpopular), where is_new flags registration under 30 days, is_aged_spike flags dormancy over
    90 days followed by an activity spike, and is_unpopular flags absence from the top 1M. For domains
    with risk above 10, analyze 24 hours of Zeek conn.log and flag sources with low total bytes (below
    the 20th percentile) and highly regular timing (inter-arrival standard deviation below the 10th percentile)
    - the short-lived-domain and beaconing features validated by EXPOSURE. A positive result is a high-confidence
    beaconing-to-suspicious-domain finding; a negative means the domain is established and the traffic
    is irregular or voluminous.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - External WHOIS Data
  - External Domain Prevalence Lists
  - 'NAI: Corporate Wi-Fi gateways, VPN concentrators, guest network segments, and external WHOIS services.'
  range: Last 90 days for domain scoring; 24-hour windows for conn.log beacon analysis
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for domain in mobile_dns_domains:\n  enrich whois_age, tranco_rank, history\n  is_new = whois_age\
      \ < 30d; is_aged_spike = dormant>90d AND activity_spike; is_unpopular = tranco_rank not in top1M\n\
      \  risk = 10*is_new + 8*is_aged_spike + 5*is_unpopular\n  if risk > 10:\n    c = zeek_conn(domain,\
      \ last 24h)\n    if total_bytes(c) < p20(bytes) AND stdev(interarrival(c)) < p10(jitter):\n    \
      \  alert domain, risk, total_bytes, interarrival_stdev"
- question: For traffic to high-risk domains, is the coefficient of variation of connection inter-arrival
    intervals and payload sizes below the 10th percentile, or does an FFT reveal a strong persistent non-trivial
    periodicity, indicating automated beaconing?
  context: Human-driven traffic is bursty and irregular; automated C2 beacons are metronomic. For each
    high-risk domain, build a per-source-IP time series of connection events and compute the coefficient
    of variation (CV) of inter-arrival intervals and payload sizes - a low CV means a regular beacon,
    as implemented in RITA - and extract the dominant periodicity via FFT with multi-stage noise filtering
    as in BAYWATCH. Also profile the success/fail ratio of the connections as a distinct state signal,
    since beacons often retry with consistent state. Alert when CV falls below the 10th percentile or
    a strong non-trivial FFT peak persists. A positive result indicates a regular, machine-driven channel
    consistent with Dynamic Resolution C2; a negative means timing is irregular and unlikely to be a beacon.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - External WHOIS Data
  - External Domain Prevalence Lists
  - 'NAI: Corporate Wi-Fi gateways, VPN concentrators, guest network segments, and external WHOIS services.'
  range: Last 90 days, with multi-day windows to expose slow beacons
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for (src, domain) in high_risk_pairs:\n  ts = event_times(zeek_conn[src->domain]); sizes =\
      \ payload_sizes\n  cv_t = stdev(diff(ts))/mean(diff(ts)); cv_s = stdev(sizes)/mean(sizes)\n  peak\
      \ = max(fft_power(ts, noise_filtered))\n  sf = success_count/fail_count\n  alert when cv_t < p10\
      \ OR cv_s < p10 OR peak > peak_threshold\n  output src, domain, cv_t, cv_s, dominant_period, sf"
- question: Does autocorrelation of the connection time series to a high-risk domain show a repeating
    peak at non-zero lag, or does an Isolation Forest trained on benign traffic flag the domain's volumetric
    and lexical features as anomalous, and what top-3 features explain it?
  context: 'This machine-learning method confirms and explains beaconing that statistics alone may miss.
    Apply autocorrelation to the per-domain connection time series: a repeating peak at a non-zero lag
    reveals periodic beaconing, and the lag yields the detected interval to report. In parallel, feed
    per-domain volumetric and lexical features to an Isolation Forest trained only on benign traffic (Nadler
    et al.) and use correlation-selected mobile flow features (CorrNetDroid) suited to mobile devices.
    Surface the top-3 contributing features (for example interval regularity, bytes, domain age) via SHAP
    so the analyst can validate the finding. A positive result - a clear autocorrelation interval or a
    high anomaly score with sensible explanations - is strong evidence of automated C2 over a dynamically
    resolved domain; a negative reduces suspicion for that domain.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - External WHOIS Data
  - External Domain Prevalence Lists
  - 'NAI: Corporate Wi-Fi gateways, VPN concentrators, guest network segments, and external WHOIS services.'
  range: Last 90 days; train the Isolation Forest on a known-benign baseline window
  queries:
  - technology: ML/Anomaly pseudocode
    query: "for domain in high_risk_domains:\n  ac = autocorrelation(conn_timeseries(domain))\n  if peak_at_nonzero_lag(ac):\
      \ report period = lag; flag periodic\n  feats = [interval_regularity, bytes, duration, domain_age,\
      \ corrnetdroid_features]\n  score = isolation_forest(feats)   # trained on benign only\n  if score\
      \ anomalous OR periodic:\n    top3 = shap_top_features(feats, k=3)\n    alert domain, period, score,\
      \ top3"
- question: Did a mobile device query a domain matching known dynamic-DNS provider patterns or showing
    rotating NS/CNAME records (double flux), or a domain whose A records exceed 10 distinct IPs across
    more than 3 ASNs within one hour with a TTL under 300 seconds?
  context: 'Fast-flux DNS is a core Dynamic Resolution mechanism: a single domain is mapped to a constantly
    changing pool of IPs (single flux), and in double flux the name servers themselves rotate. This symbolic-logic
    check alerts on mobile DNS queries matching known dynamic-DNS provider patterns (for example *.ddns.net,
    *.no-ip.com, *.duckdns.org) and on rotating NS/CNAME records per CISA AA25-093A, and applies hard
    thresholds - TTL under 300 seconds combined with more than 10 distinct A records and more than 3 distinct
    ASNs within one hour - that fire a fast-flux alert without ML. A positive result is high-confidence
    fast-flux C2 infrastructure to block and investigate; a negative does not clear the domain, since
    some flux operates more slowly and is caught by the statistical and ML methods below.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - External IP to ASN Database
  - 'NAI: Corporate Wi-Fi gateways, VPN concentrators, guest network segments, and DNS resolution infrastructure.'
  range: Last 90 days, evaluated over rolling 1-hour windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'dns = zeek_dns(src in mobile_ips); enrich asn(resolved_ip)

      dyn = match(dns.query, [''*.ddns.net'',''*.no-ip.com'',''*.duckdns.org'', dyndns_patterns])

      flux = (min_ttl(dns) < 300) AND (distinct_A(dns,1h) > 10) AND (distinct_asn(dns,1h) > 3)

      doubleflux = ns_or_cname_records_rotate(dns)

      alert when dyn OR flux OR doubleflux

      output domain, distinct_ips, distinct_asns, min_ttl'
- question: Over a rolling 1-hour window, does a mobile-queried domain's count of unique resolved IPs,
    unique /24 networks, and unique ASNs exceed the 99th percentile while average TTL stays under 300
    seconds and IPs rotate every 3-5 minutes?
  context: This statistical method detects fast flux by quantifying IP/ASN churn rather than relying on
    provider lists. Group Zeek dns.log by domain over a rolling 1-hour window and count unique resolved
    IPs, unique /24 networks, and unique ASNs, and measure average TTL and TTL standard deviation. Alert
    when IP/ASN diversity exceeds the 99th percentile for mobile-queried domains, average TTL is under
    300 seconds, and IP rotation recurs every 3-5 minutes - the discriminators established by EXPOSURE
    and FluxBuster. To avoid flagging legitimate CDNs and carrier-grade NAT, suppress candidates that
    pass geolocation-consistency and prevalence checks. A positive result indicates flux-service infrastructure
    backing a dynamically resolved C2 domain; a negative means resolution diversity is within normal,
    CDN-like bounds.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - External IP to ASN Database
  - 'NAI: Corporate Wi-Fi gateways, VPN concentrators, guest network segments, and DNS resolution infrastructure.'
  range: Last 90 days, computed over rolling 1-hour windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for domain in mobile_dns_domains (rolling 1h):\n  uips=distinct(resolved_ip); u24=distinct(slash24);\
      \ uasn=distinct(asn)\n  avg_ttl=mean(ttl); ttl_sd=stdev(ttl); rot=median_ip_change_interval\n  if\
      \ (uips>=p99 OR uasn>=p99) AND avg_ttl<300 AND 3min<=rot<=5min:\n    if not cdn_geo_consistent(domain)\
      \ and unpopular(domain):\n      alert domain, uips, u24, uasn, avg_ttl, rot"
- question: When DBSCAN over destination IP/port/ASN of a mobile device's connections forms a large multi-IP/multi-ASN
    cluster, or a C4.5/J48 decision tree classifies a domain's resolved-IP-set features as a flux service
    network rather than a CDN, what top-3 features explain the verdict?
  context: This machine-learning method separates true fast-flux infrastructure from load-balanced CDNs
    that share surface traits. For each mobile device IP, extract Zeek conn.log metadata over 15-minute
    windows and apply DBSCAN on destination IP, port, and ASN; a large cluster spanning many distinct
    IPs and ASNs indicates fast flux. In parallel, train a C4.5/J48 decision tree on resolved-IP-set features
    (distinct IPs, distinct /24s, distinct ASNs, average TTL, IP growth rate) to distinguish flux service
    networks from CDNs, per FluxBuster and EXPOSURE. Include the top-3 contributing features (for example
    ASN count, TTL, IP growth rate) via SHAP so the analyst can validate the call. A positive, well-explained
    result is strong evidence of fast-flux C2 via Dynamic Resolution; the explanation also helps dismiss
    benign CDN clusters that would otherwise look similar.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - External IP to ASN Database
  - 'NAI: Corporate Wi-Fi gateways, VPN concentrators, guest network segments, and DNS resolution infrastructure.'
  range: Last 90 days; DBSCAN over 15-minute connection windows
  queries:
  - technology: ML/Cluster pseudocode
    query: "for src in mobile_ips (15min windows):\n  pts = zeek_conn[src].select(dest_ip, dest_port,\
      \ asn)\n  clusters = dbscan(pts); flag if cluster has many distinct ips/asns\nfeats = [distinct_ips,\
      \ distinct_24s, distinct_asns, avg_ttl, ip_growth_rate]\nlabel = j48_decision_tree(feats)   # flux\
      \ vs cdn\nif label == 'flux' OR large_flux_cluster:\n  top3 = shap_top_features(feats, k=3)\n  alert\
      \ domain, label, top3"
