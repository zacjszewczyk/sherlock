- question: '[Credential Access] Alert on burst of chooser dialogs for sensitive schemes: have you determined
    whether "alert on burst of chooser dialogs for sensitive schemes" is warranted on managed mobile devices,
    using the Symbolic Logic approach described, to answer the intelligence requirement — Is an adversary
    attempting to intercept credentials or access tokens by hijacking URI schemes on mobile devices? (PIR)'
  context: 'Tactic relevance (Credential Access): Is an adversary attempting to intercept credentials
    or access tokens by hijacking URI schemes on mobile devices? (PIR) This question operationalizes a
    Symbolic Logic detection for MITRE ATT&CK T1635.001 (URI Hijacking) on Android/iOS. Evidence under
    investigation: A device generates repeated application chooser dialogs for a sensitive URI scheme
    within a short window, indicating URI contention or hijacking attempts compared with the device or
    fleet baseline. Method detail: A correctly verified App Link opens its app directly with no chooser
    dialog, so repeated disambiguation dialogs for a sensitive scheme/host imply contended or unverified
    (hijackable) handlers. Trigger when a device shows more than two chooser dialogs for a sensitive scheme
    within five minutes. Enrich with source IP, referrer URL, and user-agent from first-party network
    logs (Zeek http.log/dns.log/conn.log) to identify the phishing/redirect source [Verify Android App
    Links](https://developer.android.com/training/app-links/verify-android-applinks) [Measuring the Insecurity
    of Mobile Deep Links of Android](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-liu.pdf).
    A positive result indicates an app is positioned to hijack a sensitive URI scheme/deep link and intercept
    redirected OAuth codes, tokens, or other credentials intended for a trusted application; a negative
    result reduces but does not eliminate suspicion, so corroborate with the other questions in this playbook
    (rogue scheme/host registration → contended chooser dialogs → interceptable OAuth/SSO redirect → token
    redemption by the colliding app).'
  answer_sources:
  - MTD security event log
  - Android logcat
  - iOS Unified Logs
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Managed Mobile Endpoints (iOS/Android), Mobile Threat Defense (MTD) Platform, Network Gateways
    (VPN Concentrators, Proxies)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=mtd (source="MTD security event log" OR source="Android logcat" OR source="iOS Unified
      Logs")

      event="app_chooser_dialog" sensitive_scheme=true

      | bin _time span=5m

      | stats count as dialogs by device_id, scheme, _time

      | where dialogs > 2

      | join device_id _time [ search index=zeek (sourcetype=http OR sourcetype=dns OR sourcetype=conn)
      ]

      | table device_id, scheme, dialogs, src_ip, referrer, user_agent'
