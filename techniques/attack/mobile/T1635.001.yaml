- question: '[Credential Access] Flag custom-scheme OAuth redirects without PKCE: have you determined
    whether "flag custom-scheme oauth redirects without pkce" is warranted on managed mobile devices,
    using the Symbolic Logic approach described, to answer the intelligence requirement — Is an adversary
    attempting to intercept credentials or access tokens by hijacking URI schemes on mobile devices? (PIR)'
  context: 'Tactic relevance (Credential Access): Is an adversary attempting to intercept credentials
    or access tokens by hijacking URI schemes on mobile devices? (PIR) This question operationalizes a
    Symbolic Logic detection for MITRE ATT&CK T1635.001 (URI Hijacking) on Android/iOS. Evidence under
    investigation: A mobile app implements an OAuth/SSO flow whose authorization-response redirect uses
    a custom (private-use) URI scheme without PKCE, or uses an unverified claimed-https redirect, making
    intercepted authorization codes/tokens redeemable by a colliding app. Method detail: During app vetting,
    parse the OAuth authorization flow and alert when the redirect_uri uses a custom/private-use URI scheme
    AND the request omits a PKCE code_challenge/code_verifier; such codes are redeemable by any app that
    hijacks the scheme. Treat claimed-https redirects bound to verified asset links as the secure baseline
    to allowlist [OAuth 2.0 for Native Apps (RFC 8252)](https://www.rfc-editor.org/rfc/rfc8252.txt) [Proof
    Key for Code Exchange (PKCE), RFC 7636](https://www.rfc-editor.org/rfc/rfc7636.txt). A positive result
    indicates an app is positioned to hijack a sensitive URI scheme/deep link and intercept redirected
    OAuth codes, tokens, or other credentials intended for a trusted application; a negative result reduces
    but does not eliminate suspicion, so corroborate with the other questions in this playbook (rogue
    scheme/host registration → contended chooser dialogs → interceptable OAuth/SSO redirect → token redemption
    by the colliding app).'
  answer_sources:
  - Application vetting OAuth/redirect-URI analysis
  - Application vetting URI registration logs (manifest intent-filter scheme/host)
  - App Link / Universal Link verification status (assetlinks.json match)
  - Static binary / dex analysis (PKCE code_challenge usage)
  - 'NAI: Application Vetting System, Managed Mobile Endpoints (iOS/Android), Mobile Threat Defense (MTD)
    Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=vetting source="Application vetting OAuth/redirect-URI analysis"

      | eval custom_scheme=if(redirect_uri_scheme NOT IN ("https"),1,0)

      | eval no_pkce=if(pkce_code_challenge="absent",1,0)

      | where custom_scheme=1 AND no_pkce=1

      | eval severity="high"

