questions:
- question: '[Credential Access] Detect scheme collisions with mismatched signer: have you determined
    whether "detect scheme collisions with mismatched signer" is warranted on managed mobile devices,
    using the Symbolic Logic approach described, to answer the intelligence requirement — Is an adversary
    attempting to intercept credentials or access tokens by hijacking URI schemes on mobile devices? (PIR)'
  context: 'Tactic relevance (Credential Access): Is an adversary attempting to intercept credentials
    or access tokens by hijacking URI schemes on mobile devices? (PIR) This question operationalizes a
    Symbolic Logic detection for MITRE ATT&CK T1635.001 (URI Hijacking) on Android/iOS. Evidence under
    investigation: A mobile app registers a URI scheme matching a trusted application but with a different
    package ID or signing certificate than the allowlisted owner, and the app shows high-risk traits (sideloaded
    origin, low reputation, excessive permissions, or recent install). Method detail: Maintain an allowlist
    of trusted package IDs, signing certificates, and the URI schemes they own. Alert when any device/app
    registers a URI scheme that matches an allowlisted scheme but has a different signing certificate
    or package ID. iOS and Android both permit multiple apps to claim one scheme with no owner authentication,
    so signer/bundle mismatch on a shared scheme is the core hijack primitive [Unauthorized Cross-App
    Resource Access on MAC OS X and iOS](https://arxiv.org/abs/1505.06836) [iOS URL Scheme Susceptible
    to Hijacking](http://web.archive.org/web/20211023221110/https://blog.trendmicro.com/trendlabs-security-intelligence/ios-url-scheme-susceptible-to-hijacking/).
    A positive result indicates an app is positioned to hijack a sensitive URI scheme/deep link and intercept
    redirected OAuth codes, tokens, or other credentials intended for a trusted application; a negative
    result reduces but does not eliminate suspicion, so corroborate with the other questions in this playbook
    (rogue scheme/host registration → contended chooser dialogs → interceptable OAuth/SSO redirect → token
    redemption by the colliding app).'
  answer_sources:
  - MDM application inventory log
  - MTD application scan log
  - Application vetting URI registration logs (manifest intent-filter scheme/host)
  - App Link / Universal Link verification status (assetlinks.json match)
  - Threat intelligence reputation feed
  - 'NAI: Managed Mobile Endpoints (iOS/Android), Mobile Device Management (MDM) Server, Mobile Threat
    Defense (MTD) Platform, Application Vetting System'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=mdm (source="MDM application inventory log" OR source="Application vetting URI registration
      logs")

      | eval scheme=uri_scheme, signer=signing_cert_sha256, pkg=package_id

      | lookup TrustedSchemeAllowlist scheme OUTPUT owner_pkg, owner_signer

      | where isnotnull(owner_pkg) AND (pkg!=owner_pkg OR signer!=owner_signer)

      | eval severity="high"

      | table device_id, pkg, signer, scheme, owner_pkg, owner_signer'
- question: '[Credential Access] Flag failed or missing App Link verification (State/Failure signal):
