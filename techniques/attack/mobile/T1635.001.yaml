- question: '[Credential Access] Track growth in scheme claimants (Volume/Frequency): have you determined
    whether "track growth in scheme claimants (volume/frequency)" is warranted on managed mobile devices,
    using the Statistical Method approach described, to answer the intelligence requirement — Is an adversary
    attempting to intercept credentials or access tokens by hijacking URI schemes on mobile devices? (PIR)'
  context: 'Tactic relevance (Credential Access): Is an adversary attempting to intercept credentials
    or access tokens by hijacking URI schemes on mobile devices? (PIR) This question operationalizes a
    Statistical Method detection for MITRE ATT&CK T1635.001 (URI Hijacking) on Android/iOS. Evidence under
    investigation: A mobile app registers a URI scheme matching a trusted application but with a different
    package ID or signing certificate than the allowlisted owner, and the app shows high-risk traits (sideloaded
    origin, low reputation, excessive permissions, or recent install). Method detail: For each sensitive
    URI scheme, compute the daily count of unique package IDs/signers claiming it and alert when the count
    exceeds the 30-day mean by 3 standard deviations. Also flag rare packages (<5th-percentile fleet prevalence)
    that claim a scheme owned by a common app (>95th-percentile prevalence); hijack apps are by definition
    rare claimants of popular schemes [Measuring the Insecurity of Mobile Deep Links of Android](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-liu.pdf).
    Derive fleet-specific thresholds from labeled corpora [CICAndMal2017](https://www.unb.ca/cic/datasets/andmal2017.html).
    A positive result indicates an app is positioned to hijack a sensitive URI scheme/deep link and intercept
    redirected OAuth codes, tokens, or other credentials intended for a trusted application; a negative
    result reduces but does not eliminate suspicion, so corroborate with the other questions in this playbook
    (rogue scheme/host registration → contended chooser dialogs → interceptable OAuth/SSO redirect → token
    redemption by the colliding app).'
  answer_sources:
  - MDM application inventory log
  - MTD application scan log
  - Application vetting URI registration logs (manifest intent-filter scheme/host)
  - App Link / Universal Link verification status (assetlinks.json match)
  - Threat intelligence reputation feed
  - 'NAI: Managed Mobile Endpoints (iOS/Android), Mobile Device Management (MDM) Server, Mobile Threat
    Defense (MTD) Platform, Application Vetting System'
  range: Last 90 days (use >=30 days of history to establish per-device/fleet baselines)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=mdm source="Application vetting URI registration logs"

      | bin _time span=1d

      | stats dc(package_id) as claimants by uri_scheme, _time

      | eventstats avg(claimants) as mu stdev(claimants) as sd by uri_scheme

      | where sensitive_scheme=true AND claimants > mu + 3*sd

      | append [ search rare claimant: prevalence(package_id)<p5 AND prevalence(scheme_owner)>p95 ]

      | eval severity="high"'
- question: '[Credential Access] Detect atypical intent-registration API sequences: have you determined
    whether "detect atypical intent-registration api sequences" is warranted on managed mobile devices,
    using the Statistical Method approach described, to answer the intelligence requirement — Is an adversary
    attempting to intercept credentials or access tokens by hijacking URI schemes on mobile devices? (PIR)'
  context: 'Tactic relevance (Credential Access): Is an adversary attempting to intercept credentials
