name: 'T1635.001: URI Hijacking'
id: 2ee00d85-cef5-4d32-9a94-a8ff4bc8a764
description: 'This playbook helps an analyst investigate MITRE ATT&CK T1635.001 (URI Hijacking) on managed
  Android and iOS devices, where an adversary registers a Uniform Resource Identifier (URI) scheme or
  http(s) deep-link/App-Link handler already claimed by a legitimate application in order to intercept
  sensitive data such as OAuth authorization codes and access tokens. Because both iOS and Android allow
  multiple apps to claim the same custom scheme with no owner authentication, a malicious app with a different
  signing certificate or package ID can shadow a trusted handler and harvest redirected secrets, or stage
  a phishing redirect. It supports the Credential Access mission question by chaining three observable
  conditions: (1) a hijacking app registering a scheme/host with a mismatched signer, unverified App-Link
  binding, sideloaded origin, or low reputation; (2) repeated application-chooser/disambiguation dialogs
  for a sensitive scheme that betray contended or unverified handlers; and (3) OAuth/SSO flows that use
  custom-scheme redirects without PKCE or unverified claimed-https redirects, which make intercepted codes
  redeemable by a colliding app. The questions combine deterministic allowlist/asset-link/PKCE checks,
  statistical baselining (scheme-claimant growth, chooser-dialog frequency, fleet prevalence of unsafe
  OAuth patterns), API-sequence Markov modeling, and explainable machine-learning classifiers across MDM
  application inventory, MTD telemetry, application-vetting and static-analysis output, device logs (Android
  logcat, iOS Unified Logs), and Zeek network telemetry.'
type: technique
related:
- tactic_id: TA0031
  tactic_name: Credential Access
