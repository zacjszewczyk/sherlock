questions:
- question: Is a mobile application querying system properties, Build fields, or reading device files
    whose values match a known emulator/sandbox artifact watchlist within the first 300 seconds of execution?
  context: 'This question targets the deterministic, high-confidence tell of sandbox evasion under Defense
    Evasion: an app fingerprinting its environment against well-documented emulator artifacts. Using Mobile
    EDR/MAV logs, look for calls to android.os.SystemProperties.get, execution of ''getprop'' via Runtime.exec,
    or reads of android.os.Build fields where the value matches high-confidence emulator markers (Vidas
    & Christin): Build.HARDWARE=goldfish/ranchu; Build.MODEL/PRODUCT=sdk/sdk_google/generic_x86; Build.FINGERPRINT=generic;
    Build.TAGS=test-keys; Build.BRAND/DEVICE=generic; properties containing qemu/vbox/ttVM/Genymotion;
    TelephonyManager.getDeviceId() returning all zeros; getLine1Number() matching 155552155[0-9][0-9];
    default Android/T-Mobile network operators. Also alert on file reads of /system/bin/qemu-props, /dev/qemu_pipe,
    /dev/socket/qemud, or /proc/cpuinfo containing ''QEMU Virtual CPU''. Maintain the al-khaser anti-emulation
    catalog for core-count, RAM, disk-size, and MAC-OUI checks. A positive match is strong evidence the
    app is probing for a virtual environment so it can disengage or conceal payload behavior; this deterministic
    floor stands regardless of any ML scoring. A negative result does not rule out evasion via novel or
    obfuscated artifacts.'
  answer_sources:
  - Mobile EDR API Monitoring Logs
  - Mobile EDR File Integrity Monitoring Logs
  - Mobile Application Vetting (MAV) Sandbox Reports
  - Android Logcat
  - 'NAI: Application sandboxing environment, Corporate-managed mobile devices (Android & iOS), Mobile
    Device Management (MDM) platform, Mobile Application Vetting (MAV) platform'
  range: Last 90 days; evaluate the first 300 seconds of each app execution
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from mobile_edr_api_logs, mav_sandbox_logs\nwhere api in ['SystemProperties.get','getprop(Runtime.exec)','Build.*']\n\
      \   or file_read in ['/system/bin/qemu-props','/dev/qemu_pipe','/dev/socket/qemud']\nlet v = lower(value_or_arg)\n\
      where v matches EMULATOR_WATCHLIST  // goldfish|ranchu|qemu|vbox|ttVM|Genymotion|\n      sdk|sdk_google|generic_x86|generic|test-keys,\
      \ deviceId all-zero,\n      line1Number ~ '155552155\\d\\d', cpuinfo ~ 'QEMU Virtual CPU'\n  and\
      \ event_time within 300s of process_start\nalert severity=high group by package, device_id"
  - technology: Mobile EDR/Search pseudocode
    query: 'search index=mobile_edr OR index=mav

      | eval hit=match(value,"(?i)goldfish|ranchu|qemu|vbox|generic_x86|sdk_google|test-keys")

      | where hit=1 AND seconds_since_start<=300

      | table _time package device_id api value file_read'
- question: Within the first 300 seconds of runtime, is a newly seen application querying an abnormally
    high number of distinct system properties or Build fields compared to its app-category baseline?
  context: Dense environment fingerprinting is the core sandbox-evasion behavior (Afianian et al.), and
    API-call frequency profiling is more robust than permission review (DroidAPIMiner). For each new package,
    count the distinct system properties / Build fields queried in the first 300 seconds. Maintain a rolling
    30-day baseline distribution segmented by app category and derive the percentile cutoff per dataset;
    flag any app exceeding the 98th percentile of its category baseline (or a global baseline when the
    category has <100 samples). Also record Volume (total queries), Frequency (queries/sec), and time-to-first-property-query
    as distinct metrics. A spike well above peers suggests the app is methodically probing its environment
    to decide whether to reveal malicious behavior. This statistical method complements the deterministic
    watchlist by catching evasion that uses unknown or rotated artifacts.
  answer_sources:
  - Mobile EDR API Monitoring Logs
  - Mobile EDR File Integrity Monitoring Logs
  - Mobile Application Vetting (MAV) Sandbox Reports
  - Android Logcat
  - 'NAI: Application sandboxing environment, Corporate-managed mobile devices (Android & iOS), Mobile
    Device Management (MDM) platform, Mobile Application Vetting (MAV) platform'
  range: Last 90 days with a rolling 30-day baseline; first 300 seconds per execution
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from mobile_edr_api_logs where seconds_since_start<=300\n| stats dc(property_or_build_field)\
      \ as distinct_q,\n        count as volume, max(rate) as freq_qps,\n        min(seconds_since_start)\
      \ as time_to_first by package, app_category\n| join app_category [ baseline: pctl98(distinct_q)\
      \ over last 30d by app_category ]\n| where distinct_q > pctl98_distinct_q\n| alert 'Excessive system-property\
      \ querying' severity=medium"
- question: Does a supervised classifier assign a high evasion probability to an application based on
    the emulator artifacts it queries and the timing/entropy of those queries?
  context: 'Train a gradient-boosting/RF classifier (e.g., XGBoost) on labeled MAV sandbox runs and public
    ground truth (CICMalDroid 2020, CICAndMal2017). Features: a binary flag per known emulator artifact
    queried, total distinct properties queried, Shannon entropy of queried property prefixes (ro.build.,
    ro.product.), milliseconds from process start to first property query, and queries/sec. Emit an evasion_probability
    plus the top-3 contributing features via SHAP/LIME in the alert text rather than a bare score, so
    an analyst can validate the reasoning. Evaluate and retrain with time-ordered splits to counter concept
    drift (TESSERACT). This ML method generalizes across obfuscation but the deterministic watchlist remains
    the floor when the model degrades. A high probability with interpretable emulator-artifact features
    is strong support that the app is performing Defense Evasion system checks.'
  answer_sources:
  - Mobile EDR API Monitoring Logs
  - Mobile EDR File Integrity Monitoring Logs
  - Mobile Application Vetting (MAV) Sandbox Reports
  - Android Logcat
  - 'NAI: Application sandboxing environment, Corporate-managed mobile devices (Android & iOS), Mobile
    Device Management (MDM) platform, Mobile Application Vetting (MAV) platform'
  range: Last 90 days for scoring; time-ordered train/test splits for model evaluation
  queries:
  - technology: ML/Pseudocode
    query: "features = [bin_flag_per_known_artifact(app),\n            distinct_properties_queried(app),\n\
      \            shannon_entropy(property_prefixes),  # ro.build., ro.product.\n            ms_to_first_property_query(app),\n\
      \            queries_per_sec(app)]\nmodel = XGBoost.train(CICMalDroid2020 + CICAndMal2017 + MAV_labeled,\n\
      \                      split=time_ordered)\np = model.predict_proba(features)\nif p >= threshold:\
      \ alert(evasion_probability=p,\n                         top3=SHAP(features))  # never bare score\n\
      fallback: deterministic emulator watchlist remains the floor"
- question: Is an application enumerating the device's hardware sensors at startup but never registering
    a listener to actually consume sensor data within 90 seconds?
  context: Querying the sensor list without using it is the canonical hardware-presence fingerprint (Afianian
    et al.; Vidas & Christin) used to confirm a realistic device rather than a sandbox. Create a correlation
    rule that triggers when a process calls SensorManager.getSensorList/getDefaultSensor (Android) or
    queries CMMotionManager availability properties such as isAccelerometerAvailable (iOS) and is NOT
    followed by registerListener (Android) or startAccelerometerUpdates/startGyroUpdates (iOS) from the
    same PID within 90 seconds. Maintain an allowlist of apps that legitimately enumerate sensors (e.g.,
    fitness, AR). Where the sensor check is immediately followed by dynamic code loading (DexClassLoader,
    System.load/dlopen, Runtime.exec), raise severity per the check-then-load gating model (Poeplau et
    al.), because that sequence indicates the payload is gated behind a successful environment check.
    A positive result is a strong query-without-use evasion signal.
  answer_sources:
  - Mobile EDR API Monitoring Logs
  - MAV Sandbox API Call Trace Logs
  - 'NAI: Corporate-managed mobile devices, Bring-Your-Own-Device (BYOD) fleet with security agents, Application
    sandboxing environment, MDM/UEM platform logs'
  range: Last 90 days; 90-second correlation window from sensor query
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from mobile_edr_api_logs, mav_api_trace\nlet q = events where api in ['SensorManager.getSensorList',\n\
      \    'getDefaultSensor','CMMotionManager.isAccelerometerAvailable']\nlet r = events where api in\
      \ ['registerListener',\n    'startAccelerometerUpdates','startGyroUpdates']\nfor each q: if NOT\
      \ exists r with same pid within 90s and package not in allowlist:\n    sev = high if followed_by(['DexClassLoader','System.load','dlopen','Runtime.exec'])\n\
      \          else medium\n    alert('Sensor query without registration', sev) by package, pid"
- question: Does an application show an abnormally high ratio of sensor-list/availability queries to listener
    registrations, or repeated 'sensor absent' results without retry, over its first five minutes?
  context: 'This statistical method quantifies the query-without-use pattern. For each app over the first
    5 minutes, compute a Dangling Sensor Query Ratio = (sensor-list / availability queries) / (listener
    registrations + 1). Establish a baseline ratio from known-good apps segmented by store category and
    alert when an app exceeds 3 standard deviations above the category mean (Afianian et al.). Track State
    explicitly: count queries returning ''sensor absent''/null and treat repeated absent results without
    any retry as a distinct disengagement signal, since malware confirming an unrealistic (sandbox) hardware
    profile will stop probing and refrain from listening. API-call frequency baselining follows DroidAPIMiner.
    A high dangling ratio or persistent absent-without-retry behavior indicates the app is checking for
    hardware rather than using it, supporting a Defense Evasion finding.'
  answer_sources:
  - Mobile EDR API Monitoring Logs
  - MAV Sandbox API Call Trace Logs
  - 'NAI: Corporate-managed mobile devices, Bring-Your-Own-Device (BYOD) fleet with security agents, Application
    sandboxing environment, MDM/UEM platform logs'
  range: Last 90 days; first 5 minutes per execution with category baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from mobile_edr_api_logs where seconds_since_start<=300\n| stats count(eval(api like 'getSensorList'\
      \ or like 'isAccelerometerAvailable')) as queries,\n        count(eval(api like 'registerListener'\
      \ or like 'start%Updates')) as regs,\n        count(eval(result in ('absent','null'))) as absent_results\n\
      \        by package, app_category\n| eval dangling_ratio = queries / (regs + 1)\n| join app_category\
      \ [ baseline: mean,stdev(dangling_ratio) by app_category ]\n| where dangling_ratio > mean + 3*stdev\
      \ OR absent_results_without_retry>0\n| alert 'High dangling sensor query ratio'"
- question: Do unsupervised clustering and Markov-transition models flag an app as an outlier in its sensor-interaction
    behavior (many queries, few registrations, or rare sensor->exec/Build transitions)?
  context: 'Run DBSCAN over per-app sensor-interaction features: (1) distinct sensor types queried, (2)
    listener-registration count, (3) a binary flag if GPS/Location is queried but ACCESS_FINE_LOCATION
    is absent from the manifest, and (4) the dangling ratio. Investigate small clusters and DBSCAN-noise
    outliers exhibiting high query / low registration counts. Complement with MaMaDroid Markov-transition
    scoring to surface rare SensorManager->exec/Build transitions, which capture the check-then-act pattern.
    Surface the top-3 contributing features per alert (XAI) so the analyst can validate, and retrain on
    time-ordered data to handle drift (TESSERACT). Outlier membership combined with anomalous transitions
    is strong evidence of hardware-presence checks for sandbox evasion; mainstream-cluster membership
    argues for benign sensor use.'
  answer_sources:
  - Mobile EDR API Monitoring Logs
  - MAV Sandbox API Call Trace Logs
  - 'NAI: Corporate-managed mobile devices, Bring-Your-Own-Device (BYOD) fleet with security agents, Application
    sandboxing environment, MDM/UEM platform logs'
  range: Last 90 days; time-ordered retraining windows
  queries:
  - technology: ML/Pseudocode
    query: "X = per_app([distinct_sensor_types, listener_reg_count,\n             flag_gps_queried_without_FINE_LOCATION,\
      \ dangling_ratio])\nlabels = DBSCAN(eps, min_samples).fit_predict(X)\ninvestigate apps in noise(-1)\
      \ or tiny clusters with high_query & low_reg\nmama = MaMaDroid_markov_transition_scores(api_call_graph)\n\
      flag rare transitions SensorManager -> {exec, Build}\nalert(top3_features=XAI(app)); retrain time_ordered\
      \ (TESSERACT)"
- question: After an application queries network-interface/MAC details, does it pivot within five minutes
    to encrypted DNS (DoH) at a non-corporate resolver whose TLS JA3 matches a known malware-C2 fingerprint?
  context: 'This correlates an on-device system check with a post-check change in egress strategy under
    Defense Evasion. Build a rule linking a Mobile EDR alert for a network-interface/MAC query (NetworkInterface.getHardwareAddress())
    to Zeek logs from the same device source IP. Generate a high-severity alert if, within 5 minutes of
    the query: (a) plaintext DNS in dns.log ceases and is replaced by TLS to a non-corporate DoH resolver
    identified by SNI in ssl.log (not dns.google or approved resolvers), AND (b) the JA3 hash of the new
    TLS matches a malware-C2 threat-intel feed. A system check immediately followed by a change in egress
    strategy or dynamic code loading is the gated second stage (Poeplau et al.) and the post-check behavioral-divergence
    model (Afianian et al.). A positive result strongly indicates the implant confirmed a real device
    and switched to a covert C2 channel.'
  answer_sources:
  - Mobile EDR API Monitoring Logs
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network egress points for mobile devices (e.g., corporate Wi-Fi, VPN gateway), DNS resolvers,
    Core network switches generating NetFlow/IPFIX, Corporate-managed mobile devices'
  range: Last 90 days; 5-minute correlation window from the interface query
  queries:
  - technology: SIEM/Rule pseudocode
    query: "edr_q = mobile_edr where api == 'NetworkInterface.getHardwareAddress'\nfor each edr_q join\
      \ zeek by device_src_ip within 5m:\n  cond_a = dns.log plaintext_queries -> ~0 AND\n           ssl.log\
      \ new TLS to DoH SNI not in approved_resolvers\n  cond_b = ssl.log.ja3 in malware_c2_ja3_feed\n\
      \  if cond_a and cond_b: alert(severity=high,\n      'Interface query followed by DoH/JA3 C2 pivot')"
  - technology: Zeek/pseudocode
    query: 'ssl.log: filter server_name NOT IN approved_resolvers AND ja3 IN c2_feed

      dns.log: detect drop-to-zero of plaintext queries from same id.orig_h

      join on id.orig_h within 300s of EDR MAC-query alert'
- question: Does a mobile device's outbound traffic show a sudden, sustained collapse in destination-IP
    or FQDN entropy, or a spike in connection-failure signals, shortly after a network-interface query?
  context: 'Channelization to a single C2 and disengagement after sandbox detection both leave statistical
    signatures in flow data. For each mobile device IP, process Zeek logs in 5-minute windows and compute
    Shannon entropy of destination IPs (id.resp_h in conn.log) and requested FQDNs (query in dns.log);
    keep a 1-hour rolling average. Alert when current-window entropy for either metric drops >80% below
    its rolling average, indicating a pivot to a single C2. Add explicit failure-mode signals: spikes
    in NXDOMAIN answers (dns.log), RST/0-byte (orig_bytes=0) or rejected connections (conn.log), and a
    sudden rise in blocked egress, which indicate an implant disengaging after detecting a sandbox. Flow-only
    Volume/Frequency/State features discriminate evasive samples (CorrNetDroid); derive thresholds from
    CICAndMal2017. A sharp entropy drop or failure spike correlated with an on-device check supports a
    Defense Evasion finding.'
  answer_sources:
  - Mobile EDR API Monitoring Logs
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network egress points for mobile devices (e.g., corporate Wi-Fi, VPN gateway), DNS resolvers,
    Core network switches generating NetFlow/IPFIX, Corporate-managed mobile devices'
  range: Last 90 days; 5-minute windows with 1-hour rolling average
  queries:
  - technology: Zeek/Stats pseudocode
    query: "from conn.log, dns.log bucket 5m by id.orig_h(device):\n  ip_entropy = shannon(id.resp_h)\n\
      \  fqdn_entropy = shannon(dns.query)\n  roll = avg(entropy) over last 1h\n  nxdomain = count(dns.rcode=='NXDOMAIN')\n\
      \  fails = count(conn.orig_bytes==0 OR conn_state in ('REJ','RSTO','RSTR'))\nalert if ip_entropy\
      \ < 0.2*roll OR fqdn_entropy < 0.2*roll\n         OR spike(nxdomain) OR spike(fails)"
- question: Does a per-device time-series anomaly model show sustained high reconstruction error in network
    behavior temporally correlated with an on-device system check?
  context: 'Implement per-device time-series anomaly detection with an LSTM autoencoder over per-minute
    Zeek features: total orig_bytes (conn.log), unique id.resp_h count, unique uid count, entropy of ja3
    hashes (ssl.log), UDP:TCP ratio, and failed/RST connection count. Sustained high reconstruction error
    signifies behavioral deviation from the device''s learned baseline, and is most meaningful when temporally
    correlated with an on-device system check (e.g., a MAC/interface query). Validate flow features against
    CorrNetDroid and CICAndMal2017, surface the top-3 reconstruction-error-driving features per alert
    (XAI) for analyst triage, and retrain on time-ordered data to counter drift (TESSERACT). Retain the
    deterministic DoH/JA3 correlation rule as the floor. High reconstruction error aligned with a system
    check supports that the implant changed its communication strategy after fingerprinting its environment.'
  answer_sources:
  - Mobile EDR API Monitoring Logs
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network egress points for mobile devices (e.g., corporate Wi-Fi, VPN gateway), DNS resolvers,
    Core network switches generating NetFlow/IPFIX, Corporate-managed mobile devices'
  range: Last 90 days; per-minute features with time-ordered retraining
  queries:
  - technology: ML/Pseudocode
    query: "feat_per_min = [sum(conn.orig_bytes), dc(conn.id.resp_h), dc(conn.uid),\n                shannon(ssl.ja3),\
      \ udp_tcp_ratio, count_failed_rst]\nae = LSTM_autoencoder.train(per_device baseline, split=time_ordered)\n\
      err = ae.reconstruction_error(feat_per_min)\nif sustained(err > threshold) and correlated_with(on_device_system_check):\n\
      \    alert(top3=XAI(err)); retrain (TESSERACT)\nfloor: deterministic DoH/JA3 correlation rule"
