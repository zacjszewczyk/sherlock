name: 'T1633.001: System Checks'
id: d3f140be-e530-4013-83e8-58f35da76a11
description: 'Investigate whether a mobile application is performing system checks to detect and evade
  virtualization, emulator, or sandbox analysis environments (MITRE ATT&CK Mobile T1633.001). This playbook
  helps an analyst hunt malware that fingerprints its runtime before deciding whether to execute its malicious
  payload, supporting the Defense Evasion question of whether an adversary is trying to evade our mobile
  analysis or sandbox environments. It covers three behavioral pillars: (1) on-device or sandbox API/file
  checks against known emulator artifacts (e.g., ''goldfish'', ''ranchu'', ''qemu'', ''vbox'', ''generic_x86'',
  ''sdk_google'', ''/system/bin/qemu-props'', spoofed IMEI/phone numbers, and CPU/RAM/disk/MAC-OUI fingerprints);
  (2) hardware-presence checks such as querying the sensor list (SensorManager.getSensorList / CMMotionManager)
  without ever registering a listener, indicating a probe for a realistic hardware environment rather
  than legitimate use; and (3) post-check behavioral divergence in network traffic, such as a pivot to
  encrypted DNS (DoH/DoT) to a non-standard resolver, a sudden collapse in destination entropy toward
  a single C2, or disengagement signals (NXDOMAIN spikes, RST/0-byte connections) after a network-interface/MAC
  query. For each behavior the playbook provides deterministic symbolic-logic rules, statistical baselining
  methods, and machine-learning approaches.'
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
