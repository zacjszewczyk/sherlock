- question: Do observed daily crash counts for critical applications across the fleet exceed the upper
    confidence interval of an ARIMA forecast?
  context: Implement an ARIMA time-series anomaly-detection model to forecast expected daily crash counts
    for critical applications fleet-wide, and alert when observed counts exceed the model's upper confidence
    interval. For Persistence, a widespread compromised-binary update will drive crash counts above what
    normal seasonality predicts. This fleet-level view catches campaigns affecting many devices simultaneously
    that per-device rules might treat as isolated noise. Investigate the spike for a common app version
    or push event.
