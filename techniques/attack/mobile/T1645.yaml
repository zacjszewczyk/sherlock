- question: Where host audit/provenance telemetry exists, can a node-level provenance detector localize
    the process whose behavior deviates from benign structure—for example a process writing to many system/binary
    paths or an improbable file-write to service-start sequence?
  context: Where on-device audit/provenance logs exist, run a node-level provenance detector—DeepLog over
    log-key sequences and ThreaTrace (GraphSAGE) over the provenance graph—to flag and localize the process
    that deviates from benign structure. For Persistence, the root-cause of a compromised binary is often
    a process writing to many system/binary paths or executing an improbable file-write to service-start
    sequence. Surfacing the offending process gives the analyst explainable, actionable root-cause for
    triage and remediation rather than a vague device-level alert.
