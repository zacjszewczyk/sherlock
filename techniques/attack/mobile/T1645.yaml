name: 'T1645: Compromise Client Software Binary'
id: 1d45e0eb-e228-4c8a-ba88-eb34332b4b52
description: 'Hunt for adversary persistence on managed mobile devices (Android and iOS) achieved by compromising
  client software binaries—overwriting or repackaging genuine system or application binaries so that attacker
  code executes whenever those binaries are routinely run. This playbook helps an analyst investigate
  three corroborating evidence streams: (1) device-integrity attestation failures from Google Play Integrity,
  Samsung Knox Attestation, hardware-backed Key/ID attestation, and Android Verified Boot / dm-verity,
  plus system-binary hash deviations from a known-good baseline; (2) anomalous network behavior at egress—connections
  to known C2 infrastructure, high-entropy (DGA) domains, lopsided outbound:inbound byte ratios, elevated
  connection-failure ratios, and traffic that matches no known per-app fingerprint—observed in Zeek conn.log,
  dns.log, and ssl.log; and (3) instability signals such as crashes of critical system apps, crash loops
  following updates, and fleet-wide crash-rate anomalies that indicate a tampered binary. It combines
  deterministic symbolic-logic rules, statistical baselining and change-point detection, and explainable
  machine-learning models so the analyst can confirm binary tampering, quarantine affected devices per
  NIST SP 800-124r2, and scope fleet-wide compromise campaigns.'
type: technique
related:
- tactic_id: TA0028
  tactic_name: Persistence
