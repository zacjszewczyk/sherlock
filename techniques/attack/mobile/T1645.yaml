questions:
- question: Did any managed mobile device return a Google Play Integrity verdict whose deviceIntegrity
    field does NOT contain MEETS_DEVICE_INTEGRITY or MEETS_STRONG_INTEGRITY (an empty or absent label),
    or a comparable failure verdict from another attestation provider such as Samsung Knox Attestation?
  context: For the Persistence tactic, a failed device-integrity attestation is the earliest deterministic
    warning that the trust chain of a device is broken—the precondition that lets an adversary overwrite
    a genuine system/client binary with a malicious one. An empty or absent deviceIntegrity label deterministically
    indicates root, an unlocked bootloader, or an unofficial ROM, and a failed Knox result cryptographically
    confirms the bootloader or system partition was modified from factory state. Fire a high-severity,
    deterministic SIEM rule on ingest and have the playbook quarantine the device to a restricted network
    profile per NIST SP 800-124r2. A positive result means the device must be treated as untrusted until
    re-imaged; a clean verdict alone does not prove cleanliness because attestation can sometimes be defeated,
    so corroborate with hardware attestation. Keep this deterministic verdict as the floor and never replace
    it with probabilistic scoring.
  answer_sources:
  - Mobile Device Management (MDM) logs
  - Google Play Integrity API logs
  - Samsung Knox Attestation logs
  - Zeek conn.log
  - Zeek ssl.log
  - Android Verified Boot / dm-verity reports
  - Hardware Keystore attestation certificates
  - File integrity monitoring (system binary hashes)
  - 'NAI: Managed mobile device fleet, Mobile Device Management (MDM) Platform, cloud-based attestation
    service endpoints (e.g., Google Cloud Platform, Samsung Knox services), and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "attestation_logs\n| where not (play_integrity.deviceIntegrity contains \"MEETS_DEVICE_INTEGRITY\"\
      \n             or play_integrity.deviceIntegrity contains \"MEETS_STRONG_INTEGRITY\")\n   or knox_attestation.verdict\
      \ == \"FAIL\"\n| set severity = \"high\"\n| action mdm_api.quarantine(device_id)"
- question: Did any managed app on a device produce a Play Integrity verdict whose appIntegrity field
    is UNRECOGNIZED_VERSION, or whose signing-certificate SHA-256 digest does not match the Google Play-distributed
    signing certificate?
  context: 'This is the defining artifact of T1645: an appIntegrity value of UNRECOGNIZED_VERSION (or
    a certificate digest that does not match the genuine Play-distributed signing certificate) indicates
    the running client binary was modified or repackaged rather than the authentic distributed binary.
    For Persistence, a repackaged binary lets attacker code execute every time the app is launched. The
    analyst should pivot on the affected package name and device to determine sideloading or tampering
    source. A positive match is strong, deterministic evidence of a compromised client binary and should
    drive immediate containment.'
  answer_sources:
  - Mobile Device Management (MDM) logs
  - Google Play Integrity API logs
  - Samsung Knox Attestation logs
  - Zeek conn.log
  - Zeek ssl.log
  - Android Verified Boot / dm-verity reports
  - Hardware Keystore attestation certificates
  - File integrity monitoring (system binary hashes)
  - 'NAI: Managed mobile device fleet, Mobile Device Management (MDM) Platform, cloud-based attestation
    service endpoints (e.g., Google Cloud Platform, Samsung Knox services), and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "play_integrity\n| where app.package in (managed_app_list)\n| where appIntegrity == \"UNRECOGNIZED_VERSION\"\
      \n   or cert_sha256 != known_good_cert[app.package]\n| set severity = \"high\"\n| action alert(\"\
      repackaged client binary\", device_id, app.package)"
- question: For high-assurance devices, does the hardware-backed Key/ID attestation certificate chain
    show verifiedBootState != Verified (GREEN) or deviceLocked = false in its signed attestation extension?
  context: Because the attestation extension is signed inside secure hardware by a Google-rooted CA, a
    rooted OS cannot forge a clean verdict—this provides non-spoofable corroboration of a modified system
    partition that software-only checks may miss. For the Persistence tactic, this is the highest-assurance
    confirmation that the device boot state has been tampered with, which is the substrate for a compromised
    binary. Request the certificate chain, parse the signed extension, and alert critical when the boot
    state is not GREEN/Verified or the device is unlocked. A positive result is authoritative; treat the
    device as compromised.
  answer_sources:
  - Mobile Device Management (MDM) logs
  - Google Play Integrity API logs
  - Samsung Knox Attestation logs
  - Zeek conn.log
  - Zeek ssl.log
  - Android Verified Boot / dm-verity reports
  - Hardware Keystore attestation certificates
  - File integrity monitoring (system binary hashes)
  - 'NAI: Managed mobile device fleet, Mobile Device Management (MDM) Platform, cloud-based attestation
    service endpoints (e.g., Google Cloud Platform, Samsung Knox services), and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'keystore_attestation

      | parse signed_extension -> verifiedBootState, deviceLocked

      | where verifiedBootState != "Verified" or deviceLocked == false

      | set severity = "critical"

      | action alert("non-spoofable modified boot state", device_id)'
- question: Where on-device EMM/MTD agents can read it, do the Android Verified Boot / dm-verity state
    or the SHA-256 hashes of monitored system and client binaries deviate from a per-model, per-OS-build
    known-good baseline?
  context: This applies a known-good cryptographic-hash integrity floor (Copilot) and the deterministic
    app-vetting criteria of NIST SP 800-163r1 to catch binaries that have been overwritten or that write
    to protected/system paths. For Persistence, a RED/ORANGE boot state or any hash deviation in a monitored
    binary is direct evidence the genuine binary was replaced. Compare against a precise per-model, per-OS-build
    baseline to avoid false positives from legitimate updates; alert critical on any mismatch. A positive
    result identifies exactly which binary was tampered with for triage.
  answer_sources:
  - Mobile Device Management (MDM) logs
  - Google Play Integrity API logs
  - Samsung Knox Attestation logs
  - Zeek conn.log
  - Zeek ssl.log
  - Android Verified Boot / dm-verity reports
  - Hardware Keystore attestation certificates
  - File integrity monitoring (system binary hashes)
  - 'NAI: Managed mobile device fleet, Mobile Device Management (MDM) Platform, cloud-based attestation
    service endpoints (e.g., Google Cloud Platform, Samsung Knox services), and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "binary_integrity\n| join known_good on (device_model, os_build, binary_path)\n| where boot_state\
      \ in (\"RED\",\"ORANGE\")\n   or sha256 != known_good.sha256\n| set severity = \"critical\"\n| action\
      \ alert(\"system binary hash deviation\", device_id, binary_path)"
- question: Has any device failed two or more attestation checks within a rolling 24-hour window, particularly
    following a recent OS update or app install event recorded in MDM logs?
  context: Repeated attestation failures distinguish a persistent compromise from a transient, one-off
    glitch. For Persistence, an adversary who has overwritten a binary will keep failing integrity checks
    across reboots and re-checks. Correlate the failure timing with recent OS update or app install events
    from MDM logs—a failure that begins right after such an event points to a malicious update or sideloaded
    package as the tampering vector. Prioritize these devices for investigation.
  answer_sources:
  - Mobile Device Management (MDM) logs
  - Google Play Integrity API logs
  - Samsung Knox Attestation logs
  - Zeek conn.log
  - Zeek ssl.log
  - Android Verified Boot / dm-verity reports
  - Hardware Keystore attestation certificates
  - File integrity monitoring (system binary hashes)
  - 'NAI: Managed mobile device fleet, Mobile Device Management (MDM) Platform, cloud-based attestation
    service endpoints (e.g., Google Cloud Platform, Samsung Knox services), and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'attestation_logs

      | where verdict == "FAIL"

      | bin window = 24h by device_id

      | summarize fails = count() by device_id, window

      | where fails >= 2

      | lookup mdm_events recent_update within 24h

      | action alert("repeated attestation failures", device_id)'
- question: Every 4 hours, does the attestation failure rate (failed checks / total checks) for any device-model,
    OS-version, or region segment exceed the 99th percentile of that segment's 30-day baseline?
  context: Tracking the per-model failure rate as a distinct failure-mode signal per NIST SP 800-124r2
    surfaces targeted or model-specific compromise. For Persistence, a rise in failures concentrated on
    one model or OS build indicates a targeted campaign exploiting that platform rather than transient
    noise spread evenly across the fleet. Segment the failure rate and compare each segment to its own
    30-day baseline; an alert on a segment breaching the 99th percentile lets the analyst scope the affected
    population and hunt for the common compromised binary.
  answer_sources:
  - Mobile Device Management (MDM) logs
  - Google Play Integrity API logs
  - Samsung Knox Attestation logs
  - Zeek conn.log
  - Zeek ssl.log
  - Android Verified Boot / dm-verity reports
  - Hardware Keystore attestation certificates
  - File integrity monitoring (system binary hashes)
  - 'NAI: Managed mobile device fleet, Mobile Device Management (MDM) Platform, cloud-based attestation
    service endpoints (e.g., Google Cloud Platform, Samsung Knox services), and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "attestation_logs\n| bin 4h\n| summarize rate = countif(verdict==\"FAIL\")*1.0/count()\n  \
      \  by device_model, os_version, region\n| join baseline_p99 on (device_model, os_version, region)\n\
      | where rate > baseline_p99\n| action alert(\"segment attestation failure spike\", segment)"
- question: Does an online change-point detector over the hourly fleet attestation-failure-count series
    declare a sustained level shift?
  context: A gradually spreading compromised-binary campaign may never breach a static percentile threshold
    yet still represent a real, sustained increase. An online change-point detector (CUSUM or Bayesian
    online change-point per Aminikhanghahi & Cook) declares a level shift when the failure-count series
    moves to a new sustained baseline, tuning the threshold for an acceptable false-alarm versus detection-delay
    trade-off. For Persistence, a declared shift is an early indicator that a compromised binary is propagating
    across the fleet. Investigate the change-point timestamp for a correlated update or push.
  answer_sources:
  - Mobile Device Management (MDM) logs
  - Google Play Integrity API logs
  - Samsung Knox Attestation logs
  - Zeek conn.log
  - Zeek ssl.log
  - Android Verified Boot / dm-verity reports
  - Hardware Keystore attestation certificates
  - File integrity monitoring (system binary hashes)
  - 'NAI: Managed mobile device fleet, Mobile Device Management (MDM) Platform, cloud-based attestation
    service endpoints (e.g., Google Cloud Platform, Samsung Knox services), and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'attestation_logs

      | bin 1h | summarize fails = count() by hour

      | cusum(fails) or bocpd(fails)

      | where level_shift_declared == true

      | action alert("change point in fleet attestation failures", hour)'
- question: After a high-severity attestation failure, do any network destinations the device contacted
    in the preceding 72 hours score above 0.9 from a classifier over explainable network features?
  context: 'Upon a high-severity attestation failure, a SOAR playbook should query Zeek conn.log, dns.log,
    and ssl.log for the prior 72 hours and score destinations with a gradient-boosting or logistic classifier
    over explainable features: domain entropy and TTL (EXPOSURE), SSL issuer rarity, JA3/JA3S prevalence,
    outbound/inbound byte ratio, and failed-vs-successful connection ratio. For Persistence, this links
    a confirmed tampered device to its likely C2 infrastructure. Escalate to critical when any destination
    score exceeds 0.9, and per the explainability principle the alert MUST list the top-3 contributing
    features so the analyst can validate the verdict.'
  answer_sources:
  - Mobile Device Management (MDM) logs
  - Google Play Integrity API logs
  - Samsung Knox Attestation logs
  - Zeek conn.log
  - Zeek ssl.log
  - Android Verified Boot / dm-verity reports
  - Hardware Keystore attestation certificates
  - File integrity monitoring (system binary hashes)
  - 'NAI: Managed mobile device fleet, Mobile Device Management (MDM) Platform, cloud-based attestation
    service endpoints (e.g., Google Cloud Platform, Samsung Knox services), and network egress points.'
  range: 'Last 90 days; event-centered: 72 hours preceding each attestation failure'
  queries:
  - technology: SOAR/ML pseudocode
    query: "on high_sev_attestation_failure(device_id, t):\n  flows = zeek(conn,dns,ssl).for(device_id).between(t-72h,\
      \ t)\n  feats = [domain_entropy, ttl, ssl_issuer_rarity, ja3_prevalence,\n           out_in_byte_ratio,\
      \ fail_success_ratio]\n  score = gbm.predict(flows, feats)\n  if max(score) > 0.9:\n    escalate(\"\
      critical\", device_id, top3_features(score))"
- question: Does any outbound connection from a mobile device (id.resp_h in Zeek conn.log) or TLS SNI
    (server_name in Zeek ssl.log) match a high-fidelity threat-intelligence feed of known C2 infrastructure?
  context: A compromised client binary frequently beacons to attacker-controlled command-and-control servers.
    Although T1645 is a Persistence technique, the resulting C2 traffic is observable at egress. Continuously
    match conn.log destination IPs and ssl.log SNI values against a curated, high-fidelity C2 threat-intel
    feed and generate a high-severity alert on any match. A positive match is strong evidence the device
    hosts a compromised binary; pivot on the device to correlate with attestation and crash signals.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi network gateways, VPN terminators, and Cloud Access Security Brokers (CASB).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'conn.log id.resp_h IN ti_c2_feed

      OR ssl.log server_name IN ti_c2_feed

      => alert(severity="high", device_id, dest)'
- question: Does any device issue a DNS query whose domain Shannon entropy exceeds the 98th percentile
    of the fleet's 30-day baseline (or an absolute value > 4.5), or sustain an outbound-to-inbound byte
    ratio greater than 10:1 on connections lasting over 60 seconds?
  context: High domain entropy is characteristic of Domain Generation Algorithms (DGA) used by malware
    to locate rotating C2, and a lopsided outbound:inbound byte ratio on long connections indicates data
    exfiltration. For a compromised binary established for Persistence, both are observable consequences.
    Calculate Shannon entropy per queried domain in dns.log and alert above the fleet 98th percentile
    or an absolute 4.5; separately monitor orig_bytes vs resp_bytes in conn.log and alert when the ratio
    exceeds 10:1 with duration over 60 seconds. Positive results warrant device isolation and forensic
    review.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi network gateways, VPN terminators, and Cloud Access Security Brokers (CASB).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "dns.log: e = shannon_entropy(query)\n  if e > max(p98_fleet_30d, 4.5): alert(device_id, query,\
      \ e)\nconn.log: if orig_bytes/resp_bytes > 10 and duration > 60s:\n  alert(device_id, conn)"
- question: When a device contacts a new external domain, does that domain score as malicious under the
    EXPOSURE passive-DNS feature set?
  context: Score each new external domain a device contacts using EXPOSURE's passive-DNS features—domain
    age/short-lived behavior, low or changing TTL, number of distinct resolved IPs and countries, and
    lexical n-gram entropy / numeric fraction—derived from first-party Zeek dns.log. For a compromised
    binary, freshly registered or fast-fluxing domains are common C2 hallmarks. Alert on domains classified
    malicious and surface the contributing features so the analyst can judge the verdict. A positive result
    should be correlated with the device's attestation and crash posture.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi network gateways, VPN terminators, and Cloud Access Security Brokers (CASB).'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: "for new_domain in dns.log per device:\n  feats = [domain_age, ttl_variability, num_ips, num_countries,\n\
      \           ngram_entropy, numeric_fraction]\n  if exposure_classifier(feats) == \"malicious\":\n\
      \    alert(device_id, domain, contributing_features)"
- question: Does the ratio of failed (Zeek conn_state S0/REJ/RSTO/RSTR) to successful (SF) connections
    for any device exceed the 99th percentile of that device's 30-day baseline?
  context: Elevated connection failures are a distinct failure-mode signal of a compromised binary attempting
    to reach dead or rotating C2 infrastructure that no longer responds. Maintain a per-device 30-day
    baseline of the failed:successful connection-state ratio and alert when a device breaches its own
    99th percentile. For Persistence, a binary phoning home to stale C2 will generate a burst of S0/REJ/RSTO/RSTR
    states. Because the baseline is per-device, this adapts to each device's normal behavior and reduces
    false positives.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi network gateways, VPN terminators, and Cloud Access Security Brokers (CASB).'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: "conn.log per device:\n  r = count(conn_state in [S0,REJ,RSTO,RSTR]) / count(conn_state==SF)\n\
      \  if r > device_baseline_p99[device]: alert(device_id, r)"
- question: Does any device exceed the 99th percentile of its own 30-day duration-to-byte-ratio baseline
    for connections longer than 60 seconds?
  context: Disproportionate egress relative to connection duration indicates abnormal data transfer that
    may represent exfiltration by a compromised binary. Maintain a 30-day per-device baseline of duration-to-byte
    ratios and alert when a device exceeds its own 99th percentile on connections lasting over 60 seconds.
    The per-device baseline makes the detector sensitive to changes in an individual device's behavior—a
    hallmark of newly introduced malicious code—while tolerating fleet-wide diversity.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi network gateways, VPN terminators, and Cloud Access Security Brokers (CASB).'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: "conn.log per device where duration > 60s:\n  ratio = duration / (orig_bytes + resp_bytes)\n\
      \  if ratio > device_baseline_p99[device]: alert(device_id, conn)"
- question: Does an isolation-forest / one-class model trained on 30 days of benign network features flag
    a device's daily activity as an outlier?
  context: Train a per-device isolation forest or one-class model on 30 days of benign network features—daily
    outbound volume, count of unique destination IPs, destination-port distribution, byte ratios, and
    average connection duration from conn.log (flow-feature selection per CorrNetDroid and the CICAndMal2017
    feature set). Score daily activity and raise a medium-severity alert on outliers. For Persistence,
    a compromised binary alters a device's normal traffic profile in ways no single rule captures. The
    alert MUST list the top-3 contributing features so the analyst can interpret why the day was anomalous.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi network gateways, VPN terminators, and Cloud Access Security Brokers (CASB).'
  range: Last 90 days; model trained on a 30-day benign window
  queries:
  - technology: ML pseudocode
    query: "model = IsolationForest.fit(device.features.last_30d_benign)\nfeatures = [daily_out_volume,\
      \ unique_dst_ips, dst_port_dist,\n            byte_ratio, avg_duration]\nscore = model.score(device.today)\n\
      if score == outlier:\n  alert(\"medium\", device_id, top3_features(score))"
- question: Does any managed app's encrypted-flow traffic match no known per-app network fingerprint built
    with FlowPrint?
  context: Build unsupervised per-app network fingerprints from encrypted flow metadata—destination clusters,
    TLS certificates, and temporal flow correlation—using FlowPrint, requiring no payload decryption.
    When a managed app's traffic matches no known fingerprint for that app, its network behavior has deviated
    from the legitimate app, which is exactly what a repackaged or compromised client binary produces.
    For Persistence, this directly ties anomalous traffic to a specific tampered app. A positive result
    should be corroborated with the app's Play Integrity appIntegrity verdict.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Corporate Wi-Fi network gateways, VPN terminators, and Cloud Access Security Brokers (CASB).'
  range: Last 90 days
  queries:
  - technology: ML pseudocode
    query: "fingerprints = FlowPrint.train(encrypted_flow_metadata per app)\nfor flow in managed_app_traffic:\n\
      \  if FlowPrint.match(flow, fingerprints[app]) == none:\n    alert(\"compromised client binary suspected\"\
      , device_id, app)"
- question: Was any crash reported for a critical allow-listed system application (for example com.android.settings
    or com.android.phone) on a managed device?
  context: Critical system applications are engineered for extreme stability, so any crash is itself anomalous
    and may indicate that the application's binary was modified. For Persistence, an adversary who overwrote
    a high-privilege system binary can introduce instability that surfaces as crashes. Maintain an allow-list
    of critical packages and fire a high-severity alert on any reported crash. A positive result should
    be correlated with the device's attestation state and recent update history to confirm tampering versus
    a genuine software defect.
  answer_sources:
  - Mobile Device Management (MDM) logs
  - Mobile Application Management (MAM) logs
  - Application crash reporting logs
  - System audit/provenance logs (process-file writes)
  - 'NAI: Centralized MDM/MAM platform and cloud-based application performance monitoring (APM) or crash
    reporting services.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'crash_logs

      | where app.package in (critical_system_allowlist)

      | set severity = "high"

      | action alert("critical system app crash", device_id, app.package)'
- question: Did any managed app crash three or more times within a 10-minute window on a single device,
    especially within 24 hours of an app update or OS patch reported by MDM?
  context: A crash loop—three or more crashes in 10 minutes—signals an unstable binary, and clustering
    shortly after an update points to a malicious or tampered package as the cause. For Persistence, a
    compromised binary delivered via an update commonly destabilizes the app it replaced. Correlate the
    crash burst with MDM-reported app-update or OS-patch events within the preceding 24 hours; a positive
    correlation strongly implicates the update as the tampering vector and should drive containment.
  answer_sources:
  - Mobile Device Management (MDM) logs
  - Mobile Application Management (MAM) logs
  - Application crash reporting logs
  - System audit/provenance logs (process-file writes)
  - 'NAI: Centralized MDM/MAM platform and cloud-based application performance monitoring (APM) or crash
    reporting services.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'crash_logs

      | bin window = 10m by device_id, app.package

      | summarize crashes = count() by device_id, app.package, window

      | where crashes >= 3

      | lookup mdm_events update within 24h

      | action alert("crash loop after update", device_id, app.package)'
- question: Does any device's daily crash rate (crashes per 1000 sessions) for a managed application,
    segmented by app version and device model, exceed the 99.5th percentile of the fleet's 30-day baseline
    for the same app/version?
  context: Baselining crash rate per app version and device model isolates instability attributable to
    a specific tampered binary from normal background crashiness. For Persistence, a device running a
    compromised version will crash far more than peers running the genuine version on the same model.
    Compute crashes per 1000 sessions daily and alert when a device breaches the fleet 99.5th percentile
    for its app/version segment. A positive result narrows the hunt to a specific binary on a specific
    device.
  answer_sources:
  - Mobile Device Management (MDM) logs
  - Mobile Application Management (MAM) logs
  - Application crash reporting logs
  - System audit/provenance logs (process-file writes)
  - 'NAI: Centralized MDM/MAM platform and cloud-based application performance monitoring (APM) or crash
    reporting services.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "crash_logs\n| summarize rate = crashes*1000.0/sessions\n    by device_id, app.package, app_version,\
      \ device_model, day\n| join fleet_p995 on (app.package, app_version, device_model)\n| where rate\
      \ > fleet_p995\n| action alert(\"crash rate anomaly\", device_id, app.package)"
- question: Does a change-point detector applied to the per-app daily crash-count and per-device resource-usage
    series declare a level shift correlated with a recent binary or OS update?
  context: Apply a change-point detector (CUSUM/PELT/Bayesian online per Aminikhanghahi & Cook) to per-app
    daily crash-count series and per-device resource-usage series—Andromaly showed process-count, CPU,
    and network features shift under malicious modification. For Persistence, a tampered binary introduces
    a sustained shift in stability and resource consumption rather than a momentary spike. Alert on a
    declared level shift correlated with a recent binary or OS update; the change-point timestamp helps
    the analyst pinpoint the introducing event.
  answer_sources:
  - Mobile Device Management (MDM) logs
  - Mobile Application Management (MAM) logs
  - Application crash reporting logs
  - System audit/provenance logs (process-file writes)
  - 'NAI: Centralized MDM/MAM platform and cloud-based application performance monitoring (APM) or crash
    reporting services.'
  range: Last 90 days
