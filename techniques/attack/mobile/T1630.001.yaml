questions:
- question: Is a mobile device communicating with a known command-and-control (C2) server, or exhibiting
    beacon-like periodicity to any external destination, that could later be torn down by a self-uninstalling
    malicious application?
  context: 'Defense Evasion via self-uninstall typically follows an active C2 relationship: malware beacons
    home, receives a cleanup command, then removes itself. To catch the precursor, join Zeek conn.log
    against a threat-intel feed of known C2 servers and alert when a mobile device IP (id.orig_h) talks
    to a listed id.resp_h or queries a listed domain in dns.log. Because external TI is incomplete, layer
    first-party BAYWATCH-style heuristics: flag any device->external destination tuple whose connection-interval
    autocorrelation / coefficient of variation qualifies it as a beacon regardless of reputation. A positive
    result establishes the baseline beacon whose later disappearance becomes the high-value evasion signal.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Mobile Device Management (MDM) Device Status Logs
  - Mobile EDR Network Telemetry
  - 'NAI: Centralized SIEM/log aggregator, corporate Wi-Fi access points, VPN concentrators, and DNS resolvers
    servicing mobile devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  SELECT c.id.orig_h, c.id.resp_h FROM zeek_conn c\n  JOIN threat_intel ti ON c.id.resp_h\
      \ = ti.indicator\n  WHERE c.id.orig_h IN mobile_device_subnet\n  UNION\n  SELECT d.query FROM zeek_dns\
      \ d JOIN threat_intel ti ON d.query = ti.domain\n  -> alert 'Mobile C2 contact'"
  - technology: SIEM/Stats pseudocode
    query: ">-\n  GROUP conn BY id.orig_h, id.resp_h OVER 24h\n  COMPUTE interval_autocorr, CV(interval)\n\
      \  WHERE id.orig_h IN mobile_device_subnet AND CV(interval) < 0.2\n  -> label tuple as BEACON (BAYWATCH\
      \ first-party, no TI required)"
- question: When a mobile device's beacon stops, do the final connection states show an orderly successful
    finish (self-removal) rather than a rising burst of failed or reset connections (network loss or blocking)?
  context: 'Distinguishing true self-uninstall cessation from mere connectivity loss is the crux of this
    technique. Using sequential-hypothesis-testing logic, profile failure/error outcomes as a distinct
    signal: in Zeek conn.log track per-device counts of conn_state S0/REJ/RSTO and dns.log NXDOMAIN. A
    final burst of successful (SF) connections immediately followed by ZERO connections indicates orderly
    self-removal (the app phoned home one last time then deleted itself), whereas a spike in failed/blocked/NXDOMAIN
    attempts before silence indicates network loss or sinkholing. This failure-state profile lets the
    analyst attribute the silence correctly and avoid false positives from devices that simply went offline.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Mobile Device Management (MDM) Device Status Logs
  - Mobile EDR Network Telemetry
  - 'NAI: Centralized SIEM/log aggregator, corporate Wi-Fi access points, VPN concentrators, and DNS resolvers
    servicing mobile devices.'
  range: Last 90 days; center analysis on the last observed beacon timestamp
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  FOR each device id.orig_h:\n    window = last 60m of activity before silence\n    succ\
      \ = count(conn_state == 'SF')\n    fail = count(conn_state IN ['S0','REJ','RSTO']) + count(dns rcode\
      \ == NXDOMAIN)\n  IF succ_burst THEN silence AND fail ~ 0 -> 'Orderly self-removal'\n  ELSE IF fail\
      \ rising before silence -> 'Connectivity loss / blocked'"
- question: Has a mobile device's regular beacon gone silent for longer than its own historical baseline
    interval, with no corresponding device-offline event in MDM logs?
  context: This statistical detection identifies the disappearance step of the self-uninstall chain. For
    each source-destination IP pair in Zeek conn.log, compute the coefficient of variation (CV) of connection
    interval and orig_bytes over 24h to identify beacons (CV < 0.2). For each beacon compute the mean
    and standard deviation of inter-arrival time and the byte ratio; alert if time since the last beacon
    exceeds mean + 3 standard deviations AND no device-offline event exists in MDM logs for that timeframe.
    Derive per-device thresholds from a 14-30 day history and tune the CV cutoff and sigma multiplier
    to local jitter (e.g., using labeled flows from CICAndMal2017). A positive result is a beacon that
    vanished while the device is still managed/online - a strong evasion indicator.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Mobile Device Management (MDM) Device Status Logs
  - Mobile EDR Network Telemetry
  - 'NAI: Centralized SIEM/log aggregator, corporate Wi-Fi access points, VPN concentrators, and DNS resolvers
    servicing mobile devices.'
  range: Last 90 days; per-device baseline of 14-30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  FOR each (id.orig_h,id.resp_h) beacon WHERE CV(interval)<0.2 AND CV(orig_bytes)<0.2:\n\
      \    mu, sd = mean,std of inter_arrival over 14-30d\n    IF (now - last_beacon) > mu + 3*sd\n  \
      \     AND NOT exists(MDM offline_event for device in window)\n    -> alert 'Beacon cessation beyond\
      \ baseline'"
- question: Does online change-point detection on a mobile device's heartbeat time series show a sustained
    level shift to zero, preceded by a short volume spike, indicating a controlled shutdown of the implant?
  context: Mobile traffic is non-stationary, so a fixed mean+3-sigma rule produces noise. Run online change-point
    detection (CUSUM or Bayesian online CPD) on each device's per-minute connection-count and byte-volume
    series. A sustained level shift to zero that persists beyond three expected beacon intervals, preceded
    by a short volume spike (the final cleanup/exfil burst), is a high-confidence cessation event. Surface
    the change-point timestamp and pre/post means in the alert so the analyst can pivot to host telemetry
    around that exact moment. This method handles bursty/jittery mobile patterns better than static thresholds
    and pinpoints WHEN the self-removal likely occurred.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Mobile Device Management (MDM) Device Status Logs
  - Mobile EDR Network Telemetry
  - 'NAI: Centralized SIEM/log aggregator, corporate Wi-Fi access points, VPN concentrators, and DNS resolvers
    servicing mobile devices.'
  range: Last 90 days; per-minute resolution series
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  series = per_minute(conn_count, byte_volume) per device\n  cp = CUSUM_or_BOCPD(series)\n\
      \  IF cp implies level_shift_to_zero sustained > 3*beacon_interval\n     AND preceded_by short volume_spike\n\
      \  -> alert 'Heartbeat cessation' WITH cp_timestamp, pre_mean, post_mean"
- question: Does a time-series forecast model predict continued beaconing for a mobile device while observed
    activity has dropped to zero outside the prediction interval, flagging an anomalous beacon cessation?
  context: This machine-learning approach forecasts expected beacon behavior and flags deviation. Deploy
    a time-series anomaly model (Prophet or LSTM) trained on historical orig_bytes, byte ratio, and connection
    frequency from Zeek conn.log per device beacon, establishing a forecast prediction interval. Generate
    a 'Beacon Cessation' alert when observed activity drops to zero outside the 99.9% prediction interval
    for >=3 expected intervals. Emit the top-3 contributing features (e.g., dropped connection frequency,
    collapsed outbound byte volume, preceding burst magnitude) in the alert text for explainability. A
    positive result means the model expected the implant to keep talking but it went silent - consistent
    with deliberate self-uninstall rather than normal lulls the model already learned.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Mobile Device Management (MDM) Device Status Logs
  - Mobile EDR Network Telemetry
  - 'NAI: Centralized SIEM/log aggregator, corporate Wi-Fi access points, VPN concentrators, and DNS resolvers
    servicing mobile devices.'
  range: Last 90 days for inference; train on >=30 days of history
  queries:
  - technology: ML/pseudocode
    query: ">-\n  model = Prophet_or_LSTM.fit(history[orig_bytes,byte_ratio,conn_freq] per beacon)\n \
      \ pi = model.predict_interval(0.999)\n  IF observed == 0 outside pi for >=3 expected_intervals:\n\
      \    alert 'Beacon Cessation' WITH top3_shap_features"
- question: Did an ApplicationUninstalled event occur on a managed device without a matching approved
    ITSM change request for that device and application in the preceding 24 hours?
  context: Legitimate enterprise app removals flow through a managed change/approval workflow (per NIST
    SP 800-124r2), so an uninstall with no corresponding approval is anomalous by policy and a hallmark
    of malware self-removal. On event_type='ApplicationUninstalled' in MDM logs, perform an automated
    lookup against the ITSM system; if no approved change request exists for the device_id + application_name
    within 24h, raise 'Unauthorized Uninstall'. This is a deterministic, low-false-positive rule that
    converts the absence of governance into a detection. A positive result demands triage of how the app
    removed itself and whether C2 fell silent around the same time.
  answer_sources:
  - MDM Platform Audit Logs
  - IT Service Management (ITSM) System Logs
  - Mobile EDR OS API / File Deletion Telemetry
  - 'NAI: Cloud or on-premise servers hosting the MDM and ITSM platforms, and the centralized SIEM where
    their logs are aggregated.'
  range: Last 90 days; 24-hour ITSM correlation window per event
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  ON mdm.event_type == 'ApplicationUninstalled':\n    appr = lookup(itsm, device_id, application_name,\
      \ within=24h, status='approved')\n    IF appr IS NULL -> alert 'Unauthorized Uninstall' (device_id,\
      \ application_name)"
- question: Immediately before an uninstall or file-deletion event, did the application hold a removal-capable
    privileged control path (device-owner / DELEGATION_PACKAGE_ACCESS, accessibility-service binding,
    or rooted/non-compliant posture)?
  context: 'This deterministic correlation reconstructs the causal chain that defines T1630.001. Flag
    when an app HOLDS a removal-capable control path immediately before the uninstall/file-deletion event:
    device-owner or delegated DELEGATION_PACKAGE_ACCESS authority, accessibility-service binding, or rooted/non-compliant
    posture (from MDM Application Permission / posture logs), followed by a PackageManager.deletePackage
    / Intent.ACTION_DELETE or privileged file-removal call (Mobile EDR OS API / File Deletion telemetry).
    Accessibility auto-confirmation of the system uninstall dialog and device-admin/deletePackage usage
    are documented dangerous behaviors. Observing privilege-then-removal in order strongly indicates a
    programmatic self-uninstall rather than a user tapping uninstall in Settings.'
  answer_sources:
  - MDM Platform Audit Logs
  - IT Service Management (ITSM) System Logs
  - Mobile EDR OS API / File Deletion Telemetry
  - 'NAI: Cloud or on-premise servers hosting the MDM and ITSM platforms, and the centralized SIEM where
    their logs are aggregated.'
  range: Last 90 days; correlate privilege-grant and removal within a short window
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  priv = mdm.permission IN ['DEVICE_OWNER','DELEGATION_PACKAGE_ACCESS','BIND_ACCESSIBILITY_SERVICE']\n\
      \         OR posture IN ['rooted','non_compliant']\n  rem  = edr.api IN ['PackageManager.deletePackage','Intent.ACTION_DELETE']\n\
      \         OR edr.file_delete(package_files)\n  IF priv(app) PRECEDES rem(app) within window\n  ->\
      \ alert 'Privileged self-removal control path'"
- question: Do any deployed or candidate applications combine device-admin/management authority with package-deletion
    and accessibility permissions - the high-risk permission set over-represented in malware?
  context: 'Pre-deployment and at runtime, deny or flag apps whose manifest combines device-admin/management
    authority with REQUEST_DELETE_PACKAGES / DELETE_PACKAGES and BIND_ACCESSIBILITY_SERVICE. This significant-permission
    combination is statistically over-represented in malware (per SigPID) and produces high-weight explainable
    indicators (per Drebin). The combination is precisely what an app needs to silently uninstall itself:
    management authority or root to act, deletion permission to remove the package, and accessibility
    to auto-click the confirmation dialog. Flagging this set is a proactive control that reduces the attack
    surface before any uninstall occurs; a hit warrants app-vetting review even absent runtime evidence.'
  answer_sources:
  - MDM Platform Audit Logs
  - IT Service Management (ITSM) System Logs
  - Mobile EDR OS API / File Deletion Telemetry
  - 'NAI: Cloud or on-premise servers hosting the MDM and ITSM platforms, and the centralized SIEM where
    their logs are aggregated.'
  range: Last 90 days; also evaluate at app-onboarding time
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  FOR each app manifest:\n    IF perms SUPERSET {DEVICE_ADMIN/management,\n          \
      \             (REQUEST_DELETE_PACKAGES OR DELETE_PACKAGES),\n                       BIND_ACCESSIBILITY_SERVICE}\n\
      \    -> flag 'High-risk self-uninstall permission set'"
- question: Has a device (or the fleet) experienced a statistically abnormal spike in unauthorized-uninstall
    alerts, suggesting targeted or coordinated campaign cleanup?
  context: Track per-device daily counts of 'Unauthorized Uninstall' alerts; compute a 30-day rolling
    mean and standard deviation and raise 'Suspicious Uninstall Activity' when the daily count exceeds
    baseline by 3 standard deviations (Z-score > 3). Also baseline fleet-wide counts to catch coordinated
    mass self-removal indicative of campaign cleanup, where an operator burns many implants at once after
    an operation concludes. Derive thresholds per device class. A per-device spike points to a compromised
    device churning through implants; a fleet-wide spike is a strong signal of an adversary mass-retiring
    tooling to evade discovery.
  answer_sources:
  - MDM Platform Audit Logs
  - IT Service Management (ITSM) System Logs
  - Mobile EDR OS API / File Deletion Telemetry
  - 'NAI: Cloud or on-premise servers hosting the MDM and ITSM platforms, and the centralized SIEM where
    their logs are aggregated.'
  range: Last 90 days; 30-day rolling baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  daily = count('Unauthorized Uninstall') per device per day\n  mu,sd = rolling_mean_std(daily,\
      \ 30d)\n  IF (today - mu)/sd > 3 -> alert 'Suspicious Uninstall Activity (device)'\n  fleet = sum(daily)\
      \ ; IF zscore(fleet) > 3 -> alert 'Coordinated mass self-removal'"
- question: Does on-device telemetry show the behavioral signature of self-removal - a short final burst
    of file-delete, process, and network activity followed by the monitored app process disappearing from
    the running-process inventory?
  context: 'Model the on-device behavioral signature of a self-uninstall as a change-point in resource/process
    telemetry (per Andromaly): a short final burst of file-delete, process, and network activity followed
    by the monitored app process disappearing from the running-process inventory. Alert when this ordered
    burst-then-disappearance pattern deviates from the device''s learned baseline. This catches the act
    of removal directly on the endpoint, independent of network or MDM evidence, and confirms that an
    app didn''t just stop beaconing but actually ceased to exist. A positive result, especially aligned
    in time with beacon cessation, is high-confidence evidence of T1630.001.'
  answer_sources:
  - MDM Platform Audit Logs
  - IT Service Management (ITSM) System Logs
  - Mobile EDR OS API / File Deletion Telemetry
  - 'NAI: Cloud or on-premise servers hosting the MDM and ITSM platforms, and the centralized SIEM where
    their logs are aggregated.'
  range: Last 90 days; per-device behavioral baseline
  queries:
  - technology: MobileEDR/Stats pseudocode
    query: ">-\n  baseline = learn(file_delete_rate, proc_events, net_events) per app per device\n  IF\
      \ detect burst(file_delete + proc + net) THEN app_proc removed from process_inventory\n     AND\
      \ pattern deviates from baseline\n  -> alert 'Self-removal behavioral signature'"
- question: Does a supervised classifier rate an uninstall event as malicious with high probability based
    on app category, install source, install age, time-of-day, permissions held, and any preceding privilege
    grant?
  context: 'Train a supervised classifier (Random Forest) on historical uninstall events labeled authorized/unauthorized
    via ITSM correlation. Features: application category, install source (App Store vs sideloaded), time
    since install, time of day, permissions held (device-admin/deletePackage/accessibility), and presence
    of a preceding privilege-grant event. Escalate to ''High-Confidence Malicious Uninstall'' when predicted
    probability > 0.95, and emit the top-3 SHAP/LIME features in the alert for explainability. This synthesizes
    weak signals (e.g., a recently sideloaded app with deletion+accessibility permissions uninstalling
    at 3am) into a calibrated score, helping the analyst prioritize the most suspicious removals among
    many benign ones.'
  answer_sources:
  - MDM Platform Audit Logs
  - IT Service Management (ITSM) System Logs
  - Mobile EDR OS API / File Deletion Telemetry
  - 'NAI: Cloud or on-premise servers hosting the MDM and ITSM platforms, and the centralized SIEM where
    their logs are aggregated.'
  range: Last 90 days for scoring; train on labeled history
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = [app_category, install_source, time_since_install, time_of_day,\n       perms_held,\
      \ preceding_privilege_grant]\n  model = RandomForest.fit(history, label=authorized/unauthorized\
      \ via ITSM)\n  IF model.predict_proba(event) > 0.95\n  -> alert 'High-Confidence Malicious Uninstall'\
      \ WITH top3_shap"
- question: Did a mobile rooting-toolkit IOC hit on a device get followed within 60 minutes by cessation
    of that device's known C2 beacon?
  context: 'This SIEM correlation rule ties privilege escalation to evasion: it triggers when a rooting-toolkit
    IOC alert (from an integrated threat feed) for a mobile device is followed within 60 minutes by a
    ''Beacon Cessation'' alert for the same device_id / id.orig_h. Add a first-party variant requiring
    privileged file-removal or deletePackage telemetry (Mobile EDR) between the two events, so detection
    does not depend solely on external TI. The logic mirrors the kill chain: gain root, then remove the
    implant and go dark. A positive result is a tightly time-bound sequence that is very unlikely to be
    coincidental and warrants immediate device isolation and forensics.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Threat Intelligence Platform Feeds
  - Mobile EDR OS API / File Deletion Telemetry
  - 'NAI: Network egress points, corporate DNS resolvers, and the Threat Intelligence Platform (TIP) integrated
    with the SIEM.'
  range: Last 90 days; 60-minute correlation window
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  IF rooting_toolkit_IOC(device) THEN 'Beacon Cessation'(device) within 60m\n  -> alert\
      \ 'Rooting->Cessation'\n  first_party: REQUIRE edr.deletePackage OR privileged_file_remove(device)\n\
      \               BETWEEN the two events"
- question: When ordered suspicious outcomes (rooting/IOC hit, blocked/failed connections, beacon loss)
    accumulate on a device, does a sequential probability ratio test cross the threshold to escalate the
    case to Critical?
  context: Replace fixed percentile cutoffs with Wald's Sequential Probability Ratio Test (SPRT) over
    per-device event outcomes. Accumulate evidence from ordered suspicious outcomes (rooting/IOC hit,
    blocked/failed connections, beacon loss) and escalate to 'Critical' when the log-likelihood ratio
    crosses the upper bound set for target false-positive/false-negative rates. This gives an error-bounded,
    tunable rapid-escalation decision and explicitly weights failure-state events, so a device steadily
    exhibiting the self-uninstall pattern is escalated with statistical guarantees rather than an arbitrary
    count. It avoids both premature alerting on a single weak signal and slow response when evidence is
    mounting.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Threat Intelligence Platform Feeds
  - Mobile EDR OS API / File Deletion Telemetry
  - 'NAI: Network egress points, corporate DNS resolvers, and the Threat Intelligence Platform (TIP) integrated
    with the SIEM.'
  range: Last 90 days; sequential per-device accumulation
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per device: for each outcome in [rooting_IOC, failed_conn, beacon_loss]:\n    LLR +=\
      \ log( P(outcome|malicious) / P(outcome|benign) )\n    IF LLR >= upper_bound(alpha,beta) -> escalate\
      \ 'Critical'\n    IF LLR <= lower_bound -> close as benign"
- question: Does a hidden Markov model over a device's alert stream indicate a high-probability malicious
    transition from a rooting IOC alert to a beacon-cessation alert?
  context: Implement a Hidden Markov Model over per-device alert streams defining a 'Malicious Uninstall'
    transition (Rooting_IOC_Alert -> Beacon_Cessation_Alert); train on historical alert data and raise
    'High-Confidence Malicious Uninstall Chain' when the transition probability exceeds 0.90. The behavioral-sequence
    abstraction (acquire-privilege -> uninstall -> delete) follows Markov-chain modeling of app behavior
    (MaMaDroid). This treats the order and likelihood of alert transitions as the signal, distinguishing
    a meaningful malicious sequence from unrelated alerts that happen to co-occur. A positive result indicates
    the device followed the learned self-uninstall trajectory.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Threat Intelligence Platform Feeds
  - Mobile EDR OS API / File Deletion Telemetry
  - 'NAI: Network egress points, corporate DNS resolvers, and the Threat Intelligence Platform (TIP) integrated
    with the SIEM.'
  range: Last 90 days; train on historical alert sequences
  queries:
  - technology: ML/pseudocode
    query: ">-\n  hmm = HMM.fit(per_device_alert_streams)\n  define transition T = (Rooting_IOC_Alert\
      \ -> Beacon_Cessation_Alert)\n  IF P(T | device_stream) > 0.90\n  -> alert 'High-Confidence Malicious\
      \ Uninstall Chain'"
- question: Does an LSTM log-sequence model flag a management/EDR audit sequence (e.g., privilege-grant
    -> uninstall -> device-disappearance) as deviating from the learned normal workflow?
  context: Train an LSTM log-sequence anomaly detector (per DeepLog) on normalized MDM/EDR audit-event
    keys; flag sequences such as privilege-grant -> uninstall -> device-disappearance that deviate from
    the learned normal management workflow, and output the offending log-key transition for triage. Use
    dynamic privileged-call observation as confirming runtime evidence (per TaintDroid). This learns what
    normal managed-device administration looks like and surfaces rare, out-of-order sequences characteristic
    of self-uninstall without needing predefined signatures. The emitted offending transition gives the
    analyst a precise pivot point, and runtime privileged-call evidence confirms the behavior was actually
    exercised.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Threat Intelligence Platform Feeds
  - Mobile EDR OS API / File Deletion Telemetry
  - 'NAI: Network egress points, corporate DNS resolvers, and the Threat Intelligence Platform (TIP) integrated
    with the SIEM.'
  range: Last 90 days; train on normal management workflow logs
  queries:
  - technology: ML/pseudocode
    query: ">-\n  seq = normalize(mdm_edr_audit_event_keys) per device\n  model = DeepLog_LSTM.fit(normal_workflow_sequences)\n\
      \  IF next_key NOT IN model.topk_predictions(seq)\n     (e.g., privilege_grant -> uninstall -> device_disappearance)\n\
      \  -> alert 'Anomalous management-log sequence' WITH offending_transition"
