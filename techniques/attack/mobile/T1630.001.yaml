name: 'T1630.001: Uninstall Malicious Application'
id: 256ddc58-a6ba-4574-abdb-9c33bc968bf1
description: 'Investigate whether an adversary is uninstalling or self-removing a malicious application
  from a managed Android mobile device to evade detection and destroy evidence. This playbook helps an
  analyst hunt for the behavioral chain in which an app first acquires a removal-capable control path
  (device-owner / delegated app-management authority, accessibility-service control over the uninstall
  UI, or rooted / non-compliant device posture), then triggers package removal or privileged file deletion,
  and finally disappears from installed-state inventory while the device remains active. Concretely, it
  correlates: (1) the abrupt cessation of a previously stable C2 beacon from a mobile device that is NOT
  explained by a logged power-off or network disconnect; (2) MDM ApplicationUninstalled events that lack
  a matching approved ITSM change ticket; and (3) rooting-toolkit IOC hits followed quickly by beacon
  cessation and privileged removal telemetry. It combines symbolic-logic correlation rules, statistical
  baselining / change-point detection, and machine-learning sequence models so an analyst can distinguish
  orderly self-uninstall from benign connectivity loss or authorized maintenance.'
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
