- question: Does the device's GNSS-reported position contradict an independent positional reference (serving
    cell-ID/tower footprint, Wi-Fi-derived location, or opportunistic signal) beyond tolerance, for example
    more than 1 km from the serving-cell footprint?
  context: 'This is a deterministic spoofing tell that does not trust the GNSS signal itself. For high-value
    devices, validate the GNSS-reported position against an independent positional constraint such as
    the cellular cell-ID/serving-tower location, a Wi-Fi-derived location, or an opportunistic-signal
    reference, and alert when the GNSS position contradicts the reference beyond tolerance (e.g., >1 km
    from the serving-cell footprint). A large mismatch indicates the GNSS solution is being manipulated
    (spoofing) even when the signal looks healthy, whereas agreement within tolerance argues against spoofing.
    Use this alongside jamming tests to separate the two attack modes. This supports the Impact tactic
    objective of identifying when an adversary degrades or blocks availability of mobile communications.
    Methods and detection approach references: [GNSS Spoofing Detection via Opportunistic IRIDIUM Signals](https://arxiv.org/abs/2006.10284).'
