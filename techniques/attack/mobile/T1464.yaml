- question: Are 802.11 association/authentication failures and empty-scan results (Visible SSID Count
    = 0) surging above the NAI's 99th percentile while AP-side client counts simultaneously collapse?
  context: 'Treat failed-association rate and empty scan results as a distinct failure-mode signal that
    separates a jammed RF environment from a control-plane outage. Baseline per NAI and alert when failed-association
    events per minute exceed the NAI 99th percentile while AP client counts collapse together. In a jammed
    environment clients cannot even see or associate with SSIDs (empty scans, failed associations, collapsing
    AP client counts); in a controller/AAA outage clients still see SSIDs but authentication fails. A
    positive result points to RF denial in the NAI rather than an infrastructure service failure. This
    supports the Impact tactic objective of identifying when an adversary degrades or blocks availability
    of mobile communications. Methods and detection approach references: [Bayesian Inference-assisted
    ML for Jamming Detection in 5G NR](https://arxiv.org/abs/2304.13660).'
