- question: Does a supervised classifier (e.g., Gradient Boosting), using affected-device count, RSRP/SINR
    drop magnitude, BLER, time/day, carrier diversity, and a carrier-maintenance flag, label the event
    as malicious jamming with confidence over 0.90?
  context: 'The hardest call is separating malicious jamming from a benign carrier outage, which is what
    this supervised model targets. Features include count of affected devices, median RSRP/SINR drop magnitude,
    BLER, time-of-day, day-of-week, carrier diversity of affected devices, and a binary flag from the
    carrier-maintenance feed. Trigger a critical incident when classified ''malicious'' with confidence
    > 0.90. Complement with sequence models (echo-state network/LSTM) over KPI time series, and consider
    federated training (CAE+FedProx) for fleet privacy. Emit the top-3 contributing features per alert
    for explainability. High carrier diversity among affected devices with no maintenance flag pushes
    strongly toward jamming; a single-carrier event aligned with a maintenance window suggests a benign
    outage. This supports the Impact tactic objective of identifying when an adversary degrades or blocks
    availability of mobile communications. Methods and detection approach references: [Bayesian Inference-assisted
    ML for Jamming Detection in 5G NR](https://arxiv.org/abs/2304.13660); [Anonymous Jamming Detection
    in 5G](https://arxiv.org/abs/2311.17097); [Two-Stage CAE-Based Federated Learning for Jamming Detection
    in 5G](https://arxiv.org/abs/2501.15288); [Convolutional Tsetlin Machine jamming detector](https://arxiv.org/abs/2603.07336).'
