- question: Do GNSS physical-layer observables indicate jamming (C/N0 collapses and tracked-satellite
    count falls below 4, losing fix) or spoofing (C/N0 anomalously high/uniform across satellites while
    position is consistent but wrong)?
  context: 'Physical-layer state distinguishes GPS jamming from spoofing and lets the analyst tag the
    suspected mode. Jamming drives C/N0 down and tracked-satellite count below 4 (loss of fix); spoofing
    presents anomalously high or uniform C/N0 across satellites while the position is internally consistent
    yet wrong. Alert on either signature and label the suspected mode. This separation is critical because
    the response differs: jamming is an availability attack on location, while spoofing is an integrity
    attack that can mislead navigation and asset tracking without obvious signal loss. This supports the
    Impact tactic objective of identifying when an adversary degrades or blocks availability of mobile
    communications. Methods and detection approach references: [Deep Sequence-to-Sequence Models for GNSS
    Spoofing Detection](https://arxiv.org/abs/2510.19890).'
  answer_sources:
