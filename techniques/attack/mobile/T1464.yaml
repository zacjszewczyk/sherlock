      output nai, devices, carriers, owners.'
- question: Where MDM exposes connection KPIs, are failed attach/registration attempts, RACH/random-access
    failures, and BLER spikes surging above the NAI 99th percentile concurrently with falling SINR?
  context: 'A cellular jammer drives failures across the random-access and broadcast channels, so devices
    repeatedly retry — producing a distinct failure-rate signature versus a clean handover. Baseline per
    NAI the rate of failed attach/registration, RACH/random-access failures, and block-error-rate (BLER)
    spikes, and alert when these failure counters surge above the NAI 99th percentile while SINR falls.
    This cross-layer KPI/failure signaling distinguishes deliberate jamming from ordinary mobility. A
    concurrent surge in random-access failures and BLER with declining SINR is a strong indicator of cellular
    RF denial rather than a normal handover or congestion. This supports the Impact tactic objective of
    identifying when an adversary degrades or blocks availability of mobile communications. Methods and
    detection approach references: [Bayesian Inference-assisted ML for Jamming Detection in 5G NR](https://arxiv.org/abs/2304.13660).'
