- question: For a given NAI, does any 5-minute interval's 'No Service' event count exceed the 30-day 99th
    percentile, corroborated by a >25 dBm drop below median RSRP or a >3-sigma SINR drop?
  context: 'This combines volume (event count) with signal-quality state using false-alarm-calibrated
