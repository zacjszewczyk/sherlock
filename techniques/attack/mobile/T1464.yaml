questions:
- question: Did four or more MDM-enrolled devices clustered within roughly 50 meters simultaneously lose
    Wi-Fi and see zero visible SSIDs for at least 60 seconds, with their network sessions ending abruptly
    (no TCP FIN/RST) and NO 802.11 deauthentication/disassociation frames in WLC/AP logs?
  context: 'This is the deterministic floor for detecting localized Wi-Fi jamming versus normal roaming
    or an AP-initiated drop. Graceful disconnects and roams produce 802.11 management-frame teardown (deauth/disassoc)
    and orderly TCP FIN/RST; RF jamming silences the link so traffic ceases with no protocol-state teardown
    — the ''silence where protocol state should exist'' invariant. Correlate MDM Wi-Fi status (Disconnected
    + Visible SSID Count 0) across >3 unique device IDs in a 60s window, confirm their last-known MDM
    coordinates form a <=50 m cluster, query Zeek conn.log for their last IPs to confirm no F/R in history,
    and require absence of deauth/disassoc in WLC/AP logs. A positive result strongly indicates a jammer
    silenced the RF link in a sensitive area; controller/AAA outages instead show clean teardown or auth
    failures. This supports the Impact tactic objective of identifying when an adversary degrades or blocks
    availability of mobile communications. Methods and detection approach references: [Jamming Detection
    With Subcarrier Blanking](https://arxiv.org/abs/2106.07970); [Guide to LTE Security (NIST SP 800-187)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-187.pdf).'
  answer_sources:
  - Zeek conn.log
  - MDM Wi-Fi Status Events
  - MDM Geolocation Data
  - Wireless LAN Controller (WLC) logs
  - Access Point (AP) system logs
  - Out-of-band RF/spectrum sensor (SDR) telemetry
  - 'NAI: Corporate Wi-Fi access points and associated mobile devices in sensitive areas such as executive
    suites, R&D labs, data centers, Sensitive Compartmented Information Facilities (SCIFs), and geofenced
    event spaces like boardrooms or all-hands meeting areas.'
  range: Last 90 days, with event-centered correlation around the suspected denial window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'drops = MDM where wifi_status=''Disconnected'' and visible_ssid_count=0;

      win = group drops by 60s window; alert when distinct(device_id) > 3

      and cluster(last_mdm_coords) within 50m

      and zeek_conn(last_ips).history has no ''F'' and no ''R''

      and WLC_AP_logs has no deauth/disassoc for those clients;

      output devices, coords, nai, last_ips.'
- question: When a clustered Wi-Fi drop occurs in an area covered by an SDR/spectrum sensor, does the
    2.4/5 GHz noise floor or channel busy-time exceed its baseline ceiling at the same time, providing
    physical RF confirmation of jamming?
  context: 'Device-reported fields can be indirectly influenced by a jammer, so independent physical confirmation
    matters. Where an out-of-band SDR/spectrum sensor covers the NAI, raise alert severity when the clustered
    Wi-Fi drop coincides with monitored-band energy (noise floor or channel busy-time) above its baseline
    ceiling. Abnormal RF energy in the band is protocol-independent evidence of a jamming signal rather
    than a network or device fault. A positive result (high RF energy + clustered drop) is near-confirmation
    of jamming; absence of RF energy elevation suggests a non-RF cause such as a controller outage. This
    supports the Impact tactic objective of identifying when an adversary degrades or blocks availability
    of mobile communications. Methods and detection approach references: [RadIoT](https://arxiv.org/abs/1811.03934).'
