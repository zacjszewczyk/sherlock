- question: For a given NAI, did the average Wi-Fi RSSI for five or more co-located devices fall more
    than 3 standard deviations below its 30-day baseline continuously for 90 seconds, indicating a localized
    area-of-effect signal degradation?
  context: 'RSSI collapse across multiple co-located devices is the area-of-effect analogue of a coherence-block
    likelihood-ratio jamming test. Ingest MDM logs to build a 30-day per-device RSSI baseline (rolling
    mean and standard deviation), derive NAI-specific sigma thresholds from quiet-period data, and tune
    the device-count floor to NAI density. Alert at high severity when average RSSI for 5+ devices in
    the NAI drops >3 sigma below baseline for a continuous 90 seconds. A simultaneous multi-device RSSI
    collapse cannot be explained by a single device moving out of range and indicates localized RF interference
    consistent with jamming. This supports the Impact tactic objective of identifying when an adversary
    degrades or blocks availability of mobile communications. Methods and detection approach references:
    [Jamming Detection in Massive MIMO Systems](https://arxiv.org/abs/1711.10218).'
