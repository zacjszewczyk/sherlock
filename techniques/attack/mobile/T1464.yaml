    when the median RSRP across the NAI concurrently drops >25 dBm below its 30-day median (or SINR drops
    >3 sigma). Derive the percentile and dBm thresholds per NAI from quiet-period data. A volume spike
    in service loss accompanied by collapsing signal quality is far more indicative of jamming than a
    benign transient, while a count spike without a signal-quality drop may reflect normal coverage churn.
    This supports the Impact tactic objective of identifying when an adversary degrades or blocks availability
    of mobile communications. Methods and detection approach references: [Jamming Detection With Subcarrier
