name: 'T1464: Network Denial of Service'
id: bea46260-9910-454f-b317-baf21475fddd
description: Investigate suspected Network Denial of Service (DoS) affecting mobile device communications,
  where an adversary degrades or blocks availability by exhausting network bandwidth or jamming the radio
  signals (Wi-Fi, cellular, GPS/GNSS) that devices depend on. This playbook helps an analyst distinguish
  deliberate RF jamming from ordinary weak-signal conditions, coverage transitions, user-initiated airplane
  mode, or carrier/controller outages. It covers clustered Wi-Fi disconnects with ungraceful link teardown
  and missing 802.11 deauth/disassociation frames, out-of-band RF energy anomalies from spectrum sensors,
  failed-association and scan-failure rate surges, RSSI collapse across co-located device clusters, mass
  cellular 'No Service' events with collapsed RSRP/SINR, attach/registration and RACH failure-rate spikes,
  simultaneous loss across GPS/Wi-Fi/cellular on a single high-value device, GNSS position cross-checks
  against independent references to separate jamming from spoofing, and statistical/ML fusion across radios.
  Guidance leans on MDM telemetry, network logs (Zeek), wireless infrastructure logs (WLC/AP), carrier
  feeds, and out-of-band RF/GNSS sensors to confirm a denial-of-service effect on mobile communications.
