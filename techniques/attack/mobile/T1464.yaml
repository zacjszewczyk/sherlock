- question: Do three parallel univariate anomaly models on GPS accuracy, cellular RSRP, and Wi-Fi RSSI
    all report significant anomaly scores within the same 5-minute window for the same device, with a
    GNSS sequence detector and an unsupervised RF autoencoder supporting the finding?
  context: 'Requiring coordinated multi-signal evidence minimizes false positives for broadband jamming.
    Deploy three parallel univariate time-series anomaly models (e.g., Isolation Forest or Prophet) on
    GPS accuracy, cellular RSRP, and Wi-Fi RSSI independently; a meta-alerting layer raises a critical
    incident only when all three report significant anomaly scores within the same 5-minute window for
    the same device. Add an online LSTM/Transformer sequence detector over GNSS observables for spoofing,
    and an unsupervised autoencoder over RF features for unknown-jammer resilience. Surface the top-3
    contributing features (which radio, anomaly magnitude, entropy/cross-check delta) in alert text. Simultaneous
