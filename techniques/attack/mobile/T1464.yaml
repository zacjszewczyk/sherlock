- question: Did a single high-value device, within a 60-second window, simultaneously report GPS degradation
    (horizontal accuracy >100 m OR fewer than 3 satellites), Wi-Fi disconnection with 0 visible SSIDs,
    AND cellular 'No Service'?
  context: 'Simultaneous loss across three independent radios on one device is inconsistent with a single-technology
    coverage fault and matches the broadband jamming end-state. Implement a multi-log SIEM rule keyed
    on a single device ID that alerts when, within 60 seconds: the MDM GPS log shows horizontal_accuracy
    > 100 or visible_satellites < 3; the MDM Wi-Fi log shows status Disconnected and visible_ssid_count
    0; and the MDM Cellular log shows status ''No Service'' — in a location whose historical baseline
    shows stable connectivity and GPS accuracy better than 15 m. Loss across GPS, Wi-Fi, and cellular
    at once is a hallmark of a broadband jammer near a high-value device; loss in only one radio is more
    likely a benign coverage fault. This supports the Impact tactic objective of identifying when an adversary
    degrades or blocks availability of mobile communications. Methods and detection approach references:
    [Guide to LTE Security (NIST SP 800-187)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-187.pdf).'
