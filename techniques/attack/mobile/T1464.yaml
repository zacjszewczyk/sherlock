      alert CRITICAL when s1.anomalous and dense_cluster and ae.error high;

      explain = top3([disconnect_z, cluster_density, rssi_drop]);

      output nai, cluster, explain.'
- question: Did more than five unique MDM-enrolled devices within a single NAI report cellular 'No Service'
    within a 2-minute sliding window, enriched with last-known geolocation, carrier, and owner?
  context: 'Mass ''No Service'' with collapsed signal quality is the documented cellular jamming end-state,
    and this deterministic floor should remain even when ML detectors are deployed. Implement a stateful
    SIEM rule on MDM cellular status logs that triggers high severity when the count of unique devices
    reporting ''No Service'' in one NAI exceeds a hard limit of 5 within a 2-minute window. Enrich each
    alert with last-known geolocation, carrier, and owner so an analyst can assess whether a jammer is
    operating in a sensitive perimeter. Many devices losing service together in one place, especially
    across multiple carriers, is far more consistent with RF jamming than with a single-carrier coverage
    fault. This supports the Impact tactic objective of identifying when an adversary degrades or blocks
    availability of mobile communications. Methods and detection approach references: [Guide to LTE Security
    (NIST SP 800-187)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-187.pdf).'
  answer_sources:
  - MDM Cellular Status Logs
  - MDM Geolocation Data
