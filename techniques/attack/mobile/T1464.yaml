- question: Does a time-series anomaly in per-NAI Wi-Fi disconnect rate, confirmed by a dense geographic
    cluster of disconnecting devices and supported by an unsupervised RF/RSSI autoencoder, indicate Wi-Fi
    jamming?
  context: 'This is the ML escalation path for Wi-Fi jamming. Stage 1 applies time-series anomaly detection
    (e.g., Seasonal-Hybrid ESD) to ''Wi-Fi Disconnect events per minute'' aggregated per NAI. Stage 2,
    if the temporal signal is anomalous, runs DBSCAN on the lat/long of devices that disconnected in the
    window (e.g., min_samples=4, eps≈0.0005 ≈ 50 m); escalate to critical only when the temporal anomaly
    is confirmed by a dense geographic cluster. In parallel, run an autoencoder over RF/RSSI features
    as an unsupervised detector resilient to unknown jamming types and poisoned data. Every alert must
    list the top-3 contributing features (disconnect-rate z-score, cluster density, RSSI-drop magnitude)
    for explainability. Coordinated temporal + spatial evidence makes jamming far more likely than coincidental
    disconnects. This supports the Impact tactic objective of identifying when an adversary degrades or
    blocks availability of mobile communications. Methods and detection approach references: [RadIoT](https://arxiv.org/abs/1811.03934);
    [Anonymous Jamming Detection in 5G](https://arxiv.org/abs/2311.17097); [Convolutional Tsetlin Machine
    jamming detector](https://arxiv.org/abs/2603.07336).'
