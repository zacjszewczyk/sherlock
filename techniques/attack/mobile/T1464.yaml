- question: For a high-value device, does live GPS horizontal accuracy exceed 5 sigma from its 30-day
    per-NAI baseline for over 2 consecutive minutes, or does the Shannon entropy of lat/long over a 10-minute
    window spike, or does the position/pseudorange spread across nearby devices collapse?
  context: 'Several statistical tests jointly flag GNSS interference and spoofing. Per high-value device,
    baseline median GPS horizontal accuracy per NAI over 30 days and alert when live accuracy exceeds
    5 sigma for >2 consecutive minutes (degradation/jamming). As a parallel spoofing check, compute the
    Shannon entropy of lat/long pairs over a 10-minute window; a sharp entropy increase (erratic position
    jumps) raises a separate alert. Strengthen with a variance test over the position/pseudorange spread
    of multiple nearby devices — a single spoofer collapses that spatial spread, which a tri-level hypothesis
    test exploits. Each test addresses a different manipulation signature, so corroborating results raise
    confidence that location integrity is under attack. This supports the Impact tactic objective of identifying
    when an adversary degrades or blocks availability of mobile communications. Methods and detection
    approach references: [GNSS Spoofing Detection by Crowdsourcing Double Differential Pseudorange](https://arxiv.org/abs/2404.02432).'
