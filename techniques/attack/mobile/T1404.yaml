name: 'T1404: Exploitation for Privilege Escalation'
id: b2e66687-bc2c-4d06-8512-f8f00b9897a0
description: >-
  Investigate whether an adversary elevated privileges on a managed mobile device (Android or iOS) by
  exploiting a software vulnerability in an application, system service, the OS, or the kernel. This playbook
  helps an analyst hunt for the observable byproducts of exploitation rather than specific CVE signatures:
  abrupt device-integrity changes reported by MDM/UEM (isJailbroken/isRooted toggling true, compliance
  moving to non-compliant), bursts of SELinux avc denials and anomalous domain/UID transitions, creation
  of system/root processes whose lineage traces back to an app sandbox, shell spawning (su/sh) and confused-deputy
  Binder/Intent chains, abnormal privileged-API or syscall frequency and novel call sequences, malicious
  app installs matched against threat intelligence or static APK features, and policy-weakening configuration
  drift (Developer Mode, USB debugging, unknown sources, rogue trusted root certificates or configuration
  profiles). It pairs on-device telemetry with network evidence (Zeek conn/dns/ssl/http/x509) to localize
  the exploitation window, surface precursor scanning and C2, and provide explainable, tactic-specific
  leads for privilege-escalation triage.
type: technique
related:
- tactic_id: TA0029
  tactic_name: Privilege Escalation
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: >-
    Did an MDM/UEM platform record a device-integrity status change (isJailbroken or isRooted flipping
    to true, or complianceStatus going non-compliant with a rooting or integrity-compromise reason code),
    and did on-device SELinux emit a burst of avc denials at roughly the same time?
  context: >-
    A flip in integrity state is one of the strongest single indicators that a privilege-escalation exploit
    succeeded on a mobile device, because it means the platform's mandatory-access-control and code-signing
    guarantees no longer hold. Pair the MDM/UEM event with on-device audit telemetry: under SE Android,
    an exploit that fails leaves a trail of `avc: denied` records, while one that succeeds produces an
    unexpected SELinux domain or UID transition. Treat five or more denials within 60 seconds from a single
    untrusted_app UID, or any unexpected domain/UID transition, as a high-confidence corroborator. A positive
    result (integrity flip plus denial burst or a new domain) should trigger a critical alert and device
    isolation; a negative result helps rule out exploitation versus a benign compliance hiccup.
  answer_sources:
  - MDM/UEM compliance logs
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: MDM/UEM management servers, cloud management console, managed mobile devices (corporate and
    BYOD), enterprise network gateways, VPN concentrators, and DNS resolvers.'
  range: Last 90 days, with event-centered correlation in a +/-60 minute window around the integrity change.
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      alert when mdm.isJailbroken:false->true OR mdm.isRooted:false->true OR mdm.complianceStatus->non_compliant(reason
      in ['Rooting Detected','Device Integrity Compromise']); JOIN device audit where count(selinux.avc_denied)
      >= 5 within 60s by untrusted_app_uid OR any unexpected domain/UID transition; output device_id,
      uid, denial_count, new_domain, timestamp; severity=critical
- question: >-
    In the 24 hours before a device-integrity alert, did the device make connections to rare destination
    ports or newly seen ASNs, and does a change-point in its per-minute denial and privileged-service
    crash counts localize the exploitation window?
  context: >-
    Exploit staging, payload retrieval, and early C2 often precede the moment integrity visibly breaks.
    Review the prior 24 hours of Zeek conn.log for the affected device and flag connections whose destination-port
    frequency falls below the 5th percentile and whose ASN is new for that device, escalating when cumulative
    rarity exceeds a per-device threshold derived from a 30-day baseline. In parallel, apply CUSUM or
    Bayesian online change-point detection to the device's per-minute SELinux denial-count and privileged-service
    crash-count series; a sharp regime shift pinpoints when exploitation began. This statistical framing
    reduces false positives from ordinary new destinations while tying network rarity to the on-device
    escalation timeline.
  answer_sources:
  - MDM/UEM compliance logs
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: MDM/UEM management servers, cloud management console, managed mobile devices (corporate and
    BYOD), enterprise network gateways, VPN concentrators, and DNS resolvers.'
  range: Last 90 days, focusing on the 24 hours preceding each integrity alert with a 30-day rarity baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      for device with integrity_alert: win = conn.log[alert_ts-24h .. alert_ts]; flag conn where port_freq
      < p05(device_30d) AND asn new_for_device; rarity = sum(rarity_weight); escalate when rarity > device_threshold(30d);
      cp = cusum_or_bayesian_changepoint(per_minute(denial_count), per_minute(priv_service_crash)); output
      rare_conns, new_asns, changepoint_ts
- question: >-
    Around the exploitation window, is the device's ratio of failed-to-successful first-contact egress
    connections (blocked connections, NXDOMAIN, RST) far above its benign baseline?
  context: >-
    Scanning, exploit-staging, and noisy C2 establishment all inflate connection failure rates. Treat
    each device's first-contact egress connections in the +/-60 minute window as Bernoulli success/fail
    trials and apply Wald's Sequential Probability Ratio Test (the Threshold Random Walk used in fast
    portscan detection). A failed-to-successful ratio well above the benign baseline confirms scanning
    or exploit-staging with tunable, bounded false-positive rates after only about four or five observations,
    giving the analyst an early, statistically defensible confirmation. A ratio in the normal range argues
    against active network-borne exploitation during that window.
  answer_sources:
  - MDM/UEM compliance logs
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: MDM/UEM management servers, cloud management console, managed mobile devices (corporate and
    BYOD), enterprise network gateways, VPN concentrators, and DNS resolvers.'
  range: Last 90 days, evaluated over a +/-60 minute window around the integrity change.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      trials = first_contact_egress(device, [alert_ts-60m .. alert_ts+60m]); label fail = blocked_conn
      OR nxdomain OR rst; SPRT(trials, p_benign, p_attack, alpha, beta) Threshold Random Walk; alert when
      likelihood_ratio crosses upper bound (~4-5 obs); output device, fail_success_ratio, decision
- question: >-
    Do machine-learning anomaly scores on the device's connections within 60 minutes of an integrity change
    flag likely exploit or C2 traffic, and what specific features drive the score?
  context: >-
    When rule and threshold methods are inconclusive, an unsupervised model can surface subtle precursor
    traffic. Run an Isolation Forest over features such as connection duration, bytes in/out and their
    ratio, protocol, destination-port rarity, and JA3/JA3S TLS-fingerprint hashes, flagging high anomaly
    scores within 60 minutes of the integrity change as likely exploit delivery or C2. Critically, emit
    the top-3 contributing features (for example an unusual out/in byte ratio, a rare destination port,
    or a new JA3) in the alert text rather than a bare score so the analyst can judge relevance and act.
    Validate model choice and watch for drift against the surveyed Android-malware detection landscape.
  answer_sources:
  - MDM/UEM compliance logs
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: MDM/UEM management servers, cloud management console, managed mobile devices (corporate and
    BYOD), enterprise network gateways, VPN concentrators, and DNS resolvers.'
  range: Last 90 days for training/baselining; score connections within 60 minutes of each integrity change.
  queries:
  - technology: ML/pseudocode
    query: >-
      features = [duration, bytes_in, bytes_out, out_in_ratio, proto, dport_rarity, ja3, ja3s]; model
      = IsolationForest(); score = model.decision_function(conn within 60m of integrity_change); alert
      when score >= threshold; explain = top3_feature_contributions(features); output device, score, explain
- question: >-
    Did an MDM/UEM or MTP platform record installation or execution of a mobile app whose SHA256 hash,
    package name, or code-signing certificate serial matches a threat-intel indicator, or whose static
    APK features look exploit-bearing even without a known hash?
  context: >-
    Exploitation for privilege escalation frequently arrives packaged inside a malicious app. Cross-reference
    install/execution events from MDM/MTP against curated threat intelligence for malicious app SHA256
    hashes, package names (e.g., com.exploit.pwn), and signing-certificate serials, and alert at high
    severity on any match. Because known-bad lists miss novel droppers, also apply static feature rules
    over the APK in the spirit of Drebin: requested and used permissions, restricted and suspicious API
    sets (reflection, dynamic code loading, native exec), and embedded network hosts. A hash/cert match
    is a near-certain finding; a static-feature hit warrants deeper review of the app's capabilities and
    provenance.
  answer_sources:
  - MDM/UEM application inventory logs
  - Mobile Threat Protection (MTP) agent logs
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Mobile devices with MTP agents, MDM/UEM management console, integrated threat intelligence platforms,
    network egress points, and corporate Wi-Fi infrastructure.'
  range: Last 90 days.
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      alert when (install_or_exec.sha256 in ti.hashes) OR (pkg_name in ti.packages) OR (signing_cert_serial
      in ti.cert_serials) -> severity=high; ELSE static_rules over apk: if requested_or_used_perms in
      suspicious_set AND api in {reflection, dynamic_code_load, native_exec} AND embedded_hosts present
      -> flag unknown_exploit_app; output device, pkg, sha256, matched_indicator
- question: >-
    In the 24 hours before a malicious-app alert, did the device's DNS behavior show elevated FQDN entropy
    or an NXDOMAIN spike consistent with malware resolution or DGA activity?
  context: >-
    Exploit-bearing apps often beacon to algorithmically generated or transient domains, producing high-entropy
    FQDNs and elevated NXDOMAIN rates as they probe infrastructure. For alerted devices, analyze the prior
    24 hours of Zeek dns.log and flag FQDN entropy above the 95th percentile of the peer group, alert
    when the NXDOMAIN ratio exceeds three standard deviations over the device's 30-day baseline, and confirm
    sustained elevation with SPRT over resolved/NXDOMAIN outcomes to bound false positives. Sustained
    high entropy with an NXDOMAIN spike strongly corroborates malicious-app network activity; a normal
    DNS profile suggests the install may be inert or the network stage has not yet begun.
  answer_sources:
  - MDM/UEM application inventory logs
  - Mobile Threat Protection (MTP) agent logs
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Mobile devices with MTP agents, MDM/UEM management console, integrated threat intelligence platforms,
    network egress points, and corporate Wi-Fi infrastructure.'
  range: Last 90 days, focusing on the 24 hours preceding each malicious-app alert with a 30-day DNS baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      for device with app_alert: dns = dns.log[alert_ts-24h .. alert_ts]; flag when fqdn_entropy > p95(peer_group);
      alert when nxdomain_ratio > mean_30d + 3*std_30d; confirm = SPRT(resolved_vs_nxdomain outcomes,
      alpha, beta); output device, entropy, nxdomain_ratio, sprt_decision
- question: >-
    Can a machine-learning classifier identify the malicious download session that delivered the app,
    and explain why the installed APK itself is judged malicious?
  context: >-
    The HTTP/TLS session that delivered an exploit-bearing app frequently carries telltale features. Train
    a Random Forest on attributes such as User-Agent, JA3/JA3S, URL upper/lower-case ratio, certificate
    validity period, content-length, and destination reputation to identify the malicious download preceding
    the install. For the installed APK, run an explainable linear-SVM static classifier (Drebin-style)
    and surface the top-3 contributing features (e.g., SEND_SMS permission, getDeviceId, a known C2 host)
    in the alert so the analyst sees why it scored as malicious. Together these link the network delivery
    to the on-device artifact and provide explainable evidence for escalation triage.
  answer_sources:
  - MDM/UEM application inventory logs
  - Mobile Threat Protection (MTP) agent logs
  - Zeek http.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Mobile devices with MTP agents, MDM/UEM management console, integrated threat intelligence platforms,
    network egress points, and corporate Wi-Fi infrastructure.'
  range: Last 90 days for training; score download sessions and APKs around each install event.
  queries:
  - technology: ML/pseudocode
    query: >-
      dl_model = RandomForest(features=[user_agent, ja3, ja3s, url_case_ratio, cert_validity_days, content_length,
      dst_reputation]); flag malicious download sessions preceding install; apk_model = linear_SVM_static(apk_features);
      explain = top3(apk_model); output device, session, dl_score, apk_score, explain
- question: >-
    Did a non-system app spawn su or sh, run a process as system/root UID from a path under an app container,
    modify protected system files, or drive a confused-deputy Binder/Intent chain into a privileged operation?
  context: >-
    These are direct, symbolic indicators that a low-privilege app crossed a privilege boundary. Trigger
    a high-severity alert when MTP logs show a non-system app spawning su/sh, modifying critical system
    files outside its container, or executing a process running as system/root UID whose path resides
    under an app container (e.g., /data/app or /data/user/0/<pkg>). Also flag permission re-delegation:
    confused-deputy chains where a low-privilege caller drives a privileged Binder/Intent action terminating
    in a protected operation, and information-flow violations such as tainted data reaching native exec
    or protected-memory access (TaintDroid-style). Any of these is strong evidence of successful exploitation
    and should drive immediate containment.
  answer_sources:
  - Mobile Threat Protection (MTP) process event logs
  - Mobile Threat Protection (MTP) API call logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Managed mobile devices (corporate and BYOD) with MTP agents installed, Enterprise network gateways,
    DNS resolvers.'
  range: Last 90 days.
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      alert when nonsystem_app spawns proc in ['su','sh'] OR writes critical_system_file outside container
      OR exec proc with uid in [system,root] AND exe_path under ['/data/app','/data/user/0/<pkg>']; ALSO
      flag binder/intent chain where low_priv_caller -> privileged_action -> protected_op (confused deputy);
      ALSO flag taint_flow: tainted_data -> native_exec OR protected_memory; severity=high; output app_uid,
      action, target
- question: >-
    Has a single app's privileged-API call rate, API-call set, or system-call sequence profile departed
    from its learned baseline in a way consistent with exploited execution?
  context: >-
    Exploitation changes how an app talks to the OS. Maintain per-app baselines of privileged-API call
    frequency and the observed API set, and alert when call rates exceed the 99th percentile or 3-sigma
    over the 30-day mean, or when previously unseen privileged APIs appear for the app. Additionally maintain
    per-UID system-call n-gram (n=6) profiles and alert when the unseen-sequence mismatch rate exceeds
    the learned benign threshold (e.g., >1%), an explainable, classic indicator of compromised execution.
    Apply change-point detection to the per-app denial/crash-rate series to time the escalation. A sharp
    rate increase, novel privileged APIs, or anomalous n-grams together pinpoint when and how the app
    began behaving outside its normal envelope.
  answer_sources:
  - Mobile Threat Protection (MTP) process event logs
  - Mobile Threat Protection (MTP) API call logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Managed mobile devices (corporate and BYOD) with MTP agents installed, Enterprise network gateways,
    DNS resolvers.'
  range: Last 90 days, with a 30-day per-app baseline and per-UID syscall n-gram profiles.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      per_app baseline(priv_api_rate, api_set) over 30d; alert when rate > p99 OR rate > mean+3*sigma
      OR new_priv_api appears; per_uid syscall n-gram(n=6) profile; alert when unseen_sequence_mismatch_rate
      > 1%; cp = changepoint(per_app denial_or_crash_rate); output app, anomaly_type, changepoint_ts
- question: >-
    Do sequence-aware machine-learning models flag the app's API-call or system-log-key sequence as anomalous,
    and does the abstracted API transition pattern classify as escalation behavior even under obfuscation?
  context: >-
    Order matters: an exploit chain produces unusual sequences of otherwise-individually-benign calls.
    Apply a DeepLog-style LSTM to API-call and system-log-key sequences, alerting when an observed key/call
    falls outside the top-g predicted next events and surfacing the deviating key for triage. In parallel,
    model abstracted API-call transitions as a Markov chain and classify with a Random Forest (MaMaDroid-style)
    to flag escalation behavior that resists obfuscation. Correlate any sequence anomalies with suspicious
    beaconing in Zeek conn.log to tie on-device behavior to network activity. A deviating predicted-key
    or an escalation classification, especially with concurrent beaconing, is strong corroboration of
    exploitation.
  answer_sources:
  - Mobile Threat Protection (MTP) process event logs
  - Mobile Threat Protection (MTP) API call logs
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Managed mobile devices (corporate and BYOD) with MTP agents installed, Enterprise network gateways,
    DNS resolvers.'
  range: Last 90 days for sequence-model training; score live API/log-key sequences continuously.
  queries:
  - technology: ML/pseudocode
    query: >-
      lstm = DeepLog(seq=api_calls + syslog_keys); alert when observed_key not in top_g_predicted; markov
      = transition_matrix(abstracted_api_calls); rf = RandomForest(markov_features); alert when rf predicts
      escalation; correlate with conn.log beaconing; output app, deviating_key, escalation_score, beacon_match
- question: >-
    Did MDM/UEM record a policy-violating security-configuration change such as Developer Mode or USB
    debugging being enabled, unknown sources being allowed, or a new trusted root certificate or configuration
    profile being installed?
  context: >-
    These configuration changes weaken the mandatory-access-control and code-signing controls that otherwise
    force exploits to fail visibly, and they are common precursors or consequences of a privilege-escalation
    attempt. Generate alerts when MDM/UEM logs show developerMode_enabled, usbDebugging_enabled, or unknownSources_allowed
    changing to true, or a new trusted root certificate or configuration profile being installed. A single
    policy-violating change warrants review; a cluster of them, or one tied to an app install or integrity
    event, sharply raises the likelihood of attacker-driven tampering to enable or persist escalated access.
  answer_sources:
  - MDM/UEM configuration logs
  - MDM/UEM compliance logs
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: MDM/UEM management console, managed mobile devices, enterprise certificate authorities, network
    gateways.'
  range: Last 90 days.
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      alert when mdm.developerMode_enabled->true OR mdm.usbDebugging_enabled->true OR mdm.unknownSources_allowed->true
      OR new trusted_root_cert installed OR new configuration_profile installed; output device, setting,
      old_value, new_value, actor, timestamp
- question: >-
    Has a device's set of trusted root issuers/serials drifted from its baseline, and does change-point
    detection reveal an abrupt cluster of configuration-profile or trusted-cert modifications?
  context: >-
    A rogue trusted root certificate enables TLS interception and silent payload trust, and exploit-driven
    tampering often arrives as a burst of configuration changes. Maintain a baseline set of trusted root
    issuer/serials per device and compare it against Zeek x509.log observations using Jaccard similarity,
    alerting when similarity drops below 0.95. In parallel, apply change-point detection to the per-device
    count of configuration-profile and trusted-cert changes to flag an abrupt cluster of modifications
    consistent with exploit-driven tampering. A drop in cert-store similarity or a detected change-point
    cluster indicates the device's trust anchors or profiles were altered and merits prompt investigation.
  answer_sources:
  - MDM/UEM configuration logs
  - MDM/UEM compliance logs
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: MDM/UEM management console, managed mobile devices, enterprise certificate authorities, network
    gateways.'
  range: Last 90 days, with a per-device trusted-cert baseline and change-point monitoring.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      baseline = set(trusted_root issuer+serial) per device; observed = from x509.log; sim = jaccard(baseline,
      observed); alert when sim < 0.95; cp = changepoint(per_device count(config_profile_changes + trusted_cert_changes));
      output device, jaccard_sim, added_certs, changepoint_cluster
- question: >-
    Does a one-class machine-learning model flag a device's overall security configuration as an outlier
    versus the compliant fleet, and which features explain the deviation?
  context: >-
    Individually-tolerable settings can combine into an anomalous, exploit-friendly configuration. Train
    a One-Class SVM on compliant configuration features (developer mode, unknown sources, USB debugging,
    trusted-cert count, configuration-profile count) and flag outliers as potential exploit-driven changes,
    surfacing the top-3 deviating features in the alert text so the analyst understands why the device
    stands out. Account for concept drift by periodically retraining on the current compliant fleet. A
    high-outlier device with explainable deviating features should be reviewed against its change history
    and any concurrent integrity, app-install, or API-anomaly findings.
  answer_sources:
  - MDM/UEM configuration logs
  - MDM/UEM compliance logs
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: MDM/UEM management console, managed mobile devices, enterprise certificate authorities, network
    gateways.'
  range: Last 90 days, with periodic retraining on the current compliant fleet.
  queries:
  - technology: ML/pseudocode
    query: >-
      model = OneClassSVM(train=compliant_fleet[developer_mode, unknown_sources, usb_debugging, trusted_cert_count,
      config_profile_count]); score = model.decision_function(device_config); alert when outlier; explain
      = top3_deviating_features; retrain periodically on current compliant fleet; output device, outlier_score,
      explain
