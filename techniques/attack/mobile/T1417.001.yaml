  answer_sources:
  - UEM.AppInventoryLogs
  - MobileEDR.ProcessEvents
  - Corporate.AppAllowlist
  - ThreatIntel.FileHashFeed
  - 'NAI: UEM/MDM platform''s central database, corporate application store, and threat intelligence vendor
    portals.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=uem source=UEM.AppInventoryLogs declares_ime=true

      | eval risky_source=if(install_source IN ("sideload","unknown","adb"),1,0)

      | eval verify_fail=if(signature_verified="false" OR signature_verified="absent",1,0)

      | where risky_source=1 OR verify_fail=1

      | eval severity=if(verify_fail=1,"critical","high")

      | table device_id, package_name, install_source, signature_verified'
- question: '[Credential Access] Detect rare keyboard prevalence spikes: have you determined whether detect
    rare keyboard prevalence spikes is warranted on managed mobile devices, using the Statistical Method
    approach described, to answer the intelligence requirement — Is an adversary capturing user credentials
    via keylogging on mobile devices? (PIR)'
  context: 'Tactic relevance (Credential Access): Is an adversary capturing user credentials via keylogging
    on mobile devices? (PIR) This question operationalizes a Statistical Method detection for MITRE ATT&CK
    T1417.001 (Keylogging) on Android/iOS. Calculate fleet-wide installation percentage for every application
    identified as an IME. Flag any IME with prevalence below 1% as a rare keyboard. For these, compute
    a 30-day moving average and standard deviation of daily new installations and alert if daily installations
    exceed the mean by 3 standard deviations, indicating coordinated installation. Derive the prevalence
    floor per environment from the empirical fleet distribution ([Drebin: Effective and Explainable Detection
    of Android Malware](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf)). A positive
    result indicates an app is positioned to intercept user keystrokes (third-party IME, keyboard extension,
    or accessibility abuse) and/or stage and exfiltrate captured input; a negative result reduces but
    does not eliminate suspicion, so corroborate with the other questions in this playbook (capability
    grant → intercept → local persistence → small/near-term egress).'
  answer_sources:
  - UEM.AppInventoryLogs
  - MobileEDR.ProcessEvents
  - Corporate.AppAllowlist
  - ThreatIntel.FileHashFeed
  - 'NAI: UEM/MDM platform''s central database, corporate application store, and threat intelligence vendor
    portals.'
  range: Last 90 days (use >=30 days of history to establish per-device/fleet baselines)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "index=uem source=UEM.AppInventoryLogs declares_ime=true\n| stats dc(device_id) as installs\
      \ by package_name\n| eventstats dc(device_id) as fleet\n| eval prevalence=installs/fleet\n| where\
      \ prevalence < 0.01\n| join package_name [ search daily_new_installs by package_name\n    | stats\
      \ avg(daily) as mu stdev(daily) as sd latest(daily) as today by package_name ]\n| where today >\
      \ mu + 3*sd"
- question: '[Credential Access] Classify risky IME metadata: have you determined whether classify risky
    IME metadata is warranted on managed mobile devices, using the Machine Learning approach described,
    to answer the intelligence requirement — Is an adversary capturing user credentials via keylogging
    on mobile devices? (PIR)'
  context: 'Tactic relevance (Credential Access): Is an adversary capturing user credentials via keylogging
    on mobile devices? (PIR) This question operationalizes a Machine Learning detection for MITRE ATT&CK
    T1417.001 (Keylogging) on Android/iOS. Train a Random Forest classifier using application metadata
    and static features such as requested permissions, declared components/intents, suspicious API references,
    hardcoded network URLs, developer age, app store rating, installation source, and review sentiment.
    For newly detected or rare IME apps, predict malicious likelihood and generate a critical incident
    when probability exceeds 0.90. Use the linear/feature-attribution explanation to surface the top-3
    contributing features (e.g., SMS/contacts permission, hardcoded C2 URL, sideload source) in the alert
    text ([Drebin: Effective and Explainable Detection of Android Malware](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf);
    [Android Malware Detection using Machine Learning: A Review](https://arxiv.org/abs/2307.02412)). A
    positive result indicates an app is positioned to intercept user keystrokes (third-party IME, keyboard
    extension, or accessibility abuse) and/or stage and exfiltrate captured input; a negative result reduces
    but does not eliminate suspicion, so corroborate with the other questions in this playbook (capability
    grant → intercept → local persistence → small/near-term egress).'
  answer_sources:
  - UEM.AppInventoryLogs
  - MobileEDR.ProcessEvents
  - Corporate.AppAllowlist
  - ThreatIntel.FileHashFeed
  - 'NAI: UEM/MDM platform''s central database, corporate application store, and threat intelligence vendor
    portals.'
  range: Last 90 days (use >=30 days of history to establish per-device/fleet baselines)
  queries:
  - technology: ML/pseudocode
    query: "features = [perms, declared_components, suspicious_api_refs,\n            hardcoded_urls,\
      \ developer_age, store_rating,\n            install_source, review_sentiment]\np = RandomForest.predict_proba(features)[malicious]\n\
      if p > 0.90:\n    raise_incident(severity=\"critical\",\n        top3=feature_attribution(features)[:3])"
- question: '[Credential Access] Alert on unallowlisted accessibility grants: have you determined whether
    alert on unallowlisted accessibility grants is warranted on managed mobile devices, using the Symbolic
    Logic approach described, to answer the intelligence requirement — Is an adversary capturing user
    credentials via keylogging on mobile devices? (PIR)'
  context: 'Tactic relevance (Credential Access): Is an adversary capturing user credentials via keylogging
    on mobile devices? (PIR) This question operationalizes a Symbolic Logic detection for MITRE ATT&CK
    T1417.001 (Keylogging) on Android/iOS. Monitor UEM/MDM permission logs and `dumpsys accessibility`
    and trigger a critical alert whenever `android.permission.BIND_ACCESSIBILITY_SERVICE` is granted/enabled
    for an application whose package name is not in a curated allowlist of essential accessibility tools,
    especially when the service subscribes to `TYPE_VIEW_TEXT_CHANGED`/`TYPE_VIEW_FOCUSED` for other packages.
    This event-type scrutiny is the core defense against accessibility keylogging ([On Malware Leveraging
    the Android Accessibility Framework](https://link.springer.com/chapter/10.1007/978-3-319-11569-6_40)).
    A positive result indicates an app is positioned to intercept user keystrokes (third-party IME, keyboard
    extension, or accessibility abuse) and/or stage and exfiltrate captured input; a negative result reduces
    but does not eliminate suspicion, so corroborate with the other questions in this playbook (capability
    grant → intercept → local persistence → small/near-term egress).'
  answer_sources:
  - UEM.PermissionGrantLogs
  - MobileEDR.APIMonitoringLogs
  - Android.DumpsysAccessibility
  - 'NAI: UEM/MDM platform''s device configuration and compliance database; EDR agent logs on managed
    Android devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=uem (source=UEM.PermissionGrantLogs OR source=Android.DumpsysAccessibility)

      permission="android.permission.BIND_ACCESSIBILITY_SERVICE" action IN ("granted","enabled")

      | lookup AccessibilityAllowlist package_name OUTPUT approved

      | where isnull(approved)

      | eval flag=if(event_type IN ("TYPE_VIEW_TEXT_CHANGED","TYPE_VIEW_FOCUSED") AND foreign_pkg=true,1,0)

      | where flag=1 | eval severity="critical"'
- question: '[Credential Access] Measure text-change callback frequency: have you determined whether measure
    text-change callback frequency is warranted on managed mobile devices, using the Statistical Method
    approach described, to answer the intelligence requirement — Is an adversary capturing user credentials
    via keylogging on mobile devices? (PIR)'
  context: 'Tactic relevance (Credential Access): Is an adversary capturing user credentials via keylogging
    on mobile devices? (PIR) This question operationalizes a Statistical Method detection for MITRE ATT&CK
    T1417.001 (Keylogging) on Android/iOS. For any app with an accessibility service enabled, count `onAccessibilityEvent`/`TYPE_VIEW_TEXT_CHANGED`
    callbacks per minute sourced from foreign packages (Frequency) and the cumulative bytes of text captured
    (Volume). Baseline benign accessibility tools and alert when callback rate or captured-text volume
    exceeds the 99th percentile of the benign baseline; treat high text-change rates against banking/login
    packages as high severity. Captured input volume scales with keystroke volume ([Bait Your Hook: A
    Novel Detection Technique for Keyloggers](https://link.springer.com/chapter/10.1007/978-3-642-15512-3_11)).
    A positive result indicates an app is positioned to intercept user keystrokes (third-party IME, keyboard
    extension, or accessibility abuse) and/or stage and exfiltrate captured input; a negative result reduces
    but does not eliminate suspicion, so corroborate with the other questions in this playbook (capability
    grant → intercept → local persistence → small/near-term egress).'
  answer_sources:
  - UEM.PermissionGrantLogs
  - MobileEDR.APIMonitoringLogs
  - Android.DumpsysAccessibility
  - 'NAI: UEM/MDM platform''s device configuration and compliance database; EDR agent logs on managed
    Android devices.'
  range: Last 90 days (use >=30 days of history to establish per-device/fleet baselines)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=mobileedr source=MobileEDR.APIMonitoringLogs

      event IN ("onAccessibilityEvent","TYPE_VIEW_TEXT_CHANGED") foreign_pkg=true

      | bin _time span=1m

      | stats count as cb_rate sum(text_bytes) as vol by package_name, _time

      | eventstats perc99(cb_rate) as p99_rate perc99(vol) as p99_vol by package_name

      | where cb_rate > p99_rate OR vol > p99_vol

      | eval severity=if(target_pkg IN (banking_login_pkgs),"high","medium")'
- question: '[Credential Access] Score abnormal permission diversity: have you determined whether score
    abnormal permission diversity is warranted on managed mobile devices, using the Statistical Method
    approach described, to answer the intelligence requirement — Is an adversary capturing user credentials
    via keylogging on mobile devices? (PIR)'
  context: 'Tactic relevance (Credential Access): Is an adversary capturing user credentials via keylogging
    on mobile devices? (PIR) This question operationalizes a Statistical Method detection for MITRE ATT&CK
    T1417.001 (Keylogging) on Android/iOS. For any application with `BIND_ACCESSIBILITY_SERVICE` granted,
    calculate the Shannon entropy of its full Android permission set and alert if entropy falls in the
    99th percentile across all apps. Concurrently calculate the Jaccard distance between the app''s permission
    set and the median permission set for its stated app store category; alert if distance is greater
    than 0.8. Permission-vector features are strong malware discriminators ([Drebin: Effective and Explainable
    Detection of Android Malware](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf)).
    A positive result indicates an app is positioned to intercept user keystrokes (third-party IME, keyboard
    extension, or accessibility abuse) and/or stage and exfiltrate captured input; a negative result reduces
    but does not eliminate suspicion, so corroborate with the other questions in this playbook (capability
    grant → intercept → local persistence → small/near-term egress).'
  answer_sources:
  - UEM.PermissionGrantLogs
  - MobileEDR.APIMonitoringLogs
  - Android.DumpsysAccessibility
  - 'NAI: UEM/MDM platform''s device configuration and compliance database; EDR agent logs on managed
    Android devices.'
  range: Last 90 days (use >=30 days of history to establish per-device/fleet baselines)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=uem source=UEM.PermissionGrantLogs

      | where "android.permission.BIND_ACCESSIBILITY_SERVICE" in granted_perms

      | eval entropy=shannon(granted_perms)

      | eval jdist=jaccard_distance(granted_perms, category_median_perms)

      | eventstats perc99(entropy) as p99e

      | where entropy >= p99e OR jdist > 0.8'
- question: '[Credential Access] Detect anomalous accessibility API sequences: have you determined whether
    detect anomalous accessibility API sequences is warranted on managed mobile devices, using the Machine
    Learning approach described, to answer the intelligence requirement — Is an adversary capturing user
    credentials via keylogging on mobile devices? (PIR)'
  context: 'Tactic relevance (Credential Access): Is an adversary capturing user credentials via keylogging
    on mobile devices? (PIR) This question operationalizes a Machine Learning detection for MITRE ATT&CK
    T1417.001 (Keylogging) on Android/iOS. Model the sequence of API calls from accessibility-enabled
    apps as package/family-level transitions (Markov chains) and/or train an Isolation Forest on known-benign
    accessibility call sequences. Alert on anomalous transitions such as `onAccessibilityEvent`/`TYPE_VIEW_TEXT_CHANGED`
    immediately followed by `FileOutputStream.write` or `Socket.connect` (top 1% anomaly score). Surface
    the top-3 anomalous transitions/features in the alert ([MaMaDroid: Detecting Android Malware by Building
    Markov Chains of Behavioral Models](https://arxiv.org/abs/1612.04433); [Towards Trustworthy Keylogger
    Detection: Ensemble Techniques and Feature Selection through Explainable AI](https://arxiv.org/abs/2505.16103)).
    A positive result indicates an app is positioned to intercept user keystrokes (third-party IME, keyboard
    extension, or accessibility abuse) and/or stage and exfiltrate captured input; a negative result reduces
    but does not eliminate suspicion, so corroborate with the other questions in this playbook (capability
    grant → intercept → local persistence → small/near-term egress).'
  answer_sources:
  - UEM.PermissionGrantLogs
  - MobileEDR.APIMonitoringLogs
  - Android.DumpsysAccessibility
  - 'NAI: UEM/MDM platform''s device configuration and compliance database; EDR agent logs on managed
    Android devices.'
  range: Last 90 days (use >=30 days of history to establish per-device/fleet baselines)
  queries:
  - technology: ML/pseudocode
    query: "seq = api_call_sequence(package)  # markov / isolation-forest\nscore = IsolationForest.score(seq)\n\
      if transition(\"TYPE_VIEW_TEXT_CHANGED\" -> \"FileOutputStream.write\")\n   or transition(\"TYPE_VIEW_TEXT_CHANGED\"\
      \ -> \"Socket.connect\")\n   or score in top_1_percent:\n    raise_alert(top3=anomalous_transitions(seq)[:3])"
