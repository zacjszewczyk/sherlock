questions:
- question: '[Credential Access] Alert on unapproved IME installs: have you determined whether alert on
    unapproved IME installs is warranted on managed mobile devices, using the Symbolic Logic approach
    described, to answer the intelligence requirement — Is an adversary capturing user credentials via
    keylogging on mobile devices? (PIR)'
  context: 'Tactic relevance (Credential Access): Is an adversary capturing user credentials via keylogging
    on mobile devices? (PIR) This question operationalizes a Symbolic Logic detection for MITRE ATT&CK
    T1417.001 (Keylogging) on Android/iOS. Continuously query UEM/MDM application inventory data. For
    each device, join installed packages with the allowlist of approved keyboard applications based on
    package name, developer signature, and binary hash. Generate a high-severity alert for any package
    declaring an IME/keyboard capability (Android `BIND_INPUT_METHOD` service or iOS keyboard extension)
    that is not on the allowlist or has a mismatched signature/hash. Keep this deterministic allowlist
    as the floor of detection; third-party keyboards that capture all typed text are the canonical mobile
    keylogging vector ([The Evolution of Keylogger Technologies: A Survey](https://arxiv.org/abs/2312.10445)).
    A positive result indicates an app is positioned to intercept user keystrokes (third-party IME, keyboard
    extension, or accessibility abuse) and/or stage and exfiltrate captured input; a negative result reduces
    but does not eliminate suspicion, so corroborate with the other questions in this playbook (capability
    grant → intercept → local persistence → small/near-term egress).'
  answer_sources:
  - UEM.AppInventoryLogs
  - MobileEDR.ProcessEvents
  - Corporate.AppAllowlist
  - ThreatIntel.FileHashFeed
  - 'NAI: UEM/MDM platform''s central database, corporate application store, and threat intelligence vendor
    portals.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=uem source=UEM.AppInventoryLogs

      | where (declares_ime=true OR ios_keyboard_extension=true)

      | lookup Corporate.AppAllowlist package_name signature hash OUTPUT approved

      | where isnull(approved) OR signature_mismatch=true OR hash_mismatch=true

      | eval severity="high"

      | table device_id, package_name, signature, hash, install_source'
