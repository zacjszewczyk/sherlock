- question: '[Credential Access] Detect low-jitter small-beacon patterns: have you determined whether
    detect low-jitter small-beacon patterns is warranted on managed mobile devices, using the Statistical
    Method approach described, to answer the intelligence requirement — Is an adversary capturing user
    credentials via keylogging on mobile devices? (PIR)'
  context: 'Tactic relevance (Credential Access): Is an adversary capturing user credentials via keylogging
    on mobile devices? (PIR) This question operationalizes a Statistical Method detection for MITRE ATT&CK
    T1417.001 (Keylogging) on Android/iOS. Aggregate `Zeek conn.log` into 1-hour windows grouped by source
    and destination IP. Apply FFT/autocorrelation over connection inter-arrival times to detect a dominant
    period robust to jitter, and compute the standard deviation of time deltas and the 95th percentile
    of `orig_bytes`. Alert if a strong periodicity is present with time-delta standard deviation below
    2 seconds and 95th-percentile `orig_bytes` below 1024 bytes. Enrich with WHOIS and escalate if the
    destination domain was registered in the last 30 days ([BAYWATCH: Robust Beaconing Detection](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks)).
    A positive result indicates an app is positioned to intercept user keystrokes (third-party IME, keyboard
    extension, or accessibility abuse) and/or stage and exfiltrate captured input; a negative result reduces
    but does not eliminate suspicion, so corroborate with the other questions in this playbook (capability
    grant → intercept → local persistence → small/near-term egress).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - MobileEDR.NetworkEvents
  - ThreatIntel.Feed
  - WHOIS.RegistrationData
  - 'NAI: Network sensor logs from corporate Wi-Fi controllers, VPN concentrators, and internet gateway
    traffic mirrors.'
  range: Last 90 days (use >=30 days of history to establish per-device/fleet baselines)
  queries:
  - technology: Zeek/Stats pseudocode
    query: "read conn.log | bin _time span=1h | group by src_ip, dest_ip\n| compute inter_arrival deltas\n\
      | period = FFT_autocorr(deltas).dominant_period\n| sd_delta = stdev(deltas); p95_orig = perc95(orig_bytes)\n\
      | if period_strong AND sd_delta < 2s AND p95_orig < 1024:\n    enrich WHOIS(dest); if reg_age <\
      \ 30d: escalate"
- question: '[Credential Access] Profile DNS/connection failure rates: have you determined whether profile
    DNS/connection failure rates is warranted on managed mobile devices, using the Statistical Method
    approach described, to answer the intelligence requirement — Is an adversary capturing user credentials
    via keylogging on mobile devices? (PIR)'
  context: 'Tactic relevance (Credential Access): Is an adversary capturing user credentials via keylogging
    on mobile devices? (PIR) This question operationalizes a Statistical Method detection for MITRE ATT&CK
    T1417.001 (Keylogging) on Android/iOS. Per mobile device, compute the rate of NXDOMAIN responses,
