    (possible DGA/tunnel exfil of keystrokes) even when payload volume is small ([Detection of Malicious
    and Low Throughput Data Exfiltration Over the DNS Protocol](https://arxiv.org/abs/1709.08395)). A
    positive result indicates an app is positioned to intercept user keystrokes (third-party IME, keyboard
    extension, or accessibility abuse) and/or stage and exfiltrate captured input; a negative result reduces
    but does not eliminate suspicion, so corroborate with the other questions in this playbook (capability
    grant → intercept → local persistence → small/near-term egress).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - MobileEDR.NetworkEvents
  - ThreatIntel.Feed
  - WHOIS.RegistrationData
  - 'NAI: Network sensor logs from corporate Wi-Fi controllers, VPN concentrators, and internet gateway
    traffic mirrors.'
  range: Last 90 days (use >=30 days of history to establish per-device/fleet baselines)
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'read dns.log, conn.log group by src_ip

      | nx_rate = count(rcode=NXDOMAIN)/window

      | uniq_sub = dc(subdomain); failed = count(conn_state IN (S0,REJ,RSTO))

      | eventstats perc99(nx_rate) perc99(uniq_sub) by src_ip baseline

      | where nx_rate > p99 OR uniq_sub > p99'
