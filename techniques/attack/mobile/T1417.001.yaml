name: 'T1417.001: Keylogging'
id: 692fff15-dded-4e69-8b30-0c45c24138df
description: This playbook helps an analyst investigate MITRE ATT&CK T1417.001 (Keylogging) on managed
  Android and iOS devices, where an adversary logs user keystrokes to intercept credentials and sensitive
  data (PII, messages, contacts, proprietary information) as the user types. It supports both Credential
  Access and Collection mission questions by chaining input-capture capability acquisition (a non-allowlisted
  third-party keyboard/IME, an iOS keyboard extension with Full Access, or abuse of Android BIND_ACCESSIBILITY_SERVICE
  and TYPE_VIEW_TEXT_CHANGED) to high-frequency text interception, local keylog persistence within an
  app/keyboard container, and small or bulk near-term network egress. The questions combine deterministic
  allowlist/threat-intel checks, statistical baselining (prevalence, callback frequency, permission entropy,
  beacon periodicity, DNS/connection failure rates, outbound volume), and machine-learning detectors (metadata
  classification, API-sequence anomaly, per-device LSTM autoencoders, exfiltration clustering) across
  UEM/MDM, MobileEDR, and Zeek network telemetry.
type: technique
related:
- tactic_id: TA0031
  tactic_name: Credential Access
- tactic_id: TA0035
  tactic_name: Collection
