name: 'T1407: Download New Code at Runtime'
id: a8cafcae-84cb-43e8-a5f8-7d9b0275dab3
description: 'Investigate adversary attempts to download and execute dynamic code at runtime on managed
  mobile devices in order to evade static analysis and pre-publication app-store scans. This playbook
  helps an analyst hunt for the full Download New Code at Runtime chain: a managed Android or iOS device
  fetching executable or code-like content (DEX, native .so, JAR, Mach-O, or JavaScript) from suspicious,
  newly registered, or threat-intel-flagged destinations; the subsequent write of high-entropy payloads
  into app-writable paths; memory-permission changes and loader API invocations such as DexClassLoader/PathClassLoader,
  System.load/loadLibrary, dlopen/dyld, Runtime.exec, and WebView addJavascriptInterface; and iOS hot-patch
  frameworks such as JSPatch. It combines deterministic rules over network and Mobile Threat Defense (MTD)
  telemetry with statistical baselining (JA3 rarity, URI/domain entropy, distribution-graph anomalies,
  per-app volume forecasting) and machine-learning classification of dynamic-code download sessions, so
  analysts can tie risky network provenance to host-side load events and distinguish benign updates from
  malicious post-install code delivery.'
type: technique
related:
- tactic_id: TA0030
  tactic_name: Defense Evasion
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did a managed mobile device download a file whose MIME type indicates executable or code-like
    content (Java archive, DEX, shared library, octet-stream, zip, JavaScript, or Mach-O) from an external
    destination that is suspicious by reputation, threat intel, or domain age?
  context: 'This is the foundational network-provenance signal for Download New Code at Runtime. Join
    Zeek conn.log with files.log on session UID for traffic sourced from the mobile device IP range, then
    trigger a medium-severity alert when files.log mime_type is one of the code-like types AND either
    the destination SNI/IP matches a threat-intel indicator OR the WHOIS-derived domain age is under 30
    days. Keep these hard thresholds. Capture the downloaded byte count and Content-Length (Volume) and
    the HTTP status (State: 200 success vs 4xx/blocked) following [Nazca](https://sites.cs.ucsb.edu/~chris/research/doc/ndss14_nazca.pdf)''s
    MIME/content-sniffing approach, and enrich with JA3/JA3S, certificate issuer, transferred bytes, and
    the top-3 matching conditions for explainability. A positive result ties a defense-evasion code pull
    to risky infrastructure; a clean reputable destination over an established domain lowers concern.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek files.log
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek dns.log
  - 'NAI: Corporate Wi-Fi network segments, VPN concentrators, and cloud-based secure web gateways used
    by mobile devices.'
  range: Last 90 days
  queries:
  - technology: Zeek/SIEM rule pseudocode
    query: 'files = zeek_files where mime_type in [''application/java-archive'',''application/x-dex'',''application/x-sharedlib'',''application/octet-stream'',''application/zip'',''text/javascript'',''application/x-mach-o''];

      join files with zeek_conn on uid where src_ip in mobile_ranges;

      enrich dest with ssl.sni, x509.issuer, ja3, ja3s, threat_intel, whois_domain_age(dns.log);

      alert medium when threat_intel_match=true OR domain_age_days < 30;

      output device_ip, dest, mime_type, content_length, http_status, ja3, ja3s, top3_conditions.'
- question: Did a non-browser mobile app make repeated failed or blocked download attempts and then succeed
    in pulling an executable-MIME file, suggesting staged payload retrieval or fallback hosts?
  context: Adversaries staging post-install code often hit blocked or dead hosts before landing a working
    payload, so the failure-then-success pattern is itself an evasion signal. Track per-(device,domain)
    HTTP response state from Zeek http.log/conn.log as a distinct feature and alert when a non-browser
    app issues 5 or more 4xx/5xx or RST/blocked connections within 10 minutes followed by a successful
    executable-MIME 200, consistent with [Nazca](https://sites.cs.ucsb.edu/~chris/research/doc/ndss14_nazca.pdf)'s
    download-then-install chains. Include the failure count, the success URL, and bytes transferred. A
    burst of failures resolving into a code download is a strong lead; isolated single fetches are weaker.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek files.log
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek dns.log
  - 'NAI: Corporate Wi-Fi network segments, VPN concentrators, and cloud-based secure web gateways used
    by mobile devices.'
  range: Last 90 days, with 10-minute retry windows
  queries:
  - technology: Zeek/SIEM rule pseudocode
    query: 'attempts = zeek_http/zeek_conn by device,domain,app where app != browser;

      failures = count attempts where status in 4xx/5xx OR conn_state in [REJ,RSTO,blocked] over 10m;

      success = attempts where status=200 and mime_type in code_like_types;

      alert when failures >= 5 followed_by success within 10m;

      output device, app, domain, failure_count, success_url, bytes.'
- question: Over the last 30 days, did a mobile TLS session use a rare (bottom-5th-percentile) JA3/JA3S
    fingerprint together with a high-entropy URI and a rare destination domain, coinciding with an executable-MIME
    file event?
  context: Custom or uncommon TLS stacks used by malicious loaders produce rare JA3/JA3S hashes, and code-delivery
    URLs often carry high-entropy paths and short-lived, name-entropy-heavy domains. Over a 30-day rolling
    window of mobile-NAI TLS sessions, compute the population frequency of JA3/JA3S hashes (ssl.log) and
    flag the bottom 5th percentile, compute Shannon entropy of the URI path+query (http.log), and score
    destination domains with the [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/ndss11_exposure.pdf)
    feature set (short-lived domain, distinct-IP count, low TTL, name entropy). Raise a high-priority
    alert when a session uses a bottom-5th-percentile JA3/JA3S AND URI entropy exceeds 4.5 AND correlates
    with an executable-MIME file event, surfacing the contributing features. Derive percentile/entropy
    cutoffs from your own 30-day baseline rather than fixed constants.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek files.log
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek dns.log
  - 'NAI: Corporate Wi-Fi network segments, VPN concentrators, and cloud-based secure web gateways used
    by mobile devices.'
  range: Last 30 days rolling baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = freq(ja3, ja3s) over 30d on mobile_nai_tls;

      rare_tls = sessions where ja3_pct <= 5 or ja3s_pct <= 5;

      uri_entropy = shannon(uri_path+query);

      dom_feat = exposure_features(domain);  # short_lived, distinct_ips, low_ttl, name_entropy

      alert high when rare_tls and uri_entropy > 4.5 and exec_mime_file_event_correlated;

      output session, ja3, ja3s, uri_entropy, dom_feat, file_event.'
- question: Do download, host, and client graphs reveal hosts in the top 1% for client fan-out, file-hash
    reuse across many URLs/domains, or executable-to-total download ratio, even when individual downloads
    look benign?
  context: 'Malicious distribution infrastructure betrays itself in aggregate even when each download
    appears innocuous. Following [Nazca](https://sites.cs.ucsb.edu/~chris/research/doc/ndss14_nazca.pdf),
    build download/host/client graphs from Zeek files.log and conn.log and score aggregated weak signals:
    clients-per-host count, reuse of a single file hash across many distinct URLs/domains, and the ratio
    of executable to total downloads per host. Alert on hosts in the top 1% of any signal and report the
    contributing graph metrics (hash dispersion, client fan-out). A high-fan-out host serving the same
    payload under many names is a classic code-distribution node; benign CDNs should be allowlisted to
    control noise.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek files.log
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek dns.log
  - 'NAI: Corporate Wi-Fi network segments, VPN concentrators, and cloud-based secure web gateways used
    by mobile devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'edges = build_graph(zeek_files, zeek_conn);  # client-host-file-url-domain

      per_host = aggregate(clients_per_host, hash_reuse_across_urls, exec_to_total_ratio);

      alert when any(per_host metric) >= percentile(99);

      output host, clients_per_host, hash_dispersion, client_fan_out, exec_ratio.'
- question: Does a supervised classifier score a mobile download session as a malicious dynamic-code delivery
    with probability above 0.85, based on domain, DNS, TLS, URI, file, and certificate features?
  context: When deterministic rules and single statistics are evaded, a model combining many weak signals
    can still separate benign updates from malicious code pulls. Train a Random Forest on time-ordered
    labeled sessions (benign vs malicious executable downloads) using features such as destination domain
    age, threat-intel match, [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/ndss11_exposure.pdf)
    passive-DNS features (distinct IPs/countries, TTL, name entropy, numeric fraction), JA3/JA3S frequency
    percentile, URI entropy, one-hot file MIME, file size/bytes, certificate validity and issuer (x509.log),
    and subdomain count. Alert when P(malicious) > 0.85 and emit the top-3 SHAP/importance features in
    the alert text. Per [TESSERACT](https://www.usenix.org/system/files/sec19-pendlebury.pdf), use time-ordered
    train/test splits, realistic class ratios, monitor concept drift, retrain on recent data, and report
    AUT(F1) rather than a single-split F1.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek files.log
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek dns.log
  - 'NAI: Corporate Wi-Fi network segments, VPN concentrators, and cloud-based secure web gateways used
    by mobile devices.'
  range: Last 90 days, with time-ordered training windows
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [domain_age, ti_match, exposure_dns_feats, ja3_pct, ja3s_pct, uri_entropy,\n  \
      \          onehot(mime), file_bytes, cert_valid, cert_issuer, subdomain_count];\nmodel = RandomForest(time_ordered_split,\
      \ realistic_class_ratio);\nscore = model.predict_proba(session);\nalert when score > 0.85; explain\
      \ = shap_top3(session);\nmonitor drift; report AUT(F1); output session, score, explain."
- question: Did an MTD agent on a managed Android device record a call to a dynamic-code-loading sink
    API (DexClassLoader, PathClassLoader, System.load/loadLibrary, Runtime.exec, createPackageContext,
    or WebView.addJavascriptInterface) from an app that is not on the corporate allowlist or is a known-vulnerable
    version?
  context: These are the canonical unsafe sinks for runtime code execution enumerated by [Poeplau et al.](https://sites.cs.ucsb.edu/~chris/research/doc/ndss14_execute.pdf);
    their use by an unapproved app is a direct evasion indicator. Generate a high-severity alert when
    an MTD log records a call to dalvik.system.DexClassLoader, dalvik.system.PathClassLoader, java.lang.System.load,
    java.lang.System.loadLibrary, java.lang.Runtime.exec, android.content.Context.createPackageContext,
    or android.webkit.WebView.addJavascriptInterface. Cross-reference the app package name/hash against
    the MDM allowlist and approved-version baseline ([NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf));
    if unapproved or known-bad, auto-quarantine via MTD/MDM API. Keep these concrete API-string rules.
    A hit from an allowlisted, current app is likely benign; a hit from an unknown app is actionable.
  answer_sources:
  - Mobile Threat Defense (MTD) API monitoring logs
  - MDM application inventory logs
  - 'NAI: Managed Android mobile devices enrolled in MDM/MTD solutions.'
  range: Last 90 days
  queries:
  - technology: MTD/SIEM rule pseudocode
    query: "alert high from mtd_api_log where api in\n['dalvik.system.DexClassLoader','dalvik.system.PathClassLoader','java.lang.System.load',\n\
      \ 'java.lang.System.loadLibrary','java.lang.Runtime.exec',\n 'android.content.Context.createPackageContext','android.webkit.WebView.addJavascriptInterface'];\n\
      lookup app(pkg,hash) in mdm_allowlist and approved_version_baseline;\nwhen not_approved or known_bad:\
      \ auto_quarantine(device,app);\noutput device, app_pkg, app_hash, api, allowlist_state."
- question: On a managed Android device, was a high-entropy .dex/.jar/.so/.zip file created in an app-writable
    path and then, within a short window, loaded by the same UID via DexClassLoader/PathClassLoader or
    dlopen (optionally with a SELinux execmem/mprotect AVC)?
  context: The write-then-load-from-writable-path provenance rule of [Poeplau et al.](https://sites.cs.ucsb.edu/~chris/research/doc/ndss14_execute.pdf)
    is one of the strongest host-side confirmations of downloaded code execution. Correlate a recent File
    Creation/Modification of a .dex/.jar/.so/.zip under /data/data/<pkg>/(files|cache)/ or /storage/emulated/0/
    with elevated entropy, followed within a short window by a DexClassLoader/PathClassLoader load or
    dlopen of that same path by the same UID, optionally with a SELinux AVC for execmem/execute_no_trans/mprotect.
    Alert high-severity and include the file path, entropy, time delta, and loader API. This pairs network
    provenance with the actual host load event, making the evasion behavior concrete and defensible.
  answer_sources:
  - Mobile Threat Defense (MTD) API monitoring logs
  - MDM application inventory logs
  - 'NAI: Managed Android mobile devices enrolled in MDM/MTD solutions.'
  range: Last 90 days, with short write-to-load correlation windows
  queries:
  - technology: MTD/SIEM rule pseudocode
    query: "writes = file_events where path matches '/data/data/*/(files|cache)/*' or '/storage/emulated/0/*'\n\
      \         and ext in [dex,jar,so,zip] and entropy_high;\nloads = loader_events where api in [DexClassLoader,PathClassLoader,dlopen]\
      \ and path=writes.path;\navc = selinux_avc where op in [execmem,execute_no_trans,mprotect];\nalert\
      \ high when loads.uid=writes.uid and loads.ts - writes.ts < short_window;\noutput device, app, file_path,\
      \ entropy, time_delta, loader_api, avc."
- question: For each app-user pair on the Android fleet, is dynamic loader-API usage anomalous, either
    the first fleet-wide use of a loader API by an app or a per-pair frequency spike above the 99th percentile
    or 3-sigma?
  context: Rare or first-seen loader behavior is suspicious in the spirit of [Drebin](https://www.ndss-symposium.org/wp-content/uploads/2017/09/11_3_1.pdf)'s
    rare-feature weighting. For each app-user pair, maintain a 30-day rolling baseline of loader-API call
    counts (Frequency, calls/24h) and download Volume from MTD telemetry. Alert (medium) on (a) the first
    fleet-wide use of a loader API by an app, or (b) a per-pair frequency spike exceeding the 99th percentile
    or 3-sigma over its historical mean. Track State separately, treating failed/denied loads (SELinux
    denials, ClassNotFoundException) as a distinct signal. Derive cutoffs from your fleet baseline and
    tune via time-ordered data per [TESSERACT](https://www.usenix.org/system/files/sec19-pendlebury.pdf).
    A brand-new loader usage in a previously quiet app warrants review.
  answer_sources:
  - Mobile Threat Defense (MTD) API monitoring logs
  - MDM application inventory logs
  - 'NAI: Managed Android mobile devices enrolled in MDM/MTD solutions.'
  range: Last 90 days, with 30-day rolling per-pair baselines
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = rolling_30d(loader_calls_per_24h, download_volume) by app,user;

      first_use = loader_api not_seen_fleetwide_for(app);

      spike = current_calls > max(percentile(99), mean+3*stddev) per app,user;

      denials = count(selinux_denial, ClassNotFoundException) as state_signal;

      alert medium when first_use or spike;

      output app, user, current_calls, baseline, denials, loader_api.'
- question: Does a behavioral model (MaMaDroid-style Markov transitions plus unsupervised Isolation Forest/LOF)
    flag an Android app as anomalous, particularly for sequences involving dynamic-loading or reflection
    transitions?
  context: Sophisticated loaders may avoid single-API rules, so model the behavior. Train [MaMaDroid](https://arxiv.org/pdf/1612.04433)-style
    models that abstract API-call sequences to package/family level as Markov-chain transition probabilities
    fed to Random Forest/KNN, plus an unsupervised Isolation Forest/LOF over API n-grams, inter-call timing,
    requested permissions, and per-process network volume. Flag apps whose behavior is anomalous, prioritizing
    sequences involving dynamic-loading/reflection transitions (e.g., dalvik.system -> java.lang.reflect,
    first-seen dlopen), and emit the top-3 contributing features in the alert. Optionally add runtime
    taint features ([TaintDroid](https://patrickmcdaniel.org/pubs/osdi10.pdf)) flagging sensitive-data
    egress by loaded code. Follow [TESSERACT](https://www.usenix.org/system/files/sec19-pendlebury.pdf)
    time-aware evaluation and drift retraining.
  answer_sources:
  - Mobile Threat Defense (MTD) API monitoring logs
  - MDM application inventory logs
  - 'NAI: Managed Android mobile devices enrolled in MDM/MTD solutions.'
  range: Last 90 days, with time-aware training and drift monitoring
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seq = abstract_api_calls_to_family(app);

      markov = transition_matrix(seq); rf = RandomForest/KNN(markov);

      anom = IsolationForest/LOF([api_ngrams, intercall_timing, permissions, net_volume]);

      taint = taintdroid_sensitive_egress(loaded_code);  # optional

      alert when rf_malicious or anom_outlier, prioritize dynamic_loading/reflection transitions;

      explain = top3_features; output app, score, explain, taint.'
- question: Did a managed iOS device resolve or connect to a domain/IP/hash on a JSPatch/hot-patch threat-intel
    feed, or did an MTD agent report JSPatch/hot-patch function use in a non-allowlisted app, or a non-browser
    app fetch text/javascript or Mach-O then dlopen from an app-writable path?
  context: JSPatch and similar iOS hot-patch frameworks are the canonical way adversaries rewrite app
    behavior post-install. Ingest a mobile-specific threat-intel feed of domains/IPs/hashes for malicious
    JSPatch and similar frameworks ([FireEye JSPatch](https://www.fireeye.com/blog/threat-research/2016/01/hot_or_not_the_bene.html))
    and trigger a high-severity alert when a DNS query (Zeek dns.log) or connection (Zeek conn.log) from
    the iOS NAI matches the feed. Run a parallel rule when an MTD log shows JSPatch/hot-patch function
    use within a non-allowlisted app ([NIST SP 800-124r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-124r2.pdf)).
    Additionally flag any non-browser iOS app fetching text/javascript or application/x-mach-o then performing
    dyld/dlopen from an app-writable tmp/Caches path. Enrich with MDM owner/app inventory.
  answer_sources:
  - Mobile Threat Defense (MTD) logs
  - Zeek dns.log
  - Zeek conn.log
  - MDM application inventory logs
  - 'NAI: Managed iOS mobile devices enrolled in MDM/MTD solutions and their associated network traffic.'
  range: Last 90 days
  queries:
  - technology: Zeek/MTD rule pseudocode
    query: "ti = jspatch_hotpatch_feed(domains,ips,hashes);\nnet = zeek_dns/zeek_conn from ios_nai where\
      \ dest in ti;\nmtd = mtd_log where function in jspatch_hotpatch_set and app not_in allowlist;\n\
      writable_exec = ios_app fetch mime in [text/javascript, application/x-mach-o]\n                then\
      \ dlopen/dyld from (tmp|Caches);\nalert high when net or mtd or writable_exec;\nenrich mdm_owner,\
      \ app_inventory; output device, app, dest, indicator, path."
- question: Does JavaScript fetched by a non-browser iOS app exhibit drive-by/obfuscation features (high
    density of eval/document.write/unescape, many or long dynamic code executions, high deobfuscation
    ratios) above benign thresholds?
  context: Malicious hot-patch JS that rewrites native behavior typically shows the same obfuscation signatures
    as drive-by exploit scripts. For JavaScript fetched by non-browser iOS apps (per-app VPN/gateway capture),
    apply [JSAND/Wepawet](https://sites.cs.ucsb.edu/~chris/research/doc/www10_jsand.pdf) signature features
    such as the density of eval/document.write/unescape, the number and length of dynamic code executions,
    and deobfuscation ratios, and alert when these exceed benign thresholds. This is the canonical signal
    that downloaded JS will rewrite or execute native behavior, as described in the [FireEye JSPatch](https://www.fireeye.com/blog/threat-research/2016/01/hot_or_not_the_bene.html)
    research. Include the matched features and script size in the alert so an analyst can judge whether
    the payload is a benign config script or an obfuscated patcher.
  answer_sources:
  - Mobile Threat Defense (MTD) logs
  - Zeek dns.log
  - Zeek conn.log
  - MDM application inventory logs
  - 'NAI: Managed iOS mobile devices enrolled in MDM/MTD solutions and their associated network traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'js = javascript_fetched_by(non_browser_ios_app);  # per-app VPN/gateway capture

      feat = jsand_features(eval_density, docwrite, unescape, dyn_exec_count, dyn_exec_len, deobf_ratio);

      alert when feat exceeds benign_thresholds;

      output device, app, script_size, matched_features.'
- question: Did a non-browser iOS app query a newly observed, high-entropy domain (entropy > 4.0) or a
    rare TLD (.zip/.mov/.link) not on the approved list, followed by a download larger than 1MB?
  context: DGA-style and abuse-prone TLDs are common staging points for iOS code delivery. For DNS queries
    from the iOS NAI (Zeek dns.log), compute Shannon entropy and the [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/ndss11_exposure.pdf)
    lexical/answer/TTL features for newly observed domains (unseen in 30 days) and flag rare TLDs (.zip,
    .mov, .link) not on an approved list. Alert (medium) when a non-browser app queries a domain with
    entropy > 4.0 or a rare TLD AND a download exceeding 1MB follows (Volume). Track NXDOMAIN/SERVFAIL
    rates per app as a distinct failure-mode signal of DGA-style fallback. Derive entropy cutoffs from
    your own baseline. The combination of a rare domain and a large subsequent transfer is the actionable
    lead.
  answer_sources:
  - Mobile Threat Defense (MTD) logs
  - Zeek dns.log
  - Zeek conn.log
  - MDM application inventory logs
  - 'NAI: Managed iOS mobile devices enrolled in MDM/MTD solutions and their associated network traffic.'
  range: Last 90 days, with 30-day new-domain window
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'dns = zeek_dns from ios_nai where app != browser;

      new_dom = domains unseen_in_30d; ent = shannon(domain);

      feat = exposure_features(domain);  # lexical, answer, ttl

      rare_tld = tld in [''.zip'',''.mov'',''.link''] and not in approved_list;

      vol = following_download_bytes > 1MB;

      alert medium when (ent > 4.0 or rare_tld) and vol;

      track nxdomain/servfail rate per app; output app, domain, entropy, tld, bytes.'
- question: Does an iOS app's outbound connection count or byte volume exceed its 95% time-series prediction
    interval for more than 10 minutes, especially when coincident with a suspicious-domain or executable-MIME
    trigger?
  context: Bulk code or follow-on payload retrieval shows up as anomalous outbound volume against an app's
    normal rhythm. Fit a per-app time-series model (SARIMA/Prophet) on at least 30 days of Zeek conn.log
    outbound connection counts and byte volume with daily/weekly seasonality. Alert (medium) when actual
    Volume exceeds the 95% prediction interval for more than 10 minutes, especially when coincident with
    a suspicious-domain or executable-MIME trigger. Validate on time-ordered data per [TESSERACT](https://www.usenix.org/system/files/sec19-pendlebury.pdf)
    and report predicted vs observed volume in the alert. Sustained over-forecast volume aligned with
    a risky destination strengthens the case for malicious dynamic-code delivery.
  answer_sources:
  - Mobile Threat Defense (MTD) logs
  - Zeek dns.log
  - Zeek conn.log
  - MDM application inventory logs
  - 'NAI: Managed iOS mobile devices enrolled in MDM/MTD solutions and their associated network traffic.'
  range: Last 90 days, with >=30-day seasonal training
  queries:
  - technology: SIEM/Stats pseudocode
    query: "series = zeek_conn outbound (conn_count, bytes) by app, time_window;\nmodel = SARIMA/Prophet(series,\
      \ daily+weekly_seasonality);\nalert medium when observed > pred_interval_95 for >10m,\n  boost when\
      \ coincident_with(suspicious_domain or exec_mime_event);\noutput app, observed, predicted, deviation_minutes."
- question: Does a supervised classifier score an iOS session as a hot-patch/dynamic-code download above
    the tuned probability threshold, based on domain, MIME, payload, JS-feature, and dyld/dlopen-from-writable-path
    signals?
  context: To catch iOS hot-patch delivery that evades individual rules, combine the signals into a model.
    Train a supervised classifier ([EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/ndss11_exposure.pdf)-style
    decision tree or gradient boosting) over per-session features such as destination domain age/entropy,
    MIME type, payload size, content-type=text/javascript, [JSAND](https://sites.cs.ucsb.edu/~chris/research/doc/www10_jsand.pdf)
    JS-feature scores, app-is-non-browser, and the dyld/dlopen-from-writable-path flag, to score iOS hot-patch/dynamic-code
    download sessions. Alert above a tuned probability and emit the top-3 contributing features. Per [TESSERACT](https://www.usenix.org/system/files/sec19-pendlebury.pdf),
    use time-ordered splits, monitor drift, and retrain on recent samples. The explanations let an analyst
    confirm whether the score is driven by the destination, the payload type, or the writable-path execution.
  answer_sources:
  - Mobile Threat Defense (MTD) logs
  - Zeek dns.log
  - Zeek conn.log
  - MDM application inventory logs
  - 'NAI: Managed iOS mobile devices enrolled in MDM/MTD solutions and their associated network traffic.'
  range: Last 90 days, with time-ordered splits and drift monitoring
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [domain_age, domain_entropy, mime, payload_size, is_text_javascript,\n        \
      \    jsand_scores, app_is_non_browser, dyld_dlopen_from_writable];\nmodel = GradientBoosting/DecisionTree(time_ordered_split);\n\
      score = model.predict_proba(session);\nalert when score > tuned_threshold; explain = top3_features;\n\
      monitor drift, retrain recent; output session, score, explain."
