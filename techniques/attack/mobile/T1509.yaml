name: 'T1509: Non-Standard Port'
id: f96b36f0-bb47-49ca-befc-008f593f2dd1
description: Investigate adversary command-and-control over mobile devices (Android and iOS) where traffic
  uses a recognizable application protocol on a destination port that does not match the standard IANA/enterprise
  protocol-to-port mapping (e.g., TLS/SSL or HTTP carried on TCP/8080, 8088, or 587 instead of 443). Adversaries
  shift to non-standard ports to bypass egress filtering and frustrate analysis. This playbook helps an
  analyst correlate network telemetry visible at corporate/guest Wi-Fi, VPN termination points, UEM/CASB
  inspection points, and Internet gateway proxies with mobile device state. It covers port-independent
  protocol identification (Zeek dynamic protocol detection / nDPI), persistent TLS/JA3/JA4 implant fingerprinting
  across port changes, statistical baselining of rare service-port pairings, beaconing detection via low-variance
  timing and spectral analysis, failed/blocked egress profiling, anomalous certificate and TLS-handshake
  analysis, and explainable machine-learning classification and clustering of encrypted flows. It blends
  deterministic symbolic-logic rules, statistical methods, and ML so an analyst can confirm non-standard-port
  C2, attribute the flow to a mobile app, and scope affected devices.
type: technique
related:
- tactic_id: TA0037
  tactic_name: Command and Control
