questions:
- question: Is any mobile device connection identified by port-independent protocol detection (Zeek dynamic
    protocol detection / nDPI) as a service such as 'ssl', 'http', or 'dns' while using a destination
    port that is outside the approved IANA/enterprise protocol-to-port map (for example 'ssl' observed
    on TCP/8080 or TCP/8088 instead of 443)?
  context: For the Command and Control tactic, adversaries deliberately run a normal protocol over an
    abnormal port to slip past simple port-based egress filters. The defensive answer is to identify the
    TRUE application protocol regardless of port using Zeek's dynamic protocol detection or nDPI, then
    deterministically alert whenever the detected service appears on a port outside an approved allow-list,
    scoped to mobile DHCP/VPN/UEM-proxy source ranges. The analyst should maintain the protocol-to-port
    map as a hard allow-list and tune known exceptions (corporate proxy/relay, developer tooling) rather
    than deleting entries, and enrich hits with C2 threat intelligence and nDPI flow-risk flags. A positive
    result is a high-fidelity indicator of evasion; a negative result only means no mismatch was seen
    on inspected egress and does not rule out C2 on uninspected cellular/public Wi-Fi paths.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Threat intelligence indicators
  - 'NAI: Corporate and guest Wi-Fi network segments, VPN termination points, Unified Endpoint Management
    (UEM) traffic inspection points, and Internet gateway proxies where mobile device traffic is visible.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      // Zeek dynamic protocol detection / nDPI
      for conn in conn.log where id.orig_h in MOBILE_DHCP_VPN_UEM_RANGES:
        proto = detected_service(conn)   // 'ssl','http','dns' regardless of port
        if proto in APPROVED_MAP and conn.id.resp_p not in APPROVED_MAP[proto]
           and not matches_exception(conn):  // corp proxy/relay/dev tooling
          enrich(conn, threat_intel, ndpi_flow_risk)
          alert('protocol-vs-port mismatch', proto, conn.id.resp_p)
- question: Does any known-malicious TLS implant fingerprint (JA3/JA3S or JA4/JA4T) appear on a non-standard
    destination port originating from a mobile device IP, regardless of the specific port chosen?
  context: Because TLS client/server fingerprints persist across destination-port changes, they let the
    analyst detect a known implant even after the adversary shifts ports to evade port-based controls
    during Command and Control. Compute JA3/JA3S and JA4/JA4T fingerprints on mobile egress and alert
    when a fingerprint matching a known-malicious implant appears on any non-standard port. JA4 is preferred
    where TLS extension randomization in modern clients degrades JA3 stability. A positive result strongly
    implicates a specific malware family or tool; a negative result does not clear the host because benign-looking
    or novel fingerprints may still be malicious, so corroborate with baseline rarity and certificate
    analysis.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Threat intelligence indicators
  - 'NAI: Corporate and guest Wi-Fi network segments, VPN termination points, Unified Endpoint Management
    (UEM) traffic inspection points, and Internet gateway proxies where mobile device traffic is visible.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      // fingerprints persist across port changes
      for conn in ssl.log join conn.log where id.orig_h in MOBILE_RANGES:
        fp = ja4 or ja4t or ja3 or ja3s
        if fp in KNOWN_MALICIOUS_IMPLANT_FPS and conn.id.resp_p not in standard_ports(service):
          alert('known implant fingerprint on non-standard port', fp, conn.id.resp_p)
- question: Which mobile connections use a (service, destination-port) pairing that is statistically rare
    (below the 5th percentile) when measured against a 30-day frequency baseline of observed service-port
    pairings?
  context: Rare protocol-to-port combinations are a statistical signal of evasive Command and Control
    because legitimate apps overwhelmingly use standard ports. The analyst builds a 30-day frequency baseline
    of (service, id.resp_p) pairs and alerts when a mobile connection's pairing falls below the 5th percentile
    of observed frequency. The percentile cut should be derived per environment, and known benign periodic
    services characterized in campus-edge baselines should be excluded to control false positives. A positive
    result flags an unusual pairing worth deeper review; a negative result means the pairing is common
    in this environment, though commonality can be poisoned if an adversary has long-running activity,
    so pair this with beaconing and certificate checks.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Threat intelligence indicators
  - 'NAI: Corporate and guest Wi-Fi network segments, VPN termination points, Unified Endpoint Management
    (UEM) traffic inspection points, and Internet gateway proxies where mobile device traffic is visible.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline = freq_30d(service, id.resp_p) over MOBILE_RANGES
      for conn in conn.log where id.orig_h in MOBILE_RANGES:
        pair_freq = baseline.percentile(conn.service, conn.id.resp_p)
        if pair_freq < P5 and not benign_periodic(conn):
          alert('rare service-port pair', conn.service, conn.id.resp_p)
- question: Is any mobile source IP generating a rising ratio of failed, RST, or blocked connection attempts
    (and TLS handshake alerts) toward a single destination IP and non-standard port within short windows
    (for example more than 30% of attempts failing in a 10-minute window)?
  context: 'Failed or blocked egress to a non-standard port is a distinct early Command-and-Control staging
    signal: an implant attempting to reach a dormant, unreachable, or firewalled C2 node generates repeated
    failures before any session succeeds. The analyst tracks the per-source rate of failed/RST/blocked
    connections and TLS handshake alerts to non-standard ports per 10-minute window and alerts on a rising
    failure ratio toward a single destination/port. A positive result can reveal C2 infrastructure before
    a successful beacon and is valuable for proactive blocking; a negative result simply means no notable
    failure clustering, which is expected for healthy hosts.'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Threat intelligence indicators
  - 'NAI: Corporate and guest Wi-Fi network segments, VPN termination points, Unified Endpoint Management
    (UEM) traffic inspection points, and Internet gateway proxies where mobile device traffic is visible.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      window = 10m
      for src in MOBILE_RANGES:
        fails = count(failed|RST|blocked conns or tls_handshake_alerts
                      from src to (dst,nonstd_port)) in window
        total = count(all attempts from src to (dst,nonstd_port)) in window
        if total>0 and fails/total > 0.30:
          alert('rising non-standard-port egress failure ratio', src, dst, port)
- question: Does a supervised machine-learning classifier (Random Forest over conn.log/TLS features) score
    any mobile non-standard-port flow above 0.85 probability of being malicious, and do the top-3 SHAP-ranked
    features and app attribution corroborate the verdict?
  context: Deterministic rules miss novel or carefully blended non-standard-port C2, so a trained Random
    Forest over features such as true-protocol-versus-port flag, id.resp_p, bytes_orig/bytes_resp ratio,
    duration, connections per minute, JA4, and app identity provides probabilistic coverage for Command
    and Control. Alert when probability exceeds 0.85 and require the alert to surface the top-3 SHAP-ranked
    contributing features (e.g., protocol-port mismatch, byte ratio, rare JA4) so the analyst can validate
    the reasoning, and attribute the flow to an app via mobile-app fingerprinting to compare against that
    app's expected port profile. A positive, well-explained result with mismatched app behavior is strong
    evidence; a negative result lowers but does not eliminate suspicion, so retain rule and statistical
    signals as a floor.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Threat intelligence indicators
  - 'NAI: Corporate and guest Wi-Fi network segments, VPN termination points, Unified Endpoint Management
    (UEM) traffic inspection points, and Internet gateway proxies where mobile device traffic is visible.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      features = [true_proto_vs_port_flag, id.resp_p, bytes_orig/bytes_resp,
                  duration, conns_per_min, ja4, app_identity]
      score = RandomForest.predict_proba(features)
      if score > 0.85:
        top3 = shap_top_features(features, n=3)
        app = mobile_app_fingerprint(flow)
        alert('ML non-standard-port C2', score, top3, app_vs_expected_port_profile(app))
- question: Did any mobile device issue a DNS query with high character entropy (greater than 3.5, consistent
    with domain-generation algorithms) followed within 60 seconds by a connection to the resolved IP on
    a non-standard port?
  context: DGA-driven name resolution feeding a non-standard-port connection is a classic Command-and-Control
    rendezvous pattern. The analyst flags DNS queries with character entropy above 3.5 from mobile IPs
    and alerts when a connection to the resolved IP on a non-standard port occurs within a 60-second window,
    implemented as a Zeek/Sigma join across dns.log and conn.log. A positive result tightly couples algorithmic
    domain generation to evasive egress and is high-confidence C2; a negative result means no such tight
    DNS-to-connection correlation was observed, though adversaries using static domains or DNS over HTTPS
    may evade this specific join.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Threat intelligence indicators
  - 'NAI: Egress points for all corporate and guest networks, specifically monitoring subnets allocated
    to mobile devices via DHCP for Wi-Fi or VPN pools, and Cloud Access Security Broker (CASB) logs.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      for q in dns.log where id.orig_h in MOBILE_RANGES and entropy(q.query) > 3.5:
        for c in conn.log where c.id.resp_h == resolved_ip(q)
           and c.id.resp_p not in standard_ports
           and 0 <= c.ts - q.ts <= 60s:
          alert('DGA-like DNS to non-standard port', q.query, c.id.resp_p)
- question: Are there more than 10 connections within a 60-minute window from a single mobile source to
    the same destination IP and non-standard port that show low-variance inter-arrival timing (stddev
    under 2 seconds) and consistently short durations (stddev under 1 second), characteristic of automated
    beaconing?
  context: Regular, low-jitter, short connections are the hallmark of automated C2 beaconing rather than
    human-driven traffic, making this a core Command-and-Control detection. The analyst computes per-(src,dst,port)
    statistics in 60-minute windows and alerts when connection count exceeds 10 with inter-arrival stddev
    under 2 seconds and duration stddev under 1 second (low coefficient of variation), tuning counts and
    CV thresholds to the environment's benign periodic baseline. A positive result strongly indicates
    an active beacon; a negative result does not clear the host because adversaries add jitter, which
    the spectral-analysis question is designed to catch.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Threat intelligence indicators
  - 'NAI: Egress points for all corporate and guest networks, specifically monitoring subnets allocated
    to mobile devices via DHCP for Wi-Fi or VPN pools, and Cloud Access Security Broker (CASB) logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      window = 60m
      for (src,dst,port) where port not in standard_ports:
        c = conns in window; iat = inter_arrival_times(c)
        if len(c) > 10 and stddev(iat) < 2s and stddev(duration(c)) < 1s:
          alert('low-variance beacon', src, dst, port, len(c))
- question: Do any per-(src,dst,port) contact time series exhibit a dominant period with high spectral
    power under FFT/autocorrelation analysis, indicating a jittered beacon that defeats simple standard-deviation
    thresholds?
  context: Sophisticated implants randomize callback intervals (jitter) specifically to evade fixed timing
    thresholds, so spectral analysis of the contact time series is needed to expose the underlying periodicity
    for Command and Control. The analyst applies FFT/autocorrelation to the per-(src,dst,port) contact
    series, ranks flows with a dominant period and high spectral power, and suppresses known benign periodic
    services. This method is robust regardless of port or protocol. A positive result reveals hidden periodicity
    consistent with beaconing even when stddev tests fail; a negative result suggests no strong periodic
    component, though very low-rate or long-period beacons may need longer observation windows.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Threat intelligence indicators
  - 'NAI: Egress points for all corporate and guest networks, specifically monitoring subnets allocated
    to mobile devices via DHCP for Wi-Fi or VPN pools, and Cloud Access Security Broker (CASB) logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for (src,dst,port):
        ts = contact_time_series(src,dst,port)
        spec = fft(autocorrelation(ts))
        if dominant_period(spec) and spectral_power(spec) > THRESH
           and not benign_periodic(src,dst,port):
          alert('jittered beacon (spectral)', src, dst, port, dominant_period(spec))
- question: Treating failed/RST connection attempts to a non-standard port as their own time series, do
    they recur at regular (low-jitter) intervals while the device is locked or the app is backgrounded,
    indicating a dormant or unreachable C2 implant retrying contact?
  context: 'A retry cadence in failed connections is a distinct state-based Command-and-Control signal:
    an implant whose C2 is currently down or blocked will still attempt to call home on a fixed schedule,
    and doing so while the device is locked or the app is backgrounded removes the human-activity explanation.
    The analyst builds a time series of failed/RST attempts to a non-standard port and looks for regular
    retry intervals correlated with locked/backgrounded device state. A positive result indicates an implant
    present but not currently connected, which is valuable for finding compromise before successful exfiltration;
    a negative result means no patterned retries were observed.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Threat intelligence indicators
  - 'NAI: Egress points for all corporate and guest networks, specifically monitoring subnets allocated
    to mobile devices via DHCP for Wi-Fi or VPN pools, and Cloud Access Security Broker (CASB) logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for (src,dst,port) where port not in standard_ports:
        fails_ts = time_series(failed|RST attempts)
        if regular_interval(fails_ts) and low_jitter(fails_ts)
           and device_locked_or_app_backgrounded(src):
          alert('failed-beacon retry cadence (dormant C2)', src, dst, port)
- question: Does a time-series anomaly model over per-minute connection counts and byte volumes per (src,dst,port)
    tuple flag periodic patterns inconsistent with human-driven traffic, with the contributing temporal
    features surfaced for review?
  context: Machine-learning temporal modeling captures beaconing shapes that fixed thresholds and single-frequency
    spectral tests miss, extending Command-and-Control coverage to subtle or evolving cadences. The analyst
    applies a single-flow temporal-feature or time-series anomaly model to per-minute connection counts
    and byte volumes per tuple and flags periodic patterns inconsistent with human-driven traffic, surfacing
    the contributing temporal features (period, byte volume, count) in the alert for explainability. A
    positive, well-explained result indicates automated machine-to-machine cadence worth investigating;
    a negative result lowers suspicion but should be combined with deterministic and statistical signals.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Threat intelligence indicators
  - 'NAI: Egress points for all corporate and guest networks, specifically monitoring subnets allocated
    to mobile devices via DHCP for Wi-Fi or VPN pools, and Cloud Access Security Broker (CASB) logs.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      series = per_minute(conn_count, byte_volume) per (src,dst,port)
      score = TimeSeriesAnomalyModel.predict(series)
      if score.anomalous and periodic_nonhuman(series):
        alert('ML periodic non-standard-port traffic', tuple,
              features=[period, byte_volume, count])
- question: Does any SSL/TLS connection from a mobile device IP to a non-standard port present a server
    certificate whose validation status is not 'ok' (for example self-signed) or whose validity period
    is less than 90 days?
  context: Invalid, self-signed, or very short-lived certificates on non-standard ports are common in
    adversary C2 because operators stand up disposable infrastructure, making this a strong deterministic
    Command-and-Control signal. The analyst joins conn/ssl/x509 logs and alerts on non-standard ports
    where validation_status is not 'ok' or certificate validity is under 90 days, enriching with issuer
    deny-lists and nDPI flow-risk indicators. A positive result is high-fidelity given the combination
    of non-standard port plus suspect certificate; a negative result does not clear the host because adversaries
    increasingly use valid, automatically issued certificates, so corroborate with fingerprint rarity
    and flow features.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek x509.log
  - Threat intelligence indicators
  - 'NAI: Network sensors with Deep Packet Inspection (DPI) at Internet gateways, SSL/TLS decryption zones,
    VPN concentrators, and forward proxies. UEM solutions with traffic inspection capabilities are also
    a key NAI.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      for c in conn.log join ssl.log join x509.log
         where c.id.orig_h in MOBILE_RANGES and c.id.resp_p not in standard_ports:
        if x509.validation_status != 'ok'  // e.g. self-signed
           or cert_validity_days(x509) < 90:
          enrich(c, issuer_denylist, ndpi_flow_risk)
          alert('invalid/short-lived cert on non-standard port', c.id.resp_p)
- question: Which mobile TLS connections on non-standard ports use a JA3/JA3S or JA4 fingerprint that
    is statistically rare (below the 1st percentile) against the environment's 30-day fingerprint baseline?
  context: Rare TLS fingerprints concentrated on non-standard ports point to non-standard client stacks
    such as malware TLS libraries, supporting Command-and-Control detection through baseline deviation.
    The analyst maintains 30-day JA3/JA3S and JA4 baselines and alerts when a fingerprint falls below
    the 1st percentile for mobile connections on non-standard ports, preferring JA4 where browser TLS
    extension randomization erodes JA3 stability. A positive result highlights an unusual TLS client worth
    attribution; a negative result means the fingerprint is common in this environment, though widespread
    benign libraries can mask malicious reuse, so combine with certificate and timing signals.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek x509.log
  - Threat intelligence indicators
  - 'NAI: Network sensors with Deep Packet Inspection (DPI) at Internet gateways, SSL/TLS decryption zones,
    VPN concentrators, and forward proxies. UEM solutions with traffic inspection capabilities are also
    a key NAI.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline = freq_30d(ja3|ja3s|ja4) over MOBILE_RANGES
      for c in ssl.log where id.orig_h in MOBILE_RANGES and id.resp_p not in standard_ports:
        fp = ja4 or ja3
        if baseline.percentile(fp) < P1:
          alert('rare TLS fingerprint on non-standard port', fp, c.id.resp_p)
- question: When TLS 1.3 encrypts handshake fields and fingerprints weaken, do version-agnostic flow features
    (packet-size sequences, timing, bytes_orig/bytes_resp ratio) score any mobile non-standard-port session
    as anomalous?
  context: Modern TLS 1.3 hides handshake details that JA3/JA4 rely on, so version-agnostic flow features
    are needed to keep detecting encrypted Command and Control on non-standard ports. The analyst scores
    sessions using features that survive encryption and port changes, such as packet-size sequences, timing,
    and byte ratios between origin and responder. A positive result flags an encrypted session whose shape
    resembles C2 despite weak fingerprints; a negative result means the flow shape looks benign, though
    low-and-slow C2 may need longer aggregation to manifest distinguishing flow features.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek x509.log
  - Threat intelligence indicators
  - 'NAI: Network sensors with Deep Packet Inspection (DPI) at Internet gateways, SSL/TLS decryption zones,
    VPN concentrators, and forward proxies. UEM solutions with traffic inspection capabilities are also
    a key NAI.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      // TLS 1.3: handshake encrypted, fingerprints weak
      features = [packet_size_sequence, inter_packet_timing, bytes_orig/bytes_resp]
      score = flow_feature_model.score(features)   // version- and port-agnostic
      if score.anomalous and id.resp_p not in standard_ports:
        alert('encrypted C2 by flow features', tuple, score)
- question: Do unsupervised clustering or outlier models (DBSCAN, Isolation Forest, or One-Class SVM)
    over TLS-plus-flow features flag any mobile non-standard-port session as an outlier or member of a
    small anomalous cluster, with the top-3 LIME/SHAP features explaining the anomaly?
  context: One-class and clustering models baseline normal mobile egress and are robust to novel implants
    that signature and rule approaches miss, broadening Command-and-Control coverage. The analyst runs
    DBSCAN/Isolation Forest or One-Class SVM over features such as validation status, certificate validity,
    non-standard-port flag, JA4, duration, and byte ratio to flag outliers or small clusters, and emits
    the top-3 LIME/SHAP-ranked features driving each anomaly for analyst validation. A positive, explained
    outlier indicates a session unlike normal mobile traffic and warrants investigation; a negative result
    means the session fits the learned normal profile, which can be subverted by long-running low-volume
    activity.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek x509.log
  - Threat intelligence indicators
  - 'NAI: Network sensors with Deep Packet Inspection (DPI) at Internet gateways, SSL/TLS decryption zones,
    VPN concentrators, and forward proxies. UEM solutions with traffic inspection capabilities are also
    a key NAI.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      features = [validation_status, cert_validity, nonstd_port_flag, ja4,
                  duration, bytes_orig/bytes_resp]
      labels = DBSCAN.fit(features)  // or IsolationForest / OneClassSVM
      for f where outlier(f) or small_cluster(f):
        top3 = lime_or_shap_top(f, n=3)
        alert('anomalous TLS session', f.tuple, top3)
- question: Does a self-supervised or contrastive anomaly model over encrypted-flow features flag any
    malicious-looking non-standard-port TLS session where payload cannot be inspected, with app attribution
    used to suppress benign app traffic?
  context: When payload inspection is impossible (encryption, no decryption zone), self-supervised/contrastive
    anomaly detection over encrypted-flow features still surfaces malicious non-standard-port TLS sessions,
    preserving Command-and-Control visibility. The analyst applies the model to encrypted flow features
    and attributes flows to apps via mobile fingerprinting (e.g., FlowPrint) so benign app traffic can
    be suppressed and true anomalies elevated. A positive result, especially where the attributed app's
    expected behavior does not match, is strong evidence of covert C2; a negative result reduces suspicion
    but should be weighed alongside certificate, fingerprint, and beaconing signals.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek x509.log
  - Threat intelligence indicators
  - 'NAI: Network sensors with Deep Packet Inspection (DPI) at Internet gateways, SSL/TLS decryption zones,
    VPN concentrators, and forward proxies. UEM solutions with traffic inspection capabilities are also
    a key NAI.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      // no payload visibility
      z = SelfSupervisedEncoder(encrypted_flow_features)
      if contrastive_anomaly_score(z) > THRESH:
        app = mobile_app_fingerprint(flow)  // FlowPrint
        if not benign_for_app(app, flow):
          alert('encrypted non-standard-port anomaly', flow.tuple, app)
