name: 'T1456: Drive-By Compromise'
id: 742bc5ff-2304-4fd3-99ea-6bd4d36c5b20
description: 'Investigate whether a corporate-connected mobile device (Android or iOS) was compromised
  via a drive-by or watering-hole attack, in which a user visiting a website is silently served malicious
  code that targets the browser or an embedded WebView. This playbook helps an analyst hunt the tell-tale
  network and host artifacts of such attacks: requests to suspicious, newly registered, or high-entropy
  domains arriving with trusted referers (the watering-hole pattern); malicious or exploit-kit TLS client
  fingerprints; obfuscated or oversized JavaScript payloads delivered to mobile clients; rapid multi-hop
  redirect chains that originate from ad networks and terminate at short-lived exploit servers; exploit-kit
  URI patterns fetched with no referer for scripts or binaries; and the failure-mode bursts (NXDOMAIN,
  4xx/blocked responses) produced by cloaking, fast-flux, and version-probing infrastructure. It combines
  symbolic-logic rules, statistical baselining, and machine-learning scoring across Zeek network telemetry,
  threat intelligence, WHOIS data, web-proxy logs, and mobile EDR/MDM signals so a SOC analyst can confirm
  or rule out an initial-access drive-by compromise.'
type: technique
related:
- tactic_id: TA0027
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a mobile device (iOS or Android User-Agent) make an HTTP/S request to a known-malicious
    or blocklisted domain where the Referer header was a trusted internal site or a high-traffic external
    site, indicating a watering-hole redirection?
  context: 'This question hunts the classic watering-hole pattern for Initial Access: a user browses to
    a site they trust, and a compromised page or malicious ad on it silently redirects their mobile browser
    to attacker exploit-delivery infrastructure. Join Zeek http.log against threat-intel feeds and curated
    deny-lists of documented mobile-exploit-delivery domains (seed from NSO/Pegasus redirect and exploit
    servers). A positive result is an http.log record whose host is on a malicious/blocklisted domain,
    whose user_agent indicates a mobile OS, and whose referer is a trusted internal or popular external
    site - exactly the chain an analyst expects when a legitimate page hands a victim off to exploit infrastructure.
    A negative result (no such joins) lowers but does not eliminate suspicion, since deny-lists lag novel
    infrastructure; pivot to the statistical and ML methods below.'
  answer_sources: &id001
  - Zeek http.log
  - Zeek dns.log
  - Zeek conn.log
  - Threat Intelligence Feed
  - WHOIS Data
  - 'NAI: Corporate Wi-Fi network gateways, VPN concentrators, Cloud Access Security Broker (CASB) egress
    points, and central DNS resolvers used by mobile devices.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "LOAD threat_intel_malicious_domains, mobile_exploit_delivery_denylist\nFROM zeek_http\nWHERE\
      \ user_agent MATCHES /(iPhone|iPad|Android|Mobile)/\n  AND host IN (threat_intel_malicious_domains\
      \ UNION mobile_exploit_delivery_denylist)\n  AND referer_host IN (trusted_internal_sites UNION high_traffic_sites)\n\
      EMIT ALERT severity=high WITH uid, src_ip, host, referer, user_agent, ts"
  - technology: SIEM/Rule pseudocode
    query: 'index=zeek_http

      | where match(user_agent, "iPhone|iPad|Android|Mobile")

      | lookup ti_domains host OUTPUT verdict

      | where verdict="malicious" AND referer_host IN (trusted_list)

      | table _time uid src_ip host referer user_agent'
- question: Did any mobile device negotiate a TLS session whose JA3 or JA4 client fingerprint matches
    a known exploit-kit or implant TLS stack, even if the destination domain or SNI looks benign?
  context: Exploit kits and mobile implants frequently use custom or atypical TLS client libraries that
    produce distinctive JA3/JA4 fingerprints regardless of the destination they contact. Computing JA3
    (and the more version-resilient JA4) on TLS handshakes from mobile devices and matching against deny-lists
    of known malicious client stacks catches exploit/implant traffic even when adversaries front their
    infrastructure with innocuous-looking SNIs or domain fronting. A positive result - a mobile-sourced
    handshake whose fingerprint is on the deny-list - is a high-confidence indicator that the device is
    running implant or exploit-kit code; correlate with the destination IP/ASN and timeline against any
    preceding browsing. A negative result is expected for ordinary browser traffic, which produces common,
    well-known fingerprints.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'FROM zeek_ssl JOIN zeek_conn ON uid

      WHERE is_mobile_device(src_ip)

      COMPUTE ja3 = ja3_hash(client_hello), ja4 = ja4_hash(client_hello)

      WHERE ja3 IN exploit_implant_ja3_denylist OR ja4 IN exploit_implant_ja4_denylist

      EMIT ALERT WITH uid, src_ip, server_name, dst_ip, ja3, ja4, ts'
  - technology: SIEM/Rule pseudocode
    query: 'index=zeek_ssl mobile=true

      | lookup ja3_denylist ja3 OUTPUT family

      | lookup ja4_denylist ja4 OUTPUT family4

      | where isnotnull(family) OR isnotnull(family4)

      | table _time uid src_ip server_name ja3 ja4 family'
- question: Did a mobile device request a non-allowlisted domain whose WHOIS registration age is below
    the rolling 5th-percentile, or whose domain-name lexical entropy is above the rolling 95th-percentile,
    especially when the Referer is a different high-reputation site?
  context: Drive-by and watering-hole operators register throwaway domains shortly before use and often
    auto-generate random-looking names. This statistical method flags domains that are unusually young
    or unusually high-entropy relative to a 7-day rolling baseline of all newly observed domains, and
    prioritizes cases where the referer is a different high-reputation site (the cross-site handoff of
    a watering hole). Maintain a 7-day rolling 5th-percentile of WHOIS registration age and a 95th-percentile
    of lexical entropy; alert when a mobile User-Agent requests a domain below the age percentile or above
    the entropy percentile. Use entropy/Levenshtein features and KL-divergence against expected character
    distributions to suppress false positives on legitimate random-looking CDN hostnames. A positive result
    warrants pivoting to the http/files logs to see what was fetched; a clustered burst of such requests
    across many devices suggests an active campaign.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_dns WHERE NOT allowlisted(query) AND is_mobile_device(src_ip)\nENRICH age = whois_age_days(query),\
      \ ent = lexical_entropy(query),\n       kl = kl_divergence(query, expected_char_dist)\nWINDOW rolling\
      \ 7d: age_p5 = pctl(age,5), ent_p95 = pctl(ent,95)\nWHERE age < age_p5 OR ent > ent_p95\nBOOST IF\
      \ referer_host IS high_reputation AND referer_host != query\nEMIT ALERT WITH uid src_ip query age\
      \ ent referer"
- question: Did a mobile device generate an anomalous burst of DNS NXDOMAIN responses or HTTP 4xx/blocked-connection
    results to newly observed or ad/redirect domains, exceeding its own baseline?
  context: 'Cloaking, fast-flux, and short-lived exploit servers produce a distinctive failure-mode signature:
    a device repeatedly fails to resolve or connect to a churn of throwaway domains before (or instead
    of) a successful exploit fetch. Track per-device rates of NXDOMAIN responses and HTTP 4xx/blocked
    results to newly observed or ad/redirect domains over 5-minute windows, and alert when the failure
    count exceeds 3 standard deviations above that device''s established baseline. A positive result -
    an abnormal failure burst - is an early warning that exploit-delivery infrastructure is being probed
    or rotated; correlate the window with any subsequent successful download or process anomaly. A quiet
    baseline argues against active drive-by delivery during the window.'
  answer_sources: *id001
  range: Last 90 days; evaluate in rolling 5-minute windows per device
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_dns, zeek_http WHERE is_mobile_device(src_ip)\nDEFINE fail = (dns.rcode==NXDOMAIN)\
      \ OR (http.status_code IN 4xx) OR blocked\n       AND dest IN (newly_observed_domains UNION ad_redirect_domains)\n\
      BIN window=5m BY src_ip\nAGG fail_count = count(fail)\nBASELINE mean,std per src_ip over Last 90\
      \ days\nWHERE fail_count > mean + 3*std\nEMIT ALERT WITH src_ip window fail_count baseline_mean"
- question: When scored by a supervised model over first-party request features (domain age, entropy,
    referer/destination TLD mismatch, ASN reputation, geolocation rarity, URL lexical features), does
    any mobile request exceed a malicious probability of 0.85?
  context: This method generalizes the symbolic and statistical signals into a single supervised risk
    score so novel drive-by infrastructure is caught without exact deny-list matches. Train a logistic-regression
    or random-forest classifier over first-party features - domain age, domain entropy, referer/destination
    TLD mismatch, ASN reputation, geolocation rarity, and URL lexical features - and, for raw URLs, layer
    a character+word CNN (URLNet) that needs no external lookups. Alert when the malicious probability
    exceeds 0.85 and surface the top-3 contributing features (for example domain age, TLD mismatch, entropy)
    in the alert text so the analyst can triage quickly. A high-probability hit on a mobile request, especially
    with a trusted referer, strongly supports a drive-by; review the contributing features and pivot to
    the file/redirect evidence.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "FROM zeek_http WHERE is_mobile_device(src_ip)\nFEATURES = [domain_age, domain_entropy, tld_mismatch(referer,host),\n\
      \            asn_reputation(dst_ip), geo_rarity(dst_ip), url_lexical(uri)]\np = model.predict_proba(FEATURES)\
      \   # logreg/random-forest; + URLNet on raw uri\nWHERE p > 0.85\nEMIT ALERT WITH uid src_ip host\
      \ p top3_features(FEATURES)"
- question: Did a JavaScript file extracted from mobile-device web traffic match a YARA signature for
    mobile exploit-kit, heap-spray, or obfuscation patterns (redirection/cloaking, deobfuscation, heap-spray,
    or exploitation phases)?
  context: Drive-by exploit chains move through four recognizable JavaScript phases - redirection/cloaking,
    deobfuscation, heap-spray, and exploitation - each of which can be signatured. Use Zeek to extract
    application/javascript and text/javascript files and scan them with YARA rules tuned for mobile exploit
    kits, heap-spray idioms, and obfuscation artifacts. A YARA match is a high-confidence indicator of
    exploit code in transit to a mobile device and should alert critically; pivot on the file's fuid and
    the associated http.log uid to identify the source domain, the victim device, and what happened next
    on the host. Absence of a match does not clear the traffic, since signatures miss novel or heavily
    obfuscated payloads - corroborate with the entropy/size and AST/lexical methods below.
  answer_sources: &id002
  - Zeek files.log
  - Zeek http.log
  - Zeek weird.log
  - Zeek signatures.log
  - 'NAI: Network egress points with Zeek sensors performing file extraction; Web Application Firewalls
    (WAFs) with file inspection capabilities; Mobile devices with MDM agents capable of network inspection.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM zeek_files WHERE mime_type IN (application/javascript, text/javascript)\n  AND is_mobile_device(linked_src_ip\
      \ via http.uid)\nEXTRACT file_bytes\nFOR rule IN yara_mobile_exploitkit_rules:\n  IF yara_scan(file_bytes,\
      \ rule): EMIT ALERT severity=critical\n    WITH fuid, http_uid, source_host, rule.name, phase"
- question: Did a JavaScript file from a given source host exceed both its 30-day size baseline and its
    entropy baseline (entropy >7.2 suggesting packing/encryption) by more than 2 standard deviations,
    with corroborating weird.log or signatures.log events on the same UID?
  context: Obfuscated or packed exploit JavaScript is typically far larger and far higher entropy than
    the scripts a site normally serves. Maintain a 30-day baseline of JS file size and Shannon entropy
    per source host; normal code sits around 5.0-6.5 entropy while packed/encrypted content trends above
    7.2. Alert when both size and entropy exceed 2 standard deviations above baseline, and escalate when
    a large_file_in_small_buffer notice in weird.log or a signatures.log event exists for the same UID.
    A positive result indicates an anomalous payload that does not fit the host's normal content profile
    - a strong drive-by indicator when paired with a suspicious referer or redirect chain. Per-host baselining
    keeps false positives low for sites that legitimately serve large bundled scripts.
  answer_sources: *id002
  range: Last 90 days; baselines computed over trailing 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_files WHERE mime_type LIKE \"%javascript%\"\nCOMPUTE size=total_bytes, ent=shannon_entropy(file_bytes)\n\
      BASELINE per source_host over 30d: size_mu,size_sd,ent_mu,ent_sd\nWHERE size > size_mu+2*size_sd\
      \ AND ent > ent_mu+2*ent_sd\nESCALATE IF EXISTS zeek_weird[uid] name=large_file_in_small_buffer\n\
      \         OR EXISTS zeek_signatures[uid]\nEMIT ALERT WITH fuid source_host size ent uid"
- question: Does a JavaScript file's JSAND/Prophiler-style feature set (eval/document.write/unescape counts,
    string definition-to-use ratio, longest-string length, whitespace ratio, heap-spray byte-allocation
    proxy) produce a composite anomaly score above the 95th percentile of benign scripts?
  context: 'Beyond raw size and entropy, the structure of malicious JavaScript is distinctive: heavy use
    of eval, document.write, and unescape; lopsided string definition-to-use ratios; very long strings;
    abnormal whitespace ratios; and large byte allocations via string operations that act as a heap-spray
    proxy. Compute this Prophiler/JSAND-style feature set per script and alert when the composite anomaly
    score exceeds the 95th percentile of benign scripts in your environment. A high score marks a script
    that behaves structurally like an exploit even if it evades YARA and falls within size/entropy norms.
    Use it as a fast pre-filter before heavier dynamic analysis, and corroborate with the source host''s
    reputation and referer chain.'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM extracted_js_files\nFEATURES = {eval_count, document_write_count, unescape_count,\n \
      \           string_def_to_use_ratio, longest_string_len,\n            whitespace_ratio, heap_spray_byte_alloc}\n\
      score = composite_anomaly(FEATURES)\nTHRESH = pctl(benign_scores, 95)\nWHERE score > THRESH\nEMIT\
      \ ALERT WITH fuid source_host score top_features"
- question: Does unsupervised clustering (DBSCAN) of JavaScript features flag a script as an outlier,
    or does a supervised AST/q-gram classifier (ZOZZLE naive-Bayes or Cujo linear-SVM) classify it as
    malicious?
  context: Where signatures and percentile thresholds miss novel obfuscation, machine learning over JavaScript
    features finds it. Apply DBSCAN to features such as size, entropy, obfuscated-call ratio, and long-string
    count to surface outliers that do not belong to any dense cluster of benign scripts; for higher-fidelity
    classification, deploy a naive-Bayes classifier over context-labeled JavaScript-AST features with
    eval-hook deobfuscation (ZOZZLE) or an inline linear-SVM over lexical token q-grams (Cujo). Surface
    the top-3 contributing AST tokens or q-grams in the alert so the analyst can see why the script was
    flagged. An outlier or positive classification, especially for a script delivered to a mobile device
    behind a suspicious redirect, strongly supports drive-by exploitation; clean classification of common
    library code is the expected negative.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'FROM extracted_js_files

      X = [size, entropy, obfuscated_call_ratio, long_string_count]

      labels = DBSCAN(eps, min_samples).fit_predict(X)

      outliers = WHERE labels == -1

      FOR f IN files: y = zozzle_nb(ast_features(f)) OR cujo_svm(qgrams(f))

      WHERE f IN outliers OR y == malicious

      EMIT ALERT WITH fuid source_host top3_ast_tokens'
- question: Did a mobile client follow an HTTP redirect chain of 3 or more hops within 5 seconds that
    started from an ad-network referer and terminated at a malicious/newly registered domain or a host
    with a mismatched server_name in ssl.log?
  context: Malvertising and watering-hole drive-bys deliver victims through short, automatic redirect
    cascades rather than user-driven clicks. Reconstruct redirect chains by uid in Zeek http.log (the
    automatic download-path structure described in WebWitness) and alert when a mobile User-Agent's chain
    has 3 or more hops within 5 seconds, begins at an ad-network referer, and ends at a malicious or newly
    registered domain - or at a host whose ssl.log server_name is mismatched. A positive result captures
    the automated handoff from legitimate ad infrastructure to exploit delivery; pivot to files.log and
    the terminal host to determine what was served. Legitimate navigation produces slower, shorter, user-initiated
    transitions, so genuine matches are relatively rare and high-value.
  answer_sources: &id003
  - Zeek http.log
  - Zeek dns.log
  - Web Proxy Logs
  - Zeek ssl.log
  - 'NAI: Network egress points instrumented with Zeek sensors, forward proxies, DNS resolvers, and upstream
    web proxies.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM zeek_http WHERE is_mobile_device(src_ip)\nRECONSTRUCT chain BY uid ORDER BY ts WHERE\
      \ status_code IN (301,302,307)\nWHERE len(chain) >= 3 AND (chain.end.ts - chain.start.ts) <= 5s\n\
      \  AND chain.start.referer_host IN ad_network_domains\n  AND (chain.end.host IN malicious_or_newly_registered\n\
      \       OR ssl_server_name_mismatch(chain.end))\nEMIT ALERT WITH uid src_ip chain_hosts hop_count\
      \ duration"
- question: Did a user's redirect chain exceed 3 standard deviations of their 14-day baseline length (or
    5 hops), particularly chains that cross more than two ASNs?
  context: Drive-by redirect paths are short, automatic cascades that often traverse multiple unrelated
    networks, distinct from normal user-driven navigation. Maintain a 14-day baseline of redirect-chain
    length and crossed-ASN count per user and alert when the length exceeds 3 standard deviations or 5
    hops, prioritizing chains that cross more than two ASNs. A positive result is a chain that is anomalously
    long or network-diverse for that user - the WebWitness signature of an automated malvertising or watering-hole
    cascade. This complements the symbolic redirect rule by catching chains that do not start from a known
    ad network or end at a known-bad domain, and the per-user baseline accommodates users with naturally
    heavier web activity.
  answer_sources: *id003
  range: Last 90 days; baselines over trailing 14 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM reconstructed_redirect_chains WHERE is_mobile_device(src_ip)

      COMPUTE hops=len(chain), asn_crossed=distinct_asn(chain)

      BASELINE per user over 14d: hop_mu, hop_sd

      WHERE hops > hop_mu+3*hop_sd OR hops >= 5

      PRIORITIZE WHERE asn_crossed > 2

      EMIT ALERT WITH uid src_ip hops asn_crossed chain_hosts'
- question: Did the rate of 4xx/blocked/timed-out terminal hops and NXDOMAIN at redirect-chain ends for
    a source domain spike more than 3 standard deviations above baseline?
  context: 'Malvertising redirect infrastructure is short-lived and cloaked, so the terminal hops of its
    chains fail at an abnormal rate as servers rotate or refuse non-targeted clients. Profile the rate
    of 4xx, blocked, or timed-out terminal hops and NXDOMAIN at chain ends per source domain over rolling
    windows, and alert on spikes exceeding 3 standard deviations above baseline. This is a distinct failure-mode
    signal: a surge of dead chain endpoints points to cloaking and fast-flux exploit servers even before
    a successful delivery is observed. Correlate any spike with the devices feeding those chains and with
    successful fetches in the same window to find victims who slipped through.'
  answer_sources: *id003
  range: Last 90 days; evaluate in rolling windows per source domain
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM reconstructed_redirect_chains\nDEFINE term_fail = chain.end.status IN (4xx) OR blocked\
      \ OR timed_out\n                   OR dns_nxdomain(chain.end.host)\nBIN window BY source_domain\n\
      AGG fail_rate = count(term_fail)/count(chain)\nBASELINE mean,std per source_domain\nWHERE fail_rate\
      \ > mean + 3*std\nEMIT ALERT WITH source_domain window fail_rate"
- question: Does a Seq2Seq LSTM autoencoder trained on redirect chains (per-hop time delta, status code,
    TLD, ASN, content-type) flag a chain with high reconstruction error, and do per-hop URL classifiers
    (URLNet/URLBERT) score any hop as malicious?
  context: The sequence and timing of hops in a redirect chain encode whether it was automatic exploit
    delivery or organic browsing. Train a Seq2Seq LSTM autoencoder on redirect chains with per-hop features
    - time delta, status code, TLD, ASN, content-type - and alert on chains with high reconstruction error,
    reporting the top-3 anomalous hops/features. Complement with URL classifiers (URLNet/URLBERT) scoring
    each hop URL so a single malicious-looking hop also raises the chain. A high reconstruction error
    means the chain's structure does not match learned benign patterns - a strong, signature-free indicator
    of an automated malvertising or watering-hole cascade. Use the flagged hops to focus the investigation
    on the terminal exploit host.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'FROM reconstructed_redirect_chains

      SEQ = per_hop_features(chain): [time_delta, status_code, tld, asn, content_type]

      err = lstm_autoencoder.reconstruction_error(SEQ)

      hop_scores = [urlnet(h.url) OR urlbert(h.url) FOR h IN chain]

      WHERE err > err_threshold OR max(hop_scores) > 0.9

      EMIT ALERT WITH uid chain_hosts err top3_anom_hops'
- question: Did a mobile User-Agent's HTTP request URI match a threat-intel regex for a known mobile exploit
    kit, especially a request for a script/binary (.js/.apk) with a null or unrelated Referer (the no-user-interaction
    fetch pattern)?
  context: Real iOS and Android watering-hole chains fetch exploit payloads with no user interaction,
    so the request for a script or binary often arrives with no referer or a referer from an unrelated
    domain. Apply threat-intel regexes for mobile exploit kits to the uri field of Zeek http.log and alert
    critically on matches from iOS/Android User-Agents; elevate when the referer is null and the request
    is for a .js or .apk. A match against a curated exploit-kit URI pattern is a high-confidence drive-by
    indicator; the referer-less script/binary fetch from a mobile UA is the corroborating behavioral tell
    documented in real iOS exploit chains. Pivot to the response and any extracted file to confirm delivery,
    and check the device's host telemetry for post-exploitation activity.
  answer_sources: &id004
  - Zeek http.log
  - Zeek signatures.log
  - Threat Intelligence Feed
  - 'NAI: Network egress points with Zeek sensors; web proxies; and MDM/UEM management gateways.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'LOAD exploit_kit_uri_regexes FROM threat_intel

      FROM zeek_http WHERE user_agent MATCHES /(iPhone|iPad|Android|Mobile)/

      WHERE method IN (GET,POST) AND uri MATCHES ANY(exploit_kit_uri_regexes)

      ELEVATE IF referer IS NULL AND uri MATCHES /\.(js|apk)(\?|$)/

      EMIT ALERT severity=critical WITH uid src_ip host uri referer user_agent'
- question: Does a request's URI anomaly score - derived from path depth, query-parameter count, and query-string
    entropy baselined per domain - exceed 5.0 (or the 99th percentile of benign URIs), especially for
    a newly observed domain?
  context: 'Exploit-kit and payload-delivery URIs frequently have abnormal structure: unusual path depth,
    many query parameters, or high query-string entropy compared with the legitimate URIs a domain normally
    serves. Baseline URI path depth, query-parameter count, and query-string entropy per domain using
    established lexical-feature families, compute a URI anomaly score, and alert when it exceeds 5.0 -
    deriving the threshold from the 99th percentile of benign URIs in your own logs. Pay particular attention
    to newly observed domains, where any structural anomaly is more suspicious. A high score on a mobile
    request flags a URI that does not match normal traffic to that domain; corroborate with referer, domain
    age, and the exploit-kit regex method above to raise confidence.'
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM zeek_http WHERE is_mobile_device(src_ip)

      FEATURES = [path_depth(uri), query_param_count(uri), query_entropy(uri)]

      BASELINE per host

      score = uri_anomaly(FEATURES)

      WHERE score > 5.0   # or pctl(benign_uri_scores,99)

      BOOST IF host IN newly_observed_domains

      EMIT ALERT WITH uid src_ip host uri score'
- question: Did a device produce a burst of 404/403/blocked responses to referer-less script/binary fetches
    over a 10-minute window, exceeding 3 standard deviations above baseline (version-probing/fingerprinting
    that fails before successful delivery)?
  context: Before a successful exploit, kits often probe the browser/OS version and serve payloads conditionally,
    generating a burst of failed fetches (404/403/blocked) for scripts or binaries requested without a
    referer. Track per-device counts of such failed script/binary fetches over 10-minute windows and alert
    when the count exceeds 3 standard deviations above baseline. This failure-mode signal reveals exploit-kit
    fingerprinting activity even when the eventual delivery is missed or blocked. A positive result focuses
    the analyst on a device and time window worth deep inspection; correlate with any successful fetch,
    anomalous file, or process behavior that follows.
  answer_sources: *id004
  range: Last 90 days; evaluate in rolling 10-minute windows per device
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_http WHERE is_mobile_device(src_ip)\nDEFINE failed_fetch = status_code IN (404,403)\
      \ OR blocked\n        AND uri MATCHES /\\.(js|apk|bin)(\\?|$)/ AND referer IS NULL\nBIN window=10m\
      \ BY src_ip\nAGG cnt = count(failed_fetch)\nBASELINE mean,std per src_ip\nWHERE cnt > mean + 3*std\n\
      EMIT ALERT WITH src_ip window cnt"
- question: When scored by a Random Forest over URL features (length, path depth, query-parameter count,
    query entropy, TLD reputation, sensitive-keyword presence, hex ratio) plus a char+word CNN (URLNet),
    does any mobile-requested URL exceed a malicious score of 0.90?
  context: This supervised method catches malicious URLs that no single rule or threshold flags by combining
    many URL features into one classifier. Train a Random Forest on URL features - length, path depth,
    query-parameter count, query entropy, TLD reputation, sensitive-keyword presence, and hex ratio -
    and layer a character+word CNN (URLNet) for first-party scoring without external lookups. Alert when
    the score exceeds 0.90 and surface the top-3 contributing URL tokens/features in the alert so triage
    is fast. A high score on a URL requested by a mobile device - especially one fetched referer-less
    or behind a suspicious redirect - strongly supports exploit-kit delivery; review the contributing
    features and pivot to the response content and host telemetry.
  answer_sources: *id004
  range: Last 90 days
  queries:
