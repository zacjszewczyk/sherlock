name: 'T1437: Application Layer Protocol'
id: 34991f5a-68bf-4665-bed4-ebd88a687c74
description: Investigate adversary use of standard application-layer protocols (HTTP/S, WebSocket, DNS,
  and mail protocols) for command and control on enterprise mobile devices (Android, iOS) under T1437
  Application Layer Protocol. Adversaries blend C2 traffic with legitimate-looking application traffic
  to evade network filtering and detection, embedding tasking and results inside protocol fields. This
  playbook helps an analyst hunt for HTTP/S beaconing (highly periodic intervals, uniform small payloads,
  low URI-path diversity), DNS-based C2 channels (high query volume to a single parent domain, high-entropy
  subdomains, TXT/CNAME-heavy traffic, oversized TXT responses, and elevated NXDOMAIN/resolution-failure
  rates), and anomalous or malicious client signatures (User-Agent, JA3/JA3S, and JA4+ fingerprints that
  match threat intelligence or are statistically rare across the mobile fleet). It combines threat-intel
  signature matching, statistical baselining of cadence/volume/failure ratios, and unsupervised/interpretable
  machine learning, drawing on Zeek network telemetry (conn, http, ssl, dns, ja4) and mobile EDR/MDM context.
  The guidance targets a sophisticated external actor establishing covert C2 over legitimate protocols
  and out-of-band networks (cellular, public Wi-Fi), while remaining realistic for commodity mobile malware
  and insider misuse, and supports TA0037 Command and Control.
type: technique
related:
- tactic_id: TA0037
  tactic_name: Command and Control
