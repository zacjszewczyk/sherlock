questions:
- question: Are any mobile devices contacting destinations, domains, or URIs in Zeek conn.log/http.log
    that match a threat-intelligence feed of known C2 indicators, or matching regex content signatures
    for malleable HTTP C2 (suspicious URI path patterns, anomalous header ordering, or known-bad User-Agent
    strings)?
  context: 'Continuously match destination IPs, domains, and URIs observed from mobile-device traffic
    against a curated threat-intelligence feed of known C2 indicators, and apply regex content signatures
    for malleable HTTP C2 such as Cobalt Strike profile artifacts (characteristic URI path templates,
    abnormal HTTP header ordering, and suspect User-Agent strings per Unit 42''s malleable C2 research).
    A positive match against a known indicator or signature is a high-confidence lead that the device
    is communicating with adversary infrastructure over HTTP, while a negative result pushes the analyst
    toward the behavioral and statistical methods in this playbook. This is the fastest, lowest-cost coverage
    for established tooling and should run continuously alongside anomaly detection for novel tradecraft.
    Tie findings to TA0037 Command and Control: adversaries favor application-layer protocols like HTTP
    because they blend with ordinary mobile web traffic and pass through enterprise egress controls, hiding
    tasking inside legitimate-looking sessions.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network egress points, Corporate Wi-Fi infrastructure, VPN concentrators, Mobile Device Management
    (MDM) platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      MATCH conn.log/http.log WHERE src_ip IN mobile_fleet
        AND (dst_ip IN ti_c2_ips OR domain IN ti_c2_domains OR uri IN ti_c2_uris
             OR uri REGEX malleable_c2_uri_patterns OR user_agent REGEX bad_ua_patterns
             OR header_order MATCHES anomalous_template)
      ALERT with matched_indicator, src_ip, dst, uri, user_agent
- question: For each mobile source, do connections to a single destination exhibit beacon-like periodicity
    (inter-arrival coefficient of variation below 0.2) with uniform small payloads (originator/responder
    byte standard deviation below 100), or a dominant FFT period exceeding the per-app baseline?
  context: 'For each mobile source IP, group connections by destination over a rolling 1-hour window and
    compute the coefficient of variation (CV) of inter-arrival times and the standard deviation of originator/responder
    payload sizes from Zeek conn.log; corroborate jittered cadence using autocorrelation and FFT power-spectrum
    analysis (as in BAYWATCH and RITA''s regularity/data-size/FFT scoring). Alert when the timing CV is
    below 0.2 AND payload standard deviation is below 100 bytes (volume signal), or when the FFT reveals
    a dominant period whose connection frequency exceeds the per-app baseline (frequency signal). Deterministic,
    low-variance timing with uniform small payloads is the hallmark of automated C2 polling/keepalive
    rather than human-driven app usage. Tune thresholds against benign periodic services (NTP, CDN refresh,
    push notifications) using baseline cadence models to limit false positives. Tie findings to TA0037
    Command and Control: periodic check-ins over HTTP let the implant receive tasking on a schedule while
    masquerading as routine app traffic.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network egress points, Corporate Wi-Fi infrastructure, VPN concentrators, Mobile Device Management
    (MDM) platforms'
  range: Last 90 days; evaluate over rolling 1-hour windows and correlate across the day
  queries:
  - technology: Zeek/Stats pseudocode
    query: |-
      FOR each src_ip IN mobile_fleet, dst, 1h_window:
        iat_cv = cv(inter_arrival_times)
        payload_std = stddev(orig_bytes, resp_bytes)
        fft_peak, fft_period = power_spectrum(connection_times)
      ALERT where (iat_cv < 0.2 AND payload_std < 100)
         OR (fft_peak dominant AND freq > per_app_baseline)
      OUTPUT src_ip, dst, iat_cv, payload_std, fft_period
- question: For each mobile source-destination pair, is the ratio of failed/reset/blocked connections
    (conn_state S0/REJ/RSTO) and HTTP 4xx/5xx responses elevated beyond the fleet 3-sigma baseline while
    inter-arrival CV stays low, consistent with beacon polling of a sinkholed or rotating C2?
  context: 'For each mobile (src,dst) pair, compute the ratio of failed, reset, or blocked connections
    (Zeek conn_state values S0/REJ/RSTO) and HTTP 4xx/5xx responses to total attempts over a rolling window.
    A beacon polling a sinkholed, taken-down, or rotating C2 endpoint produces repeated low-volume failures
    at regular intervals; alert when the failure ratio exceeds the fleet 3-sigma baseline AND inter-arrival
    CV remains low, which distinguishes dead-drop or rendezvous polling from normal app retry behavior
    (which is usually bursty and irregular). A positive result suggests an implant repeatedly attempting
    to reach unavailable infrastructure on a schedule; a negative result indicates connection outcomes
    are within expected variance. Tie findings to TA0037 Command and Control: persistent regular failures
    reveal automated C2 retry loops even when the controller is temporarily unreachable.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network egress points, Corporate Wi-Fi infrastructure, VPN concentrators, Mobile Device Management
    (MDM) platforms'
  range: Last 90 days; rolling window with fleet baseline
  queries:
  - technology: Zeek/Stats pseudocode
    query: |-
      FOR each (src_ip,dst) IN mobile_fleet, rolling_window:
        fail_ratio = count(conn_state IN [S0,REJ,RSTO] OR http_status IN [4xx,5xx]) / total_attempts
        iat_cv = cv(inter_arrival_times)
      baseline = fleet_mean_std(fail_ratio)
      ALERT where fail_ratio > baseline.mean + 3*baseline.std AND iat_cv < 0.2
- question: Do unsupervised models (DBSCAN clustering plus an autoencoder ensemble such as Kitsune/KitNET)
    surface small dense outlier clusters or high reconstruction-error mobile flows, with the top-3 contributing
    features exposed for triage?
  context: 'Apply DBSCAN clustering to mobile-device traffic using features from Zeek logs (destination
    port, protocol, inter-arrival time variance, payload size statistics, byte ratios, and URI diversity),
    and in parallel run an unsupervised autoencoder ensemble (Kitsune/KitNET) over incremental stream
    statistics to flag reconstruction-error spikes. Investigate small, dense outlier clusters and high-error
    flows: these represent behavior that deviates from the bulk of benign mobile traffic without relying
    on signatures, catching novel C2 frameworks. Every alert must surface the top-3 contributing features
    (e.g., interval CV, payload std-dev, byte ratio) so analysts can quickly judge whether the anomaly
    is beacon-like or benign-but-rare, supporting defensible escalation. Tie findings to TA0037 Command
    and Control: ML anomaly detection generalizes beyond known indicators to expose unfamiliar application-layer
    C2 that blends with normal traffic.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network egress points, Corporate Wi-Fi infrastructure, VPN concentrators, Mobile Device Management
    (MDM) platforms'
  range: Last 90 days; retrain/update on rolling baseline
  queries:
  - technology: ML pipeline pseudocode
    query: |-
      X = features(conn.log,http.log,ssl.log: dst_port, proto, iat_var, payload_stats, byte_ratio, uri_diversity)
      clusters = DBSCAN(X)
      ae_score = kitnet_ensemble(stream_stats(X))
      anomalies = small_dense_clusters(clusters) UNION high_error_flows(ae_score)
      explain = top3_features(anomalies)
      ALERT on anomalies; OUTPUT src_ip, dst, explain
- question: Are any mobile-device DNS queries matching threat-intel DGA/tunnel domains, or structurally
    suspicious (TXT/NULL/CNAME-heavy traffic to a single parent domain, oversized TXT responses over 512
    bytes, or labels exceeding RFC length norms)?
  context: 'Scan the query field in Zeek dns.log in real time against threat-intelligence DGA/tunnel domains
    and apply structural rules (per MITRE DET0400): flag TXT/NULL/CNAME-heavy traffic concentrated on
    a single parent domain, oversized TXT responses exceeding 512 bytes, and labels that exceed RFC length
    norms. Generate a high-severity alert for any match originating from a mobile device IP. This gives
    immediate coverage of known tunneling infrastructure and the overt structural artifacts of DNS C2
    encoding. A positive hit is strong evidence of a DNS covert channel or DGA rendezvous; a negative
    result steers the analyst to the statistical and ML methods that catch novel tunnels. Tie findings
    to TA0037 Command and Control: DNS is rarely blocked and often permitted before authentication, making
    it an attractive carrier for tasking and data on mobile networks.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: Internal DNS resolvers, DNS forwarders, Network egress points, Corporate Wi-Fi infrastructure'
  range: Last 90 days; real-time matching
  queries:
  - technology: Zeek/Rule pseudocode
    query: |-
      ALERT FROM dns.log WHERE src_ip IN mobile_fleet
        AND (query IN ti_dga_tunnel_domains
             OR (rrtype IN [TXT,NULL,CNAME] AND concentrated_single_parent_domain)
             OR txt_response_bytes > 512
             OR max_label_len > rfc_norm)
      OUTPUT src_ip, query, rrtype, parent_domain, txt_response_bytes
- question: For each mobile source, do DNS subdomain labels show high Shannon entropy (99th percentile
    or absolute >4.5) and a TXT:A query ratio beyond 3-sigma per parent domain, after suppressing popular
    benign domains?
  context: 'For each mobile source IP over a rolling 1-hour window compute: (a) Shannon entropy of subdomain
    labels, (b) the TXT:A query ratio per parent domain, (c) unique-subdomain count and per-domain compressed
    information content (per Paxson et al.), and (d) streaming per-domain lexical aggregates (per Nadler
    et al.). Alert when entropy exceeds the 99th percentile (or absolute 4.5) AND the TXT:A ratio exceeds
    a 3-sigma deviation. High-entropy labels indicate encoded payloads rather than human-readable hostnames,
    and an abnormal TXT:A ratio reveals abuse of record types favored for data carriage. Incorporate domain
    prevalence/TTL/answer-dynamism scoring (EXPOSURE) to suppress popular benign domains and reduce false
    positives. Tie findings to TA0037 Command and Control: encoding command and data into DNS labels lets
    adversaries tunnel C2 through resolvers that the enterprise must allow.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: Internal DNS resolvers, DNS forwarders, Network egress points, Corporate Wi-Fi infrastructure'
  range: Last 90 days; rolling 1-hour windows
  queries:
  - technology: Zeek/Stats pseudocode
    query: |-
      FOR each src_ip IN mobile_fleet, parent_domain, 1h_window:
        entropy = shannon(subdomain_labels)
        txt_a_ratio = count(TXT)/count(A)
        uniq_sub = distinct(subdomains); info = compressed_info(subdomains)
      suppress popular_benign(EXPOSURE prevalence/ttl)
      ALERT where entropy >= max(p99, 4.5) AND txt_a_ratio > mean + 3*std
- question: Is any mobile device's NXDOMAIN/SERVFAIL/resolution-failure rate (or bursts to a single parent
    domain) exceeding the fleet 3-sigma baseline, especially concurrent with high-entropy queries?
  context: 'Track per-device NXDOMAIN, SERVFAIL, and resolution-failure rates and bursts to single parent
    domains over time. DGA-based C2 rendezvous and some DNS tunnels generate elevated NXDOMAIN ratios
    because the implant cycles through many non-existent candidate domains or error-channel lookups; alert
    when a device''s NXDOMAIN rate exceeds the fleet 3-sigma baseline, and escalate when this is concurrent
    with high-entropy queries (per the failure-aware guidance in MITRE DET0400). A positive result suggests
    algorithmic domain generation or error-channel tunneling; a negative result indicates resolution outcomes
    are within normal variance. Tie findings to TA0037 Command and Control: failed-resolution patterns
    expose C2 rendezvous attempts even when the active controller domain is not yet known.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: Internal DNS resolvers, DNS forwarders, Network egress points, Corporate Wi-Fi infrastructure'
  range: Last 90 days; track over time with fleet baseline
  queries:
  - technology: Zeek/Stats pseudocode
    query: |-
      FOR each src_ip IN mobile_fleet, time_window:
        nx_rate = count(rcode IN [NXDOMAIN,SERVFAIL]) / total_queries
        high_entropy_present = any(shannon(subdomain) > 4.5)
      baseline = fleet_mean_std(nx_rate)
      ALERT where nx_rate > baseline.mean + 3*baseline.std
        ESCALATE if high_entropy_present
- question: Do interpretable ML classifiers (decision tree, Isolation Forest, character-level CNN + random-forest
    ensemble) flag live mobile DNS as tunneling, with the top-3 contributing features surfaced per alert?
  context: 'Train interpretable classifiers on labeled benign vs. tunneling DNS: a J48/decision-tree (EXPOSURE),
    an Isolation Forest on stateless per-domain features (Nadler et al.), and a character-level CNN +
    random-forest ensemble (Lambion et al.). Engineer features including query length, subdomain entropy,
    numeric:alpha ratio, query type, and TXT response size. Deploy the models to score live mobile DNS
    and surface the top-3 contributing features in each alert for explainability. This combination of
    supervised and unsupervised models catches both known tunnel families and novel encodings that static
    rules miss, while keeping detections defensible and triage-friendly. A high-confidence classification
    with consistent driving features warrants escalation; a low score with benign features supports closure.
    Tie findings to TA0037 Command and Control: ML on DNS structure detects covert channels that blend
    with the heavy, ubiquitous DNS traffic mobile devices generate.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: Internal DNS resolvers, DNS forwarders, Network egress points, Corporate Wi-Fi infrastructure'
  range: Last 90 days; score live traffic, retrain periodically
  queries:
  - technology: ML pipeline pseudocode
    query: |-
      features = [query_len, subdomain_entropy, numeric_alpha_ratio, rrtype, txt_resp_size]
      dt = decision_tree.predict(features)
      iforest = isolation_forest.score(features)
      cnn_rf = charcnn_rf_ensemble.predict(features)
      explain = top3_features(features)
      ALERT where dt==tunnel OR iforest anomalous OR cnn_rf==tunnel
      OUTPUT src_ip, parent_domain, explain
- question: Do any outbound HTTP/S connections from mobile devices present a User-Agent, JA3/JA3S, or
    JA4+ client signature that exactly matches threat intelligence for known mobile malware or C2 frameworks?
  context: 'Continuously scan Zeek http.log (user_agent), ssl.log (ja3, ja3s), and ja4.log (ja4_hash)
    against threat-intel signatures for known mobile malware and C2 frameworks, using JA3 (Salesforce),
    the version-resilient JA4+ suite (FoxIO), and malleable-profile header/UA regex (Unit 42). Generate
    an immediate alert on any exact match from a mobile device IP. Client fingerprints capture how the
    TLS stack or HTTP client is implemented, so a match to a known-bad framework identifies the C2 tooling
    even when destination infrastructure is fresh. A positive hit is high-confidence; a negative result
    directs the analyst to the rarity-based statistical method. Tie findings to TA0037 Command and Control:
    distinctive client signatures betray malicious implants that otherwise hide inside legitimate-looking
    HTTPS sessions.'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek ja4.log
  - 'NAI: Web Application Firewalls (WAFs), Reverse proxies, Internet gateways, MDM/UEM platforms for
    device context'
  range: Last 90 days; real-time matching
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      ALERT FROM http.log,ssl.log,ja4.log WHERE src_ip IN mobile_fleet
        AND (user_agent IN ti_bad_ua OR user_agent REGEX malleable_ua
             OR ja3 IN ti_bad_ja3 OR ja3s IN ti_bad_ja3s
             OR ja4_hash IN ti_bad_ja4)
      OUTPUT src_ip, dst, user_agent, ja3, ja4_hash, matched_signature
- question: Which mobile connections use a User-Agent, JA3, or JA4+ signature with prevalence below 0.1%
    across the fleet over a rolling 30-day window, especially toward rare or dynamic destinations?
  context: 'Compute a frequency distribution of all User-Agent strings, JA3 hashes, and JA4+ hashes over
    a rolling 30-day fleet window and alert on any connection using a signature with prevalence below
    0.1% as a rare client requiring investigation. Rare fingerprints can indicate a bespoke implant or
    repackaged app whose client stack differs from the standardized browsers and apps across a managed
    mobile fleet. Prefer JA4+ over JA3 because TLS extension randomization degrades JA3 stability (FoxIO),
    and correlate rare fingerprints with destination prevalence/dynamism (EXPOSURE) to prioritize those
    reaching unusual infrastructure. A rare signature toward a rare destination is high-signal; a rare-but-benign
    client (e.g., a niche updated app) can be baselined out. Tie findings to TA0037 Command and Control:
    statistically rare clients surface novel C2 tooling that has no threat-intel signature yet.'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek ja4.log
  - 'NAI: Web Application Firewalls (WAFs), Reverse proxies, Internet gateways, MDM/UEM platforms for
    device context'
  range: Last 30 days for fleet prevalence; investigate over Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      fleet = frequency_distribution([user_agent, ja3, ja4_hash], window=30d)
      FOR each connection IN mobile_fleet:
        prev = fleet.prevalence(signature)
        dst_prev = destination_prevalence(dst)
      ALERT where prev < 0.001
        PRIORITIZE where dst_prev low OR dst dynamic
      OUTPUT src_ip, dst, signature, prev
- question: Do an Isolation Forest on client signatures, a CorrNetDroid-style app-flow model, and Kitsune/KitNET
    gateway anomaly scoring flag high-anomaly mobile connections, with the top-3 contributing features
    surfaced?
  context: 'Deploy an Isolation Forest trained on benign mobile client signatures (features: UA length/token
    count, JA3/JA4 TLS version, cipher-suite/extension categories). In parallel, model app network-flow
    features (byte/packet counts, durations, protocol mix) using the correlation-selected minimal feature
    set of CorrNetDroid (trained/validated on CICAndMal2017), and run Kitsune/KitNET for unsupervised
    gateway-side anomaly scoring. Flag high-anomaly connections and surface the top-3 contributing features
    in alert text for explainability. This layered ML approach catches anomalous TLS/HTTP client behavior
    and anomalous flow shapes that neither signature matching nor simple rarity counting would reveal,
    while keeping each detection interpretable for analyst triage. A high anomaly score with C2-consistent
    features warrants escalation; a high score driven by benign app-update behavior can be tuned out.
    Tie findings to TA0037 Command and Control: modeling both client fingerprints and flow behavior exposes
    implants that imitate legitimate apps at the protocol level.'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek ja4.log
  - 'NAI: Web Application Firewalls (WAFs), Reverse proxies, Internet gateways, MDM/UEM platforms for
    device context'
  range: Last 90 days; retrain on rolling benign baseline
  queries:
  - technology: ML pipeline pseudocode
    query: |-
      sig_feat = [ua_len, ua_tokens, tls_version, cipher_cat, ext_cat]
      flow_feat = corrnetdroid_features(byte_counts, pkt_counts, durations, proto_mix)
      if_score = isolation_forest(sig_feat)
      flow_score = corrnetdroid_model(flow_feat)
      ae_score = kitnet(gateway_stream_stats)
      explain = top3_features(if_score, flow_score, ae_score)
      ALERT where any score high; OUTPUT src_ip, dst, explain
